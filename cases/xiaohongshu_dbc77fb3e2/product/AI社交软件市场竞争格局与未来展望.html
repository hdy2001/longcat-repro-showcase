#pagenav .sep{width:1px;height:15px;background:#E2E2E5;margin:0 9px}
#stage{position:fixed;inset:108px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#slideBox{transform-origin:center center;flex:none}

.acc{border-top:3px solid #C8102E}

.hb .l{font-size:11.5px;color:#555}

.arr{color:#C8102E;font-weight:800;font-size:15px;flex:none}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ring span{position:absolute;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.ring b{font-size:13.5px;color:#960C22;font-weight:800}
.ring i{font-size:8.5px;color:#999;font-style:normal}
.foot-note{font-size:10.5px;color:#9a9a9a;line-height:1.5;border-left:3px solid #F0C3CB;padding-left:10px}

.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

.v-luna .bd{display:flex;flex-direction:column;gap:24px;padding:4px 2px}

.ln li{padding-left:15px;position:relative}
.ln li::before{content:"▪";position:absolute;left:0;color:#C8102E}
.ln b{color:#C8102E}
.ln .brow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px;color:#555}

.ln .fl{display:block;height:100%;background:#C8102E}
.ln .fl2{display:block;height:100%;background:#E9A6B0}
.ln .plain-line{font-size:13.5px;color:#3a3a3a;line-height:1.8}

.cov .mod .mq{font-size:10.8px;color:#555;line-height:1.5;margin-top:5px}
.cov .cfoot{margin-top:18px;font-size:10.5px;color:#a2a2a2;display:flex;justify-content:space-between}

/* ================= 桥型图：缆索1-2px细线 + 桥塔 + 吊杆 ================= */
function bridge(o){
  const {w=560,h=258,nodes,tx1,tx2,detail=true}=o;
  const deckY=h-50, topY=56, mid=(tx1+tx2)/2, half=(tx2-tx1)/2, sagY=deckY-42;
  const cy=x=>topY+(sagY-topY)*Math.pow((x-mid)/half,2);
  const cable=`M7,${deckY+5} C${tx1-95},${deckY+3} ${tx1-28},${topY} ${tx1},${topY} Q${mid},${(2*sagY-topY).toFixed(1)} ${tx2},${topY} C${tx2+28},${topY} ${tx2+95},${deckY+3} ${w-7},${deckY+5}`;
  let hangers='',circles='',labels='',towers='';
  nodes.forEach((nd,i)=>{
    const x=nd.x, y=cy(x);
    hangers+=`<line x1="${x}" y1="${y.toFixed(1)}" x2="${x}" y2="${deckY+3}" stroke="#C8102E" stroke-width="${detail?1.2:1.6}"/>`;
    circles+=`<circle cx="${x}" cy="${deckY+10}" r="${detail?18:17}" fill="#fff" stroke="#C8102E" stroke-width="1.6"/><g transform="translate(${x-8},${deckY+2})" color="#C8102E">${ic(nd.icon,16)}</g>`;
    const lines=nd.t.split('/');
    lines.forEach((ln2,k)=>{
      labels+=`<text x="${x}" y="${deckY+36+k*12}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#444">${ln2}</text>`;
    });
  });
  [tx1,tx2].forEach(x=>{
    towers+=`<g stroke="#3a3a3a" fill="none" stroke-linecap="round"><line x1="${x}" y1="${topY}" x2="${x}" y2="${deckY+14}" stroke-width="6"/>${detail?`<line x1="${x-10}" y1="${(topY+deckY)/2-16}" x2="${x+10}" y2="${(topY+deckY)/2+16}" stroke-width="2"/><line x1="${x-10}" y1="${(topY+deckY)/2+16}" x2="${x+10}" y2="${(topY+deckY)/2-16}" stroke-width="2"/>`:''}<line x1="${x-7}" y1="${topY-15}" x2="${x+7}" y2="${topY-15}" stroke-width="2.5"/></g><circle cx="${x}" cy="${topY-19}" r="3.5" fill="#C8102E"/>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin:0 auto">
    <rect x="7" y="${deckY+4}" width="${w-14}" height="10" rx="2" fill="#3a3a3a"/>
    <rect x="1" y="${deckY+2}" width="12" height="14" rx="2" fill="#dcdcdc" stroke="#c2c2c2"/>
    <rect x="${w-13}" y="${deckY+2}" width="12" height="14" rx="2" fill="#dcdcdc" stroke="#c2c2c2"/>
    ${towers}${hangers}<path d="${cable}" fill="none" stroke="#C8102E" stroke-width="${detail?1.6:2}"/>${circles}${labels}
  </svg>`;
}

const PALS=[['#E9A3AF','#DB6B7E','#CD3F58','#C8102E','#960C2C'],['#EFC0C9','#DD8896','#C8102E'],['#EFC0C9','#DD8896','#C8102E','#960C2C']];
function pyr(layers,pi=0,W=380,rh=36,gap=6){
  const pal=PALS[pi], n=layers.length, totalH=n*rh+(n-1)*gap;
  let out='',y=0;
  layers.forEach((L,i)=>{
    const lw=W*Math.pow(0.6,i);
    const x=(W-lw)/2, c=pal[Math.min(i,pal.length-1)];
    out+=`<rect x="${x.toFixed(1)}" y="${y}" width="${lw.toFixed(1)}" height="${rh}" fill="${c}" rx="3"/>`;
    out+=`<text x="${W/2}" y="${y+15}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${i+1} · ${L.t}</text>`;
    if(lw>170&&L.s){out+=`<text x="${W/2}" y="${y+28}" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,.85)">${L.s}</text>`;}
    y+=rh+gap;
  });
  return {svg:`<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" style="display:block">${out}</svg>`,h:totalH};
}

/* ================= 应用逻辑 ================= */
const VIEWS={
  sol:{pages:SOL,labels:['市场概况','中国路线','海外控制点','未来展望']},
  terra:{pages:TERRA,labels:['市场概况','中国路线','海外控制点','未来展望']},
  luna:{pages:LUNA,labels:['市场概况','中国路线','海外控制点','未来展望']},
  astra:{pages:ASTRA,labels:['市场概况','中国路线','海外控制点','未来展望']},
};
let cur='cov', pg=0;
const slideBox=document.getElementById('slideBox');
const pagenav=document.getElementById('pagenav');
function fit(){
  const st=document.getElementById('stage');
  const s=Math.min((st.clientWidth-48)/1280,(st.clientHeight-36)/720);
  slideBox.style.transform=`scale(${s})`;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    const v=b.dataset.v;
    b.classList.toggle('on',(v===cur)||(cur==='cov'&&v==='cov'));
  });
  if(cur==='cov'){slideBox.innerHTML=COV;pagenav.style.display='none';}
  else if(cur==='cmp'){slideBox.innerHTML=CMP;pagenav.style.display='none';}
  else{
    const V=VIEWS[cur];
    slideBox.innerHTML=V.pages[pg];
    pagenav.style.display='flex';
    let html='<span class="lbl">页面</span>';
    V.pages.forEach((_,i)=>{
      html+=`<button data-p="${i}" class="${i===pg?'on':''}">0${i+1}</button>`;
      if(i<V.pages.length-1)html+='<span class="sep"></span>';
    });
    html+='<span class="lbl" style="margin-left:14px">版本</span>';
    V.labels.forEach((l,i)=>html+=`<button data-p="${i}" class="${i===pg?'on':''}" style="color:#bbb">${l}</button>`);
    pagenav.innerHTML=html;
  }
  fit();
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  cur=b.dataset.v;pg=0;render();
});
pagenav.addEventListener('click',e=>{
  const b=e.target.closest('button[data-p]');if(!b)return;
  pg=+b.dataset.p;render();
});
window.addEventListener('resize',fit);
render();
</script>
