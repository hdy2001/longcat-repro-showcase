<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Marble · Procedural Planet</title>
<style>
  :root {
    --accent: #4cc9f0;
    --panel-bg: rgba(9, 14, 26, 0.74);
    --panel-border: rgba(120, 180, 255, 0.16);
    --text: #dce8f6;
    --text-dim: #8ba1bd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  body {
    background: #04060d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  #panel {
    position: fixed; top: 16px; left: 16px; width: 308px; max-height: calc(100% - 32px);
    overflow-y: auto; padding: 18px 18px 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    scrollbar-width: thin;
    scrollbar-color: rgba(120,180,255,.25) transparent;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(120,180,255,.25); border-radius: 3px; }

  h1 {
    margin: 0; font-size: 15px; font-weight: 700;
    letter-spacing: 2.5px; text-transform: uppercase;
    background: linear-gradient(90deg, #8fd8ff, #4cc9f0 55%, #7a9bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 4px 0 14px; font-size: 11px; color: var(--text-dim); letter-spacing: 0.4px; }

  button { font-family: inherit; }

  #regen {
    width: 100%; padding: 10px 12px; margin-bottom: 4px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    color: #06222e; background: linear-gradient(135deg, #6fdcff, #38b6e8);
    border: none; border-radius: 11px; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    box-shadow: 0 4px 16px rgba(76, 201, 240, 0.28);
  }
  #regen:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(76,201,240,.4); }
  #regen:active { transform: translateY(0) scale(0.98); }
  .seed { display: block; margin: 2px 0 14px; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #66788f; text-align: center; }

  .label { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-dim); margin: 14px 0 8px; }

  #modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #modes button {
    padding: 8px 4px; font-size: 11.5px; font-weight: 600;
    color: var(--text-dim); background: rgba(120, 170, 255, 0.07);
    border: 1px solid rgba(120, 180, 255, 0.12); border-radius: 9px; cursor: pointer;
    transition: all 0.15s ease;
  }
  #modes button:hover { color: var(--text); background: rgba(120, 170, 255, 0.14); }
  #modes button.active {
    color: #06222e; background: linear-gradient(135deg, #7fdcff, #45bdf0);
    border-color: transparent; box-shadow: 0 3px 12px rgba(76, 201, 240, 0.3);
  }

  #modeInfo {
    margin: 9px 2px 0; font-size: 10.5px; line-height: 1.45; color: #93a8c2; min-height: 30px;
  }

  .slider-row { margin-bottom: 12px; }
  .slider-row .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .slider-row .name { font-size: 12px; font-weight: 600; color: var(--text); }
  .slider-row .val { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  input[type="range"] {
    width: 100%; height: 4px; margin: 0; appearance: none; -webkit-appearance: none;
    background: linear-gradient(90deg, rgba(76,201,240,.55), rgba(76,201,240,.15));
    border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: #eaf7ff; border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(76, 201, 240, 0.55); cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #eaf7ff; border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(76, 201, 240, 0.55); cursor: pointer;
  }

  .toggles { display: flex; gap: 7px; }
  .toggles label {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 2px; font-size: 10.5px; font-weight: 600; color: var(--text-dim);
    background: rgba(120, 170, 255, 0.07); border: 1px solid rgba(120, 180, 255, 0.12);
    border-radius: 9px; cursor: pointer; user-select: none; transition: all 0.15s ease;
  }
  .toggles label:hover { color: var(--text); }
  .toggles input { display: none; }
  .toggles input:checked + span { color: var(--accent); }
  .toggles label:has(input:checked) {
    color: var(--accent); background: rgba(76, 201, 240, 0.12);
    border-color: rgba(76, 201, 240, 0.4); box-shadow: inset 0 0 12px rgba(76, 201, 240, 0.08);
  }

  #legend { display: none; margin-top: 12px; }
  #legend.show { display: block; }
  #legend .bar { height: 9px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); }
  #legend.temp .bar { background: linear-gradient(90deg, #0d178c, #0d8cd9, #26bf59, #f2d926, #e62614); }
  #legend.hum .bar { background: linear-gradient(90deg, #c79e61, #d9b868, #8cb34d, #268c4d, #0d6699); }
  #legend .ends { display: flex; justify-content: space-between; margin-top: 4px; font-size: 9.5px; color: var(--text-dim); }

  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.4px; color: #61748c;
    background: rgba(9, 14, 26, 0.55); padding: 6px 14px; border-radius: 20px;
    border: 1px solid rgba(120, 180, 255, 0.08); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none;
  }

  #nogl {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text-dim); text-align: center; padding: 24px;
  }

  @media (max-width: 620px) {
    #panel { width: calc(100% - 24px); left: 12px; top: 12px; max-height: 56%; padding: 14px; }
    #hint { font-size: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="panel">
  <h1>Blue Marble</h1>
  <div class="sub">Procedural planet &middot; Perlin-noise terrain</div>

  <button id="regen">&#10227;&nbsp; Regenerate planet</button>
  <span class="seed" id="seed">#0</span>

  <div class="label">Shading mode</div>
  <div id="modes">
    <button data-mode="0" class="active">Day</button>
    <button data-mode="1">Day&#8211;Night</button>
    <button data-mode="2">Temperature</button>
    <button data-mode="3">Humidity</button>
  </div>
  <div id="modeInfo"></div>

  <div id="legend">
    <div class="bar"></div>
    <div class="ends"><span id="legMin">Cold / Dry</span><span id="legMax">Hot / Wet</span></div>
  </div>

  <div class="label">Terrain</div>
  <div class="slider-row">
    <div class="top"><span class="name">Roughness</span><span class="val" id="roughVal">55%</span></div>
    <input type="range" id="rough" min="0" max="100" value="55">
  </div>
  <div class="slider-row">
    <div class="top"><span class="name">Sea level</span><span class="val" id="seaVal">58%</span></div>
    <input type="range" id="sea" min="30" max="75" value="58">
  </div>
  <div class="slider-row">
    <div class="top"><span class="name">Rotation speed</span><span class="val" id="rotVal">35%</span></div>
    <input type="range" id="rot" min="0" max="100" value="35">
  </div>

  <div class="label">Effects</div>
  <div class="toggles">
    <label><input type="checkbox" id="cycle" checked><span>Day&#8211;night cycle</span></label>
    <label><input type="checkbox" id="atmo" checked><span>Atmosphere</span></label>
    <label><input type="checkbox" id="spec" checked><span>Ocean glint</span></label>
  </div>
</div>

<div id="hint">drag to orbit &middot; scroll to zoom</div>
<div id="nogl">WebGL is not available in this browser,<br>so the planet cannot be rendered.</div>

<script>__THREE_JS__</script>
<script>__APP_JS__</script>
</body>
</html>
