<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佛光寺东大殿 · 木构交互拆解</title>
<style>
  :root{
    --ink:#2E4034;        /* 墨绿 */
    --red:#A83C28;        /* 朱红 */
    --gold:#B98A2F;       /* 金 */
    --paper:#EAE8E1;      /* 米灰 */
    --panel:rgba(247,245,240,.92);
    --line:#D8D4C8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;color:var(--ink);}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* ── 顶栏 ── */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
    gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);}
  #topbar .seal{width:34px;height:34px;background:var(--ink);color:#F2EFE6;display:flex;
    align-items:center;justify-content:center;font-size:20px;border-radius:4px;flex:none;}
  #topbar .brand{font-size:13px;letter-spacing:2px;color:#6A6A5E;}
  #topbar .brand b{color:var(--red);font-weight:600;}
  #topbar h1{font-size:20px;letter-spacing:4px;font-weight:700;white-space:nowrap;}
  #topbar .era{margin-left:auto;font-size:12px;color:#8A8578;letter-spacing:1px;text-align:right;line-height:1.5;}
  #topbar .era b{color:var(--ink);font-size:14px;}

  /* ── 左侧分层面板 ── */
  #layerPanel{position:fixed;left:14px;top:70px;z-index:15;width:196px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;backdrop-filter:blur(6px);
    max-height:calc(100% - 220px);overflow:auto;}
  #layerPanel h3{font-size:13px;letter-spacing:3px;color:var(--ink);border-bottom:1px solid var(--line);
    padding-bottom:6px;margin-bottom:8px;}
  #layerPanel h3 span{float:right;color:#9A958A;font-size:11px;letter-spacing:0;margin-top:2px;}
  .layer-item{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;cursor:pointer;
    border-radius:4px;user-select:none;}
  .layer-item:hover{background:rgba(168,60,40,.07);}
  .layer-item input{accent-color:var(--red);width:14px;height:14px;cursor:pointer;flex:none;}
  .layer-item .sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.15);}

  /* ── 右侧信息面板 ── */
  #infoPanel{position:fixed;right:14px;top:70px;z-index:15;width:250px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:14px 16px;backdrop-filter:blur(6px);
    max-height:calc(100% - 220px);overflow:auto;}
  #infoPanel h3{font-size:13px;letter-spacing:3px;color:var(--ink);border-bottom:1px solid var(--line);
    padding-bottom:6px;margin-bottom:10px;}
  #infoBody h2{font-size:19px;color:var(--red);letter-spacing:2px;margin-bottom:8px;line-height:1.4;}
  #infoBody .sub{font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:10px;}
  #infoBody p{font-size:13px;line-height:1.9;color:#4A4A40;text-align:justify;}
  #infoBody .hint{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
    font-size:11px;color:#9A958A;line-height:1.8;}

  /* ── 底部拆解控制 ── */
  #explodeBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:15;
    width:min(560px,72vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 18px 14px;backdrop-filter:blur(6px);text-align:center;}
  #explodeBar .cap{font-size:12px;letter-spacing:4px;color:var(--ink);margin-bottom:8px;}
  #explodeBar .cap b{color:var(--red);}
  #explodeRow{display:flex;align-items:center;gap:12px;}
  #explodeRow .lab{font-size:12px;color:#8A8578;flex:none;width:44px;}
  #explodeSlider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--red) 0%,var(--red) var(--fill,0%),#D8D4C8 var(--fill,0%));
    outline:none;cursor:pointer;}
  #explodeSlider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--red);border:3px solid #F5F2EA;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;}
  #explodeSlider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--red);
    border:3px solid #F5F2EA;cursor:pointer;}
  #explodeBtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .btn{font-family:inherit;font-size:12px;letter-spacing:2px;padding:5px 14px;border-radius:5px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:all .15s;}
  .btn:hover{background:var(--ink);color:#F2EFE6;}
  .btn.solid{background:var(--ink);color:#F2EFE6;}
  .btn.solid:hover{background:var(--red);border-color:var(--red);}

  /* ── 视角按钮 ── */
  #viewBar{position:fixed;right:14px;bottom:18px;z-index:15;display:flex;flex-direction:column;gap:6px;}
  #viewBar .btn{min-width:86px;}

  /* ── 开关 ── */
  #toggles{position:fixed;left:14px;bottom:18px;z-index:15;display:flex;flex-direction:column;gap:6px;}
  .tgl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;
    backdrop-filter:blur(6px);user-select:none;}
  .tgl input{accent-color:var(--red);width:14px;height:14px;cursor:pointer;}

  /* ── 3D 标签 ── */
  .lbl{background:rgba(46,64,52,.85);color:#F2EFE6;font-size:12px;letter-spacing:1px;
    padding:3px 9px;border-radius:4px;white-space:nowrap;pointer-events:none;
    border:1px solid rgba(242,239,230,.35);font-family:inherit;}
  .lbl::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:rgba(46,64,52,.85);border-bottom:0;}

  @media (max-width:900px){
    #layerPanel{width:150px;font-size:12px;}
    #infoPanel{width:200px;}
    #topbar h1{font-size:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<header id="topbar">
  <div class="seal">構</div>
  <div class="brand">中国古建 · 交互图志<br><b>木构图志</b> TIMBER ATLAS</div>
  <h1>佛光寺东大殿</h1>
  <div class="era"><b>唐 · 大中十一年（857）</b><br>面阔七间 · 进深四间 · 单檐庑殿顶</div>
</header>

<aside id="layerPanel">
  <h3>分层拆解 <span>勾选显示</span></h3>
  <div id="layerList"></div>
</aside>

<aside id="infoPanel">
  <h3>营造笔记</h3>
  <div id="infoBody"></div>
</aside>

<div id="explodeBar">
  <div class="cap">拆 开 · 看 懂 中 国 古 建 —— <b>拆解程度</b></div>
  <div id="explodeRow">
    <span class="lab">整体</span>
    <input type="range" id="explodeSlider" min="0" max="100" value="0">
    <span class="lab">分解</span>
  </div>
  <div id="explodeBtns">
    <button class="btn solid" id="btnAssemble">复 位</button>
    <button class="btn" id="btnHalf">半分解</button>
    <button class="btn" id="btnExplode">全分解</button>
  </div>
</div>

<div id="toggles">
  <label class="tgl"><input type="checkbox" id="tglLabels"> 构件标注</label>
  <label class="tgl"><input type="checkbox" id="tglGhost"> 屋面半透明</label>
  <label class="tgl"><input type="checkbox" id="tglSpin"> 自动旋转</label>
</div>

<div id="viewBar">
  <button class="btn solid" data-view="home">全 景</button>
  <button class="btn" data-view="frame">梁架内部</button>
  <button class="btn" data-view="dougong">斗拱细部</button>
  <button class="btn" data-view="top">俯 视</button>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ════════════════════════ 基础场景 ════════════════════════ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xEAE8E1);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(30, 14, 34);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * 0.495;

/* 灯光 */
scene.add(new THREE.HemisphereLight(0xF5F7FA, 0x8A8A80, 0.75));
const sun = new THREE.DirectionalLight(0xFFFFFF, 1.25);
sun.position.set(32, 42, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0008;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xDDE8FF, 0.35);
fill.position.set(-25, 14, -30);
scene.add(fill);

/* 地面 */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(90, 64),
  new THREE.MeshStandardMaterial({color:0xDCD8CC, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ════════════════════════ 材质 ════════════════════════ */
const M = {
  stone:  new THREE.MeshStandardMaterial({color:0xB5AFA2, roughness:.95}),
  plinth: new THREE.MeshStandardMaterial({color:0x8E8A7E, roughness:.9}),
  column: new THREE.MeshStandardMaterial({color:0x7A3B2C, roughness:.75}),
  wood:   new THREE.MeshStandardMaterial({color:0x6B4A33, roughness:.8}),
  woodD:  new THREE.MeshStandardMaterial({color:0x54382A, roughness:.85}),
  dg:     new THREE.MeshStandardMaterial({color:0xA83C28, roughness:.6}),   // 斗拱·朱红
  roof:   new THREE.MeshStandardMaterial({color:0x3A3F44, roughness:.9, side:THREE.DoubleSide}),
  ridge:  new THREE.MeshStandardMaterial({color:0x2F3338, roughness:.9}),
  chiwei: new THREE.MeshStandardMaterial({color:0x4E8D7C, roughness:.55}), // 鸱尾·青绿
  wall:   new THREE.MeshStandardMaterial({color:0xD3C29E, roughness:.95}),
  door:   new THREE.MeshStandardMaterial({color:0x4A3428, roughness:.8}),
  gold:   new THREE.MeshStandardMaterial({color:0xC9A227, roughness:.4, metalness:.5}),
  statue: new THREE.MeshStandardMaterial({color:0xB08D57, roughness:.7}),
};

/* 瓦垄纹理 */
function tileTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#33383E'; g.fillRect(0,0,512,512);
  for(let x=0; x<512; x+=32){                       // 垄（沿坡向）
    g.fillStyle = '#40464D'; g.fillRect(x, 0, 14, 512);
    g.fillStyle = '#272B30'; g.fillRect(x+14, 0, 5, 512);
    g.fillStyle = '#50565E'; g.fillRect(x+19, 0, 3, 512);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 5);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
M.roof.map = tileTexture();

/* 直棂窗纹理 */
function latticeTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 192;
  const g = c.getContext('2d');
  g.fillStyle = '#D3C29E'; g.fillRect(0,0,128,192);
  g.fillStyle = '#4A3428'; g.fillRect(0,0,128,10); g.fillRect(0,182,128,10);
  g.fillRect(0,0,10,192); g.fillRect(118,0,10,192);
  for(let x=18; x<120; x+=16){ g.fillStyle='#3A2A20'; g.fillRect(x, 12, 6, 168); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const latMat = new THREE.MeshStandardMaterial({map:latticeTexture(), roughness:.9});

/* 板门纹理 */
function doorTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#4A3428'; g.fillRect(0,0,128,256);
  for(let x=0; x<128; x+=22){ g.fillStyle='#3A281E'; g.fillRect(x,0,3,256); }
  g.fillStyle = '#8A6A2F';
  for(let r=0;r<4;r++) for(let col=0;col<3;col++){
    g.beginPath(); g.arc(24+col*38, 40+r*56, 5, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const doorMat = new THREE.MeshStandardMaterial({map:doorTexture(), roughness:.8});

/* ════════════════════════ 工具函数 ════════════════════════ */
const clickable = [];
function box(w,h,d, x,y,z, mat, name, group, rx=0,ry=0,rz=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = m.receiveShadow = true;
  m.userData.name = name;
  group.add(m); clickable.push(m);
  return m;
}
function cyl(rt,rb,h, x,y,z, mat, name, group, rx=0,ry=0,rz=0, seg=14){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = m.receiveShadow = true;
  m.userData.name = name;
  group.add(m); clickable.push(m);
  return m;
}
/* 两点之间的梁 */
function beam(p1, p2, w, h, mat, name, group){
  const dir = new THREE.Vector3().subVectors(p2,p1);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,len), mat);
  m.position.copy(p1).addScaledVector(dir, .5);
  m.lookAt(p2);
  m.castShadow = m.receiveShadow = true;
  m.userData.name = name;
  group.add(m); clickable.push(m);
  return m;
}

/* ════════════════════════ 分组（分层） ════════════════════════ */
const gBase     = new THREE.Group();   // 台基
const gColumns  = new THREE.Group();   // 柱网
const gLanE     = new THREE.Group();   // 阑额
const gDougong  = new THREE.Group();   // 斗拱
const gBeams    = new THREE.Group();   // 梁架
const gPurlins  = new THREE.Group();   // 槫
const gRafters  = new THREE.Group();   // 椽
const gRoof     = new THREE.Group();   // 屋面
const gRidge    = new THREE.Group();   // 脊饰
const gWalls    = new THREE.Group();   // 墙体门窗
const gAltar    = new THREE.Group();   // 佛坛
scene.add(gBase,gColumns,gLanE,gDougong,gBeams,gPurlins,gRafters,gRoof,gRidge,gWalls,gAltar);

/* ════════════════════════ 台基 ════════════════════════ */
{
  box(36.4, 1.2, 20.4, 0, 0.6, 0, M.plinth, '台基', gBase);
  box(36.9, 0.18, 20.9, 0, 1.28, 0, M.stone, '台基·阶条石', gBase);
}

/* ════════════════════════ 柱网 ════════════════════════ */
const COL_X = [4.37, 6.325, 8.745, 10.7, 13.12];      // 面阔方向柱位（半侧，10位）
const EAVE_H = 4.9, INNER_H = 9.9, PLINTH = 1.2;

/* 外檐柱：周圈22根（前后檐各10 + 山面中柱2） */
for(const sx of [-1,1]) for(const x of COL_X){
  const isCorner = Math.abs(x)===13.12;
  const h = EAVE_H + (isCorner ? 0.12 : 0);            // 生起
  const lean = isCorner ? 0.13 : 0.05;                 // 侧脚
  for(const sz of [-1,1]){
    const c = cyl(0.26, 0.30, h, sx*(x+lean), PLINTH+h/2, sz*9.03+sz*lean,
      M.column, isCorner?'外檐柱·角柱':'外檐柱', gColumns);
    c.rotation.z = -sx*lean*0.4; c.rotation.x = sz*lean*0.4;
  }
  if(isCorner) cyl(0.26, 0.30, h, sx*x, PLINTH+h/2, 0, M.column, '外檐柱', gColumns);
}
for(const sx of [-1,1]) for(const sz of [-1,1]){
  cyl(0.26, 0.30, EAVE_H, sx*13.12, PLINTH+EAVE_H/2, sz*4.515, M.column, '外檐柱', gColumns);
}
/* 内槽金柱14根：前后两排（X=0,±4.37,±8.745 × Z=±6.77）+ 中列（X=±4.37,±8.745 × Z=±2.26） */
const INNER_X = [0, 4.37, 8.745];
for(const sx of [-1,1]) for(const x of INNER_X){
  for(const sz of [-1,1]){
    cyl(0.31, 0.35, INNER_H, sx*x, PLINTH+INNER_H/2, sz*6.77, M.column, '金柱', gColumns);
    if(x!==0) cyl(0.31, 0.35, INNER_H, sx*x, PLINTH+INNER_H/2, sz*2.26, M.column, '金柱', gColumns);
  }
}

/* ════════════════════════ 阑额 ════════════════════════ */
{
  const y = PLINTH + EAVE_H - 0.35;
  for(const sz of [-1,1]){                              // 前后檐（7间8柱位）
    const xs=[0, ...COL_X];
    for(let i=0;i<xs.length-1;i++){
      const len = xs[i+1]-xs[i];
      box(len+0.5, 0.32, 0.26, (xs[i]+len/2), y, sz*9.03, M.wood, '阑额', gLanE);
      if(i>0) box(len+0.5, 0.32, 0.26, -(xs[i]+len/2), y, sz*9.03, M.wood, '阑额', gLanE);
    }
  }
  for(const sx of [-1,1]){                              // 山面（4间）
    const zs=[0, 4.515, 9.03];
    for(let i=0;i<zs.length-1;i++){
      const len = zs[i+1]-zs[i];
      box(0.26, 0.32, len+0.5, sx*13.12, y, zs[i]+len/2, M.wood, '阑额', gLanE);
    }
  }
}

/* ════════════════════════ 斗拱 ════════════════════════ */
const dgParts = { ludou:[], huagong:[], ang:[], henggong:[], sandou:[], shuatou:[], timu:[] };
const dgNames = [];
const UP = new THREE.Vector3(0,1,0);

function dgAdd(type, w,h,d, o, u, n, x,y,z, rx=0,ry=0,rz=0){
  const basis = new THREE.Matrix4().makeBasis(u, UP, n);
  const local = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx,ry,rz));
  local.setPosition(x,y,z);
  const world = basis.clone().multiply(local);
  world.setPosition(
    o.x + u.x*x + n.x*z,
    o.y + y,
    o.z + u.z*x + n.z*z
  );
  dgParts[type].push(world);
  dgNames.push({type, name:'斗拱'});
}
function buildDougong(o, u, n, kind){
  const nm = o.name || '斗拱';
  if(kind==='bujian'){                                  // 补间·双杪五铺作
    dgAdd('ludou', .45,.30,.45, o,u,n, 0,.15,0);
    dgAdd('huagong',.24,.28,1.0, o,u,n, 0,.48,.10);
    dgAdd('henggong',1.1,.22,.24, o,u,n, 0,.42,-.05);
    dgAdd('huagong',.24,.28,1.4, o,u,n, 0,.78,.30);
    dgAdd('henggong',1.5,.22,.24, o,u,n, 0,1.08,.90);
    dgAdd('sandou', .24,.13,.24, o,u,n, .65,1.22,.90);
    dgAdd('sandou', .24,.13,.24, o,u,n, -.65,1.22,.90);
    dgAdd('timu',   1.9,.16,.30, o,u,n, 0,1.34,.90);
    return;
  }
  if(kind==='corner'){                                 // 转角铺作（双向出跳+角昂）
    dgAdd('ludou', .55,.34,.55, o,u,n, 0,.17,0);
    dgAdd('huagong',.26,.30,1.05, o,u,n, 0,.55,.15);
    dgAdd('huagong',.26,.30,1.05, o,u,n, 0,.55,.15, 0,Math.PI/2,0);
    dgAdd('henggong',1.4,.24,.26, o,u,n, 0,.48,-.08);
    dgAdd('henggong',1.4,.24,.26, o,u,n, 0,.48,-.08, 0,Math.PI/2,0);

function roofSlope(u){ return THREE.MathUtils.lerp(P.ridge.y, ROOF.eaveY, Math.pow(u, 0.8)); }
function buildRoofSlope(sz){                                // 前/后坡（梯形）
  const NU=14, NV=30, pos=[], uv=[], idx=[];
  for(let i=0;i<=NU;i++){
    const u=i/NU, y=roofSlope(u);
    for(let j=0;j<=NV;j++){
      const v=j/NV;
      const xTop = -5.5+11*v, xBot = -17.03+34.06*v;
      const x = THREE.MathUtils.lerp(xTop, xBot, u);
      pos.push(x, y, sz*THREE.MathUtils.lerp(0, ROOF.eaveZ, u));
      uv.push(v, u);
    }
  }
  for(let i=0;i<NU;i++) for(let j=0;j<NV;j++){
    const a=i*(NV+1)+j, b=a+NV+1;
    if(sz<0) idx.push(a,b,a+1, b,b+1,a+1); else idx.push(a,a+1,b, b,a+1,b+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, M.roof);
  m.castShadow = m.receiveShadow = true; m.userData.name='屋面';
  gRoof.add(m); clickable.push(m);
}
buildRoofSlope(-1); buildRoofSlope(1);
function buildGable(sx){                                    // 山面坡（三角）
  const NU=14, NV=16, pos=[], uv=[], idx=[];
  for(let i=0;i<=NU;i++){
    const u=i/NU, y=roofSlope(u), x=THREE.MathUtils.lerp(sx*5.5, sx*17.03, u);
    for(let j=0;j<=NV;j++){
      const z=(j/NV-0.5)*2*ROOF.eaveZ;
      pos.push(x, y, z); uv.push(j/NV, u);
    }
  }
  for(let i=0;i<NU;i++) for(let j=0;j<NV;j++){
    const a=i*(NV+1)+j, b=a+NV+1;
    if(sx>0) idx.push(a,b,a+1, b,b+1,a+1); else idx.push(a,a+1,b, b,a+1,b+1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, M.roof);
  m.castShadow = m.receiveShadow = true; m.userData.name='屋面';

}

  const c = document.createElement('canvas'); c.width = c.height = 256;

function makeLabel(text, pos){
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(46,64,52,.88)';
  const w = g.measureText(text).width + 56;
  g.beginPath(); g.roundRect(6, 14, 480, 100, 18); g.fill();
  g.fillStyle = '#F2EFE6'; g.font = '56px "Songti SC","Noto Serif SC",serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:true, transparent:true}));
  sp.scale.set(4.4, 1.1, 1); sp.position.copy(pos);
  labelsGroup.add(sp);
}

function applyExplode(t){

const infoBody = document.getElementById('infoBody');

      <div class="hint">拖动旋转 · 滚轮缩放 · 右键平移<br>点击构件查看营造解说<br>拖动下方滑杆将建筑逐层拆开</div>`;

/* ════════════════════════ 交互 ════════════════════════ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null, selected = null;
const selBox = new THREE.BoxHelper(new THREE.Object3D(), 0xFFD700);
selBox.visible = false; scene.add(selBox);

renderer.domElement.addEventListener('pointerdown', e=>{ downPos=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const dx=e.clientX-downPos[0], dy=e.clientY-downPos[1];
  downPos=null;
  if(dx*dx+dy*dy > 25) return;                        // 拖拽不触发
  pointer.x = (e.clientX/innerWidth)*2-1;
  pointer.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable, false);
  if(hits.length){
    const h = hits[0];
    let name = h.object.userData.name;
    if(h.object.userData.isRafters) name = '檐椽';
    if(h.object.userData.partType){
      name = h.object.userData.names[Math.floor(h.instanceId/ (h.object.userData.partType==='ang'?2:1))]?.name
            || h.object.userData.names[h.instanceId]?.name || '斗拱';
    }
    showInfo(name);
    selBox.setFromObject(h.object);
    selBox.visible = true;
  } else {
    selBox.visible = false;
    showInfo(null);
  }
});

/* 滑杆 */
const slider = document.getElementById('explodeSlider');
function setSliderFill(){
  slider.style.setProperty('--fill', slider.value+'%');
}
slider.addEventListener('input', ()=>{ explodeTarget = slider.value/100; setSliderFill(); });
setSliderFill();
document.getElementById('btnAssemble').onclick = ()=>{ explodeTarget = 0; slider.value = 0; setSliderFill(); };
document.getElementById('btnHalf').onclick    = ()=>{ explodeTarget = .5; slider.value = 50; setSliderFill(); };

/* 层列表 */

for(const L of layers){

/* 视角 */
const VIEWS = {
  home:    {p:[30,14,34],  t:[0,5.5,0]},
  frame:   {p:[1.5,7.5,10.5], t:[0,11,-2]},
  dougong: {p:[17.5,8.5,13.5], t:[13.12,6.8,9.03]},
  top:     {p:[0.1,52,0.1], t:[0,0,0]},
};
let camAnim = null;
document.querySelectorAll('#viewBar .btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const v = VIEWS[b.dataset.view];
    camAnim = {
      fp:camera.position.clone(), tp:new THREE.Vector3(...v.p),
      ft:controls.target.clone(), tt:new THREE.Vector3(...v.t),
      t:0,
    };
    if(b.dataset.view==='frame' && explodeTarget < 0.4){
      explodeTarget = 0.55; slider.value = 55; setSliderFill();
    }
  });
});

/* ════════════════════════ 主循环 ════════════════════════ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(Math.abs(explodeT-explodeTarget) > 0.0005){
    applyExplode(THREE.MathUtils.lerp(explodeT, explodeTarget, 1-Math.pow(0.001, dt)));
  }
  if(camAnim){
    camAnim.t += dt/1.2;
    const k = camAnim.t>=1 ? 1 : 1-Math.pow(1-camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fp, camAnim.tp, k);
    controls.target.lerpVectors(camAnim.ft, camAnim.tt, k);
    if(camAnim.t>=1) camAnim = null;
  }
  if(autoSpin){
    const a = dt*0.25;
    const x = camera.position.x, z = camera.position.z;
    camera.position.x = x*Math.cos(a)-z*Math.sin(a);
    camera.position.z = x*Math.sin(a)+z*Math.cos(a);
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
