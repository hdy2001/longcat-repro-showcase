<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05060f">
<title>霓虹碎块 · Neon Breaker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #020208;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', monospace;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,212,255,.25), 0 0 120px rgba(123,97,255,.15);
    touch-action: none;
    cursor: crosshair;
  }
  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,6,15,.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-align: center; padding: 20px;
  }
  .hidden { display: none !important; }
  .title {
    font-size: 52px; font-weight: 900; letter-spacing: 10px; color: #fff;
    text-shadow: 0 0 10px #00d4ff, 0 0 30px #00d4ff, 0 0 70px #7b61ff;
    animation: titlePulse 2.2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px #00d4ff, 0 0 30px #00d4ff, 0 0 70px #7b61ff; }
    50%      { text-shadow: 0 0 14px #ff2d95, 0 0 40px #ff2d95, 0 0 90px #7b61ff; }
  }
  .subtitle {
    margin-top: 10px; font-size: 15px; letter-spacing: 8px; color: #4dffdb;
    text-shadow: 0 0 8px #00d4ff;
  }
  .desc { margin-top: 22px; font-size: 13px; color: rgba(255,255,255,.65); letter-spacing: 3px; }
  .help {
    margin-top: 20px; font-size: 13px; line-height: 2.1; color: rgba(255,255,255,.8);
    background: rgba(255,255,255,.04); border: 1px solid rgba(0,212,255,.25);
    border-radius: 12px; padding: 14px 26px;
  }
  .kbd {
    display: inline-block; background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.3); border-radius: 6px;
    padding: 1px 9px; margin: 0 3px; font-size: 12px; color: #4dffdb;
  }
  .power-legend { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: 2px; }
  .best-line { margin-top: 14px; font-size: 13px; color: #ffe74c; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255,231,76,.6); }
  .btn {
    margin-top: 26px; padding: 14px 50px; font-size: 18px; font-family: inherit;
    letter-spacing: 6px; color: #4dffdb; background: rgba(0,212,255,.08);
    border: 2px solid #00d4ff; border-radius: 10px; cursor: pointer;
    text-shadow: 0 0 8px #00d4ff;
    box-shadow: 0 0 18px rgba(0,212,255,.35), inset 0 0 12px rgba(0,212,255,.15);
    transition: all .18s ease;
  }
  .btn:hover { background: rgba(0,212,255,.22); transform: scale(1.06); box-shadow: 0 0 30px rgba(0,212,255,.6), inset 0 0 16px rgba(0,212,255,.3); }
  .btn:active { transform: scale(.97); }
  .big-score {
    font-size: 40px; font-weight: 900; color: #fff; margin-top: 14px;
    text-shadow: 0 0 12px #ff2d95, 0 0 40px #ff2d95; letter-spacing: 4px;
  }
  .stat-line { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.75); letter-spacing: 3px; }
  .gameover-title {
    font-size: 44px; font-weight: 900; letter-spacing: 8px; color: #fff;
    text-shadow: 0 0 12px #ff2d95, 0 0 45px #ff2d95;
  }
  .clear-title {
    font-size: 44px; font-weight: 900; letter-spacing: 8px; color: #fff;
    text-shadow: 0 0 12px #3ddc84, 0 0 45px #3ddc84;
  }
  #muteBtn {
    position: absolute; bottom: 10px; right: 12px; z-index: 20;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; color: #fff; font-size: 16px; padding: 5px 10px;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  #muteBtn:hover { background: rgba(255,255,255,.15); }
  @media (max-width: 720px) {
    .title { font-size: 34px; letter-spacing: 6px; }
    .help { font-size: 11px; padding: 10px 14px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="muteBtn" title="声音开关 (M)">🔊</button>

  <!-- 主菜单 -->
  <div id="menu" class="overlay">
    <div class="title">霓虹碎块</div>
    <div class="subtitle">NEON BREAKER</div>
    <div class="desc">蓄 力 发 射 · 霓 虹 打 砖 块</div>
    <div class="help">
      <div><span class="kbd">按住鼠标左键 / 触屏长按</span> 蓄力（力度条由绿到红）</div>
      <div><span class="kbd">松开</span> 发射小球 · 挡板移动越快，发射角度越偏</div>
      <div><span class="kbd">移动鼠标 / 拖动手指</span> 控制挡板 · <span class="kbd">P</span> 暂停 · <span class="kbd">空格</span> 蓄力</div>
      <div style="margin-top:6px">道具砖块：<b style="color:#c04dff">×3</b> 三球分裂 · <b style="color:#00d4ff">↔</b> 挡板加宽 · <b style="color:#ff5c5c">♥</b> 额外生命</div>
    </div>
    <div class="power-legend">连续击碎积累 COMBO 倍率，球碰挡板后重置</div>
    <div class="best-line" id="menuBest"></div>
    <button class="btn" id="btnStart">开 始 游 戏</button>
  </div>

  <!-- 游戏结束 -->
  <div id="gameover" class="overlay hidden">
    <div class="gameover-title">游戏结束</div>
    <div class="big-score" id="finalScore">0</div>
    <div class="stat-line" id="finalLevel"></div>
    <div class="best-line" id="finalBest"></div>
    <button class="btn" id="btnRestart">重 新 开 始</button>
  </div>

  <!-- 过关 -->
  <div id="levelclear" class="overlay hidden">
    <div class="clear-title">LEVEL CLEAR!</div>
    <div class="big-score" id="clearInfo" style="text-shadow:0 0 12px #3ddc84,0 0 40px #3ddc84"></div>
  </div>

  <!-- 暂停 -->
  <div id="paused" class="overlay hidden">
    <div class="clear-title" style="text-shadow:0 0 12px #ffe74c,0 0 40px #ffe74c">已暂停</div>
    <div class="stat-line" style="margin-top:14px">按 P 或点击按钮继续</div>
    <button class="btn" id="btnResume">继 续</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
 * 基础常量与画布
 * ============================================================ */
const W = 960, H = 640;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.985;
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fit);
fit();

/* ============================================================
 * 工具函数
 * ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand  = (a, b) => a + Math.random() * (b - a);

function shade(hex, f) { // 颜色变亮/变暗
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) * f, 0, 255) | 0;
  const b = clamp((n & 255) * f, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
 * 音效系统（Web Audio 合成，无需外部资源）
 * ============================================================ */
const Sound = {
  ctx: null, on: true,
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* 不支持则静音 */ }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(freq, dur = 0.08, type = 'square', vol = 0.15, slide = 0) {
    if (!this.on) return;
    this.ensure();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  },
  launch(p)  { this.play(180 + p * 260, 0.16, 'sawtooth', 0.16, 280 + p * 420); },
  paddle()   { this.play(230, 0.06, 'square', 0.12, 70); },
  wall()     { this.play(160, 0.05, 'square', 0.07); },
  brick(hp)  { this.play(330 + hp * 70, 0.07, 'triangle', 0.15, 140); },
  brickDown(){ this.play(520, 0.13, 'sawtooth', 0.13, -340); },
  powerup()  { this.play(660, 0.1, 'sine', 0.14, 240); },
  loseLife() { this.play(150, 0.32, 'sawtooth', 0.16, -90); },
  gameOver() { this.play(300, 0.55, 'sawtooth', 0.16, -250); },
  clear() {
    [523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => this.play(f, 0.13, 'triangle', 0.13), i * 95));
  }
};

/* ============================================================
 * 游戏状态
 * ============================================================ */
const PALETTE = ['#ff2d95','#ff5e78','#ff9f1c','#ffe74c','#3ddc84','#00d4ff','#7b61ff','#c04dff','#4dffdb'];
const POWER_ICON = { 'M': '×3', 'E': '↔', 'L': '♥' };
const POWER_COLOR = { 'M': '#c04dff', 'E': '#00d4ff', 'L': '#ff5c5c' };

const G = {
  state: 'menu',          // menu | ready | charging | playing | levelclear | gameover | paused
  prevState: 'ready',
  score: 0, lives: 3, level: 1, combo: 0,
  power: 0, charging: false, maxed: false,
  shake: 0, expandT: 0, clearT: 0, clearBonus: 0,
  time: 0,
  bricks: [], balls: [], parts: [], texts: [],
  paddle: { x: W / 2, w: 100, h: 14, y: H - 46, tx: W / 2, vel: 0, flash: 0 },
  high: loadHigh()
};
function loadHigh() {
  try { return parseInt(localStorage.getItem('neonBreakerHigh')) || 0; } catch (e) { return 0; }
}
function saveHigh() {
  try { localStorage.setItem('neonBreakerHigh', String(G.high)); } catch (e) { /* file:// 下可能失败 */ }
}

// 背景漂浮尘埃
const dust = Array.from({ length: 36 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  v: rand(6, 18), r: rand(0.8, 2.4), ph: Math.random() * Math.PI * 2
}));

/* ============================================================
 * 关卡生成
 * ============================================================ */
function buildLevel(lv) {
  G.bricks = [];
  const cols = 10;
  const rows = Math.min(4 + Math.floor((lv - 1) * 0.8), 9);
  const margin = 30, gap = 6, top = 72;
  const bw = (W - margin * 2 - gap * (cols - 1)) / cols;
  const bh = 22;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // 高层（靠近顶部）血量更高
      const hp = clamp(1 + Math.floor((rows - 1 - r) * 0.35) + Math.floor(lv / 3), 1, 3);
      // 随机道具砖
      let type = null;
      if (Math.random() < 0.1) {
        type = ['M', 'M', 'E', 'E', 'L'][(Math.random() * 5) | 0];
      }
      G.bricks.push({
        x: margin + c * (bw + gap),
        y: top + r * (bh + gap),
        w: bw, h: bh,
        hp, maxHp: hp, type,
        color: PALETTE[(r + lv) % PALETTE.length],
        alive: true, flash: 0
      });
    }
  }
}

/* ============================================================
 * 球与发射（核心：蓄力发射系统）
 * ============================================================ */
function resetBall() {
  G.balls = [{ x: G.paddle.x, y: G.paddle.y - 10, vx: 0, vy: 0, r: 8, trail: [] }];
  G.power = 0; G.charging = false; G.maxed = false;
}

function launch() {
  const b = G.balls[0];
  if (!b) return;
  const p = Math.max(G.power, 0.15);           // 轻点也能快速发射
  // 挡板移动速度决定出射角度（打过乒乓球的手感）
  const tilt = clamp(G.paddle.vel * 0.0009, -0.28, 0.28);
  const sp = (430 + p * 320) * (1 + (G.level - 1) * 0.04); // 蓄力 → 球速
  b.vx = Math.sin(tilt) * sp;
  b.vy = -Math.cos(tilt) * sp;
  G.state = 'playing';
  G.charging = false; G.power = 0;
  Sound.launch(p);
  addParticles(b.x, b.y, '#4dffdb', 12, 220);
}

/* ============================================================
 * 碰撞与物理
 * ============================================================ */
function circleRect(b, r) {
  const cx = clamp(b.x, r.x, r.x + r.w);
  const cy = clamp(b.y, r.y, r.y + r.h);
  const dx = b.x - cx, dy = b.y - cy;
  return dx * dx + dy * dy < b.r * b.r;
}

function collideBrick(b, k) {
  const cx = clamp(b.x, k.x, k.x + k.w);
  const cy = clamp(b.y, k.y, k.y + k.h);
  let dx = b.x - cx, dy = b.y - cy;
  let d = Math.hypot(dx, dy);
  if (d === 0) { // 球心在砖内：沿最小穿透轴弹出
    const pl = b.x - k.x, pr = k.x + k.w - b.x, pt = b.y - k.y, pb = k.y + k.h - b.y;
    const m = Math.min(pl, pr, pt, pb);
    if (m === pl) { dx = -1; dy = 0; } else if (m === pr) { dx = 1; dy = 0; }
    else if (m === pt) { dx = 0; dy = -1; } else { dx = 0; dy = 1; }
    d = 1;
  }
  const nx = dx / d, ny = dy / d;
  const dot = b.vx * nx + b.vy * ny;
  if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
  b.x = cx + nx * (b.r + 0.5);
  b.y = cy + ny * (b.r + 0.5);
}

function bouncePaddle(b) {
  const p = G.paddle;
  const rel = clamp((b.x - p.x) / (p.w / 2), -1, 1);
  const ang = rel * (Math.PI / 3.2);            // 最大约 56°
  const sp = Math.max(Math.hypot(b.vx, b.vy), 380);
  b.vx = sp * Math.sin(ang);
  b.vy = -sp * Math.cos(ang);
  b.y = p.y - b.r - 0.5;
  G.combo = 0;
  p.flash = 1;
  Sound.paddle();
  addParticles(b.x, p.y, '#00d4ff', 6, 130);
}

function moveBall(b, dt) {
  // 子步进防止高速穿透
  const speed = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(speed * dt / 8));
  const sdt = dt / steps;
  for (let s = 0; s < steps; s++) {
    b.x += b.vx * sdt;
    b.y += b.vy * sdt;
    if (b.x < b.r)            { b.x = b.r;            b.vx =  Math.abs(b.vx);  Sound.wall(); }
    else if (b.x > W - b.r)  { b.x = W - b.r;        b.vx = -Math.abs(b.vx);  Sound.wall(); }
    if (b.y < b.r)            { b.y = b.r;            b.vy =  Math.abs(b.vy);  Sound.wall(); }
    const pr = { x: p.x - p.w / 2, y: p.y, w: p.w, h: p.h };
    if (b.vy > 0 && circleRect(b, pr)) bouncePaddle(b);
    for (const k of G.bricks) {
      if (k.alive && circleRect(b, k)) { collideBrick(b, k); hitBrick(k, b); break; }
    }
  }
  b.trail.unshift({ x: b.x, y: b.y });
  if (b.trail.length > 10) b.trail.pop();
}

// 防止球进入过平的死循环角度
function clampBallVelocity(b) {
  const sp = Math.hypot(b.vx, b.vy);
  const minVy = sp * 0.35;
  if (Math.abs(b.vy) < minVy) {
    const sign = b.vy >= 0 ? 1 : -1;
    b.vy = sign * minVy;
    b.vx = Math.sign(b.vx || 1) * Math.sqrt(sp * sp - minVy * minVy);
  }
}

/* ============================================================
 * 砖块 / 得分 / 道具
 * ============================================================ */
function hitBrick(k) {
  k.hp--;
  k.flash = 1;
  if (k.hp <= 0) {
    k.alive = false;
    G.combo++;
    const pts = Math.round(50 * k.maxHp * (1 + G.combo * 0.2));
    G.score += pts;
    if (G.score > G.high) G.high = G.score;
    addText(k.x + k.w / 2, k.y + k.h / 2, '+' + pts, k.color);
    if (G.combo >= 3) addText(k.x + k.w / 2, k.y - 8, 'COMBO ×' + G.combo, '#ffe74c');
    addParticles(k.x + k.w / 2, k.y + k.h / 2, k.color, 16, 280);
    G.shake = Math.min(6, G.shake + 2.5);
    Sound.brickDown();
    if (k.type) activatePower(k.type, k.x + k.w / 2, k.y + k.h / 2);
    if (G.bricks.every(x => !x.alive)) levelClear();
  } else {
    Sound.brick(k.hp);
    addParticles(k.x + k.w / 2, k.y + k.h / 2, k.color, 6, 160);
  }
}

function activatePower(type, x, y) {
  Sound.powerup();
  if (type === 'M') { // 三球分裂
    const src = G.balls.slice();
    for (const s of src) {
      const sp = Math.hypot(s.vx, s.vy) || 420;
      const th = Math.atan2(s.vx, -s.vy); // 相对竖直方向的角度
      for (const da of [-0.42, 0.42]) {
        if (G.balls.length >= 7) break;
        G.balls.push({
          x: s.x, y: s.y, r: 8, trail: [],
          vx: sp * Math.sin(th + da), vy: -sp * Math.cos(th + da)
        });
      }
    }
    addText(x, y, '三球分裂!', '#c04dff');
  } else if (type === 'E') { // 挡板加宽 12 秒
    G.expandT = 12;
    addText(x, y, '挡板加宽!', '#00d4ff');
  } else if (type === 'L') { // 额外生命
    G.lives = Math.min(5, G.lives + 1);
    addText(x, y, '♥ +1', '#ff5c5c');
  }
}

/* ============================================================
 * 粒子与飘字
 * ============================================================ */
function addParticles(x, y, color, n = 14, speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * rand(0.3, 1);
    const life = rand(0.45, 0.9);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, color, size: rand(1.5, 4) });
  }
  if (G.parts.length > 420) G.parts.splice(0, G.parts.length - 420);
}
function addText(x, y, str, color) {
  G.texts.push({ x: clamp(x, 60, W - 60), y, str, color, life: 1, vy: -48 });
}

/* ============================================================
 * 流程控制
 * ============================================================ */
function levelClear() {
  G.clearBonus = 250 * G.level;
  G.score += G.clearBonus;
  if (G.score > G.high) G.high = G.score;
  G.state = 'levelclear';
  G.clearT = 2.0;
  clearInfo.textContent = `奖励 +${G.clearBonus} · 即将进入第 ${G.level + 1} 关`;
  showEl(levelclearEl);
  Sound.clear();
}

function loseLife() {
  G.lives--;
  G.combo = 0;
  if (G.lives <= 0) { gameOver(); return; }
  G.shake = 10;
  Sound.loseLife();
  resetBall();
  G.state = 'ready';
}

function gameOver() {
  G.state = 'gameover';
  saveHigh();
  finalScore.textContent = G.score;
  finalLevel.textContent = `到达关卡 · LEVEL ${G.level}`;
  finalBest.textContent = `历史最高 · ${G.high}`;
  showEl(gameoverEl);
  Sound.gameOver();
}

function startGame() {
  hideEl(menuEl); hideEl(gameoverEl); hideEl(levelclearEl);
  G.score = 0; G.lives = 3; G.level = 1; G.combo = 0;
  G.expandT = 0; G.shake = 0;
  buildLevel(1);
  G.parts = []; G.texts = [];
  resetBall();
  G.state = 'ready';
  addText(W / 2, H / 2 - 40, 'LEVEL 1', '#4dffdb');
}

/* ============================================================
 * 更新逻辑
 * ============================================================ */
function update(dt) {
  G.time += dt;

  // 尘埃漂浮
  for (const d of dust) {
    d.y -= d.v * dt;
    if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
  }

  // 挡板平滑移动 & 速度估算（用于发射角度）
  const p = G.paddle;
  const prevX = p.x;
  const target = clamp(p.tx, p.w / 2 + 4, W - p.w / 2 - 4);
  p.x += (target - p.x) * Math.min(1, dt * 16);
  p.vel = dt > 0 ? (p.x - prevX) / dt : 0;
  const targetW = G.expandT > 0 ? 150 : 100;
  p.w += (targetW - p.w) * Math.min(1, dt * 8);
  p.flash = Math.max(0, p.flash - dt * 4);

  // 状态机
  if (G.state === 'ready' || G.state === 'charging') {
    const b = G.balls[0];
    if (b) { b.x = p.x; b.y = p.y - b.r - 2; }
    if (G.state === 'charging') {
      G.power = Math.min(1, G.power + dt / 1.15);   // 约 1.15s 蓄满
      if (G.power >= 1 && !G.maxed) { G.maxed = true; Sound.powerup(); }
      if (G.power >= 1) G.shake = Math.max(G.shake, 1.2); // 满力微震
    }
  } else if (G.state === 'playing') {
    for (const b of G.balls) moveBall(b, dt);
    for (const b of G.balls) clampBallVelocity(b);
    G.balls = G.balls.filter(b => b.y - b.r <= H + 24);
    if (G.balls.length === 0) loseLife();
  } else if (G.state === 'levelclear') {
    G.clearT -= dt;
    if (G.clearT <= 0) {
      hideEl(levelclearEl);
      G.level++;
      buildLevel(G.level);
      resetBall();
      G.state = 'ready';
      addText(W / 2, H / 2 - 40, 'LEVEL ' + G.level, '#4dffdb');
    }
  }

  // 砖块受击闪光衰减
  for (const k of G.bricks) if (k.flash > 0) k.flash = Math.max(0, k.flash - dt * 3.5);
  // 加宽倒计时
  if (G.expandT > 0) G.expandT -= dt;
  // 粒子
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.vy += 380 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.life -= dt;
    if (q.life <= 0) G.parts.splice(i, 1);
  }
  // 飘字
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.y += t.vy * dt; t.life -= dt * 0.85;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
  G.shake = Math.max(0, G.shake - dt * 22);
}

/* ============================================================
 * 渲染
 * ============================================================ */
function render() {
  // 背景
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (G.shake > 0.2) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));

  drawBackground();
  drawBricks();
  drawPaddle();
  drawBalls();
  drawParticles();
  drawTexts();
  if (G.state === 'ready' || G.state === 'charging') drawReadyUI();
  if (G.state === 'charging') drawPowerBar();
  drawHUD();

  ctx.restore();

  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawBackground() {
  // 滚动网格
  ctx.strokeStyle = 'rgba(0,212,255,0.05)';
  ctx.lineWidth = 1;
  const offX = (G.time * 14) % 48, offY = (G.time * 8) % 48;
  ctx.beginPath();
  for (let x = -offX; x < W; x += 48) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -offY; y < H; y += 48) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // 尘埃
  for (const d of dust) {
    ctx.globalAlpha = 0.12 + 0.14 * Math.sin(G.time * 2 + d.ph);
    ctx.fillStyle = '#4dffdb';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBricks() {
  for (const k of G.bricks) {
    if (!k.alive) continue;
    const c = k.color;
    ctx.save();
    ctx.shadowColor = c;
    ctx.shadowBlur = 14 + k.flash * 22;
    const grad = ctx.createLinearGradient(k.x, k.y, k.x, k.y + k.h);
    grad.addColorStop(0, shade(c, 1.05));
    grad.addColorStop(1, shade(c, 0.5));
    ctx.fillStyle = grad;
    roundRect(k.x, k.y, k.w, k.h, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,255,255,${0.35 + k.flash * 0.6})`;
    ctx.lineWidth = 1.5;
    roundRect(k.x + 0.75, k.y + 0.75, k.w - 1.5, k.h - 1.5, 4);
    ctx.stroke();
    // 血量刻度（>1 时右上角显示剩余格数）
    if (k.maxHp > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 0; i < k.hp; i++) ctx.fillRect(k.x + k.w - 8 - i * 7, k.y + 3, 5, 3);
    }
    // 道具图标
    if (k.type) {
      const pulse = 0.75 + 0.25 * Math.sin(G.time * 5);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Orbitron, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = POWER_COLOR[k.type];
      ctx.shadowBlur = 10;
      ctx.fillText(POWER_ICON[k.type], k.x + k.w / 2, k.y + k.h / 2 + 1);
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

function drawPaddle() {
  const p = G.paddle;
  ctx.save();
  const hue = G.state === 'charging'
    ? 160 - 160 * G.power   // 蓄力时由青(160°)渐变为红(0°)
    : 185;
  ctx.shadowColor = `hsl(${hue},100%,60%)`;
  ctx.shadowBlur = 18 + p.flash * 16;
  const grad = ctx.createLinearGradient(p.x - p.w / 2, 0, p.x + p.w / 2, 0);
  grad.addColorStop(0, `hsl(${hue},100%,55%)`);
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, `hsl(${hue},100%,55%)`);
  ctx.fillStyle = grad;
  roundRect(p.x - p.w / 2, p.y, p.w, p.h, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  roundRect(p.x - p.w / 2 + 0.5, p.y + 0.5, p.w - 1, p.h - 1, 6.5);
  ctx.stroke();
  // 蓄力时挡板下方能量环
  if (G.state === 'charging' && G.power > 0.05) {
    ctx.globalAlpha = 0.25 + 0.45 * G.power;
    ctx.strokeStyle = `hsl(${160 - 160 * G.power},100%,60%)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + p.h + 4, p.w * 0.55 * (0.4 + 0.6 * G.power), 5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawBalls() {
  for (const b of G.balls) {
    // 拖尾
    for (let i = b.trail.length - 1; i >= 0; i--) {
      const t = b.trail[i];
      ctx.globalAlpha = (1 - i / b.trail.length) * 0.22;
      ctx.fillStyle = '#4dffdb';
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * (1 - i / b.trail.length * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 本体（蓄力时发光随力度增强）
    const glow = G.state === 'charging' ? 20 + G.power * 25 : 22;
    ctx.save();
    ctx.shadowColor = '#4dffdb';
    ctx.shadowBlur = glow;
    const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.6, '#bffcff');
    grad.addColorStop(1, '#00d4ff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + (G.state === 'charging' ? G.power * 2 : 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const q of G.parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.font = 'bold 15px Orbitron, monospace';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// 待发提示 + 瞄准虚线（蓄力时实时显示当前出射角）
function drawReadyUI() {
  const p = G.paddle, b = G.balls[0];
  if (!b) return;
  ctx.save();
  ctx.textAlign = 'center';
  if (G.state === 'ready') {
    const a = 0.55 + 0.35 * Math.sin(G.time * 4);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 17px Orbitron, "PingFang SC", monospace';
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 10;
    ctx.fillText('按住蓄力 · 松开发射', W / 2, H - 108);
    ctx.globalAlpha = 1;
  } else {
    // 瞄准线：角度与挡板瞬时速度联动
    const tilt = clamp(p.vel * 0.0009, -0.28, 0.28);
    const dx = Math.sin(tilt), dy = -Math.cos(tilt);
    const len = 130 + G.power * 60;
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = `hsla(${160 - 160 * G.power},100%,65%,0.85)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x + dx * len, b.y + dy * len);
    ctx.stroke();
    ctx.setLineDash([]);
    // 箭头
    const ex = b.x + dx * len, ey = b.y + dy * len;
    ctx.fillStyle = `hsla(${160 - 160 * G.power},100%,65%,0.9)`;
    ctx.beginPath();
    ctx.moveTo(ex + dx * 10, ey + dy * 10);
    ctx.lineTo(ex - dy * 6 - dx * 4, ey + dx * 6 - dy * 4);
    ctx.lineTo(ex + dy * 6 - dx * 4, ey - dx * 6 - dy * 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// 力度条：绿 → 黄 → 红渐变 + 发光
function drawPowerBar() {
  const bw = 300, bh = 16, bx = W / 2 - bw / 2, by = H - 26;
  const p = G.power;
  ctx.save();
  // 底槽
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 9);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 9);
  ctx.stroke();
  // 填充（色相 120°绿 → 0°红）
  const hue = 120 - 120 * p;
  const fw = bw * p;
  if (fw > 1) {
    ctx.shadowColor = `hsl(${hue},100%,55%)`;
    ctx.shadowBlur = 12 + p * 14;
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#3ddc84');
    grad.addColorStop(0.55, '#ffe74c');
    grad.addColorStop(1, '#ff2d2d');
    ctx.fillStyle = grad;
    roundRect(bx, by, fw, bh, 7);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  // 文字
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px Orbitron, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const label = p >= 1 ? 'POWER MAX!' : `POWER ${Math.round(p * 100)}%`;
  ctx.fillText(label, W / 2, by - 10);
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'top';
  // 左：分数
  ctx.textAlign = 'left';
  ctx.font = 'bold 18px Orbitron, monospace';
  ctx.fillStyle = '#4dffdb';
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur = 8;
  ctx.fillText('SCORE ' + String(G.score).padStart(6, '0'), 18, 14);
  ctx.font = '11px Orbitron, monospace';
  ctx.shadowBlur = 4;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('BEST ' + String(Math.max(G.high, G.score)).padStart(6, '0'), 18, 38);
  // 中：COMBO
  if (G.combo >= 3) {
    const s = 1 + 0.08 * Math.sin(G.time * 8);
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(16 * s)}px Orbitron, monospace`;
    ctx.fillStyle = '#ffe74c';
    ctx.shadowColor = '#ffe74c';
    ctx.shadowBlur = 12;
    ctx.fillText('COMBO ×' + G.combo, W / 2, 14);
  }
  // 右：关卡 + 生命
  ctx.textAlign = 'right';
  ctx.font = 'bold 16px Orbitron, monospace';
  ctx.fillStyle = '#c04dff';
  ctx.shadowColor = '#7b61ff';
  ctx.shadowBlur = 8;
  ctx.fillText('LEVEL ' + G.level, W - 18, 14);
  ctx.shadowBlur = 0;
  for (let i = 0; i < G.lives; i++) {
    ctx.fillStyle = '#ff5c5c';
    ctx.shadowColor = '#ff5c5c';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(W - 24 - i * 18, 46, 5.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
 * 输入处理（鼠标 + 触屏 + 键盘）
 * ============================================================ */
function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}

canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  e.preventDefault();
  Sound.ensure();
  if (G.state === 'ready') {
    G.charging = true;
    G.power = 0;
    G.maxed = false;
  }
});

window.addEventListener('pointerup', e => {
  if (!e.isPrimary) return;
  if (G.state === 'charging') launch();
});

canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  G.paddle.tx = canvasX(e.clientX);
});

canvas.addEventListener('pointercancel', () => {
  if (G.state === 'charging') { G.charging = false; G.power = 0; G.state = 'ready'; }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') {
    e.preventDefault();
    Sound.ensure();
    if (G.state === 'ready') { G.charging = true; G.power = 0; G.maxed = false; }
    else if (G.state === 'menu') startGame();
    else if (G.state === 'gameover') startGame();
  } else if (e.code === 'KeyP') {
    togglePause();
  } else if (e.code === 'KeyM') {
    toggleMute();
  } else if (e.code === 'Enter') {
    if (G.state === 'menu' || G.state === 'gameover') startGame();
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'Space' && G.state === 'charging') launch();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && ['ready', 'charging', 'playing'].includes(G.state)) togglePause();
});

/* ============================================================
 * UI 元素与事件
 * ============================================================ */
const $ = id => document.getElementById(id);
const menuEl = $('menu'), gameoverEl = $('gameover'), levelclearEl = $('levelclear'), pausedEl = $('paused');
const finalScore = $('finalScore'), finalLevel = $('finalLevel'), finalBest = $('finalBest');
const clearInfo = $('clearInfo'), menuBest = $('menuBest'), muteBtn = $('muteBtn');

const showEl = el => el.classList.remove('hidden');
const hideEl = el => el.classList.add('hidden');

menuBest.textContent = G.high > 0 ? `历史最高 · ${G.high}` : '';

function togglePause() {
  if (G.state === 'paused') {
    G.state = G.prevState;
    hideEl(pausedEl);
  } else if (['ready', 'charging', 'playing'].includes(G.state)) {
    G.prevState = G.state;
    G.state = 'paused';
    showEl(pausedEl);
  }
}

function toggleMute() {
  Sound.on = !Sound.on;
  muteBtn.textContent = Sound.on ? '🔊' : '🔇';
  if (Sound.on) Sound.ensure();
}

$('btnStart').addEventListener('click', () => { Sound.ensure(); startGame(); });
$('btnRestart').addEventListener('click', () => { Sound.ensure(); startGame(); });
$('btnResume').addEventListener('click', togglePause);
muteBtn.addEventListener('click', toggleMute);

/* ============================================================
 * 主循环
 * ============================================================ */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 25) dt = 1 / 25;   // 掉帧保护
  if (dt <= 0) return;
  if (G.state !== 'paused' && G.state !== 'menu' && G.state !== 'gameover') update(dt);
  else G.time += dt;             // 菜单里背景动画继续
  render();
}

buildLevel(1);  // 菜单背景预览
requestAnimationFrame(loop);
})();
</script>
