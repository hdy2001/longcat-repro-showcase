<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>霓虹碎块 · Neon Breaker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #02020a;
    background: radial-gradient(ellipse at 50% 28%, #0b0724 0%, #02020a 72%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    border: 1px solid rgba(0, 243, 255, 0.28);
    background: #04041a;
    box-shadow: 0 0 50px rgba(0, 243, 255, 0.14),
                0 0 110px rgba(255, 42, 109, 0.10),
                inset 0 0 30px rgba(0, 0, 0, 0.45);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0.55em 0.9em; pointer-events: none; z-index: 5;
  }
  .hud-label { font-size: 0.62em; letter-spacing: 0.32em; color: rgba(0, 243, 255, 0.65); text-shadow: 0 0 8px rgba(0,243,255,0.4); }
  .hud-score {
    font-family: Consolas, Menlo, monospace; font-size: 1.55em; font-weight: bold;
    color: #d8fbff; text-shadow: 0 0 12px rgba(0, 243, 255, 0.9), 0 0 34px rgba(0, 243, 255, 0.4);
    display: inline-block;
  }
  .hud-score.pop, .combo.pop { animation: elasticPop 0.34s cubic-bezier(0.34, 1.9, 0.5, 1); }
  @keyframes elasticPop {
    0% { transform: scale(1); }
    38% { transform: scale(1.38); }
    70% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }
  .hud-center { text-align: center; }
  .hud-best {
    font-family: Consolas, Menlo, monospace; font-size: 1.05em; font-weight: bold;
    color: #ffe9a8; text-shadow: 0 0 10px rgba(255, 210, 74, 0.7);
  }
  .hud-level { margin-top: 0.28em; font-size: 0.68em; letter-spacing: 0.24em; color: rgba(255, 42, 109, 0.85); text-shadow: 0 0 8px rgba(255,42,109,0.5); }
  .hud-right { text-align: right; }
  .hud-hearts { font-size: 1.15em; line-height: 1; letter-spacing: 0.08em; }
  .hud-hearts .on  { color: #ff4757; text-shadow: 0 0 9px rgba(255, 71, 87, 0.95), 0 0 22px rgba(255, 42, 109, 0.5); }
  .hud-hearts .off { color: rgba(255, 71, 87, 0.16); }
  .combo {
    margin-top: 0.3em; min-height: 1.1em;
    font-size: 0.95em; font-weight: bold; letter-spacing: 0.12em;
    color: #ffd24a; text-shadow: 0 0 12px rgba(255, 210, 74, 0.9), 0 0 30px rgba(255, 210, 74, 0.45);
    opacity: 0; transform: scale(0.7); transition: opacity 0.22s, transform 0.22s;
  }
  .combo.show { opacity: 1; transform: scale(1); }
  .effects { margin-top: 0.4em; display: flex; gap: 0.4em; justify-content: flex-end; flex-wrap: wrap; max-width: 26em; }
  .chip {
    font-size: 0.62em; font-weight: bold; letter-spacing: 0.06em;
    border: 1px solid; border-radius: 999px; padding: 0.16em 0.65em;
    background: rgba(4, 8, 26, 0.55); text-shadow: 0 0 8px currentColor;
  }

  /* ---------- 全屏覆盖层 ---------- */
  #flashOverlay { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  #scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 7;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.13) 0 1px, transparent 1px 3px);
  }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(1, 1, 12, 0.6) 100%);
  }
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3, 3, 18, 0.74); backdrop-filter: blur(4px);
    cursor: pointer;
  }
  #overlay.hidden { display: none; }
  .panel { text-align: center; padding: 2em 3em; border: 1px solid rgba(0, 243, 255, 0.35); border-radius: 10px; background: rgba(5, 5, 24, 0.82); box-shadow: 0 0 40px rgba(0, 243, 255, 0.18), inset 0 0 30px rgba(0, 243, 255, 0.05); }
  .panel h1 {
    font-size: 2.1em; letter-spacing: 0.18em; color: #ff2a6d;
    text-shadow: 0 0 16px rgba(255, 42, 109, 0.9), 0 0 46px rgba(255, 42, 109, 0.5);
    margin-bottom: 0.7em;
  }
  .final { display: flex; justify-content: space-between; gap: 3em; margin: 0.45em 0; font-size: 1.05em; color: rgba(210, 240, 255, 0.75); letter-spacing: 0.14em; }
  .final b { font-family: Consolas, Menlo, monospace; color: #d8fbff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.8); }
  .newbest { margin-top: 0.4em; color: #ffd24a; font-weight: bold; letter-spacing: 0.2em; text-shadow: 0 0 14px rgba(255, 210, 74, 0.9); animation: elasticPop 0.6s cubic-bezier(0.34, 1.9, 0.5, 1); }
  .newbest.hidden { display: none; }
  .restart-btn {
    margin-top: 1.4em; padding: 0.55em 2.2em; font-size: 0.95em; letter-spacing: 0.3em;
    color: #00f3ff; background: transparent; border: 2px solid #00f3ff; border-radius: 999px;
    cursor: pointer; font-family: inherit; text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 14px rgba(0, 243, 255, 0.12);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .restart-btn:hover { background: rgba(0, 243, 255, 0.12); box-shadow: 0 0 32px rgba(0, 243, 255, 0.55), inset 0 0 18px rgba(0, 243, 255, 0.2); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-left">
      <div class="hud-label">SCORE</div>
      <div id="score" class="hud-score">0</div>
      <div id="combo" class="combo"></div>
    </div>
    <div class="hud-center">
      <div class="hud-label">BEST</div>
      <div id="best" class="hud-best">0</div>
      <div id="level" class="hud-level">LV.1</div>
    </div>
    <div class="hud-right">
      <div id="hearts" class="hud-hearts"></div>
      <div id="effects" class="effects"></div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="overlay" class="hidden">
    <div class="panel">
      <h1>游戏结束</h1>
      <div class="final"><span>SCORE</span><b id="finalScore">0</b></div>
      <div class="final"><span>BEST</span><b id="finalBest">0</b></div>
      <div id="newBest" class="newbest hidden">★ 新纪录 ★</div>
      <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
 * 霓虹碎块 · Neon Breaker
 * 单文件赛博朋克打砖块：蓄力发射 / 5种砖块 / 6种道具 / 连击 / 6关卡
 * ===================================================================== */

/* ---------------------------- CONFIG（全部可调参数） ---------------------------- */
const CONFIG = {
  // 基础
  WIDTH: 1280, HEIGHT: 720,          // 16:9 固定逻辑分辨率
  BEST_KEY: 'neonBreakerBestV1',     // localStorage 键
  SOUND: true, VOL: 0.55, GLOW: true,
  // 挡板
  PADDLE_Y: 656, PADDLE_H: 16, PADDLE_BASE_W: 130,
  MAGNET_RANGE: 25,                  // 挡板边缘 25px 磁力吸附区
  MAGNET_FORCE: 300,                 // 微弱吸附加速度
  PADDLE_MAX_ANGLE: 1.05,            // 边缘反弹最大角度(rad ≈ 60°)
  // 小球
  BALL_R: 8, BALL_TRAIL: 8,          // 8 帧拖尾
  BALL_BASE_SPEED: 540, BALL_MAX_SPEED: 980,
  BALL_SPEEDUP: 0.012,               // 每次碰挡板提速 1.2%
  // 蓄力发射
  CHARGE_TIME: 1.1,                  // 蓄满所需秒数
  CHARGE_MIN_SPEED: 460, CHARGE_MAX_SPEED: 940,
  // 砖块
  COLS: 12, BRICK_TOP: 88, BRICK_H: 26, BRICK_GAP: 7, BRICK_SIDE: 64,
  BRICK_POINTS: { normal: 10, solid: 20, gold: 15, explosive: 12, metal: 0 },
  // 连击
  COMBO_WINDOW: 2.0,                 // 2 秒连击窗口
  COMBO_MULT_PER: 0.1,               // 每连击 +10% 分数
  COMBO_MAX_MULT: 3,                 // 倍率上限
  COMBO_EVERY: 5,                    // 每 5 连击触发全屏金色冲击波
  // 生命
  START_LIVES: 3, MAX_LIVES: 5,
  // 道具
  EXTEND_TIME: 10, EXTEND_AMOUNT: 50,
  FIRE_TIME: 8, SLOWMO_TIME: 5, SLOWMO_SCALE: 0.45,
  LASER_TIME: 8, LASER_INTERVAL: 0.35,
  MAX_BALLS: 6,
  // 视觉
  STAR_COUNT: 130, PARTICLE_GRAVITY: 520,
  SHAKE_DECAY: 6,
};

/* ---------------------------- 常量 ---------------------------- */
const BRICK_COLORS = { normal: '#39ff6a', solid: '#2a9dff', gold: '#ffd24a', explosive: '#ff7a1a', metal: '#a55dff' };
const LAYOUTS = ['standard', 'diamond', 'checker', 'v', 'border', 'pyramid'];
const POWERUPS = {
  extend: { color: '#00f5d4', label: '加长板',   symbol: '↔' },
  multi:  { color: '#ff2a6d', label: '多球分裂', symbol: '×3' },
  life:   { color: '#ff4757', label: '额外生命', symbol: '♥' },
  fire:   { color: '#ff7a1a', label: '火焰球',   symbol: 'F' },
  slow:   { color: '#7ab8ff', label: '慢动作',   symbol: 'S' },
  laser:  { color: '#b04dff', label: '激光炮',   symbol: 'L' },
};
const POWERUP_POOL = ['extend', 'extend', 'multi', 'fire', 'fire', 'slow', 'laser', 'laser', 'life'];

/* ---------------------------- 工具函数 ---------------------------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(x) { const t = 1 - x; return 1 - t * t * t; }
function lighten(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const m = c => Math.round(c + (255 - c) * k);
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}
function rr(x, y, w, h, r) { // 圆角矩形路径
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------------------- 音效引擎（Web Audio 程序化生成） ---------------------------- */
const Sound = {
  ctx: null, master: null,
  ensure() {
    if (!CONFIG.SOUND) return false;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { CONFIG.SOUND = false; return false; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = CONFIG.VOL;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  tone(o) {
    if (!this.ensure()) return;
    try {
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(1, o.freq), t0);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.slide), t0 + o.dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t0 + (o.a || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + o.dur + 0.05);
    } catch (e) { /* 忽略音频错误 */ }
  },
  noise(o) {
    if (!this.ensure()) return;
    try {
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.2;
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = o.ftype || 'lowpass';
      f.frequency.setValueAtTime(o.freq || 1000, t0);
      if (o.fslide) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.fslide), t0 + dur);
      f.Q.value = o.q || 0.8;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    } catch (e) { /* 忽略音频错误 */ }
  },
  paddle()     { this.tone({ freq: 240, slide: 380, dur: 0.09, type: 'square', vol: 0.16 }); },
  wall()       { this.tone({ freq: 150, dur: 0.05, type: 'sine', vol: 0.1 }); },
  brickHit()   { this.tone({ freq: 520 + Math.random() * 90, dur: 0.05, type: 'triangle', vol: 0.2 }); },
  brickBreak() { this.noise({ dur: 0.13, freq: 2600, fslide: 420, vol: 0.22 }); this.tone({ freq: 320, slide: 95, dur: 0.1, type: 'triangle', vol: 0.14 }); },
  solidHit()   { this.tone({ freq: 135, dur: 0.07, type: 'square', vol: 0.2 }); this.noise({ dur: 0.05, freq: 4200, ftype: 'highpass', vol: 0.1 }); },
  solidBreak() { this.noise({ dur: 0.26, freq: 3000, fslide: 280, vol: 0.3 }); this.tone({ freq: 170, slide: 55, dur: 0.2, type: 'sawtooth', vol: 0.14 }); },
  metal()      { this.tone({ freq: 92, dur: 0.09, type: 'square', vol: 0.15 }); this.noise({ dur: 0.045, freq: 5200, ftype: 'highpass', vol: 0.09 }); },
  gold()       { [880, 1174, 1568].forEach((f, i) => this.tone({ freq: f, dur: 0.09, type: 'sine', vol: 0.15, delay: i * 0.05 })); },
  explosion()  { this.noise({ dur: 0.5, freq: 900, fslide: 75, vol: 0.4 }); this.tone({ freq: 115, slide: 38, dur: 0.42, type: 'sine', vol: 0.3 }); },
  laser()      { this.tone({ freq: 1450, slide: 210, dur: 0.12, type: 'sawtooth', vol: 0.11 }); },
  launch()     { this.noise({ dur: 0.18, freq: 600, fslide: 3400, vol: 0.16 }); this.tone({ freq: 220, slide: 680, dur: 0.16, type: 'triangle', vol: 0.15 }); },
  powerup()    { [523, 659, 784, 1046].forEach((f, i) => this.tone({ freq: f, dur: 0.08, type: 'triangle', vol: 0.15, delay: i * 0.04 })); },
  combo(tier)  { const base = 380 + tier * 60; [0, 4, 7, 12].forEach((st, i) => this.tone({ freq: base * Math.pow(2, st / 12), dur: 0.3, type: 'square', vol: 0.11, delay: i * 0.03 })); this.noise({ dur: 0.28, freq: 5200, ftype: 'highpass', vol: 0.07 }); },
  lifeLost()   { [400, 300, 220, 150].forEach((f, i) => this.tone({ freq: f, dur: 0.12, type: 'sawtooth', vol: 0.13, delay: i * 0.09 })); },
  gameOver()   { [330, 262, 196, 131].forEach((f, i) => this.tone({ freq: f, dur: 0.26, type: 'triangle', vol: 0.16, delay: i * 0.17 })); },
  levelUp()    { [262, 330, 392, 523, 659, 784].forEach((f, i) => this.tone({ freq: f, dur: 0.12, type: 'square', vol: 0.11, delay: i * 0.06 })); },
};

/* ---------------------------- 全局状态 ---------------------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elLevel = document.getElementById('level');
const elHearts = document.getElementById('hearts');
const elCombo = document.getElementById('combo');
const elEffects = document.getElementById('effects');
const overlay = document.getElementById('overlay');
const elFinalScore = document.getElementById('finalScore');
const elFinalBest = document.getElementById('finalBest');
const elNewBest = document.getElementById('newBest');

let state = 'serve';           // serve | play | over
let score = 0, best = 0, lives = CONFIG.START_LIVES, level = 1;
let bricks = [], brickMap = {}, balls = [], powerups = [], particles = [], floaters = [], rings = [], lasers = [];
let paddle = { x: CONFIG.WIDTH / 2, targetX: CONFIG.WIDTH / 2, w: CONFIG.PADDLE_BASE_W, pulse: 0 };
let charging = false, charge = 0;
let combo = 0, comboTimer = 0;
let shake = 0, flashA = 0, timeScale = 1;
let fireT = 0, slowmoT = 0, laserT = 0, laserCd = 0, extendT = 0;
let clearing = false, clearT = 0;
let animT = 0;
let isNewBest = false;
let activePointer = null;
let lastScore = -1, lastBest = -1, lastLevel = -1, lastLives = -1, lastCombo = -1, lastChipSig = '';
const destroyQueue = [];
const stars = [];

/* ---------------------------- 画布与缩放 ---------------------------- */
function setupCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = CONFIG.WIDTH * dpr;
  canvas.height = CONFIG.HEIGHT * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resize() {
  const wrap = document.getElementById('wrap');
  const scale = Math.min(window.innerWidth / CONFIG.WIDTH, window.innerHeight / CONFIG.HEIGHT);
  const w = Math.round(CONFIG.WIDTH * scale), h = Math.round(CONFIG.HEIGHT * scale);
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  wrap.style.fontSize = (16 * scale) + 'px';
}

/* ---------------------------- 初始化 ---------------------------- */
function initStars() {
  stars.length = 0;
  for (let i = 0; i < CONFIG.STAR_COUNT; i++) {
    const a = Math.random() * Math.PI * 2;
    stars.push({
      a: a,
      rx: 180 + Math.random() * 520,
      ry: 130 + Math.random() * 380,
      cx: CONFIG.WIDTH / 2, cy: CONFIG.HEIGHT / 2 - 40,
      rot: (Math.random() < 0.5 ? -1 : 1) * (0.008 + Math.random() * 0.022),
      tw: 1 + Math.random() * 2.5,
      ph: Math.random() * Math.PI * 2,
      base: 0.3 + Math.random() * 0.7,
      size: Math.random() < 0.85 ? 1.5 : 2.5,
      color: Math.random() < 0.7 ? '#cfe8ff' : (Math.random() < 0.5 ? '#ffd9ec' : '#d9fff4'),
    });
  }
}
function loadBest() {
  try { best = parseInt(localStorage.getItem(CONFIG.BEST_KEY) || '0', 10) || 0; }
  catch (e) { best = 0; }
}
function saveBest() {
  try { localStorage.setItem(CONFIG.BEST_KEY, String(best)); } catch (e) { /* 忽略 */ }
}
function newBall() {
  return { x: paddle.x, y: CONFIG.PADDLE_Y - CONFIG.BALL_R - 2, vx: 0, vy: 0, r: CONFIG.BALL_R, trail: [], attached: true, magnet: false };
}

/* ---------------------------- 关卡生成（6 种布局循环） ---------------------------- */
function makeLayout(name) {
  const R = 8, C = CONFIG.COLS;
  const g = [];
  for (let r = 0; r < R; r++) g.push(new Array(C).fill(false));
  const mid = (C - 1) / 2; // 5.5
  if (name === 'standard') {                 // 标准：完整 5 行矩形
    for (let r = 0; r < 5; r++) for (let c = 0; c < C; c++) g[r][c] = true;
  } else if (name === 'diamond') {           // 菱形
    const half = [0.6, 1.7, 2.9, 3.7, 2.9, 1.7, 0.6];
    for (let r = 0; r < 7; r++)
      for (let c = 0; c < C; c++) if (Math.abs(c - mid) <= half[r]) g[r][c] = true;
  } else if (name === 'checker') {           // 棋盘
    for (let r = 0; r < 7; r++)
      for (let c = 0; c < C; c++) if ((r + c) % 2 === 0) g[r][c] = true;
  } else if (name === 'v') {                 // V 字
    for (let r = 0; r < 7; r++) {
      const t = r / 6;
      const cl = Math.round(t * 4.5), cr = C - 1 - cl;
      g[r][cl] = true; g[r][cr] = true;
      if (r > 1 && r < 6) { if (cl + 1 <= C - 1) g[r][cl + 1] = true; if (cr - 1 >= 0) g[r][cr - 1] = true; }
    }
  } else if (name === 'border') {            // 边框（空心矩形）
    for (let r = 0; r < 7; r++)
      for (let c = 0; c < C; c++) if (r === 0 || r === 6 || c === 0 || c === C - 1) g[r][c] = true;
  } else if (name === 'pyramid') {           // 金字塔
    for (let r = 0; r < 7; r++) {
      const half = 0.55 + r * 0.93;
      for (let c = 0; c < C; c++) if (Math.abs(c - mid) <= half) g[r][c] = true;
    }
  }
  return g;
}
function buildLevel(lv) {
  bricks = []; brickMap = {};
  powerups = []; lasers = [];
  const name = LAYOUTS[(lv - 1) % LAYOUTS.length];
  const grid = makeLayout(name);
  const t = lv - 1;
  // 关卡越高：坚固/爆炸/金属砖概率越高
  const wSolid = Math.min(12 + t * 2.5, 38);
  const wGold = 9;
  const wExpl = Math.min(8 + t * 1.5, 24);
  const wMetal = Math.min(6 + t * 1.2, 18);
  const wNormal = 46;
  const bw = (CONFIG.WIDTH - 2 * CONFIG.BRICK_SIDE - (CONFIG.COLS - 1) * CONFIG.BRICK_GAP) / CONFIG.COLS;
  const placed = [];
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      if (!grid[r][c]) continue;
      const roll = Math.random() * (wNormal + wSolid + wGold + wExpl + wMetal);
      let type = 'normal';
      if (roll < wNormal) type = 'normal';
      else if (roll < wNormal + wSolid) type = 'solid';
      else if (roll < wNormal + wSolid + wGold) type = 'gold';
      else if (roll < wNormal + wSolid + wGold + wExpl) type = 'explosive';
      else type = 'metal';
      placed.push({ r: r, c: c, type: type });
    }
  }
  // 保证至少 3 块黄金砖（道具来源）
  let goldCount = placed.filter(p => p.type === 'gold').length;
  let guard = 0;
  while (goldCount < 3 && guard++ < 300) {
    const cand = placed.filter(p => p.type === 'normal');
    if (!cand.length) break;
    const pick = cand[(Math.random() * cand.length) | 0];
    if (pick.type !== 'normal') continue;
    pick.type = 'gold'; goldCount++;
  }
  // 坚固砖血量随关卡提升（2 → 最多 5）
  const solidHp = Math.min(2 + Math.floor(t / 3), 5);
  placed.forEach(function (p) {
    const b = {
      row: p.r, col: p.c,
      x: CONFIG.BRICK_SIDE + p.c * (bw + CONFIG.BRICK_GAP),
      y: CONFIG.BRICK_TOP + p.r * (CONFIG.BRICK_H + CONFIG.BRICK_GAP),
      w: bw, h: CONFIG.BRICK_H,
      type: p.type,
      hp: p.type === 'solid' ? solidHp : 1,
      maxHp: p.type === 'solid' ? solidHp : 1,
      points: CONFIG.BRICK_POINTS[p.type],
      alive: true, anim: 0, flash: 0, _q: false,
      delay: 0.15 + (p.r * CONFIG.COLS + p.c) * 0.022 + Math.random() * 0.05, // 序列延迟入场
    };
    bricks.push(b);
    brickMap[b.row * CONFIG.COLS + b.col] = b;
  });
  floaters.push({
    x: CONFIG.WIDTH / 2, y: CONFIG.HEIGHT / 2 - 50,
    text: 'LEVEL ' + lv, color: '#ffd24a', size: 42,
    life: 1.7, maxLife: 1.7, vy: -16,
  });
}
function neighborsOf(b) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nb = brickMap[(b.row + dr) * CONFIG.COLS + (b.col + dc)];
      if (nb) out.push(nb);
    }
  }
  return out;
}

/* ---------------------------- 砖块伤害与摧毁 ---------------------------- */
function queueDestroy(b) {
  if (b.alive && !b._q) { b._q = true; destroyQueue.push(b); }
}
function processDestroys() {
  while (destroyQueue.length) {
    const b = destroyQueue.shift();
    b._q = false;
    if (b.alive) destroyBrick(b);
  }
}
function damageBrick(b, dmg) {
  if (!b || !b.alive) return;
  if (b.type === 'metal') { // 金属砖不可摧毁，只弹回
    b.flash = 1;
    Sound.metal();
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#d9b3ff', 4, true);
    return;
  }
  b.hp -= dmg;
  b.flash = 1;
  if (b.hp <= 0) queueDestroy(b);
  else Sound.solidHit();
}
function comboMilestone(n) {
  rings.push({ x: CONFIG.WIDTH / 2, y: CONFIG.HEIGHT / 2, r: 30, vr: 1500, maxR: 1650, alpha: 1, color: '#ffd24a', w: 10 });
  rings.push({ x: CONFIG.WIDTH / 2, y: CONFIG.HEIGHT / 2, r: 10, vr: 1050, maxR: 1650, alpha: 0.8, color: '#fff3b0', w: 5 });
  flashA = 0.32;
  shake = Math.max(shake, 8);
  const bonus = n * 15;
  score += bonus;
  if (score > best) { best = score; isNewBest = true; saveBest(); }
  floaters.push({ x: CONFIG.WIDTH / 2, y: 215, text: n + ' COMBO! +' + bonus, color: '#ffd24a', size: 34, life: 1.3, maxLife: 1.3, vy: -10 });
  Sound.combo(n / CONFIG.COMBO_EVERY);
}
function destroyBrick(b) {
  b.alive = false;
  // 连击累积
  combo++;
  comboTimer = CONFIG.COMBO_WINDOW;
  const mult = 1 + Math.min(combo * CONFIG.COMBO_MULT_PER, CONFIG.COMBO_MAX_MULT - 1);
  const pts = Math.round(b.points * mult);
  score += pts;
  if (score > best) { best = score; isNewBest = true; saveBest(); }
  floaters.push({
    x: b.x + b.w / 2, y: b.y + b.h / 2,
    text: '+' + pts + (mult > 1 ? ' ×' + mult.toFixed(1) : ''),
    color: BRICK_COLORS[b.type], size: 16, life: 0.8, maxLife: 0.8, vy: -62,
  });
  spawnParticles(b.x + b.w / 2, b.y + b.h / 2, BRICK_COLORS[b.type], 15 + ((Math.random() * 11) | 0), false);
  shake = Math.max(shake, b.type === 'explosive' ? 9 : 3.5);
  if (b.type === 'explosive') {           // 爆炸砖：连锁摧毁周围
    rings.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, r: 8, vr: 620, maxR: 200, alpha: 0.9, color: '#ff7a1a', w: 6 });
    Sound.explosion();
    neighborsOf(b).forEach(n => damageBrick(n, 2));
  } else if (b.type === 'solid') {         // 坚固砖：碎时释放冲击波
    rings.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, r: 6, vr: 380, maxR: 95, alpha: 0.5, color: '#2a9dff', w: 4 });
    Sound.solidBreak();
    neighborsOf(b).forEach(n => damageBrick(n, 1));
  } else if (b.type === 'gold') {           // 黄金砖：必掉道具
    Sound.gold();
    spawnPowerup(b.x + b.w / 2, b.y + b.h / 2);
  } else {
    Sound.brickBreak();
  }
  if (combo > 0 && combo % CONFIG.COMBO_EVERY === 0) comboMilestone(combo);
}

/* ---------------------------- 道具 ---------------------------- */
function spawnPowerup(x, y) {
  const type = POWERUP_POOL[(Math.random() * POWERUP_POOL.length) | 0];
  powerups.push({ x: x, y: y, type: type, vy: 150, spin: Math.random() * 6 });
}
function applyPowerup(type) {
  const def = POWERUPS[type];
  Sound.powerup();
  floaters.push({ x: paddle.x, y: CONFIG.PADDLE_Y - 56, text: def.label + '!', color: def.color, size: 24, life: 1.2, maxLife: 1.2, vy: -34 });
  switch (type) {
    case 'extend': extendT = CONFIG.EXTEND_TIME; break;
    case 'multi':  splitBalls(); break;
    case 'life':   lives = Math.min(lives + 1, CONFIG.MAX_LIVES); break;
    case 'fire':   fireT = CONFIG.FIRE_TIME; break;
    case 'slow':   slowmoT = CONFIG.SLOWMO_TIME; break;
    case 'laser':  laserT = CONFIG.LASER_TIME; laserCd = 0; break;
  }
}
function splitBalls() {
  const src = balls.filter(b => !b.attached);
  const add = [];
  for (let i = 0; i < src.length; i++) {
    if (balls.length + add.length >= CONFIG.MAX_BALLS) break;
    const b = src[i];
    const sp = Math.hypot(b.vx, b.vy) || 1;
    const base = Math.atan2(b.vy, b.vx);
    [-0.5, 0.5].forEach(function (da) {
      add.push({
        x: b.x, y: b.y,
        vx: Math.cos(base + da) * sp, vy: Math.sin(base + da) * sp,
        r: CONFIG.BALL_R, trail: [], attached: false, magnet: false,
      });
    });
  }
  balls = balls.concat(add);
}

/* ---------------------------- 小球运动 ---------------------------- */
function collideWalls(b) {
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); Sound.wall(); }
  else if (b.x > CONFIG.WIDTH - b.r) { b.x = CONFIG.WIDTH - b.r; b.vx = -Math.abs(b.vx); Sound.wall(); }
  if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); Sound.wall(); }
}
function magnetPull(b, sdt) {
  b.magnet = false;
  if (b.vy <= 0) return;
  if (b.y < CONFIG.PADDLE_Y - 150 || b.y > CONFIG.PADDLE_Y) return;
  const half = paddle.w / 2;
  const dist = Math.abs(b.x - paddle.x);
  const inner = half - 14, outer = half + CONFIG.MAGNET_RANGE;
  if (dist > inner && dist < outer) {
    const k = 1 - (dist - inner) / (outer - inner);
    b.vx += Math.sign(paddle.x - b.x) * CONFIG.MAGNET_FORCE * k * sdt; // 微弱吸附
    b.magnet = true;
  }
}
function collidePaddle(b) {
  if (b.vy <= 0) return;
  const half = paddle.w / 2;
  if (b.y + b.r < CONFIG.PADDLE_Y || b.y - b.r > CONFIG.PADDLE_Y + CONFIG.PADDLE_H + 8) return;
  if (b.x < paddle.x - half - b.r || b.x > paddle.x + half + b.r) return;
  // 撞击位置决定反弹角度（边缘最大 60°）
  const offset = clamp((b.x - paddle.x) / half, -1, 1);
  const ang = offset * CONFIG.PADDLE_MAX_ANGLE;
  const sp = Math.min(Math.hypot(b.vx, b.vy) * (1 + CONFIG.BALL_SPEEDUP), CONFIG.BALL_MAX_SPEED);
  b.vx = Math.sin(ang) * sp;
  b.vy = -Math.cos(ang) * sp;
  b.y = CONFIG.PADDLE_Y - b.r - 1;
  paddle.pulse = 1;
  spawnParticles(b.x, CONFIG.PADDLE_Y, '#00f3ff', 5, true);
  Sound.paddle();
}
function collideBricks(b) {
  for (let i = 0; i < bricks.length; i++) {
    const br = bricks[i];
    if (!br.alive || br.anim < 0.3) continue;
    const cx = clamp(b.x, br.x, br.x + br.w);
    const cy = clamp(b.y, br.y, br.y + br.h);
    const dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > b.r * b.r) continue;
    if (fireT > 0 && br.type !== 'metal') {  // 火焰球：穿透（金属除外）
      damageBrick(br, 999);
      continue;
    }
    let nx, ny;
    if (dx === 0 && dy === 0) {             // 球心陷入砖内：沿最小穿透轴弹出
      const l = b.x - br.x, rgt = br.x + br.w - b.x, tp = b.y - br.y, bt = br.y + br.h - b.y;
      const m = Math.min(l, rgt, tp, bt);
      if (m === l) { nx = -1; ny = 0; } else if (m === rgt) { nx = 1; ny = 0; }
      else if (m === tp) { nx = 0; ny = -1; } else { nx = 0; ny = 1; }
    } else {
      const len = Math.hypot(dx, dy) || 1;
      nx = dx / len; ny = dy / len;
    }
    const dot = b.vx * nx + b.vy * ny;
    if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
    // 防止轨迹过平
    const sp = Math.hypot(b.vx, b.vy) || 1;
    if (Math.abs(b.vy) < sp * 0.16) {
      b.vy = (b.vy < 0 ? -1 : 1) * sp * 0.16;
      b.vx = Math.sign(b.vx || 1) * Math.sqrt(Math.max(sp * sp - b.vy * b.vy, 0));
    }
    b.x = cx + nx * (b.r + 0.6);
    b.y = cy + ny * (b.r + 0.6);
    damageBrick(br, 1);
    break; // 每帧每球只处理一次碰撞
  }
}
function moveBall(b, sdt) {
  const dist = Math.hypot(b.vx, b.vy) * sdt;
  const steps = Math.max(1, Math.ceil(dist / 5)); // 子步防止高速穿透
  const s2 = sdt / steps;
  for (let s = 0; s < steps; s++) {
    b.x += b.vx * s2;
    b.y += b.vy * s2;
    collideWalls(b);
    magnetPull(b, s2);
    collidePaddle(b);
    collideBricks(b);
    if (b.y - b.r > CONFIG.HEIGHT + 30) break;
  }
}

/* ---------------------------- 粒子 / 浮动文字 / 冲击波环 ---------------------------- */
function spawnParticles(x, y, color, count, small) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (small ? 60 : 130) + Math.random() * (small ? 120 : 260);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
      life: 0, maxLife: 0.45 + Math.random() * 0.45,
      size: (small ? 1.5 : 2.5) + Math.random() * (small ? 2 : 3),
      color: color,
    });
  }
}
function updateParticles(sdt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += sdt;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    p.vy += CONFIG.PARTICLE_GRAVITY * sdt; // 重力下落
    p.x += p.vx * sdt;
    p.y += p.vy * sdt;
  }
}
function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life += dt;
    f.y += f.vy * dt;
    if (f.life >= f.maxLife) floaters.splice(i, 1);
  }
}
function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.vr * dt;
    if (r.r >= r.maxR) rings.splice(i, 1);
  }
}

/* ---------------------------- 激光 ---------------------------- */
function updateLasers(sdt) {
  if (laserT > 0 && state === 'play') {
    laserCd -= sdt;
    if (laserCd <= 0) {
      laserCd = CONFIG.LASER_INTERVAL;
      lasers.push({ x: paddle.x - paddle.w / 2 + 16, y: CONFIG.PADDLE_Y, vy: -1150 });
      lasers.push({ x: paddle.x + paddle.w / 2 - 16, y: CONFIG.PADDLE_Y, vy: -1150 });
      Sound.laser();
    }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.y += l.vy * sdt;
    let dead = l.y < -30;
    if (!dead) {
      for (let j = 0; j < bricks.length; j++) {
        const b = bricks[j];
        if (!b.alive || b.anim < 0.3) continue;
        if (l.x > b.x - 2 && l.x < b.x + b.w + 2 && l.y > b.y && l.y < b.y + b.h) {
          damageBrick(b, 1);
          spawnParticles(l.x, l.y, '#9ff3ff', 5, true);
          dead = true;
          break;
        }
      }
    }
    if (dead) lasers.splice(i, 1);
  }
}

/* ---------------------------- 主更新 ---------------------------- */
function update(dt) {
  animT += dt;
  // 子弹时间
  const targetScale = slowmoT > 0 ? CONFIG.SLOWMO_SCALE : 1;
  timeScale += (targetScale - timeScale) * Math.min(1, dt * 8);
  const sdt = dt * timeScale;

  // 计时器（真实时间）
  if (fireT > 0) fireT -= dt;
  if (slowmoT > 0) slowmoT -= dt;
  if (laserT > 0) laserT -= dt;
  if (extendT > 0) extendT -= dt;
  if (comboTimer > 0) { comboTimer -= sdt; if (comboTimer <= 0) combo = 0; }
  if (flashA > 0) flashA = Math.max(0, flashA - dt * 1.4);
  if (shake > 0) { shake *= Math.exp(-CONFIG.SHAKE_DECAY * dt); if (shake < 0.1) shake = 0; }
  paddle.pulse = Math.max(0, paddle.pulse - dt * 4);

  // 挡板跟随 + 加长板平滑过渡
  const targetW = CONFIG.PADDLE_BASE_W + (extendT > 0 ? CONFIG.EXTEND_AMOUNT : 0);
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);
  const k = 1 - Math.pow(0.0001, dt);
  paddle.x += (paddle.targetX - paddle.x) * k;
  const halfW = paddle.w / 2;
  paddle.x = clamp(paddle.x, halfW + 4, CONFIG.WIDTH - halfW - 4);

  // 蓄力
  if (charging) charge = Math.min(1, charge + dt / CONFIG.CHARGE_TIME);

  // 砖块入场动画与受击闪光
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (!b.alive) continue;
    if (b.delay > 0) b.delay -= sdt;
    else if (b.anim < 1) b.anim = Math.min(1, b.anim + sdt / 0.3);
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 5);
  }

  // 小球
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.attached) {
      b.x = paddle.x;
      b.y = CONFIG.PADDLE_Y - b.r - 2;
      continue;
    }
    moveBall(b, sdt);
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > CONFIG.BALL_TRAIL) b.trail.shift();
    if (b.y - b.r > CONFIG.HEIGHT + 24) balls.splice(i, 1);
  }
  processDestroys();

  // 掉球
  if (balls.length === 0 && state === 'play' && !clearing) loseLife();

  // 过关判定
  if (!clearing && state === 'play') {
    let remaining = 0;
    for (let i = 0; i < bricks.length; i++) {
      if (bricks[i].alive && bricks[i].type !== 'metal') { remaining = 1; break; }
    }
    if (remaining === 0) {
      clearing = true;
      clearT = 1.5;
      const bonus = 100 * level;
      score += bonus;
      if (score > best) { best = score; isNewBest = true; saveBest(); }
      floaters.push({ x: CONFIG.WIDTH / 2, y: CONFIG.HEIGHT / 2, text: 'LEVEL CLEAR +' + bonus, color: '#ffd24a', size: 30, life: 1.5, maxLife: 1.5, vy: -12 });
      Sound.levelUp();
    }
  }
  if (clearing) {
    clearT -= dt;
    if (clearT <= 0) {
      clearing = false;
      level++;
      buildLevel(level);
      balls = [newBall()];
      state = 'serve';
    }
  }

  updateLasers(sdt);
  processDestroys();
  // 道具下落与拾取
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * sdt;
    p.spin += sdt * 3;
    if (p.y + 12 >= CONFIG.PADDLE_Y && p.y - 12 <= CONFIG.PADDLE_Y + CONFIG.PADDLE_H &&
        Math.abs(p.x - paddle.x) <= paddle.w / 2 + 12) {
      applyPowerup(p.type);
      powerups.splice(i, 1);
      continue;
    }
    if (p.y > CONFIG.HEIGHT + 24) powerups.splice(i, 1);
  }

  updateParticles(sdt);
  updateFloaters(dt);
  updateRings(dt);
  updateHUD();
}

function loseLife() {
  lives--;
  shake = 14;
  Sound.lifeLost();
  floaters.push({ x: CONFIG.WIDTH / 2, y: CONFIG.HEIGHT / 2 + 40, text: '-1 ♥', color: '#ff4757', size: 30, life: 1.2, maxLife: 1.2, vy: -18 });
  if (lives <= 0) {
    gameOver();
  } else {
    balls = [newBall()];
    state = 'serve';
  }
}
function gameOver() {
  state = 'over';
  charging = false; charge = 0;
  saveBest();
  elFinalScore.textContent = score;
  elFinalBest.textContent = best;
  elNewBest.classList.toggle('hidden', !isNewBest || score <= 0);
  overlay.classList.remove('hidden');
  Sound.gameOver();
}
function restart() {
  score = 0; lives = CONFIG.START_LIVES; level = 1;
  combo = 0; comboTimer = 0; isNewBest = false;
  fireT = 0; slowmoT = 0; laserT = 0; laserCd = 0; extendT = 0;
  timeScale = 1; shake = 0; flashA = 0;
  charging = false; charge = 0; clearing = false; clearT = 0;
  particles = []; floaters = []; rings = []; lasers = []; powerups = [];
  paddle.x = paddle.targetX = CONFIG.WIDTH / 2;
  paddle.w = CONFIG.PADDLE_BASE_W; paddle.pulse = 0;
  buildLevel(level);
  balls = [newBall()];
  state = 'serve';
  lastScore = -1; lastBest = -1; lastLevel = -1; lastLives = -1; lastCombo = -1; lastChipSig = '';
  overlay.classList.add('hidden');
  updateHUD();
}

/* ---------------------------- HUD ---------------------------- */
function updateHUD() {
  if (score !== lastScore) {
    lastScore = score;
    elScore.textContent = score;
    elScore.classList.remove('pop');
    void elScore.offsetWidth;
    elScore.classList.add('pop');
  }
  if (best !== lastBest) { lastBest = best; elBest.textContent = best; }
  if (level !== lastLevel) { lastLevel = level; elLevel.textContent = 'LV.' + level; }
  if (lives !== lastLives) {
    lastLives = lives;
    let h = '';
    for (let i = 0; i < CONFIG.MAX_LIVES; i++) h += i < lives ? '<span class="on">♥</span>' : '<span class="off">♥</span>';
    elHearts.innerHTML = h;
  }
  if (combo !== lastCombo) {
    lastCombo = combo;
    if (combo >= 2 && comboTimer > 0) {
      elCombo.textContent = 'COMBO ×' + combo;
      elCombo.classList.add('show');
      elCombo.classList.remove('pop');
      void elCombo.offsetWidth;
      elCombo.classList.add('pop');
    } else {
      elCombo.classList.remove('show');
    }
  }
  // 生效中的道具芯片
  const chips = [];
  if (fireT > 0) chips.push(['火焰球', '#ff7a1a', fireT]);
  if (slowmoT > 0) chips.push(['慢动作', '#7ab8ff', slowmoT]);
  if (laserT > 0) chips.push(['激光炮', '#b04dff', laserT]);
  if (extendT > 0) chips.push(['加长板', '#00f5d4', extendT]);
  const sig = chips.map(function (c) { return c[0] + Math.ceil(c[2]); }).join('|');
  if (sig !== lastChipSig) {
    lastChipSig = sig;
    elEffects.innerHTML = chips.map(function (c) {
      return '<span class="chip" style="border-color:' + c[1] + ';color:' + c[1] + '">' + c[0] + ' ' + Math.ceil(c[2]) + 's</span>';
    }).join('');
  }
}

/* ---------------------------- 渲染 ---------------------------- */
function drawBackground() {
  const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04041a');
  g.addColorStop(0.55, '#0c0630');
  g.addColorStop(1, '#180b3d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 动态星云（色相随时间旋转）
  const blobs = [
    { bx: 0.20, by: 0.28, r: 0.45, off: 0,   sp: 0.13, a: 0.10 },
    { bx: 0.78, by: 0.22, r: 0.40, off: 130, sp: 0.09, a: 0.08 },
    { bx: 0.55, by: 0.72, r: 0.48, off: 250, sp: 0.11, a: 0.09 },
    { bx: 0.10, by: 0.80, r: 0.30, off: 60,  sp: 0.15, a: 0.06 },
  ];
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const x = (b.bx + 0.10 * Math.sin(animT * b.sp * Math.PI * 2 + b.off)) * W;
    const y = (b.by + 0.08 * Math.cos(animT * b.sp * Math.PI * 2 * 0.8 + b.off)) * H;
    const hue = Math.floor(animT * 12 + b.off) % 360;
    const rad = b.r * H;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, 'hsla(' + hue + ',85%,55%,' + b.a + ')');
    rg.addColorStop(1, 'hsla(' + hue + ',85%,55%,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }

  // 缓慢旋转的星星粒子
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const ang = s.a + animT * s.rot;
    const x = s.cx + Math.cos(ang) * s.rx;
    const y = s.cy + Math.sin(ang) * s.ry;
    const tw = 0.45 + 0.55 * Math.sin(animT * s.tw + s.ph);
    ctx.globalAlpha = s.base * tw;
    ctx.fillStyle = s.color;
    ctx.fillRect(x, y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  drawGrid();
}
function drawGrid() {
  const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
  const horizon = H - 150;
  const vpx = W / 2;
  ctx.save();
  ctx.strokeStyle = 'rgba(0,243,255,0.14)';
  ctx.lineWidth = 1;
  for (let i = -10; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(vpx + i * 24, horizon);
    ctx.lineTo(vpx + i * 152, H);
    ctx.stroke();
  }
  const N = 7;
  for (let i = 0; i < N; i++) {
    const p = (i + (animT * 0.35) % 1) / N;
    const y = horizon + Math.pow(p, 2.1) * (H - horizon);
    ctx.globalAlpha = 0.05 + p * 0.15;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = 'rgba(0,243,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  ctx.lineTo(W, horizon);
  ctx.stroke();
  ctx.restore();
}
function drawBricks() {
  const t = animT;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (!b.alive || b.delay > 0) continue;
    let a = 1, y = b.y;
    if (b.anim < 1) {
      const e = easeOutCubic(b.anim); // 滑入
      y = b.y - (1 - e) * 90;
      a = e;
    }
    ctx.save();
    ctx.globalAlpha = a;
    const color = BRICK_COLORS[b.type];
    if (CONFIG.GLOW) { ctx.shadowColor = color; ctx.shadowBlur = 10; }
    const g = ctx.createLinearGradient(0, y, 0, y + b.h);
    g.addColorStop(0, lighten(color, 0.28));
    g.addColorStop(1, color);
    rr(b.x, y, b.w, b.h, 5);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 1;
    rr(b.x + 1, y + 1, b.w - 2, b.h - 2, 4);
    ctx.stroke();

    if (b.type === 'solid') {
      // 血量指示点
      for (let k = 0; k < b.maxHp; k++) {
        ctx.fillStyle = k < b.hp ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(b.x + 11 + k * 9, y + b.h - 7, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (b.hp < b.maxHp) { // 裂纹
        ctx.strokeStyle = 'rgba(0,20,40,0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, y + 3);
        ctx.lineTo(b.x + b.w * 0.45, y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.37, y + b.h - 3);
        ctx.stroke();
      }
    } else if (b.type === 'gold') {
      const tw = 0.6 + 0.4 * Math.sin(t * 5 + b.col);
      ctx.globalAlpha = a * tw;
      ctx.fillStyle = '#ffffff';
      const cx = b.x + b.w / 2, cy = y + b.h / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 7); ctx.lineTo(cx + 2, cy - 2); ctx.lineTo(cx + 7, cy); ctx.lineTo(cx + 2, cy + 2);
      ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 2, cy + 2); ctx.lineTo(cx - 7, cy); ctx.lineTo(cx - 2, cy - 2);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = a;
    } else if (b.type === 'explosive') {
      const pulse = 1 + 0.15 * Math.sin(t * 6 + b.row);
      ctx.fillStyle = 'rgba(120,20,0,0.55)';
      ctx.beginPath(); ctx.arc(b.x + b.w / 2, y + b.h / 2, 6 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w / 2 - 3, y + b.h / 2 - 3);
      ctx.lineTo(b.x + b.w / 2 + 3, y + b.h / 2 + 3);
      ctx.stroke();
    } else if (b.type === 'metal') {
      ctx.strokeStyle = 'rgba(30,10,60,0.5)';
      ctx.lineWidth = 3;
      for (let sx = -b.h; sx < b.w; sx += 12) {
        ctx.beginPath();
        ctx.moveTo(b.x + sx, y + b.h);
        ctx.lineTo(b.x + sx + b.h, y);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      const rivets = [[6, 6], [b.w - 6, 6], [6, b.h - 6], [b.w - 6, b.h - 6]];
      for (let k = 0; k < rivets.length; k++) {
        ctx.beginPath();
        ctx.arc(b.x + rivets[k][0], y + rivets[k][1], 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (b.flash > 0) { // 受击闪光
      ctx.globalAlpha = b.flash * 0.7;
      ctx.fillStyle = '#ffffff';
      rr(b.x, y, b.w, b.h, 5);
      ctx.fill();
    }
    ctx.restore();
  }
}
function drawPaddle() {
  const w = paddle.w;
  const h = CONFIG.PADDLE_H * (1 - paddle.pulse * 0.3);
  const x = paddle.x - w / 2;
  const y = CONFIG.PADDLE_Y + (CONFIG.PADDLE_H - h);
  ctx.save();
  if (CONFIG.GLOW) { ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 18; }
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#8ff8ff');
  g.addColorStop(0.35, '#00f3ff');
  g.addColorStop(1, '#0090b3');
  rr(x, y, w, h, 8);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  // 两端磁吸区高亮
  ctx.fillStyle = 'rgba(255,255,255,' + (0.45 + paddle.pulse * 0.55) + ')';
  rr(x + 3, y + h / 2 - 2, 10, 4, 2); ctx.fill();
  rr(x + w - 13, y + h / 2 - 2, 10, 4, 2); ctx.fill();
  ctx.restore();
}
function drawBalls() {
  const fire = fireT > 0;
  const main = fire ? '#ff7a1a' : '#ff2a6d';
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    if (b.attached) continue;
    // 8 帧拖尾残影
    const tr = b.trail;
    for (let j = 0; j < tr.length; j++) {
      const kk = (j + 1) / tr.length;
      ctx.globalAlpha = kk * 0.3;
      ctx.fillStyle = main;
      ctx.beginPath();
      ctx.arc(tr[j].x, tr[j].y, b.r * (0.35 + 0.65 * kk), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    if (CONFIG.GLOW) { ctx.shadowColor = main; ctx.shadowBlur = 18; }
    ctx.fillStyle = main;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // 磁吸附提示
    if (b.magnet) {
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(animT * 20);
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}
function drawAttachedBall() {
  if (state !== 'serve' || !charging) {
    // 待发小球（蓄力时脉冲放大）
    const b = balls[0];
    if (!b || !b.attached) return;
    const pulse = charging ? 1 + charge * 0.35 + 0.08 * Math.sin(animT * 18) : 1;
    ctx.save();
    if (CONFIG.GLOW) { ctx.shadowColor = '#ff2a6d'; ctx.shadowBlur = 16; }
    ctx.fillStyle = '#ff2a6d';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.38 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    drawBalls();
  }
}
function drawLasers() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < lasers.length; i++) {
    const l = lasers[i];
    if (CONFIG.GLOW) { ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 10; }
    ctx.strokeStyle = 'rgba(0,243,255,0.85)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - 26); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - 26); ctx.stroke();
  }
  ctx.restore();
}
function drawPowerups() {
  for (let i = 0; i < powerups.length; i++) {
    const p = powerups[i];
    const def = POWERUPS[p.type];
    const bob = Math.sin(p.spin) * 2;
    ctx.save();
    if (CONFIG.GLOW) { ctx.shadowColor = def.color; ctx.shadowBlur = 14; }
    ctx.fillStyle = 'rgba(10,10,30,0.92)';
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = def.color;
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.symbol, p.x, p.y + bob + 0.5);
    ctx.restore();
  }
}
function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife); // 淡出
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.restore();
}
function drawRings() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    ctx.globalAlpha = Math.max(0, r.alpha * (1 - r.r / r.maxR));
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.w;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}
function drawFloaters() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    const a = Math.min(1, (f.maxLife - f.life) / 0.3);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + f.size + 'px "Segoe UI","PingFang SC",sans-serif';
    if (CONFIG.GLOW) { ctx.shadowColor = f.color; ctx.shadowBlur = 12; }
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}
function drawPowerBar() {
  if (!charging || charge <= 0) return;
  const w = 300, h = 14;
  const x = CONFIG.WIDTH / 2 - w / 2;
  const y = CONFIG.HEIGHT - 48;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(x - 3, y - 3, w + 6, h + 6, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(0,243,255,0.4)';
  ctx.lineWidth = 1;
  rr(x - 3, y - 3, w + 6, h + 6, 8); ctx.stroke();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#00ff88');
  g.addColorStop(0.5, '#ffe14a');
  g.addColorStop(1, '#ff3b3b');
  ctx.shadowColor = charge >= 1 ? '#ff3b3b' : '#00f3ff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = g;
  rr(x, y, Math.max(6, w * charge), h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('POWER ' + Math.round(charge * 100) + '%', CONFIG.WIDTH / 2, y - 8);
  ctx.restore();
}
function drawOverlays() {
  const W = CONFIG.WIDTH, H = CONFIG.HEIGHT;
  // 火焰球边缘光
  if (fireT > 0) {
    const a = 0.05 + 0.03 * Math.sin(animT * 8);
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78);
    g.addColorStop(0, 'rgba(255,122,26,0)');
    g.addColorStop(1, 'rgba(255,122,26,' + a + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // 子弹时间色调
  if (timeScale < 0.92) {
    ctx.fillStyle = 'rgba(80,140,255,' + (0.92 - timeScale) * 0.5 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // 连击里程碑金色闪屏
  if (flashA > 0) {
    ctx.fillStyle = 'rgba(255,210,74,' + flashA + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // 待发提示
  if (state === 'serve' && !charging) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.35 * Math.sin(animT * 3);
    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 22px "Segoe UI","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    if (CONFIG.GLOW) { ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 12; }
    ctx.fillText('按住蓄力 · 松开发射', CONFIG.WIDTH / 2, CONFIG.PADDLE_Y - 150);
    ctx.restore();
  }
}
function render() {
  ctx.clearRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  drawBackground();
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake); // 屏幕震动
  }
  drawBricks();
  drawLasers();
  drawPowerups();
  drawPaddle();
  drawBalls();
  drawAttachedBall();
  drawRings();
  drawParticles();
  drawFloaters();
  ctx.restore();
  drawOverlays();
  drawPowerBar();
}

/* ---------------------------- 发射 ---------------------------- */
function launchBall() {
  const b = balls[0];
  if (!b || !b.attached) return;
  const speed = lerp(CONFIG.CHARGE_MIN_SPEED, CONFIG.CHARGE_MAX_SPEED, Math.max(0.12, charge));
  const ang = (Math.random() - 0.5) * 0.5;
  b.vx = Math.sin(ang) * speed;
  b.vy = -Math.cos(ang) * speed;
  b.attached = false;
  b.trail.length = 0;
  state = 'play';
  Sound.launch();
  spawnParticles(b.x, b.y, '#ff2a6d', 8, true);
}

/* ---------------------------- 输入（鼠标 + 触屏） ---------------------------- */
function toLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * CONFIG.WIDTH,
    y: (e.clientY - rect.top) / rect.height * CONFIG.HEIGHT,
  };
}
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  Sound.ensure();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  activePointer = e.pointerId;
  const p = toLogical(e);
  paddle.targetX = p.x;
  if (state === 'serve' && !clearing) { charging = true; charge = 0; }
});
canvas.addEventListener('pointermove', function (e) {
  if (e.pointerType === 'mouse') {
    paddle.targetX = toLogical(e).x; // 鼠标悬停即可移动
  } else if (e.pointerId === activePointer) {
    paddle.targetX = toLogical(e).x;
  }
});
function onRelease(e) {
  if (e.pointerId !== activePointer && e.pointerType !== 'mouse') return;
  activePointer = null;
  if (charging) {
    charging = false;
    if (state === 'serve' && !clearing) launchBall();
    charge = 0;
  }
}
canvas.addEventListener('pointerup', onRelease);
canvas.addEventListener('pointercancel', onRelease);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
overlay.addEventListener('pointerdown', function () {
  Sound.ensure();
  if (state === 'over') restart();
});

/* ---------------------------- 主循环 ---------------------------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.0001;
  if (state !== 'over') {
    update(dt);
  } else {
    animT += dt;
    updateParticles(dt);
    updateFloaters(dt);
    updateRings(dt);
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------- 启动 ---------------------------- */
setupCanvas();
resize();
window.addEventListener('resize', resize);
initStars();
loadBest();
buildLevel(level);
balls = [newBall()];
updateHUD();
requestAnimationFrame(frame);
</script>
</body>
