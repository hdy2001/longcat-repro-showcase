<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青崖渡 · 国风古建码头</title>
<style>
  :root {
    --ink: #2e2a24;
    --ink-soft: #6a6355;
    --ink-faint: #8a8172;
    --paper: #f6f2e7;
    --bamboo: #3d5a4c;
    --seal: #b03a2e;
    --font-kai: "Kaiti SC", "KaiTi", "STKaiti", "TW-Kai", "Noto Serif SC", "Songti SC", serif;
    --font-song: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, #f9f5ec 0%, var(--paper) 55%, #efe9d8 100%);
    font-family: var(--font-song);
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }
  #scene { position: fixed; inset: 0; display: block; }

  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* ---------- 左上标题 ---------- */
  .brand { position: absolute; top: 30px; left: 34px; display: flex; align-items: flex-start; gap: 16px; }
  .seal {
    width: 46px; height: 46px; flex: 0 0 auto;
    background: linear-gradient(160deg, #c04433, var(--seal) 60%, #96281b);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(150, 45, 30, .35), inset 0 0 0 2px rgba(255,255,255,.18);
    transform: rotate(-2deg);
  }
  .seal span {
    writing-mode: vertical-rl;
    font-family: var(--font-kai);
    font-size: 21px; font-weight: 700; letter-spacing: 5px;
    color: #f8efe2;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .brand-top { font-size: 12px; letter-spacing: 3px; color: var(--ink-faint); margin-bottom: 6px; }
  .brand h1 {
    font-family: var(--font-kai);
    font-size: 46px; font-weight: 700; letter-spacing: 8px;
    color: var(--ink); line-height: 1.05;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .brand .subtitle { margin-top: 8px; font-size: 14px; letter-spacing: 4px; color: var(--ink-soft); }

  /* ---------- 右侧竖排 ---------- */
  .side { position: absolute; right: 34px; top: 50%; transform: translateY(-50%); text-align: center; }
  .side .vline { width: 1px; height: 44px; background: #c9c0a8; margin: 0 auto 14px; }
  .side .vertical {
    writing-mode: vertical-rl;
    font-size: 15px; letter-spacing: 7px; color: var(--ink-soft);
  }
  .side .num {
    margin: 18px auto 0; width: 42px; height: 42px;
    border: 1px solid #b3a98e; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-kai); font-size: 21px; color: #4a4438;
    background: rgba(255,255,255,.35);
  }

  /* ---------- 底部 ---------- */
  .hint { position: absolute; left: 34px; bottom: 26px; font-size: 13px; letter-spacing: 2px; color: var(--ink-faint); }
  .hint::before { content: "·"; margin-right: 8px; color: var(--seal); font-weight: 700; }
  .status { position: absolute; right: 34px; bottom: 26px; font-size: 13px; letter-spacing: 2px; color: var(--ink-faint); }

  .controls {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, .82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 105, 75, .12);
    border-radius: 999px; padding: 7px 10px;
    box-shadow: 0 6px 24px rgba(96, 84, 58, .16);
    pointer-events: auto;
  }
  .seg { display: flex; background: #ece6d4; border-radius: 999px; padding: 3px; }
  .seg button {
    border: none; background: transparent; cursor: pointer;
    font-family: var(--font-song); font-size: 14px; letter-spacing: 2px;
    color: #5a5344; padding: 7px 20px; border-radius: 999px;
    transition: all .18s ease;
  }
  .seg button.active { background: var(--bamboo); color: #f5f2e7; box-shadow: 0 2px 8px rgba(61, 90, 76, .4); }
  .tool {
    border: none; background: transparent; cursor: pointer;
    font-family: var(--font-song); font-size: 14px; letter-spacing: 2px;
    color: #5a5344; padding: 7px 16px; border-radius: 999px;
    transition: background .18s ease;
    display: flex; align-items: center; gap: 6px;
  }
  .tool:hover { background: rgba(61, 90, 76, .1); }
  .tool.active { background: rgba(61, 90, 76, .16); color: var(--bamboo); }
  .tool .ico { font-size: 13px; }
  .divider { width: 1px; height: 20px; background: #d8d0ba; }

  /* ---------- 加载 / 错误 ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: opacity .6s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .t { font-family: var(--font-kai); font-size: 34px; letter-spacing: 10px; color: var(--ink); }
  #loading .s { font-size: 12px; letter-spacing: 4px; color: var(--ink-faint); }
  #loading .err { display: none; font-size: 13px; color: var(--seal); letter-spacing: 1px; }

  @media (max-width: 720px) {
    .brand h1 { font-size: 32px; letter-spacing: 5px; }
    .brand-top { font-size: 10px; }
    .side { display: none; }
    .hint, .status { font-size: 11px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="ui">
  <header class="brand">
    <div class="seal"><span>青崖</span></div>
    <div class="brand-text">
      <div class="brand-top">山水之间 · 码头习作</div>
      <h1>青崖渡</h1>
      <p class="subtitle">一方水岸，半日闲舟</p>
    </div>
  </header>

  <aside class="side">
    <div class="vline"></div>
    <div class="vertical">场景美术试验</div>
    <div class="num">壹</div>
  </aside>

  <div class="hint">拖拽旋转 / 滚轮缩放</div>
  <div class="status" id="status">等轴 · 正交投影</div>

  <nav class="controls">
    <div class="seg">
      <button id="btnIso" class="active">等轴</button>
      <button id="btnPersp">透视</button>
    </div>
    <span class="divider"></span>
    <button id="btnReset" class="tool"><span class="ico">↺</span>复位</button>
    <button id="btnPause" class="tool"><span class="ico">⏸</span>暂停</button>
  </nav>
</div>

<div id="loading">
  <div class="t">青崖渡</div>
  <div class="s">场 景 美 术 试 验 · 壹</div>
  <div class="err" id="loadErr">资源加载失败，请检查网络后刷新</div>
</div>

<script>
  // 加载超时提示（CDN 不可达时）
  window.__ready = false;
  setTimeout(() => {
    if (!window.__ready) document.getElementById('loadErr').style.display = 'block';
  }, 9000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   基础：渲染器 / 场景 / 相机 / 灯光
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f2e7);

const TARGET = new THREE.Vector3(0, 2.1, 0);
const VIEW_DIR = new THREE.Vector3(1, 0.82, 1.05).normalize();
const VIEW_DIST = 58;
let aspect = innerWidth / innerHeight;
const VIEW = 13.5; // 正交半高

const isoCam = new THREE.OrthographicCamera(-VIEW * aspect, VIEW * aspect, VIEW, -VIEW, 0.1, 300);
const perspCam = new THREE.PerspectiveCamera(30, aspect, 0.1, 300);
function placeCamera(cam) {
  cam.position.copy(VIEW_DIR).multiplyScalar(VIEW_DIST);
  cam.lookAt(TARGET);
}
placeCamera(isoCam);
placeCamera(perspCam);
let camera = isoCam;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minZoom = 0.55;
controls.maxZoom = 2.6;

// 灯光
scene.add(new THREE.HemisphereLight(0xfff7e8, 0xcfc5ae, 0.85));
const sun = new THREE.DirectionalLight(0xfff1da, 1.9);
sun.position.set(20, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
fill.position.set(-18, 12, -10);
scene.add(fill);

// 地面阴影承接（让模型像浮在纸面上）
const catcher = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220),
  new THREE.ShadowMaterial({ opacity: 0.13 })
);
catcher.rotation.x = -Math.PI / 2;
catcher.position.y = -0.02;
catcher.receiveShadow = true;
scene.add(catcher);

/* ============================================================
   调色板 & 工具
============================================================ */
const C = {
  bg: 0xf6f2e7,
  stone: 0xd9d4c3, stoneDark: 0xc4bda9,
  slab: 0xe6e1d0, slabAlt: 0xdcd6c2,
  water: 0x5aa79e, waterDeep: 0x3d7a76,
  wall: 0xf3eee1, wallShade: 0xe9e2d0,
  wood: 0x8a6a48, woodDark: 0x6b4f35, woodLight: 0xa5855e,
  hull: 0x6b4f35,
  roof: 0x47574e, ridge: 0x3a4740,
  lantern: 0xbf4a38, lanternDark: 0x96281b, gold: 0xd4af37,
  plaque: 0x352a24, plaqueText: 0xe3c06a,
  leaf: 0xa9c78a, leafLight: 0xc0d69c, leafDark: 0x8fb573,
  blossom: 0xe5a9b0, blossomLight: 0xeec3c6,
  rock: 0x9a9a92, rockDark: 0x7f7f78,
  umbrella: 0xa9d3da,
  sail: 0xf5f1e6, ink: 0x3a3a3a,
  crate: 0xa5855e,
};

const M = (color, opt = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, flatShading: true, ...opt });

const jitC = (hex, dl = 0.035) =>
  new THREE.Color(hex).offsetHSL(0, 0, (Math.random() - 0.5) * dl);

const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => {
  const t = Math.min(Math.max((x - a) / (b - a), 0), 1);
  return t * t * (3 - 2 * t);
};

function box(w, h, d, color, x = 0, y = 0, z = 0, opt = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), opt.mat || M(color, opt));
  m.position.set(x, y, z);
  m.castShadow = opt.cast ?? true;
  m.receiveShadow = opt.receive ?? true;
  return m;
}
function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, seg = 8, opt = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), opt.mat || M(color, opt));
  m.position.set(x, y, z);
  m.castShadow = opt.cast ?? true;
  m.receiveShadow = opt.receive ?? true;
  return m;
}
function beamBetween(p1, p2, thick, color) {
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
  const dir = b.clone().sub(a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(thick, len, thick), M(color));
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  return m;
}

/* ============================================================
   程序化贴图（Canvas）
============================================================ */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  return t;
}

// 青瓦屋面（canvas 顶部 = 檐口，底部 = 正脊）
const roofTex = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#47574e'; ctx.fillRect(0, 0, w, h);
  const rowH = 36;
  for (let y = 0; y < h; y += rowH) {
    const off = ((y / rowH) % 2) ? 24 : 0;
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    for (let x = off; x < w; x += 48) ctx.fillRect(x, y + 3, 3, rowH - 8);
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(0, y, w, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(0, y + rowH - 5, w, 5);
  }
  ctx.fillStyle = '#5a6d63'; ctx.fillRect(0, 0, w, 16);            // 檐口
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  for (let x = 8; x < w; x += 24) { ctx.beginPath(); ctx.arc(x, 16, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#3a4740'; ctx.fillRect(0, h - 12, w, 12);       // 正脊
});

// 石砌块（码头岸壁）
function stoneTex(rx, ry) {
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#d3cdbb'; ctx.fillRect(0, 0, w, h);
    const bh = 42, bw = 85;
    for (let r = 0; r * bh < h + bh; r++) {
      const off = (r % 2) * bw / 2;
      for (let x = -1; x * bw < w + bw; x++) {
        const j = (Math.random() - 0.5) * 15;
        ctx.fillStyle = `rgb(${211 + j | 0},${205 + j | 0},${187 + j | 0})`;
        ctx.fillRect(x * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
      }
    }
    ctx.strokeStyle = '#b0a88f'; ctx.lineWidth = 3;
    for (let r = 0; r * bh <= h; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * bh); ctx.lineTo(w, r * bh); ctx.stroke();
    }
    for (let r = 0; r * bh < h; r++) {
      const off = (r % 2) * bw / 2;
      for (let x = 0; x * bw <= w; x++) {
        ctx.beginPath(); ctx.moveTo(x * bw + off, r * bh); ctx.lineTo(x * bw + off, r * bh + bh); ctx.stroke();
      }
    }
  }, [rx, ry]);
}

// 直棂窗
const latticeTex = canvasTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#f2ead6'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#6b4f35';
  ctx.fillRect(0, 0, w, 10); ctx.fillRect(0, h - 10, w, 10);
  ctx.fillRect(0, 0, 10, h); ctx.fillRect(w - 10, 0, 10, h);
  ctx.fillRect(58, 10, 6, h - 20); ctx.fillRect(28, 10, 6, h - 20); ctx.fillRect(90, 10, 6, h - 20);
  ctx.fillRect(10, 58, w - 20, 6); ctx.fillRect(10, 28, w - 20, 6); ctx.fillRect(10, 90, w - 20, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(12, 12, w - 24, h - 24);
});

// 木门
const doorTex = canvasTex(128, 256, (ctx, w, h) => {
  ctx.fillStyle = '#5a4230'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 ? '#52402c' : '#5f4634';
    ctx.fillRect(i * w / 6 + 1, 0, w / 6 - 2, h);
  }
  ctx.fillStyle = '#3a2c1e'; ctx.fillRect(w / 2 - 2, 0, 4, h);
  ctx.strokeStyle = '#d9b45c'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(w / 2 - 18, h * 0.45, 9, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(w / 2 + 18, h * 0.45, 9, 0, 7); ctx.stroke();
  ctx.fillStyle = '#4a3828'; ctx.fillRect(0, 20, w, 12); ctx.fillRect(0, h - 32, w, 12);
});

// 木箱
const crateTex = canvasTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#a5855e'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i % 2 ? '#9d7d56' : '#ab8a63';
    ctx.fillRect(10, 10 + i * 27, w - 20, 25);
  }
  ctx.fillStyle = '#6b4f35';
  ctx.fillRect(0, 0, w, 10); ctx.fillRect(0, h - 10, w, 10);
  ctx.fillRect(0, 0, 10, h); ctx.fillRect(w - 10, 0, 10, h);
  ctx.fillRect(40, 0, 8, h); ctx.fillRect(80, 0, 8, h);
});

// 木桶
const barrelTex = canvasTex(128, 128, (ctx, w, h) => {
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? '#8a6a48' : '#937452';
    ctx.fillRect(i * 16, 0, 15, h);
  }
  ctx.fillStyle = '#4a3828';
  ctx.fillRect(0, 34, w, 9); ctx.fillRect(0, 86, w, 9);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let i = 0; i < 8; i += 2) ctx.fillRect(i * 16 + 2, 0, 3, h);
});

// 牌匾
function plaqueTexture(text) {
  return canvasTex(512, 160, (ctx, w, h) => {
    ctx.fillStyle = '#352a24'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#d9b45c'; ctx.lineWidth = 5;
    ctx.strokeRect(10, 10, w - 20, h - 20);
    ctx.lineWidth = 2; ctx.strokeRect(22, 22, w - 44, h - 44);
    const chars = [...text];
    const fs = chars.length >= 4 ? 84 : 100;
    ctx.font = `600 ${fs}px "Kaiti SC","KaiTi","STKaiti",serif`;
    ctx.fillStyle = '#e3c06a';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const spacing = fs * (chars.length >= 4 ? 0.3 : 0.44);
    const widths = chars.map(ch => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let x = (w - total) / 2;
    chars.forEach((ch, i) => {
      ctx.fillText(ch, x + widths[i] / 2, h / 2 + 4);
      x += widths[i] + spacing;
    });
  });
}

// 船帆（货）
const sailTex = canvasTex(256, 320, (ctx, w, h) => {
  ctx.fillStyle = '#f5f1e6'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(120,110,90,0.25)'; ctx.lineWidth = 2;
  for (let y = 40; y < h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.fillStyle = '#3a3a3a';
  ctx.font = '600 190px "Kaiti SC","KaiTi","STKaiti",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('货', w / 2, h / 2 + 12);
});

const roofMat = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.9, side: THREE.DoubleSide });
const crateMat = new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.9 });
const barrelMat = new THREE.MeshStandardMaterial({ map: barrelTex, roughness: 0.9 });
const latticeMat = new THREE.MeshStandardMaterial({ map: latticeTex, roughness: 0.9 });
const doorMat = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.9 });
const stoneMatBase = new THREE.MeshStandardMaterial({ map: stoneTex(7.5, 0.8), roughness: 0.95 });
const stoneMatQuay = new THREE.MeshStandardMaterial({ map: stoneTex(8.5, 0.25), roughness: 0.95 });

/* ============================================================
   屋顶：曲面飞檐（凹曲屋面 + 翘角）
============================================================ */
function roofGeometry(w, d, h, overhang, ridge, curve, lift) {
  const Ew = w / 2 + overhang, Ed = d / 2 + overhang;
  const Rw = Math.max(w / 2 - ridge, 0.05);
  const segU = 8, segT = 6;
  const positions = [], uvs = [], indices = [];
  const prof = t => h * Math.pow(1 - t, curve);
  const corner = (u, t) => smoothstep(0.45, 1, t) * Math.pow(Math.abs(2 * u - 1), 2.0);

  function addFace(fn) {
    const base = positions.length / 3;
    for (let i = 0; i <= segU; i++) {
      for (let j = 0; j <= segT; j++) {
        const u = i / segU, t = j / segT;
        const p = fn(u, t);
        positions.push(p[0], p[1], p[2]);
        uvs.push(u, t);
      }
    }
    for (let i = 0; i < segU; i++) {
      for (let j = 0; j < segT; j++) {
        const a = base + i * (segT + 1) + j;
        const b = a + segT + 1;
        indices.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
  }

  addFace((u, t) => [lerp(lerp(-Rw, Rw, u), lerp(-Ew, Ew, u), t), prof(t) + lift * corner(u, t), t * Ed]);      // 前
  addFace((u, t) => [lerp(lerp(-Rw, Rw, u), lerp(-Ew, Ew, u), t), prof(t) + lift * corner(u, t), -t * Ed]);     // 后
  addFace((u, t) => [lerp(Rw, Ew, t), prof(t) + lift * corner(u, t), lerp(-Ed, Ed, u) * t]);                      // 右
  addFace((u, t) => [lerp(-Rw, -Ew, t), prof(t) + lift * corner(u, t), lerp(Ed, -Ed, u) * t]);                    // 左

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function createRoof(w, d, h, opt = {}) {
  const { overhang = 0.9, ridge = 0.4, curve = 1.5, lift = 0.5, y = 0 } = opt;
  const g = new THREE.Group();
  const surf = new THREE.Mesh(roofGeometry(w, d, h, overhang, ridge, curve, lift), roofMat);
  surf.castShadow = true; surf.receiveShadow = true;
  g.add(surf);

  const Rw = Math.max(w / 2 - ridge, 0.05);
  const Ew = w / 2 + overhang, Ed = d / 2 + overhang;
  g.add(box(2 * Rw + 0.35, 0.24, 0.34, C.ridge, 0, h + 0.1, 0));                       // 正脊
  [-1, 1].forEach(s => {                                                                // 脊端
    const orn = box(0.2, 0.42, 0.3, C.ridge, s * (Rw + 0.1), h + 0.32, 0);
    orn.rotation.z = -s * 0.15;
    g.add(orn);
  });
  [[[Rw, h, 0], [Ew, lift, Ed]], [[Rw, h, 0], [Ew, lift, -Ed]],
   [[-Rw, h, 0], [-Ew, lift, Ed]], [[-Rw, h, 0], [-Ew, lift, -Ed]]]
    .forEach(([p1, p2]) => g.add(beamBetween(p1, p2, 0.15, C.ridge)));                 // 垂脊
  g.add(box(w + overhang * 2 + 0.15, 0.1, d + overhang * 2 + 0.15, C.woodDark, 0, 0.02, 0)); // 檐口封板
  g.position.y = y;
  return g;
}

function railingRun(len, h) {
  const g = new THREE.Group();
  const n = Math.max(Math.round(len / 0.75), 2);
  for (let i = 0; i <= n; i++) {
    const x = -len / 2 + (i / n) * len;
    g.add(box(0.09, h, 0.09, C.wood, x, h / 2, 0));
  }
  [h * 0.55, h * 0.95].forEach(yy => g.add(box(len, 0.07, 0.07, C.wood, 0, yy, 0)));
  return g;
}
function railing(size, h, y) {
  const g = new THREE.Group();
  for (let side = 0; side < 4; side++) {
    const a = side * Math.PI / 2;
    const run = railingRun(size, h);
    run.position.set(-Math.sin(a) * size / 2, y, Math.cos(a) * size / 2);
    run.rotation.y = -a;
    g.add(run);
  }
  return g;
}

function createPier(x, z0, len, width) {

  }
  for (const zz of [z0 + 0.6, z0 + len - 0.6]) {
    for (const xx of [-width / 2 + 0.25, width / 2 - 0.25]) {
      g.add(cyl(0.13, 0.15, 1.7, C.woodDark, xx, 1.2, zz, 7));
    }
  }
  [-1, 1].forEach(s => {
    const r = railingRun(len - 0.8, 0.85);
    r.position.set(s * (width / 2 - 0.1), deckY + 0.06, z0 + len / 2);
    r.rotation.y = Math.PI / 2;

}

/* ============================================================
   船：放样木船
============================================================ */
const hullProf = [[0, 0.66], [0.22, 0.9], [0.5, 1.0], [0.78, 0.8], [1, 0.05]];
function wAt(t) {
  for (let i = 0; i < hullProf.length - 1; i++) {
    const [t0, w0] = hullProf[i], [t1, w1] = hullProf[i + 1];
    if (t >= t0 && t <= t1) return lerp(w0, w1, (t - t0) / (t1 - t0));
  }
  return hullProf[hullProf.length - 1][1];
}
function hullGeometry(len, wid, dep) {
  const N = 8;
  const pos = [], idx = [];
  const sheer = t => 0.14 * Math.pow(Math.abs(2 * t - 1), 2.2);
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = -len / 2 + t * len;
    const w = wid / 2 * wAt(t);
    const y0 = sheer(t);
    [[-w, y0], [-w * 0.78, y0 - dep * 0.5], [0, y0 - dep], [w * 0.78, y0 - dep * 0.5], [w, y0]]
      .forEach(([z, y]) => pos.push(x, y, z));
  }
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < 4; j++) {
      const a = i * 5 + j, b = (i + 1) * 5 + j;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  // 船尾封板
  const sc = pos.length / 3;
  pos.push(-len / 2, sheer(0) - dep * 0.3, 0);
  for (let j = 0; j < 4; j++) idx.push(sc, j + 1, j);
  // 船头
  const bc = pos.length / 3;
  pos.push(len / 2 + 0.18, sheer(1) + 0.02, 0);
  for (let j = 0; j < 4; j++) idx.push(N * 5 + j, bc, N * 5 + j + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function deckGeometry(len, wid) {
  const shape = new THREE.Shape();
  const N = 8;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = -len / 2 + t * len, z = -(wid / 2) * wAt(t);
    i ? shape.lineTo(x, z) : shape.moveTo(x, z);
  }
  shape.lineTo(len / 2 + 0.18, 0);
  for (let i = N; i >= 0; i--) {
    const t = i / N;
    shape.lineTo(-len / 2 + t * len, (wid / 2) * wAt(t));
  }
  const g = new THREE.ShapeGeometry(shape, 4);
  g.rotateX(Math.PI / 2);
  return g;
}

function createTree(type, s = 1) {
  const g = new THREE.Group();
  const trunk = cyl(0.13 * s, 0.2 * s, 1.5 * s, C.woodDark, 0, 0.75 * s, 0, 7);
  trunk.rotation.z = (Math.random() - 0.5) * 0.12;
  g.add(trunk);
  const blob = (r, x, y, z, color) => {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 0), M(color));
    b.position.set(x * s, y * s, z * s);
    b.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    b.castShadow = true;
    g.add(b);
  };
  if (type === 'willow') {
    blob(1.0, 0, 2.1, 0, C.leaf);
    blob(0.7, 0.5, 1.8, 0.3, C.leafLight);
    for (let i = 0; i < 9; i++) {                                              // 垂枝
      const a = (i / 9) * Math.PI * 2;

        Math.cos(a) * 0.85, 1.35, Math.sin(a) * 0.85, 5);
      strand.rotation.x = Math.sin(a) * 0.28;
      strand.rotation.z = Math.cos(a) * 0.28;
      g.add(strand);
    }
  } else {
    const c1 = type === 'pink' ? C.blossom : C.leaf;
    const c2 = type === 'pink' ? C.blossomLight : C.leafLight;
    blob(0.95, 0, 1.75, 0, c1);

  return g;

function createLotus() {
  const g = new THREE.Group();
  const leaf = cyl(0.2 + Math.random() * 0.12, 0.26 + Math.random() * 0.12, 0.04, C.leafDark, 0, 0, 0, 7);
  leaf.castShadow = false;
  g.add(leaf);
  if (Math.random() > 0.55) {
    g.add(cyl(0.015, 0.015, 0.35, C.leafDark, 0.1, 0.2, 0.05, 5, { cast: false }));
    const fl = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.24, 6), M(C.blossom));
    fl.position.set(0.1, 0.42, 0.05);
    g.add(fl);
  }
  g.userData.phase = Math.random() * 6.28;
  lotusLeaves.push(g);
  return g;
}

function crateStack(x, y, z, n = 2) {
  const g = new THREE.Group();

  g.position.set(x, y, z);

}

/* ============================================================
   交互：等轴/透视 / 复位 / 暂停
============================================================ */
const btnIso = document.getElementById('btnIso');
const btnPersp = document.getElementById('btnPersp');
const btnReset = document.getElementById('btnReset');
const btnPause = document.getElementById('btnPause');
const statusEl = document.getElementById('status');
let mode = 'iso';
let paused = false;

function setMode(m) {
  mode = m;
  const old = camera;
  camera = m === 'iso' ? isoCam : perspCam;
  camera.position.copy(old.position);
  camera.quaternion.copy(old.quaternion);
  if (m === 'iso') { isoCam.zoom = 1; isoCam.updateProjectionMatrix(); }
  controls.dispose();
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  if (m === 'iso') { controls.minZoom = 0.55; controls.maxZoom = 2.6; }
  else { controls.minDistance = 18; controls.maxDistance = 110; }
  controls.update();
  btnIso.classList.toggle('active', m === 'iso');
  btnPersp.classList.toggle('active', m === 'persp');
  statusEl.textContent = m === 'iso' ? '等轴 · 正交投影' : '透视 · 透视投影';
}
btnIso.onclick = () => setMode('iso');
btnPersp.onclick = () => setMode('persp');

btnReset.onclick = () => {
  placeCamera(camera);
  if (camera === isoCam) { isoCam.zoom = 1; isoCam.updateProjectionMatrix(); }
  controls.target.copy(TARGET);
  controls.update();
};

btnPause.onclick = () => {
  paused = !paused;
  btnPause.innerHTML = paused ? '<span class="ico">▶</span>继续' : '<span class="ico">⏸</span>暂停';
  btnPause.classList.toggle('active', paused);
};

addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  isoCam.left = -VIEW * aspect;
  isoCam.right = VIEW * aspect;
  isoCam.updateProjectionMatrix();
  perspCam.aspect = aspect;
  perspCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   动画循环
============================================================ */
const clock = new THREE.Clock();
let animT = 0;
let firstFrame = true;

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    animT += dt;
    // 水波
    const wp = waterGeo.attributes.position;
    for (let i = 0; i < wp.count; i++) {
      const x = wp.getX(i), z = wp.getZ(i);
      wp.setY(i, Math.sin(x * 0.85 + animT * 1.5) * 0.05 + Math.cos(z * 1.25 + animT * 1.05) * 0.05);
    }
    wp.needsUpdate = true;
    // 船浮动
    boats.forEach(b => {
      b.g.position.y = b.baseY + Math.sin(animT * 1.2 + b.phase) * b.amp;
      b.g.rotation.z = Math.sin(animT * 0.9 + b.phase) * 0.022;
      b.g.rotation.x = Math.cos(animT * 0.8 + b.phase) * 0.018;
    });
    // 灯笼摇摆
    lanterns.forEach(l => {
      l.rotation.x = Math.sin(animT * 1.3 + l.userData.phase) * 0.06;
      l.rotation.z = Math.cos(animT * 1.1 + l.userData.phase) * 0.06;
    });
    // 荷叶轻晃
    lotusLeaves.forEach(l => {
      l.position.y = 1.74 + Math.sin(animT * 1.4 + l.userData.phase) * 0.02;
      l.rotation.y += dt * 0.05;
    });
  }
  controls.update();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    window.__ready = true;
    document.getElementById('loading').classList.add('done');
  }
}
loop();
