<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青崖渡 · 古代码头</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #eef2ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  #app { width: 100vw; height: 100vh; }
  .title {
    position: fixed;
    top: 18px;
    left: 22px;
    color: #4a5a52;
    pointer-events: none;
    user-select: none;
  }
  .title h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 6px;
    font-weight: 600;
  }
  .title p {
    margin: 6px 0 0 2px;
    font-size: 12px;
    letter-spacing: 3px;
    color: #7d8a80;
  }
  .toolbar {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 24px rgba(74, 90, 82, 0.18);
  }
  .toolbar button {
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 9px 20px;
    border-radius: 999px;
    background: #f3efe4;
    color: #4a5a52;
    transition: all 0.25s ease;
  }
  .toolbar button:hover { background: #e7e0cd; }
  .toolbar button.active {
    background: #4a5a52;
    color: #f3efe4;
  }
  .toolbar button.reset {
    background: #e8b7a0;
    color: #5a3a2e;
  }
  .toolbar button.reset:hover { background: #dda58c; }
  .hint {
    position: fixed;
    bottom: 24px;
    right: 24px;
    font-size: 12px;
    color: #8b968e;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="title">
  <h1>青崖渡</h1>
  <p>LOW-POLY ANCIENT WHARF</p>
</div>
<div class="toolbar">
  <button id="btnIso" class="active">等轴视角</button>
  <button id="btnPersp">透视视角</button>
  <button id="btnReset" class="reset">复 位</button>
</div>
<div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 * 基础：渲染器 / 场景 / 灯光
 * ============================================================ */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2ee);
scene.fog = new THREE.Fog(0xeef2ee, 60, 130);

const hemi = new THREE.HemisphereLight(0xfdf8ec, 0x9fb8ac, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3dd, 1.6);
sun.position.set(24, 32, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xd8e8e0, 0.35);
fill.position.set(-18, 14, -20);
scene.add(fill);

/* ============================================================
 * 相机：透视 / 等轴(正交) 双机位
 * ============================================================ */
const VIEW_TARGET = new THREE.Vector3(0, 2.2, 0);
const VIEW_DIST = 34;
const ISO_DIR = new THREE.Vector3(1, 0.82, 1).normalize(); // 经典等轴方向

const perspCam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
perspCam.position.copy(VIEW_TARGET).addScaledVector(ISO_DIR, VIEW_DIST);

const ORTHO_HALF = 13;
let orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
function updateOrthoFrustum() {
  const aspect = window.innerWidth / window.innerHeight;
  orthoCam.left = -ORTHO_HALF * aspect;
  orthoCam.right = ORTHO_HALF * aspect;
  orthoCam.top = ORTHO_HALF;
  orthoCam.bottom = -ORTHO_HALF;
  orthoCam.updateProjectionMatrix();
}
updateOrthoFrustum();
orthoCam.position.copy(VIEW_TARGET).addScaledVector(ISO_DIR, VIEW_DIST);

let activeCam = perspCam;
let controls = null;

function makeControls(camera) {
  const c = new OrbitControls(camera, renderer.domElement);
  c.target.copy(VIEW_TARGET);
  c.enableDamping = true;
  c.dampingFactor = 0.08;
  c.minDistance = 10;
  c.maxDistance = 90;
  c.maxPolarAngle = Math.PI / 2 - 0.04;
  c.update();
  return c;
}
controls = makeControls(activeCam);

const HOME_POS = perspCam.position.clone();

/* ============================================================
 * 工具函数
 * ============================================================ */
const MAT = {
  wall:   new THREE.MeshStandardMaterial({ color: 0xf3ecdc, roughness: 0.9 }),
  wood:   new THREE.MeshStandardMaterial({ color: 0x7d5a3a, roughness: 0.85 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x5f442c, roughness: 0.85 }),
  plank:  new THREE.MeshStandardMaterial({ color: 0x9a7748, roughness: 0.9 }),
  roof:   new THREE.MeshStandardMaterial({ color: 0x4c5c54, roughness: 0.8, flatShading: true }),
  stone:  new THREE.MeshStandardMaterial({ color: 0xa9ada9, roughness: 0.95, flatShading: true }),
  stoneDark: new THREE.MeshStandardMaterial({ color: 0x8f948f, roughness: 0.95, flatShading: true }),
  leaf:   new THREE.MeshStandardMaterial({ color: 0x6f9e6a, roughness: 0.9, flatShading: true }),
  leafDark: new THREE.MeshStandardMaterial({ color: 0x5c8a5e, roughness: 0.9, flatShading: true }),
  pink:   new THREE.MeshStandardMaterial({ color: 0xe8a7b8, roughness: 0.85, flatShading: true }),
  pinkLight: new THREE.MeshStandardMaterial({ color: 0xf2c3d0, roughness: 0.85, flatShading: true }),
  water:  new THREE.MeshStandardMaterial({ color: 0x5fa3ab, roughness: 0.55, transparent: true, opacity: 0.92 }),
  gold:   new THREE.MeshStandardMaterial({ color: 0xd9b36c, roughness: 0.5, metalness: 0.3 }),
  paper:  new THREE.MeshStandardMaterial({ color: 0xfbf7ea, roughness: 0.9 }),
};

function box(w, h, d, mat, x = 0, y = 0, z = 0, castShadow = true, recvShadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = castShadow;
  m.receiveShadow = recvShadow;
  return m;
}

/* 生成带木格窗棂纹理的贴图 */
function latticeTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f7f1e2';
  g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#6b4c30';
  g.lineWidth = 6;
  g.strokeRect(3, 3, 122, 122);
  g.lineWidth = 4;
  // 井字棂条
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(i * 32, 6); g.lineTo(i * 32, 122); g.stroke();
    g.beginPath(); g.moveTo(6, i * 32); g.lineTo(122, i * 32); g.stroke();
  }
  g.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(i * 32, 20); g.lineTo(i * 32, 108); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 生成牌匾贴图 */
function plaqueTexture(text, { w = 512, h = 160, bg = '#3c4a44', fg = '#e8c98a', vertical = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);
  g.strokeStyle = fg;
  g.lineWidth = 6;
  g.strokeRect(8, 8, w - 16, h - 16);
  g.fillStyle = fg;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  if (vertical) {
    g.font = `bold ${Math.floor(h * 0.62)}px "Kaiti SC", "STKaiti", "KaiTi", serif`;
    const step = h / (text.length + 1);
    [...text].forEach((ch, i) => g.fillText(ch, w / 2, step * (i + 1)));
  } else {
    g.font = `bold ${Math.floor(h * 0.58)}px "Kaiti SC", "STKaiti", "KaiTi", serif`;
    g.fillText(text, w / 2, h / 2 + 4);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* ============================================================
 * 水面 & 地面
 * ============================================================ */
const water = new THREE.Mesh(new THREE.CircleGeometry(60, 48), MAT.water);
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
water.receiveShadow = true;
scene.add(water);

// 水面微波：几片半透圆盘
const rippleMat = new THREE.MeshStandardMaterial({ color: 0x8fc4c9, transparent: true, opacity: 0.35, roughness: 0.4 });
for (let i = 0; i < 14; i++) {
  const r = new THREE.Mesh(new THREE.CircleGeometry(0.5 + Math.random() * 0.9, 16), rippleMat);
  r.rotation.x = -Math.PI / 2;
  const a = Math.random() * Math.PI * 2;
  const d = 9 + Math.random() * 22;
  r.position.set(Math.cos(a) * d, 0.02, Math.sin(a) * d);
  scene.add(r);
}

/* ============================================================
 * 石砌高台
 * ============================================================ */
const platform = new THREE.Group();
platform.position.set(-4.5, 0, 0);
scene.add(platform);

const baseTop = 2.2;
platform.add(box(11, baseTop, 9, MAT.stone, 0, baseTop / 2, 0));
// 台基收分
platform.add(box(11.6, 0.5, 9.6, MAT.stoneDark, 0, 0.25, 0));
platform.add(box(10.4, 0.35, 8.4, MAT.stone, 0, baseTop - 0.18, 0));
// 石缝线条（横向饰带）
for (let i = 0; i < 3; i++) {
  platform.add(box(11.06, 0.08, 9.06, MAT.stoneDark, 0, 0.6 + i * 0.62, 0, false, true));
}
// 台阶（朝水面一侧 +x）
for (let i = 0; i < 4; i++) {
  platform.add(box(1.0, 0.55 - i * 0.02, 2.4, MAT.stoneDark, 5.5 + 0.0, 0.28 + i * 0.53, 0));
}
platform.children.slice(-4).forEach(s => { s.position.x = 5.55; s.scale.set(1, 1, 1); });

/* ============================================================
 * 中式建筑（青瓦坡屋顶 · 米白墙 · 木格门窗）
 * ============================================================ */
const building = new THREE.Group();
building.position.set(-4.5, baseTop, 0);
scene.add(building);

const W = 7.2, D = 5.2, H = 3.0; // 面阔 / 进深 / 墙高
const EAVE = 5.0;                 // 檐口高度
const RIDGE = 6.6;                // 屋脊高度

// 墙体（米白）
building.add(box(W, H, D, MAT.wall, 0, H / 2, 0));

// 木构框架：檐柱 + 檐枋 + 础
const postGeo = new THREE.CylinderGeometry(0.14, 0.16, EAVE - H + 0.6, 8);
const postPos = [
  [-W / 2 + 0.15, -D / 2 + 0.15], [W / 2 - 0.15, -D / 2 + 0.15],
  [-W / 2 + 0.15,  D / 2 - 0.15], [W / 2 - 0.15,  D / 2 - 0.15],
  [0, -D / 2 + 0.15], [0, D / 2 - 0.15],
];
postPos.forEach(([x, z]) => {
  const p = new THREE.Mesh(postGeo, MAT.woodDark);
  p.position.set(x, (EAVE - H + 0.6) / 2 + H - 0.4, z);
  p.castShadow = true;
  building.add(p);
  building.add(box(0.3, 0.22, 0.3, MAT.stoneDark, x, 0.11, z)); // 柱础
});
// 檐枋（四周）
building.add(box(W + 0.7, 0.22, 0.28, MAT.wood, 0, EAVE - 0.15, -D / 2 - 0.12));
building.add(box(W + 0.7, 0.22, 0.28, MAT.wood, 0, EAVE - 0.15,  D / 2 + 0.12));
building.add(box(0.28, 0.22, D + 0.7, MAT.wood, -W / 2 - 0.12, EAVE - 0.15, 0));
building.add(box(0.28, 0.22, D + 0.7, MAT.wood,  W / 2 + 0.12, EAVE - 0.15, 0));

// 格扇门（正面）与窗（两侧）
const latticeMat = new THREE.MeshStandardMaterial({ map: latticeTexture(), roughness: 0.9 });
const doorL = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.1, 0.1), latticeMat);
doorL.position.set(-1.35, 1.05, D / 2 + 0.03);
const doorR = doorL.clone(); doorR.position.x = 1.35;
building.add(doorL, doorR);
const winL = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.1, 0.08), latticeMat);
winL.position.set(-W / 2 - 0.02, 1.7, 0);
winL.rotation.y = -Math.PI / 2;
const winR = winL.clone(); winR.position.x = W / 2 + 0.02; winR.rotation.y = Math.PI / 2;
const winB = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.1, 0.08), latticeMat);
winB.position.set(0.4, 1.7, -D / 2 - 0.03);
building.add(winL, winR, winB);

// 双坡屋顶（屋脊沿 x 轴，坡面沿 z 轴倾斜；整组绕 x 旋转形成坡度）
function roofSlope(rise, overhang) {
  const slopeLen = Math.hypot(D / 2 + overhang, rise);
  const angle = Math.atan2(rise, D / 2 + overhang);
  const g = new THREE.Group();
  const panel = box(W + overhang * 2 + 0.6, 0.18, slopeLen, MAT.roof);
  g.add(panel);
  // 瓦垄线条
  const ribMat = new THREE.MeshStandardMaterial({ color: 0x42514a, roughness: 0.8, flatShading: true });
  for (let i = -3; i <= 3; i++) {
    g.add(box(0.09, 0.06, slopeLen, ribMat, i * (W / 7), 0.11, 0, false, false));
  }
  return { g, angle };
}
const rise = RIDGE - EAVE;
const { g: slopeA, angle: angA } = roofSlope(rise, 0.9);
slopeA.position.set(0, (EAVE + RIDGE) / 2, -(D / 4 + 0.45));
slopeA.rotation.x = angA;
building.add(slopeA);
const { g: slopeB } = roofSlope(rise, 0.9);
slopeB.position.set(0, (EAVE + RIDGE) / 2, (D / 4 + 0.45));
slopeB.rotation.x = -angA;
building.add(slopeB);

// 屋脊 + 翘角
building.add(box(W + 1.0, 0.22, 0.34, MAT.roof, 0, RIDGE + 0.06, 0));
building.add(box(W + 1.35, 0.1, 0.2, MAT.roof, 0, RIDGE + 0.2, 0));
[-1, 1].forEach(s => {
  const tip = box(0.5, 0.3, 0.26, MAT.roof, s * (W / 2 + 0.45), RIDGE + 0.42, 0);
  tip.rotation.z = s * -0.35;
  building.add(tip);
});
// 山面三角墙（米白；几何预先旋转到 Y-Z 平面，面向 ±x）
const triShape = new THREE.Shape();
triShape.moveTo(-D / 2, EAVE); triShape.lineTo(D / 2, EAVE); triShape.lineTo(0, RIDGE); triShape.closePath();
const triGeo = new THREE.ExtrudeGeometry(triShape, { depth: 0.15, bevelEnabled: false });
triGeo.rotateY(Math.PI / 2);
triGeo.translate(-0.075, 0, 0);
[-1, 1].forEach(s => {
  const tri = new THREE.Mesh(triGeo, MAT.wall);
  tri.position.set(s * (W / 2 + 0.02), 0, 0);
  tri.castShadow = true;
  building.add(tri);
});

// 檐下灯笼
function lantern(x, y, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0xd96a5a, roughness: 0.6 }));
  body.scale.y = 0.85;
  const capT = box(0.16, 0.05, 0.16, MAT.gold, 0, 0.2, 0, false, false);
  const capB = box(0.12, 0.05, 0.12, MAT.gold, 0, -0.2, 0, false, false);
  g.add(body, capT, capB);
  g.position.set(x, y, z);
  return g;
}
building.add(lantern(-W / 2 - 0.3, EAVE - 0.75, -D / 2 - 0.35));
building.add(lantern( W / 2 + 0.3, EAVE - 0.75, -D / 2 - 0.35));
building.add(lantern(0, EAVE - 0.75, D / 2 + 0.3));

// 牌匾：青崖商栈（横匾，正面檐下）
const heng = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.0, 0.14),
  new THREE.MeshStandardMaterial({ map: plaqueTexture('青崖商栈'), roughness: 0.8 }));
heng.position.set(0, EAVE - 0.75, D / 2 + 0.32);
heng.castShadow = true;
building.add(heng);
// 牌匾边框
building.add(box(3.6, 1.16, 0.1, MAT.woodDark, 0, EAVE - 0.75, D / 2 + 0.26));

// 竖匾：青崖渡（挂于侧柱）
const shu = new THREE.Mesh(new THREE.BoxGeometry(0.72, 2.4, 0.12),
  new THREE.MeshStandardMaterial({ map: plaqueTexture('青崖渡', { w: 200, h: 560, vertical: true }), roughness: 0.8 }));
shu.position.set(-W / 2 - 0.28, 3.4, D / 2 - 0.9);
shu.rotation.y = -Math.PI / 2;
shu.castShadow = true;
building.add(shu);

/* ============================================================
 * 木质栈桥
 * ============================================================ */
const bridge = new THREE.Group();
scene.add(bridge);

const bridgeStartX = 1.2, bridgeEndX = 10.5, bridgeZ = 2.6, deckY = 1.15;
const plankCount = 22;
for (let i = 0; i < plankCount; i++) {
  const t = i / (plankCount - 1);
  const x = bridgeStartX + (bridgeEndX - bridgeStartX) * t;
  const y = deckY - 0.15 + Math.sin(t * Math.PI) * 0.25; // 微拱
  const plank = box(0.42, 0.1, 1.7, MAT.plank, x, y, bridgeZ + (Math.random() - 0.5) * 0.03);
  bridge.add(plank);
}
// 纵梁
bridge.add(box(bridgeEndX - bridgeStartX, 0.14, 0.16, MAT.woodDark, (bridgeStartX + bridgeEndX) / 2, deckY - 0.28, bridgeZ - 0.75));
bridge.add(box(bridgeEndX - bridgeStartX, 0.14, 0.16, MAT.woodDark, (bridgeStartX + bridgeEndX) / 2, deckY - 0.28, bridgeZ + 0.75));
// 栏杆立柱 + 扶手
for (let i = 0; i <= plankCount; i += 2) {
  const t = i / plankCount;
  const x = bridgeStartX + (bridgeEndX - bridgeStartX) * t;
  const y = deckY - 0.15 + Math.sin(t * Math.PI) * 0.25;
  [-0.78, 0.78].forEach(dz => {
    bridge.add(box(0.09, 0.75, 0.09, MAT.wood, x, y + 0.42, bridgeZ + dz));
  });
}
const rail1 = box(bridgeEndX - bridgeStartX, 0.08, 0.08, MAT.wood, (bridgeStartX + bridgeEndX) / 2, deckY + 0.55, bridgeZ - 0.78);
const rail2 = rail1.clone(); rail2.position.z = bridgeZ + 0.78;
bridge.add(rail1, rail2);
// 桥桩
for (let i = 0; i <= 6; i++) {
  const t = i / 6;
  const x = bridgeStartX + (bridgeEndX - bridgeStartX) * t;
  [-0.8, 0.8].forEach(dz => {
    const pile = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, deckY + 0.6, 7), MAT.woodDark);
    pile.position.set(x, (deckY - 0.4) / 2 + 0.1, bridgeZ + dz);
    pile.castShadow = true;
    bridge.add(pile);
  });
}

/* ============================================================
 * 货船
 * ============================================================ */
const boat = new THREE.Group();
boat.position.set(12.5, 0, -2.5);
boat.rotation.y = -0.5;
scene.add(boat);

// 船体（俯视轮廓拉伸）
const hullShape = new THREE.Shape();
hullShape.moveTo(-3.4, 0);
hullShape.quadraticCurveTo(-3.6, 0.9, -2.6, 1.05);
hullShape.lineTo(1.6, 1.05);
hullShape.quadraticCurveTo(3.4, 0.9, 3.6, 0);   // 尖船头
hullShape.quadraticCurveTo(3.4, -0.9, 1.6, -1.05);
hullShape.lineTo(-2.6, -1.05);
hullShape.quadraticCurveTo(-3.6, -0.9, -3.4, 0);
const hullGeo = new THREE.ExtrudeGeometry(hullShape, { depth: 0.85, bevelEnabled: false });
hullGeo.rotateX(-Math.PI / 2);
const hull = new THREE.Mesh(hullGeo, MAT.wood);
hull.position.y = 0.75;
hull.castShadow = true;
boat.add(hull);
// 船舷包边
boat.add(box(4.6, 0.12, 0.12, MAT.woodDark, -0.5, 1.62, 1.06));
boat.add(box(4.6, 0.12, 0.12, MAT.woodDark, -0.5, 1.62, -1.06));
// 竹篾棚（半圆柱）
const shed = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 3.2, 10, 1, false, 0, Math.PI),
  new THREE.MeshStandardMaterial({ color: 0xb99a68, roughness: 0.95, flatShading: true }));
shed.rotation.z = Math.PI / 2;
shed.rotation.y = Math.PI / 2;
shed.position.set(-0.4, 1.62, 0);
shed.castShadow = true;
boat.add(shed);
// 货物：麻袋 + 木桶 + 木箱
const sackMat = new THREE.MeshStandardMaterial({ color: 0xcbb489, roughness: 1 });

/* ============================================================
 * 荷叶 / 荷花
 * ============================================================ */
const lotusSpots = [
  [7.5, 6.8], [10.5, 5.2], [4.5, 9.5], [14, 8.5], [-1, 12],
  [18, 2], [16, -7], [9, -8], [-8, 11], [13, 12], [20, 10], [3, 14],
];
function lotusLeaf(x, z, scale) {
  const g = new THREE.Group();
  const leafGeo = new THREE.CircleGeometry(0.55, 10, 0.35, Math.PI * 2 - 0.7);
  const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({
    color: 0x5f9e6e, roughness: 0.75, side: THREE.DoubleSide,
  }));
  leaf.rotation.x = -Math.PI / 2;
  leaf.receiveShadow = true;
  g.add(leaf);
  // 叶茎
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 0.5, 5), MAT.leafDark);
  stem.position.y = -0.25;
  g.add(stem);
  g.position.set(x, 0.03, z);
  g.scale.setScalar(scale);
  g.rotation.y = Math.random() * Math.PI * 2;
  return g;
}
function lotusFlower(x, z, scale) {
  const g = lotusLeaf(x, z, scale);
  const petalMat = MAT.pinkLight;
  for (let i = 0; i < 6; i++) {
    const p = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.3, 5), petalMat);
    const a = (i / 6) * Math.PI * 2;
    p.position.set(Math.cos(a) * 0.12, 0.18, Math.sin(a) * 0.12);
    p.rotation.set(Math.sin(a) * 0.5, 0, Math.cos(a) * -0.5);
    g.add(p);
  }
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), MAT.gold);
  core.position.y = 0.2;
  g.add(core);
  return g;
}
lotusSpots.forEach(([x, z], i) => {
  scene.add(i % 3 === 2 ? lotusFlower(x, z, 0.9 + Math.random() * 0.4) : lotusLeaf(x, z, 0.8 + Math.random() * 0.7));
});

/* ============================================================
 * 绿树 & 粉花树
 * ============================================================ */
function greenTree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.1 * s, 7), MAT.woodDark);
  trunk.position.y = 0.55 * s;
  trunk.castShadow = true;
  g.add(trunk);
  const c1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85 * s, 0), MAT.leaf);
  c1.position.y = 1.5 * s;
  c1.castShadow = true;
  const c2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6 * s, 0), MAT.leafDark);
  c2.position.set(0.35 * s, 1.95 * s, 0.15 * s);
  c2.castShadow = true;
  g.add(c1, c2);
  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  return g;
}
function blossomTree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * s, 0.22 * s, 1.2 * s, 7), MAT.woodDark);
  trunk.position.y = 0.6 * s;
  trunk.castShadow = true;
  g.add(trunk);
  [[0, 1.7, 0, 0.8], [0.45, 1.4, 0.2, 0.55], [-0.4, 1.5, -0.1, 0.5]].forEach(([cx, cy, cz, r]) => {
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 0), MAT.pink);
    c.position.set(cx * s, cy * s, cz * s);
    c.castShadow = true;
    g.add(c);
  });
  g.position.set(x, 0, z);
  return g;
}
scene.add(greenTree(-11.5, -5.5, 1.2));
scene.add(greenTree(-12, 3.5, 1.0));
scene.add(greenTree(-9.5, 8.5, 0.9));
scene.add(blossomTree(-11, 8, 1.1));
scene.add(blossomTree(-8.5, -8, 1.0));
scene.add(greenTree(-1.5, -9.5, 0.85));
scene.add(blossomTree(6, -9.8, 0.9));

// 石灯笼点缀
function stoneLamp(x, z) {
  const g = new THREE.Group();
  g.add(box(0.4, 0.18, 0.4, MAT.stoneDark, 0, 0.09, 0));
  g.add(box(0.2, 0.5, 0.2, MAT.stone, 0, 0.42, 0));
  g.add(box(0.34, 0.24, 0.34, MAT.stoneDark, 0, 0.78, 0));
  const roofCap = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.24, 4), MAT.roof);
  roofCap.position.y = 1.0;
  roofCap.rotation.y = Math.PI / 4;
  roofCap.castShadow = true;
  g.add(roofCap);
  g.position.set(x, baseTop, z);
  return g;
}
scene.add(stoneLamp(-8.6, -3.4));
scene.add(stoneLamp(-0.4, 3.8));

/* ============================================================
 * 远山 & 云朵（背景点缀）
 * ============================================================ */
const hillMat = new THREE.MeshStandardMaterial({ color: 0xa9c4b2, roughness: 1, flatShading: true });
[[-30, -34, 14, 7], [-12, -38, 18, 9], [14, -36, 16, 8], [34, -30, 12, 6], [26, 30, 10, 5.5], [-28, 28, 13, 6.5]]
  .forEach(([x, z, r, h]) => {
    const hill = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), hillMat);
    hill.position.set(x, h / 2 - 0.5, z);
    scene.add(hill);
  });
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });
[[-20, 17, -24], [16, 19, -28], [28, 16, 14]].forEach(([x, y, z]) => {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 + i * 0.25, 0), cloudMat);
    b.position.set(i * 1.1 - 1, Math.sin(i) * 0.3, 0);
    b.scale.y = 0.55;
    g.add(b);
  }
  g.position.set(x, y, z);
  scene.add(g);
});

/* ============================================================
 * 交互：视角切换 / 复位
 * ============================================================ */
const btnIso = document.getElementById('btnIso');
const btnPersp = document.getElementById('btnPersp');
const btnReset = document.getElementById('btnReset');

function setMode(iso) {
  activeCam = iso ? orthoCam : perspCam;
  if (controls) controls.dispose();
  controls = makeControls(activeCam);
  btnIso.classList.toggle('active', iso);
  btnPersp.classList.toggle('active', !iso);
}
btnIso.addEventListener('click', () => setMode(true));
btnPersp.addEventListener('click', () => setMode(false));
btnReset.addEventListener('click', () => {
  activeCam.position.copy(HOME_POS);
  controls.target.copy(VIEW_TARGET);
  controls.update();
});

/* ============================================================
 * 渲染循环
 * ============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // 水面轻微呼吸
  water.position.y = Math.sin(t * 0.6) * 0.03;
  // 货船随波轻晃
  boat.position.y = Math.sin(t * 0.9) * 0.06;
  boat.rotation.z = Math.sin(t * 0.7) * 0.02;
  boat.rotation.x = Math.sin(t * 0.8 + 1) * 0.015;
  controls.update();
  renderer.render(scene, activeCam);
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  perspCam.aspect = window.innerWidth / window.innerHeight;
  perspCam.updateProjectionMatrix();
  updateOrthoFrustum();
});
</script>
