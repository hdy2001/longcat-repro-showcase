<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>抬梁之上 · 单檐歇山殿</title>
<style>
:root{--paper:#f2ead8;--ink:#3a3122;--gold:#c9a227;--panel:#262219}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:"Songti SC","STSong",serif}
#c{position:fixed;inset:0;display:block}
.ui{position:fixed;z-index:10}
#brand{top:26px;left:30px;pointer-events:none;color:var(--ink)}
#brand h1{font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;font-size:52px;letter-spacing:10px;font-weight:700}
#brand .seal{display:inline-block;background:#a02824;color:#f6f0df;font-size:15px;padding:3px 7px;border-radius:4px;margin-left:12px;vertical-align:14px;letter-spacing:2px}
#brand p{margin-top:10px;font-size:14px;letter-spacing:4px;color:#7a6c4f}
#brand .rule{width:210px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:12px}
#panel{top:50%;right:18px;transform:translateY(-50%);width:238px;background:rgba(30,26,18,.93);border:1px solid rgba(201,162,39,.35);border-radius:14px;padding:16px 16px 12px;color:#e8dfc8;backdrop-filter:blur(6px);max-height:86vh;overflow-y:auto}
#panel h2{font-size:15px;letter-spacing:6px;color:var(--gold);margin-bottom:12px;font-family:"Kaiti SC","STKaiti",serif}
.sec{margin-bottom:13px;border-top:1px solid rgba(201,162,39,.18);padding-top:11px}
.sec h3{font-size:12px;letter-spacing:3px;color:#b7a674;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{cursor:pointer;font-family:inherit}
.btn{background:transparent;border:1px solid rgba(201,162,39,.45);color:#e8dfc8;border-radius:7px;padding:7px 0;font-size:12px;letter-spacing:2px;transition:.2s}
.btn:hover{background:rgba(201,162,39,.15)}
.btn.on{background:var(--gold);color:#262219;border-color:var(--gold);font-weight:700}
.layer{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;letter-spacing:1px}

.w100{width:100%}
#infocard{left:22px;bottom:70px;width:332px;background:#f6f0df;border:1px solid #d9cbaa;border-radius:12px;box-shadow:0 8px 30px rgba(60,45,20,.25);overflow:hidden}
.ic-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#efe6cd;border-bottom:1px solid #ddd0ae}
#icTitle{font-family:"Kaiti SC","STKaiti",serif;font-size:17px;font-weight:700;color:#4a3d24;letter-spacing:2px}
#icToggle{width:24px;height:24px;border:1px solid #c9b98d;background:#fff8;border-radius:6px;font-size:15px;line-height:1;color:#6b5b36}
.ic-body{padding:12px 14px;font-size:12.5px;line-height:1.8;color:#5a4c33;max-height:30vh;overflow-y:auto}
.ic-body b{color:#8e1f1f}
.ic-body .tag{display:inline-block;background:#a02824;color:#f6e9d8;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:6px;letter-spacing:1px}
#infocard.closed .ic-body{display:none}
#viewbar{bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.vb{display:flex;align-items:center;gap:7px;background:rgba(30,26,18,.9);border:1px solid rgba(201,162,39,.4);color:#e8dfc8;border-radius:999px;padding:8px 16px;font-size:13px;letter-spacing:2px;transition:.2s}
.vb b{color:var(--gold);font-size:12px}
.vb:hover{background:rgba(201,162,39,.18)}
.vb.on{background:var(--gold);color:#262219;border-color:var(--gold)}
.vb.on b{color:#262219}
#statusbar{bottom:0;left:0;right:0;height:26px;background:rgba(30,26,18,.88);color:#cbbd97;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px;letter-spacing:1px}
#statusbar .dot{color:var(--gold);margin:0 6px}
@media (max-width:760px){#brand h1{font-size:32px}#panel{width:200px}#infocard{width:262px}}
</style>

<body>
<canvas id="c"></canvas>

<header id="brand" class="ui">
  <h1>抬梁之上<span class="seal">营造</span></h1>
  <p>单檐歇山殿 · 交互式营造解析</p>
  <div class="rule"></div>
</header>

<aside id="panel" class="ui">
  <h2>营造控制台</h2>
  <div class="sec">

<nav id="viewbar" class="ui">

  <button class="vb" data-view="side"><b>02</b>侧面</button>
  <button class="vb" data-view="top"><b>03</b>俯瞰</button>

<footer id="statusbar" class="ui"><span id="stLeft"></span><span id="stRight"></span></footer>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============ 渲染器 / 场景 / 相机 ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2ead8);
scene.fog = new THREE.Fog(0xf2ead8, 70, 190);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(26, 17, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 9;
controls.maxDistance = 130;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.addEventListener('start', () => { viewTween.active = false; });

/* ============ 灯光 ============ */
const hemi = new THREE.HemisphereLight(0xfff5e0, 0xcbbfa5, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.1);
sun.position.set(28, 42, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0006;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
fill.position.set(-25, 20, -20);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(120, 48),
  new THREE.MeshStandardMaterial({ color: 0xe6dcc4, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============ 色彩 palette ============ */
const C = {
  stone: 0xd8d2c2, stoneDark: 0xc4bca8, red: 0x8e1f1f, redDark: 0x6e1717,
  gold: 0xc9a227, lattice: 0xd4af37, bracket: 0x476b5c,
  tile: 0x6b6f74, tileDark: 0x5d6165, gable: 0x6e2a24, chiwen: 0x4e6e63,
  wood: 0x7a2e26, rafter: 0x5e1a16, black: 0x2b2320
};

/* ============ 营造尺寸（米） ============ */
const PLAT_H = 1.2, PLAT_W = 25.0, PLAT_D = 16.4;
const BAY_X = 3.6, BAY_Z = 3.2;
const COL_XS = [-9, -5.4, -1.8, 1.8, 5.4, 9];
const COL_ZS = [-4.8, -1.6, 1.6, 4.8];
const COL_R = 0.28, COL_H = 5.0;
const COL_TOP = 1.38 + COL_H;            // 6.38 柱顶
const BEAM_T = COL_TOP + 0.42;           // 6.80 额枋顶
const BR_B = BEAM_T + 0.22, BR_T = BR_B + 0.5; // 斗拱 7.02..7.52
const EAVE_Y = 7.66, RIDGE_Y = 11.4, RIDGE_L = 12.0;
const W = 23.2, D = 14.8, RL = 12.0;     // 檐口 半宽11.6 半深7.4
const RISE = RIDGE_Y - EAVE_Y;           // 3.74
const FG = 0.55;                          // 山花分界（垂脊→戗脊）
const GX = RL / 2 + (W / 2 - RL / 2) * FG;   // 9.08
const GZ = (D / 2) * FG;                      // 4.07
const GY = EAVE_Y + RISE * Math.pow(1 - FG, 1.5) + 1.15 * Math.pow(FG, 1.4); // 9.29

/* ============ 分组（图层） ============ */
const G = {};
['platform', 'columns', 'wallsF', 'wallsB', 'wallsL', 'wallsR',
 'brackets', 'roof', 'ornaments', 'lanterns', 'markers'].forEach(n => {
  G[n] = new THREE.Group(); scene.add(G[n]);
});

const clock = new THREE.Clock();

/* ============ 材质 ============ */
function std(c, r = 0.8, m = 0) {
  return new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
}
const M = {
  stone: std(C.stone, .92), stoneDark: std(C.stoneDark, .95),
  red: std(C.red, .55), redDark: std(C.redDark, .6),
  gold: std(C.gold, .35, .65), lattice: std(C.lattice, .3, .75),
  bracket: std(C.bracket, .6),
  tile: new THREE.MeshStandardMaterial({ color: C.tile, roughness: .72, metalness: .08, side: THREE.DoubleSide }), tileDark: std(C.tileDark, .75),
  gable: std(C.gable, .7), wood: std(C.wood, .65),
  rafter: std(C.rafter, .7), black: std(C.black, .7),
  chiwen: new THREE.MeshStandardMaterial({ color: C.chiwen, roughness: .35, metalness: .25, side: THREE.DoubleSide }),
  lantern: new THREE.MeshStandardMaterial({ color: C.lantern, roughness: .5, emissive: 0xff5a2a, emissiveIntensity: .06 })
};

/* ============ 几何工具 ============ */
function xform(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
    new THREE.Vector3(1, 1, 1)
  );
  geo.applyMatrix4(m); return geo;
}
function box(w, h, d, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  return xform(new THREE.BoxGeometry(w, h, d), x, y, z, rx, ry, rz);
}
function cyl(rt, rb, h, seg, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  return xform(new THREE.CylinderGeometry(rt, rb, h, seg), x, y, z, rx, ry, rz);
}
function ball(r, x, y, z, ws = 10, hs = 8) {
  return xform(new THREE.SphereGeometry(r, ws, hs), x, y, z);
}
function mergeTo(group, geos, mat) {
  const m = new THREE.Mesh(mergeGeometries(geos, false), mat);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m); return m;
}
// 以 p1→p2 为 +Z 轴、mid 为中点 的盒体变换（用于椽子/脊）
function segBox(w, h, len, p1, p2, up = new THREE.Vector3(0, 1, 0)) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const L = dir.length(); dir.normalize();
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  const m = new THREE.Matrix4().lookAt(p2, mid, up);
  m.setPosition(mid);
  return xform(new THREE.BoxGeometry(w, h, L * 1.12), 0, 0, 0).applyMatrix4(m)
    && xform(new THREE.BoxGeometry(w, h, L * 1.12), 0, 0, 0).applyMatrix4(m);
}
function segBoxGeo(w, h, len, p1, p2) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const L = dir.length(); dir.normalize();
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  const m = new THREE.Matrix4().lookAt(p2, mid, new THREE.Vector3(0, 1, 0));
  m.setPosition(mid);
  const g = new THREE.BoxGeometry(w, h, L * 1.12);
  g.applyMatrix4(m);
  return g;
}

/* ============ 石作台基：台基 / 踏跺 / 望柱 / 栏板 ============ */
{
  const geos = [], dark = [];
  // 基座与压面
  geos.push(box(PLAT_W + 0.8, 0.25, PLAT_D + 0.8, 0, 0.125, 0));            // 土衬石
  geos.push(box(PLAT_W, PLAT_H - 0.25, PLAT_D, 0, 0.25 + (PLAT_H - 0.25) / 2, 0)); // 台基身
  geos.push(box(PLAT_W + 0.6, 0.18, PLAT_D + 0.6, 0, PLAT_H + 0.09, 0));    // 台面
  // 前檐踏跺（五级）+ 垂带石
  const STEP_N = 5, STEP_R = 0.24, STEP_T = 0.34, STEP_W = 4.2;
  const platZ = PLAT_D / 2 + 0.3; // 台明边缘（台面半深）
  for (let k = 0; k < STEP_N; k++) {
    const topY = PLAT_H + 0.18 - STEP_R * k;
    const depth = STEP_T * (STEP_N - k);
    geos.push(box(STEP_W, topY, depth, 0, topY / 2, platZ + depth / 2));
  }
  const hy = PLAT_H + 0.18 + 0.06, hz = platZ + STEP_T * STEP_N + 0.14;
  for (const sx of [-1, 1]) { // 垂带石（斜置护边）
    const p1 = new THREE.Vector3(sx * (STEP_W / 2 + 0.15), 0.06, platZ - 0.06);
    const p2 = new THREE.Vector3(sx * (STEP_W / 2 + 0.15), hy, hz);
    geos.push(segBoxGeo(0.3, 0.16, 1, p1, p2));
    geos.push(box(0.34, 0.3, 0.5, sx * (STEP_W / 2 + 0.15), hy + 0.14, hz + 0.1)); // 抱鼓石
  }
  geos.push(box(1.8, PLAT_H + 0.18, STEP_T * STEP_N + 0.4, 0, (PLAT_H + 0.18) / 2, platZ + (STEP_T * STEP_N + 0.4) / 2 - 0.1)); // 御路
  mergeTo(G.platform, geos, M.stone);
  // 望柱与栏板（台面四周，前檐避让踏跺）
  const bal = [], slab = [];
  const topY = PLAT_H + 0.18;
  const ez = PLAT_D / 2 + 0.3, ex = PLAT_W / 2 + 0.3;
  function baluster(x, z) {
    bal.push(box(0.22, 0.1, 0.22, x, topY + 0.05, z));
    bal.push(cyl(0.07, 0.085, 0.42, 8, x, topY + 0.31, z));
    bal.push(ball(0.105, x, topY + 0.58, z, 10, 8));
    bal.push(xform(new THREE.SphereGeometry(0.1, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), x, topY + 0.6, z));
  }
  function railPanel(x, z, len, ry) {
    slab.push(box(len, 0.3, 0.08, x, topY + 0.2, z, 0, ry, 0));
  }
  // 前 / 后檐
  for (const zz of [ez, -ez]) {
    const xs = []; for (let x = -11.6; x <= 11.61; x += 2.58) xs.push(x);
    xs.forEach((x, i) => {
      if (zz > 0 && Math.abs(x) < 3.1) return; // 让开踏跺
      baluster(x, zz);
      if (i < xs.length - 1 && !(zz > 0 && Math.abs((x + xs[i + 1]) / 2) < 3.1))
        railPanel((x + xs[i + 1]) / 2, zz, xs[i + 1] - x - 0.24, 0);
    });
  }
  // 山面
  for (const xx of [ex, -ex]) {
    const zs = []; for (let z = -7.0; z <= 7.01; z += 2.33) zs.push(z);
    zs.forEach((z, i) => {
      baluster(xx, z);
      if (i < zs.length - 1) railPanel(xx, (z + zs[i + 1]) / 2, zs[i + 1] - z - 0.24, Math.PI / 2);
    });
  }
  mergeTo(G.platform, bal, M.stone);
  mergeTo(G.platform, slab, M.stoneDark);
  // 庭院甬道
  const path = box(5, 0.05, 22, 0, 0.03, platZ + STEP_T * STEP_N + 11.2);
  mergeTo(G.platform, [path], std(0xd9d0b8, .95));
}

/* ============ 大木：檐柱 / 柱础 / 额枋 / 平板枋 / 雀替 ============ */
{
  const cols = [], stones = [], beams = [], beamsTop = [], que = [];
  for (const x of COL_XS) for (const z of COL_ZS) {
    if (Math.abs(x) < 9.01 && Math.abs(z) < 4.01) continue; // 仅外圈檐柱
    cols.push(cyl(COL_R - 0.02, COL_R + 0.01, COL_H, 14, x, 1.38 + COL_H / 2, z));
    stones.push(cyl(0.38, 0.43, 0.25, 12, x, 1.505, z));            // 柱础
  }
  // 额枋（额枋上皮至斗拱）与前檐金枋线脚
  for (const zz of [4.8, -4.8]) {
    beams.push(box(18.6, 0.42, 0.3, 0, COL_TOP + 0.21, zz));
    beamsTop.push(box(18.9, 0.22, 0.4, 0, BEAM_T + 0.11, zz));
  }
  for (const xx of [9, -9]) {
    beams.push(box(0.3, 0.42, 9.6, xx, COL_TOP + 0.21, 0));
    beamsTop.push(box(0.4, 0.22, 9.9, xx, BEAM_T + 0.11, 0));
  }
  // 雀替（柱顶与额枋之间，贴墙一面）
  for (const x of COL_XS) for (const zz of [4.94, -4.94])
    que.push(box(0.46, 0.5, 0.1, x, COL_TOP + 0.02, zz));
  for (const z of COL_ZS) for (const xx of [9.14, -9.14])
    que.push(box(0.1, 0.5, 0.46, xx, COL_TOP + 0.02, z));
  mergeTo(G.columns, cols, M.red);
  mergeTo(G.columns, stones, M.stoneDark);
  mergeTo(G.columns, beams, M.red);
  mergeTo(G.columns, beamsTop, M.redDark);
  mergeTo(G.columns, que, M.gold);
}

/* ============ 墙体 / 槅扇门窗 ============ */
{
  // —— 前檐五间：槅扇（红框 + 金色棂格）——
  const red = [], gold = [];
  const wallZ = 4.8, wallT = 0.3, y0 = 1.38, y1 = 6.38;
  // 前檐上下槛
  red.push(box(17.7, 0.5, wallT, 0, y0 + 0.25, wallZ));
  red.push(box(17.7, 0.35, wallT, 0, y1 - 0.175, wallZ));
  const bayC = [-7.2, -3.6, 0, 3.6, 7.2];
  for (const x0 of bayC) {
    const w = 3.04, yTop = y1 - 0.35, yBot = y0 + 0.5, h = yTop - yBot, yc = (yTop + yBot) / 2;
    // 边框
    red.push(box(0.1, h, 0.12, x0 - w / 2 + 0.05, yc, wallZ));
    red.push(box(0.1, h, 0.12, x0 + w / 2 - 0.05, yc, wallZ));
    red.push(box(w, 0.12, 0.12, x0, yTop - 0.06, wallZ));
    red.push(box(w, 0.12, 0.12, x0, yBot + 0.06, wallZ));
    // 裙板（下）与 绦环板（上）
    gold.push(box(w - 0.24, 1.0, 0.06, x0, yBot + 0.56, wallZ));

/* ============ 歇山屋顶：参数化坡面（凹曲举架 + 翼角起翘） ============ */
function roofPoint(kind, s, t, out) {
  const a = 2 * s - 1;
  if (kind === 'F' || kind === 'B') {
    const zn = kind === 'F' ? 1 : -1;
    const x = a * (W / 2 + (RL / 2 - W / 2) * t);
    const z = zn * (D / 2) * (1 - t);
    const y = EAVE_Y + RISE * Math.pow(t, 1.5)
      + 1.15 * Math.pow(Math.abs(a), 3) * Math.pow(1 - t, 1.4);
    return out.set(x, y, z);
  }
  const xn = kind === 'R' ? 1 : -1;
  const z = a * ((D / 2) * (1 - t) + GZ * t);
  const x = xn * ((W / 2) * (1 - t) + GX * t);
  const y = EAVE_Y + (GY - EAVE_Y) * Math.pow(t, 1.45)
    + 1.15 * Math.pow(Math.abs(a), 3) * Math.pow(1 - t, 1.4);
  return out.set(x, y, z);
}
function roofNormal(kind, s, t, out) {
  const e = 0.004;
  const pA = roofPoint(kind, Math.min(1, s + e), t, new THREE.Vector3());
  const pB = roofPoint(kind, Math.max(0, s - e), t, new THREE.Vector3());
  const pC = roofPoint(kind, s, Math.min(1, t + e), new THREE.Vector3());
  const pD = roofPoint(kind, s, Math.max(0, t - e), new THREE.Vector3());
  const t1 = new THREE.Vector3().subVectors(pA, pB);
  const t2 = new THREE.Vector3().subVectors(pC, pD);
  out.crossVectors(t2, t1).normalize();
  return out;
}
const CORR_K = Math.PI * 2 / 0.32; // 瓦垄间距 0.32m
function buildSlope(kind) {
  const isFB = kind === 'F' || kind === 'B';
  const sSeg = isFB ? 292 : 186, tSeg = isFB ? 26 : 22;
  const pos = [], nor = [], idx = [];
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  for (let j = 0; j <= tSeg; j++) {
    for (let i = 0; i <= sSeg; i++) {
      const s = i / sSeg, t = j / tSeg;
      roofPoint(kind, s, t, p);
      // 瓦垄凸起：沿坡面法向的正弦凸脊（真实几何）
      const ph = (isFB ? p.x : p.z) * CORR_K;
      const fade = 1 - THREE.MathUtils.smoothstep(t, 0.78, 0.97);
      const d = 0.085 * Math.pow(0.5 + 0.5 * Math.cos(ph), 0.9) * fade;
      roofNormal(kind, s, t, n);
      pos.push(p.x + n.x * d, p.y + n.y * d, p.z + n.z * d);
      nor.push(n.x, n.y, n.z);
    }
  }
  for (let j = 0; j < tSeg; j++) for (let i = 0; i < sSeg; i++) {
    const a = j * (sSeg + 1) + i, b = a + 1, c = a + sSeg + 1, dd = c + 1;
    idx.push(a, c, b, b, c, dd);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  const mesh = new THREE.Mesh(g, M.tile);
  mesh.castShadow = true; mesh.receiveShadow = true;
  G.roof.add(mesh);
}

// 檐缘曲线 E(f)：脊端 f=0 → 翼角 f=1（前后左右共用）
function edgePoint(sx, sz, f, out) {

/* ============ 瓦作：瓦当 / 滴水 / 檐椽（真实几何） ============ */
{
  const wadang = [], dishui = [], chuans = [];
  function eaveRow(kind) {
    const isFB = kind === 'F' || kind === 'B';
    const n = isFB ? 71 : 45;
    const lim = isFB ? W / 2 - 0.15 : D / 2 - 0.15;
    for (let m = -Math.floor(n / 2); m <= Math.floor(n / 2); m++) {
      const c = m * 0.32;                       // 瓦垄中线坐标（x 或 z）
      if (Math.abs(c) > lim) continue;
      const s = isFB ? (c / W + 0.5) : (c / D + 0.5);
      const p = roofPoint(kind, s, 0.004, new THREE.Vector3());
      const nrm = roofNormal(kind, s, 0.004, new THREE.Vector3());
      // —— 瓦当（圆瓦 + 当心 + 弦纹） ——
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm);
      const disc = new THREE.CylinderGeometry(0.125, 0.125, 0.07, 14);
      disc.applyQuaternion(q); disc.translate(p.x + nrm.x * 0.04, p.y + nrm.y * 0.04, p.z + nrm.z * 0.04);
      wadang.push(disc);
      const boss = ball(0.05, p.x + nrm.x * 0.09, p.y + nrm.y * 0.09, p.z + nrm.z * 0.09, 8, 6);
      wadang.push(boss);
      const qz = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), nrm);
      const ring = new THREE.TorusGeometry(0.095, 0.018, 6, 14);
      ring.applyQuaternion(qz);
      ring.translate(p.x + nrm.x * 0.078, p.y + nrm.y * 0.078, p.z + nrm.z * 0.078);
      wadang.push(ring);
      // —— 滴水（两垄之间） ——
      if (m < Math.floor(n / 2)) {
        const c2 = (m + 0.5) * 0.32;
        if (Math.abs(c2) < lim + 0.1) {
          const s2 = isFB ? (c2 / W + 0.5) : (c2 / D + 0.5);
          const p2 = roofPoint(kind, s2, 0.002, new THREE.Vector3());
          const n2 = roofNormal(kind, s2, 0.002, new THREE.Vector3());
          const tan = new THREE.Vector3();
          const pUp = roofPoint(kind, s2, 0.05, new THREE.Vector3());
          tan.subVectors(pUp, p2).normalize(); // 顺坡向下
          const plate = box(0.22, 0.045, 0.42);
          const m4 = new THREE.Matrix4().lookAt(new THREE.Vector3(), tan.clone().negate(), new THREE.Vector3(0, 0, 1));
          plate.applyMatrix4(m4);
          plate.translate(p2.x + n2.x * 0.01 - tan.x * 0.10, p2.y + n2.y * 0.01 - tan.y * 0.10 - 0.05, p2.z + n2.z * 0.01 - tan.z * 0.10);
          dishui.push(plate);
        }
      }
      // —— 檐椽（檐口下放射排列） ——
      const n3 = roofNormal(kind, s, 0.0, new THREE.Vector3());
      const p0 = roofPoint(kind, s, 0.0, new THREE.Vector3());
      const pU = roofPoint(kind, s, 0.04, new THREE.Vector3());
      const tng = new THREE.Vector3().subVectors(pU, p0).normalize();
      const inner = p0.clone().addScaledVector(tng, 0.5).addScaledVector(n3, -0.07);
      const outer = p0.clone().addScaledVector(tng, -0.62).addScaledVector(n3, -0.07);
      chuans.push(segBoxGeo(0.11, 0.12, 1, inner, outer));
    }
  }

}

  [-3.6, 4.0, 5.15], // 7 槅扇
  [9.0, 3.4, 5.2],   // 8 檐柱
  [0, 1.15, 10.6],   // 9 踏跺
  [-8.0, 2.3, 8.65], // 10 望柱
  [9.75, 10.6, 0],   // 11 山花悬鱼
  [-6.0, 6.35, 6.9]  // 12 灯笼
];
const INFO = [

  '<b>正脊</b><br>屋顶最高处横向主脊，压盖前后两坡瓦垄之首，以灰瓦层层垒砌、桐油灰浆勾缝，两端收头于鸱吻之下，为歇山顶「九脊」之首。',
  '<b>歇山屋面</b><br>由前后两坡与左右两坡组成，坡面依举架之法内凹起弧，灰色筒瓦顺坡而下，瓦垄以真实几何逐根凸起，檐口曲线平整顺滑、舒展如翼。',
  '<b>瓦当 · 滴水</b><br>檐口筒瓦前端施圆形瓦当，拦护瓦垄、压住连檐，当面可饰兽纹或文字；垄间以滴水收边，导雨下滴、护持檐椽。',
  '<b>翼角起翘</b><br>檐角椽飞外挑、老角梁翘起，使檐口两端如鸟斯革、如翚斯飞。凹曲屋面与反宇之势，令雨水抛远、光影轻盈，是中国屋顶最动人的轮廓。',
  '<b>斗拱层</b><br>以坐斗、横拱、华拱、下昂层层出跳，承托深远檐口；斗与拱逐朵计心，兼具悬挑、耗能、装饰与等级象征，青绿彩画、金线缘边。',
  '<b>槅扇门窗</b><br>明间与次间安隔扇，红框金棂：下为裙板，中为步步锦棂格，上为绦环板，采光而蔽风雨，暖金之色映于深红檐柱之间。',
  '<b>檐柱</b><br>殿身最外一圈檐柱，深红油饰，柱身收分、柱头微侧脚，下垫石柱础以防潮隔湿，将屋面与斗拱之重稳稳传入台基。',
  '<b>台基 · 踏跺</b><br>白石台基抬高殿身、隔绝地湿；正面设踏跺五级，两侧垂带石护持、中铺御路，拾级而上顿生崇敬之心。',
  '<b>望柱</b><br>台基四周环以石栏杆：望柱头雕覆莲，柱身素面，间以栏板，护持登临者，亦界分庭院之层级。',
  '<b>山花 · 悬鱼</b><br>歇山顶两端三角形山面以红板封护，博风板缘边；脊下悬鱼高挂，取「鱼沉深木、厌火」之意，是歇山顶最鲜明之标志。',
  '<b>檐下灯笼</b><br>檐口悬红纱灯笼，昼为饰、夜为灯。入夜点亮后暖光溢出，映照斗拱槅扇，殿宇轮廓于夜色中愈显庄重。'
];
const OVERVIEW = '<b>总览 · 单檐歇山殿</b><br>面阔五间、进深三间：石作台基环以望柱，深红檐柱承托层叠斗拱，金色槅扇映于檐下，灰瓦歇山顶鸱吻高耸、翼角起翘。点击场景中<b>编号标记</b>逐一查看构件解说；右侧面板可切换视角、图层与昼夜。';
const spriteTexCache = {};
function markerTexture(n) {
  if (spriteTexCache[n]) return spriteTexCache[n];
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.beginPath(); ctx.arc(64, 64, 52, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(30,26,18,.9)'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#c9a227'; ctx.stroke();
  ctx.fillStyle = '#e8c85a';
  ctx.font = '700 54px "Kaiti SC","STKaiti",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), 64, 68);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  spriteTexCache[n] = tex;
  return tex;
}
const markers = [];
for (let i = 0; i < 12; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: markerTexture(i + 1), depthTest: true }));
  sp.position.set(...MARKER_POS[i]);
  sp.scale.set(1.5, 1.5, 1);
  sp.userData.index = i;
  G.markers.add(sp);
  markers.push(sp);
}

/* ============ 视角预设 ============ */
const views = {
  front: { p: [0, 8, 38], t: [0, 6, 0], n: '01 正面' },
  side: { p: [38, 8, 0], t: [0, 6, 0], n: '02 侧面' },
  top: { p: [0.5, 46, 0.5], t: [0, 4, 0], n: '03 俯瞰' },
  iso: { p: [26, 17, 26], t: [0, 5.8, 0], n: '04 轴测' }
};
let curView = 'front';
const viewTween = { active: false, t: 0, dur: 1.4, fp: new THREE.Vector3(), tp: new THREE.Vector3(), ft: new THREE.Vector3(), tt: new THREE.Vector3() };
function goView(name) {
  const v = views[name]; if (!v) return;
  curView = name;
  viewTween.fp.copy(camera.position);
  viewTween.tp.set(...v.p);
  viewTween.ft.copy(controls.target);
  viewTween.tt.set(...v.t);
  viewTween.t = 0; viewTween.active = true;
  document.querySelectorAll('[data-view]').forEach(b =>
    b.classList.toggle('on', b.dataset.view === name));
  updateStatus();
}
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => goView(b.dataset.view)));

/* ============ 图层显隐 ============ */
const layerMap = {
  platform: [G.platform], columns: [G.columns],
  walls: [G.wallsF, G.wallsB, G.wallsL, G.wallsR],
  brackets: [G.brackets], roof: [G.roof], ornaments: [G.ornaments], lanterns: [G.lanterns]
};
document.querySelectorAll('[data-layer]').forEach(cb => {
  cb.addEventListener('change', () => {
    (layerMap[cb.dataset.layer] || []).forEach(g => g.visible = cb.checked);
    updateStatus();
  });
});

/* ============ 解构动画 ============ */
const explodeMap = [
  [G.platform, [0, 0, 0]], [G.columns, [0, 0, 0]],
  [G.wallsF, [0, 0, 2.6]], [G.wallsB, [0, 0, -2.6]],
  [G.wallsL, [-2.6, 0, 0]], [G.wallsR, [2.6, 0, 0]],
  [G.brackets, [0, 2.4, 0]], [G.roof, [0, 5.4, 0]],
  [G.ornaments, [0, 8.4, 0]], [G.lanterns, [0, -2.6, 0]]
];
let explodeTarget = 0, explodeT = 0;
const btnExplode = document.getElementById('btnExplode');
btnExplode.addEventListener('click', () => {
  explodeTarget = explodeTarget > 0.5 ? 0 : 1;
  btnExplode.textContent = explodeTarget ? '合拢' : '解构';
  btnExplode.classList.toggle('on', !!explodeTarget);
  updateStatus();
});

/* ============ 入夜点灯 ============ */
let nightTarget = 0, nightT = 0;
const btnNight = document.getElementById('btnNight');
const dayBg = new THREE.Color(0xf2ead8), nightBg = new THREE.Color(0x181b22);
const daySun = new THREE.Color(0xfff0d8), nightSun = new THREE.Color(0x9fb4d8);
btnNight.addEventListener('click', () => {
  nightTarget = nightTarget > 0.5 ? 0 : 1;
  btnNight.textContent = nightTarget ? '破晓 · 熄灯' : '入夜 · 点灯';
  btnNight.classList.toggle('on', !!nightTarget);
  updateStatus();
});

/* ============ 标注显隐 ============ */
let annotOn = true;
const btnAnnot = document.getElementById('btnAnnot');
btnAnnot.addEventListener('click', () => {
  annotOn = !annotOn;
  G.markers.visible = annotOn;
  btnAnnot.textContent = annotOn ? '显' : '隐';
  btnAnnot.classList.toggle('on', annotOn);
  updateStatus();
});

/* ============ 自动旋转 ============ */
const btnRotate = document.getElementById('btnRotate');
btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.textContent = controls.autoRotate ? '播' : '停';
  btnRotate.classList.toggle('on', controls.autoRotate);
  updateStatus();
});

/* ============ 信息卡 ============ */
const icTitle = document.getElementById('icTitle');
const icBody = document.getElementById('icBody');
const infocard = document.getElementById('infocard');
const icToggle = document.getElementById('icToggle');
function showInfo(i) {
  icTitle.textContent = ['鸱吻', '正脊', '歇山屋面', '瓦当 · 滴水', '翼角起翘', '斗拱层', '槅扇门窗', '檐柱', '台基 · 踏跺', '望柱', '山花 · 悬鱼', '檐下灯笼'][i];
  icBody.innerHTML = INFO[i];
  infocard.classList.remove('closed');
  icToggle.textContent = '−';
}
function showOverview() {
  icTitle.textContent = '总览';
  icBody.innerHTML = OVERVIEW;
  infocard.classList.remove('closed');
  icToggle.textContent = '−';
}
icToggle.addEventListener('click', () => {
  const closed = infocard.classList.toggle('closed');
  icToggle.textContent = closed ? '＋' : '−';
});
showOverview();

/* ============ 标记点选 ============ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX = 0, downY = 0, hoverIdx = -1;
function setPointer(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(markers, false);
  if (hits.length) {
    showInfo(hits[0].object.userData.index);
    markers.forEach((m, i) => {
      const s = i === hits[0].object.userData.index ? 1.9 : 1.5;
      m.scale.set(s, s, 1);
    });
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(markers, false);
  renderer.domElement.style.cursor = hits.length ? 'pointer' : 'grab';
});

/* ============ 状态栏 ============ */
const stLeft = document.getElementById('stLeft');
const stRight = document.getElementById('stRight');
function updateStatus() {
  stLeft.innerHTML = '<span class="dot">◆</span>视角 ' + (views[curView] ? views[curView].n : '') +
    '<span class="dot">◆</span>' + (nightTarget ? '夜 · 灯笼已点亮' : '昼') +
    '<span class="dot">◆</span>旋转 ' + (controls.autoRotate ? '开' : '关') +
    '<span class="dot">◆</span>标注 ' + (annotOn ? '显' : '隐') +
    '<span class="dot">◆</span>解构 ' + Math.round(explodeT * 100) + '%';
  stRight.textContent = '左键拖拽旋转 · 滚轮缩放 · 点击编号标记查看构件';
}
updateStatus();

/* ============ 主循环 ============ */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  // 视角补间
  if (viewTween.active) {
    viewTween.t += dt / viewTween.dur;
    const k = viewTween.t >= 1 ? 1 : 1 - Math.pow(1 - viewTween.t, 3);
    camera.position.lerpVectors(viewTween.fp, viewTween.tp, k);
    controls.target.lerpVectors(viewTween.ft, viewTween.tt, k);
    if (viewTween.t >= 1) viewTween.active = false;
  }
  // 解构补间
  explodeT += (explodeTarget - explodeT) * Math.min(1, dt * 3.2);
  if (Math.abs(explodeTarget - explodeT) < 0.001) explodeT = explodeTarget;
  for (const [g, dir] of explodeMap)
    g.position.set(dir[0] * explodeT, dir[1] * explodeT, dir[2] * explodeT);
  // 昼夜过渡
  nightT += (nightTarget - nightT) * Math.min(1, dt * 2.2);
  if (Math.abs(nightTarget - nightT) < 0.001) nightT = nightTarget;
  scene.background.copy(dayBg).lerp(nightBg, nightT);
  scene.fog.color.copy(scene.background);
  sun.intensity = 2.1 - 1.85 * nightT;
  sun.color.copy(daySun).lerp(nightSun, nightT);
  hemi.intensity = 0.55 - 0.42 * nightT;
  fill.intensity = 0.35 - 0.25 * nightT;
  M.lantern.emissiveIntensity = 0.06 + 2.4 * nightT;
  for (const pl of lanternLights) pl.intensity = 26 * nightT;
  controls.update();
  updateStatus();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
