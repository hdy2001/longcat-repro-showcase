<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抬梁之上 · 单檐歇山殿</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #d8d1c0; }
  #c { display: block; width: 100vw; height: 100vh; }
  .ui { position: fixed; z-index: 10; color: #f0ead9; font-family: "Songti SC", "STSong", "STZhongsong", "SimSun", serif; user-select: none; }
  #title { top: 28px; left: 34px; }
  #title h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: 6px; color: #2b2419; }
  #title h1 .dot { color: #a03a2a; }
  #title .sub { margin-top: 8px; font-size: 14px; letter-spacing: 4px; color: #6d6350; }
  #title .seal {
    display: inline-block; margin-left: 10px; padding: 3px 5px 2px; vertical-align: 6px;
    font-size: 12px; letter-spacing: 2px; color: #f5efe0; background: #a03a2a; border-radius: 3px;
  }
  #title .desc { margin-top: 10px; font-size: 12px; letter-spacing: 1.5px; color: #8a7f6a; line-height: 1.8; }
  #hint { left: 34px; bottom: 26px; font-size: 12px; letter-spacing: 2px; color: #8a7f6a; }
  #hint b { color: #6d6350; font-weight: 600; }
  #panel { right: 30px; bottom: 26px; display: flex; gap: 8px; }
  #panel button {
    font-family: inherit; font-size: 13px; letter-spacing: 2px; cursor: pointer;
    padding: 8px 16px; color: #e8e0cc; background: rgba(30, 26, 20, 0.72);
    border: 1px solid rgba(232, 224, 204, 0.28); border-radius: 4px; backdrop-filter: blur(4px);
    transition: background .2s, color .2s;
  }
  #panel button:hover { background: rgba(120, 42, 30, 0.85); color: #fff; }
  #panel button.active { background: #a03a2a; color: #fff; border-color: #a03a2a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="title">
  <h1>抬梁<span class="dot">之上</span><span class="seal">营造</span></h1>
  <div class="sub">单檐歇山殿 · 程序化三维营造</div>
  <div class="desc">以台基为地，以柱网立骨，以斗栱承檐。<br>举折为坡，翼角起翘，九脊凌峙，是为歇山。</div>
</div>
<div class="ui" id="hint"><b>拖拽</b> 旋转 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>右键</b> 平移</div>
<div class="ui" id="panel">
  <button id="btnRotate" class="active">自动旋转</button>
  <button id="btnOrbit">环 绕</button>
  <button id="btnFront">正 视</button>
  <button id="btnSide">侧 视</button>
  <button id="btnTop">俯 视</button>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

/* ================= 基础 ================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8d1c0, 46, 120);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(11.5, 6.6, 13.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0xfff5e6, 0x8a8578, 0.85));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.75);
sun.position.set(11, 15, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 45;
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
fill.position.set(-9, 6, -10);
scene.add(fill);

/* ================= 材质 ================= */
const M = {
  wood:      new THREE.MeshStandardMaterial({ color: 0x7a2b22, roughness: 0.72 }),
  woodDark:  new THREE.MeshStandardMaterial({ color: 0x65251d, roughness: 0.75 }),
  woodDeep:  new THREE.MeshStandardMaterial({ color: 0x4a1b15, roughness: 0.8 }),
  dougong:   new THREE.MeshStandardMaterial({ color: 0x5b554a, roughness: 0.8 }),
  rafter:    new THREE.MeshStandardMaterial({ color: 0x6a2e22, roughness: 0.8 }),
  ridge:     new THREE.MeshStandardMaterial({ color: 0x26282c, roughness: 0.85 }),
  shanhua:   new THREE.MeshStandardMaterial({ color: 0x71291f, roughness: 0.78, side: THREE.DoubleSide }),
  stone:     new THREE.MeshStandardMaterial({ color: 0xe7e2d5, roughness: 0.92 }),
  stoneDark: new THREE.MeshStandardMaterial({ color: 0xd5cfbf, roughness: 0.95 }),
  ground:    new THREE.MeshStandardMaterial({ color: 0xd6d0c2, roughness: 1 }),
  gold:      new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.45, metalness: 0.55 }),
};

/* ================= 纹理（Canvas 程序化绘制） ================= */
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
/* 瓦垄：条纹沿坡向（纹理 v 方向），底缘一排瓦当 */
const tileTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#33363b'; g.fillRect(0, 0, w, h);
  const bw = w / 8;
  for (let i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? '#2e3136' : '#383b41';
    g.fillRect(i * bw, 0, bw, h);
    g.fillStyle = '#202226'; g.fillRect(i * bw, 0, 3, h);       // 垄缝
    g.fillStyle = '#44474d'; g.fillRect(i * bw + 4, 0, 2, h);    // 垄面微光
  }
  g.fillStyle = '#232529'; g.fillRect(0, 0, w, 16);              // 脊端收边
  for (let i = 0; i < 8; i++) {                                   // 瓦当
    g.beginPath(); g.arc(i * bw + bw / 2, h - 46, 26, 0, Math.PI * 2);
    g.fillStyle = '#1d1f23'; g.fill();
    g.lineWidth = 3; g.strokeStyle = '#3a3d42'; g.stroke();
    g.beginPath(); g.arc(i * bw + bw / 2, h - 46, 13, 0, Math.PI * 2);
    g.strokeStyle = '#2c2f34'; g.stroke();
  }
  g.fillStyle = '#26282c'; g.fillRect(0, h - 14, w, 14);
});
tileTex.wrapS = THREE.RepeatWrapping;
const tileTexA = tileTex.clone(); tileTexA.repeat.set(76, 1); tileTexA.needsUpdate = true; // 主坡
const tileTexB = tileTex.clone(); tileTexB.repeat.set(54, 1); tileTexB.needsUpdate = true; // 山面坡
const roofMatA = new THREE.MeshStandardMaterial({ map: tileTexA, roughness: 0.92, side: THREE.DoubleSide });
const roofMatB = new THREE.MeshStandardMaterial({ map: tileTexB, roughness: 0.92, side: THREE.DoubleSide });

/* 隔扇：方格格心 + 腰板 + 裙板 */
const doorTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#7c2d24'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#4a1b15';
  g.fillRect(0, 0, w, 16); g.fillRect(0, h - 16, w, 16); g.fillRect(0, 0, 16, h); g.fillRect(w - 16, 0, 16, h);
  g.save(); g.translate(16, 16);
  const iw = w - 32, ih = 300;
  g.fillStyle = '#7c2d24'; g.fillRect(0, 0, iw, ih);
  g.fillStyle = '#4a1b15';
  for (let i = 0; i <= 5; i++) g.fillRect(i * iw / 5 - 4, 0, 8, ih);      // 竖棂
  for (let i = 0; i <= 7; i++) g.fillRect(0, i * ih / 7 - 4, iw, 8);      // 横棂
  g.fillStyle = '#6e2a22'; g.fillRect(0, 316, iw, 26);                    // 腰板
  g.fillStyle = '#4a1b15'; g.fillRect(0, 316, iw, 3); g.fillRect(0, 339, iw, 3);
  g.fillStyle = '#742820'; g.fillRect(0, 356, iw, h - 32 - 356);         // 裙板
  g.lineWidth = 4; g.strokeStyle = '#5e1f1a';
  g.strokeRect(22, 374, iw - 44, h - 32 - 396);
  g.restore();
});
/* 直棂窗 */
const winTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#742820'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#4a1b15';
  g.fillRect(0, 0, w, 20); g.fillRect(0, h - 20, w, 20); g.fillRect(0, 118, w, 16);
  for (let i = 0; i < 9; i++) g.fillRect(16 + i * 26 - 4, 0, 9, h);
  g.fillRect(0, 0, 10, h); g.fillRect(w - 10, 0, 10, h);
});
/* 灯笼 */
const lampTex = canvasTex(256, 256, (g, w, h) => {
  for (let i = 0; i < 12; i++) {
    g.fillStyle = i % 2 ? '#c0392b' : '#a93226';
    g.fillRect(i * w / 12, 0, w / 12, h);
  }
  g.fillStyle = 'rgba(142,42,31,.9)';
  for (let i = 0; i < 12; i++) g.fillRect(i * w / 12 - 1, 0, 2, h);
  g.fillStyle = '#c9a227'; g.fillRect(0, 0, w, 40); g.fillRect(0, h - 40, w, 40);
  g.fillStyle = '#8a6d15'; g.fillRect(0, 36, w, 5); g.fillRect(0, h - 41, w, 5);
});

/* ================= 全局尺寸（米） ================= */
const BASE_H   = 1.17;   // 上层台基顶
const COL_H    = 3.4, COL_R = 0.21;
const COL_X = [-6.3, -2.1, 2.1, 6.3], COL_Z = 3.6;
const H_EAVE   = 5.87;   // 檐口瓦面
const H_RIDGE  = 8.35;   // 正脊
const L_RIDGE  = 2.9;    // 正脊半长
const W2 = 8.05, D2 = 5.75;              // 屋面半宽/半深（含出檐）
const Z_MID = D2 * 0.55;                 // 垂脊下端（俯视 z）
const Q = 1 - Z_MID / D2;
const H_MID = H_EAVE + (H_RIDGE - H_EAVE) * Math.pow(Q, 1.7); // 垂脊下端高
const SLOPE_P = 1.7, UPLIFT = 0.5;
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const root = new THREE.Group();
scene.add(root);
const shadowify = o => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

/* ================= 台基 / 踏跺 / 栏杆 ================= */
{
  const lower = new THREE.Mesh(new THREE.BoxGeometry(14.8, 0.62, 11.0), M.stoneDark);
  lower.position.y = 0.31; root.add(lower);
  const lowerTrim = new THREE.Mesh(new THREE.BoxGeometry(15.1, 0.07, 11.3), M.stone);
  lowerTrim.position.y = 0.645; root.add(lowerTrim);
  const upper = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.55, 9.8), M.stone);
  upper.position.y = 0.895; root.add(upper);
  const upperTrim = new THREE.Mesh(new THREE.BoxGeometry(13.9, 0.07, 10.1), M.stoneDark);
  upperTrim.position.y = 1.185; root.add(upperTrim);

  // 踏跺（正面中央 9 级）
  const steps = new THREE.Group();
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.13, 0.34), i % 2 ? M.stone : M.stoneDark);
    s.position.set(0, 1.17 - (i + 0.5) * 0.13, 4.9 + (i + 0.5) * 0.34);
    steps.add(s);
  }
  root.add(steps);
  // 垂带石 + 象眼石（抱鼓）
  for (const sx of [-1, 1]) {
    const len = Math.hypot(3.06, 1.17) + 0.15;
    const chu = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, len), M.stone);
    chu.position.set(sx * 2.06, 1.17 / 2 + 0.06, 4.9 + 3.06 / 2);
    chu.rotation.x = -Math.atan2(1.17, 3.06);
    root.add(chu);
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.24, 20), M.stoneDark);
    drum.rotation.z = Math.PI / 2;
    drum.position.set(sx * 2.06, 0.28, 7.98);
    root.add(drum);
    const block = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.42, 0.3), M.stone);
    block.position.set(sx * 2.06, 0.21, 7.82); root.add(block);
  }
  // 栏杆（环绕上层台基，踏跺处开口）
  const rail = new THREE.Group();
  const RX = 6.8, RZ = 4.9, OPEN = 1.95;
  const edges = [
    { from: [-RX, RZ], to: [-OPEN, RZ] }, { from: [OPEN, RZ], to: [RX, RZ] },
    { from: [RX, -RZ], to: [RX, RZ] }, { from: [-RX, RZ], to: [-RX, -RZ] },
    { from: [-RX, -RZ], to: [RX, -RZ] },
  ];
  for (const e of edges) {
    const [x1, z1] = e.from, [x2, z2] = e.to;
    const len = Math.hypot(x2 - x1, z2 - z1);
    const n = Math.max(2, Math.round(len / 1.45));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const post = new THREE.Group();
      const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.62, 0.17), M.stone);
      shaft.position.y = 0.31; post.add(shaft);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 14, 10), M.stoneDark);
      head.scale.y = 1.25; head.position.y = 0.68; post.add(head);
      post.position.set(x1 + (x2 - x1) * t, BASE_H + 0.035, z1 + (z2 - z1) * t);
      rail.add(post);
    }
    const nB = Math.max(1, Math.round(len / 1.45));
    for (let i = 0; i < nB; i++) {
      const t = (i + 0.5) / nB, segLen = len / nB - 0.2;
      const board = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2 - x1) > Math.abs(z2 - z1) ? segLen : 0.07, 0.42, Math.abs(x2 - x1) > Math.abs(z2 - z1) ? 0.07 : segLen), M.stone);
      board.position.set(x1 + (x2 - x1) * t, BASE_H + 0.26, z1 + (z2 - z1) * t);
      rail.add(board);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2 - x1) > Math.abs(z2 - z1) ? segLen + 0.04 : 0.1, 0.05, Math.abs(x2 - x1) > Math.abs(z2 - z1) ? 0.1 : segLen + 0.04), M.stoneDark);
      cap.position.set(board.position.x, BASE_H + 0.49, board.position.z);
      rail.add(cap);
    }
  }
  root.add(rail);
  shadowify(root);
}

/* ================= 地面 / 背景 ================= */
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(90, 64), M.ground);
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const sky = canvasTex(16, 512, (g2, w, h) => {
    const gr = g2.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#eee9de'); gr.addColorStop(0.6, '#ddd6c5'); gr.addColorStop(1, '#d0c8b6');
    g2.fillStyle = gr; g2.fillRect(0, 0, w, h);
  });
  scene.background = sky;
}

/* ================= 柱网 ================= */
{
  const colGeo = new THREE.CylinderGeometry(COL_R, COL_R + 0.02, COL_H, 20);
  const plinthGeo = new THREE.BoxGeometry(0.38, 0.13, 0.38);
  const capGeo = new THREE.CylinderGeometry(0.17, 0.19, 0.08, 16);
  for (const x of COL_X) for (const z of [-COL_Z, COL_Z]) addCol(x, z);
  for (const sx of [-1, 1]) addCol(sx * 6.3, 0);
  function addCol(x, z) {
    const c = new THREE.Mesh(colGeo, M.wood);
    c.position.set(x, BASE_H + COL_H / 2, z); root.add(c);
    const p = new THREE.Mesh(plinthGeo, M.stone); p.position.set(x, BASE_H + 0.065, z); root.add(p);
    const cap = new THREE.Mesh(capGeo, M.stoneDark); cap.position.set(x, BASE_H + 0.16, z); root.add(cap);
    // 雀替
    for (const sz of [-1, 1]) {
      const ct = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.13), M.woodDark);
      ct.position.set(x, BASE_H + COL_H - 0.32, z + sz * 0.3); root.add(ct);
    }
  }
  // 额枋 + 普拍枋
  const fang1 = new THREE.BoxGeometry(13.2, 0.3, 0.34);
  const fang2 = new THREE.BoxGeometry(0.34, 0.3, 7.62);
  for (const z of [-COL_Z, COL_Z]) {
    const f = new THREE.Mesh(fang1, M.wood); f.position.set(0, BASE_H + COL_H - 0.15, z); root.add(f);
    const p = new THREE.Mesh(new THREE.BoxGeometry(13.5, 0.2, 0.42), M.woodDark); p.position.set(0, BASE_H + COL_H + 0.1, z); root.add(p);
  }
  for (const x of [-6.3, 6.3]) {
    const f = new THREE.Mesh(fang2, M.wood); f.position.set(x, BASE_H + COL_H - 0.15, 0); root.add(f);
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.2, 7.9), M.woodDark); p.position.set(x, BASE_H + COL_H + 0.1, 0); root.add(p);
  }
}

/* ================= 斗拱 ================= */
function makeDougong() {
  const g = new THREE.Group();
  const add = (w, h, d, x, y, z, rx = 0) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.dougong);
    b.position.set(x, y, z); b.rotation.x = rx; g.add(b);
  };
  add(0.46, 0.2, 0.46, 0, 0.1, 0);            // 大斗
  add(0.17, 0.17, 0.95, 0, 0.28, 0.12);       // 华拱（出跳）
  add(0.85, 0.15, 0.2, 0, 0.42, 0.02);        // 瓜子栱
  add(0.28, 0.13, 0.28, 0, 0.54, 0.02);       // 交互斗
  add(1.35, 0.15, 0.22, 0, 0.65, 0.05);       // 令栱
  add(0.15, 0.13, 1.05, 0, 0.62, 0.12, -0.42);// 下昂
  add(0.15, 0.13, 0.7, 0, 0.7, -0.05, 0.38);  // 耍头
  add(0.2, 0.16, 0.9, 0, 0.82, 0.28);         // 衬方头
  return g;
}
{
  const y0 = BASE_H + COL_H + 0.2;
  const spots = [];
  for (const x of COL_X) { spots.push([x, COL_Z, 0]); spots.push([x, -COL_Z, Math.PI]); }
  for (const x of [-4.2, 0, 4.2]) { spots.push([x, COL_Z, 0]); spots.push([x, -COL_Z, Math.PI]); }
  for (const z of [-1.8, 0, 1.8]) { spots.push([6.3, z, Math.PI / 2]); spots.push([-6.3, z, -Math.PI / 2]); }
  for (const [x, z, ry] of spots) {
    const d = makeDougong();
    d.position.set(x, y0, z); d.rotation.y = ry;
    root.add(d);
  }
}

/* ================= 檐椽 / 飞椽 ================= */
{
  const mkRafters = (y, inner, outer) => {
    const pts = [];
    const per = 0.27;
    const edge = [];
    for (let x = -W2; x <= W2 + 0.001; x += per) edge.push([[x, D2], [x, -D2]]);
    for (let z = -D2 + per; z <= D2 - per + 0.001; z += per) edge.push([[W2, z], [-W2, z]]);
    const geo = new THREE.BoxGeometry(0.09, 0.11, 1);
    const inst = new THREE.InstancedMesh(geo, M.rafter, edge.length * 2);
    const m4 = new THREE.Matrix4(), q = new.Quaternion(), s = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
    let k = 0;
    for (const [p1, p2] of edge) {
      for (const [scale, off] of [[1, 0], [0.82, 0.14]]) {
        const [x1, z1] = [p1[0] * (1 - inner) + 0, p1[1] * (1 - inner)];
        const dir = new THREE.Vector2(x1, z1).normalize();
        const a = new THREE.Vector3(dir.x * inner * 0.5, 0, dir.y * inner * 0.5);
        const b = new THREE.Vector3(x1, 0, z1);
        const len = Math.hypot(b.x - a.x, b.z - a.z) + outer;
        const mid = new THREE.Vector3((a.x + b.x) / 2, y + (scale > 1 ? 0.13 : 0), (a.z + b.z) / 2);
        q.setFromAxisAngle(up, Math.atan2(b.x - a.x, b.z - a.z));
        s.set(1, 1, len);
        m4.compose(mid, q, s);
        inst.setMatrixAt(k++, m4);
      }
    }
    inst.count = k;
    inst.castShadow = true;
    root.add(inst);
  };
  mkRafters(H_EAVE - 0.26, 1.0, 0.18);
}

/* ================= 歇山顶曲面 ================= */
function roofY(z) { return H_EAVE + (H_RIDGE - H_EAVE) * Math.pow(1 - Math.min(z / D2, 1), SLOPE_P); }
function xSide(z) { return z <= Z_MID ? L_RIDGE : L_RIDGE + (W2 - L_RIDGE) * (z - Z_MID) / (D2 - Z_MID); }
function slopeMesh(nu, nv, vertsFn, mat) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const u = i / nu * 2 - 1, v = j / nv;
    const [x, y, z, uu, vv] = vertsFn(u, v);
    pos.push(x, y, z); uv.push(uu, vv);
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
{
  // 前坡 / 后坡
  for (const s of [1, -1]) {
    const mesh = slopeMesh(26, 22, (u, v) => {
      const z = v * D2;
      let x = u * xSide(z);
      let y = roofY(z);
      const f = sstep(0.45, 1, Math.abs(u)) * Math.pow(z / D2, 2.2) * UPLIFT;
      y += f; x *= 1 + 0.02 * f;
      return [x, y, s * z * (1 + 0.02 * f), u * 0.5 + 0.5, z / D2];
    }, roofMatA);
    root.add(mesh);
  }
  // 山面坡（左 / 右）
  for (const sx of [1, -1]) {
    const mesh = slopeMesh(18, 14, (u, v) => {
      const t = v;
      let x = (L_RIDGE + (W2 - L_RIDGE) * t) * sx;
      const zHalf = Z_MID + (D2 - Z_MID) * t;
      let z = u * zHalf;
      let y = H_EAVE + (H_MID - H_EAVE) * Math.pow(1 - t, SLOPE_P);
      const f = sstep(0.45, 1, Math.abs(u)) * Math.pow(Math.abs(z) / D2, 2.2) * UPLIFT;
      y += f; x *= 1 + 0.02 * f; z *= 1 + 0.02 * f;
      return [x, y, z, u * 0.5 + 0.5, (z / D2) * 0.5 + 0.5];
    }, roofMatB);
    root.add(mesh);
  }
}

/* ================= 屋脊 / 鸱吻 / 小兽 ================= */
function beamBetween(a, b, w, h, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, len, h), mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  mesh.castShadow = true;
  return mesh;
}
{
  // 正脊
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(L_RIDGE * 2 + 0.4, 0.3, 0.5), M.ridge);
  ridge.position.y = H_RIDGE + 0.1, ridge.castShadow = true; root.add(ridge);
  const ridgeTop = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, L_RIDGE * 2 + 0.5, 12), M.ridge);
  ridgeTop.rotation.z = Math.PI / 2;
  ridgeTop.position.y = H_RIDGE + 0.28; ridgeTop.castShadow = true; root.add(ridgeTop);

  // 鸱吻（侧影轮廓挤出）
  const chiShape = new THREE.Shape();
  chiShape.moveTo(-0.22, 0);
  chiShape.lineTo(0.22, 0);
  chiShape.lineTo(0.26, 0.5); chiShape.lineTo(0.20, 0.8);
  chiShape.lineTo(0.08, 1.02); chiShape.lineTo(-0.10, 1.0);
  chiShape.lineTo(-0.16, 0.86);
  chiShape.lineTo(-0.13, 0.45);
  chiShape.lineTo(-0.25, 0.53); chiShape.lineTo(-0.15, 0.56);
  chiShape.lineTo(-0.18, 0.2); chiShape.lineTo(-0.22, 0);
  const chiGeo = new THREE.ExtrudeGeometry(chiShape, { depth: 0.34, bevelEnabled: false });
  chiGeo.translate(0, 0, -0.17);
  for (const sx of [1, -1]) {
    const chi = new THREE.Mesh(chiGeo, M.ridge);
    chi.position.set(sx * (L_RIDGE + 0.12), H_RIDGE - 0.02, 0);
    if (sx < 0) chi.scale.x = -1;
    chi.castShadow = true; root.add(chi);
  }

  // 垂脊 + 戗脊 + 小兽
  for (const sx of [1, -1]) for (const sz of [1, -1]) {
    const A = new THREE.Vector3(sx * L_RIDGE, H_RIDGE + 0.2, 0);
    const P = new THREE.Vector3(sx * L_RIDGE, H_MID + 0.08, sz * (Z_MID + 0.05));
    const C = new THREE.Vector3(sx * (W2 + 0.1), H_EAVE + UPLIFT + 0.06, sz * (D2 + 0.1));
    root.add(beamBetween(A, P, 0.26, 0.2, M.ridge));
    root.add(beamBetween(P, C, 0.24, 0.18, M.ridge));
    // 垂兽
    const beast = new THREE.Group();
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.34, 0.3), M.ridge); b1.position.y = 0.17;
    const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 0.16), M.ridge); b2.position.set(0, 0.36, 0.12); b2.rotation.x = -0.5;
    beast.add(b1, b2);
    beast.position.copy(P).add(new THREE.Vector3(0, 0.05, 0));
    root.add(beast);
    // 戗脊小兽 ×2 + 套兽
    for (const t of [0.45, 0.75]) {
      const p = P.clone().lerp(C, t).add(new THREE.Vector3(0, 0.16, 0));
      const sm = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.18, 0.15), M.ridge);
      sm.position.copy(p); sm.castShadow = true; root.add(sm);
    }
    const tao = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.22, 0.2), M.ridge);
    tao.position.copy(C).add(new THREE.Vector3(0, 0.12, 0)); tao.castShadow = true; root.add(tao);
  }

  // 檐口瓦当条（8 段随起翘）
  const pts = [
    [[-W2 - 0.1, H_EAVE - 0.04, D2 + 0.1], [0, H_EAVE - 0.04, D2 + 0.1], [W2 + 0.1, H_EAVE + UPLIFT - 0.04, D2 + 0.1]],
    [[W2 + 0.1, H_EAVE - 0.04, D2 + 0.1], [W2 + 0.1, H_EAVE - 0.04, 0], [W2 + 0.1, H_EAVE + UPLIFT - 0.04, -D2 - 0.1]],
    [[W2 + 0.1, H_EAVE - 0.04, -D2 - 0.1], [0, H_EAVE - 0.04, -D2 - 0.1], [-W2 - 0.1, H_EAVE + UPLIFT - 0.04, -D2 - 0.1]],
    [[-W2 - 0.1, H_EAVE - 0.04, -D2 - 0.1], [-W2 - 0.1, H_EAVE - 0.04, 0], [-W2 - 0.1, H_EAVE + UPLIFT - 0.04, D2 + 0.1]],
  ];
  for (const seg of pts) {
    const a = new THREE.Vector3(...seg[0]), b = new THREE.Vector3(...seg[1]), c = new THREE.Vector3(...seg[2]);
    root.add(beamBetween(a, b, 0.14, 0.1, M.ridge));
    root.add(beamBetween(b, c, 0.14, 0.1, M.ridge));
  }
}

/* ================= 山花 / 悬鱼 / 搏风 ================= */
{
  for (const sx of [1, -1]) {
    const shape = new THREE.Shape();
    shape.moveTo(0, H_RIDGE + 0.1);
    shape.lineTo(-Z_MID, H_MID);
    shape.lineTo(Z_MID, H_MID);
    shape.closePath();
    const geo = new THREE.ShapeGeometry(shape);
    const sh = new THREE.Mesh(geo, M.shanhua);
    sh.rotation.y = sx * Math.PI / 2;
    sh.position.x = sx * (L_RIDGE - 0.02);
    sh.castShadow = true; root.add(sh);
    // 悬鱼
    const xf = new THREE.Mesh(new THREE.OctahedronGeometry(0.3), M.woodDeep);
    xf.scale.set(0.55, 1.35, 0.22);
    xf.position.set(sx * (L_RIDGE + 0.04), (H_RIDGE + H_MID) / 2 - 0.12, 0);
    root.add(xf);
    // 搏风板（两腰）
    const len = Math.hypot(Z_MID, H_RIDGE - H_MID) + 0.1;
    for (const sz of [1, -1]) {
      const bf = beamBetween(
        new THREE.Vector3(sx * L_RIDGE, H_RIDGE + 0.12, 0),
        new THREE.Vector3(sx * L_RIDGE, H_MID, sz * Z_MID),
        0.12, 0.05, M.woodDark);
      bf.position.x += sx * 0.05;
      root.add(bf);
    }
  }
}

/* ================= 门窗 ================= */
{
  const doorMat = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.8 });
  const winMat = new THREE.MeshStandardMaterial({ map: winTex, roughness: 0.8 });
  const sillMat = M.woodDark;

  function doorBay(cx, z, ry) { // 一间四扇隔扇
    const g = new THREE.Group();
    const W = 4.0, H = 2.5, y0 = BASE_H + 0.52;
    for (let i = 0; i < 4; i++) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(0.96, H), doorMat);
      p.position.set(-W / 2 + 0.5 + i * 1.0, y0 + H / 2, 0);
      g.add(p);
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.09, H, 0.1), M.woodDeep);
      bar.position.set(-W / 2 + i * 1.0, y0 + H / 2, 0);
      g.add(bar);
    }
    for (const y of [y0 + 0.045, y0 + H - 0.045]) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(W + 0.1, 0.09, 0.1), M.woodDeep);
      bar.position.set(0, y, 0); g.add(bar);
    }
    // 槛墙
    const sill = new THREE.Mesh(new THREE.BoxGeometry(W + 0.15, 0.52, 0.18), sillMat);
    sill.position.set(0, BASE_H + 0.26, 0); g.add(sill);
    g.position.set(cx, 0, z); g.rotation.y = ry;
    root.add(g);
  }
  function windowPanel(cx, z, ry, w = 3.0, h = 1.9) { // 直棂窗 + 槛墙
    const g = new THREE.Group();
    const y0 = BASE_H + 0.52;
    const win = new THREE.Mesh(new THREE.PlaneGeometry(w, h), winMat);
    win.position.set(0, y0 + h / 2, 0); g.add(win);
    const frameT = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.09, 0.1), M.woodDeep);
    frameT.position.set(0, y0 + h + 0.045, 0); g.add(frameT);
    const frameB = frameT.clone(); frameB.position.y = y0 - 0.045; g.add(frameB);
    const sill = new THREE.Mesh(new THREE.BoxGeometry(w + 0.15, 0.52, 0.18), sillMat);
    sill.position.set(0, BASE_H + 0.26, 0); g.add(sill);
    g.position.set(cx, 0, z); g.rotation.y = ry;
    root.add(g);
  }
  for (const cx of [-4.2, 0, 4.2]) doorBay(cx, COL_Z, 0);            // 前檐隔扇
  for (const cx of [-4.2, 0, 4.2]) windowPanel(cx, -COL_Z, Math.PI); // 背檐直棂窗
  for (const sx of [-1, 1]) windowPanel(sx * 6.3, 0, sx * Math.PI / 2); // 山面直棂窗
}

/* ================= 灯笼 ================= */
{
  const lampMat = new THREE.MeshStandardMaterial({ map: lampTex, roughness: 0.6, emissive: 0x842a1a, emissiveIntensity: 0.35 });
  for (const sx of [-1, 1]) {
    const g = new THREE.Group();
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.62, 6), M.woodDeep);
    rope.position.y = 0.31; g.add(rope);
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 16), lampMat);
    body.scale.y = 0.86; g.add(body);
    for (const sy of [-1, 1]) {
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.07, 14), M.gold);
      cap.position.y = sy * 0.215; g.add(cap);
    }
    const tassel = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.36, 10), M.gold);
    tassel.position.y = -0.42; tassel.rotation.x = Math.PI; g.add(tassel);
    g.position.set(sx * 4.2, BASE_H + COL_H + 0.2 - 0.68, COL_Z + 0.55);
    root.add(g);
  }
}

/* ================= 视角预设 / UI ================= */
const views = {
  orbit:  { pos: [11.5, 6.6, 13.5], tgt: [0, 3.6, 0] },
  front:  { pos: [0, 4.6, 23.5],   tgt: [0, 4.3, 0] },
  side:   { pos: [23.5, 4.6, 0],   tgt: [0, 4.3, 0] },
  top:    { pos: [0.5, 27, 0.5],   tgt: [0, 0, 0] },
};
let tween = null, autoRot = true;
function flyTo(name) {
  const v = views[name];
  tween = {
    p0: camera.position.clone(), p1: new THREE.Vector3(...v.pos),
    t0: controls.target.clone(), t1: new THREE.Vector3(...v.tgt),
    k: 0,
  };
  if (name !== 'orbit') setAuto(false);
}
function setAuto(on) {
  autoRot = on; controls.autoRotate = on;
  document.getElementById('btnRotate').classList.toggle('active', on);
}
const btns = { btnRotate: () => setAuto(!autoRot), btnOrbit: () => flyTo('orbit'), btnFront: () => flyTo('front'), btnSide: () => flyTo('side'), btnTop: () => flyTo('top') };
for (const [id, fn] of Object.entries(btns)) document.getElementById(id).addEventListener('click', fn);

/* ================= 循环 ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 1.1);
    const e = tween.k < 0.5 ? 4 * tween.k ** 3 : 1 - Math.pow(-2 * tween.k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
