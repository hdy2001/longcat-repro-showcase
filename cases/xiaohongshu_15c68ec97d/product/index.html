<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营造 · 歇山殿 — 构件观测台</title>
<style>
:root{
  --gold:#d6b25e; --gold-dim:rgba(214,178,94,.30);
  --bg:#0b0e13; --panel:rgba(14,18,26,.90); --line:rgba(255,255,255,.08);
  --txt:#e9e5da; --sub:#98a1b0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--txt)}
canvas{display:block}

/* ---------- 标题 ---------- */
#brand{position:fixed;top:22px;left:26px;z-index:10;pointer-events:none}
#brand h1{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:27px;
  letter-spacing:7px;font-weight:600;color:var(--txt)}
#brand h1 b{color:var(--gold);font-weight:600}
#brand p{margin-top:7px;font-size:11px;letter-spacing:3.5px;color:var(--sub)}
#brand .bar{width:52px;height:2px;background:var(--gold);margin-top:11px;opacity:.85}

/* ---------- 右侧构件观测台 ---------- */
#panel{position:fixed;top:50%;right:22px;transform:translateY(-50%);width:254px;z-index:10;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 12px 40px rgba(0,0,0,.5);padding:16px 16px 12px;max-height:86vh;overflow-y:auto}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:rgba(214,178,94,.35);border-radius:2px}
#panel header{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:12px}
#panel header h2{font-family:"Songti SC","STSong","Noto Serif SC",serif;
  font-size:17px;letter-spacing:4px;color:var(--gold);font-weight:600}
#panel header span{font-size:8.5px;letter-spacing:1.5px;color:var(--sub)}
.sec{margin-bottom:14px}
.sec h3{font-size:11px;letter-spacing:2.5px;color:var(--sub);margin-bottom:8px;font-weight:500}
.sec h3::before{content:"";display:inline-block;width:6px;height:6px;background:var(--gold);
  border-radius:1px;margin-right:7px;vertical-align:1px;opacity:.8}

.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vbtn{padding:8px 0;font-size:12.5px;letter-spacing:2px;color:var(--txt);cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:8px;
  transition:all .18s}
.vbtn:hover{border-color:var(--gold-dim);background:rgba(214,178,94,.10)}
.vbtn.active{background:rgba(214,178,94,.16);border-color:var(--gold);color:var(--gold)}

.layer{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:all .15s;user-select:none}
.layer:hover{background:rgba(255,255,255,.045)}
.layer i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;
  box-shadow:0 0 7px var(--c);transition:all .2s}
.layer b{font-size:13px;letter-spacing:1.5px;font-weight:500}
.layer em{margin-left:auto;font-style:normal;font-size:10px;color:var(--sub);letter-spacing:.5px}
.layer.off{opacity:.38}
.layer.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}

#explodeBtn{width:100%;padding:9px 0;font-size:13px;letter-spacing:3px;cursor:pointer;
  color:#10131a;background:linear-gradient(135deg,#e3c37c,#c49a4a);border:none;border-radius:8px;
  font-weight:600;transition:all .18s;font-family:inherit}
#explodeBtn:hover{filter:brightness(1.1)}
#explodeBtn.on{background:linear-gradient(135deg,#5a6c86,#3d4c64);color:var(--txt)}
.note{font-size:10.5px;color:var(--sub);line-height:1.7;margin-top:7px;letter-spacing:.5px}

.legend{list-style:none}
.legend li{display:flex;align-items:center;gap:9px;padding:5.5px 4px;border-radius:6px;cursor:default}
.legend li:hover{background:rgba(255,255,255,.04)}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;
  box-shadow:0 0 6px var(--c)}
.legend b{font-size:12.5px;font-weight:500;letter-spacing:1px;min-width:64px}
.legend span{font-size:10px;color:var(--sub);letter-spacing:.5px}

/* ---------- 底部 01-04 视角坞 ---------- */
#dock{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 8px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
#dock button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 16px;
  background:transparent;border:1px solid transparent;border-radius:9px;cursor:pointer;
  color:var(--sub);transition:all .18s;font-family:inherit}
#dock button b{font-size:13px;letter-spacing:1px;font-weight:600;color:var(--txt)}
#dock button span{font-size:10.5px;letter-spacing:3px}
#dock button:hover{background:rgba(255,255,255,.05)}
#dock button.active{background:rgba(214,178,94,.15);border-color:var(--gold-dim)}
#dock button.active b{color:var(--gold)}

/* ---------- 状态栏 ---------- */
#statusbar{position:fixed;left:0;right:0;bottom:0;height:28px;z-index:10;display:flex;
  align-items:center;justify-content:space-between;padding:0 18px;
  background:rgba(10,13,19,.92);border-top:1px solid var(--line);
  font-size:11px;letter-spacing:1px;color:var(--sub)}
#statusLeft b{color:var(--gold);font-weight:600}

/* ---------- 构件信息卡 ---------- */
#infocard{position:fixed;z-index:20;width:264px;display:none;pointer-events:auto;
  background:rgba(13,17,24,.96);border:1px solid var(--gold-dim);border-left:3px solid var(--gold);
  border-radius:10px;padding:13px 15px 12px;box-shadow:0 14px 44px rgba(0,0,0,.6);
  transform:translate(-50%,-100%)}
#infocard h3{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:16.5px;
  letter-spacing:3px;color:var(--gold);font-weight:600}
#infocard .sub{font-size:10.5px;color:var(--sub);letter-spacing:2px;margin:3px 0 8px}
#infocard p{font-size:12px;line-height:1.85;color:var(--txt);text-align:justify}
#cardClose{position:absolute;top:7px;right:10px;background:none;border:none;color:var(--sub);
  font-size:16px;cursor:pointer;line-height:1}
#cardClose:hover{color:var(--gold)}
</style>
</head>
<body>

<div id="brand">
  <h1>营造 · <b>歇山殿</b></h1>
  <p>大木作三维解构 · 构件观测台</p>
  <div class="bar"></div>
</div>

<aside id="panel">
  <header><h2>构件观测台</h2><span>COMPONENT OBSERVER</span></header>

  <div class="sec">
    <h3>视角预设</h3>
    <div class="vgrid">
      <button class="vbtn active" data-view="persp">透 视</button>
      <button class="vbtn" data-view="front">正 视</button>
      <button class="vbtn" data-view="side">侧 视</button>
      <button class="vbtn" data-view="top">俯 视</button>
    </div>
  </div>

  <div class="sec">
    <h3>图层控制</h3>
    <div class="layer" data-layer="base" style="--c:#a8a49a"><i></i><b>台 基</b><em>台明 · 踏跺</em></div>
    <div class="layer" data-layer="body" style="--c:#e0684e"><i></i><b>柱 网</b><em>柱 · 枋 · 斗拱</em></div>
    <div class="layer" data-layer="roof" style="--c:#8fa3c7"><i></i><b>屋 面</b><em>瓦 · 脊 · 山花</em></div>
    <div class="layer" data-layer="mark" style="--c:#ffc85e"><i></i><b>标 注</b><em>构件点位</em></div>
  </div>

  <div class="sec">
    <h3>解构演示</h3>
    <button id="explodeBtn">屋面解构</button>
    <p class="note">屋面整体抬升 · 斗拱层半升<br>观察屋顶与屋身的构造层次</p>
  </div>

  <div class="sec">
    <h3>构件标注点</h3>
    <ol class="legend">
      <li style="--c:#ffc85e"><i></i><b>01 斗拱</b><span>柱头科 · 铺作层</span></li>
      <li style="--c:#e0684e"><i></i><b>02 檐柱</b><span>檐下承重柱</span></li>
      <li style="--c:#d6b25e"><i></i><b>03 槅扇</b><span>檐间格扇门</span></li>
      <li style="--c:#a8a49a"><i></i><b>04 台基</b><span>须弥座式基座</span></li>
      <li style="--c:#8fa3c7"><i></i><b>05 踏跺</b><span>垂带踏跺</span></li>
      <li style="--c:#7fc98f"><i></i><b>06 歇山面</b><span>山花 · 博缝</span></li>
    </ol>
  </div>
</aside>

<div id="dock">
  <button data-view="persp" class="active"><b>01</b><span>透视</span></button>
  <button data-view="front"><b>02</b><span>正视</span></button>
  <button data-view="side"><b>03</b><span>侧视</span></button>
  <button data-view="top"><b>04</b><span>俯视</span></button>
</div>

<div id="statusbar">
  <span id="statusLeft"></span>
  <span id="statusRight">左键旋转 · 滚轮缩放 · 右键平移 · 点击金色标注点查看构件</span>
</div>

<div id="infocard">
  <button id="cardClose">×</button>
  <h3 id="cardTitle"></h3>
  <div class="sub" id="cardSub"></div>
  <p id="cardBody"></p>
</div>

window.__errs = [];
window.addEventListener('error', e => window.__errs.push(String(e.message)));

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';

/* ================= 渲染器 / 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);
scene.fog = new THREE.Fog(0x0b0e13, 48, 115);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(22, 13, -27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 9;
controls.maxDistance = 85;
controls.maxPolarAngle = Math.PI * 0.56;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; }, { once: true });

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0x8fa3c7, 0x1c1712, 0.75));
const key = new THREE.DirectionalLight(0xffe2b0, 2.6);
key.position.set(18, 26, 14);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -20; key.shadow.camera.right = 20;
key.shadow.camera.top = 20;  key.shadow.camera.bottom = -20;
key.shadow.camera.near = 2;  key.shadow.camera.far = 75;
key.shadow.bias = -0.0006;
scene.add(key);
const fill = new THREE.DirectionalLight(0x7a8db5, 0.7);
fill.position.set(-20, 12, -16);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9a0, 0.5);
rim.position.set(-8, 18, 22);
scene.add(rim);

/* ================= 形制参数 ================= */
const PLAT = { W: 14, D: 8.5, top: 1.6 };          // 台基 半宽/半深/台面高
const BODY = { archY: 6.01, pingY: 6.32, brBase: 6.42 }; // 额枋/平板枋/斗拱底标高
const ROOF = { W: 15.5, D: 8, L: 7.5, zB: 4.6, R: 11.1, E: 7.3 }; // 檐半宽/半深/脊半长/山花线z/脊高/檐高
const COLS_X = [-12.5, -7.5, -2.5, 2.5, 7.5, 12.5];
const tzB = ROOF.zB / ROOF.D;
const g = t => 1 - Math.pow(1 - THREE.MathUtils.clamp(t, 0, 1), 1.5); // 屋面举折曲线
const hB = ROOF.R - (ROOF.R - ROOF.E) * g(tzB);   // 山花线标高

/* ================= 材质 ================= */
const M = {
  stone: new THREE.MeshStandardMaterial({ color: 0x8f8b83, roughness: 0.95 }),
  red:   new THREE.MeshStandardMaterial({ color: 0x7d3b2a, roughness: 0.62 }),
  redD:  new THREE.MeshStandardMaterial({ color: 0x57281d, roughness: 0.7 }),
  wood:  new THREE.MeshStandardMaterial({ color: 0x6e3226, roughness: 0.7 }),
  wall:  new THREE.MeshStandardMaterial({ color: 0xe7ddc6, roughness: 0.92 }),
  tile:  new THREE.MeshStandardMaterial({ color: 0x454c55, roughness: 0.8, metalness: 0.08, side: THREE.DoubleSide }),
  ridge: new THREE.MeshStandardMaterial({ color: 0x2f343b, roughness: 0.85 }),
  gold:  new THREE.MeshStandardMaterial({ color: 0xc9a35c, roughness: 0.4, metalness: 0.55 }),
};

/* ================= 工具 ================= */
const clamp = THREE.MathUtils.clamp;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
function xform(geo, x, y, z, rx = 0, ry = 0, rz = 0) {
  geo.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz)));
  geo.translate(x, y, z);
  return geo;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const merge = list => mergeGeometries(list, false);
function shadowify(root) { root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); }
function cylBetween(a, b, r) {
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const geo = new THREE.CylinderGeometry(r, r, len, 6);
  geo.translate(0, len / 2, 0);
  geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));
  geo.translate(a.x, a.y, a.z);
  return geo;
}

/* ================= 分组（图层） ================= */
const baseGroup = new THREE.Group();    // 台基
const bodyGroup = new THREE.Group();    // 柱网（柱/枋/墙/槅扇）
const bracketGroup = new THREE.Group();// 斗拱（解构时半升）
const roofGroup = new THREE.Group();    // 屋面
const markerGroup = new THREE.Group();  // 标注点
bodyGroup.add(bracketGroup);
scene.add(baseGroup, bodyGroup, roofGroup, markerGroup);

/* ================= 台基 + 踏跺 ================= */
{
  const parts = [
    xform(box(28, 0.55, 17), 0, 0.275, 0),      // 底层
    xform(box(27, 0.5, 16), 0, 0.8, 0),         // 束腰
    xform(box(28, 0.5, 17), 0, 1.3, 0),         // 上枋
    xform(box(27.6, 0.16, 16.6), 0, 1.55, 0),   // 台面
  ];
  baseGroup.add(new THREE.Mesh(merge(parts), M.stone));

  // 正面垂带踏跺（六阶）
  const NS = 6, sh = PLAT.top / NS, parts2 = [];
  for (let i = 0; i < NS; i++) {
    const top = PLAT.top - i * sh;
    parts2.push(xform(box(5.4, sh, 0.56), 0, top - sh / 2, -(PLAT.D + 0.28 + i * 0.56)));
  }
  const slopeA = Math.atan2(PLAT.top, (NS - 0.5) * 0.56);
  for (const x of [-3.0, 3.0]) {
    parts2.push(xform(box(0.5, 0.32, 3.3), x, PLAT.top / 2 - 0.04, -(PLAT.D + (NS - 0.5) * 0.28), -slopeA, 0, 0));
  }
  baseGroup.add(new THREE.Mesh(merge(parts2), M.stone));
}

/* ================= 柱网 ================= */
const colPos = [];
COLS_X.forEach(x => colPos.push([x, -4.5], [x, 4.5]));
colPos.push([-12.5, 0], [12.5, 0]);

{ // 檐柱（带柱础、侧脚收分）
  const bases = [], cols = [];
  for (const [x, z] of colPos) {
    bases.push(xform(new THREE.CylinderGeometry(0.38, 0.42, 0.3, 12), x, PLAT.top + 0.15, z));
    cols.push(xform(new THREE.CylinderGeometry(0.26, 0.30, 4.2, 14), x, 3.7, z));
  }
  bodyGroup.add(new THREE.Mesh(merge(bases), M.stone));
  bodyGroup.add(new THREE.Mesh(merge(cols), M.red));
}
{ // 额枋 + 平板枋 + 彩画带
  const arch = [
    xform(box(25.8, 0.42, 0.55), 0, BODY.archY, -4.5),
    xform(box(25.8, 0.42, 0.55), 0, BODY.archY, 4.5),
    xform(box(0.55, 0.42, 9.4), -12.5, BODY.archY, 0),
    xform(box(0.55, 0.42, 9.4), 12.5, BODY.archY, 0),
  ];
  bodyGroup.add(new THREE.Mesh(merge(arch), M.red));
  const ping = [
    xform(box(26.2, 0.2, 0.8), 0, BODY.pingY, -4.5),
    xform(box(26.2, 0.2, 0.8), 0, BODY.pingY, 4.5),
    xform(box(0.8, 0.2, 9.8), -12.5, BODY.pingY, 0),
    xform(box(0.8, 0.2, 9.8), 12.5, BODY.pingY, 0),
  ];
  bodyGroup.add(new THREE.Mesh(merge(ping), M.wood));
  const paint = [
    xform(box(25.8, 0.16, 0.05), 0, BODY.archY + 0.12, -4.79),
    xform(box(25.8, 0.16, 0.05), 0, BODY.archY + 0.12, 4.79),
  ];
  bodyGroup.add(new THREE.Mesh(merge(paint), new THREE.MeshStandardMaterial({ color: 0x4a7a6a, roughness: 0.7 })));
}
{ // 后檐墙 + 山墙
  const walls = [
    xform(box(24.4, 4.2, 0.3), 0, 3.7, 4.5),
    xform(box(0.3, 4.2, 9.0), -12.5, 3.7, 0),
    xform(box(0.3, 4.2, 9.0), 12.5, 3.7, 0),
  ];
  bodyGroup.add(new THREE.Mesh(merge(walls), M.wall));
}

/* ================= 槅扇（前檐五间） ================= */
function buildDoorGeo() {
  const p = [];
  p.push(xform(box(0.2, 4.2, 0.14), -2.06, 2.1, 0));   // 边框
  p.push(xform(box(0.2, 4.2, 0.14), 2.06, 2.1, 0));
  p.push(xform(box(4.32, 0.2, 0.14), 0, 4.1, 0));
  p.push(xform(box(4.32, 0.2, 0.14), 0, 0.1, 0));
  for (const bx of [-1.5, -0.5, 0.5, 1.5]) p.push(xform(box(0.07, 1.85, 0.07), bx, 3.0, 0)); // 棂格
  for (const by of [2.25, 2.7, 3.15, 3.6]) p.push(xform(box(3.9, 0.07, 0.07), 0, by, 0));
  p.push(xform(box(3.9, 0.42, 0.08), 0, 1.78, 0));      // 腰华板
  p.push(xform(box(3.9, 1.35, 0.1), 0, 0.88, 0));      // 裙板
  p.push(xform(box(3.4, 0.85, 0.12), 0, 0.85, 0));
  p.push(xform(box(3.9, 0.12, 0.12), 0, 1.5, 0));      // 抹头
  p.push(xform(box(3.9, 0.12, 0.12), 0, 2.05, 0));
  return merge(p);
}
const doorGeo = buildDoorGeo();
for (const dx of [0, 5, -5, 10, -10]) {
  const d = new THREE.Mesh(doorGeo, M.redD);
  d.position.set(dx, PLAT.top, -4.5);
  bodyGroup.add(d);
}

/* ================= 斗拱（26 攒） ================= */
function buildBracketGeo() {
  const p = [];
  p.push(xform(box(0.62, 0.28, 0.62), 0, 0.14, 0));            // 坐斗
  p.push(xform(box(0.26, 0.20, 1.40), 0, 0.38, -0.20));        // 华拱
  p.push(xform(box(1.40, 0.18, 0.24), 0, 0.55, -0.15));        // 横拱
  p.push(xform(box(0.22, 0.14, 0.24), 0.55, 0.69, -0.15));     // 升
  p.push(xform(box(0.22, 0.14, 0.24), -0.55, 0.69, -0.15));
  p.push(xform(box(0.22, 0.18, 1.60), 0, 0.66, -0.50, 0.48, 0, 0)); // 下昂
  p.push(xform(box(1.90, 0.16, 0.22), 0, 0.88, -0.75));        // 挑檐枋
  return merge(p);
}
{
  const brGeo = buildBracketGeo();
  const pos = [];
  COLS_X.forEach(x => pos.push([x, -4.5, 0], [x, 4.5, Math.PI]));
  pos.push([-12.5, 0, Math.PI / 2], [12.5, 0, -Math.PI / 2]);
  [-10, -5, 0, 5, 10].forEach(x => pos.push([x, -4.5, 0], [x, 4.5, Math.PI]));
  pos.push([-12.5, 2.25, Math.PI / 2], [-12.5, -2.25, Math.PI / 2],
           [12.5, 2.25, -Math.PI / 2], [12.5, -2.25, -Math.PI / 2]);
  for (const [x, z, ry] of pos) {
    const b = new THREE.Mesh(brGeo, M.red);
    b.position.set(x, BODY.brBase, z);
    b.rotation.y = ry;
    bracketGroup.add(b);
  }
}

/* ================= 屋面（歇山顶） ================= */
function slopeH(x, tz) { // 前后坡（举折曲线 + 角部起翘）
  let h = ROOF.R - (ROOF.R - ROOF.E) * g(tz);
  const sx = clamp((Math.abs(x) - ROOF.L) / (ROOF.W - ROOF.L), 0, 1);
  h += 0.55 * sstep(0.68, 1, sx) * sstep(0.74, 1, tz)
     + 0.40 * sstep(0.68, 1, sx) * sstep(0.80, 1, tz);
  return h;
}
function endH(x, z) { // 山面坡（戗脊曲线 + 横向鼓凸 + 转角起翘）
  const r = clamp((Math.abs(x) - ROOF.L) / (ROOF.W - ROOF.L), 0, 1);
  const zr = ROOF.zB + (ROOF.D - ROOF.zB) * r;
  const az = clamp(Math.abs(z) / zr, 0, 1);
  const gr = g(r);
  const hD = hB - (hB - ROOF.E) * gr
           + 0.55 * Math.pow(sstep(0.68, 1, r), 1.4) * Math.pow(sstep(0.50, 1, az), 1.1);
  const bulge = 0.55 * (hB - ROOF.E) * gr * (1 - gr);
  return hD + bulge * Math.pow(Math.cos(Math.PI / 2 * az), 1.6)
       + 0.40 * sstep(0.70, 1, r) * sstep(0.80, 1, az);
}
function gridGeo(nu, nv, fn) {
  const pos = [], idx = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) pos.push(...fn(i / nu, j / nv));
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
function tubeMesh(points, r, seg = 16) {
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), seg, r, 6, false), M.ridge);
}
{
  // 前后坡 · 上段（脊 → 山花线）
  roofGroup.add(new THREE.Mesh(gridGeo(24, 10, (u, v) => {
    const x = -ROOF.L + u * 2 * ROOF.L, tz = v * tzB;
    return [x, slopeH(x, tz), tz * ROOF.D];
  }), M.tile));
  roofGroup.add(new THREE.Mesh(gridGeo(24, 10, (u, v) => {
    const x = -ROOF.L + u * 2 * ROOF.L, tz = v * tzB;
    return [x, slopeH(x, tz), -tz * ROOF.D];
  }), M.tile));
  // 前后坡 · 下段（山花线 → 檐口，通长）
  for (const sz of [1, -1]) {
    roofGroup.add(new THREE.Mesh(gridGeo(28, 10, (u, v) => {
      const x = -ROOF.W + u * 2 * ROOF.W, tz = tzB + v * (1 - tzB);
      return [x, slopeH(x, tz), sz * tz * ROOF.D];
    }), M.tile));
  }
  // 山面坡（两端，前后两半）
  for (const sx of [1, -1]) for (const sz of [1, -1]) {
    roofGroup.add(new THREE.Mesh(gridGeo(12, 10, (u, v) => {
      const r = u, zr = ROOF.zB + (ROOF.D - ROOF.zB) * r;
      const x = sx * (ROOF.L + r * (ROOF.W - ROOF.L));
      return [x, endH(x, sz * v * zr), sz * v * zr];
    }), M.tile));
  }
  // 山花（三角形悬鱼板）
  const gableMat = new THREE.MeshStandardMaterial({ color: 0x8a4636, roughness: 0.75, side: THREE.DoubleSide });
  for (const s of [1, -1]) {
    const x = s * (ROOF.L - 0.06);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([
      x, ROOF.R, 0, x, hB, -ROOF.zB, x, hB, ROOF.zB,
    ], 3));
    geo.setIndex([0, 1, 2]);
    geo.computeVertexNormals();
    roofGroup.add(new THREE.Mesh(geo, gableMat));
    const fish = new THREE.Mesh(new THREE.OctahedronGeometry(0.3), M.gold);
    fish.scale.set(0.25, 1.1, 0.7);
    fish.position.set(s * (ROOF.L - 0.02), hB + 1.2, 0);
    roofGroup.add(fish);
  }
}
{ // 垂脊 ×4
  for (const sx of [1, -1]) for (const sz of [1, -1]) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const tz = (i / 8) * tzB;
      pts.push(v3(sx * ROOF.L, slopeH(ROOF.L, tz) + 0.14, sz * tz * ROOF.D));
    }
    roofGroup.add(tubeMesh(pts, 0.17, 10));
  }
}
{ // 戗脊 ×4
  for (const sx of [1, -1]) for (const sz of [1, -1]) {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const r = i / 10;
      const x = sx * (ROOF.L + r * (ROOF.W - ROOF.L));
      const z = sz * (ROOF.zB + r * (ROOF.D - ROOF.zB));
      const gr = g(r);
      const hD = hB - (hB - ROOF.E) * gr + 0.55 * Math.pow(sstep(0.68, 1, r), 1.4);
      pts.push(v3(x, hD + 0.14, z));
    }
    roofGroup.add(tubeMesh(pts, 0.17, 12));
  }
}
{ // 正脊 + 鸱吻
  roofGroup.add(new THREE.Mesh(xform(box(2 * ROOF.L + 0.7, 0.6, 0.55), 0, ROOF.R + 0.24, 0), M.ridge));
  for (const s of [1, -1]) {
    const chi = [
      xform(box(0.7, 0.3, 0.7), s * (ROOF.L + 0.42), ROOF.R + 0.2, 0),
      xform(box(0.62, 1.15, 0.62), s * (ROOF.L + 0.42), ROOF.R + 0.75, 0),
      xform(box(0.24, 0.6, 0.64), s * (ROOF.L + 0.42), ROOF.R + 1.5, 0, 0, 0, -s * 0.18),
    ];
    roofGroup.add(new THREE.Mesh(merge(chi), M.ridge));
  }
}
{ // 檐口连檐（沿檐口线，含转角起翘）
  const pts = [];
  for (let i = 0; i <= 28; i++) { const x = -ROOF.W + (i / 28) * 2 * ROOF.W; pts.push(v3(x, slopeH(x, 1) + 0.02, -ROOF.D)); }
  for (let i = 1; i <= 20; i++) { const z = -ROOF.D + (i / 20) * 2 * ROOF.D; pts.push(v3(ROOF.W, endH(ROOF.W, z) + 0.02, z)); }
  for (let i = 1; i <= 28; i++) { const x = ROOF.W - (i / 28) * 2 * ROOF.W; pts.push(v3(x, slopeH(x, 1) + 0.02, ROOF.D)); }
  for (let i = 1; i < 20; i++)  { const z = ROOF.D - (i / 20) * 2 * ROOF.D; pts.push(v3(-ROOF.W, endH(-ROOF.W, z) + 0.02, z)); }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  roofGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 130, 0.15, 6, true), M.ridge));
}
{ // 瓦垄 —— 立体几何（沿坡面与山面坡的筒瓦行列）
  const tileRibMat = new THREE.MeshStandardMaterial({ color: 0x3b4149, roughness: 0.82, metalness: 0.06 });
  const geos = [];
  for (let x = -ROOF.W + 0.45; x <= ROOF.W - 0.44; x += 0.8) {
    for (const sz of [1, -1]) {
      const r = clamp((Math.abs(x) - ROOF.L) / (ROOF.W - ROOF.L), 0, 1);
      const zr = ROOF.zB + (ROOF.D - ROOF.zB) * r;
      const pts = [];
      for (let i = 0; i <= 14; i++) {
        const z = sz * (0.25 + (i / 14) * (ROOF.D - 0.35));
        const az = Math.abs(z);
        const y = Math.abs(x) <= ROOF.L ? slopeH(x, az / ROOF.D)
                 : (az <= zr ? endH(x, z) : slopeH(x, az / ROOF.D));
        pts.push(v3(x, y + 0.12, z));
      }
      geos.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 18, 0.105, 5, false));
    }
  }
  roofGroup.add(new THREE.Mesh(merge(geos), tileRibMat));
}
{ // 檐椽（放射状圆椽，沿檐口一周）
  const geos = [];
  for (let x = -ROOF.W + 0.6; x <= ROOF.W - 0.59; x += 0.75) {
    for (const sz of [1, -1]) {
      geos.push(cylBetween(v3(x, ROOF.E - 0.55, sz * (ROOF.D - 1.6)),
                           v3(x, ROOF.E - 1.05, sz * (ROOF.D - 0.35)), 0.09));
    }
  }
  for (let z = -ROOF.D + 0.6; z <= ROOF.D - 0.59; z += 0.75) {
    for (const sx of [1, -1]) {
      geos.push(cylBetween(v3(sx * (ROOF.W - 1.6), ROOF.E - 0.55, z),
                           v3(sx * (ROOF.W - 0.35), ROOF.E - 1.05, z), 0.09));
    }
  }
  roofGroup.add(new THREE.Mesh(merge(geos), M.wood));
}

/* ================= 地面 ================= */
{
  const ground = new THREE.Mesh(new THREE.CircleGeometry(48, 64),
    new THREE.MeshStandardMaterial({ color: 0x0e1218, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  const grid = new THREE.GridHelper(96, 48, 0x223044, 0x151d29);
  grid.position.y = 0.02;
  grid.material.transparent = true;
  grid.material.opacity = 0.4;
  scene.add(grid);
  const ring = new THREE.Mesh(new THREE.RingGeometry(16.6, 16.75, 96),
    new THREE.MeshBasicMaterial({ color: 0xd6b25e, transparent: true, opacity: 0.26, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  scene.add(ring);
}

shadowify(baseGroup); shadowify(bodyGroup); shadowify(roofGroup);

/* ================= 构件标注点 ================= */
const INFO = {
  dougong: { t: '斗 拱', s: '柱头科 · 铺作层', b: '斗拱位于柱头与檐枋之间，以坐斗、华拱、横拱、下昂层层出跳，将深远屋檐的荷载逐级传回柱头。除结构悬挑外，斗拱的用跳数量亦是建筑等级的重要标志。' },
  yanzhu:  { t: '檐 柱', s: '檐柱 · 竖向承重', b: '檐柱是檐下外围的承重木柱，上承斗拱与屋面荷载，下立于柱础之上。柱头微有侧脚与生起，使檐口与柱列呈现柔和曲线，兼具稳定与装饰之意。' },
  geshan:  { t: '槅 扇', s: '槅扇门窗 · 檐间装修', b: '槅扇是安装于檐柱之间的格扇门窗：上为棂格、中为腰华板、下为裙板，可灵活装卸，兼具采光、通风与围护功能，是木构装修的代表。' },
  taiji:   { t: '台 基', s: '台基 · 须弥座式', b: '台基为建筑下部的砖石基座，承托全部木构荷载，隔湿防潮并抬高建筑等级。此座作须弥座式，分层收分，周设压面石与角柱石。' },
  tajie:   { t: '踏 跺', s: '踏跺 · 垂带踏跺', b: '踏跺即台阶，置于台基正面正中供登临。此作垂带踏跺，两侧以垂带石护持，踏跺石层层而下，是台基与地面间的过渡。' },
  xieshan: { t: '歇山面', s: '歇山顶 · 山面', b: '歇山面为歇山顶两端的山面：上部三角形山花以博缝板护边，正中悬鱼装饰；下部坡面与四面屋檐相接，垂脊与戗脊在此交汇，为歇山顶的标志性部位。' },
};
const MARKERS = [
  { id: 'dougong', pos: [0, 7.0, -5.2] },
  { id: 'yanzhu',  pos: [7.5, 3.9, -5.1] },
  { id: 'geshan',  pos: [0, 3.7, -5.05] },
  { id: 'taiji',   pos: [14.3, 1.15, 7.6] },
  { id: 'tajie',   pos: [0, 1.0, -11.7] },
  { id: 'xieshan', pos: [8.35, 9.1, 0] },
];
const markerMeshes = [];
const coreGeo = new THREE.SphereGeometry(0.17, 16, 12);
const haloGeo = new THREE.SphereGeometry(0.32, 16, 12);
for (const m of MARKERS) {
  const grp = new THREE.Group();
  const core = new THREE.Mesh(coreGeo, new THREE.MeshStandardMaterial({
    color: 0xffc85e, emissive: 0xcf9a2e, emissiveIntensity: 1.5, roughness: 0.3,
  }));
  core.userData.marker = m;
  const halo = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({
    color: 0xffc85e, transparent: true, opacity: 0.16, depthWrite: false,
  }));
  grp.add(halo, core);
  grp.position.set(...m.pos);
  (m.id === 'xieshan' ? roofGroup : markerGroup).add(grp);
  markerMeshes.push(core);
}

/* ================= 视角预设 / 相机动画 ================= */
const VIEWS = {
  persp: { pos: [22, 13, -27],     tgt: [0, 5.6, 0],  name: '透视' },
  front: { pos: [0, 7, -37],       tgt: [0, 5.6, 0],  name: '正视' },
  side:  { pos: [37, 7, 0.02],     tgt: [0, 5.6, 0],  name: '侧视' },
  top:   { pos: [0.02, 42, 0.02],  tgt: [0, 5, 0],    name: '俯视' },
};
const state = { view: 'persp', layers: { base: true, body: true, roof: true, mark: true } };
let camAnim = null;
const easeIO = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

function setView(key) {
  const v = VIEWS[key];
  if (!v) return;
  camAnim = {
    t: 0, dur: 0.9,
    fromP: camera.position.clone(), toP: v3(...v.pos),
    fromT: controls.target.clone(), toT: v3(...v.tgt),
  };
  controls.enabled = false;
  state.view = key;
  updateActiveButtons();
  updateStatus();
}
function updateActiveButtons() {
  document.querySelectorAll('[data-view]').forEach(b =>
    b.classList.toggle('active', b.dataset.view === state.view));
}
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));

/* ================= 图层控制 ================= */
const layerMap = { base: baseGroup, body: bodyGroup, roof: roofGroup, mark: markerGroup };
document.querySelectorAll('.layer').forEach(el => {
  el.addEventListener('click', () => {
    const k = el.dataset.layer;
    state.layers[k] = !state.layers[k];
    layerMap[k].visible = state.layers[k];
    el.classList.toggle('off', !state.layers[k]);
    updateStatus();
  });
});

/* ================= 解构爆炸动画 ================= */
let explodeCur = 0, explodeTarget = 0;
const explodeBtn = document.getElementById('explodeBtn');
explodeBtn.addEventListener('click', () => {
  explodeTarget = explodeTarget ? 0 : 1;
  explodeBtn.textContent = explodeTarget ? '复位屋顶' : '屋面解构';
  explodeBtn.classList.toggle('on', !!explodeTarget);
  updateStatus();
});

/* ================= 标注点拾取 + 信息卡 ================= */
const infocard = document.getElementById('infocard');
const cardTitle = document.getElementById('cardTitle');
const cardSub = document.getElementById('cardSub');
const cardBody = document.getElementById('cardBody');
let cardMarker = null;

function showCard(m) {
  cardMarker = m;
  const info = INFO[m.id];
  cardTitle.textContent = info.t;
  cardSub.textContent = info.s;
  cardBody.textContent = info.b;
  infocard.style.display = 'block';
}
function hideCard() {
  cardMarker = null;
  infocard.style.display = 'none';
}
document.getElementById('cardClose').addEventListener('click', hideCard);
window.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(markerMeshes, false);
  if (hits.length) showCard(hits[0].object.userData.marker);
});

/* ================= 状态栏 ================= */
const statusLeft = document.getElementById('statusLeft');
const LAYER_NAME = { base: '台基', body: '柱网', roof: '屋面', mark: '标注' };
function updateStatus() {
  const on = ['base', 'body', 'roof', 'mark'].filter(k => state.layers[k]).map(k => LAYER_NAME[k]);
  const off = ['base', 'body', 'roof', 'mark'].filter(k => !state.layers[k]).map(k => LAYER_NAME[k]);
  statusLeft.innerHTML = `视角 <b>${VIEWS[state.view].name}</b> ｜ 屋顶 <b>${explodeTarget ? '解构分离' : '整体闭合'}</b> ｜ 图层 ${on.join('·')}${off.length ? `（已隐藏 ${off.join('·')}）` : '全开'}`;
}
updateStatus();

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (camAnim) {
    camAnim.t += dt;
    const k = easeIO(Math.min(camAnim.t / camAnim.dur, 1));
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, k);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
    if (camAnim.t >= camAnim.dur) { camAnim = null; controls.enabled = true; }
  }
  controls.update();

  // 解构爆炸：屋面抬升 3.9 · 斗拱层半升 1.95
  explodeCur += (explodeTarget - explodeCur) * Math.min(1, dt * 3.4);
  if (Math.abs(explodeTarget - explodeCur) < 0.001) explodeCur = explodeTarget;
  const e = explodeCur * explodeCur * (3 - 2 * explodeCur);
  roofGroup.position.y = 3.9 * e;
  bracketGroup.position.y = 1.95 * e;

  // 标注点呼吸脉冲
  for (let i = 0; i < markerMeshes.length; i++) {
    const core = markerMeshes[i];
    core.scale.setScalar(1 + 0.18 * Math.sin(t * 3.2 + i * 1.1));
    core.parent.children[0].material.opacity = 0.12 + 0.07 * Math.sin(t * 3.2 + i * 1.1);
  }

  // 信息卡跟随
  if (cardMarker) {
    const core = markerMeshes.find(c => c.userData.marker.id === cardMarker.id);
    const wp = new THREE.Vector3();
    core.getWorldPosition(wp);
    wp.project(camera);
    if (wp.z > 1) {
      infocard.style.opacity = '0';
    } else {
      infocard.style.opacity = '1';
      const x = clamp((wp.x * 0.5 + 0.5) * innerWidth, 150, innerWidth - 150);
      const y = clamp((-wp.y * 0.5 + 0.5) * innerHeight, 130, innerHeight - 30);
      infocard.style.left = x + 'px';
      infocard.style.top = (y - 16) + 'px';
    }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 调试钩子：标注点屏幕坐标 */
window.__markerScreen = id => {
  const core = markerMeshes.find(c => c.userData.marker.id === id);
  if (!core) return null;
  const wp = new THREE.Vector3();
  core.getWorldPosition(wp);
  wp.project(camera);
  return { x: (wp.x * 0.5 + 0.5) * innerWidth, y: (-wp.y * 0.5 + 0.5) * innerHeight, z: wp.z };
};
</script>
