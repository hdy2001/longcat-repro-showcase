<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抬梁之上 - 单檐歇山殿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif; background: #F5EFE0; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F5EFE0; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .loading-text { font-size: 28px; color: #4a3728; letter-spacing: 10px; }

        #title { position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none; }
        #title h1 { font-size: 52px; color: #4a3728; font-weight: 700; letter-spacing: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.08); }
        #title p { font-size: 14px; color: #8a7358; margin-top: 8px; letter-spacing: 5px; }

        #control-panel {
            position: fixed; top: 0; right: 0; width: 280px; height: 100%;
            background: rgba(28, 22, 16, 0.93); backdrop-filter: blur(12px);
            z-index: 100; padding: 30px 24px; overflow-y: auto; color: #e8dcc8;
            border-left: 1px solid rgba(200, 170, 100, 0.15);
        }
        .panel-section { margin-bottom: 28px; }
        .panel-section h3 {
            font-size: 12px; color: #c8a45c; letter-spacing: 3px; margin-bottom: 14px;
            padding-bottom: 10px; border-bottom: 1px solid rgba(200, 170, 100, 0.15);
        }
        .panel-btn {
            display: block; width: 100%; padding: 9px 14px; margin-bottom: 8px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(200,170,100,0.15);
            color: #e8dcc8; cursor: pointer; transition: all 0.25s; font-size: 13px;
            text-align: left; font-family: inherit;
        }
        .panel-btn:hover { background: rgba(200,164,92,0.12); border-color: rgba(200,164,92,0.4); }
        .panel-btn.active { background: rgba(200,164,92,0.18); border-color: #c8a45c; }
        .layer-toggle {
            display: flex; align-items: center; padding: 7px 0; cursor: pointer;
            font-size: 13px; color: #d4c8b0;
        }
        .layer-toggle input { margin-right: 10px; accent-color: #c8a45c; cursor: pointer; }
        .layer-toggle:hover { color: #e8dcc8; }

        #bottom-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 14px; z-index: 100;
        }
        .view-btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: rgba(28,22,16,0.8); border: 1px solid rgba(200,170,100,0.25);
            color: #e8dcc8; font-size: 14px; cursor: pointer; transition: all 0.25s;
            display: flex; align-items: center; justify-content: center; font-family: inherit;
        }
        .view-btn:hover { background: rgba(200,164,92,0.2); border-color: #c8a45c; }
        .view-btn.active { background: rgba(200,164,92,0.28); border-color: #c8a45c; }

        #info-card {
            position: fixed; top: 50%; left: 40px; transform: translateY(-50%);
            width: 300px; background: rgba(28,22,16,0.93); backdrop-filter: blur(12px);
            border: 1px solid rgba(200,170,100,0.25); border-radius: 10px;
            padding: 24px; z-index: 200; color: #e8dcc8;
            transition: opacity 0.3s, transform 0.3s;
        }
        #info-card.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(-20px); }
        .info-title { font-size: 20px; color: #c8a45c; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(200,170,100,0.15); }
        .info-body { font-size: 14px; line-height: 1.9; color: #d4c8b0; }
        .info-close {
            position: absolute; top: 12px; right: 14px; background: none; border: none;
            color: #c8a45c; font-size: 22px; cursor: pointer; line-height: 1;
        }
        .info-close:hover { color: #e8dcc8; }

        .label-marker {
            pointer-events: auto; cursor: pointer;
            background: rgba(28,22,16,0.82); color: #e8dcc8;
            padding: 4px 12px; border-radius: 14px; font-size: 12px;
            white-space: nowrap; border: 1px solid rgba(200,170,100,0.3);
            transition: all 0.2s; font-family: 'Noto Serif SC', 'Songti SC', serif;
        }
        .label-marker:hover {
            background: rgba(200,164,92,0.25); border-color: #c8a45c;
            transform: scale(1.08);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(200,170,100,0.3); border-radius: 2px; }
    </style>
</head>
<body>
    <div id="loading"><div class="loading-text">抬梁之上</div></div>
    <div id="canvas-container"></div>

    <div id="title">
        <h1>抬梁之上</h1>
        <p>单檐歇山殿 · 三维解析</p>
    </div>

    <div id="control-panel">
        <div class="panel-section">
            <h3>视角预设</h3>
            <button class="panel-btn" data-view="front">正面 · 南立面</button>
            <button class="panel-btn" data-view="side">侧面 · 东山面</button>
            <button class="panel-btn" data-view="top">俯视 · 屋顶平面</button>
            <button class="panel-btn active" data-view="overview">全景 · 三维轴测</button>
        </div>
        <div class="panel-section">
            <h3>图层显隐</h3>
            <label class="layer-toggle"><input type="checkbox" data-layer="platform" checked>台基 · 踏跺 · 望柱</label>
            <label class="layer-toggle"><input type="checkbox" data-layer="columns" checked>檐柱 · 柱础</label>
            <label class="layer-toggle"><input type="checkbox" data-layer="architrave" checked>额枋 · 平板枋</label>
            <label class="layer-toggle"><input type="checkbox" data-layer="dougong" checked>斗拱层</label>
            <label class="layer-toggle"><input type="checkbox" data-layer="walls" checked>槅扇门窗</label>
            <label class="layer-toggle"><input type="checkbox" data-layer="roof" checked>歇山顶 · 屋脊 · 山花</label>
            <label class="layer-toggle"><input type="checkbox" data-layer="lanterns" checked>檐下灯笼</label>
        </div>
        <div class="panel-section">
            <h3>解构动画</h3>
            <button class="panel-btn" id="explode-btn">解构 · 分层展示</button>
        </div>
        <div class="panel-section">
            <h3>昼夜切换</h3>
            <button class="panel-btn" id="night-btn">入夜 · 灯笼点亮</button>
        </div>
    </div>

    <div id="bottom-bar">
        <button class="view-btn active" data-view="overview">01</button>
        <button class="view-btn" data-view="front">02</button>
        <button class="view-btn" data-view="side">03</button>
        <button class="view-btn" data-view="top">04</button>
    </div>

    <div id="info-card" class="hidden">
        <div class="info-title"></div>
        <div class="info-body"></div>
        <button class="info-close">×</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script>
    (function() {
        'use strict';

        // ==================== CONFIGURATION ====================
        const CFG = {
            platW: 26, platD: 17, platH: 1.5,
            colH: 4.5, colR: 0.25,
            colX: [-10, -6, -2, 2, 6, 10],
            colZ: [-7, 7],
            sideColZ: [-2.33, 2.33],
            sideColX: [-10, 10],
            bayW: 4, bayD: 4.67,
            roofHW: 12, roofHD: 9, ridgeHalf: 8,
            ridgeY: 10.5, eaveY: 7.5, gableZ: 3.5,
            stepCount: 5, stepW: 4, stepH: 0.3, stepD: 0.6,
            balusterH: 0.9, balusterR: 0.08,
        };

        const COLORS = {
            bg: 0xF5EFE0, ground: 0xE8DFD0,
            stone: 0x9a9a8a, stoneDark: 0x7a7a6a,
            column: 0x8B2323, columnDark: 0x6B1A1A,
            architrave: 0x6B3030,
            dougong: 0x5A2020, dougongAccent: 0xC8A45C,
            lattice: 0xC8A45C, latticeDark: 0x8B6914,
            roof: 0x5a5a5a, roofDark: 0x4a4a4a,
            ridge: 0x3a3a3a,
            chiwen: 0x2a2a2a,
            gable: 0xF5EFE0,
            hangfish: 0x8B6914,
            lantern: 0xCC3333, lanternGold: 0xDAA520,
            nightBg: 0x0a0a1a, nightGround: 0x0f0f1a,
        };

        // ==================== SCENE SETUP ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(COLORS.bg);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(22, 14, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const cssRenderer = new THREE.CSS2DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.style.position = 'absolute';
        cssRenderer.domElement.style.top = '0';
        cssRenderer.domElement.style.left = '0';
        cssRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(cssRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 15;
        controls.maxDistance = 60;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.target.set(0, 5, 0);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.45);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xFFF5E0, 0.85);
        sunLight.position.set(20, 30, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 80;
        sunLight.shadow.camera.left = -25;
        sunLight.shadow.camera.right = 25;
        sunLight.shadow.camera.top = 25;
        sunLight.shadow.camera.bottom = -25;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xE8F0FF, 0.2);
        fillLight.position.set(-15, 10, -10);
        scene.add(fillLight);

        // ==================== TEXTURE GENERATION ====================
        function createLatticeTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#C8A45C';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#8B6914';
            ctx.lineWidth = 4;
            ctx.strokeRect(8, 8, 240, 240);
            ctx.lineWidth = 3;
            const cs = 32;
            for (let i = 1; i < 8; i++) {
                ctx.beginPath(); ctx.moveTo(i * cs, 8); ctx.lineTo(i * cs, 248); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(8, i * cs); ctx.lineTo(248, i * cs); ctx.stroke();
            }
            ctx.lineWidth = 2;
            for (let x = 0; x < 8; x++) {
                for (let y = 0; y < 8; y++) {
                    const cx = x * cs + cs / 2, cy = y * cs + cs / 2, r = cs / 2 - 5;
                    ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
                }
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            return t;
        }

        function createRoofTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#606060';
            ctx.fillRect(0, 0, 512, 512);
            const tw = 32;
            for (let i = 0; i < 512; i += tw) {
                const g = ctx.createLinearGradient(i, 0, i + tw, 0);
                g.addColorStop(0, '#4a4a4a'); g.addColorStop(0.5, '#6a6a6a'); g.addColorStop(1, '#4a4a4a');
                ctx.fillStyle = g;
                ctx.fillRect(i, 0, tw, 512);
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(i, 0, 2, 512);
            }
            ctx.strokeStyle = '#505050';
            ctx.lineWidth = 1;
            for (let i = 0; i < 512; i += 24) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * 512, y = Math.random() * 512;
                ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.1) + ')';
                ctx.fillRect(x, y, 6, 6);
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(6, 4);
            return t;
        }

        function createStoneTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#8a8a7a';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 600; i++) {
                const x = Math.random() * 256, y = Math.random() * 256;
                const s = Math.random() * 3 + 1;
                ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.12) + ')';
                ctx.fillRect(x, y, s, s);
            }
            ctx.strokeStyle = '#6a6a5a';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath(); ctx.moveTo(0, i * 64); ctx.lineTo(256, i * 64); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(i * 64, 0); ctx.lineTo(i * 64, 256); ctx.stroke();
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(4, 2);
            return t;
        }

        function createGroundTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#E8DFD0';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * 512, y = Math.random() * 512;
                const s = Math.random() * 4 + 1;
                ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.06) + ')';
                ctx.fillRect(x, y, s, s);
            }
            ctx.strokeStyle = 'rgba(180,165,140,0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 8; i++) {
                ctx.beginPath(); ctx.moveTo(0, i * 64); ctx.lineTo(512, i * 64); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(i * 64, 0); ctx.lineTo(i * 64, 512); ctx.stroke();
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(8, 8);
            return t;
        }

        const texLattice = createLatticeTexture();
        const texRoof = createRoofTexture();
        const texStone = createStoneTexture();
        const texGround = createGroundTexture();

        // ==================== MATERIALS ====================
        const matStone = new THREE.MeshStandardMaterial({ map: texStone, roughness: 0.9, metalness: 0.0 });
        const matStoneDark = new THREE.MeshStandardMaterial({ color: COLORS.stoneDark, roughness: 0.85 });
        const matColumn = new THREE.MeshStandardMaterial({ color: COLORS.column, roughness: 0.6, metalness: 0.1 });
        const matColumnDark = new THREE.MeshStandardMaterial({ color: COLORS.columnDark, roughness: 0.6, metalness: 0.1 });
        const matArchitrave = new THREE.MeshStandardMaterial({ color: COLORS.architrave, roughness: 0.7, metalness: 0.05 });
        const matDougong = new THREE.MeshStandardMaterial({ color: COLORS.dougong, roughness: 0.65, metalness: 0.05 });
        const matDougongAccent = new THREE.MeshStandardMaterial({ color: COLORS.dougongAccent, roughness: 0.5, metalness: 0.3 });
        const matLattice = new THREE.MeshStandardMaterial({ map: texLattice, roughness: 0.7, metalness: 0.15 });
        const matLatticeFrame = new THREE.MeshStandardMaterial({ color: COLORS.latticeDark, roughness: 0.6, metalness: 0.2 });
        const matRoof = new THREE.MeshStandardMaterial({ map: texRoof, roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide });
        const matRidge = new THREE.MeshStandardMaterial({ color: COLORS.ridge, roughness: 0.8 });
        const matChiwen = new THREE.MeshStandardMaterial({ color: COLORS.chiwen, roughness: 0.7, metalness: 0.2 });
        const matGable = new THREE.MeshStandardMaterial({ color: COLORS.gable, roughness: 0.9 });
        const matHangFish = new THREE.MeshStandardMaterial({ color: COLORS.hangfish, roughness: 0.6, metalness: 0.3 });
        const matLantern = new THREE.MeshStandardMaterial({ color: COLORS.lantern, roughness: 0.5, metalness: 0.1, emissive: 0x000000 });
        const matLanternGold = new THREE.MeshStandardMaterial({ color: COLORS.lanternGold, roughness: 0.4, metalness: 0.5 });
        const matGround = new THREE.MeshStandardMaterial({ map: texGround, roughness: 0.95 });

        // ==================== ROOF HEIGHT FUNCTION ====================
        function roofHeight(x, z) {
            const ridgeY = CFG.ridgeY, eaveY = CFG.eaveY;
            const halfW = CFG.roofHW, halfD = CFG.roofHD;
            const ridgeHalf = CFG.ridgeHalf, gableZ = CFG.gableZ;
            const ax = Math.abs(x), az = Math.abs(z);
            let t;
            if (ax <= ridgeHalf) {
                t = az / halfD;
            } else {
                const xt = (ax - ridgeHalf) / (halfW - ridgeHalf);
                const diagZ = gableZ + (halfD - gableZ) * xt;
                if (az <= diagZ) {
                    t = az / halfD;
                } else {
                    const hipExtra = (az - diagZ) / (halfD - diagZ);
                    t = az / halfD + hipExtra * 0.2;
                }
            }
            t = Math.min(t, 1);
            const curved = Math.pow(t, 1.4);
            let y = ridgeY - (ridgeY - eaveY) * curved;
            const cx = Math.max(0, ax - halfW * 0.55);
            const cz = Math.max(0, az - halfD * 0.55);
            const cornerDist = Math.sqrt(cx * cx + cz * cz);
            const maxDist = Math.sqrt(Math.pow(halfW * 0.45, 2) + Math.pow(halfD * 0.45, 2));
            y += Math.min(cornerDist / maxDist, 1) * 0.8;
            return y;
        }

        // ==================== BUILDING CREATION ====================
        const building = new THREE.Group();
        scene.add(building);

        const layers = {
            platform: new THREE.Group(),
            columns: new THREE.Group(),
            architrave: new THREE.Group(),
            dougong: new THREE.Group(),
            walls: new THREE.Group(),
            roof: new THREE.Group(),
            lanterns: new THREE.Group(),
        };
        Object.values(layers).forEach(g => building.add(g));

        // ---- Platform ----
        function createPlatform() {
            const g = layers.platform;
            const baseSlab = new THREE.Mesh(new THREE.BoxGeometry(CFG.platW, 0.8, CFG.platD), matStone);
            baseSlab.position.y = 0.4;
            baseSlab.receiveShadow = true;
            g.add(baseSlab);

            const upperPlat = new THREE.Mesh(new THREE.BoxGeometry(CFG.platW + 0.4, 0.7, CFG.platD + 0.4), matStone);
            upperPlat.position.y = 1.15;
            upperPlat.receiveShadow = true;
            g.add(upperPlat);

            const topSlab = new THREE.Mesh(new THREE.BoxGeometry(CFG.platW + 0.6, 0.1, CFG.platD + 0.6), matStoneDark);
            topSlab.position.y = 1.55;
            topSlab.receiveShadow = true;
            g.add(topSlab);
        }

        function createSteps() {
            const g = layers.platform;
            const totalSteps = CFG.stepCount;
            for (let i = 0; i < totalSteps; i++) {
                const step = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.stepW, CFG.stepH, CFG.stepD),
                    matStone
                );
                step.position.set(0, CFG.platH - (i + 0.5) * CFG.stepH, CFG.platD / 2 + (totalSteps - i - 0.5) * CFG.stepD);
                step.receiveShadow = true;
                g.add(step);
            }
        }

        function createBalusters() {
            const g = layers.platform;
            const balusterGeo = new THREE.CylinderGeometry(CFG.balusterR, CFG.balusterR * 1.3, CFG.balusterH, 8);
            const capGeo = new THREE.SphereGeometry(CFG.balusterR * 1.2, 8, 6);
            const positions = [];
            const margin = 0.8;
            const spacing = 2.5;

            for (let x = -CFG.platW / 2 + margin; x <= CFG.platW / 2 - margin; x += spacing) {
                positions.push([x, CFG.platD / 2 - margin]);
                positions.push([x, -CFG.platD / 2 + margin]);
            }
            for (let z = -CFG.platD / 2 + margin; z <= CFG.platD / 2 - margin; z += spacing) {
                if (Math.abs(z) > CFG.stepW / 2 + 1) {
                    positions.push([-CFG.platW / 2 + margin, z]);
                    positions.push([CFG.platW / 2 - margin, z]);
                }
            }

            positions.forEach(([x, z]) => {
                const bal = new THREE.Mesh(balusterGeo, matStoneDark);
                bal.position.set(x, CFG.platH + CFG.balusterH / 2, z);
                bal.castShadow = true;
                g.add(bal);
                const cap = new THREE.Mesh(capGeo, matStoneDark);
                cap.position.set(x, CFG.platH + CFG.balusterH + CFG.balusterR, z);
                g.add(cap);
            });
        }

        // ---- Columns ----
        function createColumns() {
            const g = layers.columns;
            const colGeo = new THREE.CylinderGeometry(CFG.colR, CFG.colR * 1.1, CFG.colH, 12);
            const baseGeo = new THREE.CylinderGeometry(CFG.colR * 1.5, CFG.colR * 1.7, 0.3, 12);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x7a7a6a, roughness: 0.85 });

            const positions = [];
            CFG.colX.forEach(x => {
                positions.push([x, CFG.colZ[0]]);
                positions.push([x, CFG.colZ[1]]);
            });
            CFG.sideColX.forEach(x => {
                CFG.sideColZ.forEach(z => positions.push([x, z]));
            });

            positions.forEach(([x, z]) => {
                const col = new THREE.Mesh(colGeo, matColumn);
                col.position.set(x, CFG.platH + CFG.colH / 2, z);
                col.castShadow = true;
                col.receiveShadow = true;
                g.add(col);

                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.set(x, CFG.platH + 0.15, z);
                base.castShadow = true;
                g.add(base);
            });
        }

        // ---- Architrave ----
        function createArchitrave() {
            const g = layers.architrave;
            const beamH = 0.5, beamW = 0.35;
            const y = CFG.platH + CFG.colH + beamH / 2;

            CFG.colX.forEach(x => {
                if (x !== CFG.colX[0] && x !== CFG.colX[CFG.colX.length - 1]) {
                    const dist = CFG.colX[CFG.colX.indexOf(x) + 1] - x;
                    const beam = new THREE.Mesh(new THREE.BoxGeometry(dist, beamH, beamW), matArchitrave);
                    beam.position.set(x + dist / 2, y, CFG.colZ[0]);
                    beam.castShadow = true;
                    g.add(beam);
                    const beam2 = beam.clone();
                    beam2.position.z = CFG.colZ[1];
                    g.add(beam2);
                }
            });

            CFG.sideColZ.forEach(z => {
                const beam = new THREE.Mesh(new THREE.BoxGeometry(beamW, beamH, CFG.bayD), matArchitrave);
                beam.position.set(CFG.sideColX[0], y, z);
                beam.castShadow = true;
                g.add(beam);
                const beam2 = beam.clone();
                beam2.position.x = CFG.sideColX[1];
                g.add(beam2);
            });

            const platFangH = 0.2;
            const platFang = new THREE.Mesh(
                new THREE.BoxGeometry(CFG.platW - 2, platFangH, CFG.platD - 2),
                matDougongAccent
            );
            platFang.position.y = y + beamH / 2 + platFangH / 2;
            g.add(platFang);
        }

        // ---- Dougong ----
        function createDougongSet() {
            const g = new THREE.Group();
            const bw = 0.6, bh = 0.25;
            const base = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bw), matDougong);
            base.position.y = bh / 2;
            g.add(base);

            for (let i = 0; i < 3; i++) {
                const armW = 1.2 + i * 0.3;
                const armH = 0.18;
                const armY = bh + i * 0.22 + armH / 2;

                const armX = new THREE.Mesh(new THREE.BoxGeometry(armW, armH, 0.25), matDougong);
                armX.position.y = armY;
                g.add(armX);

                const armZ = new THREE.Mesh(new THREE.BoxGeometry(0.25, armH, armW), matDougong);
                armZ.position.y = armY;
                g.add(armZ);

                const blockGeo = new THREE.BoxGeometry(0.18, 0.12, 0.18);
                [[-1, 0], [1, 0]].forEach(([sx, sz]) => {
                    const block = new THREE.Mesh(blockGeo, matDougongAccent);
                    block.position.set(sx * armW * 0.35, armY + armH / 2 + 0.06, sz * armW * 0.35);
                    g.add(block);
                });
            }

            const topBeam = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.22, 0.35), matDougong);
            topBeam.position.y = bh + 3 * 0.22 + 0.11;
            g.add(topBeam);

            const topBeam2 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.22, 1.8), matDougong);
            topBeam2.position.y = bh + 3 * 0.22 + 0.11;
            g.add(topBeam2);

            return g;
        }

        function createDougongLayer() {
            const g = layers.dougong;
            const dougongPositions = [];
            CFG.colX.forEach(x => {
                dougongPositions.push([x, CFG.colZ[0]]);
                dougongPositions.push([x, CFG.colZ[1]]);
            });
            CFG.sideColX.forEach(x => {
                CFG.sideColZ.forEach(z => dougongPositions.push([x, z]));
            });

            dougongPositions.forEach(([x, z]) => {
                const dg = createDougongSet();
                dg.position.set(x, CFG.platH + CFG.colH + 0.5, z);
                g.add(dg);
            });
        }

        // ---- Walls (Lattice doors/windows) ----
        function createWalls() {
            const g = layers.walls;
            const wallH = CFG.colH;
            const wallT = 0.15;
            const frameT = 0.12;
            const frameD = 0.2;

            function createPanel(w, h) {
                const panel = new THREE.Group();
                const inner = new THREE.Mesh(new THREE.BoxGeometry(w - frameT * 2, h - frameT * 2, wallT), matLattice);
                panel.add(inner);

                const ft = new THREE.Mesh(new THREE.BoxGeometry(w, frameT, frameD), matLatticeFrame);
                ft.position.y = h / 2 - frameT / 2;
                panel.add(ft);
                const fb = ft.clone(); fb.position.y = -h / 2 + frameT / 2;
                panel.add(fb);
                const fl = new THREE.Mesh(new THREE.BoxGeometry(frameT, h, frameD), matLatticeFrame);
                fl.position.x = -w / 2 + frameT / 2;
                panel.add(fl);
                const fr = fl.clone(); fr.position.x = w / 2 - frameT / 2;
                panel.add(fr);

                return panel;
            }

            for (let i = 0; i < CFG.colX.length - 1; i++) {
                const w = CFG.bayW - CFG.colR * 2 - 0.2;
                const panel = createPanel(w, wallH);
                panel.position.set(
                    (CFG.colX[i] + CFG.colX[i + 1]) / 2,
                    CFG.platH + wallH / 2,
                    CFG.colZ[0]
                );
                g.add(panel);

                const panel2 = panel.clone();
                panel2.position.z = CFG.colZ[1];
                g.add(panel2);
            }

            for (let i = 0; i < CFG.sideColZ.length - 1; i++) {
                const w = CFG.bayD - CFG.colR * 2 - 0.2;
                const panel = createPanel(w, wallH);
                panel.position.set(
                    CFG.sideColX[0],
                    CFG.platH + wallH / 2,
                    (CFG.sideColZ[i] + CFG.sideColZ[i + 1]) / 2
                );
                panel.rotation.y = Math.PI / 2;
                g.add(panel);

                const panel2 = panel.clone();
                panel2.position.x = CFG.sideColX[1];
                g.add(panel2);
            }
        }

        // ---- Roof Surface ----
        function createRoofSurface() {
            const segX = 80, segZ = 60;
            const positions = [], uvs = [], indices = [];

            for (let iz = 0; iz <= segZ; iz++) {
                for (let ix = 0; ix <= segX; ix++) {
                    const u = ix / segX, v = iz / segZ;
                    const x = (u - 0.5) * CFG.roofHW * 2;
                    const z = (v - 0.5) * CFG.roofHD * 2;
                    const y = roofHeight(x, z);
                    positions.push(x, y, z);
                    uvs.push(u * 8, v * 5);
                }
            }

            for (let iz = 0; iz < segZ; iz++) {
                for (let ix = 0; ix < segX; ix++) {
                    const a = iz * (segX + 1) + ix;
                    const b = a + 1;
                    const c = a + segX + 1;
                    const d = c + 1;
                    indices.push(a, c, b, b, c, d);
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geo.setIndex(indices);
            geo.computeVertexNormals();

            const mesh = new THREE.Mesh(geo, matRoof);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            layers.roof.add(mesh);
        }

        // ---- Ridges ----
        function createRidgeTube(points, radius) {
            const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
            const geo = new THREE.TubeGeometry(curve, 24, radius, 8, false);
            const mesh = new THREE.Mesh(geo, matRidge);
            mesh.castShadow = true;
            return mesh;
        }

        function createRidges() {
            const g = layers.roof;
            const rHalf = CFG.ridgeHalf, ridgeY = CFG.ridgeY;

            // Main ridge
            const mainRidge = createRidgeTube([
                [-rHalf - 0.3, ridgeY + 0.15, 0],
                [-rHalf * 0.5, ridgeY + 0.2, 0],
                [0, ridgeY + 0.2, 0],
                [rHalf * 0.5, ridgeY + 0.2, 0],
                [rHalf + 0.3, ridgeY + 0.15, 0],
            ], 0.18);
            g.add(mainRidge);

            // Descending ridges (垂脊)
            [rHalf, -rHalf].forEach(rx => {
                [1, -1].forEach(sz => {
                    const gableZ = CFG.gableZ;
                    const y1 = roofHeight(rx, 0);
                    const y2 = roofHeight(rx, gableZ);
                    const dr = createRidgeTube([
                        [rx, y1 + 0.1, sz * 0.1],
                        [rx, y2 + 0.15, sz * gableZ * 0.5],
                        [rx, y2 + 0.1, sz * gableZ],
                    ], 0.14);
                    g.add(dr);
                });
            });

            // Diagonal ridges (戗脊)
            [rHalf, -rHalf].forEach(rx => {
                [1, -1].forEach(sz => {
                    const gableZ = CFG.gableZ;
                    const y1 = roofHeight(rx, gableZ);
                    const cornerX = CFG.roofHW * 0.95;
                    const cornerZ = CFG.roofHD * 0.95;
                    const y2 = roofHeight(cornerX, cornerZ);
                    const dr = createRidgeTube([
                        [rx, y1 + 0.1, sz * gableZ],
                        [rx + (cornerX - rx) * 0.5, (y1 + y2) / 2 + 0.1, sz * (gableZ + cornerZ) / 2],
                        [cornerX, y2 + 0.15, sz * cornerZ],
                    ], 0.12);
                    g.add(dr);
                });
            });
        }

        // ---- Chiwen (鸱吻) ----
        function createChiwen() {
            const g = layers.roof;
            const rHalf = CFG.ridgeHalf, ridgeY = CFG.ridgeY;

            [rHalf + 0.2, -rHalf - 0.2].forEach(x => {
                const chi = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.5), matChiwen);
                body.position.y = 0.4;
                chi.add(body);
                const fin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.35), matChiwen);
                fin.position.set(0, 0.9, 0);
                fin.rotation.z = x > 0 ? -0.3 : 0.3;
                chi.add(fin);
                const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.4), matChiwen);
                tail.position.set(0, 0.75, -0.3);
                chi.add(tail);
                chi.position.set(x, ridgeY + 0.1, 0);
                chi.castShadow = true;
                g.add(chi);
            });
        }

        // ---- Gable walls (山花) ----
        function createGableWalls() {
            const g = layers.roof;
            const rHalf = CFG.ridgeHalf;
            const ridgeY = CFG.ridgeY;
            const gableZ = CFG.gableZ;
            const yBottom = roofHeight(rHalf, gableZ);

            [rHalf, -rHalf].forEach(gx => {
                const shape = new THREE.Shape();
                shape.moveTo(0, ridgeY - yBottom + 0.3);
                shape.lineTo(-gableZ, 0);
                shape.lineTo(gableZ, 0);
                shape.closePath();

                const extrudeSettings = { depth: 0.25, bevelEnabled: false };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const mesh = new THREE.Mesh(geo, matGable);
                mesh.position.set(gx - 0.125, yBottom - 0.1, 0);
                mesh.castShadow = true;
                g.add(mesh);
            });
        }

        // ---- Hang Fish (悬鱼) ----
        function createHangFish() {
            const g = layers.roof;
            const rHalf = CFG.ridgeHalf;
            const ridgeY = CFG.ridgeY;
            const gableZ = CFG.gableZ;
            const yBottom = roofHeight(rHalf, gableZ);
            const hangY = yBottom + (ridgeY - yBottom) * 0.45;

            [rHalf, -rHalf].forEach(gx => {
                const fish = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.12), matHangFish);
                body.position.y = -0.25;
                fish.add(body);
                const tail = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.2, 4), matHangFish);
                tail.position.y = -0.55;
                tail.rotation.z = Math.PI;
                fish.add(tail);
                const string = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 4), matHangFish);
                string.position.y = 0.1;
                fish.add(string);
                fish.position.set(gx, hangY, 0);
                g.add(fish);
            });
        }

        // ---- Eave board ----
        function createEaveBoard() {
            const g = layers.roof;
            const eaveY = CFG.eaveY;
            const hw = CFG.roofHW, hd = CFG.roofHD;
            const boardH = 0.2, boardT = 0.15;

            const positions = [
                [0, hd, hw * 2, boardT],
                [0, -hd, hw * 2, boardT],
                [hw, 0, boardT, hd * 2],
                [-hw, 0, boardT, hd * 2],
            ];

            positions.forEach(([x, z, w, d]) => {
                const board = new THREE.Mesh(new THREE.BoxGeometry(w, boardH, d), matArchitrave);
                board.position.set(x, eaveY - boardH / 2, z);
                board.castShadow = true;
                g.add(board);
            });
        }

        // ---- Lanterns ----
        function createLantern() {
            const g = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(0.3, 12, 10);
            bodyGeo.scale(1, 1.2, 1);
            const body = new THREE.Mesh(bodyGeo, matLantern.clone());
            body.position.y = -0.3;

            topCap.position.y = 0.05;

            const botCap = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.1, 8), matLanternGold);
            botCap.position.y = -0.65;

            const string = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 4), matLanternGold);

        function createLanterns() {
            const g = layers.lanterns;
            const lanternPositions = [];
            for (let i = 0; i < CFG.colX.length - 1; i++) {
                const x = (CFG.colX[i] + CFG.colX[i + 1]) / 2;
                lanternPositions.push([x, CFG.colZ[0] + 0.5]);

                lan.position.set(x, CFG.platH + CFG.colH - 0.3, z);
                g.add(lan);
            });
        }

                update(dt) {
                    elapsed += dt;
                    const t = Math.min(elapsed / duration, 1);
                    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                    camera.position.lerpVectors(startPos, endPos, ease);
                    controls.target.lerpVectors(startTarget, endTarget, ease);
                    if (t >= 1) camAnim = null;
                }
            };
        }

        document.querySelectorAll('[data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const view = btn.getAttribute('data-view');
                if (viewPresets[view]) {
                    animateCameraTo(viewPresets[view]);
                }
            });
        });

        // Layer toggles
        document.querySelectorAll('[data-layer]').forEach(toggle => {
            toggle.addEventListener('change', () => {
                const layerName = toggle.getAttribute('data-layer');
                const layerMap = {
                    platform: layers.platform,
                    columns: layers.columns,
                    architrave: layers.architrave,
                    dougong: layers.dougong,
                    walls: layers.walls,
                    roof: layers.roof,
                    lanterns: layers.lanterns,
                };
                const layer = layerMap[layerName];
                if (layer) {
                    layer.visible = toggle.checked;
                }
            });
        });

        // ==================== NIGHT MODE ====================
        const dayBg = new THREE.Color(COLORS.bg);
        const nightBgC = new THREE.Color(COLORS.nightBg);
        const dayGround = new THREE.Color(COLORS.ground);
        const nightGroundC = new THREE.Color(COLORS.nightGround);
        const dayAmbient = new THREE.Color(0xFFFFFF);
        const nightAmbientC = new THREE.Color(0x334466);
        const daySun = new THREE.Color(0xFFF5E0);
        const nightSunC = new THREE.Color(0x8899BB);

        const lanternLights = [];
        function setupLanternLights() {
            layers.lanterns.children.forEach((lan, i) => {
                if (i % 4 === 0) {
                    const light = new THREE.PointLight(0xFFAA33, 0, 12, 2);
                    light.position.copy(lan.position);
                    light.position.y -= 0.3;
                    scene.add(light);
                    lanternLights.push(light);
                }
            });
        }
        setupLanternLights();

        function applyNight(f) {
            const lerpC = (c1, c2) => new THREE.Color(
                c1.r + (c2.r - c1.r) * f,
                c1.g + (c2.g - c1.g) * f,
                c1.b + (c2.b - c1.b) * f
            );
            const lerpN = (n1, n2) => n1 + (n2 - n1) * f;

            scene.background = lerpC(dayBg, nightBgC);
            ambientLight.color = lerpC(dayAmbient, nightAmbientC);
            ambientLight.intensity = lerpN(0.45, 0.18);
            sunLight.color = lerpC(daySun, nightSunC);
            sunLight.intensity = lerpN(0.85, 0.3);
            fillLight.intensity = lerpN(0.2, 0.05);
            ground.material.color = lerpC(dayGround, nightGroundC);

            layers.lanterns.children.forEach(lan => {
                if (lan.userData.body) {
                    lan.userData.body.material.emissive.setHex(0xFFAA33);
                    lan.userData.body.material.emissiveIntensity = f * 0.8;
                }
            });
            lanternLights.forEach(light => {
                light.intensity = f * 1.5;
            });
        }

        // ==================== EXPLODE ====================
        function applyExplode(f) {
            layers.platform.position.y = 0 * f;
            layers.columns.position.y = 3 * f;
            layers.architrave.position.y = 5.5 * f;
            layers.dougong.position.y = 7.5 * f;
            layers.walls.position.y = 3.5 * f;
            layers.roof.position.y = 11 * f;
            layers.lanterns.position.y = -0.5 * f;
        }

        // ==================== ANIMATION LOOP ====================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            controls.update();

            if (camAnim) camAnim.update(dt);

            explodeFactor += (explodeTarget - explodeFactor) * 0.06;
            applyExplode(explodeFactor);

            nightFactor += (nightTarget - nightFactor) * 0.06;
            applyNight(nightFactor);

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

        // ==================== RESIZE ====================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        // ==================== INIT ====================
        animate();

        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 400);

    })();
    </script>
</body>
</html>
