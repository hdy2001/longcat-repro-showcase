<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三维发动机模型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#0b0e14; }
  #scene { position:fixed; inset:0; }
  #ui {
    position:fixed; top:18px; left:18px; z-index:10; width:250px;
    background:rgba(12,16,26,.6); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1); border-radius:14px;
    padding:16px; color:#dfe6f2; user-select:none;
  }
  #ui h1 { font-size:15px; font-weight:600; letter-spacing:1px; margin-bottom:4px; }
  #ui .sub { font-size:10px; opacity:.5; letter-spacing:2px; margin-bottom:14px; }
  .row { margin-bottom:14px; }
  .row label { display:flex; justify-content:space-between; font-size:12px; color:#aeb9cf; margin-bottom:7px; }
  .row label b { color:#5eead4; font-family:Consolas,monospace; font-weight:600; }
  input[type=range] {
    width:100%; -webkit-appearance:none; height:5px; border-radius:3px;
    background:linear-gradient(90deg,#14b8a6,#5eead4); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:3px solid #14b8a6; box-shadow:0 0 10px rgba(94,234,212,.6); cursor:pointer;
  }
  .ebtn {
    width:100%; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.07);
    color:#dfe6f2; font-size:12px; padding:8px 0; border-radius:8px; cursor:pointer;
    transition:all .25s; margin-bottom:8px; letter-spacing:1px;
  }
  .ebtn:hover { background:rgba(255,255,255,.15); }
  .ebtn.active { background:linear-gradient(135deg,#0d9488,#14b8a6); border-color:transparent; color:#fff; }
  .ebtn.scan.active { background:linear-gradient(135deg,#0891b2,#22d3ee); }
  #rpmBar { height:3px; background:rgba(255,255,255,.1); border-radius:2px; margin-top:6px; overflow:hidden; }
  #rpmBar i { display:block; height:100%; width:15%; background:linear-gradient(90deg,#14b8a6,#f59e0b,#ef4444); transition:width .1s; }
  #hint {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    color:rgba(255,255,255,.45); font-size:11px; letter-spacing:2px; pointer-events:none;
  }
  #scanOverlay {
    position:fixed; inset:0; z-index:20; pointer-events:none; display:none; overflow:hidden;
  }
  #scanOverlay .beam {
    position:absolute; left:0; width:100%; height:3px;
    background:linear-gradient(90deg,transparent,#22d3ee,transparent);
    box-shadow:0 0 24px 4px rgba(34,211,238,.55);
    animation:beamMove 1.6s linear infinite;
  }
  @keyframes beamMove { 0%{top:-1%} 100%{top:101%} }
  #scanOverlay .grid-lines {
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(34,211,238,.05) 0 1px, transparent 1px 28px);
  }
  #scanOverlay .pct {
    position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
    color:#22d3ee; font-family:Consolas,monospace; font-size:26px; letter-spacing:6px;
    text-shadow:0 0 18px rgba(34,211,238,.8);
  }
  #scanOverlay .lbl {
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    color:rgba(34,211,238,.8); font-size:12px; letter-spacing:8px;
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="ui">
  <h1>直列四缸发动机</h1>
  <div class="sub">INLINE-4 ENGINE</div>
  <div class="row">
    <label>转速 RPM <b id="rpmVal">900</b></label>
    <input type="range" id="rpm" min="0" max="6000" step="50" value="900">
    <div id="rpmBar"><i></i></div>
  </div>
  <button class="ebtn" id="btnExplode">💥 爆炸图</button>
  <button class="ebtn scan" id="btnScan">🔦 激光扫描 (B)</button>
</div>
<div id="hint">左键拖动旋转 · 滚轮缩放 · 右键平移 · 按 B 触发激光扫描</div>
<div id="scanOverlay"><div class="grid-lines"></div><div class="beam"></div><div class="lbl">LASER SCANNING</div><div class="pct">0%</div></div>

<script>__THREE_LIB__</script>
<script>
/* ============================================================
   三维发动机模型：缩放 / 转速 / 爆炸图 / B键激光扫描
   ============================================================ */
(function () {
  const container = document.getElementById('scene');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e14);
  scene.fog = new THREE.Fog(0x0b0e14, 120, 260);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(42, 30, 50);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 6, 0);
  controls.minDistance = 18;
  controls.maxDistance = 160;

  /* ---------- 灯光 ---------- */
  scene.add(new THREE.AmbientLight(0x8899bb, 0.35));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(50, 70, 40);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x5eead4, 0.35);
  rim.position.set(-40, 30, -50);
  scene.add(rim);

  const grid = new THREE.GridHelper(200, 40, 0x1c2b3a, 0x141d29);
  grid.position.y = -12;
  scene.add(grid);

  /* ---------- 材质 ---------- */
  const M = {
    block:   new THREE.MeshStandardMaterial({ color: 0x5a6472, roughness: 0.45, metalness: 0.85 }),
    crank:   new THREE.MeshStandardMaterial({ color: 0x8a93a3, roughness: 0.3,  metalness: 0.95 }),
    piston:  new THREE.MeshStandardMaterial({ color: 0xd7dde8, roughness: 0.25, metalness: 0.9 }),
    rod:     new THREE.MeshStandardMaterial({ color: 0xb0413e, roughness: 0.4,  metalness: 0.7 }),
    head:    new THREE.MeshStandardMaterial({ color: 0x3f4a5a, roughness: 0.5,  metalness: 0.8 }),
    cover:   new THREE.MeshStandardMaterial({ color: 0xc22f2f, roughness: 0.35, metalness: 0.4 }),
    steel:   new THREE.MeshStandardMaterial({ color: 0xaab4c4, roughness: 0.2,  metalness: 1.0 }),
    sleeve:  new THREE.MeshStandardMaterial({ color: 0x9fb6cc, roughness: 0.15, metalness: 0.9, transparent: true, opacity: 0.28, side: THREE.DoubleSide }),
    intake:  new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: 0.4,  metalness: 0.6 }),
    exhaust: new THREE.MeshStandardMaterial({ color: 0x9a5f3c, roughness: 0.75, metalness: 0.5 }),
    plug:    new THREE.MeshStandardMaterial({ color: 0xf2f2ea, roughness: 0.3,  metalness: 0.2 }),
    pan:     new THREE.MeshStandardMaterial({ color: 0x2e3540, roughness: 0.6,  metalness: 0.7 })
  };

  function uniquify(group) {
    group.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  }

  /* ---------- 发动机构建（直列四缸，曲轴沿 Z 轴） ---------- */
  const R = 2.2;          // 曲柄半径
  const ROD_L = 7.2;      // 连杆长度
  const CYL_Z = [-9, -3, 3, 9];
  const PHASE = [0, Math.PI, Math.PI, 0];
  const engine = new THREE.Group();
  scene.add(engine);

  const parts = []; // { obj, base, dir, zCenter, flash, dynamic }
  function reg(obj, dir, zCenter, dynamic) {
    uniquify(obj);
    parts.push({ obj, base: obj.position.clone(), dir: new THREE.Vector3().copy(dir), zCenter, flash: 0, dynamic: !!dynamic });
    engine.add(obj);
  }

  // 曲轴箱
  const crankcase = new THREE.Mesh(new THREE.BoxGeometry(13, 7, 26), M.block);
  crankcase.position.y = 0;
  reg(crankcase, new THREE.Vector3(0, 0, 0), 0);

  // 油底壳
  const oilPan = new THREE.Mesh(new THREE.BoxGeometry(11, 4.5, 24), M.pan);
  oilPan.position.y = -5.7;
  reg(oilPan, new THREE.Vector3(0, -13, 0), 0);

  // 缸套（半透明，可见活塞）
  const sleeves = new THREE.Group();
  CYL_Z.forEach(z => {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 9, 24, 1, true), M.sleeve);
    s.position.set(0, 8.2, z);
    sleeves.add(s);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.62, 0.22, 8, 24), M.steel);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(0, 12.6, z);
    sleeves.add(ring);
  });
  reg(sleeves, new THREE.Vector3(0, 2, 0), 0);

  // 缸盖
  const head = new THREE.Mesh(new THREE.BoxGeometry(14, 3.6, 27), M.head);
  head.position.y = 14.4;
  reg(head, new THREE.Vector3(0, 8, 0), 0);

  // 气门室盖
  const valveCover = new THREE.Mesh(new THREE.BoxGeometry(12, 2, 24), M.cover);
  valveCover.position.y = 17.2;
  reg(valveCover, new THREE.Vector3(0, 16, 0), 0);

  // 火花塞
  const plugs = new THREE.Group();
  CYL_Z.forEach(z => {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 2.6, 10), M.plug);
    p.position.set(0, 19.4, z);
    plugs.add(p);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2, 8), M.cover);
    cap.position.set(0, 21, z);
    plugs.add(cap);
  });
  reg(plugs, new THREE.Vector3(0, 26, 0), 0);

  // 进气歧管
  const intake = new THREE.Group();
  const plenum = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 21), M.intake);
  plenum.position.set(10.5, 15, 0);
  intake.add(plenum);
  CYL_Z.forEach(z => {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(6.8, 15.5, z),
      new THREE.Vector3(8.2, 18.5, z),
      new THREE.Vector3(10.2, 15.8, z));
    intake.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.9, 10), M.intake));
  });
  reg(intake, new THREE.Vector3(14, 4, 0), 0);

  // 排气歧管
  const exhaust = new THREE.Group();
  const down = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 14, 12), M.exhaust);
  down.rotation.x = Math.PI / 2;
  down.position.set(-9.5, 6, 0);
  exhaust.add(down);
  CYL_Z.forEach(z => {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-6.8, 14.5, z),
      new THREE.Vector3(-8.6, 10.5, z * 0.8),
      new THREE.Vector3(-9.5, 6.5, z * 0.6));
    exhaust.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.85, 10), M.exhaust));
  });
  reg(exhaust, new THREE.Vector3(-14, 2, 0), 0);

  // 曲轴（旋转组，带曲柄配重）
  const crank = new THREE.Group();
  const mainJournal = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 27, 14), M.crank);
  mainJournal.rotation.x = Math.PI / 2;
  crank.add(mainJournal);
  CYL_Z.forEach((z, i) => {
    const ph = PHASE[i];
    const dx = Math.sin(ph), dy = Math.cos(ph);
    // 曲柄销（按发火相位布置）
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 2.2, 12), M.crank);
    pin.rotation.x = Math.PI / 2;
    pin.position.set(R * dx, R * dy, z);
    crank.add(pin);
    // 曲柄臂（径向腹板）
    [z - 1.4, z + 1.4].forEach(zz => {
      const web = new THREE.Mesh(new THREE.BoxGeometry(3.4, R + 1.4, 1.0), M.crank);
      web.position.set(R * dx * 0.5, R * dy * 0.5, zz);
      web.rotation.z = -ph;
      crank.add(web);
      // 配重
      const cw = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.4, 1.0), M.crank);
      cw.position.set(-dx * (R * 0.5 + 1.0), -dy * (R * 0.5 + 1.0), zz);
      cw.rotation.z = -ph;
      crank.add(cw);
    });
  });
  reg(crank, new THREE.Vector3(0, -7, 0), 0, true);

  // 飞轮 & 皮带轮
  const flywheel = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 1.6, 36), M.crank);
  flywheel.rotation.x = Math.PI / 2;
  flywheel.position.z = -14.5;
  const fwRing = new THREE.Mesh(new THREE.TorusGeometry(6, 0.55, 10, 40), M.steel);
  fwRing.position.z = -14.5;
  const flyG = new THREE.Group(); flyG.add(flywheel, fwRing);
  reg(flyG, new THREE.Vector3(0, 0, -12), -14.5);

  const pulley = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 1.4, 20), M.crank);
  pulley.rotation.x = Math.PI / 2;
  pulley.position.z = 14.2;
  reg(pulley, new THREE.Vector3(0, 0, 12), 14.2);

  // 活塞 + 连杆（动态部件，注册用于激光扫描闪光）
  const pistons = [], rods = [];
  CYL_Z.forEach((z, i) => {
    const pg = new THREE.Group();
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 2.6, 20), M.piston);
    pg.add(crown);
    const pinM = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2.6, 10), M.crank);
    pinM.rotation.x = Math.PI / 2;
    pinM.position.y = -0.8;
    pg.add(pinM);
    pg.position.set(0, 8, z);
    pistons.push({ g: pg, z, phase: PHASE[i] });
    reg(pg, new THREE.Vector3(0, 10, 0), z, true);   // 爆炸时活塞上移
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.72, ROD_L, 10), M.rod.clone());
    rod.geometry.translate(0, ROD_L / 2, 0); // 原点在杆下端
    rods.push(rod);
    reg(rod, new THREE.Vector3(0, 0, 0), z, true);    // 连杆随曲轴，仅参与扫描
  });

  /* ---------- 转速控制 ---------- */
  let rpm = 900, crankAngle = 0;
  const rpmInput = document.getElementById('rpm');
  const rpmVal = document.getElementById('rpmVal');
  const rpmBar = document.querySelector('#rpmBar i');
  rpmInput.addEventListener('input', () => {
    rpm = +rpmInput.value;
    rpmVal.textContent = rpm;
    rpmBar.style.width = (rpm / 6000 * 100) + '%';
  });

  /* ---------- 爆炸图 ---------- */
  let explodeTarget = 0, explodeCur = 0;
  const btnExplode = document.getElementById('btnExplode');
  btnExplode.onclick = () => {
    explodeTarget = explodeTarget ? 0 : 1;
    btnExplode.classList.toggle('active', !!explodeTarget);
    btnExplode.textContent = explodeTarget ? '🔧 复位装配' : '💥 爆炸图';
  };

  /* ---------- 激光扫描 ---------- */
  const overlay = document.getElementById('scanOverlay');
  const pctEl = overlay.querySelector('.pct');
  let scanning = false, scanT = 0;
  const SCAN_DUR = 3.0, SCAN_MIN = -24, SCAN_MAX = 24;

  // 扫描平面
  const scanPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(46, 40),
    new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.13, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  scanPlane.visible = false;
  scene.add(scanPlane);
  const scanFrame = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-23, -20, 0), new THREE.Vector3(23, -20, 0),
      new THREE.Vector3(23, 20, 0), new THREE.Vector3(-23, 20, 0)]),
    new THREE.LineBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
  scanFrame.visible = false;
  scene.add(scanFrame);
  const scanLight = new THREE.PointLight(0x22d3ee, 0, 60);
  scene.add(scanLight);

  function startScan() {
    if (scanning) return;
    scanning = true; scanT = 0;
    overlay.style.display = 'block';
    scanPlane.visible = scanFrame.visible = true;
    scanLight.intensity = 2.2;
    btnScan.classList.add('active');
    parts.forEach(p => p.flash = 0);
  }
  function endScan() {
    scanning = false;
    overlay.style.display = 'none';
    scanPlane.visible = scanFrame.visible = false;
    scanLight.intensity = 0;
    btnScan.classList.remove('active');
  }
  const btnScan = document.getElementById('btnScan');
  btnScan.onclick = startScan;
  addEventListener('keydown', e => {
    if (e.key === 'b' || e.key === 'B') startScan();
  });

  /* ---------- 主循环 ---------- */
  const clock = new THREE.Clock();
  const UP = new THREE.Vector3(0, 1, 0);
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // 曲轴旋转
    crankAngle += (rpm / 60) * Math.PI * 2 * dt;
    crank.rotation.z = -crankAngle;
    flyG.rotation.z = -crankAngle;
    pulley.rotation.z = -crankAngle;

    // 爆炸因子
    explodeCur += (explodeTarget - explodeCur) * Math.min(1, dt * 3.2);

    // 活塞 & 连杆运动学（连杆随曲轴，爆炸时活塞向上脱离）
    const ex = explodeCur;
    const crankDrop = -7 * ex; // 曲轴爆炸下移量
    pistons.forEach((p, i) => {
      const a = crankAngle + p.phase;
      const pinX = R * Math.sin(a), pinY = R * Math.cos(a);
      const pistonY = pinY + Math.sqrt(ROD_L * ROD_L - pinX * pinX);
      p.g.position.y = pistonY + 0.8 + ex * 10;
      tmpA.set(pinX, pinY + crankDrop, p.z);
      tmpB.set(0, pistonY + crankDrop, p.z);
      const rod = rods[i];
      rod.position.copy(tmpA);
      tmpC.subVectors(tmpB, tmpA).normalize();
      rod.quaternion.setFromUnitVectors(UP, tmpC);
    });

    // 爆炸位移（动态部件除外）
    for (const p of parts) {
      if (p.dynamic) continue;
      p.obj.position.copy(p.base).addScaledVector(p.dir, ex);
    }

    // 激光扫描
    if (scanning) {
      scanT += dt;
      const t = Math.min(scanT / SCAN_DUR, 1);
      const z = SCAN_MIN + (SCAN_MAX - SCAN_MIN) * t;
      scanPlane.position.set(0, 5, z);
      scanFrame.position.set(0, 5, z);
      scanLight.position.set(0, 8, z);
      pctEl.textContent = Math.round(t * 100) + '%';
      for (const p of parts) {
        if (Math.abs(z - p.zCenter) < 1.6) p.flash = Math.min(p.flash + dt * 6, 1);
      }
      if (t >= 1) endScan();
    }
    // 闪光衰减
    for (const p of parts) {
      if (p.flash > 0.001) {
        p.flash *= Math.pow(0.02, dt); // 快速衰减
        const f = p.flash;
        p.obj.traverse(o => {
          if (o.isMesh && o.material.emissive) {
            o.material.emissive.setRGB(0.13 * f, 0.83 * f, 0.93 * f);
            o.material.emissiveIntensity = f * 1.4;
          }
        });
      } else if (p.flash !== 0) {
        p.flash = 0;
        p.obj.traverse(o => {
          if (o.isMesh && o.material.emissive) { o.material.emissive.setRGB(0, 0, 0); o.material.emissiveIntensity = 0; }
        });
      }
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
