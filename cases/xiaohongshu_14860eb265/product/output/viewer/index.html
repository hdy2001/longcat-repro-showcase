<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬空寺 · WebGL 三维展示 | Hanging Temple 3D Viewer</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117;
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
    #container { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- left info panel ---------- */
    #panel {
        position: fixed; top: 16px; left: 16px; width: 288px; z-index: 10;
        background: rgba(13, 17, 23, 0.86); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.09); border-radius: 14px;
        color: #e6edf3; padding: 18px 18px 14px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        max-height: calc(100vh - 32px); overflow-y: auto;
        transition: transform .35s ease;
    }
    #panel.hidden { transform: translateX(-320px); }
    #panel h1 { font-size: 19px; font-weight: 700; letter-spacing: 1px;
        background: linear-gradient(90deg, #f0c060, #e88f3a);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
    #panel .sub { font-size: 11px; color: #8b949e; margin: 3px 0 14px; letter-spacing: .5px; }
    .sec-title { font-size: 11px; color: #f0c060; letter-spacing: 2px; margin: 14px 0 7px;
        text-transform: uppercase; border-bottom: 1px solid rgba(240,192,96,.2); padding-bottom: 4px; }
    table.stats { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.stats td { padding: 4.5px 2px; }
    table.stats td:first-child { color: #8b949e; }
    table.stats td:last-child { text-align: right; font-family: "SF Mono", Consolas, monospace;
        color: #7ee3a8; font-weight: 600; }
    .bar { height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; margin: 8px 0 2px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#2ea043,#7ee3a8); width: 0%;
        transition: width .8s ease; }

    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .btns button {
        background: rgba(255,255,255,.06); color: #e6edf3; border: 1px solid rgba(255,255,255,.12);
        border-radius: 8px; padding: 8px 4px; font-size: 12.5px; cursor: pointer;
        transition: all .18s ease; font-family: inherit;
    }
    .btns button:hover { background: rgba(240,192,96,.18); border-color: rgba(240,192,96,.5); color: #f0c060; }
    .btns button.active { background: rgba(240,192,96,.25); border-color: #f0c060; color: #f0c060;
        box-shadow: 0 0 12px rgba(240,192,96,.25); }

    .toggles { display: flex; flex-direction: column; gap: 7px; }
    .tg { display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer;
        padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.07); transition: all .15s; user-select: none; }
    .tg:hover { background: rgba(255,255,255,.09); }
    .tg .sw { width: 32px; height: 17px; border-radius: 9px; background: rgba(255,255,255,.15);
        position: relative; transition: background .2s; flex-shrink: 0; }
    .tg .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
        border-radius: 50%; background: #fff; transition: transform .2s; }
    .tg.on .sw { background: #d4933a; }
    .tg.on .sw::after { transform: translateX(15px); }
    .tg .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    #panelToggle {
        position: fixed; top: 16px; left: 16px; z-index: 11; width: 36px; height: 36px;
        border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(13,17,23,.85);
        color: #f0c060; font-size: 17px; cursor: pointer; display: none;
        align-items: center; justify-content: center; backdrop-filter: blur(8px);
    }
    #panelToggle.show { display: flex; }

    /* ---------- loading ---------- */
    #loading {
        position: fixed; inset: 0; z-index: 100; background: #0d1117;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #e6edf3; transition: opacity .6s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .ring { width: 52px; height: 52px; border-radius: 50%;
        border: 3px solid rgba(240,192,96,.15); border-top-color: #f0c060;
        animation: spin 1s linear infinite; }
    #loading p { margin-top: 18px; font-size: 13px; color: #8b949e; letter-spacing: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hud {
        position: fixed; right: 16px; bottom: 14px; z-index: 10; color: rgba(230,237,243,.55);
        font-size: 11px; text-align: right; letter-spacing: .5px; line-height: 1.7;
        text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none;
    }
    #fps { position: fixed; right: 16px; top: 16px; z-index: 10; color: #7ee3a8;
        font-family: "SF Mono", Consolas, monospace; font-size: 12px;
        background: rgba(13,17,23,.7); padding: 5px 10px; border-radius: 7px;
        border: 1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>
<div id="container"></div>

<div id="loading">
    <div class="ring"></div>
    <p>正在加载悬空寺三维模型 …</p>
</div>

<button id="panelToggle" title="信息面板">☰</button>

<div id="panel">
    <h1>悬空寺</h1>
    <div class="sub">恒山悬空寺 · 三维数字模型 · 北魏始建(公元491年)</div>

    <div class="sec-title">模型统计 / Statistics</div>
    <table class="stats">
        <tr><td>三角面数</td><td id="stTris">—</td></tr>
        <tr><td>网格对象</td><td id="stMesh">—</td></tr>
        <tr><td>材质</td><td id="stMat">—</td></tr>
        <tr><td>纹理贴图</td><td id="stTex">—</td></tr>
        <tr><td>灯光</td><td id="stLight">—</td></tr>
    </table>
    <div class="bar"><i id="loadBar"></i></div>
    <div style="font-size:10.5px;color:#8b949e;margin-top:3px" id="loadPct">几何体加载中…</div>

    <div class="sec-title">预设视角 / Camera</div>
    <div class="btns">
        <button data-view="overview" class="active">总 览</button>
        <button data-view="front">正立面</button>
        <button data-view="side">侧 向</button>
        <button data-view="top">俯 视</button>
    </div>

    <div class="sec-title">图层开关 / Layers</div>
    <div class="toggles">
        <div class="tg on" id="tgTerrain"><span class="sw"></span><span class="dot" style="background:#a08c7a"></span>地形 / 悬崖</div>
        <div class="tg on" id="tgBuilding"><span class="sw"></span><span class="dot" style="background:#d4553a"></span>建筑主体</div>
        <div class="tg on" id="tgStructure"><span class="sw"></span><span class="dot" style="background:#8a6f4d"></span>栈道 / 悬挑结构</div>
        <div class="tg on" id="tgProps"><span class="sw"></span><span class="dot" style="background:#c9a44a"></span>香炉 / 灯笼</div>
    </div>

    <div class="sec-title">视图选项 / Options</div>
    <div class="toggles">
        <div class="tg on" id="tgRotate"><span class="sw"></span>自动旋转</div>
        <div class="tg" id="tgWire"><span class="sw"></span>线框模式</div>
    </div>
</div>

<div id="fps">— fps</div>
<div id="hud">拖拽旋转 · 滚轮缩放 · 右键平移<br>悬空寺 · Hanging Temple of Hengshan</div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="data.js"></script>
<script>
(function () {
    'use strict';

    /* ---------------- renderer / scene ---------------- */
    const container = document.getElementById('container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a6c4);
    scene.fog = new THREE.Fog(0x87a6c4, 140, 320);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 600);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.52;
    controls.minDistance = 4;
    controls.maxDistance = 220;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;

    /* ---------------- lights ---------------- */
    const hemi = new THREE.HemisphereLight(0xbfd4e6, 0x5c4f3d, 0.85);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff1d6, 1.9);
    sun.position.set(48, 62, 55);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
    sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
    sun.shadow.camera.far = 220;
    sun.shadow.bias = -0.0006;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xcfe0f0, 0.35);
    fill.position.set(-40, 30, 20);
    scene.add(fill);

    /* ---------------- camera presets ---------------- */
    const VIEWS = {
        overview: { pos: [38, 44, 33], tgt: [-3, -2, 19] },
        front:    { pos: [1, 56, 21],   tgt: [-2, -2, 19.5] },
        side:     { pos: [58, 5, 19],   tgt: [-2, -2, 19] },
        top:      { pos: [-2, 10, 82],  tgt: [-2, 12, 0] }
    };
    camera.position.set(...VIEWS.overview.pos);
    controls.target.set(...VIEWS.overview.tgt);

    /* camera tween */
    let camTween = null;
    function flyTo(view) {
        camTween = {
            t: 0, dur: 1.4,
            p0: camera.position.clone(), p1: new THREE.Vector3(...view.pos),
            t0: controls.target.clone(), t1: new THREE.Vector3(...view.tgt)
        };
    }
    document.querySelectorAll('.btns button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.btns button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            flyTo(VIEWS[btn.dataset.view]);
        });
    });

    /* ---------------- load model ---------------- */
    const state = {
        groups: { terrain: null, building: null, structure: null, props: null },
        stats: { tris: 0, meshes: 0, mats: new Set(), texs: new Set(), lights: 0 },
        loaded: false
    };

    function b64ToArrayBuffer(b64) {
        const bin = atob(b64.split(',')[1]);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }

    function classify(obj) {
        const n = obj.name;
        if (/悬崖|岩台|地面|红墙/.test(n)) return 'terrain';
        if (/殿|楼|桥/.test(n) && !/|栈道|梁|柱|梯|栏杆/.test(n)) return 'building';
        if (/栈道|悬挑|吊柱|楼梯|长线桥|引桥|栏杆|灯笼灯/.test(n)) return 'structure';
        if (/香炉|灯笼|烟/.test(n)) return 'props';
        // fallback by material-ish name
        return 'building';
    }

    function countStats(root) {
        let tris = 0, meshes = 0;
        root.traverse(o => {
            if (o.isMesh) {
                meshes++;
                const g = o.geometry;
                if (g.index) tris += g.index.count / 3;
                else if (g.attributes.position) tris += g.attributes.position.count / 3;
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                mats.forEach(m => {
                    if (!m) return;
                    state.stats.mats.add(m.name || m.uuid);
                    ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap',
                     'emissiveMap', 'bumpMap', 'specularMap'].forEach(k => {
                        const t = m[k];
                        if (t && t.image) state.stats.texs.add(t.image.name || t.uuid);
                    });
                });
            }
            if (o.isLight) state.stats.lights++;
        });
        return { tris: Math.round(tris), meshes };
    }

    const manager = new THREE.LoadingManager();
    manager.onProgress = (url, loaded, total) => {
        const pct = total ? Math.round(loaded / total * 100) : 100;
        document.getElementById('loadBar').style.width = pct + '%';
        document.getElementById('loadPct').textContent = '资源加载中 ' + pct + '%';
    };

    const loader = new THREE.GLTFLoader(manager);
    const dataUri = window.GLB_DATA_URI || '';

    loader.parse(b64ToArrayBuffer(dataUri), '', gltf => {
        const model = gltf.scene;
        model.traverse(o => {
            if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
                if (o.material && o.material.side !== undefined) {
                    o.material.side = THREE.DoubleSide;
                }
            }
        });
        scene.add(model);

        // classify into layer groups
        model.children.slice().forEach(child => {
            const g = classify(child.name);
            if (!state.groups[g]) state.groups[g] = new THREE.Group();
            state.groups[g].add(child);
        });
        Object.values(state.groups).forEach(g => { if (g) scene.add(g); });

        const s = countStats(model);
        state.stats.tris = s.tris;
        state.stats.meshes = s.meshes;
        state.loaded = true;

        document.getElementById('stTris').textContent = s.tris.toLocaleString();
        document.getElementById('stMesh').textContent = s.meshes.toLocaleString();
        document.getElementById('stMat').textContent = state.stats.mats.size + ' 种';
        document.getElementById('stTex').textContent = state.stats.texs.size + ' 张';
        document.getElementById('stLight').textContent = state.stats.lights + ' 盏(模型外 3 盏)';
        document.getElementById('loadPct').textContent = '加载完成';
        document.getElementById('loadBar').style.width = '100%';
        setTimeout(() => document.getElementById('loading').classList.add('done'), 350);

        // auto switch to overview framing already set; frame model
        controls.update();
    }, err => {
        document.getElementById('loadPct').textContent = '模型加载失败: ' + (err && err.message ? err.message : '未知错误');
        console.error(err);
    });

    /* ---------------- toggles ---------------- */
    function bindToggle(id, groupName, extra) {
        const el = document.getElementById(id);
        el.addEventListener('click', () => {
            el.classList.toggle('on');
            const g = state.groups[groupName];
            if (g) g.visible = el.classList.contains('on');
            if (extra) extra(el.classList.contains('on'));
        });
    }
    bindToggle('tgTerrain', 'terrain');
    bindToggle('tgBuilding', 'building');
    bindToggle('tgStructure', 'structure');
    bindToggle('tgProps', 'props');
    bindToggle('tgRotate', null, on => { controls.autoRotate = on; });
    bindToggle('tgWire', null, on => {
        scene.traverse(o => {
            if (o.isMesh && o.material) {
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                mats.forEach(m => { m.wireframe = on; });
            }
        });
    });

    document.getElementById('panelToggle').addEventListener('click', () => {
        document.getElementById('panel').classList.remove('hidden');
        document.getElementById('panelToggle').classList.remove('show');
    });
    // double-click panel header collapses
    document.getElementById('panel').addEventListener('dblclick', e => {
        if (e.target.closest('.sec-title') || e.target.closest('h1')) {
            document.getElementById('panel').classList.add('hidden');
            document.getElementById('panelToggle').classList.add('show');
        }
    });

    /* ---------------- resize / loop ---------------- */
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let frames = 0, fpsT = 0;
    const fpsEl = document.getElementById('fps');

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        if (camTween) {
            camTween.t += dt / camTween.dur;
            const k = camTween.t >= 1 ? 1 : (1 - Math.pow(1 - camTween.t, 3));
            camera.position.lerpVectors(camTween.p0, camTween.p1, k);
            controls.target.lerpVectors(camTween.t0, camTween.t1, k);
            if (camTween.t >= 1) camTween = null;
        }
        controls.update();
        renderer.render(scene, camera);
        frames++; fpsT += dt;
        if (fpsT >= 0.5) {
            fpsEl.textContent = Math.round(frames / fpsT) + ' fps';
            frames = 0; fpsT = 0;
        }
    }
    animate();
})();
</script>
</body>
</html>
