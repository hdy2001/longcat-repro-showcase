<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙漠风暴 DESERT STRIKE — 团队死亡竞赛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
  body { font-family: "Arial Narrow", "Microsoft YaHei", Arial, sans-serif; user-select: none; }
  canvas.game { display: block; }

  /* ---------- HUD 通用面板 ---------- */
  .panel {
    background: rgba(8, 12, 16, 0.62);
    border: 1px solid rgba(255, 200, 87, 0.35);
    border-radius: 6px;
    box-shadow: 0 0 12px rgba(0,0,0,0.45), inset 0 0 18px rgba(255,180,60,0.05);
    backdrop-filter: blur(2px);
  }
  .hud { position: fixed; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .5s; }
  .hud.show { opacity: 1; }

  /* ---------- 小地图 ---------- */
  #minimap-wrap { top: 14px; left: 14px; padding: 6px; }
  #minimap { display: block; width: 224px; height: 184px; border-radius: 3px; }
  #minimap-label {
    position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 3px; color: #ffc857; opacity: .85;
    text-shadow: 0 1px 2px #000; white-space: nowrap;
  }

  /* ---------- 比分 ---------- */
  #score {
    top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 22px; font-size: 22px; font-weight: bold; letter-spacing: 1px;
    display: flex; gap: 12px; align-items: baseline; font-family: Impact, "Arial Black", monospace;
  }
  #score .sb { color: #5eb2ff; } #score .sr { color: #ff6a55; } #score .ss { color: #ffd98a; }
  #score-hint {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255, 220, 150, 0.75); letter-spacing: 2px; z-index: 20;
    text-shadow: 0 1px 2px #000; pointer-events: none; opacity: 0; transition: opacity .5s;
  }
  #score-hint.show { opacity: 1; }

  /* ---------- 击杀播报 ---------- */
  #killfeed { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .kf {
    background: rgba(8, 12, 16, 0.66); border: 1px solid rgba(255,255,255,0.12);
    padding: 3px 10px; font-size: 13px; border-radius: 4px; color: #ddd;
    animation: kfin .18s ease-out;
  }
  .kf .kb { color: #5eb2ff; font-weight: bold; } .kf .kr { color: #ff6a55; font-weight: bold; } .kf .kn { color: #aaa; }
  @keyframes kfin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- 血量 ---------- */
  #hp-wrap { left: 16px; bottom: 16px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-width: 210px; }
  #hp-icon { font-size: 20px; filter: drop-shadow(0 0 4px rgba(255,90,60,.8)); }
  #hp-body { flex: 1; }
  #hp-num { font-size: 30px; font-weight: bold; color: #ffe9b8; font-family: Impact, "Arial Black", monospace; line-height: 1; text-shadow: 0 0 8px rgba(255,180,60,.35); }
  #hp-bar-bg { margin-top: 5px; height: 8px; background: rgba(0,0,0,.55); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
  #hp-bar { height: 100%; width: 100%; border-radius: 4px; transition: width .18s; }

  /* ---------- 弹药 ---------- */
  #ammo-wrap { right: 16px; bottom: 16px; padding: 8px 18px; text-align: right; }
  #ammo-line { font-family: Impact, "Arial Black", monospace; line-height: 1; }
  #ammo-mag { font-size: 42px; color: #ffe9b8; text-shadow: 0 0 10px rgba(255,180,60,.3); }
  #ammo-mag.low { color: #ff7a5e; animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
  #ammo-reserve { font-size: 19px; color: rgba(255,233,184,.6); margin-left: 6px; }
  #ammo-name { margin-top: 4px; font-size: 11px; letter-spacing: 2px; color: #ffc857; }
  #reload-tip { font-size: 12px; color: #ff9a7a; height: 14px; margin-top: 2px; letter-spacing: 1px; }

  /* ---------- 准星 ---------- */
  #crosshair { top: 50%; left: 50%; width: 0; height: 0; --gap: 10px; }
  #crosshair .c { position: absolute; background: rgba(255, 245, 220, 0.92); box-shadow: 0 0 3px #000; }
  #crosshair .t { width: 2px; height: 8px; left: -1px; top: calc(-8px - var(--gap)); }
  #crosshair .b { width: 2px; height: 8px; left: -1px; top: var(--gap); }
  #crosshair .l { width: 8px; height: 2px; top: -1px; left: calc(-8px - var(--gap)); }
  #crosshair .r { width: 8px; height: 2px; top: -1px; left: var(--gap); }
  #crosshair .dot { width: 2px; height: 2px; left: -1px; top: -1px; border-radius: 50%; }
  #hitmark { top: 50%; left: 50%; opacity: 0; transition: opacity .1s; --gap: 14px; }
  #hitmark .h { position: absolute; width: 2px; height: 9px; background: #fff; box-shadow: 0 0 4px #000; }
  #hitmark .h1 { transform: rotate(45deg); left: -8px; top: calc(-9px - var(--gap)); }
  #hitmark .h2 { transform: rotate(-45deg); left: 6px; top: calc(-9px - var(--gap)); }
  #hitmark .h3 { transform: rotate(-45deg); left: -8px; top: var(--gap); }
  #hitmark .h4 { transform: rotate(45deg); left: 6px; top: var(--gap); }
  #hitmark.kill .h { background: #ff4a3a; box-shadow: 0 0 6px rgba(255,60,40,.9); }

  /* ---------- 受击红晕 ---------- */
  #vignette {
    inset: 0; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(200, 10, 0, 0.55) 100%);
  }
  #lowhp {
    inset: 0; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(180, 0, 0, 0.4) 100%);
    animation: lowpulse 1.1s infinite;
  }
  @keyframes lowpulse { 0%,100% { opacity: .12; } 50% { opacity: .34; } }

  /* ---------- 中央消息 ---------- */
  #msg {
    top: 24%; left: 50%; transform: translateX(-50%);
    font-size: 26px; font-weight: bold; color: #ffd98a; letter-spacing: 4px;
    text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .3s; text-align: center;
  }

  /* ---------- 全屏覆盖层 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  #menu { background: linear-gradient(160deg, rgba(6,14,28,0.88), rgba(10,20,14,0.82) 60%, rgba(24,16,8,0.85)); }
  #pause, #death, #victory { background: rgba(4, 8, 12, 0.78); }
  .title {
    font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
    font-size: 84px; letter-spacing: 14px; color: #ffe9b8;
    text-shadow: 0 0 24px rgba(255, 170, 50, .45), 0 4px 0 #6b4a1a, 0 8px 22px #000;
  }
  .title-en { font-size: 20px; letter-spacing: 12px; color: #ffc857; margin-top: 2px; }
  .subtitle { margin-top: 14px; font-size: 15px; color: rgba(255, 235, 200, 0.85); letter-spacing: 3px; }
  .desc {
    margin-top: 26px; font-size: 14px; line-height: 1.9; color: rgba(255, 240, 214, 0.78);
    background: rgba(255, 220, 140, 0.06); border: 1px solid rgba(255, 200, 87, 0.25);
    padding: 14px 30px; border-radius: 8px; letter-spacing: 1px;
  }
  .controls {
    margin-top: 20px; display: grid; grid-template-columns: auto auto; gap: 5px 18px;
    font-size: 13px; color: rgba(255, 230, 190, 0.75); text-align: left;
  }
  .controls b { color: #ffd98a; font-family: monospace; font-weight: normal; }
  .bigbtn {
    margin-top: 30px; padding: 14px 66px; font-size: 24px; letter-spacing: 8px; font-weight: bold;
    color: #2a1c05; background: linear-gradient(180deg, #ffd98a, #e8a020);
    border: none; border-radius: 6px; cursor: pointer; font-family: inherit;
    box-shadow: 0 0 22px rgba(255, 180, 60, 0.35), 0 4px 0 #8a5f10;
    transition: transform .12s, box-shadow .12s;
  }
  .bigbtn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 34px rgba(255, 190, 80, 0.55), 0 6px 0 #8a5f10; }
  .bigbtn:active { transform: translateY(1px); box-shadow: 0 0 14px rgba(255,180,60,.3), 0 2px 0 #8a5f10; }
  .smallbtn {
    margin-top: 14px; padding: 8px 30px; font-size: 14px; letter-spacing: 3px; color: #ffe9b8;
    background: rgba(255, 200, 87, 0.12); border: 1px solid rgba(255, 200, 87, 0.4);
    border-radius: 5px; cursor: pointer; font-family: inherit; transition: background .15s;
  }
  .smallbtn:hover { background: rgba(255, 200, 87, 0.25); }
  .foot { position: absolute; bottom: 18px; font-size: 11px; color: rgba(255, 230, 190, 0.4); letter-spacing: 2px; }
  .ov-title { font-size: 54px; letter-spacing: 12px; font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif; color: #ffe9b8; text-shadow: 0 0 18px rgba(255,170,50,.4), 0 4px 12px #000; }
  #death .ov-title { color: #ff6a55; text-shadow: 0 0 22px rgba(255,60,30,.5), 0 4px 12px #000; }
  #death-info { margin-top: 14px; font-size: 17px; color: #ffb0a0; letter-spacing: 3px; }
  #victory-info { margin-top: 16px; font-size: 30px; letter-spacing: 4px; color: #ffe9b8; }
  #victory-info .win { color: #6fe38a; text-shadow: 0 0 16px rgba(90,255,140,.5); }
  #victory-info .lose { color: #ff6a55; text-shadow: 0 0 16px rgba(255,90,60,.5); }
</style>
</head>
<body>
  <!-- 3D 画布由 JS 注入 -->

  <!-- HUD -->
  <div id="hud-root">
    <div id="minimap-wrap" class="hud panel">
      <div id="minimap-label">战术地图</div>
      <canvas id="minimap" width="224" height="184"></canvas>
    </div>
    <div id="score" class="hud panel"><span class="sb">蓝队 0</span><span class="ss">:</span><span class="sr">0 红队</span></div>
    <div id="score-hint">团队死亡竞赛 · 先获 25 分获胜</div>
    <div id="killfeed" class="hud"></div>
    <div id="hp-wrap" class="hud panel">
      <div id="hp-icon">✚</div>
      <div id="hp-body">
        <div id="hp-num">100</div>
        <div id="hp-bar-bg"><div id="hp-bar"></div></div>
      </div>
    </div>
    <div id="ammo-wrap" class="hud panel">
      <div id="ammo-line"><span id="ammo-mag">30</span><span id="ammo-reserve">/ 120</span></div>
      <div id="ammo-name">MK-4 突击步枪 · 全自动</div>
      <div id="reload-tip"></div>
    </div>
    <div id="crosshair" class="hud">
      <div class="c t"></div><div class="c b"></div><div class="c l"></div><div class="c r"></div><div class="c dot"></div>
    </div>
    <div id="hitmark" class="hud">
      <div class="h h1"></div><div class="h h2"></div><div class="h h3"></div><div class="h h4"></div>
    </div>
    <div id="vignette" class="hud"></div>
    <div id="lowhp" class="hud"></div>
    <div id="msg" class="hud"></div>
  </div>

  <!-- 开始菜单 -->
  <div id="menu" class="overlay show">
    <div class="title">沙漠风暴</div>
    <div class="title-en">DESERT STRIKE</div>
    <div class="subtitle">— 团队死亡竞赛 · 黄沙堡垒 —</div>
    <div class="desc">
      原创沙漠军事基地「黄沙堡垒」: A 区与 B 区遥相呼应, 中路隧道、双侧长廊、短道纵横交错。<br>
      率领你的三人小队, 在烈日下与红方四人展开对攻 —— 先取 25 分者胜。
    </div>
    <div class="controls">
      <span><b>W A S D</b></span><span>移动</span>
      <span><b>鼠标</b></span><span>视角 / 左键射击</span>
      <span><b>R</b></span><span>更换弹匣</span>
      <span><b>空格</b></span><span>跳跃</span>
      <span><b>Esc</b></span><span>暂停</span>
    </div>
    <button id="btn-start" class="bigbtn">开始行动</button>
    <div class="foot">单文件构建 · THREE.JS + RAPIER 物理 已内联 · 无需联网</div>
  </div>

  <!-- 暂停 -->
  <div id="pause" class="overlay">
    <div class="ov-title">已暂停</div>
    <button id="btn-resume" class="bigbtn">继续战斗</button>
    <button id="btn-restart1" class="smallbtn">重新开始</button>
  </div>

  <!-- 阵亡 -->
  <div id="death" class="overlay">
    <div class="ov-title">阵 亡</div>
    <div id="death-info"></div>
  </div>

  <!-- 终局 -->
  <div id="victory" class="overlay">
    <div class="ov-title">比赛结束</div>
    <div id="victory-info"></div>
    <button id="btn-restart2" class="bigbtn">再来一局</button>
  </div>

<!--@THREE-->
<!--@RAPIER-->
<!--@GAME-->
</body>
</html>
