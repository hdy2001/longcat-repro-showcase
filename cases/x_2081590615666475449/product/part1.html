<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉卜力山谷 · Ghibli Valley</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#2b2333}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;font-family:Georgia,'Songti SC','STSong','SimSun',serif;z-index:5}
  .panel{position:absolute;background:rgba(38,28,20,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,226,180,.28);border-radius:14px;color:#ffe9c9;padding:10px 16px;
    font-size:14px;letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.45);box-shadow:0 4px 18px rgba(20,10,0,.18)}
  #windPanel{top:18px;left:18px;min-width:180px;line-height:1.7}
  #windPanel b{color:#ffd27a;font-weight:normal}
  #windArrow{display:inline-block;color:#ffd27a;transition:transform .35s;font-size:15px}
  .bar{height:5px;background:rgba(255,226,180,.18);border-radius:3px;margin-top:5px;overflow:hidden}
  #gustBar{height:100%;width:0%;background:linear-gradient(90deg,#ffd27a,#ff9d5c);border-radius:3px;transition:width .3s}
  #trainPanel{top:18px;right:18px;text-align:right;line-height:1.7}
  #trainPanel b{color:#ffd27a;font-weight:normal}
  #trainState{opacity:.75;font-size:12px;margin-left:6px}
  #modePanel{bottom:18px;left:18px;font-size:13px;letter-spacing:.15em}
  #hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,233,201,.85);
    font-size:12.5px;letter-spacing:.1em;text-shadow:0 1px 4px rgba(0,0,0,.5);background:rgba(38,28,20,.28);
    padding:8px 18px;border-radius:20px;border:1px solid rgba(255,226,180,.18);white-space:nowrap}
  #crosshair{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:rgba(255,240,214,.9);box-shadow:0 0 6px rgba(255,220,170,.8);display:none}
  #title{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,233,201,.75);
    font-size:15px;letter-spacing:.4em;text-shadow:0 1px 6px rgba(0,0,0,.5);white-space:nowrap}
  #overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(64,44,54,.88), rgba(24,18,28,.96));backdrop-filter:blur(4px);
    cursor:pointer;transition:opacity .6s;font-family:Georgia,'Songti SC','SimSun',serif;color:#ffe9c9;text-align:center}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:46px;letter-spacing:.3em;font-weight:normal;text-shadow:0 2px 20px rgba(255,180,100,.35);margin-bottom:12px;padding-left:.3em}
  #overlay .sub{opacity:.75;margin:5px 0;font-size:14px;letter-spacing:.2em}
  #overlay .enter{margin-top:36px;font-size:17px;letter-spacing:.35em;padding:14px 44px;border:1px solid rgba(255,226,180,.45);
    border-radius:40px;animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,130,.22)}50%{box-shadow:0 0 24px 4px rgba(255,200,130,.2)}}
  #overlay .keys{margin-top:30px;font-size:12px;line-height:2;opacity:.55;letter-spacing:.12em}
</style>
</head>
<body>
<div id="hud">
  <div id="title">吉卜力山谷 · 黄昏</div>
  <div class="panel" id="windPanel">
    🌬 <b id="windVal">--</b> m/s&ensp;<span id="windArrow">➤</span>&ensp;<span id="windDir">--</span><br>
    阵风 <b id="gustVal">--</b> m/s&ensp;峰值 <b id="gustPeak">--</b> m/s
    <div class="bar"><div id="gustBar"></div></div>
  </div>
  <div class="panel" id="trainPanel">
    🚂 蒸汽火车&ensp;<b id="trainSpeed">--</b> km/h&ensp;<span id="trainState">行驶中</span>
  </div>
  <div class="panel" id="modePanel">🚶 步行模式</div>
  <div id="crosshair"></div>
  <div id="hint">点击画面锁定鼠标 · WASD 移动 · Shift 加速 · 空格 跳跃 · F 飞行模式 · 飞行时 空格/C 升降 · Esc 释放鼠标</div>
</div>
<div id="overlay">
  <h1>吉卜力山谷</h1>
  <div class="sub">GHIBLI VALLEY · 黄 昏</div>
  <div class="enter" id="enterBtn">点 击 进 入 山 谷</div>
  <div class="keys">WASD 移动 · 鼠标 视角 · Shift 加速 · 空格 跳跃 · F 飞行 / 步行 · 飞行时 空格 / C 升降<br>Esc 释放鼠标 · 建议使用桌面版 Chrome / Edge / Safari</div>
</div>
<script>
