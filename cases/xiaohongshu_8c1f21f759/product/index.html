<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLM-5.3-Flash 上手体验 · 动画还原</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #141414;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 720x960 竖屏画布 ===== */
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 720px; height: 960px;
    background: #000;
    overflow: hidden;
    transform-origin: center center;
    box-shadow: 0 0 80px rgba(0,0,0,.8);
    cursor: pointer;
  }

  /* ===== 顶部 UI（小红书风格） ===== */
  .ui-top {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 26px 26px 0;
    z-index: 60;
    pointer-events: none;
  }
  .xhs-logo {
    background: #ff2442;
    color: #fff;
    font-weight: 700;
    font-size: 24px;
    line-height: 1;
    padding: 9px 16px 10px;
    border-radius: 999px;
    letter-spacing: 1px;
  }
  .user-chip {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 8px;
  }
  .user-chip .avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.92);
    object-fit: cover;
    background: #000;
  }
  .user-chip .name {
    color: #fff;
    font-size: 26px;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
  }

  /* ===== 底部字幕 ===== */
  .subtitle {
    position: absolute;
    left: 40px; right: 40px;
    bottom: 74px;
    text-align: center;
    color: #fff;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.45;
    letter-spacing: .5px;
    text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 2px 12px rgba(0,0,0,.8), 0 0 2px #000;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
    z-index: 70;
    pointer-events: none;
  }
  .subtitle.show { opacity: 1; transform: translateY(0); }

  /* ===== 进度条 ===== */
  .progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 5px;
    background: rgba(255,255,255,.12);
    z-index: 80;
  }
  .progress .bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff2442, #ff7a45);
  }

  /* ===== 控制按钮 ===== */
  .ctrl {
    position: absolute; right: 24px; bottom: 26px;
    display: flex; gap: 10px;
    z-index: 90;
  }
  .ctrl button {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background .2s, transform .15s;
  }
  .ctrl button:hover { background: rgba(0,0,0,.8); transform: scale(1.06); }

  /* ===== 场景层通用 ===== */
  .scene {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity .38s ease;
    z-index: 10;
    pointer-events: none;
  }
  .scene.active { opacity: 1; }
  .scene img.ph {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .scene img.ph.contain { object-fit: contain; background: #000; }

  /* Ken Burns：缓慢推近 / 平移（时长与段落一致） */
  @keyframes kbZoom {
    from { transform: scale(1.03) translate(0,0); }
    to   { transform: scale(1.13) translate(-1.5%, 1.5%); }
  }
  @keyframes kbZoomOut {
    from { transform: scale(1.12) translate(1%, -1%); }
    to   { transform: scale(1.02) translate(0,0); }
  }
  @keyframes kbPan {
    from { transform: scale(1.08) translateX(-2.2%); }
    to   { transform: scale(1.08) translateX(2.2%); }
  }
  .kb-zoom { animation: kbZoom 6.5s ease-in-out forwards; }
  .kb-zoom-out { animation: kbZoomOut 6.5s ease-in-out forwards; }
  .kb-pan { animation: kbPan 7s ease-in-out forwards; }

  /* ===== Glitch 标题 ===== */
  .title-scene { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
    pointer-events: none;
  }
  .z-big {
    position: relative;
    font-size: 330px;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    color: #fff;
    letter-spacing: -10px;
    text-shadow: 0 0 60px rgba(255,255,255,.35);
    animation: zFloat 2.6s ease-in-out infinite;
  }
  @keyframes zFloat {
    0%,100% { transform: translateY(0) skewX(-6deg); }
    50%     { transform: translateY(-14px) skewX(-6deg); }
  }
  .title-line {
    position: relative;
    margin-top: 42px;
    font-size: 62px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 2px;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0;
    width: 100%;
    overflow: hidden;
    mix-blend-mode: screen;
  }
  .glitch::before {
    color: #0ff;
    transform: translate(4px, 0);
    clip-path: inset(0 0 55% 0);
    animation: glitchA 1.1s infinite steps(2, end);
    opacity: .85;
  }
  .glitch::after {
    color: #ff2d78;
    transform: translate(-4px, 0);
    clip-path: inset(55% 0 0 0);
    animation: glitchB 1.4s infinite steps(2, end);
    opacity: .85;
  }
  @keyframes glitchA {
    0%   { clip-path: inset(12% 0 74% 0); transform: translate(-6px,2px); }
    25%  { clip-path: inset(58% 0 22% 0); transform: translate(5px,-2px); }
    50%  { clip-path: inset(28% 0 52% 0); transform: translate(-4px,1px); }
    75%  { clip-path: inset(70% 0 8% 0);  transform: translate(6px,-1px); }
    100% { clip-path: inset(8% 0 80% 0);  transform: translate(-5px,2px); }
  }
  @keyframes glitchB {
    0%   { clip-path: inset(64% 0 18% 0); transform: translate(5px,-2px); }
    25%  { clip-path: inset(16% 0 66% 0); transform: translate(-6px,1px); }
    50%  { clip-path: inset(48% 0 34% 0); transform: translate(4px,-1px); }
    75%  { clip-path: inset(6% 0 78% 0);  transform: translate(-5px,2px); }
    100% { clip-path: inset(56% 0 26% 0); transform: translate(6px,-2px); }
  }

  /* ===== 终端光标 ===== */
  .cursor-blink {
    position: absolute;
    width: 14px; height: 30px;
    background: #4ade80;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

  /* ===== 结尾关注卡 ===== */
  .follow-scene { display: flex; align-items: center; justify-content: center; }
  .follow-bg {
    position: absolute; inset: -40px;
    background: url("inputs/scene_05.jpg") center/cover no-repeat;
    filter: blur(14px) brightness(.35);
    transform: scale(1.1);
  }
  .follow-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    animation: cardIn .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.7) translateY(40px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .follow-avatar-wrap { position: relative; }
  .follow-avatar {
    width: 220px; height: 220px;
    border-radius: 50%;
    border: 6px solid #fff;
    object-fit: cover;
    background: #000;
    display: block;
  }
  .follow-check {
    position: absolute;
    right: 6px; bottom: 14px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: #fff;
    color: #ff2442;
    font-size: 34px;
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .follow-name {
    margin-top: 30px;
    font-size: 46px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,.7);
    letter-spacing: 2px;
  }
  .follow-btn {
    margin-top: 34px;
    padding: 16px 84px;
    font-size: 30px;
    font-weight: 700;
    color: #111;
    background: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    animation: btnPulse 1.8s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ===== 重播提示 ===== */
  .replay-hint {
    position: absolute;
    left: 50%; bottom: 110px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.85);
    font-size: 22px;
    background: rgba(0,0,0,.5);
    padding: 10px 22px;
    border-radius: 999px;
    z-index: 85;
    display: none;
    letter-spacing: 1px;
  }
  .replay-hint.show { display: block; animation: hintIn .4s ease both; }
  @keyframes hintIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 顶部 UI -->
  <div class="ui-top">
    <div class="xhs-logo">小红书</div>
    <div class="user-chip">
      <img class="avatar" src="assets/avatar.png" alt="Z派大鑫">
      <span class="name">Z派大鑫</span>
    </div>
  </div>

  <!-- 场景 1：Glitch 标题卡 -->
  <div class="scene title-scene" id="scTitle">
    <div class="scanlines"></div>
    <div class="z-big glitch" data-text="Z">Z</div>
    <div class="title-line glitch" data-text="GLM 5.3 Flash">GLM 5.3 Flash</div>
  </div>

  <!-- 场景 2：终端（分析视频） -->
  <div class="scene" id="scTerm">
    <img class="ph kb-zoom" id="imgTerm" src="inputs/scene_03.jpg" alt="Claude Code 终端">
    <div class="cursor-blink" style="left:60%; bottom:18%;"></div>
  </div>

  <!-- 场景 3：线框设计稿 -->
  <div class="scene" id="scWire">
    <img class="ph contain kb-pan" src="inputs/scene_02.jpg" alt="线框设计稿">
  </div>

  <!-- 场景 4：Stocks on Solana 标题 -->
  <div class="scene" id="scSolana">
    <img class="ph contain kb-zoom-out" src="inputs/scene_04.jpg" alt="Stocks on Solana">
  </div>

  <!-- 场景 5：Depth 图表（青） -->
  <div class="scene" id="scDepth">
    <img class="ph kb-zoom" src="inputs/scene_01.jpg" alt="Depth 数据图表">
  </div>

  <!-- 场景 6：One book 成品 -->
  <div class="scene" id="scOnebook">
    <img class="ph contain kb-zoom-out" src="inputs/scene_05.jpg" alt="One book 数据可视化">
  </div>

  <!-- 场景 7：关注卡 -->
  <div class="scene follow-scene" id="scFollow">
    <div class="follow-bg"></div>
    <div class="follow-card">
      <div class="follow-avatar-wrap">
        <img class="follow-avatar" src="assets/avatar.png" alt="Z派大鑫">
        <div class="follow-check">✓</div>
      </div>
      <div class="follow-name">Z派大鑫</div>
      <button class="follow-btn" id="followBtn">关注</button>
    </div>
  </div>

  <!-- 字幕 -->
  <div class="subtitle" id="subtitle"></div>

  <!-- 重播提示 -->
  <div class="replay-hint" id="replayHint">点击画面 重新播放</div>

  <!-- 控制 -->
  <div class="ctrl">
    <button id="replayBtn" title="重播">↻</button>
  </div>

  <!-- 进度条 -->
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

<script>
(function () {
  "use strict";

  /* ===== 时间线：还原原视频节奏（总时长 46s） ===== */
  var TL = [
    { start: 0.0,  end: 4.0,  scene: null,       sub: "Z派大鑫段时间在海外刷屏的Ox-Alpha模型" },
    { start: 4.0,  end: 8.0,  scene: null,       sub: "昨晚终于揭晓了" },
    { start: 8.0,  end: 12.5, scene: "scTitle",  sub: "他就是GLM-5.3-Flash" },
    { start: 12.5, end: 18.5, scene: "scTerm",   sub: "分析这个视频，生成一个类似的动画" },
    { start: 18.5, end: 24.5, scene: "scWire",   sub: "从开场动画、数据模块到页面交互" },
    { start: 24.5, end: 28.5, scene: "scSolana", sub: "最后生成这个效果" },
    { start: 28.5, end: 34.5, scene: "scDepth",  sub: "最离谱的是 能力对标Opus 4.8" },
    { start: 34.5, end: 40.5, scene: "scOnebook",sub: "价格却大约只有它的四十分之一" },
    { start: 40.5, end: 46.0, scene: "scFollow", sub: "这个模型确实值得试一下" }
  ];
  var TOTAL = 46;

  var stage = document.getElementById("stage");
  var subEl = document.getElementById("subtitle");
  var bar = document.getElementById("bar");
  var replayBtn = document.getElementById("replayBtn");
  var replayHint = document.getElementById("replayHint");
  var followBtn = document.getElementById("followBtn");

  var curSeg = -1;
  var curSub = "";
  var startTs = null;
  var accPause = 0;
  var frozenT = null;   // 暂停时的时间
  var ended = false;

  function segAt(t) {
    for (var i = TL.length - 1; i >= 0; i--) {
      if (t >= TL[i].start) return i;
    }
    return 0;
  }

  function setScene(id) {
    var scenes = document.querySelectorAll(".scene");
    for (var i = 0; i < scenes.length; i++) scenes[i].classList.remove("active");
    if (id) {
      var el = document.getElementById(id);
      if (el) {
        el.classList.remove("active");
        // 重启动画（Ken Burns / 关注卡）
        void el.offsetWidth;
        el.classList.add("active");
      }
    }
  }

  function setSub(text) {
    if (text === curSub) return;
    curSub = text;
    if (!text) { subEl.classList.remove("show"); return; }
    subEl.classList.remove("show");
    setTimeout(function () {
      subEl.textContent = text;
      subEl.classList.add("show");
    }, 200);
  }

  function applySeg(i) {
    curSeg = i;
    var seg = TL[i];
    setScene(seg.scene);
    setSub(seg.sub);
  }

  function tick(now) {
    if (startTs === null) startTs = now;
    var t = frozenT !== null ? frozenT : (now - startTs - accPause) / 1000;

    if (t >= TOTAL) {
      t = TOTAL;
      bar.style.width = "100%";
      ended = true;
      replayHint.classList.add("show");
      return; // 停止循环，停留在最后一帧
    }
    var i = segAt(t);
    if (i !== curSeg) applySeg(i);
    bar.style.width = (t / TOTAL * 100) + "%";
    requestAnimationFrame(tick);
  }

  function play() {
    if (ended) restart();
    if (frozenT !== null) {
      startTs = performance.now() - (frozenT * 1000 + accPause);
      frozenT = null;
      replayHint.classList.remove("show");
      requestAnimationFrame(tick);
    }
  }

  function pause() {
    if (ended || frozenT !== null) return;
    // 用最近一次 rAF 的时间近似
    frozenT = (performance.now() - startTs - accPause) / 1000;
  }

  function restart() {
    curSeg = -1;
    curSub = "";
    frozenT = null;
    ended = false;
    accPause = 0;
    startTs = performance.now();
    subEl.classList.remove("show");
    replayHint.classList.remove("show");
    requestAnimationFrame(tick);
  }

  /* ===== 画布自适应缩放 ===== */
  function fit() {
    var s = Math.min(window.innerWidth / 720, window.innerHeight / 960) * 0.98;
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ===== 交互 ===== */
  stage.addEventListener("click", function () {
    if (frozenT !== null) play(); else pause();
  });
  replayBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    restart();
  });
  followBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var b = followBtn;
    if (b.textContent === "关注") {
      b.textContent = "已关注";
      b.style.background = "#ff2442";
      b.style.color = "#fff";
      b.style.animation = "none";
    } else {
      b.textContent = "关注";
      b.style.background = "#fff";
      b.style.color = "#111";
      b.style.animation = "";
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      if (frozenT !== null) play(); else pause();
    }
  });

  /* ===== 启动 ===== */
  startTs = performance.now();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
