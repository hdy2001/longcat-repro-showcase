<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Stocks on Solana — DEPTH</title>
<style>
  :root {
    --bg: #05070c;
    --text: #e9eef6;
    --muted: #7d8798;
    --line: rgba(255, 255, 255, 0.08);
    --teal: #38e0a4;
    --pink: #ff5d7e;
    --live: #ff4d8d;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", "Inter", -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100%;
    display: flex;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 背景层 ================= */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(640px 420px at 16% 112%, rgba(56, 224, 164, 0.12), transparent 62%),
      radial-gradient(640px 420px at 84% 112%, rgba(255, 93, 126, 0.12), transparent 62%),
      radial-gradient(1000px 640px at 50% -24%, rgba(72, 92, 145, 0.14), transparent 66%);
  }
  .bg::before { /* 网格 */
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.024) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.024) 0 1px, transparent 1px 56px);
    -webkit-mask-image: radial-gradient(72% 72% at 50% 44%, #000 26%, transparent 100%);
    mask-image: radial-gradient(72% 72% at 50% 44%, #000 26%, transparent 100%);
  }
  .bg::after { /* 书脊竖纹(呼应视频背景里的书架) */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0 2px, transparent 2px 96px);
    -webkit-mask-image: linear-gradient(180deg, transparent 26%, #000 58%, transparent 96%);
    mask-image: linear-gradient(180deg, transparent 26%, #000 58%, transparent 96%);
  }

  .stage { position: relative; z-index: 2; margin: auto; display: flex; flex-direction: column;
    align-items: center; gap: 56px; padding: 48px 20px; }

  /* ================= 标题:模糊 → 清晰 ================= */
  .title {
    font-size: clamp(30px, 5.4vw, 58px);
    font-weight: 500;
    letter-spacing: 0.1em;
    white-space: nowrap;
    opacity: 0;
    filter: blur(22px) brightness(1.8);
    transform: scale(1.06);
    animation: title-in 1.7s var(--ease) 2.75s both;
  }
  .title .brace { opacity: 0.45; font-weight: 300; }
  @keyframes title-in {
    0%   { opacity: 0; filter: blur(22px) brightness(1.8); transform: scale(1.06); letter-spacing: 0.1em;
           text-shadow: 0 0 46px rgba(56,224,164,0), 0 0 46px rgba(255,93,126,0); }
    100% { opacity: 1; filter: blur(0) brightness(1);    transform: scale(1);    letter-spacing: 0.04em;
           text-shadow: 0 0 42px rgba(255,255,255,0.16); }
  }

  /* ================= DEPTH 模块 ================= */
  .module {
    width: min(700px, 94vw);
    position: relative;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(16, 21, 30, 0.86), rgba(10, 13, 19, 0.92));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    padding: 22px 26px 18px;
    opacity: 0;
    transform: translateY(26px) scale(0.97);
    animation: module-in 1.05s var(--ease) 4.55s both;
  }
  @keyframes module-in { to { opacity: 1; transform: translateY(0) scale(1); } }

  /* 模块四角取景框 */
  .mod-corner { position: absolute; width: 13px; height: 13px; border: 1.5px solid rgba(255,255,255,0.3);
    opacity: 0; animation: fade-in 0.5s ease both; }
  .mod-corner.tl { top: -7px; left: -7px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; animation-delay: 4.9s; }
  .mod-corner.tr { top: -7px; right: -7px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; animation-delay: 5.0s; }
  .mod-corner.bl { bottom: -7px; left: -7px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; animation-delay: 5.1s; }
  .mod-corner.br { bottom: -7px; right: -7px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; animation-delay: 5.2s; }

  .mod-header { display: flex; justify-content: space-between; align-items: center;
    opacity: 0; animation: fade-in 0.7s ease 4.65s both; }
  .tag { font-size: 11px; letter-spacing: 0.28em; font-weight: 600; color: #aab6c8;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 5px 10px 5px 12px;
    background: rgba(255,255,255,0.04); }
  .chart-icons { display: flex; gap: 16px; align-items: center; color: #55617a; }
  .chart-icons .ci { width: 18px; height: 18px; display: block; }
  .chart-icons .active { color: #93a3bd; }

  .mod-sub { display: flex; justify-content: space-between; align-items: center; margin-top: 15px;
    opacity: 0; animation: fade-in 0.7s ease 4.8s both; }
  .live { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); letter-spacing: 0.14em; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live);
    animation: live-pulse 1.7s ease-out infinite; }
  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 77, 141, 0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(255, 77, 141, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 77, 141, 0); }
  }
  .stats { display: flex; gap: 10px; font-family: var(--mono); font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .stat { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; }
  .stat i { font-style: normal; font-size: 11px; opacity: 0.8; }
  .stat.bid { color: var(--teal); }
  .stat.ask { color: var(--pink); }
  .stat.flash { animation: stat-flash 0.9s ease; }
  @keyframes stat-flash {
    0% { background: rgba(255,255,255,0.13); }
    100% { background: transparent; }
  }

  /* ================= 深度图 ================= */
  .chart { position: relative; margin-top: 18px; display: flex; flex-direction: column; gap: 4px; }
  .chart-grid { position: absolute; inset: 0; pointer-events: none; }
  .chart-grid i { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.05); }

  .side { display: flex; flex-direction: column; gap: 4px; }
  .side.bids { justify-content: flex-end; } /* 最下方 = 最贴近中间价的买盘 */

  .bar {
    --d: 0s;
    height: 11px;
    width: 0;
    border-radius: 2px 7px 7px 2px;
    position: relative;
    cursor: crosshair;
    will-change: width;
    transition: width 0.95s var(--ease) var(--d), transform 0.25s ease, filter 0.25s ease;
  }
  .bar::after { /* 条形末端的光点,悬停时亮起 */
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%) scale(0.6);
    width: 5px; height: 5px; border-radius: 50%; opacity: 0; transition: opacity 0.2s ease, box-shadow 0.2s ease;
  }
  .bar.bid::after { background: var(--teal); box-shadow: 0 0 10px var(--teal); }
  .bar.ask::after { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  .bar:hover, .bar.hot { filter: brightness(1.4) saturate(1.15); transform: scaleY(1.3); }
  .bar:hover::after, .bar.hot::after { opacity: 1; transform: translateY(-50%) scale(1); }

  /* 中间价分隔线 */
  .spread-line { height: 2px; position: relative; }
  .spread-line::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8) 18%, rgba(255,255,255,0.8) 82%, transparent);
    box-shadow: 0 0 14px rgba(255,255,255,0.35);
    transform: scaleX(0); transform-origin: center;
    animation: draw-x 0.9s var(--ease) 5.45s both;
  }

  /* 悬停十字线 */
  .crosshair { position: absolute; top: 8px; bottom: 8px; left: 0; width: 1px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.55) 0 3px, transparent 3px 7px);
    opacity: 0; transition: opacity 0.16s ease; pointer-events: none; }

  /* 悬停提示 */
  .tooltip { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
    background: rgba(12, 16, 24, 0.96); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 9px; padding: 8px 12px; font-family: var(--mono); font-size: 11.5px;
    line-height: 1.6; color: #c6d0e0; box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    opacity: 0; white-space: nowrap;
    transform: translate(-50%, calc(-100% - 10px)) scale(0.95);
    transition: opacity 0.16s ease, transform 0.2s var(--ease);
  }
  .tooltip.below { transform: translate(-50%, 12px) scale(0.95); }
  .tooltip.show { opacity: 1; transform: translate(-50%, calc(-100% - 10px)) scale(1); }
  .tooltip.below.show { transform: translate(-50%, 12px) scale(1); }
  .t-side { font-size: 10px; letter-spacing: 0.2em; }
  .t-side.bid { color: var(--teal); }
  .t-side.ask { color: var(--pink); }

  .mod-footer { display: flex; justify-content: space-between; margin-top: 16px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; color: #5f6b7e;
    opacity: 0; animation: fade-in 0.7s ease 5.05s both; }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ================= 蓝图线框(开场) ================= */
  .wireframe { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    pointer-events: none; }
  .wireframe.out { animation: wf-out 0.7s ease both; }
  @keyframes wf-out { to { opacity: 0; } }
  .wf-inner { position: relative; width: min(640px, 78vw); height: 340px; }
  .wf-line { position: absolute; left: 40px; right: 40px; height: 1px; background: rgba(200,215,235,0.5);
    transform: scaleX(0); }
  .wf-top { top: 60px; transform-origin: left;  animation: draw-x 0.8s cubic-bezier(0.4,0,0.2,1) 0.12s both; }
  .wf-bottom { bottom: 60px; transform-origin: right; animation: draw-x 0.8s cubic-bezier(0.4,0,0.2,1) 0.38s both; }
  .wf-corner { position: absolute; width: 18px; height: 18px; border: 1.5px solid rgba(200,215,235,0.55);
    opacity: 0; animation: fade-in 0.4s ease both; }
  .wf-corner.tl { top: 60px; left: 40px; border-right: 0; border-bottom: 0; animation-delay: 0.75s; }
  .wf-corner.tr { top: 60px; right: 40px; border-left: 0; border-bottom: 0; animation-delay: 0.85s; }
  .wf-corner.bl { bottom: 60px; left: 40px; border-right: 0; border-top: 0; animation-delay: 0.95s; }
  .wf-corner.br { bottom: 60px; right: 40px; border-left: 0; border-top: 0; animation-delay: 1.05s; }
  .wf-plus { position: absolute; color: rgba(190,205,228,0.5); font-size: 15px; font-weight: 300;
    opacity: 0; animation: fade-in 0.4s ease both; }
  .wf-dotside { position: absolute; top: 50%; width: 64px; border-top: 2px dotted rgba(200,215,235,0.35);
    opacity: 0; animation: fade-in 0.5s ease both; }
  .wf-dotside.left { left: -110px; animation-delay: 1.1s; }
  .wf-dotside.right { right: -110px; animation-delay: 1.2s; }
  .wf-dots { position: absolute; left: 50%; bottom: -36px; transform: translateX(-50%); display: flex; gap: 14px; }
  .wf-dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid rgba(200,215,235,0.5);
    opacity: 0; animation: fade-in 0.35s ease both; }
  .wf-dots i.on { background: rgba(200,215,235,0.55); }

  /* ================= 减弱动效 ================= */
  @media (prefers-reduced-motion: reduce) {
    .wireframe { display: none; }
    .title { animation-duration: 0.01s; animation-delay: 0s; }
    .module { animation-duration: 0.01s; animation-delay: 0s; }
    .mod-header, .mod-sub, .mod-footer { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    .mod-corner, .spread-line::before { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    .bar { --d: 0s !important; transition-duration: 0.01s !important; }
    .live-dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- 蓝图线框开场 -->
  <div class="wireframe" id="wireframe" aria-hidden="true">
    <div class="wf-inner">
      <span class="wf-plus" style="top:-26px; left:-26px;  animation-delay:.55s">+</span>
      <span class="wf-plus" style="top:-26px; right:-26px; animation-delay:.65s">+</span>
      <span class="wf-plus" style="bottom:-26px; left:-26px;  animation-delay:.75s">+</span>
      <span class="wf-plus" style="bottom:-26px; right:-26px; animation-delay:.85s">+</span>
      <i class="wf-line wf-top"></i>
      <i class="wf-line wf-bottom"></i>
      <i class="wf-corner tl"></i><i class="wf-corner tr"></i>
      <i class="wf-corner bl"></i><i class="wf-corner br"></i>
      <i class="wf-dotside left"></i>
      <i class="wf-dotside right"></i>
    </div>
    <div class="wf-dots" id="wfDots"></div>
  </div>

  <div class="stage">
    <h1 class="title"><span class="brace">{</span> Stocks on Solana <span class="brace">}</span></h1>

    <main class="module" id="module" aria-label="DEPTH market depth">
      <i class="mod-corner tl"></i><i class="mod-corner tr"></i>
      <i class="mod-corner bl"></i><i class="mod-corner br"></i>

      <header class="mod-header">
        <div class="tag">DEPTH</div>
        <div class="chart-icons" aria-hidden="true">
          <svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M5 20v-7M12 20V5M19 20v-4" />
          </svg>
          <svg class="ci active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l5-6 4 3 6-8" /><path d="M15 6h3v3" />
          </svg>
        </div>
      </header>

      <div class="mod-sub">
        <div class="live"><span class="live-dot"></span>Live</div>
        <div class="stats">
          <span class="stat bid" id="bidStat"><i>↑</i><b id="bidVal">$875k</b></span>
          <span class="stat ask" id="askStat"><i>↓</i><b id="askVal">$1.02M</b></span>
        </div>
      </div>

      <div class="chart" id="chart">
        <div class="chart-grid" aria-hidden="true">
          <i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i>
        </div>
        <div class="side bids" id="bids"></div>
        <div class="spread-line" aria-hidden="true"></div>
        <div class="side asks" id="asks"></div>
        <div class="crosshair" id="crosshair" aria-hidden="true"></div>
      </div>

      <footer class="mod-footer">
        <span>SOL / USDC · 0.02%</span>
        <span id="latency">updated 42ms ago</span>
      </footer>
    </main>
  </div>

  <div class="tooltip" id="tooltip" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  /* ============ 蓝图线框:底部圆点逐个出现,随后整体淡出 ============ */
  var wf = document.getElementById('wireframe');
  var dotsBox = document.getElementById('wfDots');
  var filled = [0, 1, 3, 5, 6, 8, 10];
  for (var i = 0; i < 12; i++) {
    var d = document.createElement('i');
    if (filled.indexOf(i) > -1) d.className = 'on';
    d.style.animationDelay = (1.25 + i * 0.05) + 's';
    dotsBox.appendChild(d);
  }
  setTimeout(function () { wf.classList.add('out'); }, 2350);
  setTimeout(function () { wf.parentNode && wf.parentNode.removeChild(wf); }, 3150);

  /* ============ DEPTH 数据模型 ============ */
  var N = 14;                 // 每侧条形数量
  var MID = 128.42;           // 中间价
  var chart = document.getElementById('chart');
  var bidsEl = document.getElementById('bids');
  var asksEl = document.getElementById('asks');
  var cross = document.getElementById('crosshair');
  var tip = document.getElementById('tooltip');
  var bidStat = document.getElementById('bidStat');
  var askStat = document.getElementById('askStat');
  var bidVal = document.getElementById('bidVal');
  var askVal = document.getElementById('askVal');
  var latencyEl = document.getElementById('latency');
  var bars = [];
  var bidTotal = 875000, askTotal = 1020000;

  function fmt(n) { /* 875000 → $875k,1020000 → $1.02M */
    if (n >= 999000) return '$' + (n / 1e6).toFixed(2) + 'M';
    return '$' + Math.round(n / 1e3) + 'k';
  }

  /* 深度分布:峰值略偏离中间价,向两侧衰减 */
  function gauss(x) { var t = (x - 2) / 3.6; return Math.exp(-t * t); }
  function baseWidth(idx) { return Math.min(97, Math.max(9, 15 + 80 * gauss(idx))); }

  function build(el, side, count) {
    for (var i = 0; i < count; i++) {
      var idx = (side === 'bid') ? count - 1 - i : i; // 0 = 贴近中间价
      var b = document.createElement('div');
      b.className = 'bar ' + side;
      b._side = side; b._idx = idx;
      b._w = baseWidth(idx);
      b._price = side === 'bid'
        ? MID - (idx + 1) * (0.02 + Math.random() * 0.006)
        : MID + (idx + 1) * (0.02 + Math.random() * 0.006);
      b._vol = 30 + Math.random() * 150;
      /* 颜色:越贴近中间价越亮 */
      var a = 0.45 + 0.55 * (1 - idx / (N - 1));
      var c = side === 'bid' ? '56,224,164' : '255,93,126';
      b.style.background = 'linear-gradient(90deg, rgba(' + c + ',' + (a * 0.32).toFixed(3) +
        '), rgba(' + c + ',' + a.toFixed(3) + '))';
      /* 入场延迟:模块动画(4.55s)之后,条形依次生长 */
      b.style.setProperty('--d', 'calc(5.15s + ' + (i * 0.045).toFixed(3) + 's)');
      el.appendChild(b);
      bars.push(b);
    }
  }
  build(bidsEl, 'bid', N);
  build(asksEl, 'ask', N);

  /* 入场:从 0 宽度生长到目标宽度 */
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      bars.forEach(function (b) { b.style.width = b._w + '%'; });
    });
  });

  /* ============ 实时数据刷新(每 2.4s) ============ */
  var tick = 0;
  function updateStat(statEl, valEl, v) {
    valEl.textContent = fmt(v);
    statEl.classList.remove('flash');
    void statEl.offsetWidth; /* 重启动画 */
    statEl.classList.add('flash');
  }

  function refresh() {
    tick++;
    var big = (tick % 5 === 0); /* 每隔几次来一次较大的跳动 */
    bars.forEach(function (b) {
      var w = b._w + (Math.random() - 0.5) * (big ? 30 : 13);
      w += (baseWidth(b._idx) - w) * 0.22; /* 向基准回归,防止长期漂移 */
      b._w = Math.max(9, Math.min(97, w));
      b.style.width = b._w + '%';
    });
    bidTotal += (Math.random() - 0.5) * 22000 + (875000 - bidTotal) * 0.06;
    askTotal += (Math.random() - 0.5) * 26000 + (1020000 - askTotal) * 0.06;
    updateStat(bidStat, bidVal, bidTotal);
    updateStat(askStat, askVal, askTotal);
    latencyEl.textContent = 'updated ' + Math.round(16 + Math.random() * 40) + 'ms ago';
  }

  setTimeout(function () {
    bars.forEach(function (b) { b.style.setProperty('--d', '0s'); });
    setInterval(refresh, 2400);
  }, 8000);

  /* ============ 悬停交互:高亮 + 末端光点 + 十字线 + 提示卡 ============ */
  function hideTip() {
    tip.classList.remove('show');
    cross.style.opacity = '0';
    var hot = chart.querySelector('.bar.hot');
    if (hot) hot.classList.remove('hot');
  }

  function showTip(b) {
    var r = b.getBoundingClientRect();
    var cr = chart.getBoundingClientRect();
    tip.innerHTML =
      '<div class="t-side ' + b._side + '">' + (b._side === 'bid' ? 'BID' : 'ASK') + '</div>' +
      '<div>$' + b._price.toFixed(2) + '</div>' +
      '<div>' + b._vol.toFixed(1) + 'K SOL</div>';
    tip.classList.add('show');
    tip.classList.toggle('below', r.top < 96); /* 顶部空间不足时翻到下方 */
    var half = tip.offsetWidth / 2;
    var x = Math.min(Math.max(r.right, cr.left + half + 8), cr.right - half - 8);
    tip.style.left = x + 'px';
    tip.style.top = (r.top < 96 ? r.bottom : r.top) + 'px';
    cross.style.left = (r.right - cr.left) + 'px';
    cross.style.opacity = '1';
    var hot = chart.querySelector('.bar.hot');
    if (hot && hot !== b) hot.classList.remove('hot');
    b.classList.add('hot');
  }

  chart.addEventListener('pointerover', function (e) {
    var b = e.target.closest ? e.target.closest('.bar') : null;
    if (b && chart.contains(b)) showTip(b);
  });
  chart.addEventListener('pointerout', function (e) {
    var b = e.target.closest ? e.target.closest('.bar') : null;
    if (b && chart.contains(b)) hideTip();
  });
  chart.addEventListener('pointerleave', hideTip);
})();
</script>
</body>
</html>
