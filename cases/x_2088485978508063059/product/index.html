<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMOS — Solar System Live Orbit Sim</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --cy:#6ee7ff;
    --cy-dim:rgba(110,231,255,.32);
    --cy-faint:rgba(110,231,255,.14);
    --amber:#ffb454;
    --panel:rgba(6,14,26,.62);
    --txt:#bfe9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#020409}
  body{
    font-family:'Share Tech Mono',Consolas,Menlo,monospace;
    color:var(--txt);
    -webkit-user-select:none;user-select:none;
  }
  #c{position:fixed;inset:0;display:block;cursor:grab}
  #c.dragging{cursor:grabbing}
  #c.hover-planet{cursor:pointer}

  /* ---------- shared HUD panel chrome ---------- */
  .hud-panel{
    position:fixed;z-index:40;
    background:var(--panel);
    border:1px solid var(--cy-dim);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(0,229,255,.06), inset 0 0 32px rgba(110,231,255,.03);
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    padding:12px 16px;
  }
  .hud-panel::before{
    content:"";position:absolute;top:0;left:0;width:22px;height:1px;
    background:var(--cy);box-shadow:0 0 8px var(--cy);
  }

  /* ---------- title / clock (top-left) ---------- */
  #title{top:20px;left:20px;max-width:430px}
  #title h1{
    font-family:'Orbitron',monospace;font-size:30px;font-weight:700;
    letter-spacing:8px;color:#eaf9ff;
    text-shadow:0 0 18px rgba(110,231,255,.65),0 0 42px rgba(110,231,255,.25);
  }
  #title .sub{
    margin-top:2px;font-size:11px;letter-spacing:3px;color:var(--cy);
  }
  #title .clock{
    margin-top:10px;padding-top:8px;border-top:1px solid var(--cy-faint);
    font-size:13px;letter-spacing:1px;color:#d8f4ff;line-height:1.6;
  }
  #title .clock .lbl{color:rgba(110,231,255,.55);font-size:10px;letter-spacing:2px}
  #mjd{color:var(--amber)}

  /* ---------- planet nav (left, vertical) ---------- */
  #nav{
    left:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:2px;padding:14px 10px;min-width:168px;
  }
  #nav .nav-title{
    font-size:9px;letter-spacing:4px;color:rgba(110,231,255,.5);
    padding:0 8px 8px 8px;border-bottom:1px solid var(--cy-faint);margin-bottom:6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;
    background:none;border:1px solid transparent;border-left:2px solid transparent;
    color:var(--txt);font-family:inherit;font-size:12px;letter-spacing:2px;
    padding:7px 10px;cursor:pointer;text-align:left;
    transition:all .18s ease;opacity:.82;
  }
  .nav-item .dot{
    width:8px;height:8px;border-radius:50%;flex:none;
    background:var(--c);box-shadow:0 0 8px var(--c),0 0 3px #fff inset;
  }
  .nav-item:hover{opacity:1;background:rgba(110,231,255,.06);border-left-color:var(--cy-dim)}
  .nav-item.active{
    opacity:1;border-left-color:var(--cy);
    background:linear-gradient(90deg,rgba(110,231,255,.16),transparent 75%);
    color:#fff;text-shadow:0 0 10px rgba(110,231,255,.7);
  }
  .nav-item.overview{
    margin-top:8px;border-top:1px solid var(--cy-faint);padding-top:12px;
    color:var(--cy);
  }
  .nav-item.overview .dot{background:transparent;border:1px solid var(--cy);box-shadow:0 0 6px var(--cy-dim)}

  /* ---------- camera state + fps (top-right) ---------- */
  #camBox{top:20px;right:20px;text-align:right;font-size:12px;letter-spacing:2px;min-width:210px}
  #camBox .row{padding:3px 0;display:flex;justify-content:space-between;gap:18px}
  #camBox .k{color:rgba(110,231,255,.55);font-size:10px;letter-spacing:2px}
  #camBox .v{color:#eaf9ff;text-shadow:0 0 8px rgba(110,231,255,.5)}
  #camBox .v.following{color:var(--amber);text-shadow:0 0 8px rgba(255,180,84,.6)}
  #fpsBarWrap{margin-top:6px;height:3px;background:rgba(110,231,255,.12);position:relative;overflow:hidden}
  #fpsBar{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#1e6f8a,var(--cy));box-shadow:0 0 8px var(--cy-dim)}

  /* ---------- TIME WARP bar (bottom-center) ---------- */
  #warp{
    bottom:18px;left:50%;transform:translateX(-50%);
    width:min(680px,58vw);padding:10px 16px 8px;z-index:40;
  }
  .warp-top{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
  #playBtn{
    flex:none;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--cy-dim);background:rgba(110,231,255,.07);
    color:var(--cy);font-size:12px;cursor:pointer;line-height:1;
    transition:all .15s;
  }
  #playBtn:hover{background:rgba(110,231,255,.18);box-shadow:0 0 14px rgba(110,231,255,.35)}
  #playBtn.paused{color:var(--amber);border-color:rgba(255,180,84,.5)}
  .presets{display:flex;gap:4px;flex:none}
  .wpre{
    background:none;border:1px solid var(--cy-faint);color:rgba(191,233,255,.7);
    font-family:inherit;font-size:10px;letter-spacing:1px;padding:5px 7px;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .wpre:hover{border-color:var(--cy-dim);color:#fff}
  .wpre.active{
    background:rgba(110,231,255,.16);border-color:var(--cy);color:#fff;
    box-shadow:0 0 10px rgba(110,231,255,.25), inset 0 0 8px rgba(110,231,255,.12);
  }
  #warpLabel{
    margin-left:auto;font-size:12px;letter-spacing:1px;color:#eaf9ff;white-space:nowrap;
    text-shadow:0 0 10px rgba(110,231,255,.5);
  }
  #warpSlider{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;margin:12px 0 4px;
    background:rgba(110,231,255,.15);outline:none;cursor:ew-resize;
  }
  #warpSlider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,var(--cy) 60%,#1e6f8a);
    border:1px solid var(--cy);box-shadow:0 0 12px rgba(110,231,255,.8);
    cursor:ew-resize;
  }
  #warpSlider::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,var(--cy) 60%,#1e6f8a);
    border:1px solid var(--cy);box-shadow:0 0 12px rgba(110,231,255,.8);
    cursor:ew-resize;
  }
  .warp-scale{display:flex;justify-content:space-between;font-size:8px;letter-spacing:2px;color:rgba(110,231,255,.4)}

  /* ---------- hint (bottom-left) — always above the warp bar ---------- */
  #hint{
    position:fixed;left:20px;bottom:20px;z-index:60;
    font-size:10px;letter-spacing:2px;color:rgba(191,233,255,.75);
    padding:8px 12px;border-left:2px solid var(--cy);
    background:linear-gradient(90deg,rgba(110,231,255,.10),transparent);
    text-shadow:0 0 8px rgba(110,231,255,.35);
    pointer-events:none;max-width:250px;line-height:1.8;
  }

  /* ---------- info panel (right) ---------- */
  #info{
    right:20px;top:50%;width:292px;z-index:50;
    transform:translate(130%,-50%);
    transition:transform .38s cubic-bezier(.22,1,.36,1);
    padding:18px 18px 16px;
  }
  #info.open{transform:translate(0,-50%)}
  #infoClose{
    position:absolute;top:8px;right:10px;background:none;border:none;
    color:rgba(191,233,255,.6);font-size:14px;cursor:pointer;font-family:inherit;
  }
  #infoClose:hover{color:#fff}
  .p-head{display:flex;align-items:center;gap:10px}
  .p-head h2{
    font-family:'Orbitron',monospace;font-size:19px;letter-spacing:4px;color:#fff;
    text-shadow:0 0 14px rgba(110,231,255,.6);
  }
  .p-dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
  .p-type{font-size:10px;letter-spacing:3px;color:var(--cy);margin:4px 0 8px 21px}
  .p-desc{font-size:11px;line-height:1.6;color:rgba(216,244,255,.85);margin-bottom:12px;text-align:justify}
  .stat{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:5px 0;border-bottom:1px dashed rgba(110,231,255,.14);font-size:11px;
  }
  .stat .k{color:rgba(110,231,255,.55);letter-spacing:2px;font-size:9px}
  .stat .v{color:#eaf9ff;text-align:right;letter-spacing:1px}
  #pFocus{
    width:100%;margin-top:14px;padding:9px 0;cursor:pointer;
    background:rgba(110,231,255,.14);border:1px solid var(--cy);color:#fff;
    font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;
    transition:all .18s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  #pFocus:hover{background:rgba(110,231,255,.3);box-shadow:0 0 18px rgba(110,231,255,.45)}
  #pFree{
    width:100%;margin-top:8px;padding:7px 0;cursor:pointer;
    background:none;border:1px solid var(--cy-faint);color:rgba(191,233,255,.7);
    font-family:inherit;font-size:10px;letter-spacing:3px;transition:all .18s;
  }
  #pFree:hover{border-color:var(--cy-dim);color:#fff}

  /* ---------- planet labels ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .plabel{
    position:absolute;left:0;top:0;font-size:9px;letter-spacing:2px;
    color:rgba(190,240,255,.62);text-shadow:0 0 6px rgba(0,0,0,.9);
    transform:translate(-50%,-50%);white-space:nowrap;transition:color .2s;
  }
  .plabel.active{color:#fff;text-shadow:0 0 10px rgba(110,231,255,.9)}

  /* ---------- cinematic overlays ---------- */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:30;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,2,8,.55) 100%);
  }
  #scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:31;opacity:.05;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(110,231,255,.5) 2px 3px);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- top-left: title + live sim clock -->
<header id="title" class="hud-panel">
  <h1>COSMOS</h1>
  <div class="sub">— SOLAR SYSTEM LIVE ORBIT SIM</div>
  <div class="clock">
    <span class="lbl">SIM DATE&nbsp;</span><span id="simDate">—</span><br>
    <span class="lbl">UTC&nbsp;</span><span id="utcClock">—</span>&nbsp;&nbsp;
    <span class="lbl">MJD&nbsp;</span><span id="mjd">—</span>
  </div>
</header>

<!-- left: planet nav -->
<nav id="nav" class="hud-panel">
  <div class="nav-title">PLANETS</div>
  <button class="nav-item" data-name="Mercury"><span class="dot" style="--c:#b8a89a"></span>MERCURY</button>
  <button class="nav-item" data-name="Venus"><span class="dot" style="--c:#e8c47a"></span>VENUS</button>
  <button class="nav-item" data-name="Earth"><span class="dot" style="--c:#5aa2ff"></span>EARTH</button>
  <button class="nav-item" data-name="Mars"><span class="dot" style="--c:#e0684a"></span>MARS</button>
  <button class="nav-item" data-name="Jupiter"><span class="dot" style="--c:#d8a86e"></span>JUPITER</button>
  <button class="nav-item" data-name="Saturn"><span class="dot" style="--c:#e0c98f"></span>SATURN</button>
  <button class="nav-item" data-name="Uranus"><span class="dot" style="--c:#9fd8dd"></span>URANUS</button>
  <button class="nav-item" data-name="Neptune"><span class="dot" style="--c:#5a7bff"></span>NEPTUNE</button>
  <button class="nav-item overview" data-name="Overview"><span class="dot"></span>OVERVIEW</button>
</nav>

<!-- top-right: camera state + fps -->
<div id="camBox" class="hud-panel">
  <div class="row"><span class="k">CAMERA</span><span class="v" id="camMode">FREE CAMERA</span></div>
  <div class="row"><span class="k">FPS</span><span class="v" id="fps">60</span></div>
  <div id="fpsBarWrap"><div id="fpsBar"></div></div>
</div>

<!-- bottom-center: TIME WARP -->
<div id="warp" class="hud-panel">
  <div class="warp-top">
    <button id="playBtn" title="Play / Pause (Space)">❚❚</button>
    <div class="presets">
      <button class="wpre" data-d="0.000011574">REAL</button>
      <button class="wpre" data-d="0.0006944">1 M/S</button>
      <button class="wpre" data-d="0.0416667">1 H/S</button>
      <button class="wpre active" data-d="1">1 D/S</button>
      <button class="wpre" data-d="365.25">1 Y/S</button>
      <button class="wpre" id="nowBtn" title="Jump to the present moment">NOW</button>
    </div>
    <div id="warpLabel">1 S = 1.0 DAYS</div>
  </div>
  <input type="range" id="warpSlider" min="0" max="1000" value="467">
  <div class="warp-scale"><span>0.0003 DAY/S</span><span>1 DAY/S</span><span>10000 DAY/S</span></div>
</div>

<!-- bottom-left: hint (z-index above the warp bar) -->
<div id="hint">DRAG ORBIT, SCROLL ZOOM,<br>CLICK A PLANET TO INSPECT &amp; FOLLOW</div>

<!-- right: planet info panel -->
<aside id="info" class="hud-panel"></aside>

<div id="labels"></div>
<div id="vignette"></div>
<div id="scanlines"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   COSMOS — SOLAR SYSTEM LIVE ORBIT SIM
   ============================================================ */

// ---------------- planet data ----------------
const PLANETS = [
  { name:'Mercury', color:'#b8a89a', glow:'#8a7f74', orbit:8,    size:0.38, period:87.97,      rotHours:1407.6, tilt:0.001, phase:1.2,
    type:'TERRESTRIAL / ROCKY', radiusKm:'2,440 km', gravity:'3.70 m/s²', day:'58.65 Earth days', year:'87.97 days', temp:'−173°C → 427°C', moons:'0',
    tex:'rocky', texBase:'#8f857c', texSpots:['#6e655c','#a89e93','#7d746b','#b5ab9e'],
    desc:'The smallest planet and closest to the Sun — a cratered, airless world of extreme temperature swings.' },
  { name:'Venus', color:'#e8c47a', glow:'#d9a94f', orbit:11.5, size:0.62, period:224.7,      rotHours:-5832.5, tilt:0.05, phase:4.0,
    type:'TERRESTRIAL / ROCKY', radiusKm:'6,052 km', gravity:'8.87 m/s²', day:'243 days (retrograde)', year:'224.7 days', temp:'464°C', moons:'0',
    tex:'venus', texBase:'#d8b26a',
    desc:'Wrapped in crushing CO₂ clouds, Venus is the hottest planet — a runaway greenhouse world hotter than Mercury.' },
  { name:'Earth', color:'#5aa2ff', glow:'#3f7fe0', orbit:15,   size:0.66, period:365.25,     rotHours:23.93, tilt:0.41, phase:0,
    type:'TERRESTRIAL / ROCKY', radiusKm:'6,371 km', gravity:'9.81 m/s²', day:'23.93 h', year:'365.25 days', temp:'15°C (mean)', moons:'1',
    tex:'earth', texBase:'#1c4f8e',
    desc:'The only known world with life — liquid water oceans cover 71% of its surface beneath a breathable sky.' },
  { name:'Mars', color:'#e0684a', glow:'#c24e33', orbit:19.5, size:0.5,  period:686.98,     rotHours:24.62, tilt:0.44, phase:2.6,
    type:'TERRESTRIAL / ROCKY', radiusKm:'3,390 km', gravity:'3.71 m/s²', day:'24.62 h', year:'686.98 days', temp:'−63°C (mean)', moons:'2',
    tex:'rocky', texBase:'#b45a3c', texSpots:['#8f4229','#cd7350','#a04a30','#d98a63'],
    desc:'A cold desert world home to Olympus Mons, the tallest volcano, and Valles Marineris, the deepest canyon.' },
  { name:'Jupiter', color:'#d8a86e', glow:'#c08a4a', orbit:27,  size:2.1,  period:4332.6,     rotHours:9.93, tilt:0.05, phase:5.1,
    type:'GAS GIANT', radiusKm:'69,911 km', gravity:'24.79 m/s²', day:'9.93 h', year:'11.86 years', temp:'−108°C (cloud top)', moons:'95',
    tex:'bands', texBase:'#d8a86e', texSpots:['#c08a4a','#e8c88f','#a8763a','#e0b878','#b08040'], redSpot:true,
    desc:'The giant of the solar system — its Great Red Spot is a storm wider than Earth that has raged for centuries.' },
  { name:'Saturn', color:'#e0c98f', glow:'#d0b070', orbit:37,  size:1.75, period:10759.2,    rotHours:10.7, tilt:0.47, phase:0.6, ring:true,
    type:'GAS GIANT', radiusKm:'58,232 km', gravity:'10.44 m/s²', day:'10.7 h', year:'29.45 years', temp:'−139°C (cloud top)', moons:'146',
    tex:'bands', texBase:'#d9c08a', texSpots:['#e5d0a0','#c7ad74','#d0b87e','#bfa068'],
    desc:'Famous for its dazzling ring system of ice and rock — Saturn is the least dense planet, lighter than water.' },
  { name:'Uranus', color:'#9fd8dd', glow:'#7fc4cc', orbit:45,  size:1.15, period:30687.2,    rotHours:-17.24, tilt:1.71, phase:3.3,
    type:'ICE GIANT', radiusKm:'25,362 km', gravity:'8.87 m/s²', day:'17.24 h (retrograde)', year:'84.02 years', temp:'−197°C', moons:'28',
    tex:'uranus', texBase:'#9fd8dd',
    desc:'An ice giant knocked onto its side — it rolls around the Sun at a 98° tilt, glowing pale cyan from methane.' },
  { name:'Neptune', color:'#5a7bff', glow:'#3f5fe0', orbit:52,  size:1.1,  period:60190,      rotHours:16.11, tilt:0.49, phase:5.9,
    type:'ICE GIANT', radiusKm:'24,622 km', gravity:'11.15 m/s²', day:'16.11 h', year:'164.8 years', temp:'−201°C', moons:'16',
    tex:'neptune', texBase:'#2f54c9',
    desc:'The most distant planet — a deep-blue ice giant whipped by the fastest winds in the solar system, up to 2,100 km/h.' },
];

// ---------------- renderer / scene ----------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
scene.fog = new THREE.FogExp2(0x02040a, 0.00085);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 4000);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------- lights ----------------
scene.add(new THREE.AmbientLight(0x3a4a66, 0.55));
const sunLight = new THREE.PointLight(0xfff1d8, 1.8, 0, 0);
scene.add(sunLight);
const rim = new THREE.DirectionalLight(0x4466aa, 0.35);
rim.position.set(-200, 120, -160);
scene.add(rim);

// ---------------- procedural textures ----------------
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
const R = (a,b)=>a+Math.random()*(b-a);

function glowTexture(){
  const c = makeCanvas(128,128), x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,255,255,.55)');
  g.addColorStop(0.6,'rgba(255,255,255,.12)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowTex = glowTexture();

function rockyTexture(base, spots, n){
  const c = makeCanvas(256,128), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,256,128);
  for(let i=0;i<n;i++){
    x.globalAlpha = R(0.10,0.35);
    x.fillStyle = spots[Math.floor(Math.random()*spots.length)];
    x.beginPath();
    x.arc(R(0,256), R(0,128), R(1,7), 0, Math.PI*2);
    x.fill();
  }
  // light speckles
  for(let i=0;i<60;i++){
    x.globalAlpha = R(0.1,0.3); x.fillStyle = '#ffffff';
    x.beginPath(); x.arc(R(0,256),R(0,128),R(0.5,1.5),0,Math.PI*2); x.fill();
  }
  x.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function bandsTexture(palette, streakN, streakA, redSpot){
  const c = makeCanvas(256,128), x = c.getContext('2d');
  for(let r=0;r<128;r++){
    const t = r/128;
    let idx = Math.floor(t*palette.length + (Math.random()-0.5)*1.3);
    idx = Math.max(0, Math.min(palette.length-1, idx));
    x.fillStyle = palette[idx];
    x.fillRect(0,r,256,1);
  }
  for(let i=0;i<streakN;i++){
    x.globalAlpha = Math.random()*streakA + 0.03;
    x.fillStyle = Math.random()<0.5 ? '#ffffff' : '#000000';
    x.beginPath();
    x.ellipse(R(0,256), R(0,128), R(20,110), R(1,4), 0, 0, Math.PI*2);
    x.fill();
  }
  if(redSpot){
    x.globalAlpha = 0.85; x.fillStyle = '#b03a28';
    x.beginPath(); x.ellipse(178, 80, 20, 12, 0, 0, Math.PI*2); x.fill();
    x.globalAlpha = 0.4; x.fillStyle = '#d96a4a';
    x.beginPath(); x.ellipse(178, 80, 28, 17, 0, 0, Math.PI*2); x.fill();
  }
  x.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function earthTexture(){
  const c = makeCanvas(256,128), x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#2a5d9e'); g.addColorStop(0.5,'#1c4f8e'); g.addColorStop(1,'#2a5d9e');
  x.fillStyle = g; x.fillRect(0,0,256,128);
  // continents
  const land = ['#2e7d32','#3f7a3f','#8d6e63','#558b2f'];
  for(let i=0;i<9;i++){
    const cx = R(20,236), cy = R(28,100), r = R(10,30);
    x.globalAlpha = 0.95; x.fillStyle = land[Math.floor(Math.random()*land.length)];
    x.beginPath(); x.ellipse(cx,cy,r,r*R(0.4,0.8),R(0,Math.PI),0,Math.PI*2); x.fill();
    for(let j=0;j<5;j++){
      x.beginPath();
      x.ellipse(cx+R(-r,r), cy+R(-r*0.6,r*0.6), R(3,10), R(2,6), R(0,Math.PI), 0, Math.PI*2);
      x.fill();
    }
  }
  // polar caps
  x.globalAlpha = 0.85; x.fillStyle = '#e8f4ff';
  x.fillRect(0,0,256,9); x.fillRect(0,119,256,9);
  // clouds
  for(let i=0;i<45;i++){
    x.globalAlpha = R(0.04,0.1); x.fillStyle = '#ffffff';
    x.beginPath(); x.ellipse(R(0,256),R(0,128),R(8,26),R(1.5,4),0,0,Math.PI*2); x.fill();
  }
  x.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function venusTexture(){
  const c = makeCanvas(256,128), x = c.getContext('2d');
  x.fillStyle = '#d8b26a'; x.fillRect(0,0,256,128);
  const cols = ['#e8cf9a','#b98d4f','#f0dda8','#c79e5c'];
  for(let i=0;i<26;i++){
    x.globalAlpha = R(0.1,0.28);
    x.strokeStyle = cols[Math.floor(Math.random()*cols.length)];
    x.lineWidth = R(3,9);
    const cx=R(0,256), cy=R(0,128), r=R(10,42);
    x.beginPath(); x.arc(cx,cy,r,R(0,Math.PI*2),R(0,Math.PI*2)+R(0.5,2.5)); x.stroke();
  }
  x.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function iceTexture(base, bandN){
  const c = makeCanvas(256,128), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,256,128);
  for(let i=0;i<bandN;i++){
    x.globalAlpha = R(0.05,0.12);
    x.fillStyle = Math.random()<0.5 ? '#ffffff' : '#0a1a4a';
    x.fillRect(0, R(0,120), 256, R(2,9));
  }
  x.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function neptuneTexture(){
  const c = bandsTexture(['#2f54c9','#3a63e0','#2848b0','#4a70e8','#2f54c9'], 26, 0.14, false);
  const x = c.image.getContext('2d');
  x.globalAlpha = 0.25; x.fillStyle = '#bcd0ff';
  x.beginPath(); x.ellipse(90, 46, 26, 5, 0, 0, Math.PI*2); x.fill();
  x.globalAlpha = 0.5; x.fillStyle = '#1a2f80';
  x.beginPath(); x.ellipse(150, 76, 12, 8, 0, 0, Math.PI*2); x.fill();
  x.globalAlpha = 1;
  c.needsUpdate = true;
  return c;
}

function sunTexture(){
  const c = makeCanvas(256,128), x = c.getContext('2d');
  x.fillStyle = '#ffcf7d'; x.fillRect(0,0,256,128);
  const cols = ['#ffdf9e','#ffb347','#fff3c4','#ffe9b0'];
  for(let i=0;i<900;i++){
    x.globalAlpha = R(0.06,0.2);
    x.fillStyle = cols[Math.floor(Math.random()*cols.length)];
    x.beginPath(); x.arc(R(0,256),R(0,128),R(0.5,2.6),0,Math.PI*2); x.fill();
  }
  x.globalAlpha = 1;
  return new THREE.CanvasTexture(c);
}

function ringTexture(){
  const c = makeCanvas(256,256), x = c.getContext('2d');
  const g = x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(216,201,168,0)');
  g.addColorStop(0.22,'rgba(216,201,168,0)');
  g.addColorStop(0.32,'rgba(216,201,168,.55)');
  g.addColorStop(0.45,'rgba(200,182,148,.25)');
  g.addColorStop(0.58,'rgba(230,214,178,.75)');
  g.addColorStop(0.72,'rgba(216,201,168,.45)');
  g.addColorStop(0.85,'rgba(235,222,190,.6)');
  g.addColorStop(1,'rgba(216,201,168,0)');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

function makePlanetTexture(p){
  let t;
  switch(p.tex){
    case 'rocky':  t = rockyTexture(p.texBase, p.texSpots, 170); break;
    case 'bands':  t = bandsTexture(p.texSpots, 46, 0.1, p.redSpot); break;
    case 'earth':  t = earthTexture(); break;
    case 'venus':  t = venusTexture(); break;
    case 'uranus': t = iceTexture(p.texBase, 6); break;
    case 'neptune':t = neptuneTexture(); break;
    default:       t = rockyTexture(p.texBase, p.texSpots, 100);
  }
  t.encoding = THREE.sRGBEncoding;
  return t;
}

// ---------------- sun ----------------
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(3, 48, 32),
  new THREE.MeshBasicMaterial({ map: sunTexture() })
);
sunGroup.add(sunMesh);

function addGlow(parent, color, scale, opacity){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent:true, opacity,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:false
  }));
  s.scale.set(scale, scale, 1);
  parent.add(s);
  return s;
}
const sunGlow1 = addGlow(sunGroup, 0xffd9a0, 15, 0.95);
const sunGlow2 = addGlow(sunGroup, 0xff9a3c, 30, 0.3);

// ---------------- planets ----------------
const hitMeshes = [];
const planets = [];
const labelContainer = document.getElementById('labels');

PLANETS.forEach(p => {
  const group = new THREE.Group();
  group.rotation.z = p.tilt;
  scene.add(group);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.size, 40, 28),
    new THREE.MeshStandardMaterial({ map: makePlanetTexture(p), roughness: 0.9, metalness: 0.04 })
  );
  group.add(mesh);

  // soft atmosphere glow
  const glow = addGlow(group, p.glow, p.size*7, 0.3);

  // Saturn's ring
  if(p.ring){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(p.size*1.35, p.size*2.3, 96, 1),
      new THREE.MeshBasicMaterial({ map: ringTexture(), transparent:true, side:THREE.DoubleSide, depthWrite:false })
    );
    ring.rotation.x = Math.PI/2;
    mesh.add(ring);
  }

  // invisible raycast proxy (generous hit area)
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(p.size*1.8, 0.9), 12, 8),
    new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false })
  );
  hit.userData.planet = p;
  group.add(hit);
  hitMeshes.push(hit);

  // orbit line
  const pts = [];
  for(let i=0;i<160;i++){
    const a = i/160 * Math.PI*2;
    pts.push(new THREE.Vector3(
      Math.cos(a)*p.orbit,
      -Math.sin(a)*p.orbit*Math.sin(p.tilt*0.4),
      Math.sin(a)*p.orbit*Math.cos(p.tilt*0.4)
    ));
  }
  const line = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:p.color, transparent:true, opacity:0.26 })
  );
  scene.add(line);

  // HTML label
  const label = document.createElement('div');
  label.className = 'plabel';
  label.textContent = p.name.toUpperCase();
  labelContainer.appendChild(label);

  p.group = group; p.mesh = mesh; p.hit = hit; p.label = label;
  planets.push(p);
});

// Earth's moon
const earth = planets[2];
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.17, 20, 14),
  new THREE.MeshStandardMaterial({ map: rockyTexture('#9a9a9a',['#7a7a7a','#b5b5b5','#666666'], 80), roughness: 1 })
);
moon.position.set(earth.size*3.2, 0, 0);
earth.group.add(moon);

// ---------------- asteroid belt ----------------
const beltCount = 2600;
const beltPos = new Float32Array(beltCount*3);
const beltCol = new Float32Array(beltCount*3);
for(let i=0;i<beltCount;i++){
  const a = Math.random()*Math.PI*2;
  const r = R(20.5, 25.5);
  beltPos[i*3]   = Math.cos(a)*r;
  beltPos[i*3+1] = R(-0.8, 0.8);
  beltPos[i*3+2] = Math.sin(a)*r;
  const v = R(0.45, 0.85);
  beltCol[i*3] = v; beltCol[i*3+1] = v*0.94; beltCol[i*3+2] = v*0.85;
}
const beltGeo = new THREE.BufferGeometry();
beltGeo.setAttribute('position', new THREE.BufferAttribute(beltPos, 3));
beltGeo.setAttribute('color', new THREE.BufferAttribute(beltCol, 3));
const belt = new THREE.Points(beltGeo, new THREE.PointsMaterial({
  size:0.28, vertexColors:true, transparent:true, opacity:0.85, sizeAttenuation:true
}));
scene.add(belt);

// ---------------- starfield ----------------
function makeStars(count, size, rMin, rMax){
  const pos = new Float32Array(count*3);
  const col = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const v = new THREE.Vector3().randomDirection ? new THREE.Vector3().randomDirection()
      : new THREE.Vector3(R(-1,1),R(-1,1),R(-1,1)).normalize();
    v.multiplyScalar(R(rMin, rMax));
    pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z;
    const t = Math.random();
    const c = t<0.7 ? [1,1,1] : t<0.85 ? [0.7,0.85,1] : [1,0.9,0.75];
    const b = R(0.4,1);
    col[i*3]=c[0]*b; col[i*3+1]=c[1]*b; col[i*3+2]=c[2]*b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    size, vertexColors:true, sizeAttenuation:false, transparent:true, opacity:0.95, fog:false
  }));
}
scene.add(makeStars(2600, 1.6, 380, 900));
scene.add(makeStars(260, 2.8, 380, 900));

// faint nebula sprites for cinematic depth
[['#123a5e',-420,180,-520,760],['#3a1a5e',480,-140,-580,820],['#0e4a52',120,320,-640,700]].forEach(([col,x,y,z,s])=>{
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTex, color:col, transparent:true, opacity:0.09,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:false
  }));
  sp.position.set(x,y,z); sp.scale.set(s,s,1);
  scene.add(sp);
});

// faint ecliptic grid
const grid = new THREE.PolarGridHelper(78, 12, 6, 64, 0x1c3a55, 0x12253a);
grid.material.transparent = true;
grid.material.opacity = 0.22;
scene.add(grid);

// ---------------- time system ----------------
let simTime = Date.now();          // simulated clock (ms epoch), starts at "now"
let daysPerSec = 1.0;             // time warp: sim days per real second
let playing = true;

// ---------------- camera state ----------------
let camMode = 'free';             // 'free' | 'follow'
let followP = null;
let desiredRadius = null;
const sph = { theta: 0.8, phi: 1.02, radius: 78 };
const curTarget = new THREE.Vector3(0,0,0);
const ORIGIN = new THREE.Vector3(0,0,0);
camera.position.set(
  Math.sin(sph.phi)*Math.sin(sph.theta)*sph.radius,
  Math.cos(sph.phi)*sph.radius,
  Math.sin(sph.phi)*Math.cos(sph.theta)*sph.radius
);

// ---------------- HUD refs ----------------
const simDateEl = document.getElementById('simDate');
const utcClockEl = document.getElementById('utcClock');
const mjdEl = document.getElementById('mjd');
const camModeEl = document.getElementById('camMode');
const fpsEl = document.getElementById('fps');
const fpsBarEl = document.getElementById('fpsBar');
const warpLabelEl = document.getElementById('warpLabel');
const slider = document.getElementById('warpSlider');
const playBtn = document.getElementById('playBtn');
const infoPanel = document.getElementById('info');

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const pad = n => String(n).padStart(2,'0');

function fmtDPS(d){
  if(d >= 1000) return Math.round(d).toLocaleString() + ' DAYS';
  if(d >= 1)    return d.toFixed(1) + ' DAYS';
  if(d >= 0.01) return d.toFixed(3) + ' DAYS';
  return d.toExponential(2).replace('e','E') + ' DAYS';
}

function paintSlider(v){
  const pct = (v/1000*100).toFixed(1) + '%';
  slider.style.background = `linear-gradient(90deg, var(--cy) ${pct}, rgba(110,231,255,.15) ${pct})`;
}

function setWarp(d){
  daysPerSec = d;
  warpLabelEl.textContent = '1 S = ' + fmtDPS(d);
  const v = Math.round((Math.log10(d) + 3.5) / 7.5 * 1000);
  slider.value = v;
  paintSlider(v);
  document.querySelectorAll('.wpre[data-d]').forEach(b => {
    b.classList.toggle('active', Math.abs(parseFloat(b.dataset.d) - d) < 1e-9);
  });
}

document.querySelectorAll('.wpre[data-d]').forEach(b => {
  b.addEventListener('click', () => setWarp(parseFloat(b.dataset.d)));
});
document.getElementById('nowBtn').addEventListener('click', () => {
  simTime = Date.now();        // jump the sim clock to the present moment
  setWarp(1/86400);            // and run it in real time
});
slider.addEventListener('input', e => {
  const v = +e.target.value;
  setWarp(Math.pow(10, -3.5 + (v/1000)*7.5));
});
playBtn.addEventListener('click', togglePlay);
function togglePlay(){
  playing = !playing;
  playBtn.textContent = playing ? '❚❚' : '▶';
  playBtn.classList.toggle('paused', !playing);
}
window.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if(e.key === 'Escape') unfollow();
});

// ---------------- selection / follow ----------------
function updateNav(){
  document.querySelectorAll('.nav-item').forEach(b => {
    const n = b.dataset.name;
    b.classList.toggle('active', followP ? n === followP.name : false);
  });
  document.querySelector('.nav-item.overview').classList.toggle('active', !followP);
}

function startFollow(p){
  camMode = 'follow';
  followP = p;
  const rel = new THREE.Vector3().subVectors(camera.position, p.group.position);
  sph.radius = THREE.MathUtils.clamp(rel.length(), p.size*2.2, 500);
  sph.phi = THREE.MathUtils.clamp(Math.acos(THREE.MathUtils.clamp(rel.y/sph.radius,-1,1)), 0.05, Math.PI-0.05);
  sph.theta = Math.atan2(rel.x, rel.z);
  desiredRadius = null;
  camModeEl.textContent = 'FOLLOWING ' + p.name.toUpperCase();
  camModeEl.classList.add('following');
  updateNav();
}

function unfollow(){
  camMode = 'free';
  followP = null;
  desiredRadius = null;
  camModeEl.textContent = 'FREE CAMERA';
  camModeEl.classList.remove('following');
  infoPanel.classList.remove('open');
  updateNav();
}

function selectPlanet(p){
  startFollow(p);
  desiredRadius = Math.max(p.size*4.5, 2.4);
  openPanel(p);
}

function openPanel(p){
  const rows = [
    ['RADIUS', p.radiusKm], ['GRAVITY', p.gravity], ['DAY LENGTH', p.day],
    ['YEAR LENGTH', p.year], ['TEMPERATURE', p.temp], ['MOONS', p.moons]
  ].map(([k,v]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  infoPanel.innerHTML = `
    <button id="infoClose" title="Close">✕</button>
    <div class="p-head"><span class="p-dot" style="--c:${p.color}"></span><h2>${p.name.toUpperCase()}</h2></div>
    <div class="p-type">${p.type}</div>
    <p class="p-desc">${p.desc}</p>
    ${rows}
    <button id="pFocus">FOCUS CAMERA</button>
    <button id="pFree">RELEASE · FREE CAMERA</button>`;
  infoPanel.classList.add('open');
  document.getElementById('infoClose').addEventListener('click', () => infoPanel.classList.remove('open'));
  document.getElementById('pFocus').addEventListener('click', () => {
    desiredRadius = Math.max(p.size*4.5, 2.4);
  });
  document.getElementById('pFree').addEventListener('click', unfollow);
}

// nav clicks
document.querySelectorAll('.nav-item').forEach(b => {
  b.addEventListener('click', () => {
    const n = b.dataset.name;
    if(n === 'Overview'){ unfollow(); return; }
    const p = planets.find(pl => pl.name === n);
    if(p) selectPlanet(p);
  });
});

// ---------------- pointer controls (drag / zoom / raycast click) ----------------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let dragging = false, lx = 0, ly = 0, moved = 0;

function setNDC(e){
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0;
  lx = e.clientX; ly = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if(dragging){
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    sph.theta -= dx * 0.005;
    sph.phi = THREE.MathUtils.clamp(sph.phi - dy * 0.005, 0.05, Math.PI - 0.05);
    desiredRadius = null;
  } else {
    // hover cursor feedback
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    canvas.classList.toggle('hover-planet', raycaster.intersectObjects(hitMeshes).length > 0);
  }
});

canvas.addEventListener('pointerup', e => {
  dragging = false;
  canvas.classList.remove('dragging');
  if(moved < 6){                      // treat as click, not drag
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(hitMeshes);
    if(hits.length) selectPlanet(hits[0].object.userData.planet);
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.pow(1.0015, e.deltaY);
  const min = followP ? followP.size*2.2 : 3;
  const max = followP ? 400 : 520;
  sph.radius = THREE.MathUtils.clamp(sph.radius * f, min, max);
  desiredRadius = null;
}, { passive:false });

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---------------- animation loop ----------------
const clock = new THREE.Clock();
const v3 = new THREE.Vector3();
let frames = 0, lastFpsT = performance.now();

function updatePositions(simDays){
  planets.forEach(p => {
    const ang = (simDays / p.period) * Math.PI*2 + p.phase;
    const inc = p.tilt * 0.4;
    p.group.position.set(
      Math.cos(ang) * p.orbit,
      -Math.sin(ang) * p.orbit * Math.sin(inc),
      Math.sin(ang) * p.orbit * Math.cos(inc)
    );
    // axial rotation (Venus & Uranus retrograde)
    const dir = (p.rotHours < 0) ? -1 : 1;
    p.mesh.rotation.y = dir * (simDays / (Math.abs(p.rotHours)/24)) * Math.PI*2;
  });
  sunMesh.rotation.y = (simDays / 25.8) * Math.PI*2;
  belt.rotation.y = (simDays / 1641) * Math.PI*2;
  moon.position.set(
    Math.cos((simDays / 27.32) * Math.PI*2) * earth.size*3.2,
    0,
    Math.sin((simDays / 27.32) * Math.PI*2) * earth.size*3.2
  );
  // subtle sun glow pulse
  const pulse = 1 + Math.sin(performance.now()*0.0012)*0.03;
  sunGlow1.scale.set(15*pulse, 15*pulse, 1);
}

function updateLabels(){
  planets.forEach(p => {
    p.group.getWorldPosition(v3);
    v3.project(camera);
    if(v3.z > 1){ p.label.style.display = 'none'; return; }
    p.label.style.display = '';
    const x = ( v3.x*0.5 + 0.5) * window.innerWidth;
    const y = (-v3.y*0.5 + 0.5) * window.innerHeight;
    p.label.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px,${(y-18).toFixed(1)}px)`;
    p.label.classList.toggle('active', followP === p);
  });
}

function updateHUD(){
  const d = new Date(simTime);
  simDateEl.textContent = pad(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  const r = new Date();
  utcClockEl.textContent = pad(r.getUTCHours()) + ':' + pad(r.getUTCMinutes()) + ':' + pad(r.getUTCSeconds()) + ' UTC';
  mjdEl.textContent = 'MJD ' + (simTime/86400000 + 40587).toFixed(4);

  frames++;
  const now = performance.now();
  if(now - lastFpsT >= 500){
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    fpsEl.textContent = fps;
    fpsBarEl.style.transform = `scaleX(${Math.min(fps/120, 1)})`;
    frames = 0; lastFpsT = now;
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if(playing) simTime += daysPerSec * 86400000 * dt;

  updatePositions(simTime / 86400000);

  // camera
  if(camMode === 'follow' && followP){
    curTarget.copy(followP.group.position);
  } else {
    curTarget.lerp(ORIGIN, 0.06);
  }
  if(desiredRadius != null){
    sph.radius += (desiredRadius - sph.radius) * 0.08;
    if(Math.abs(desiredRadius - sph.radius) < 0.05) desiredRadius = null;
  }
  camera.position.set(
    curTarget.x + Math.sin(sph.phi)*Math.sin(sph.theta)*sph.radius,
    curTarget.y + Math.cos(sph.phi)*sph.radius,
    curTarget.z + Math.sin(sph.phi)*Math.cos(sph.theta)*sph.radius
  );
  camera.lookAt(curTarget);

  updateLabels();
  updateHUD();
  renderer.render(scene, camera);
}

setWarp(1.0);
updateNav();
animate();
</script>
