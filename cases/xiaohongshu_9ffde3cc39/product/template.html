<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>藻井之舞 · The Dance of the Caisson Ceiling</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; background: #000; }
  /* 加载幕：黑底 + 金环，就绪后淡出 —— 保证任何情况下都不会"黑屏不播放" */
  #loader {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.4s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .ring {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(216,164,65,.12); border-top-color: rgba(216,164,65,.85);
    animation: spin 1.1s linear infinite;
  }
  .ltext {
    margin-top: 20px; color: rgba(216,164,65,.5);
    font: 300 12px/1.5 "Songti SC", "STSong", "SimSun", serif;
    letter-spacing: .55em; text-indent: .55em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="loader"><div class="ring"></div><div class="ltext">藻井之舞</div></div>
<script>
'use strict';
/* ============================================================
   藻井之舞 · The Dance of the Caisson Ceiling
   ------------------------------------------------------------
   竖屏数字艺术页面：纯黑背景上，金色粒子从四散状态凝聚成
   藻井形制，保持片刻后坍缩飞散，再重组为下一种形制。
   9 种形制 × 1.12s ≈ 10s 循环；画面底部始终叠加观者剪影。
   ============================================================ */

/* 全局错误兜底：任何未捕获错误都强制开播（程序化形制），
   杜绝「脚本出错 → 黑屏不播放」。 */
window.addEventListener('error', function (e) {
  console.error('[zaojing]', e.message);
  if (typeof started !== 'undefined' && !started) {
    try {
      started = true;
      startedFallback = true;
      if (typeof resize === 'function') resize();
      if (typeof createParticles === 'function' && !particles.length) createParticles();
      if (typeof buildForms === 'function') buildForms(IMAGES.map(() => null));
      if (typeof startShow === 'function') startShow();
    } catch (err) { console.error('[zaojing] fallback failed', err); }
  }
}, true);

/* ---------- 素材 ----------
   藻井素材已降采样并内嵌为 data URI：
   1) file:// 直接打开时不存在跨域，canvas 不会被污染，
      getImageData 不会抛 SecurityError（否则就是黑屏）；
   2) 缓存命中时 data URI 立即可解，配合下方的健壮加载器，
      彻底规避「图片已缓存 → 加载逻辑挂起 → 黑屏不播放」。
   crop 为降采样图（宽 480）坐标系中的裁剪矩形 [l,t,r,b]：
   已裁掉顶部小红书水印（logo + 用户名）与底部标题黑带。 */
const IMAGES = [__IMAGES__];

/* ---------- 节奏 ---------- */
const FORM_COUNT  = IMAGES.length;                       // 形制数量 = 9
const T_CONVERGE  = 0.52;                                // 凝聚
const T_HOLD      = 0.32;                                // 保持
const T_COLLAPSE  = 0.28;                                // 坍缩飞散
const T_FORM      = T_CONVERGE + T_HOLD + T_COLLAPSE;    // 单个形制 1.12s
const TOTAL       = FORM_COUNT * T_FORM;                 // ≈ 10.08s

const SAMPLE_W    = 280;                                 // 采样画布宽
const PARTICLE_N   = 5200;                                 // 粒子数
const STAGE_ASPECT = 0.72;                               // 舞台宽高比（≈裁剪后素材）
const SPRITE_N    = 6;

/* ---------- 画布 ---------- */
const canvas   = document.getElementById('stage');
const ctx      = canvas.getContext('2d');
const loaderEl = document.getElementById('loader');

let W = 0, H = 0;
const stage = { x: 0, y: 0, w: 0, h: 0 };   // 藻井呈现区

function computeStage() {
  let sh = H * 0.94;
  let sw = sh * STAGE_ASPECT;
  const maxW = W * 0.965;
  if (sw > maxW) { sw = maxW; sh = sw / STAGE_ASPECT; }
  stage.w = sw; stage.h = sh;
  stage.x = (W - sw) / 2;
  stage.y = (H - sh) / 2;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeStage();
}
window.addEventListener('resize', resize);

/* ---------- 健壮的图片加载器（修复「缓存黑屏」） ----------
   经典 bug：页面把「开播」挂在 img.onload 上，但图片被浏览器缓存
   （或 <link rel="preload"> 预加载）时，img.complete 早已为 true，
   onload 不会再次触发（甚至在监听器绑定前就已触发），等待逻辑永远
   挂起 → 画面黑屏不播放。
   修复：
   1. 先绑定 onload / onerror，再赋 src；
   2. 赋 src 后的下一个 tick 主动复查 complete / naturalWidth，
      命中缓存则立即继续，绝不等一个不会再来的事件；
   3. 不依赖 window.load —— 脚本位于 body 末尾，load 可能早已触发；
   4. 8s 单图超时 + 全局 6.5s 强制开播兜底，任何情况下不会黑屏。 */
function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    let settled = false, timer = 0;
    const done = ok => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(ok ? img : null);
    };
    img.onload  = () => done(true);
    img.onerror = () => done(false);
    timer = setTimeout(() => done(false), 8000);
    img.src = src;
    // 缓存 / 预加载命中：complete 已就绪，onload 可能不会再触发
    setTimeout(() => { if (!settled && img.complete && img.naturalWidth > 0) done(true); }, 0);
  });
}

/* ---------- 像素采样 ----------
   把裁剪后的素材画到采样画布并逐像素读取：
   只保留「暖色且足够亮」的像素（金 / 橙 / 红），
   蓝色与暗部不参与 —— 粒子永远是金色。 */
function sampleForm(img, crop) {
  const l = crop[0], t = crop[1], r = crop[2], b = crop[3];
  const sw = r - l, sh = b - t;
  const outH = Math.max(2, Math.round(sh * (SAMPLE_W / sw)));
  const c = document.createElement('canvas');
  c.width = SAMPLE_W; c.height = outH;
  const cctx = c.getContext('2d', { willReadFrequently: true });
  cctx.drawImage(img, l, t, sw, sh, 0, 0, SAMPLE_W, outH);
  let d;
  try {
    d = cctx.getImageData(0, 0, SAMPLE_W, outH).data;
  } catch (e) {
    return null; // canvas 被污染（data URI 理论上不会）→ 调用方用程序化形制兜底
  }
  const pts = [];
  for (let y = 0; y < outH; y++) {
    for (let x = 0; x < SAMPLE_W; x++) {
      const i = (y * SAMPLE_W + x) * 4;
      const r8 = d[i], g8 = d[i + 1], b8 = d[i + 2];
      const lum = (r8 * 2126 + g8 * 7152 + b8 * 722) / 10000;
      if (lum > 95 && r8 > b8 + 4) pts.push({ x: x, y: y, lum: lum });
    }
  }
  return pts;
}

/* 程序化藻井兜底：同心环 + 放射辐瓣 + 中心团花，
   保证即使素材全部失败，也永远有形制可舞（不会黑屏）。 */
function proceduralForm(seed) {
  const pts = [];
  const cx = SAMPLE_W / 2;
  const cy = SAMPLE_W * STAGE_ASPECT / 2;
  const maxR = SAMPLE_W * 0.46;
  let s = (seed * 9973 + 7) >>> 0;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 2600; k++) {
    const pick = rnd();
    let x, y;
    if (pick < 0.55) {                       // 环带
      const ring = 1 + Math.floor(rnd() * 5);
      const a = rnd() * Math.PI * 2;
      x = cx + Math.cos(a) * (ring / 5) * maxR;
      y = cy + Math.sin(a) * (ring / 5) * maxR;
    } else if (pick < 0.85) {                // 放射辐条
      const a = Math.floor(rnd() * 24) / 24 * Math.PI * 2;
      const rr = SAMPLE_W * (0.12 + rnd() * 0.34);
      x = cx + Math.cos(a) * rr;
      y = cy + Math.sin(a) * rr;
    } else {                                 // 中心团花
      const a = rnd() * Math.PI * 2, rr = rnd() * SAMPLE_W * 0.1;
      x = cx + Math.cos(a) * rr;
      y = cy + Math.sin(a) * rr;
    }
    x = Math.max(0, Math.min(SAMPLE_W - 1, x));
    y = Math.max(0, Math.min(SAMPLE_W * STAGE_ASPECT - 1, y));
    pts.push({ x: x, y: y, lum: 120 });
  }
  return pts;
}

/* 把候选点固定抽成 n 个粒子目标（不足时抖动补齐） */
function pickPoints(pts, n) {
  const out = [];
  if (pts.length >= n) {
    for (let i = pts.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp;
    }
    for (let i = 0; i < n; i++) out.push(pts[i]);
  } else {
    for (let i = 0; i < n; i++) {
      const p = pts[i % pts.length];
      out.push({ x: p.x + (Math.random() - 0.5) * 3, y: p.y + (Math.random() - 0.5) * 3, lum: p.lum });
    }
  }
  return out;
}

/* ---------- 粒子 ---------- */
const particles = [];
let forms = [];   // forms[i] = { points: [...n 个目标点], outH }

function createParticles() {
  for (let i = 0; i < PARTICLE_N; i++) {
    particles.push({
      x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0,
      hx: 0, hy: 0,          // 四散起点
      lastX: 0, lastY: 0,    // 上一次坍缩的终点（用于下一次四散延续）
      delay: 0, phase: 0, swirlAmp: 0, swirlPhase: 0,
      size: 2, sprite: 0, alpha: 0,
      mode: 'gone', exploded: false, exT: 0, exX: 0, exY: 0
    });
  }
}

function buildForms(loaded) {
  forms = loaded.map((img, idx) => {
    let pts = img ? sampleForm(img, IMAGES[idx].crop) : null;
    if (!pts || pts.length < 50) pts = proceduralForm(idx + 1);
    const outH = img ? Math.max(2, Math.round((IMAGES[idx].crop[3] - IMAGES[idx].crop[1]) *
                     (SAMPLE_W / (IMAGES[idx].crop[2] - IMAGES[idx].crop[0]))))
                     : Math.round(SAMPLE_W * STAGE_ASPECT);
    return { points: pickPoints(pts, PARTICLE_N), outH: outH };
  });
}

/* 形制切换：所有粒子重新指向新形制的目标，并回到四散状态。
   四散起点沿用上一次坍缩的终点 —— 坍散 → 重聚是连续的舞蹈，
   而不是每次随机瞬移。 */
function retarget(fi) {
  const form = forms[fi];
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const tp = form.points[i];
    p.tx = stage.x + (tp.x / SAMPLE_W) * stage.w;
    p.ty = stage.y + (tp.y / form.outH) * stage.h;
    p.ix0 = p.tx; p.iy0 = p.ty;   // 坍缩起点兜底（markCollapseStarts 会用真实位置覆盖）
    p.delay = Math.random();
    p.phase = Math.random() * Math.PI * 2;
    p.swirlAmp = 14 + Math.random() * 42;
    p.swirlPhase = Math.random() * Math.PI * 2;
    p.size = 3.0 + Math.random() * 5.0;
    p.sprite = (Math.random() * SPRITE_N) | 0;
    p.mode = 'converge';
    p.alpha = 0;
    p.exploded = false;
    p.vx = 0; p.vy = 0;
    // 四散位置：以上次坍缩终点为基础，向外扩一点并加抖动
    let hx = (p.lastX || stage.x + stage.w / 2) + (Math.random() - 0.5) * 40;
    let hy = (p.lastY || stage.y + stage.h / 2) + (Math.random() - 0.5) * 40;
    hx = Math.max(stage.x - 0.35 * stage.w, Math.min(stage.x + 1.35 * stage.w, hx));
    hy = Math.max(stage.y - 0.35 * stage.h, Math.min(stage.y + 1.35 * stage.h, hy));
    p.hx = hx; p.hy = hy;
    p.x = hx; p.y = hy;
  }
}

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------- 更新 ---------- */
function update(fi, ft, dt, tAbs) {
  const cx = stage.x + stage.w / 2;
  const cy = stage.y + stage.h / 2;
  const collapseT = ft - T_CONVERGE - T_HOLD;   // 坍缩相位时间

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.mode === 'gone') continue;

    if (p.mode === 'converge') {
      // 凝聚：四散 → 目标，easeOutCubic，带螺旋收束
      const lt = clamp((ft - p.delay * 0.14) / (T_CONVERGE - 0.14), 0, 1);
      const e = 1 - Math.pow(1 - lt, 3);
      const sw = (1 - e) * p.swirlAmp;
      const ang = p.swirlPhase + tAbs * 2.4;
      p.x = p.hx + (p.tx - p.hx) * e + Math.cos(ang) * sw;
      p.y = p.hy + (p.ty - p.hy) * e + Math.sin(ang) * sw * 0.7;
      p.alpha = Math.min(1, lt * 4);
      if (lt >= 1) p.mode = 'hold';

    } else if (p.mode === 'hold') {
      // 保持：目标处呼吸 + 闪烁
      p.x = p.tx + Math.sin(tAbs * 2.2 + p.phase) * 1.7;
      p.y = p.ty + Math.cos(tAbs * 1.8 + p.phase * 1.3) * 1.7;
      p.alpha = 0.7 + 0.3 * Math.sin(tAbs * 5.2 + p.phase * 7);
      if (collapseT >= 0) { p.mode = 'collapse'; p.exploded = false; p.exT = 0; }

    } else if (p.mode === 'collapse') {
      if (!p.exploded) {
        // 坍缩：先向中心猛收一下
        const k = clamp(collapseT / 0.09, 0, 1);
        p.x = p.ix0 + (cx - p.ix0) * k * 0.22;
        p.y = p.iy0 + (cy - p.iy0) * k * 0.22;
        p.alpha = Math.min(1, 0.95 + k * 0.2);
        if (k >= 1) {
          p.exploded = true;
          p.exT = 0; p.exX = p.x; p.exY = p.y;
          let dx = p.x - cx, dy = p.y - cy;
          const d = Math.sqrt(dx * dx + dy * dy) || 1;
          const sp = 500 + Math.random() * 1100;
          p.vx = (dx / d) * sp + (Math.random() - 0.5) * 120;
          p.vy = (dy / d) * sp * 0.9 - 60 - Math.random() * 120;
        }
      } else {
        // 飞散：弹道外抛 + 微上扬，淡出
        p.exT += dt;
        p.x = p.exX + p.vx * p.exT;
        p.y = p.exY + p.vy * p.exT - 40 * p.exT * p.exT;
        p.alpha = 1 - p.exT / 0.20;
        if (p.alpha <= 0) {
          p.alpha = 0;
          p.mode = 'gone';
        }
      }
      p.lastX = p.x; p.lastY = p.y;
    }
  }
}

/* 记录坍缩起点（hold 结束瞬间的位置） */
function markCollapseStarts() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.mode === 'hold') { p.ix0 = p.x; p.iy0 = p.y; }
  }
}

/* ---------- 金色辉光精灵 ---------- */
function makeSprites() {
  const defs = [
    [255, 238, 200], [255, 224, 150], [255, 206, 96],
    [255, 186,  62], [238, 158,  38], [255, 214, 128]
  ];
  return defs.map(col => {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0,    'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',1)');
    g.addColorStop(0.35, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.42)');
    g.addColorStop(1,    'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
    x.fillStyle = g;
    x.fillRect(0, 0, 32, 32);
    return c;
  });
}
const SPRITES = makeSprites();

/* ---------- 观者剪影（画面底部始终叠加） ---------- */
function paintPerson(c, cx, baseY, headCY, headR, neckW, shoulderW, shoulderY, fill) {
  c.beginPath();
  c.moveTo(cx - shoulderW, baseY);
  c.lineTo(cx - shoulderW, shoulderY);
  c.bezierCurveTo(cx - shoulderW, shoulderY - (shoulderY - headCY) * 0.12,
                  cx - neckW * 1.25, headCY + headR * 0.72,
                  cx - neckW, headCY + headR * 0.6);
  c.lineTo(cx + neckW, headCY + headR * 0.6);
  c.bezierCurveTo(cx + neckW * 1.25, headCY + headR * 0.72,
                  cx + shoulderW, shoulderY - (shoulderY - headCY) * 0.12,
                  cx + shoulderW, shoulderY);
  c.lineTo(cx + shoulderW, baseY);
  c.closePath();
  c.moveTo(cx + headR, headCY);
  c.arc(cx, headCY, headR, 0, Math.PI * 2);
  c.fillStyle = fill;
  c.fill();
}

function drawViewer() {
  const Hh = Math.min(H * 0.215, W * 0.34);
  const baseY = H + Hh * 0.02;
  const cx = W / 2;
  const w = Hh * 0.46;
  const headR = Hh * 0.105;
  const headCY = baseY - Hh + headR * 1.04;
  const neckW = w * 0.17;
  const shoulderW = w * 0.5;
  const shoulderY = baseY - Hh * 0.40;

  ctx.save();
  // 背后氛围光：把剪影从黑底中托出
  const g = ctx.createRadialGradient(cx, headCY, 0, cx, headCY, Hh * 1.15);
  g.addColorStop(0, 'rgba(255,190,90,0.10)');
  g.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - Hh * 1.2, headCY - Hh * 1.2, Hh * 2.4, Hh * 2.4);

  // 金色轮廓光：向上偏移垫在黑色剪影下，形成顶部金边
  ctx.save();
  ctx.translate(0, -Math.max(1.5, Hh * 0.012));
  paintPerson(ctx, cx, baseY, headCY, headR, neckW, shoulderW, shoulderY, 'rgba(255,196,96,0.55)');
  ctx.restore();

  // 黑色剪影本体（最后绘制，始终叠加在画面底部）
  paintPerson(ctx, cx, baseY, headCY, headR, neckW, shoulderW, shoulderY, '#030303');
  ctx.restore();
}

/* ---------- 漂浮金尘（氛围连续性） ---------- */
const DUST_N = 70;
const dust = [];
for (let i = 0; i < DUST_N; i++) {
  dust.push({
    x: Math.random(), y: Math.random(),
    s: 0.5 + Math.random() * 1.6,
    vy: 0.004 + Math.random() * 0.010,
    ph: Math.random() * Math.PI * 2,
    a: 0.05 + Math.random() * 0.12
  });
}

function drawDust(tAbs) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < DUST_N; i++) {
    const d = dust[i];
    let y = (d.y - tAbs * d.vy) % 1;
    if (y < 0) y += 1;
    const x = (d.x + Math.sin(tAbs * 0.4 + d.ph) * 0.01 + 1) % 1;
    const tw = 0.6 + 0.4 * Math.sin(tAbs * 1.5 + d.ph * 3);
    ctx.globalAlpha = d.a * tw;
    ctx.drawImage(SPRITES[1], x * W - d.s, y * H - d.s, d.s * 2, d.s * 2);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 渲染 ---------- */
function holdK(ft) {
  if (ft < T_CONVERGE) return 0;
  if (ft < T_CONVERGE + T_HOLD) return Math.sin((ft - T_CONVERGE) / T_HOLD * Math.PI);
  return 0;
}

function render(fi, ft, tAbs, stride) {
  // 纯黑背景
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // 舞台中心氛围光（保持阶段呼吸）
  const hk = holdK(ft);
  const cx = stage.x + stage.w / 2, cy = stage.y + stage.h / 2;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(stage.w, stage.h) * 0.75);
  g.addColorStop(0, 'rgba(255,180,70,' + (0.05 + hk * 0.06).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,180,70,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 金色粒子（加法混合，越亮越叠加）
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i += stride) {
    const p = particles[i];
    if (p.alpha <= 0.003) continue;
    const tw = 0.85 + 0.3 * Math.sin(tAbs * 6 + p.phase);
    const s = p.size * tw;
    ctx.globalAlpha = Math.min(1, p.alpha);
    ctx.drawImage(SPRITES[p.sprite], p.x - s, p.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;

  // 观者剪影（始终叠加，最后绘制）
  drawViewer();

  // 金尘
  drawDust(tAbs);
}

/* ---------- 主循环 ---------- */
let startT = 0, lastT = 0, curForm = -1;
let qLevel = 2, qFrames = 0, qTimer = 0;   // 自适应画质

function frame(now) {
  requestAnimationFrame(frame);
  if (!startT) { startT = now; lastT = now; return; }
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  // 自适应画质：帧率不足时减少绘制粒子
  qFrames++; qTimer += dt;
  if (qTimer >= 2) {
    const fps = qFrames / qTimer;
    if (fps < 38 && qLevel > 0) qLevel--;
    else if (fps > 55 && qLevel < 2) qLevel++;
    qFrames = 0; qTimer = 0;
  }
  const stride = qLevel === 2 ? 1 : (qLevel === 1 ? 3 : 2);

  const t = ((now - startT) / 1000) % TOTAL;
  const fi = Math.floor(t / T_FORM);
  const ft = t - fi * T_FORM;
  if (fi !== curForm) {
    curForm = fi;
    retarget(fi);
  }
  if (ft >= T_CONVERGE + T_HOLD) markCollapseStarts();
  update(fi, ft, dt, now / 1000);
  render(fi, ft, now / 1000, stride);
}

/* ---------- 启动 ---------- */
let started = false, startedFallback = false;

function startShow() {
  started = true;
  loaderEl.classList.add('done');
  requestAnimationFrame(frame);
}

async function init() {
  resize();
  createParticles();
  const loaded = await Promise.all(IMAGES.map(im => loadImage(im.src)));
  buildForms(loaded);          // 用真实素材做像素采样
  if (startedFallback) { curForm = -1; return; }  // 兜底已开播 → 替换为真实形制
  if (!started) startShow();
}

// 脚本位于 body 末尾，直接执行 —— 不挂 window.load
// （缓存 / 预加载场景下 load 可能早已触发，等它就会黑屏）
init();

// 全局兜底：无论 init 因何卡住，6.5s 后强制开播（程序化形制），杜绝黑屏
setTimeout(() => {
  if (started) return;
  started = true;
  startedFallback = true;
  if (!particles.length) { resize(); createParticles(); }
  buildForms(IMAGES.map(() => null));
  startShow();
}, 6500);
</script>
</body>
</html>
