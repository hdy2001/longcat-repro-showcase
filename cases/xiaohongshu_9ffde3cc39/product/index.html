<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础参数 ================= */
const CAisson_Y = 4.6;          // 藻井中心高度
const N_PARTICLES = 4500;       // 星尘粒子数
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

/* ================= 渲染器 / 场景 ================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 12.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.6;
controls.maxDistance = 15;
controls.minPolarAngle = THREE.MathUtils.degToRad(93);   // 始终保持在下方仰视
controls.maxPolarAngle = THREE.MathUtils.degToRad(150);

/* 开场推镜 */
let introT = 0, userDrove = false;
const camFrom = new THREE.Vector3(0, 0.6, 13.2);
const camTo   = new THREE.Vector3(0, 1.35, 10.4);
controls.addEventListener('start', ()=> userDrove = true);

/* ================= 灯光 ================= */
scene.add(new THREE.AmbientLight(0x232838, 0.55));
scene.add(new THREE.HemisphereLight(0x2b3350, 0x0b0805, 0.5));
const keyLight = new THREE.PointLight(0xffb45e, 24, 0, 2);   // 藻井下方暖光
keyLight.position.set(0, 3.1, 0);
scene.add(keyLight);
const topLight = new THREE.PointLight(0x8a7a55, 10, 0, 2);
topLight.position.set(0, 8.5, 0);
scene.add(topLight);
const blueLight = new THREE.PointLight(0x2a4fd0, 9, 0, 2);   // 冷蓝补光
blueLight.position.set(5.5, 5.0, -4.5);
scene.add(blueLight);

/* ================= 材质 ================= */
const MAT = {
  gold:     new THREE.MeshStandardMaterial({ color:0xd8a83c, metalness:0.82, roughness:0.30, emissive:0x9a6200, emissiveIntensity:0.5, side:THREE.DoubleSide }),
  goldHot:  new THREE.MeshStandardMaterial({ color:0xe8bc55, metalness:0.85, roughness:0.22, emissive:0xc07e00, emissiveIntensity:0.72 }),
  dragonGold: new THREE.MeshStandardMaterial({ color:0xd8a83c, metalness:0.25, roughness:0.78, emissive:0x8a5800, emissiveIntensity:0.4 }),
  red:      new THREE.MeshStandardMaterial({ color:0x8f1f1f, metalness:0.15, roughness:0.55, emissive:0x360707, emissiveIntensity:0.55, side:THREE.DoubleSide }),
  redDeep:  new THREE.MeshStandardMaterial({ color:0x571010, metalness:0.10, roughness:0.62, emissive:0x240404, emissiveIntensity:0.5,  side:THREE.DoubleSide }),
  blue:     new THREE.MeshStandardMaterial({ color:0x2450b8, metalness:0.25, roughness:0.5,  emissive:0x0e2a6e, emissiveIntensity:0.8,  side:THREE.DoubleSide }),
  lacquer:  new THREE.MeshStandardMaterial({ color:0x0b0b0d, metalness:0.0,  roughness:1.0 }),
};

/* ================= 工具函数 ================= */
function ringPoly(r, y, n=96, rot=0){
  const p=[]; for(let i=0;i<n;i++){ const a=rot+i/n*Math.PI*2; p.push(V(Math.cos(a)*r, y, Math.sin(a)*r)); } return p;
}
function squarePoly(h, y){
  return [V(-h,y,-h), V(h,y,-h), V(h,y,h), V(-h,y,h)];
}
function polyLen(pts, closed){
  let L=0; const n=pts.length, m=closed?n:n-1;
  for(let i=0;i<m;i++) L+=pts[i].distanceTo(pts[(i+1)%n]);
  return L;
}
function box(w,h,d,x=0,y=0,z=0){ const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); return g; }

/* ================= 金龙（团龙盘绕，面向下方） ================= */
function buildDragon(){
  const g = new THREE.Group();

  class Spiral extends THREE.Curve {
    getPoint(t){
      const turns=2.3, a=t*Math.PI*2*turns, r=0.15+0.52*t;
      return V(Math.cos(a)*r, 0, Math.sin(a)*r);
    }
  }
  const body = new THREE.Mesh(new THREE.TubeGeometry(new Spiral(), 240, 0.042, 10, false), MAT.dragonGold);
  body.position.y = -0.06;
  g.add(body);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.16, 8), MAT.gold);
  const tp = new Spiral().getPoint(1);
  tail.position.set(tp.x, -0.06, tp.z);
  tail.rotation.z = Math.PI; g.add(tail);

  // 龙首（螺旋内端，朝切线方向）
  const head = new THREE.Group();
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.088, 20, 16), MAT.gold);
  skull.scale.set(1, 0.82, 1.18); head.add(skull);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.05, 0.11), MAT.gold);
  snout.position.set(0, -0.012, 0.1); head.add(snout);
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.08), MAT.goldHot);
  jaw.position.set(0, -0.045, 0.085); head.add(jaw);
  for(const s of [-1,1]){
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.15, 8), MAT.gold);
    horn.position.set(s*0.045, 0.085, -0.045);
    horn.rotation.set(-0.7, 0, s*0.5); head.add(horn);
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.02, 10, 8),
      new THREE.MeshStandardMaterial({ color:0x000000, emissive:0xff5a1a, emissiveIntensity:2.4 }));
    eye.position.set(s*0.062, 0.02, 0.075); head.add(eye);
    const whisk = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(
        V(s*0.05,-0.02,0.1), V(s*0.14,-0.05,0.16), V(s*0.2,-0.02,0.1)), 12, 0.008, 6),
      MAT.gold);
    head.add(whisk);
  }
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const mane = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.09, 6), MAT.goldHot);
    mane.position.set(Math.cos(a)*0.085, 0.03, Math.sin(a)*0.085-0.02);
    mane.rotation.set(Math.sin(a)*0.9, 0, -Math.cos(a)*0.9);
    head.add(mane);
  }
  const hp = new Spiral().getPoint(0);
  const tan = new Spiral().getTangent(0);
  head.position.set(hp.x, -0.09, hp.z);
  head.quaternion.setFromUnitVectors(V(0,0,1), tan.setY(0).normalize());
  g.add(head);

  // 四爪
  for(const t of [0.32, 0.48, 0.63, 0.78]){
    const p = new Spiral().getPoint(t);
    const limb = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(
      V(p.x,-0.05,p.z), V(p.x*1.35,-0.1,p.z*1.35), V(p.x*1.5,-0.13,p.z*1.5)), 10, 0.02, 6), MAT.gold);
    g.add(limb);
    for(let k=0;k<3;k++){
      const a = k/3*Math.PI*2;
      const toe = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.07, 6), MAT.goldHot);
      toe.position.set(p.x*1.5+Math.cos(a)*0.035, -0.13, p.z*1.5+Math.sin(a)*0.035);
      toe.rotation.set(Math.PI/2*0.4*Math.sin(a), 0, -Math.PI/2*0.4*Math.cos(a));
      g.add(toe);
    }
  }
  // 火焰宝珠
  const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.048, 16, 12),
    new THREE.MeshStandardMaterial({ color:0x332200, emissive:0xffc95a, emissiveIntensity:1.5, roughness:0.3 }));
  pearl.position.set(0.44, -0.12, 0.18);
  g.add(pearl);
  g.userData.pearl = pearl;
  return g;
}

/* ================= 藻井构建（三种形制） ================= */
const caisson = new THREE.Group();
caisson.position.y = CAisson_Y;
scene.add(caisson);
let layers = { frame:null, beams:null, center:null };
let currentForm = 'circle';
let sampler = null;

function M(geo, mat, x=0, y=0, z=0){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); return m; }
function makeDougong(colors){
  const geos=[ box(0.17,0.09,0.17), box(0.07,0.08,0.17, 0.085,0.08,0), box(0.07,0.08,0.17, -0.085,0.08,0), box(0.24,0.06,0.24, 0,0.15,0) ];
  const n=colors.length;
  const inst=new THREE.InstancedMesh(mergeGeometries(geos), MAT.red, n);
  const c=new THREE.Color();
  for(let i=0;i<n;i++) inst.setColorAt(i, c.set(colors[i]));
  return inst;
}

/* ---- 圆形穹顶 ---- */
function buildCircle(){
  const frame=new THREE.Group(), beams=new THREE.Group(), center=new THREE.Group();
  // 外层檐口：双环 + 檐壁 + 蓝彩带
  frame.add(M(new THREE.TorusGeometry(3.28, 0.07, 10, 110).rotateX(Math.PI/2), MAT.gold, 0, 0.02, 0));
  frame.add(M(new THREE.TorusGeometry(3.02, 0.055, 10, 110).rotateX(Math.PI/2), MAT.gold, 0, -0.05, 0));
  frame.add(M(new THREE.CylinderGeometry(3.3, 3.3, 0.24, 110, 1, true), MAT.red, 0, 0.1, 0));
  frame.add(M(new THREE.CylinderGeometry(2.92, 2.92, 0.1, 110, 1, true), MAT.blue, 0, 0.05, 0));
  // 斗拱层：32 攒（红金蓝相间）
  const dgColors=[]; for(let i=0;i<32;i++) dgColors.push(i%8===7?0x2a4f9f:(i%8===6?0xc9962e:0x8f1f1f));
  const dougong = makeDougong(dgColors);
  const dummy = new THREE.Object3D();
  for(let i=0;i<32;i++){
    const a=i/32*Math.PI*2;
    dummy.position.set(Math.cos(a)*2.52, -0.14, Math.sin(a)*2.52);
    dummy.rotation.set(0,-a+Math.PI/2,0);
    dummy.updateMatrix(); dougong.setMatrixAt(i, dummy.matrix);
  }
  dougong.instanceMatrix.needsUpdate = true;
  frame.add(dougong);
  // 放射梁架：24 根放射梁
  const spokes = new THREE.InstancedMesh(box(2.1, 0.05, 0.085, 1.85, -0.06, 0), MAT.gold, 24);
  for(let i=0;i<24;i++){
    const a=i/24*Math.PI*2;
    dummy.position.set(0,0,0); dummy.rotation.set(0,-a,0); dummy.updateMatrix();
    spokes.setMatrixAt(i, dummy.matrix);
  }
  spokes.instanceMatrix.needsUpdate = true;
  beams.add(spokes);
  // 同心环（井格）
  for(const r of [1.45, 2.15, 2.85])
    beams.add(M(new THREE.TorusGeometry(r, 0.032, 8, 100).rotateX(Math.PI/2), MAT.gold, 0, -0.08, 0));
  // 梯形花板（红底）
  const sector = Math.PI*2/24, gap = sector*0.16;
  const panelGeo = new THREE.RingGeometry(0.95, 2.9, 6, 1, 0, sector-gap*2).rotateX(Math.PI/2);
  const panels = new THREE.InstancedMesh(panelGeo, MAT.redDeep, 24);
  for(let i=0;i<24;i++){
    dummy.position.set(0,-0.03,0); dummy.rotation.set(0,-(i*sector+gap),0); dummy.updateMatrix();
    panels.setMatrixAt(i, dummy.matrix);
  }
  panels.instanceMatrix.needsUpdate = true;
  beams.add(panels);
  // 花板金徽
  const meds = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.13, 0.13, 0.025, 20), MAT.goldHot, 24);
  for(let i=0;i<24;i++){
    const a=(i+0.5)/24*Math.PI*2;
    dummy.position.set(Math.cos(a)*2.52, -0.075, Math.sin(a)*2.52);
    dummy.rotation.set(0,0,0); dummy.updateMatrix();
    meds.setMatrixAt(i, dummy.matrix);
  }
  meds.instanceMatrix.needsUpdate = true;
  beams.add(meds);
  // 中心：圆盘 + 金龙
  center.add(M(new THREE.CylinderGeometry(0.82, 0.82, 0.07, 48), MAT.redDeep, 0, -0.02, 0));
  center.add(M(new THREE.TorusGeometry(0.82, 0.035, 8, 60).rotateX(Math.PI/2), MAT.gold, 0, -0.05, 0));
  const dragon = buildDragon();
  center.add(dragon);
  center.userData.dragon = dragon;
  return { frame, beams, center, features: circleFeatures() };
}

/* ---- 方形井格 ---- */
function buildSquare(){
  const frame=new THREE.Group(), beams=new THREE.Group(), center=new THREE.Group();
  const h=3.05;
  // 外框檐口：四根金梁 + 蓝彩带 + 角柱
  for(const s of [-1,1]){
    frame.add(M(box(2*h+0.3, 0.19, 0.17), MAT.gold, 0, 0.02, s*h));
    frame.add(M(box(0.19, 0.17, 2*h+0.3), MAT.gold, s*h, 0.02, 0));
    frame.add(M(box(2*h-0.9, 0.08, 0.05), MAT.blue, 0, -0.16, s*(h-0.33)));
    frame.add(M(box(0.05, 0.08, 2*h-0.9), MAT.blue, s*(h-0.33), -0.16, 0));
    for(const t of [-1,1]){
      const post = M(new THREE.CylinderGeometry(0.08, 0.1, 0.62, 10), MAT.red, s*h*0.98, -0.3, t*h*0.98);
      frame.add(post);
    }
  }
  // 斗拱：角部与边中 8 攒
  const dgColors=[]; for(let i=0;i<8;i++) dgColors.push(i%2?0x8f1f1f:0xc9962e);

/* ---- 八角重檐 ---- */
function buildOctagon(){
  const frame=new THREE.Group(), beams=new THREE.Group(), center=new THREE.Group();
  const R=3.1, apo=R*Math.cos(Math.PI/8), segLen=2*apo*Math.tan(Math.PI/8)+0.2;
  // 外檐八角环 + 蓝带 + 外环
  frame.add(M(new THREE.TorusGeometry(2.98, 0.05, 8, 80).rotateX(Math.PI/2), MAT.gold, 0, 0.06, 0));
  for(let i=0;i<8;i++){
    const a=(i+0.5)/8*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
    const b = M(box(segLen, 0.19, 0.17), MAT.gold, ca*apo, 0.02, sa*apo);
    b.rotation.y = -a; frame.add(b);
    const band = M(box(segLen*0.9, 0.08, 0.05), MAT.blue, ca*apo*0.83, -0.12, sa*apo*0.83);
    band.rotation.y = -a; frame.add(band);
  }
  // 斗拱 16 攒
  const dgColors=[]; for(let i=0;i<16;i++) dgColors.push(i%4===3?0x2a4f9f:(i%4===2?0xc9962e:0x8f1f1f));
  const dougong = makeDougong(dgColors);
  const dummy = new THREE.Object3D();
  for(let i=0;i<16;i++){
    const a=(i+0.5)/16*Math.PI*2;
    dummy.position.set(Math.cos(a)*2.32, -0.13, Math.sin(a)*2.32);
    dummy.rotation.set(0,-a+Math.PI/2,0);
    dummy.updateMatrix(); dougong.setMatrixAt(i, dummy.matrix);
  }
  dougong.instanceMatrix.needsUpdate = true;
  frame.add(dougong);
  // 八主梁 + 八间梁
  const spokes = new THREE.InstancedMesh(box(2.3, 0.055, 0.09, 1.875, -0.06, 0), MAT.gold, 16);
  for(let i=0;i<16;i++){
    const a=(i%8+(i>=8?0.5:0))/8*Math.PI*2;
    dummy.position.set(0,0,0); dummy.rotation.set(0,-a,0); dummy.updateMatrix();
    spokes.setMatrixAt(i, dummy.matrix);
  }
  spokes.instanceMatrix.needsUpdate = true;
  beams.add(spokes);
  // 内环 + 中环
  beams.add(M(new THREE.TorusGeometry(1.6, 0.035, 8, 80).rotateX(Math.PI/2), MAT.gold, 0, -0.08, 0));
  const inApo=2.32*Math.cos(Math.PI/8), seg2=2*inApo*Math.tan(Math.PI/8)+0.1;
  for(let i=0;i<8;i++){
    const a=(i+0.5)/8*Math.PI*2;
    const b = M(box(seg2, 0.05, 0.08), MAT.gold, Math.cos(a)*inApo, -0.04, Math.sin(a)*inApo);
    b.rotation.y = -a; beams.add(b);
  }
  // 八面梯形花板（红底）
  const panelVerts=[], idx=[]; let vi=0;
  const half=Math.PI/8*0.78, r0=1.62, r1=2.95;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const p=(r,ang)=>[Math.cos(ang)*r, -0.03, Math.sin(ang)*r];
    const v=[p(r1,a-half),p(r1,a+half),p(r0,a+half),p(r0,a-half)];
    for(const vv of v) panelVerts.push(...vv);
    idx.push(vi,vi+1,vi+2, vi,vi+2,vi+3); vi+=4;
  }
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.Float32BufferAttribute(panelVerts,3));
  pg.setIndex(idx); pg.computeVertexNormals();
  beams.add(new THREE.Mesh(pg, MAT.redDeep));
  // 花板金徽
  for(let i=0;i<8;i++){
    const a=(i+0.5)/8*Math.PI*2, r=2.28;
    beams.add(M(new THREE.CylinderGeometry(0.32,0.32,0.03,24), MAT.goldHot, Math.cos(a)*r, -0.065, Math.sin(a)*r));
    beams.add(M(new THREE.TorusGeometry(0.32,0.028,6,32).rotateX(Math.PI/2), MAT.gold, Math.cos(a)*r, -0.05, Math.sin(a)*r));
  }
  // 中心圆盘 + 金龙
  center.add(M(new THREE.CylinderGeometry(0.8, 0.8, 0.07, 48), MAT.redDeep, 0, -0.02, 0));
  center.add(M(new THREE.TorusGeometry(0.8, 0.035, 8, 60).rotateX(Math.PI/2), MAT.gold, 0, -0.05, 0));
  const dragon = buildDragon();
  center.add(dragon); center.userData.dragon = dragon;
  return { frame, beams, center, features: octFeatures() };
}

/* ---- 采样器 ---- */
function buildSampler(features){
  let total=0;
  for(const it of features){
    if(it.pts){
      it.len=polyLen(it.pts, it.closed); it.cum=[]; let acc=0;
      const n=it.pts.length, m=it.closed?n:n-1;
      for(let i=0;i<m;i++){ acc+=it.pts[i].distanceTo(it.pts[(i+1)%n]); it.cum.push(acc); }
    }
    total+=it.w; it.start=total-it.w;
  }
  return function(out){
    const r=Math.random()*total;
    let it=features[features.length-1];
    for(const f of features){ if(r>=f.start && r<f.start+f.w){ it=f; break; } }
    if(it.disc){
      const a=Math.random()*Math.PI*2, rr=it.disc.r*Math.sqrt(Math.random());
      out.set(it.disc.c.x+Math.cos(a)*rr, it.disc.c.y+(Math.random()-0.5)*0.06, it.disc.c.z+Math.sin(a)*rr);
    } else if(it.square){
      out.set(it.c.x+(Math.random()*2-1)*it.half, it.c.y+(Math.random()-0.5)*0.05, it.c.z+(Math.random()*2-1)*it.half);
    } else if(it.tri){
      let u=Math.random(), v=Math.random();
      if(u+v>1){ u=1-u; v=1-v; }
      const A=it.tri.a, B=it.tri.b, C=it.tri.c;
      out.set(A.x+u*(B.x-A.x)+v*(C.x-A.x), A.y+(Math.random()-0.5)*0.05, A.z+u*(B.z-A.z)+v*(C.z-A.z));
    } else {
      const d=Math.random()*it.len; let i=0;
      while(i<it.cum.length-1 && it.cum[i]<d) i++;
      const p0=it.pts[i%it.pts.length], p1=it.pts[(i+1)%it.pts.length];
      const segLen=i<it.cum.length?(it.cum[i]-(i?it.cum[i-1]:0)):p0.distanceTo(p1);
      const t=segLen>0?THREE.MathUtils.clamp((d-(i?it.cum[i-1]:0))/segLen,0,1):0;
      out.lerpVectors(p0,p1,t);
      out.x+=(Math.random()-0.5)*0.06; out.y+=(Math.random()-0.5)*0.05; out.z+=(Math.random()-0.5)*0.06;
    }
    return out;
  };
}

    if(layers[k]){ caisson.remove(layers[k]); layers[k].traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
    layers[k]=built[k]; caisson.add(built[k]);

  sampler=buildSampler(built.features);

  }

/* ================= 粒子循环状态机 ================= */
let phase='intro', phaseT=0, gather=0;
const DUR={ intro:3.2, hold:5.5, collapse:2.4, rebirth:3.6 };
const easeIO=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function updateParticles(dt, t){
  const K=0.5;
  for(let i=0;i<N_PARTICLES;i++){
    if(ringMode){
      const s=seedArr[i], rv=easeIO(ringV);
      posArr[i*3]  =ringFrom[i*3]  +(ringArr[i*3]  -ringFrom[i*3])  *rv + Math.sin(t*0.7+s)*0.03;
      posArr[i*3+1]=ringFrom[i*3+1]+(ringArr[i*3+1]-ringFrom[i*3+1])*rv + Math.sin(t*0.9+s*1.3)*0.04;
      posArr[i*3+2]=ringFrom[i*3+2]+(ringArr[i*3+2]-ringFrom[i*3+2])*rv + Math.cos(t*0.6+s*0.7)*0.03;
      alphaArr[i]=(0.92+(0.5-0.92)*rv)+0.16*Math.sin(t*1.4+s);
      continue;
    }
    let p=(gather*(1+K)-delayArr[i]*K);
    p=p<0?0:p>1?1:p;
    const e=p*p*(3-2*p);
    const s=seedArr[i];
    const wob=0.02+(1-e)*0.12;
    posArr[i*3]  =scatterArr[i*3]  +(targetArr[i*3]  -scatterArr[i*3])  *e + Math.sin(t*1.3+s)*wob;
    posArr[i*3+1]=scatterArr[i*3+1]+(targetArr[i*3+1]-scatterArr[i*3+1])*e + Math.cos(t*1.1+s*1.7)*wob*0.7;
    posArr[i*3+2]=scatterArr[i*3+2]+(targetArr[i*3+2]-scatterArr[i*3+2])*e + Math.sin(t*0.9+s*2.3)*wob;
    alphaArr[i]=0.92*THREE.MathUtils.smoothstep(e,0.18,0.8);
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.aAlpha.needsUpdate=true;
}

/* ================= 终章 ================= */
const finaleEl=document.getElementById('finale');
const replayBtn=document.getElementById('replay');
const finaleBtn=document.getElementById('finaleBtn');
let finaleShown=false;
function enterFinale(){
  if(finaleShown) return;
  finaleShown=true;
  ringMode=true; ringV=0;
  ringFrom.set(posArr);
  buildRingTargets();
  finaleEl.classList.add('show');
  replayBtn.classList.add('show');
  const forms=document.getElementById('forms');
  forms.style.opacity=0.25; forms.style.pointerEvents='none';
}
function exitFinale(){
  finaleShown=false;
  ringMode=false;
  scatterArr.set(posArr);          // 从圆环平滑飞回、重新聚合
  finaleEl.classList.remove('show');
  replayBtn.classList.remove('show');
  const forms=document.getElementById('forms');
  forms.style.opacity=1; forms.style.pointerEvents='auto';
  phase='intro'; phaseT=0; gather=0;
}
finaleBtn.addEventListener('click', enterFinale);
replayBtn.addEventListener('click', exitFinale);

/* ================= UI 事件 ================= */
let userSwitched=false;
document.querySelectorAll('.feat-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ userSwitched=true; setForm(b.dataset.form); });
});
addEventListener('keydown', e=>{
  if(e.key==='1'){ userSwitched=true; setForm('circle'); }
  if(e.key==='2'){ userSwitched=true; setForm('square'); }
  if(e.key==='3'){ userSwitched=true; setForm('octagon'); }
  if(e.key==='Escape' && finaleShown) exitFinale();
});
setTimeout(()=>finaleBtn.classList.add('show'), 5000);
setTimeout(()=>{ if(!userSwitched && !finaleShown) enterFinale(); }, 30000);

/* ================= 后期：泛光 ================= */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.62, 0.5, 0.55);
if(new URLSearchParams(location.search).get('nobloom')) bloom.enabled=false;
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let firstFrame=true;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  if(!userDrove && introT<1){
    introT=Math.min(1,introT+dt/4.5);
    camera.position.lerpVectors(camFrom,camTo,easeIO(introT));
  }

  // 状态机：聚合成形 → 坍缩消散 → 再重生
  phaseT+=dt;
  const k=Math.min(phaseT/DUR[phase],1);
  switch(phase){
    case 'intro':   gather=easeIO(k); if(k>=1){phase='hold';phaseT=0;} break;
    case 'hold':    gather=1; if(k>=1){phase='collapse';phaseT=0; regenScatter();} break;
    case 'collapse':gather=1-easeIO(k);
      if(k>=1){
        if(pendingForm){ mount(pendingForm); pendingForm=null; }
        phase='rebirth'; phaseT=0;
      } break;
    case 'rebirth': gather=easeIO(k); if(k>=1){phase='hold';phaseT=0;} break;
  }
  if(ringMode && ringV<1) ringV=Math.min(1,ringV+dt/1.8);

  // 分层差速旋转（藻井之“舞”）
  if(layers.frame) layers.frame.rotation.y += dt*0.022;
  if(layers.beams) layers.beams.rotation.y += dt*0.05;
  if(layers.center && layers.center.userData.dragon){
    layers.center.userData.dragon.rotation.y -= dt*0.14;
    const pearl=layers.center.userData.dragon.userData.pearl;
    if(pearl) pearl.material.emissiveIntensity=1.5+Math.sin(t*2.2)*0.55;
  }
  keyLight.intensity=24+Math.sin(t*0.8)*2.5;

  updateParticles(dt,t);
  controls.update();
  composer.render();

  if(firstFrame){
    firstFrame=false;
    document.getElementById('loading').classList.add('hide');
  }
}

/* ================= 启动 ================= */
mount('circle');
animate();
window.__dbg = { posArr, ringArr, scatterArr, get ringMode(){return ringMode}, get ringV(){return ringV}, get gather(){return gather}, get phase(){return phase}, get finaleShown(){return finaleShown} };

/* 仅测试钩子：?form=square / ?finale=1 */
const __qs = new URLSearchParams(location.search);
if (__qs.get('form')) setTimeout(()=>setForm(__qs.get('form')), 100);
if (__qs.get('finale')==='1') setTimeout(()=>enterFinale(), 800);

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});
</script>
</body>
