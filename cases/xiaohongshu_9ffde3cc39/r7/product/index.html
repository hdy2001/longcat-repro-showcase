<body>
<canvas id="c"></canvas>

<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ================================================================
   藻井之舞 —— 中国传统藻井 3D 交互
   结构：外层檐口 → 斗拱层 → 放射梁架 → 中心金龙
   三种形制由极径函数 Out(θ) 统一驱动：圆形 / 方形 / 六角·八角
   ================================================================ */

const canvas = document.getElementById('c');
const fallbackEl = document.getElementById('fallback');
window.__booted = false;
setTimeout(() => { if (!window.__booted) fallbackEl.hidden = false; }, 5000);

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: false, alpha: false, powerPreference: 'high-performance'
});
const isGL2 = renderer.capabilities.isWebGL2;
const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;          // 色调映射在合成通道完成
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 80);

/* 灯光：环境冷色 + 下方暖金主光 + 井心金龙辉光 */
scene.add(new THREE.AmbientLight(0x2a3350, 0.85));
const keyLight = new THREE.PointLight(0xffd9a0, 90, 40, 2);
keyLight.position.set(0, -2.5, 3.5);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x6f86ff, 26, 30, 2);
rimLight.position.set(-6, 5, -5);
scene.add(rimLight);
const coreLight = new THREE.PointLight(0xffc860, 55, 16, 2);
coreLight.position.set(0, 2.6, 0);
scene.add(coreLight);

/* ---------------- 自写轨道控制（拖拽环绕 + 缩放） ---------------- */
class SimpleOrbit {
  constructor(cam, dom, target) {
    this.cam = cam; this.dom = dom;
    this.target = target.clone();
    this.dist = 7.5; this.pol = 2.35; this.az = 0.06;      // 初始：藻井正下方仰视
    this.tDist = this.dist; this.tPol = this.pol; this.tAz = this.az;
    this.minPol = 0.75; this.maxPol = 2.78; this.minDist = 4.2; this.maxDist = 15;
    this.dragging = false; this.lastX = 0; this.lastY = 0;
    this.idleTime = 10; this.autoBlend = 1;                  // 初始即缓慢环绕
    this.pointers = new Map(); this.pinchD = 0;
    dom.addEventListener('pointerdown', e => this.onDown(e));
    window.addEventListener('pointermove', e => this.onMove(e));
    window.addEventListener('pointerup', e => this.onUp(e));
    window.addEventListener('pointercancel', e => this.onUp(e));
    dom.addEventListener('wheel', e => {
      e.preventDefault();
      this.tDist = THREE.MathUtils.clamp(this.tDist * (1 + Math.sign(e.deltaY) * 0.09),
        this.minDist, this.maxDist);
      this.idleTime = 0;
    }, { passive: false });
  }
  onDown(e) {
    this.dom.classList.add('drag');
    this.pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (this.pointers.size === 1) { this.dragging = true; this.lastX = e.clientX; this.lastY = e.clientY; }
    if (this.pointers.size === 2) {
      const p = [...this.pointers.values()];
      this.pinchD = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
    }
    this.idleTime = 0;
  }
  onMove(e) {
    if (!this.pointers.has(e.pointerId)) return;
    this.pointers.set(e.pointerId, [e.clientX, e.clientY]);
    this.idleTime = 0;
    if (this.pointers.size === 2) {
      const p = [...this.pointers.values()];
      const d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
      if (this.pinchD > 0) this.tDist = THREE.MathUtils.clamp(this.tDist * this.pinchD / d,
        this.minDist, this.maxDist);
      this.pinchD = d;
      return;
    }
    if (!this.dragging) return;
    const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
    this.lastX = e.clientX; this.lastY = e.clientY;
    this.tAz -= dx * 0.0052;
    this.tPol = THREE.MathUtils.clamp(this.tPol - dy * 0.0052, this.minPol, this.maxPol);
  }
  onUp(e) {
    this.pointers.delete(e.pointerId);
    if (this.pointers.size === 0) { this.dragging = false; this.dom.classList.remove('drag'); }
    if (this.pointers.size < 2) this.pinchD = 0;
  }
  update(dt) {
    this.idleTime += dt;
    const wantAuto = this.idleTime > 4 ? 1 : 0;             // 静置 4 秒后缓慢自动环绕
    this.autoBlend += (wantAuto - this.autoBlend) * Math.min(1, dt * 1.5);
    this.tAz += 0.05 * this.autoBlend * dt;
    const k = Math.min(1, dt * 7.5);
    this.az += (this.tAz - this.az) * k;
    this.pol += (this.tPol - this.pol) * k;
    this.dist += (this.tDist - this.dist) * k;
    const sp = Math.sin(this.pol);
    this.cam.position.set(
      this.target.x + this.dist * sp * Math.sin(this.az),
      this.target.y + this.dist * Math.cos(this.pol),
      this.target.z + this.dist * sp * Math.cos(this.az)
    );
    this.cam.lookAt(this.target);
  }
}
const TARGET0 = new THREE.Vector3(0, 1.2, 0);
const orbit = new SimpleOrbit(camera, canvas, TARGET0);

/* ---------------- 形制（极径函数） ---------------- */
const TAU = Math.PI * 2;
function shapeRadius(theta, shape, R) {
  const c = Math.cos(theta), s = Math.sin(theta);
  if (shape === 'circle') return R;
  if (shape === 'square') {
    const p = 4.2;
    return R / Math.pow(Math.pow(Math.abs(c), p) + Math.pow(Math.abs(s), p), 1 / p);
  }
  const k = shape === 'hex' ? Math.PI / 3 : Math.PI / 4;
  const seg = shape === 'hex' ? 3 : 4;
  let t = ((theta % k) + k) % k - k / 2;
  return R * Math.cos(k / 2) / Math.cos(t);
}
const OUT_LUT = new Float32Array(512);
function buildLUT(shape) {
  for (let i = 0; i < 512; i++) OUT_LUT[i] = shapeRadius(i / 512 * TAU, shape, 1);
}
function outOf(theta) {
  let i = ((theta % TAU) + TAU) % TAU / TAU * 512 | 0;
  if (i >= 512) i = 511;
  return OUT_LUT[i];
}
function sectorCount(shape) { return shape === 'circle' ? 72 : (shape === 'square' ? 72 : shape === 'hex' ? 72 : 72); }

/* ---------------- 材质 ---------------- */
function makeMats() {
  const gold = new THREE.MeshStandardMaterial({
    color: 0xc9a24a, metalness: 0.88, roughness: 0.34,
    emissive: 0x9c7420, emissiveIntensity: 0.62, side: THREE.DoubleSide
  });
  const goldBright = new THREE.MeshStandardMaterial({
    color: 0xe9c56a, metalness: 0.9, roughness: 0.26,
    emissive: 0xffc95e, emissiveIntensity: 1.15, side: THREE.DoubleSide
  });
  const red = new THREE.MeshStandardMaterial({
    color: 0xa5271b, metalness: 0.08, roughness: 0.62,
    emissive: 0x57100a, emissiveIntensity: 0.55, side: THREE.DoubleSide
  });
  const blue = new THREE.MeshStandardMaterial({
    color: 0x1d3a6e, metalness: 0.12, roughness: 0.58,
    emissive: 0x0d1f45, emissiveIntensity: 0.6, side: THREE.DoubleSide
  });
  const darkWood = new THREE.MeshStandardMaterial({
    color: 0x38200f, metalness: 0.05, roughness: 0.85,
    emissive: 0x180b04, emissiveIntensity: 0.4, side: THREE.DoubleSide
  });
  const eye = new THREE.MeshStandardMaterial({
    color: 0xfff3c8, emissive: 0xffe9a0, emissiveIntensity: 2.1, roughness: 0.3
  });
  return { gold, goldBright, red, blue, darkWood, eye };
}

/* 环形扇区几何（带拱起），法线朝下（观者在下方仰视） */
class GeoBuilder {
  constructor() { this.p = []; this.uv = []; this.idx = []; this.n = 0; }
  vert(x, y, z, u, v) { this.p.push(x, y, z); this.uv.push(u, v); return this.n++; }
  tri(a, b, c) { this.idx.push(a, b, c); }
  build(mat) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.idx);
    g.computeVertexNormals();
    return new THREE.Mesh(g, mat);
  }
}
/* 在 rIn~rOut、a0~a1 之间生成带拱环形带；fn(θ)=外扩系数 */
function bandInto(gb, rIn, rOut, yBase, arch, a0, a1, angSegs, rs) {
  for (let i = 0; i < angSegs; i++) {
    const f0 = i / angSegs, f1 = (i + 1) / angSegs;
    const aa = a0 + (a1 - a0) * f0, ab = a0 + (a1 - a0) * f1;
    const rows = [];
    for (let j = 0; j <= rs; j++) {
      const fr = j / rs;
      const row = [];
      const ths = [aa, ab];
      for (let q = 0; q < 2; q++) {
        const th = ths[q];
        const o = outOf(th);
        const r = (rIn + (rOut - rIn) * fr) * o;
        const y = yBase + arch * Math.sin(Math.PI * fr);
        row.push(gb.vert(r * Math.cos(th), y, r * Math.sin(th), f0 + (f1 - f0) * q, fr));
      }
      rows.push(row);
    }
    for (let j = 0; j < rs; j++) {
      gb.tri(rows[j][0], rows[j + 1][0], rows[j][1]);
      gb.tri(rows[j][1], rows[j + 1][0], rows[j + 1][1]);
    }
  }
}

/* ---------------- 藻井构建 ---------------- */
const DOME_Y = 1.2;                       // 藻井中心离地高度
const LAYERS = [                         // 七环层：由内向外、由上到下
  { rin: 1.12, rout: 1.55, y: 0.88 },
  { rin: 1.55, rout: 2.05, y: 0.64 },
  { rin: 2.05, rout: 2.60, y: 0.42 },
  { rin: 2.60, rout: 3.30, y: 0.16 },
  { rin: 3.30, rout: 4.00, y: -0.10 },
  { rin: 4.00, rout: 4.50, y: -0.38 },
  { rin: 4.50, rout: 5.10, y: -0.72 },    // 外层檐口
];

function buildCaisson(shape) {
  buildLUT(shape);
  const mats = makeMats();
  const group = new THREE.Group();
  group.position.y = DOME_Y;
  const disposables = [mats.gold, mats.goldBright, mats.red, mats.blue, mats.darkWood, mats.eye];
  const dummy = new THREE.Object3D();

  const nSec = sectorCount(shape);
  const secStep = TAU / nSec;

  /* --- 彩绘面板（深蓝 / 正红 交替，间以金色开光） --- */
  const redGb = new GeoBuilder(), blueGb = new GeoBuilder(), goldGb = new GeoBuilder();
  LAYERS.forEach((L, li) => {
    for (let k = 0; k < nSec; k++) {
      const a0 = k * secStep, a1 = a0 + secStep;
      const gb = (k % 8 === 5) ? goldGb : (k % 2 === (li % 2)) ? redGb : blueGb;
      bandInto(gb, L.rin + 0.02, L.rout - 0.02, L.y, 0.05, a0 + 0.004, a1 - 0.004, 1, 2);
    }
  });
  group.add(redGb.build(mats.red), blueGb.build(mats.blue), goldGb.build(mats.goldBright));

  /* --- 环形梁（各层交界处金色环梁） --- */
  const ringGb = new GeoBuilder();
  LAYERS.forEach(L => {
    bandInto(ringGb, L.rin - 0.035, L.rin + 0.035, L.y + 0.045, 0, 0, TAU, nSec, 1);
  });
  // 外檐外沿加一道亮金环
  bandInto(ringGb, 5.02, 5.16, -0.68, 0, 0, TAU, nSec, 1);
  group.add(ringGb.build(mats.goldBright));

  /* --- 放射梁架（内层 48 根 + 主层 72 根） --- */
  function radialBeams(rIn, rOut, y, count, w, h, mat) {
    const g = new THREE.BoxGeometry(w, h, 1);
    const im = new THREE.InstancedMesh(g, mat, count);
    for (let i = 0; i < count; i++) {
      const th = i / count * TAU;
      const o = outOf(th);
      const r1 = rIn * o, r2 = rOut * o;
      dummy.position.set((r1 + r2) / 2 * Math.cos(th), y, (r1 + r2) / 2 * Math.sin(th));
      dummy.rotation.set(0, Math.PI / 2 - th, 0);
      dummy.scale.set(1, 1, r2 - r1);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    }
    disposables.push(g);
    return im;
  }
  group.add(radialBeams(1.18, 2.58, 0.70, 48, 0.075, 0.12, mats.gold));
  group.add(radialBeams(2.66, 3.26, 0.34, 72, 0.085, 0.13, mats.gold));

  /* --- 斗拱层：凸出的立体块（坐斗 + 横拱 + 跳头） --- */
  function dougongRing(rBase, count, mat) {
    const g = new THREE.BoxGeometry(1, 1, 1);
    const per = 7;
    const im = new THREE.InstancedMesh(g, mat, count * per);
    let idx = 0;
    for (let i = 0; i < count; i++) {
      const th = i / count * TAU;
      const o = outOf(th);
      const cb = Math.cos(th), sb = Math.sin(th);
      const y0 = 0.02;
      // 局部坐标：lx=径向，lz=切向；整体随 θ 转向
      const put = (lx, ly, lz, sx, sy, sz) => {
        const wx = rBase * o * cb + lx * cb - lz * sb;
        const wz = rBase * o * sb + lx * sb + lz * cb;
        dummy.position.set(wx, y0 + ly, wz);
        dummy.rotation.set(0, -th - Math.PI / 2, 0);
        dummy.scale.set(sx, sy, sz);
        dummy.updateMatrix();
        im.setMatrixAt(idx++, dummy.matrix);
      };
      put(0, 0, 0, 0.36, 0.17, 0.36);                    // 坐斗
      put(0, 0.22, 0, 0.56, 0.11, 0.17);                 // 横拱（切向）
      put(0, 0.22, 0, 0.17, 0.11, 0.62);                 // 华拱（径向跳出）
      put(0, 0.22, 0.30, 0.15, 0.13, 0.15);              // 跳头（外挑）
      put(0.20, 0.36, 0, 0.15, 0.12, 0.34);              // 小拱 ×2
      put(-0.20, 0.36, 0, 0.15, 0.12, 0.34);
      put(0, 0.47, 0, 0.44, 0.12, 0.44);                 // 盖斗
    }
    disposables.push(g);
    return im;
  }
  const dgCount = shape === 'circle' ? 36 : shape === 'square' ? 40 : shape === 'hex' ? 36 : 40;
  group.add(dougongRing(3.55, dgCount, mats.darkWood));
  group.add(dougongRing(3.62, dgCount, mats.gold));

  /* --- 外层檐口椽子（放射状外挑、微微下倾） --- */
  {
    const g = new THREE.BoxGeometry(0.09, 0.11, 1);
    const im = new THREE.InstancedMesh(g, mats.gold, 72);
    for (let i = 0; i < 72; i++) {
      const th = i / 72 * TAU;
      const o = outOf(th);
      const r1 = 4.30 * o, r2 = 5.72 * o;
      dummy.position.set((r1 + r2) / 2 * Math.cos(th), -0.60, (r1 + r2) / 2 * Math.sin(th));
      dummy.rotation.set(0.17, Math.PI / 2 - th, 0, 'YXZ');
      dummy.scale.set(1, 1, r2 - r1);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    }
    disposables.push(g);
    group.add(im);
  }
  /* 檐口下方收分（暗色阶梯环） */
  {
    const skirt = new GeoBuilder();
    bandInto(skirt, 5.04, 5.17, -0.90, 0, 0, TAU, nSec, 1);
    group.add(skirt.build(mats.darkWood));
  }

  /* --- 井心：圆盘 + 金龙 --- */
  {
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.12, 0.07, 72), mats.darkWood);
    plate.position.y = 1.02;
    const plateTrim = new THREE.Mesh(new THREE.TorusGeometry(1.12, 0.06, 12, 72), mats.goldBright);
    plateTrim.rotation.x = Math.PI / 2;
    plateTrim.position.y = 1.02;
    group.add(plate, plateTrim);
    disposables.push(plate.geometry, plateTrim.geometry);

    // 井口鎏金乳钉
    const sg = new THREE.SphereGeometry(0.035, 8, 8);
    const studs = new THREE.InstancedMesh(sg, mats.goldBright, 24);
    for (let i = 0; i < 24; i++) {
      const th = i / 24 * TAU;
      dummy.position.set(1.30 * Math.cos(th), 0.97, 1.30 * Math.sin(th));
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      studs.setMatrixAt(i, dummy.matrix);
    }
    disposables.push(sg);
    group.add(studs);
  }

  buildDragon(group, mats, disposables);
  return { group, disposables };
}

/* --- 中心金龙：悬于井盘之下，多弯曲管状几何拼合 --- */
function buildDragon(group, mats, disposables) {
  const gold = mats.goldBright;
  const Y = 0.70;                          // 龙身盘绕平面（盘面 0.985 之下）
  const add = mesh => { group.add(mesh); return mesh; };

/* 粒子循环相位（g ∈ [0,1)） */
let particleG = 0.0;
let transT = -1;                               // 形制切换进度，-1 为无切换
let shapeWanted = 'circle';

const easeInCubic = x => x * x * x;
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

/* 相位包络：返回 { pos模式参数..., alphaEnv, sizeEnv } */
function phaseEnv(g) {
  // 聚合 [0,.38)  坍缩 [.38,.62)  核心 [.62,.68)  重生 [.68,.86)  消散 [.86,1)
  if (g < 0.38) return { mode: 0, t: g / 0.38 };
  if (g < 0.62) return { mode: 1, t: (g - 0.38) / 0.24 };
  if (g < 0.68) return { mode: 2, t: (g - 0.62) / 0.06 };
  if (g < 0.86) return { mode: 3, t: (g - 0.68) / 0.18 };
  return { mode: 4, t: (g - 0.86) / 0.14 };
}
function alphaEnvelope(g, dip) {
  let a;
  if (g < 0.05) a = g / 0.05;
  else if (g < 0.38) a = 1;
  else if (g < 0.46) a = 1 - (g - 0.38) / 0.08 * 0.55;      // 坍缩前略暗
  else if (g < 0.62) a = 0.45;
  else if (g < 0.68) a = 1.5;                                 // 核心闪耀
  else if (g < 0.86) a = 1.15 - (g - 0.68) / 0.18 * 0.25;
  else a = 0.9 * (1 - (g - 0.86) / 0.14);                    // 消散淡出
  return a * dip;
}

const CORE_Y = 0.72;
function updateParticles(g, time) {
  const env = phaseEnv(g);
  const dip = transT >= 0 ? 1 - 0.72 * Math.exp(-Math.pow((transT - 0.20) / 0.10, 2)) : 1;
  const aggE = env.mode === 0 ? easeOutCubic(Math.min(1, env.t * 1.15)) : 0;  // 聚合系数
  const colC = env.mode === 1 ? easeInCubic(env.t) : 0;                      // 坍缩系数
  const rebE = env.mode === 3 ? easeOutCubic(env.t) : 0;                      // 重生系数
  const disE = env.mode === 4 ? env.t * env.t : 0;                            // 消散系数
  for (let i = 0; i < P_COUNT; i++) {
    const b = BANDS[P.band[i]];
    const th = P.th0[i] + time * P.drift[i] * 0.35 * P.spinDir[i];
    const o = outOf(th);
    const cx = Math.cos(th), sz = Math.sin(th);
    const rb = b.r * o * P.rJit[i];                        // 层位半径
    const yb = b.y + P.yJit[i];
    const rc = b.r * P.cR[i] * o;                          // 云态半径
    const yc = b.y + P.cY[i];
    let x, y, z, a = 1, s = 1;
    if (env.mode === 0) {                                  // 聚合：云 → 层位
      x = rc + (rb - rc) * aggE;
      y = yc + (yb - yc) * aggE;
      z = sz * (rc + (rb - rc) * aggE);
    } else if (env.mode === 1) {                           // 坍缩：螺旋入核
      const th2 = th + colC * 9 * P.spinDir[i];
      const rr = rb * (1 - colC);
      x = rr * Math.cos(th2);
      z = rr * Math.sin(th2);
      y = yb + (CORE_Y - yb) * colC;
    } else if (env.mode === 2) {                           // 核心
      x = (Math.random() - 0.5) * 0.05;
      y = CORE_Y + (Math.random() - 0.5) * 0.05;
      z = (Math.random() - 0.5) * 0.05;
      s = 1.9; a = 1.4;
    } else if (env.mode === 3) {                           // 重生：核 → 层位
      x = rb * cx * rebE;
      z = rb * sz * rebE;
      y = CORE_Y + (yb - CORE_Y) * rebE;
      s = 1 + (1 - env.t) * 0.7;
    } else {                                               // 消散：层位 → 云
      x = rb + (rc - rb) * disE;
      y = yb + (yc - yb) * disE;
      z = sz * (rb + (rc - rb) * disE);
    }
    pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
    pAlpha[i] = P.a0[i] * alphaEnvelope(g, dip) * a;
    pSize[i] = (0.5 + (i % 7) * 0.09) * s;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
}

  runPass(matCopy, rtC);
  matBlur.uniforms.tDiffuse.value = rtC.texture;
  matBlur.uniforms.dir.value.set(1.8 / wC, 0); runPass(matBlur, rtD);
  matBlur.uniforms.tDiffuse.value = rtD.texture;
  matBlur.uniforms.dir.value.set(0, 1.8 / hC); runPass(matBlur, rtC);
  matComposite.uniforms.tBase.value = rtScene.texture;
  matComposite.uniforms.tB1.value = rtA.texture;
  matComposite.uniforms.tB2.value = rtC.texture;
  matComposite.uniforms.exposure.value = exposure * (1 + bloomPulse * 0.55);
  runPass(matComposite, null);
}

/* ---------------- 结尾文字 ---------------- */
const endingEl = document.getElementById('ending');
const vignetteEl = document.getElementById('vignette');
let endingShown = false;

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let prevG = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  window.__probeFrames = (window.__probeFrames || 0) + 1;

  // 粒子循环相位
  if (transT >= 0) {
    window.__probeT = (window.__probeT || 0) + 1;
    window.__probeDt = dt;
    transT += dt / 2.4;
    if (transT < 0.55) particleG = 0.40 + 0.22 * (transT / 0.55);        // 强制坍缩
    else if (transT < 1) particleG = 0.62 + 0.26 * ((transT - 0.55) / 0.45); // 核心→重生
    if (transT >= 0.5 && caisson.shape !== shapeWanted) finishShape(shapeWanted);
    if (transT >= 1) { transT = -1; }
  } else {
    particleG = (particleG + dt / T_CYCLE) % 1;
  }
  // 重生瞬间曝光脉冲
  if (prevG < 0.68 && particleG >= 0.68) bloomPulse = 1;
  prevG = particleG;
  bloomPulse *= Math.exp(-dt * 2.2);

  // 藻井缓转
  if (caisson) caisson.group.rotation.y += dt * 0.02;
  // 人物呼吸
  person.scale.y = 1 + Math.sin(t * 1.4) * 0.006;

  updateParticles(particleG, t);
  orbit.update(dt);
  renderFrame();

  // 结尾：首次重生完成后淡入
  if (!endingShown && t > 15.8) {
    endingShown = true;
    endingEl.classList.add('show');
    vignetteEl.classList.add('strong');
  }
  window.__booted = true;
}
animate();

/* ---------------- 自适应 ---------------- */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  rtScene.dispose(); rtA.dispose(); rtB.dispose(); rtC.dispose(); rtD.dispose();
  rtScene = makeRT(w * pixelRatio, h * pixelRatio);
  rtA = makeRT(w * pixelRatio >> 1, h * pixelRatio >> 1);
  rtB = makeRT(w * pixelRatio >> 1, h * pixelRatio >> 1);
  rtC = makeRT(w * pixelRatio >> 2, h * pixelRatio >> 2);
  rtD = makeRT(w * pixelRatio >> 2, h * pixelRatio >> 2);
  rtA.depthBuffer = rtB.depthBuffer = rtC.depthBuffer = rtD.depthBuffer = false;
});
</script>
