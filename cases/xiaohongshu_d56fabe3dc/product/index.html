<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>白玉天宫 · 裸眼 3D 视差</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(1200px 900px at 50% 28%, #182a44 0%, #0a1220 72%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  .stage {
    position:relative;
    width:min(100vw, 72vh);
    aspect-ratio:3/4;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.05);
    background:#2a4a7f;
    touch-action:none;
  }
  .layer { position:absolute; inset:0; will-change:transform; }
  .layer svg { display:block; width:100%; height:100%; overflow:visible; }

  /* ================= 动画系统 ================= */
  /* 云层漂移（三组不同速度，营造纵深） */
  @keyframes driftA { from{transform:translateX(0)}     to{transform:translateX(-110px)} }
  @keyframes driftB { from{transform:translateX(0)}     to{transform:translateX(70px)}  }
  @keyframes driftC { from{transform:translateX(0)}     to{transform:translateX(-60px)} }
  .anim-drift-a { animation:driftA 26s ease-in-out infinite alternate; }
  .anim-drift-b { animation:driftB 34s ease-in-out infinite alternate; }
  .anim-drift-c { animation:driftC 44s ease-in-out infinite alternate; }

  /* 仙鹤扇翅（左右翼反相） */
  @keyframes flapL { from{transform:rotate(16deg)}  to{transform:rotate(-20deg)} }
  @keyframes flapR { from{transform:rotate(-16deg)} to{transform:rotate(20deg)} }
  .wing-l { transform-box:fill-box; transform-origin:80% 60%; animation:flapL 1.15s ease-in-out infinite alternate; }
  .wing-r { transform-box:fill-box; transform-origin:20% 60%; animation:flapR 1.15s ease-in-out infinite alternate; }
  .wing-l.slow { animation-duration:1.6s; }
  .wing-r.slow { animation-duration:1.6s; }

  /* 仙鹤整体滑翔漂移 */
  @keyframes glideA { 0%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(26px,-14px) rotate(-2deg)} 100%{transform:translate(0,0) rotate(0deg)} }
  @keyframes glideB { 0%{transform:translate(0,0)} 50%{transform:translate(-30px,-10px)} 100%{transform:translate(0,0)} }
  .anim-glide-a { animation:glideA 7s ease-in-out infinite; }
  .anim-glide-b { animation:glideB 9s ease-in-out infinite; }

  /* 瀑布流动（竖纹滚动） */
  @keyframes fall { from{background-position-y:0} to{background-position-y:160px} }
  .water-flow { animation:fall 1.1s linear infinite; }
  .water-flow.slow { animation-duration:1.7s; }

  /* 底部水雾呼吸 */
  @keyframes mistPulse { 0%,100%{opacity:.45; transform:scale(1)} 50%{opacity:.85; transform:scale(1.12)} }
  .anim-mist { transform-box:fill-box; transform-origin:center; animation:mistPulse 2.8s ease-in-out infinite; }
  .anim-mist.d2 { animation-delay:.9s; animation-duration:3.4s; }

  /* 人物袍角微摆 */
  @keyframes robeSway { 0%,100%{transform:skewX(0deg)} 50%{transform:skewX(1.6deg)} }
  .anim-robe { transform-box:fill-box; transform-origin:top center; animation:robeSway 4.2s ease-in-out infinite; }

  /* 晨光微闪 */
  @keyframes glowPulse { 0%,100%{opacity:.75} 50%{opacity:1} }
  .anim-glow { animation:glowPulse 6s ease-in-out infinite; }

  /* HUD 提示 */
  .hud {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    color:rgba(240,246,252,.92); font-size:13px; letter-spacing:.35em; text-indent:.35em;
    padding:9px 18px; border-radius:999px;
    background:rgba(10,20,36,.38); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    pointer-events:none; white-space:nowrap;
    transition:opacity 1.2s ease;
    text-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .hud.hide { opacity:0; }
  .brand {
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    color:rgba(240,246,252,.55); font-size:12px; letter-spacing:.5em; text-indent:.5em;
    pointer-events:none; transition:opacity 1.2s ease;
    text-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .brand.hide { opacity:0; }
</style>
</head>

<div class="brand" id="brand">白 玉 天 宫 · 裸 眼 3D 视 差</div>
<div class="hud" id="hud">移 动 鼠 标 · 感 受 视 差 纵 深</div>
<script>
(function(){
  "use strict";
  /* ============ 裸眼 3D 视差引擎 ============
     鼠标位置 -> 目标偏移，lerp 平滑，
     各图层按 data-depth 以不同速度位移 */
  var stage = document.getElementById('stage');
  var layers = Array.prototype.slice.call(stage.querySelectorAll('.layer'));
  var TX=0, TY=0, CX=0, CY=0;   // target / current
  var MAX = 34;                  // 最大位移像素（前景层）

  /* 调试/演示：?px=&py= 直接设定初始视差（-1 ~ 1） */
  var q = new URLSearchParams(location.search);
  var qx = parseFloat(q.get('px')), qy = parseFloat(q.get('py'));
  if(!isNaN(qx)){ TX = qx * MAX; CX = TX; }
  if(!isNaN(qy)){ TY = qy * MAX * 0.55; CY = TY; }

  function setTarget(nx, ny){
    TX = nx * MAX;
    TY = ny * MAX * 0.55;
  }
  stage.addEventListener('mousemove', function(e){
    var r = stage.getBoundingClientRect();
    setTarget((e.clientX - r.left) / r.width  * 2 - 1,
              (e.clientY - r.top)  / r.height * 2 - 1);
  });
  stage.addEventListener('mouseleave', function(){ setTarget(0,0); });
  stage.addEventListener('touchmove', function(e){
    if(!e.touches.length) return;
    var r = stage.getBoundingClientRect();
    var t = e.touches[0];
    setTarget((t.clientX - r.left) / r.width  * 2 - 1,
              (t.clientY - r.top)  / r.height * 2 - 1);
  }, {passive:true});
  stage.addEventListener('touchend', function(){ setTarget(0,0); });

  function tick(){
    CX += (TX - CX) * 0.055;
    CY += (TY - CY) * 0.055;
    for(var i=0;i<layers.length;i++){
      var d = parseFloat(layers[i].getAttribute('data-depth'));
      layers[i].style.transform =
        'translate3d(' + (CX*d).toFixed(2) + 'px,' + (CY*d).toFixed(2) + 'px,0)';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* HUD 提示 6 秒后淡出 */
  setTimeout(function(){
    var h = document.getElementById('hud'); if(h) h.classList.add('hide');
  }, 6000);
  setTimeout(function(){
    var b = document.getElementById('brand'); if(b) b.classList.add('hide');
  }, 9000);
})();
</script>
