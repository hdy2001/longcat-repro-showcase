<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Flappy Bird · 小鸟飞飞</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #16233f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #game {
    width: min(100vw, calc(100vh * 0.75));
    aspect-ratio: 3 / 4;
    display: block;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    touch-action: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480, H = 640;
const GROUND_H = 96;
const HORIZON = H - GROUND_H;

const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

// roundRect 兼容旧浏览器
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

const FONT = '"Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

/* ---------------- 音效（WebAudio 合成，无外部资源） ---------------- */
let audioCtx = null;
let muted = false;
function ac() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return;
  const a = ac(); if (!a) return;
  try {
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfxFlap  = () => tone(520, 0.1, 'triangle', 0.10, 780);
const sfxScore = () => { tone(988, 0.08, 'sine', 0.12); tone(1319, 0.14, 'sine', 0.12, null, 0.08); };
const sfxHit   = () => tone(220, 0.28, 'sawtooth', 0.16, 55);
const sfxThud  = () => tone(130, 0.18, 'square', 0.12, 60);

/* ---------------- 常量与状态 ---------------- */
const GRAVITY = 0.42;
const FLAP_VY = -7.4;
const PIPE_W = 66;
const PIPE_CAP_H = 26;
const GAP = 156;
const PIPE_SPACING = 268;
const SPEED = 2.6;
const BTN = { x: W / 2 - 92, y: 420, w: 184, h: 52 };
const MUTE = { x: 28, y: 32, r: 18 };

let state = 'ready'; // ready | playing | dying | over
let bird, pipes, popups, clouds;
let score = 0, best = 0, newBest = false;
let groundOff = 0, shake = 0, flash = 0, overTimer = 0, sunT = 0;
let wingPhase = 0, flapTimer = 0;

function randTop() {
  const m = 56;
  return m + Math.random() * (HORIZON - GAP - m * 2);
}
function reset() {
  state = 'ready';
  bird = { x: 130, y: H * 0.42, r: 16, vy: 0, rot: 0 };
  pipes = [];
  popups = [];
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({ x: Math.random() * W, y: 26 + Math.random() * 190, s: 0.6 + Math.random() * 0.9, v: 0.22 + Math.random() * 0.4 });
  }
  score = 0;
  newBest = false;
  groundOff = 0; shake = 0; flash = 0; overTimer = 0;
  wingPhase = 0; flapTimer = 0;
  try { best = +(localStorage.getItem('flappyBest') || 0); } catch (e) { best = 0; }
}
function startGame() {
  state = 'playing';
  for (let i = 0; i < 3; i++) pipes.push({ x: W + 120 + i * PIPE_SPACING, top: randTop(), scored: false });
  flap();
}
function flap() {
  bird.vy = FLAP_VY;
  flapTimer = 14;
  sfxFlap();
}
function gameOver() {
  state = 'over';
  overTimer = 0;
  if (score > best) {
    best = score;
    try { localStorage.setItem('flappyBest', best); } catch (e) {}
    newBest = true;
  }
}

/* ---------------- 输入 ---------------- */
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function press() {
  if (state === 'ready') startGame();
  else if (state === 'playing') flap();
  else if (state === 'over' && overTimer > 30) reset();
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const p = toGame(e);
  if (Math.hypot(p.x - MUTE.x, p.y - MUTE.y) < MUTE.r) { muted = !muted; return; }
  if (state === 'over') {
    if (overTimer > 30 && p.x > BTN.x && p.x < BTN.x + BTN.w && p.y > BTN.y && p.y < BTN.y + BTN.h) reset();
    return;
  }
  press();
});
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); press(); }
  else if (e.code === 'KeyM') muted = !muted;
});

/* ---------------- 更新 ---------------- */
function update(dt) {
  sunT += dt;
  for (const c of clouds) {
    c.x -= c.v * dt;
    if (c.x < -90) { c.x = W + 90; c.y = 26 + Math.random() * 190; }
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 0.5);
  if (flash > 0) flash = Math.max(0, flash - dt * 0.04);
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 36) popups.splice(i, 1); }

  if (state === 'ready') {
    bird.y = H * 0.42 + Math.sin(sunT * 0.06) * 9;
    bird.rot = Math.sin(sunT * 0.06 + 0.6) * 0.08;
    wingPhase += dt * 0.4;
    groundOff = (groundOff + SPEED * dt) % 48;
    return;
  }

  if (state === 'dying') {
    bird.vy += GRAVITY * dt;
    if (bird.vy > 12) bird.vy = 12;
    bird.y += bird.vy * dt;
    bird.rot += (1.5 - bird.rot) * 0.12 * dt;
    wingPhase += dt * 0.5;
    if (bird.y + bird.r >= HORIZON) {
      bird.y = HORIZON - bird.r;
      gameOver();
      sfxThud();
    }
    return;
  }

  if (state === 'over') { overTimer += dt; return; }

  /* --- playing --- */
  groundOff = (groundOff + SPEED * dt) % 48;
  bird.vy += GRAVITY * dt;
  if (bird.vy > 11) bird.vy = 11;
  bird.y += bird.vy * dt;
  if (flapTimer > 0) { flapTimer -= dt; wingPhase += dt * 1.15; }
  else wingPhase += dt * 0.4;
  const target = bird.vy < 0 ? -0.32 : Math.min(1.3, bird.vy * 0.12);
  bird.rot += (target - bird.rot) * 0.18 * dt;
  if (bird.y < bird.r) { bird.y = bird.r; bird.vy = Math.max(0, bird.vy); }

  for (const p of pipes) p.x -= SPEED * dt;
  const last = pipes[pipes.length - 1];
  if (last && last.x < W - PIPE_SPACING) pipes.push({ x: last.x + PIPE_SPACING, top: randTop(), scored: false });
  while (pipes.length && pipes[0].x < -PIPE_W - 30) pipes.shift();

  for (const p of pipes) {
    if (!p.scored && p.x + PIPE_W < bird.x) {
      p.scored = true;
      score++;
      popups.push({ x: bird.x + 24, y: bird.y - 24, t: 0 });
      sfxScore();
    }
  }

  const hitR = bird.r - 3; // 略微宽容的碰撞盒
  let dead = false;
  for (const p of pipes) {
    if (bird.x + hitR > p.x && bird.x - hitR < p.x + PIPE_W) {
      if (bird.y - hitR < p.top || bird.y + hitR > p.top + GAP) { dead = true; break; }
    }
  }
  const onGround = bird.y + bird.r >= HORIZON;
  if (dead) {
    state = 'dying';
    bird.vy = FLAP_VY * 0.55;
    flash = 1; shake = 12;
    sfxHit();
  } else if (onGround) {
    bird.y = HORIZON - bird.r;
    flash = 1; shake = 8;
    sfxHit();
    gameOver();
  }
}

/* ---------------- 绘制辅助 ---------------- */
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function txt(str, x, y, size, fill, stroke, lw, weight) {
  ctx.font = (weight || 900) + ' ' + size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}
function star(cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

/* ---------------- 场景绘制 ---------------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, '#5fb8f5');
  g.addColorStop(0.55, '#8fd4fb');
  g.addColorStop(1, '#d9f2ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun() {
  const sx = W - 96, sy = 106;
  // 光晕
  let g = ctx.createRadialGradient(sx, sy, 24, sx, sy, 120);
  g.addColorStop(0, 'rgba(255,238,160,0.9)');
  g.addColorStop(0.45, 'rgba(255,230,130,0.35)');
  g.addColorStop(1, 'rgba(255,230,130,0)');
  ctx.fillStyle = g;
  ctx.fillRect(sx - 120, sy - 120, 240, 240);
  // 旋转光芒
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(sunT * 0.0016);
  ctx.strokeStyle = 'rgba(255,214,90,0.85)';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 46, Math.sin(a) * 46);
    ctx.lineTo(Math.cos(a) * 60, Math.sin(a) * 60);
    ctx.stroke();
  }
  ctx.restore();
  // 太阳本体
  g = ctx.createRadialGradient(sx - 9, sy - 11, 5, sx, sy, 34);
  g.addColorStop(0, '#fffde7');
  g.addColorStop(0.45, '#ffee58');
  g.addColorStop(1, '#fdd835');
  ctx.fillStyle = g;
  circle(sx, sy, 32);
  ctx.strokeStyle = '#e8a812';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(sx, sy, 32, 0, Math.PI * 2); ctx.stroke();
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for (const c of clouds) {
    ellipse(c.x, c.y, 26 * c.s, 15 * c.s);
    ellipse(c.x + 20 * c.s, c.y + 4 * c.s, 19 * c.s, 12 * c.s);
    ellipse(c.x - 20 * c.s, c.y + 5 * c.s, 17 * c.s, 11 * c.s);
    ellipse(c.x + 2 * c.s, c.y - 10 * c.s, 16 * c.s, 11 * c.s);
  }
}

function drawHills() {
  // 远山（最浅）
  ctx.fillStyle = '#a9dcb4';
  ctx.beginPath(); ctx.arc(-50, HORIZON + 70, 150, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.42, HORIZON + 90, 185, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(W + 30, HORIZON + 75, 145, Math.PI, 0); ctx.fill();
  // 近山
  ctx.fillStyle = '#7cc47f';
  ctx.beginPath(); ctx.arc(W * 0.18, HORIZON + 45, 70, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.62, HORIZON + 50, 85, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.95, HORIZON + 42, 62, Math.PI, 0); ctx.fill();
  // 灌木剪影（最深，最前）
  ctx.fillStyle = '#5da968';
  ctx.beginPath(); ctx.arc(W * 0.05, HORIZON + 26, 34, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.4, HORIZON + 24, 28, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.78, HORIZON + 26, 32, Math.PI, 0); ctx.fill();
}

function pipeGrad(x) {
  const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  g.addColorStop(0, '#4c8a28');
  g.addColorStop(0.18, '#79c645');
  g.addColorStop(0.5, '#a2e36a');
  g.addColorStop(0.82, '#5da332');
  g.addColorStop(1, '#3c7420');
  return g;
}
function drawPipe(x, y, h, isTop) {
  if (h <= 0) return;
  const g = pipeGrad(x);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, PIPE_W, h);
  const capY = isTop ? y + h - PIPE_CAP_H : y;
  ctx.beginPath(); ctx.roundRect(x - 8, capY, PIPE_W + 16, PIPE_CAP_H, 6); ctx.fill();
  ctx.strokeStyle = '#2e5c17';
  ctx.lineWidth = 3;
  ctx.strokeRect(x + 1.5, y, PIPE_W - 3, h);
  ctx.beginPath(); ctx.roundRect(x - 8, capY, PIPE_W + 16, PIPE_CAP_H, 6); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(x + 10, y, 7, h);
}
function drawPipes() {
  for (const p of pipes) {
    drawPipe(p.x, 0, p.top, true);
    drawPipe(p.x, p.top + GAP, HORIZON - p.top - GAP, false);
  }
}

function drawGround() {
  // 泥土
  ctx.fillStyle = '#e9d896';
  ctx.fillRect(0, HORIZON + 16, W, GROUND_H - 16);
  // 斜纹
  ctx.fillStyle = '#d9c27d';
  for (let x = -72 - groundOff; x < W + 72; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, H);
    ctx.lineTo(x + 26, HORIZON + 16);
    ctx.lineTo(x + 52, HORIZON + 16);
    ctx.lineTo(x + 26, H);
    ctx.closePath();
    ctx.fill();
  }
  // 草皮
  ctx.fillStyle = '#7ac74f';
  ctx.fillRect(0, HORIZON, W, 16);
  ctx.fillStyle = '#a2e574';
  ctx.fillRect(0, HORIZON, W, 5);
  ctx.fillStyle = '#5da333';
  ctx.fillRect(0, HORIZON + 13, W, 4);
  // 草皮下沿波浪
  const off = groundOff % 24;
  ctx.fillStyle = '#5da333';
  for (let x = -24 - off; x < W + 24; x += 24) {
    ctx.beginPath(); ctx.arc(x + 12, HORIZON + 16, 10, 0, Math.PI); ctx.fill();
  }
  // 小草叶
  ctx.fillStyle = '#69b33f';
  for (let x = -12 - groundOff; x < W + 12; x += 36) {
    ctx.beginPath();
    ctx.moveTo(x, HORIZON + 2);
    ctx.lineTo(x + 4, HORIZON - 6);
    ctx.lineTo(x + 8, HORIZON + 2);
    ctx.closePath();
    ctx.fill();
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  // 身体
  const g = ctx.createLinearGradient(0, -16, 0, 16);
  g.addColorStop(0, '#ffe066');
  g.addColorStop(1, '#ffb300');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e08e00'; ctx.lineWidth = 2.5; ctx.stroke();
  // 肚皮
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.ellipse(2, 6, 10, 6.5, 0, 0, Math.PI * 2); ctx.fill();
  // 翅膀（扇动）
  const wa = Math.sin(wingPhase) * 0.85 - 0.15;
  ctx.save();
  ctx.translate(-4, 1);
  ctx.rotate(wa);
  ctx.fillStyle = '#ffcf40';
  ctx.beginPath(); ctx.ellipse(-3, 0, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e08e00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(7, -5, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e08e00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#263238';
  ctx.beginPath(); ctx.arc(9, -5, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(10.2, -6.2, 1.1, 0, Math.PI * 2); ctx.fill();
  // 嘴巴
  ctx.fillStyle = '#ff7f2a';
  ctx.beginPath();
  ctx.moveTo(13, -2); ctx.lineTo(25, 1); ctx.lineTo(13, 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d96a12'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e06a10';
  ctx.beginPath();
  ctx.moveTo(12, 4); ctx.lineTo(21, 6.5); ctx.lineTo(12, 8.5);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}

/* ---------------- UI 绘制 ---------------- */
function drawScore() {
  txt(score, W / 2, 92, 46, '#ffffff', 'rgba(70,110,40,0.85)', 8);
}

function drawReady() {
  txt('小鸟飞飞', W / 2, 168, 56, '#ffd93b', '#8a5a00', 10);
  txt('FLAPPY BIRD', W / 2, 214, 18, 'rgba(255,255,255,0.9)', 'rgba(70,110,40,0.5)', 4, 700);
  const bounce = Math.sin(sunT * 0.08) * 4;
  txt('点击屏幕 或 按空格键 开始', W / 2, 300 + bounce, 22, '#ffffff', 'rgba(70,110,40,0.7)', 5);
  txt('最高分 ' + best, W / 2, 348, 20, '#fff8d6', 'rgba(70,110,40,0.6)', 4);
}

function medalFor(s) {
  if (s >= 40) return { c: '#b3e5fc', name: '铂金奖' };
  if (s >= 30) return { c: '#ffd54f', name: '金奖' };
  if (s >= 20) return { c: '#cfd8dc', name: '银奖' };
  if (s >= 10) return { c: '#d79a6b', name: '铜奖' };
  return null;
}

function drawOver() {
  const px = W / 2 - 160, py = 196, pw = 320, ph = 216;
  // 面板阴影 + 面板
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.roundRect(px + 4, py + 6, pw, ph, 18); ctx.fill();
  ctx.fillStyle = '#fff8e7';
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 18); ctx.fill();
  ctx.strokeStyle = '#c9a86a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 18); ctx.stroke();

  txt('游戏结束', W / 2, py + 40, 34, '#8d6e63', null, 0);

  // 奖牌
  const m = medalFor(score);
  const mx = px + 62, my = py + 108;
  if (m) {
    ctx.fillStyle = m.c;
    ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.stroke();
    star(mx, my, 16, 'rgba(255,255,255,0.9)');
    txt(m.name, mx, my + 48, 13, '#8d6e63', null, 0, 700);
  } else {
    txt('继续加油', mx, my + 10, 15, '#a1887f', null, 0, 700);
  }

  // 分数
  txt('得分', px + 128, py + 82, 18, '#a1887f', null, 0, 700);
  txt(score, px + 232, py + 82, 26, '#5d4037', null, 0);
  txt('最高', px + 128, py + 126, 18, '#a1887f', null, 0, 700);
  txt(best, px + 232, py + 126, 26, '#5d4037', null, 0);

  if (newBest && score > 0) txt('★ 新纪录 ★', W / 2, py + 158, 18, '#e53935', null, 0);

  // 重开按钮
  ctx.fillStyle = '#7ac74f';
  ctx.beginPath(); ctx.roundRect(BTN.x, BTN.y, BTN.w, BTN.h, 14); ctx.fill();
  ctx.strokeStyle = '#4e8a28'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(BTN.x, BTN.y, BTN.w, BTN.h, 14); ctx.stroke();
  txt('再来一局', W / 2, BTN.y + BTN.h / 2 + 1, 22, '#ffffff', null, 0);

  if (overTimer > 30) {
    ctx.globalAlpha = 0.6 + Math.sin(sunT * 0.1) * 0.4;
    txt('或按 空格键 重开', W / 2, BTN.y + BTN.h + 30, 16, '#ffffff', 'rgba(70,110,40,0.7)', 4, 700);
    ctx.globalAlpha = 1;
  }
}

function drawMuteIcon() {
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.arc(MUTE.x, MUTE.y, 17, 0, Math.PI * 2); ctx.fill();
  ctx.font = '15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(muted ? '🔇' : '🔊', MUTE.x, MUTE.y + 1);
}

/* ---------------- 主循环 ---------------- */
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSky();
  drawSun();
  drawClouds();
  drawHills();
  drawPipes();
  drawGround();
  drawBird();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.75).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 36);
    txt('+1', p.x, p.y - p.t * 0.6, 20, '#fff3b0', '#b8860b', 4);
    ctx.globalAlpha = 1;
  }

  drawMuteIcon();
  if (state === 'ready') drawReady();
  else if (state === 'playing' || state === 'dying') drawScore();
  else if (state === 'over') drawOver();
}

reset();
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 16.6667;
  last = now;
  if (!(dt > 0)) dt = 0.01;
  if (dt > 3) dt = 3;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
