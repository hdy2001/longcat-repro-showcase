<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹游乐厅 · 3D抓娃娃机 / 马里奥闯关 / 钢铁侠头盔</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05060a;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; color:#e8ecf4; }
  #app-header { height:58px; display:flex; align-items:center; gap:18px; padding:0 18px;
    background:linear-gradient(180deg,#0d1017 0%,#090b11 100%);
    border-bottom:1px solid #1d2330; position:relative; z-index:10; }
  .logo { font-size:19px; font-weight:800; letter-spacing:1px; white-space:nowrap;
    background:linear-gradient(90deg,#ff2d95,#00e5ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 22px rgba(255,45,149,.35); }
  .logo small { font-size:10px; color:#7a8499; -webkit-text-fill-color:#7a8499; display:block; letter-spacing:3px; }
  .tabs { display:flex; gap:10px; margin-left:auto; }
  .tab-btn { border:1px solid #2a3245; background:#11141c; color:#aeb8cc; font-size:14px; font-weight:600;
    padding:9px 18px; border-radius:10px; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .tab-btn:hover { border-color:#00e5ff; color:#fff; box-shadow:0 0 14px rgba(0,229,255,.25); }
  .tab-btn.active { background:linear-gradient(90deg,rgba(255,45,149,.18),rgba(0,229,255,.18));
    border-color:#ff2d95; color:#fff; box-shadow:0 0 16px rgba(255,45,149,.35), inset 0 0 12px rgba(0,229,255,.12); }

  .app { position:fixed; inset:58px 0 0 0; display:none; }
  .app.active { display:block; }

  /* ---------- 抓娃娃机 ---------- */
  #claw-viewport { position:absolute; inset:0; }
  #claw-viewport canvas { display:block; }
  .claw-topbar { position:absolute; top:14px; left:0; right:0; display:flex; justify-content:center; gap:14px;
    pointer-events:none; z-index:5; }
  .claw-topbar .hint { background:rgba(10,12,20,.72); border:1px solid rgba(0,229,255,.35); color:#bfefff;
    font-size:13.5px; padding:9px 20px; border-radius:999px; backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(0,229,255,.18); max-width:60vw; text-align:center; }
  .claw-topbar .coinbox { background:rgba(10,12,20,.72); border:1px solid rgba(255,209,102,.5); color:#ffd166;
    font-size:15px; font-weight:800; padding:9px 18px; border-radius:999px; backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(255,209,102,.22); white-space:nowrap; }
  .claw-bottom { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:flex-end;
    justify-content:space-between; padding:0 26px 22px; z-index:5; pointer-events:none; }
  .claw-bottom > * { pointer-events:auto; }
  .coin-btn { border:1px solid #ffd166; background:linear-gradient(180deg,#3a2c10,#241a08); color:#ffd166;
    font-size:16px; font-weight:800; padding:14px 26px; border-radius:14px; cursor:pointer;
    box-shadow:0 0 20px rgba(255,209,102,.3), inset 0 1px 0 rgba(255,255,255,.12); transition:all .15s; }
  .coin-btn:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(255,209,102,.5); }
  .prize-box { background:rgba(10,12,20,.72); border:1px solid rgba(255,45,149,.45); color:#ff9ec7;
    font-size:14px; font-weight:700; padding:12px 20px; border-radius:14px; backdrop-filter:blur(6px);
    box-shadow:0 0 16px rgba(255,45,149,.2); }
  .dpad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:6px; }
  .dpad button { border:1px solid #2a3245; background:rgba(16,19,28,.85); color:#cfe9ff; font-size:19px;
    border-radius:12px; cursor:pointer; box-shadow:0 0 10px rgba(0,229,255,.12); transition:all .12s; user-select:none; }
  .dpad button:hover { border-color:#00e5ff; box-shadow:0 0 16px rgba(0,229,255,.35); color:#fff; }
  .dpad button:active { transform:scale(.93); background:rgba(0,229,255,.25); }
  .dpad .grab-btn { border-color:#ff2d95; color:#ff9ec7; font-size:16px; font-weight:800;
    box-shadow:0 0 14px rgba(255,45,149,.3); }
  .dpad .grab-btn:hover { background:rgba(255,45,149,.22); color:#fff; }
  .dpad .up    { grid-area:1 / 2; } .dpad .left  { grid-area:2 / 1; }
  .dpad .grab-btn { grid-area:2 / 2; } .dpad .right { grid-area:2 / 3; }
  .dpad .down  { grid-area:3 / 2; }

  /* ---------- 马里奥 ---------- */
  #app-mario { display:none; align-items:center; justify-content:center; background:
    radial-gradient(1200px 500px at 50% -10%, #101528 0%, #05060a 60%); }
  #app-mario.active { display:flex; }
  #mario-canvas { width:min(96vw, 1040px); aspect-ratio:16/9; border-radius:14px; cursor:pointer;
    border:1px solid rgba(255,45,149,.4); box-shadow:0 0 40px rgba(255,45,149,.22), 0 0 90px rgba(0,229,255,.12); }

  /* ---------- 钢铁侠头盔 ---------- */
  #helmet-viewport { position:absolute; inset:0; }
  #helmet-viewport canvas { display:block; }
  .helmet-bar { position:absolute; left:0; right:0; bottom:22px; display:flex; justify-content:center; align-items:center; gap:14px; z-index:5; }
  .bg-btn { border:1px solid #00e5ff; background:linear-gradient(180deg,#0e2230,#0a141d); color:#9fe8ff;
    font-size:15px; font-weight:700; padding:12px 24px; border-radius:999px; cursor:pointer;
    box-shadow:0 0 20px rgba(0,229,255,.3); transition:all .15s; }
  .bg-btn:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(0,229,255,.5); }
  .bg-name { font-size:13px; color:#8fa0bd; background:rgba(10,12,20,.7); padding:9px 16px; border-radius:999px;
    border:1px solid #232b3d; }
  .helmet-hint { position:absolute; top:16px; left:0; right:0; text-align:center; font-size:13px; color:#7f8ba3;
    text-shadow:0 1px 4px #000; pointer-events:none; z-index:5; }
</style>
</head>
<body>

<header id="app-header">
  <div class="logo">霓虹游乐厅<small>NEON ARCADE</small></div>
  <nav class="tabs">
    <button class="tab-btn active" data-app="claw">🎰 3D抓娃娃机</button>
    <button class="tab-btn" data-app="mario">🍄 马里奥闯关</button>
    <button class="tab-btn" data-app="helmet">🛡 钢铁侠头盔</button>
  </nav>
</header>

<!-- ============ 应用1：3D 抓娃娃机 ============ -->
<section id="app-claw" class="app active">
  <div id="claw-viewport"></div>
  <div class="claw-topbar">
    <div class="hint" id="claw-hint">点击「投币」开始 · 方向键移动爪子 · 空格抓取</div>
    <div class="coinbox">🪙 娃娃币 × <span id="claw-coins">0</span></div>
  </div>
  <div class="claw-bottom">
    <button class="coin-btn" id="btn-insert-coin">🪙 投币 (C)</button>
    <div class="dpad">
      <button class="up"    data-dir="up">▲</button>
      <button class="left"  data-dir="left">◀</button>
      <button class="grab-btn" data-dir="grab">抓!</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down"  data-dir="down">▼</button>
    </div>
    <div class="prize-box">🎀 战利品 × <span id="claw-prizes">0</span></div>
  </div>
</section>

<!-- ============ 应用2：马里奥闯关 ============ -->
<section id="app-mario" class="app">
  <canvas id="mario-canvas" width="960" height="540"></canvas>
</section>

<!-- ============ 应用3：钢铁侠头盔 ============ -->
<section id="app-helmet" class="app">
  <div id="helmet-viewport"></div>
  <div class="helmet-hint">🖱 按住拖动 360° 旋转 · 滚轮缩放 · 静置自动旋转</div>
  <div class="helmet-bar">
    <button class="bg-btn" id="btn-change-bg">🌆 换背景：<span id="bg-name">赛博都市</span></button>
  </div>
</section>

  function neonStrip(parent, w, h, d, color, x, y, z, glowScale) {
    var bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshBasicMaterial({ color: color }));
    bar.position.set(x, y, z); parent.add(bar);
    var gs = glowScale || 0.55;
    var gsx = Math.max(w, d) * 1.4 + gs, gsy = Math.max(h, 0.1) * 1.1 + gs;
    addGlow(parent, color, gsx, gsy, x, y, z, 0.42);
    return bar;
  }
  // r128 无 CapsuleGeometry：球 + 圆柱拼接
  function capsuleGeo(r, len, mat) {
    var grp = new THREE.Group();
    var cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 18), mat);
    var s1 = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat);
    var s2 = s1.clone();
    s1.position.y = len / 2; s2.position.y = -len / 2;
    grp.add(cyl); grp.add(s1); grp.add(s2);
    return grp;
  }
  function stdMat(color, metal, rough, extra) {
    var p = { color: color, metalness: metal == null ? 0.85 : metal, roughness: rough == null ? 0.4 : rough };
    if (extra) for (var k in extra) p[k] = extra[k];
    return new THREE.MeshStandardMaterial(p);
  }

  /* ---------- 场景 ---------- */
  function initScene() {
    var vp = document.getElementById('claw-viewport');
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    vp.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);
    scene.fog = new THREE.Fog(0x05060a, 16, 34);

    camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.copy(baseCamPos);
    camera.lookAt(baseCamLook);

    clock = new THREE.Clock();
    glowTex = glowTexture();

    buildLights();
    buildRoom();
    buildCabinet();
    buildMarquee();
    buildPlushies();
    buildClaw();
    buildControlPanel();
    resize();
    inited = true;
  }

  function buildLights() {
    scene.add(new THREE.AmbientLight(0x2e3442, 0.75));
    var hemi = new THREE.HemisphereLight(0x39405c, 0x0a0a12, 0.55); scene.add(hemi);

    var key = new THREE.DirectionalLight(0xffffff, 0.85);
    key.position.set(7, 12, 9);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -9; key.shadow.camera.right = 9;
    key.shadow.camera.top = 11; key.shadow.camera.bottom = -3;
    key.shadow.camera.far = 40; key.shadow.bias = -0.0004;
    key.target.position.set(0, 3.5, 0);
    scene.add(key); scene.add(key.target);

    // 舱内明亮灯光（带辉光）
    var p1 = new THREE.PointLight(0xfff2e8, 1.35, 7.5); p1.position.set(0, 3.7, 0.6); scene.add(p1);
    addGlow(scene, 0xfff2e8, 1.6, 1.6, 0, 3.7, 0.6, 0.65);
    var p2 = new THREE.PointLight(0xff9ec7, 0.95, 6.5); p2.position.set(-1.3, 2.7, 0.9); scene.add(p2);
    addGlow(scene, 0xff9ec7, 1.3, 1.3, -1.3, 2.7, 0.9, 0.5);
    var p3 = new THREE.PointLight(0x66e0ff, 0.6, 6); p3.position.set(1.4, 2.4, 1.0); scene.add(p3);

    // 操控面板射灯（打亮底座与操控区）
    var spot = new THREE.SpotLight(0xfff3dd, 1.25, 14, 0.52, 0.65, 1);
    spot.position.set(0, 6.6, 6.2);
    spot.target.position.set(0, 1.0, 1.9);
    scene.add(spot); scene.add(spot.target);
    var warm = new THREE.PointLight(0xffe6c4, 0.55, 5.5); warm.position.set(0, 2.0, 3.4); scene.add(warm);
    // 出货口内粉色灯
    var chuteL = new THREE.PointLight(0xff2d95, 0.9, 3.2); chuteL.position.set(CHUTE.x, 1.15, CHUTE.z + 0.6); scene.add(chuteL);
    addGlow(scene, 0xff2d95, 0.9, 0.9, CHUTE.x, 1.15, CHUTE.z + 0.6, 0.5);
    // 招牌补光
    var sign = new THREE.SpotLight(0xffffff, 0.55, 16, 0.5, 0.7, 1);
    sign.position.set(0, 8.6, 5.2); sign.target.position.set(0, 6.2, 1.8);
    scene.add(sign); scene.add(sign.target);
  }

  function buildRoom() {
    var ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), stdMat(0x0a0c12, 0.85, 0.55));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    var pedestal = new THREE.Mesh(new THREE.CylinderGeometry(3.35, 3.55, 0.14, 48), stdMat(0x141821, 0.9, 0.35));
    pedestal.position.y = 0.07; pedestal.receiveShadow = true; scene.add(pedestal);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(3.12, 0.035, 10, 80), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.15; scene.add(ring);
    var ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.55, 0.02, 8, 72), new THREE.MeshBasicMaterial({ color: 0xff2d95 }));
    ring2.rotation.x = Math.PI / 2; ring2.position.y = 0.15; scene.add(ring2);
    addGlow(scene, 0x00e5ff, 7.5, 7.5, 0, 0.4, 0, 0.16);
  }

  function buildCabinet() {
    var metal = stdMat(0x161a22, 0.88, 0.38);
    var metal2 = stdMat(0x232936, 0.9, 0.3);
    var frontZ = CAB_D / 2;   // 1.7

    // 底座
    var plinth = new THREE.Mesh(new THREE.BoxGeometry(CAB_W + 0.3, PLINTH_Y1 - PLINTH_Y0, CAB_D + 0.3), metal2);
    plinth.position.set(0, (PLINTH_Y0 + PLINTH_Y1) / 2, 0);
    plinth.castShadow = plinth.receiveShadow = true; scene.add(plinth);
    neonStrip(scene, CAB_W + 0.3, 0.055, 0.055, 0x00e5ff, 0, PLINTH_Y1 - 0.06, frontZ + 0.16, 0.5);
    neonStrip(scene, 0.055, 0.055, CAB_D + 0.3, 0xff2d95, -(CAB_W / 2 + 0.16), PLINTH_Y1 - 0.06, 0, 0.5);
    neonStrip(scene, 0.055, 0.055, CAB_D + 0.3, 0xff2d95, (CAB_W / 2 + 0.16), PLINTH_Y1 - 0.06, 0, 0.5);

    // 下柜体
    var lower = new THREE.Mesh(new THREE.BoxGeometry(CAB_W, CAB_Y1 - CAB_Y0, CAB_D), metal);
    lower.position.set(0, (CAB_Y0 + CAB_Y1) / 2, 0);
    lower.castShadow = lower.receiveShadow = true; scene.add(lower);

    // 舱体地板
    var floor = new THREE.Mesh(new THREE.BoxGeometry(CAB_W - 0.2, 0.1, CAB_D - 0.2), stdMat(0x2c1220, 0.2, 0.9));
    floor.position.set(0, CABIN_Y0 + 0.05, 0); floor.receiveShadow = true; scene.add(floor);
    neonStrip(scene, CAB_W - 0.2, 0.04, 0.04, 0xff2d95, 0, CABIN_Y0 + 0.04, frontZ - 0.12, 0.4);

    // 侧壁 + 背板
    var sideL = new THREE.Mesh(new THREE.BoxGeometry(0.12, CABIN_Y1 - CABIN_Y0, CAB_D), metal);
    sideL.position.set(-(CAB_W / 2 - 0.06), (CABIN_Y0 + CABIN_Y1) / 2, 0);
    sideL.castShadow = sideL.receiveShadow = true; scene.add(sideL);
    var sideR = sideL.clone(); sideR.position.x *= -1; scene.add(sideR);
    var back = new THREE.Mesh(new THREE.BoxGeometry(CAB_W, CABIN_Y1 - CABIN_Y0, 0.12), metal);
    back.position.set(0, (CABIN_Y0 + CABIN_Y1) / 2, -(CAB_D / 2 - 0.06));
    back.receiveShadow = true; scene.add(back);
    // 背板内侧柔光板（舱内主光源背景）
    var panel = new THREE.Mesh(new THREE.PlaneGeometry(CAB_W - 0.5, CABIN_Y1 - CABIN_Y0 - 0.5),
      new THREE.MeshBasicMaterial({ color: 0xfff6ef }));
    panel.position.set(0, (CABIN_Y0 + CABIN_Y1) / 2, -(CAB_D / 2 - 0.14));
    scene.add(panel);
    addGlow(scene, 0xfff6ef, 3.6, 2.4, 0, 2.9, -(CAB_D / 2 - 0.35), 0.35);

    // 前立柱（金属包边 + 霓虹）
    neonStrip(scene, 0.09, CABIN_Y1 - CABIN_Y0, 0.09, 0x00e5ff, -(CAB_W / 2 - 0.02), (CABIN_Y0 + CABIN_Y1) / 2, frontZ, 0.55);
    neonStrip(scene, 0.09, CABIN_Y1 - CABIN_Y0, 0.09, 0xff2d95, (CAB_W / 2 - 0.02), (CABIN_Y0 + CABIN_Y1) / 2, frontZ, 0.55);

    // 玻璃前罩 & 顶罩
    var glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.07,
      roughness: 0.06, metalness: 0.35, depthWrite: false });
    var glassF = new THREE.Mesh(new THREE.PlaneGeometry(CAB_W - 0.24, CABIN_Y1 - CABIN_Y0 - 0.1), glassMat);
    glassF.position.set(0, (CABIN_Y0 + CABIN_Y1) / 2, frontZ - 0.02); scene.add(glassF);
    var glassT = new THREE.Mesh(new THREE.PlaneGeometry(CAB_W - 0.24, CAB_D - 0.24), glassMat.clone());
    glassT.rotation.x = -Math.PI / 2; glassT.position.set(0, CABIN_Y1 - 0.04, 0); scene.add(glassT);

    // 舱顶装饰板
    var top = new THREE.Mesh(new THREE.BoxGeometry(CAB_W, 0.12, CAB_D), metal);
    top.position.set(0, CABIN_Y1 + 0.04, 0); top.castShadow = true; scene.add(top);
  }

  function buildMarquee() {
    var mw = 3.3, mh = MARQ_H, md = 0.55;
    var cy = MARQ_Y0 + mh / 2;
    var body = new THREE.Mesh(new THREE.BoxGeometry(mw, mh, md), stdMat(0x2a1220, 0.85, 0.35));
    body.position.set(0, cy, 1.55); body.castShadow = true; scene.add(body);
    neonStrip(scene, mw + 0.1, 0.05, 0.05, 0x00e5ff, 0, MARQ_Y0 + 0.05, 1.55 + md / 2 + 0.03, 0.5);
    neonStrip(scene, mw + 0.1, 0.05, 0.05, 0xff2d95, 0, MARQ_Y0 + mh - 0.05, 1.55 + md / 2 + 0.03, 0.5);
    neonStrip(scene, 0.05, mh, 0.05, 0xff2d95, -(mw / 2 + 0.03), cy, 1.55 + md / 2 + 0.03, 0.5);
    neonStrip(scene, 0.05, mh, 0.05, 0x00e5ff, (mw / 2 + 0.03), cy, 1.55 + md / 2 + 0.03, 0.5);

    // 招牌海报（完整展示参考图）
    if (!posterTex) {
      posterTex = new THREE.TextureLoader().load(IMG00);
      posterTex.encoding = THREE.sRGBEncoding;
      posterTex.anisotropy = 8;
    }
    var pw = 3.0, ph = pw * (1439 / 1080);   // 4.066
    var poster = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph),
      new THREE.MeshBasicMaterial({ map: posterTex }));
    poster.position.set(0, cy + 0.03, 1.55 + md / 2 + 0.035);
    scene.add(poster);
    // 海报边框（内衬粉/青霓虹）
    neonStrip(scene, pw + 0.16, 0.045, 0.045, 0xff2d95, 0, cy + 0.03 + ph / 2 + 0.08, 1.55 + md / 2 + 0.05, 0.45);
    neonStrip(scene, pw + 0.16, 0.045, 0.045, 0xff2d95, 0, cy + 0.03 - ph / 2 - 0.08, 1.55 + md / 2 + 0.05, 0.45);
    neonStrip(scene, 0.045, ph + 0.16, 0.045, 0x00e5ff, -(pw / 2 + 0.08), cy + 0.03, 1.55 + md / 2 + 0.05, 0.45);
    neonStrip(scene, 0.045, ph + 0.16, 0.045, 0x00e5ff, (pw / 2 + 0.08), cy + 0.03, 1.55 + md / 2 + 0.05, 0.45);
    addGlow(scene, 0xff2d95, pw + 1.2, ph + 1.2, 0, cy, 1.6, 0.10);

    // 侧面霓虹箭头
    var tri = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.4, 3), new THREE.MeshBasicMaterial({ color: 0xff2d95 }));
    tri.rotation.z = -Math.PI / 2; tri.rotation.y = Math.PI / 2;
    tri.position.set(-(mw / 2 + 0.3), cy, 1.55); scene.add(tri);
    var tri2 = tri.clone(); tri2.position.x *= -1; tri2.rotation.y = -Math.PI / 2; scene.add(tri2);
  }

  /* ---------- 玩偶 ---------- */
  var PLUSH_KINDS = [
    { kind: 'bear', body: 0xc98d5e }, { kind: 'bunny', body: 0xf3f0ff },
    { kind: 'cat', body: 0xf5a242 }, { kind: 'pig', body: 0xf7a8b8 },
    { kind: 'frog', body: 0x7cc46a }, { kind: 'panda', body: 0xf2f2f2 },
    { kind: 'chick', body: 0xf7d154 }, { kind: 'fox', body: 0xe07b39 }
  ];
  var SHIRT_COLORS = [0xff5d8f, 0x37c8ff, 0xffd166, 0x9b5de5, 0x06d6a0, 0xff7847];
  var HAT_COLORS = [0xff2d95, 0x00e5ff, 0xffd166, 0x9b5de5, 0x06d6a0];

  function buildPlush(spec) {
    var g = new THREE.Group();
    var K = spec.kind;
    var mat = function (c) { return stdMat(c, 0.05, 0.85); };

    // 身体（球+圆柱拼接的胶囊体）
    var bodyG = capsuleGeo(0.17, 0.18, mat(spec.body));
    bodyG.position.y = 0.32; g.add(bodyG);

    // 衣服：小背心 + 纽扣
    var shirt = new THREE.Mesh(new THREE.CylinderGeometry(0.178, 0.19, 0.15, 20), mat(spec.shirt));
    shirt.position.y = 0.30; g.add(shirt);
    [-0.045, 0.045].forEach(function (bx) {
      var b = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), mat(0xffffff, 0.2, 0.5));
      b.position.set(bx, 0.33, 0.185); g.add(b);
    });

    // 头
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.20, 26, 20), mat(spec.body));
    head.position.y = 0.66; g.add(head);

    // 眼睛 / 表情
    if (K === 'frog') {
      [-0.09, 0.09].forEach(function (ex) {
        var w = new THREE.Mesh(new THREE.SphereGeometry(0.068, 14, 12), mat(0xffffff, 0.05, 0.6));
        w.position.set(ex, 0.85, 0.05); g.add(w);
        var p = new THREE.Mesh(new THREE.SphereGeometry(0.032, 10, 10), mat(0x14161c, 0.2, 0.4));
        p.position.set(ex, 0.85, 0.11); g.add(p);
      });
      var fm = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.012, 8, 20, Math.PI), mat(0x2c5a20, 0.1, 0.7));
      fm.position.set(0, 0.62, 0.17); fm.rotation.x = -0.3; fm.rotation.z = Math.PI; g.add(fm);
    } else {
      [-0.075, 0.075].forEach(function (ex) {
        var e = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 10), mat(0x14161c, 0.2, 0.35));
        e.position.set(ex, 0.70, 0.165); g.add(e);
        var h = new THREE.Mesh(new THREE.SphereGeometry(0.010, 8, 8), mat(0xffffff, 0.0, 0.3));
        h.position.set(ex - 0.008, 0.712, 0.186); g.add(h);
      });
      var mouth = new THREE.Mesh(new THREE.TorusGeometry(0.042, 0.011, 8, 18, Math.PI), mat(0x5a2020, 0.1, 0.6));
      mouth.position.set(0, 0.615, 0.175); mouth.rotation.z = Math.PI; g.add(mouth);
      // 腮红
      [-0.118, 0.118].forEach(function (bx) {
        var bl = new THREE.Mesh(new THREE.SphereGeometry(0.024, 10, 8),
          new THREE.MeshStandardMaterial({ color: 0xff9fb0, roughness: 0.9, transparent: true, opacity: 0.75 }));
        bl.position.set(bx, 0.64, 0.155); bl.scale.z = 0.4; g.add(bl);
      });
    }

    // 口鼻（猪/熊/猫/狐狸）
    if (K === 'pig') {
      var sn = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.07, 16), mat(0xf7c3cb, 0.05, 0.7));
      sn.rotation.x = Math.PI / 2; sn.position.set(0, 0.63, 0.18); g.add(sn);
      [-0.022, 0.022].forEach(function (nx) {
        var n = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), mat(0x8a4a55, 0.1, 0.5));
        n.position.set(nx, 0.63, 0.218); g.add(n);
      });
    } else if (K === 'fox') {
      var mz = new THREE.Mesh(new THREE.SphereGeometry(0.10, 16, 12), mat(0xfff6ea, 0.05, 0.8));
      mz.position.set(0, 0.60, 0.10); mz.scale.set(1, 0.8, 0.7); g.add(mz);
    } else if (K === 'chick') {
      var beak = new THREE.Mesh(new THREE.ConeGeometry(0.038, 0.10, 12), mat(0xff8c42, 0.1, 0.5));
      beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.645, 0.20); g.add(beak);
      var feather = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.10, 8), mat(spec.body, 0.05, 0.8));
      feather.position.set(0, 0.90, 0); g.add(feather);
    } else if (K === 'panda') {
      [-0.075, 0.075].forEach(function (ex) {
        var pat = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 10), mat(0x14161c, 0.1, 0.5));
        pat.position.set(ex, 0.71, 0.145); pat.scale.z = 0.5; g.add(pat);
      });
      [-0.13, 0.13].forEach(function (ex) {
        var ear = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), mat(0x14161c, 0.1, 0.5));
        ear.position.set(ex, 0.84, 0); g.add(ear);
      });
    }

    // 耳朵
    if (K === 'bear' || K === 'panda') {
      [-0.125, 0.125].forEach(function (ex) {
        var ear = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), mat(spec.body));
        ear.position.set(ex, 0.85, 0); g.add(ear);
      });
    } else if (K === 'bunny') {
      [-0.085, 0.085].forEach(function (ex) {
        var earG = capsuleGeo(0.045, 0.17, mat(spec.body));
        earG.position.set(ex, 0.97, 0); earG.rotation.z = ex > 0 ? -0.12 : 0.12; g.add(earG);
      });
    } else if (K === 'cat' || K === 'fox' || K === 'pig') {
      [-0.105, 0.105].forEach(function (ex) {
        var ear = new THREE.Mesh(new THREE.ConeGeometry(0.068, 0.15, 4), mat(spec.body));
        ear.position.set(ex, 0.865, 0); ear.rotation.y = Math.PI / 4; g.add(ear);
      });
    }

    // 头饰：派对帽 / 蝴蝶结 / 毛线帽
    if (spec.hat === 'party') {
      var hat = new THREE.Mesh(new THREE.ConeGeometry(0.095, 0.20, 18), mat(spec.hatColor, 0.1, 0.5));
      hat.position.set(0, 0.92, 0); hat.rotation.z = 0.08; g.add(hat);
      var pom = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 10), mat(0xffffff, 0.1, 0.5));
      pom.position.set(0.02, 1.03, 0); g.add(pom);
    } else if (spec.hat === 'bow') {
      [-1, 1].forEach(function (s) {
        var wing = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.12, 4), mat(spec.hatColor, 0.1, 0.5));
        wing.position.set(s * 0.065, 0.88, 0.12);
        wing.rotation.z = s * 1.25; wing.rotation.y = Math.PI / 4; g.add(wing);
      });
      var knot = new THREE.Mesh(new THREE.SphereGeometry(0.032, 10, 8), mat(spec.hatColor, 0.1, 0.5));
      knot.position.set(0, 0.88, 0.14); g.add(knot);
    } else if (spec.hat === 'beanie') {
      var cap = new THREE.Mesh(new THREE.SphereGeometry(0.205, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(spec.hatColor, 0.05, 0.8));
      cap.position.y = 0.70; g.add(cap);
      var brim = new THREE.Mesh(new THREE.CylinderGeometry(0.212, 0.212, 0.05, 20), mat(spec.hatColor, 0.05, 0.8));
      brim.position.y = 0.685; g.add(brim);
    }

    // 手臂 + 脚
    [-1, 1].forEach(function (s) {
      var arm = capsuleGeo(0.05, 0.10, mat(spec.body));
      arm.position.set(s * 0.21, 0.42, 0); arm.rotation.z = s * 0.55; g.add(arm);
      var foot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), mat(spec.body));
      foot.position.set(s * 0.095, 0.055, 0.045); foot.scale.set(1, 0.6, 1.25); g.add(foot);
    });

    g.traverse(function (o) { if (o.isMesh) o.castShadow = true; });
    return g;
  }

  function spawnPlush(x, z, scaleIn) {
    var i = Math.floor(Math.random() * PLUSH_KINDS.length);
    var kind = PLUSH_KINDS[i];
    var hats = ['party', 'bow', 'beanie', null];
    var hat = hats[Math.floor(Math.random() * hats.length)];
    var plush = buildPlush({
      kind: kind.kind, body: kind.body,
      shirt: SHIRT_COLORS[Math.floor(Math.random() * SHIRT_COLORS.length)],
      hat: hat, hatColor: HAT_COLORS[Math.floor(Math.random() * HAT_COLORS.length)]
    });
    plush.position.set(x, CABIN_Y0 + 0.1, z);
    plush.rotation.y = (Math.random() - 0.5) * 1.2;
    plush.rotation.z = (Math.random() - 0.5) * 0.08;
    var s = 0.92 + Math.random() * 0.16;
    plush.scale.set(s, s, s);
    plush.userData = { caught: false };
    if (scaleIn) { plush.scale.set(0.01, 0.01, 0.01); plush.userData.scaleIn = 0; }
    scene.add(plush); plushies.push(plush);
    return plush;
  }

  function buildPlushies() {
    var spots = [
      [-1.30, -0.62], [-0.45, -0.88], [0.42, -0.72], [1.32, -0.48],

  /* ---------- 机械爪 ---------- */
  function buildClaw() {
    var chrome = stdMat(0xb9c2cf, 1.0, 0.22);
    var darkMetal = stdMat(0x3a4150, 0.95, 0.35);

    // 固定滑轨（沿 Z 方向两根）
    [-1.98, 1.98].forEach(function (rx) {
      var rail = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 2.9), darkMetal);
      rail.position.set(rx, GANTRY_Y + 0.1, 0); scene.add(rail);
      neonStrip(scene, 0.03, 0.03, 2.9, 0xff2d95, rx, GANTRY_Y + 0.15, 0, 0.35);
    });

    // 移动桥（沿 Z）
    bridge = new THREE.Group(); bridge.position.set(0, GANTRY_Y, 0); scene.add(bridge);
    var beam = new THREE.Mesh(new THREE.BoxGeometry(4.35, 0.10, 0.26), darkMetal);
    beam.castShadow = true; bridge.add(beam);
    neonStrip(bridge, 4.35, 0.03, 0.03, 0x00e5ff, 0, -0.055, 0, 0.4);

    // 滑车（沿 X）
    trolley = new THREE.Group(); trolley.position.set(0, -0.06, 0); bridge.add(trolley);
    var tbox = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.17, 0.42), chrome);
    tbox.castShadow = true; trolley.add(tbox);
    neonStrip( trolley, 0.52, 0.03, 0.03, 0xff2d95, 0, 0.10, 0, 0.4);
    [-0.18, 0.18].forEach(function (wx) {
      var wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.05, 16), darkMetal);
      wheel.rotation.x = Math.PI / 2; wheel.position.set(wx, 0.10, 0); trolley.add(wheel);
    });

    // 缆绳（主 + 副）
    cable = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 10), darkMetal);
    trolley.add(cable);
    cable2 = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 8), chrome);
    trolley.add(cable2);

    // 爪组
    clawGroup = new THREE.Group(); trolley.add(clawGroup);
    clawHub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.13, 24), chrome);
    clawHub.castShadow = true; clawGroup.add(clawHub);
    var hubDome = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), darkMetal);
    hubDome.position.y = 0.06; clawGroup.add(hubDome);
    neonStrip(clawGroup, 0.3, 0.025, 0.3, 0x00e5ff, 0, -0.07, 0, 0.5);

    // 三指多关节机械爪
    for (var a = 0; a < 3; a++) {
      var ang = a * Math.PI * 2 / 3;
      var pivot = new THREE.Group();
      pivot.position.set(Math.cos(ang) * 0.11, -0.05, Math.sin(ang) * 0.11);
      pivot.rotation.y = -ang + Math.PI / 2;
      clawGroup.add(pivot);

      // 上节臂 + 液压杆
      var upperPivot = new THREE.Group(); pivot.add(upperPivot);
      var upper = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.038, 0.5, 14), chrome);
      upper.position.y = -0.25; upper.castShadow = true; upperPivot.add(upper);
      // 液压杆（外筒 + 活塞杆）
      var cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.26, 10), darkMetal);
      cyl.position.set(0.075, -0.12, 0); cyl.rotation.z = 0.5; upperPivot.add(cyl);
      var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.22, 8), chrome);
      rod.position.set(0.115, -0.035, 0); rod.rotation.z = 0.5; upperPivot.add(rod);
      // 铰接螺栓
      var bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.1, 12), darkMetal);
      bolt.rotation.x = Math.PI / 2; upperPivot.add(bolt);

      // 下节臂（肘关节）
      var elbowPivot = new THREE.Group(); elbowPivot.position.y = -0.5; upperPivot.add(elbowPivot);
      var bolt2 = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.09, 10), darkMetal);
      bolt2.rotation.x = Math.PI / 2; elbowPivot.add(bolt2);
      var lower = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.028, 0.42, 12), chrome);
      lower.position.y = -0.21; lower.castShadow = true; elbowPivot.add(lower);
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.1, 10), chrome);
      tip.position.y = -0.47; tip.rotation.x = Math.PI; elbowPivot.add(tip);

      upperPivots.push(upperPivot); elbowPivots.push(elbowPivot);
    }
    clawGroup.scale.set(1.28, 1.28, 1.28);
    setClawOpen(0);
  }
  var clawOpenF = 0;
  function setClawOpen(f) {
    clawOpenF = f;
    var tilt = 0.42 - 0.30 * f;    // 0.42张开 → 0.12闭合
    var curl = -0.18 + 0.95 * f;   // 向内收
    for (var i = 0; i < 3; i++) {
      upperPivots[i].rotation.z = tilt;
      elbowPivots[i].rotation.z = curl;
    }
  }

    deck.position.set(0.35, CAB_Y1 - 0.06, panelZ + 0.18);

    neonStrip(scene, 2.6, 0.03, 0.03, 0x00e5ff, 0.35, CAB_Y1 - 0.02, panelZ + 0.18, 0.4);

    var stickBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.19, 0.08, 20), stdMat(0x11141c, 0.7, 0.4));
    stickBase.position.set(-0.15, CAB_Y1 + 0.02, panelZ + 0.26); scene.add(stickBase);
    var stick = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.3, 12), stdMat(0x9aa3b5, 1, 0.25));

      btn.position.set(bd[0], CAB_Y1 + 0.015, panelZ + 0.3); scene.add(btn);

    // 投币口
    var slotBox = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.1), stdMat(0x2a3242, 0.95, 0.3));
    slotBox.position.set(1.55, CAB_Y1 - 0.22, panelZ + 0.03); scene.add(slotBox);
    var slit = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.035, 0.04),
      new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffd166, emissiveIntensity: 0.9 }));
    slit.position.set(1.55, CAB_Y1 - 0.05, panelZ + 0.09); scene.add(slit);
    addGlow(scene, 0xffd166, 0.5, 0.35, 1.55, CAB_Y1 - 0.05, panelZ + 0.12, 0.45);

    // 出货口（取货门，内部打亮）
    var chuteBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.72, 0.5), stdMat(0x1a1f2a, 0.9, 0.35));
    chuteBox.position.set(CHUTE.x, CAB_Y0 + 0.36, panelZ - 0.1); scene.add(chuteBox);
    var door = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.5, 0.05), stdMat(0x0d0f16, 0.6, 0.5));
    door.position.set(CHUTE.x, CAB_Y0 + 0.34, panelZ + 0.16); scene.add(door);
    neonStrip(scene, 0.72, 0.04, 0.04, 0xff2d95, CHUTE.x, CAB_Y0 + 0.68, panelZ + 0.17, 0.45);
    neonStrip(scene, 0.72, 0.04, 0.04, 0xff2d95, CHUTE.x, CAB_Y0 + 0.12, panelZ + 0.17, 0.45);
    // 舱内落料井盖
    var hatch = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.05, 0.66), stdMat(0x0d0f16, 0.6, 0.5));
    hatch.position.set(CHUTE.x, CABIN_Y0 + 0.13, CHUTE.z); scene.add(hatch);
    neonStrip(scene, 0.7, 0.03, 0.03, 0xff2d95, CHUTE.x, CABIN_Y0 + 0.16, CHUTE.z + 0.36, 0.4);
    neonStrip(scene, 0.7, 0.03, 0.03, 0xff2d95, CHUTE.x, CABIN_Y0 + 0.16, CHUTE.z - 0.36, 0.4);
  }

  /* ---------- UI / 交互 ---------- */
  function setHint(t) { if (elHint) elHint.textContent = t; }
  function refreshHUD() {
    if (elCoins) elCoins.textContent = coins;
    if (elPrizes) elPrizes.textContent = prizes;
  }
  function insertCoin() {
    coins++; refreshHUD();
    if (state === 'IDLE') { state = 'READY'; setHint('移动爪子瞄准娃娃，按「抓!」或空格下爪！'); }
    else if (state === 'READY') setHint('移动爪子瞄准娃娃，按「抓!」或空格下爪！');
  }
  function pressGrab() {
    if (state !== 'READY') return;
    coins--; refreshHUD();
    state = 'DROPPING'; stateT = 0;
    setHint('爪子下探中…');
  }

  function bindEvents() {
    elCoins = document.getElementById('claw-coins');
    elPrizes = document.getElementById('claw-prizes');
    elHint = document.getElementById('claw-hint');
    document.getElementById('btn-insert-coin').addEventListener('click', insertCoin);

    var dirMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
    window.addEventListener('keydown', function (e) {
      if (TabCtl.current !== 'claw') return;
      if (dirMap[e.key]) { keys[dirMap[e.key]] = true; e.preventDefault(); }
      if (e.key === ' ') { pressGrab(); e.preventDefault(); }
      if (e.key === 'Enter') pressGrab();
      if (e.key === 'c' || e.key === 'C') insertCoin();
    });
    window.addEventListener('keyup', function (e) {
      if (dirMap[e.key]) keys[dirMap[e.key]] = false;
    });
    document.querySelectorAll('.dpad button').forEach(function (b) {
      var dir = b.getAttribute('data-dir');
      var on = function (e) { e.preventDefault();
        if (dir === 'grab') pressGrab(); else keys[dir] = true; };
      var off = function () { if (dir !== 'grab') keys[dir] = false; };
      b.addEventListener('pointerdown', on);
      b.addEventListener('pointerup', off);
      b.addEventListener('pointerleave', off);
      b.addEventListener('pointercancel', off);
    });
    window.addEventListener('mousemove', function (e) {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    window.addEventListener('resize', resize);
  }

  function resize() {
    if (!inited) return;
    var vp = document.getElementById('claw-viewport');
    var w = vp.clientWidth || window.innerWidth, h = vp.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  /* ---------- 状态机 ---------- */
  function nearestPlush() {
    clawGroup.getWorldPosition(_v1);
    var best = null, bestD = 0.56;
    for (var i = 0; i < plushies.length; i++) {
      var p = plushies[i];
      if (p.userData.caught || p.userData.dying) continue;
      var dx = p.position.x - _v1.x, dz = p.position.z - _v1.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      if (d < bestD) { bestD = d; best = p; }
    }
    return { plush: best, dist: bestD };
  }
  var _v1 = new THREE.Vector3();

  function update(dt, t) {
    // 霓虹呼吸
    for (var i = 0; i < glows.length; i++) {
      var g = glows[i];
      g.material.opacity = g.userData.baseOpacity * (0.82 + 0.18 * Math.sin(t * 2.4 + g.userData.phase));
    }

    // 被抓玩偶跟随
    if (caught) {
      clawGroup.getWorldPosition(_v1);
      caught.position.x += (_v1.x - caught.position.x) * Math.min(1, dt * 10);
      caught.position.z += (_v1.z - caught.position.z) * Math.min(1, dt * 10);
      caught.position.y += ((_v1.y - 1.22) - caught.position.y) * Math.min(1, dt * 10);
      caught.rotation.z = Math.sin(t * 6) * 0.08;
    }
    // 重生入场
    for (var j = 0; j < plushies.length; j++) {
      var p = plushies[j];
      if (p.userData.scaleIn !== undefined && p.userData.scaleIn < 1) {
        p.userData.scaleIn = Math.min(1, p.userData.scaleIn + dt * 2);
        var e = 1 - Math.pow(1 - p.userData.scaleIn, 3);
        p.scale.set(e, e, e);
      }
      if (p.userData.dying) {
        p.userData.dieT += dt;
        p.position.y -= dt * 1.2;
        var f = Math.max(0, 1 - p.userData.dieT * 2.2);
        p.scale.set(f, f, f);
        if (f <= 0.01) {
          scene.remove(p);
          plushies.splice(j, 1); j--;
        }
      }
    }
    if (respawnTimer > 0) {
      respawnTimer -= dt;
      if (respawnTimer <= 0) spawnPlush((Math.random() - 0.5) * 2.6, -0.2 + Math.random() * 1.2, true);
    }

    // 爪部机构
    bridge.position.z += (targetZ - bridge.position.z) * Math.min(1, dt * 8);
    trolley.position.x += (targetX - trolley.position.x) * Math.min(1, dt * 8);
    cable.position.y = -len / 2; cable.scale.y = len;
    cable2.position.set(0.09, -len / 2, 0.07); cable2.scale.y = len;
    clawGroup.position.y = -len;

    var spd = 2.3;
    if (state === 'READY') {
      if (keys.left)  targetX = Math.max(-LIM_X, targetX - spd * dt);
      if (keys.right) targetX = Math.min( LIM_X, targetX + spd * dt);
      if (keys.up)    targetZ = Math.max(-LIM_Z, targetZ - spd * dt);
      if (keys.down)  targetZ = Math.min( LIM_Z, targetZ + spd * dt);
      if (keys.grabPressed) { keys.grabPressed = false; pressGrab(); }
    }

    if (state === 'DROPPING') {
      len = Math.min(LEN_MAX, len + dt * 1.5);
      if (len >= LEN_MAX - 0.001) { state = 'CLOSING'; stateT = 0; }
    } else if (state === 'CLOSING') {
      stateT += dt;
      var f = Math.min(1, stateT / 0.55);
      setClawOpen(f);
      if (f >= 1) {
        var r = nearestPlush();
        grabPlush = null;
        if (r.plush) {
          grabChance = Math.max(0.25, Math.min(0.95, 0.95 - r.dist * 1.1));
          if (Math.random() < grabChance) {
            grabPlush = r.plush; r.plush.userData.caught = true; caught = r.plush;
          }
        }
        state = 'RAISING'; setHint(grabPlush ? '抓到了！送回出货口…' : '哎呀，滑掉了…');
      }
    } else if (state === 'RAISING') {
      len = Math.max(LEN_MIN, len - dt * 1.7);
      if (len <= LEN_MIN + 0.001) { state = 'RETURNING'; }
    } else if (state === 'RETURNING') {
      var dx = CHUTE.x - targetX, dz = CHUTE.z - targetZ;
      var d = Math.sqrt(dx * dx + dz * dz);
      var mv = 2.8 * dt;
      if (d <= mv) { targetX = CHUTE.x; targetZ = CHUTE.z; state = 'RELEASING'; stateT = 0; }
      else { targetX += dx / d * mv; targetZ += dz / d * mv; }
    } else if (state === 'RELEASING') {
      stateT += dt;
      setClawOpen(Math.max(0, 1 - stateT / 0.4));
      if (stateT >= 0.4 && grabPlush) {
        var gp = grabPlush;
        gp.userData.caught = false; caught = null;
        gp.userData.dying = true; gp.userData.dieT = -0.9;  // 先自由落体掉进出货井
        grabPlush = null; prizes++; refreshHUD(); respawnTimer = 1.4;
        setHint('🎉 抓到了！玩偶送入取货口');
      }
      if (stateT >= 0.9) {
        setClawOpen(0);
        if (coins > 0) { state = 'READY'; setHint('继续！移动爪子瞄准下一个目标'); }
        else { state = 'IDLE'; setHint('点击「投币」再来一次！'); }
      }
    }

    // 相机视差
    camera.position.x += (baseCamPos.x + mouseX * 0.55 - camera.position.x) * Math.min(1, dt * 3);
    camera.position.y += (baseCamPos.y - mouseY * 0.35 - camera.position.y) * Math.min(1, dt * 3);
    camera.lookAt(baseCamLook);
  }

  function tick(tms) {
    if (!inited) return;
    var t = tms / 1000, dt = Math.min(0.05, clock.getDelta());
    update(dt, t);
    renderer.render(scene, camera);
  }

  return {
    name: 'claw',
    init: function () { bindEvents(); initScene(); },
    tick: tick,
    resize: resize,
    insertCoin: insertCoin,
    pressGrab: pressGrab,
    state: function () { return state; },
    stats: function () { return { coins: coins, prizes: prizes, state: state, plush: plushies.length }; },
    _step: function (dt, n) {
      for (var i = 0; i < n; i++) update(dt, i * dt);
    },
    _aim: function (x, z) { targetX = x; targetZ = z; },
    _plushPos: function () {
      var out = [];
      scene.traverse(function (o) {
        if (o.userData && o.userData.hasOwnProperty('caught') && !o.userData.dying) out.push([o.position.x.toFixed(2), o.position.z.toFixed(2)]);
      });
      return out;
    },
    _debug: function () {
      return {
        scene: scene, camera: camera, posterTex: posterTex,
        posterMesh: (function () {
          var found = null;
          scene.traverse(function (o) {
            if (o.isMesh && o.material && o.material.map === posterTex) found = o;
          });
          return found;
        })()
      };
    }
  };
})();

  function mgDrawFlag() {
    var sx = flag.x - camX;

  function mgDrawParticles() {

  function mgDrawButton(x, y, w, h, text, color) {

  function mgDrawTitle(t) {
    mgDrawBackground();

    ctx.font = '900 58px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.shadowColor = 'rgba(255,45,149,0.8)'; ctx.shadowBlur = 24;
    var g = ctx.createLinearGradient(0, 90, 0, 160);
    g.addColorStop(0, '#ffe98a'); g.addColorStop(0.5, '#ff9ec7'); g.addColorStop(1, '#ff2d95');
    ctx.fillStyle = g;
    ctx.fillText('超级管道工大冒险', W / 2, 140);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#9fe8ff';
    ctx.fillText('SUPER PIPEWORK ADVENTURE', W / 2, 178);

    var pw = 170, ph = 210, px = W / 2 - pw / 2, py = 210;
    ctx.fillStyle = 'rgba(10,14,24,0.75)';
    ctx.beginPath(); ctx.roundRect(px - 10, py - 10, pw + 20, ph + 44, 18); ctx.fill();
    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(px - 10, py - 10, pw + 20, ph + 44, 18); ctx.stroke();
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 10); ctx.clip();
      var ir = Math.max(pw / img.naturalWidth, ph / img.naturalHeight);
      var iw = img.naturalWidth * ir, ih = img.naturalHeight * ir;
      ctx.drawImage(img, W / 2 - iw / 2, py + ph / 2 - ih / 2, iw, ih);
      ctx.restore();
    }
    ctx.fillStyle = '#bfefff'; ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('今日伙伴 · 神秘主播', W / 2, py + ph + 22);

    // 开始按钮
    mgButtons = [{ x: W / 2 - 150, y: 448, w: 300, h: 62 }];
    mgDrawButton(W / 2 - 150, 448, 300, 62, '▶ 开始游戏', ['#ff5da2', '#c2185b']);

    ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('← → / A D 移动 · 空格 / W 跳跃 · 顶问号砖得金币 · 踩扁板栗仔', W / 2, 536);
    ctx.textAlign = 'left';
  }

  function mgDrawEnd(win) {
    ctx.fillStyle = 'rgba(5,6,12,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '900 52px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.shadowColor = win ? 'rgba(255,217,74,0.9)' : 'rgba(255,60,80,0.9)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = win ? '#ffd94a' : '#ff5d6e';
    ctx.fillText(win ? '🎉 通关成功！' : '游戏结束', W / 2, 200);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 24px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('最终分数：' + score + '    金币：' + coinCount, W / 2, 268);
    mgButtons = [{ x: W / 2 - 130, y: 320, w: 260, h: 58 }];
    mgDrawButton(W / 2 - 130, 320, 260, 58, '重新开始', ['#37c8ff', '#1565c0']);
    ctx.textAlign = 'left';
  }

  function mgRender(t) {
    ctx.clearRect(0, 0, W, H);
    if (state === 'TITLE') { mgDrawTitle(t); return; }
    mgDrawBackground();
    mgDrawFlag();
    mgDrawPlatforms();
    mgDrawCoins(t);
    mgDrawEnemies(t);
    mgDrawPlayer(t);
    mgDrawParticles();
    mgDrawHUD();
    if (state === 'OVER') mgDrawEnd(false);
    else if (state === 'WIN') mgDrawEnd(true);
  }

  function mgFrame(tms) {
    var t = tms / 1000;
    frame++;
    if (state === 'PLAY') {
      mgUpdatePlayer();
      mgUpdateEnemies();
      mgUpdateParticles();
      var target = Math.max(0, Math.min(levelW - W, player.x - W * 0.42));
      camX += (target - camX) * 0.12;
    } else {
      mgUpdateParticles();
    }
    mgRender(t);
  }

  function mgInit() {
    cv = document.getElementById('mario-canvas');
    ctx = cv.getContext('2d');
    img = new Image();
    img.src = IMG01;
    window.addEventListener('keydown', mgOnKeyDown);
    window.addEventListener('keyup', mgOnKeyUp);
    cv.addEventListener('click', mgOnClick);
    mgBuildLevel();
  }

  return {
    name: 'mario',
    init: mgInit,
    frame: mgFrame,
    start: mgStart,
    state: function () { return state; },
    stats: function () { return { state: state, coins: coinCount, score: score, lives: lives, px: player ? player.x : 0 }; }
  };
})();

    camera.lookAt(0, 1.5, 0);
    clock = new THREE.Clock();
    glowTex = glowTexture();

    // 灯光
    scene.add(new THREE.AmbientLight(0x30364a, 0.7));
    var key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(3.5, 5, 4); key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = key.shadow.camera.bottom = -4;
    key.shadow.camera.right = key.shadow.camera.top = 4;
    scene.add(key);
    var fill = new THREE.PointLight(0xff9ec7, 0.7, 20); fill.position.set(-4, 2.5, 3); scene.add(fill);
    var rim = new THREE.PointLight(0x66e0ff, 0.8, 20); rim.position.set(4, 3, -3); scene.add(rim);
    accentLight = new THREE.PointLight(0x66e0ff, 0.6, 12);
    accentLight.position.set(0, 0.5, 4); scene.add(accentLight);

    buildEnvMap();
    buildHelmet();

    // 底座
    var pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.5, 0.14, 40), stdMat(0x141821, 0.9, 0.35));
    pedestal.position.y = 0.07; pedestal.receiveShadow = true; scene.add(pedestal);
    ringMesh = new THREE.Mesh(new THREE.TorusGeometry(1.18, 0.03, 10, 64),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
    ringMesh.rotation.x = Math.PI / 2; ringMesh.position.y = 0.15; scene.add(ringMesh);
    addGlow(scene, 0x00e5ff, 3.4, 3.4, 0, 0.5, 0, 0.14);

    applyTheme(0);
    bindHelmetEvents();
    resize();
    inited = true;
  }

  function applyTheme(i) {
    var th = BG_THEMES[i];
    if (th.type === 'gradient') {
      var c = document.createElement('canvas'); c.width = 4; c.height = 512;
      var g = c.getContext('2d');
      var grad = g.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, th.stops[0]); grad.addColorStop(0.55, th.stops[1]); grad.addColorStop(1, th.stops[2]);
      g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
      var tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      scene.background = tex;
    } else {
      scene.background = new THREE.Color(th.color);
    }
    scene.fog = new THREE.Fog(th.fog, 14, 32);
    ringMesh.material.color.setHex(th.ring);
    accentLight.color.setHex(th.accent);
    var nameEl = document.getElementById('bg-name');
    if (nameEl) nameEl.textContent = th.name;
  }

  function bindHelmetEvents() {
    var el = renderer.domElement;
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', function (e) {
      dragging = true; lastPX = e.clientX; lastPY = e.clientY;
      lastInteract = performance.now();
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      tRotY += (e.clientX - lastPX) * 0.008;
      tRotX = Math.max(-0.65, Math.min(0.65, tRotX + (e.clientY - lastPY) * 0.005));
      lastPX = e.clientX; lastPY = e.clientY;
      lastInteract = performance.now();
    });
    var stop = function () { dragging = false; lastInteract = performance.now(); };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('wheel', function (e) {
      e.preventDefault();
      tDist = Math.max(3.4, Math.min(8.5, tDist + e.deltaY * 0.004));
      lastInteract = performance.now();
    }, { passive: false });

    document.getElementById('btn-change-bg').addEventListener('click', function () {
      bgIndex = (bgIndex + 1) % BG_THEMES.length;
      applyTheme(bgIndex);
    });
    window.addEventListener('resize', resize);
  }

  function resize() {
    if (!inited) return;
    var vp = document.getElementById('helmet-viewport');
    var w = vp.clientWidth || window.innerWidth, h = vp.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  function frame(tms) {
    if (!inited) return;
    var t = tms / 1000, dt = Math.min(0.05, clock.getDelta());
    // 静置自动旋转
    if (!dragging && performance.now() - lastInteract > 2500) tRotY += dt * 0.45;
    rotY += (tRotY - rotY) * Math.min(1, dt * 10);
    rotX += (tRotX - rotX) * Math.min(1, dt * 10);
    dist += (tDist - dist) * Math.min(1, dt * 8);
    helmet.rotation.y = rotY;
    helmet.rotation.x = rotX * 0.55;
    helmet.position.y = 1.55 + Math.sin(t * 0.9) * 0.03;
    camera.position.z = dist;
    camera.lookAt(0, 1.5, 0);
    // 眼部辉光脉动
    for (var i = 0; i < eyeGlows.length; i++) {
      eyeGlows[i].material.opacity = 0.5 + 0.18 * Math.sin(t * 2.2 + i);
    }
    renderer.render(scene, camera);
  }

  return {
    name: 'helmet',
    init: initScene,
    frame: frame,
    resize: resize,
    cycleBg: function () { bgIndex = (bgIndex + 1) % BG_THEMES.length; applyTheme(bgIndex); },
    state: function () { return { bg: BG_THEMES[bgIndex].name, rotY: rotY }; }
  };
})();


/* ==================== 标签页切换 ==================== */
var TabCtl = {
  current: 'claw',
  apps: {},
  init: function () {
    var self = this;
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { self.switch(btn.getAttribute('data-app')); });
    });
  },
  switch: function (name) {
    if (name === this.current && this.apps[name]) return;
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-app') === name);
    });
    document.querySelectorAll('.app').forEach(function (s) {
      s.classList.toggle('active', s.id === 'app-' + name);
    });
    this.current = name;
    var app = this.apps[name];
    if (app) {
      if (!app._started) { app._started = true; app.init(); }
      app.resize();
    }
  }
};

/* ==================== 启动 ==================== */
window.addEventListener('DOMContentLoaded', function () {
  TabCtl.apps = { claw: ClawApp, mario: MarioApp, helmet: HelmetApp };
  TabCtl.init();
  // 默认显示抓娃娃机：延迟初始化，确保容器可见
  setTimeout(function () {
    if (!ClawApp._started) { ClawApp._started = true; ClawApp.init(); }
    ClawApp.resize();
  }, 30);
  // 马里奥无需 WebGL 容器尺寸，直接初始化
  if (!MarioApp._started) { MarioApp._started = true; MarioApp.init(); }

  var last = 0;
  function master(tms) {
    requestAnimationFrame(master);
    if (TabCtl.current === 'claw') ClawApp.tick(tms);
    else if (TabCtl.current === 'mario') MarioApp.frame(tms);
    else HelmetApp.frame(tms);
  }
  requestAnimationFrame(master);
});
</script>
