  @keyframes bannerIn { 0%{transform:scale(.2); opacity:0} 100%{transform:scale(1); opacity:1} }
  #touch { position:fixed; bottom:14px; left:0; right:0; z-index:8; display:none; justify-content:space-between; padding:0 18px; pointer-events:none; }

</style>

<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">

<script>
"use strict";
/* ============================================================
   糖豆大冒险 Fall Beanie —— 单人物理 + 15 AI 的糖豆闯关
   ============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let VW = 0, VH = 0, SCALE = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = VW * DPR; canvas.height = VH * DPR;
  SCALE = VH / 720; // 视野高度固定 720 世界单位
}
window.addEventListener("resize", resize); resize();

/* ---------------- 工具 ---------------- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const rand = (a,b)=>a+Math.random()*(b-a);
const TAU = Math.PI*2;

/* ---------------- 音频 ---------------- */
let AC = null, muted = false, musicTimer = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + (delay||0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||"square"; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  g.gain.setValueAtTime(vol||0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur, vol, freq) {
  const ac = audio(); if (!ac || muted) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value = freq||800;
  const g = ac.createGain(); g.gain.value = vol||0.2;
  src.connect(f).connect(g).connect(ac.destination); src.start();
}
const SFX = {
  jump()  { tone(300, .16, "square", .09, 620); },
  dive()  { tone(500, .2, "sine", .1, 180); noiseBurst(.12,.06,1200); },
  land()  { noiseBurst(.08,.07,300); },
  boing() { tone(180, .22, "sine", .16, 900); },
  hit()   { noiseBurst(.25,.22,500); tone(140,.25,"sawtooth",.12,60); },
  count() { tone(660,.12,"square",.12); },
  go()    { tone(880,.3,"square",.14,1320); },
  qual()  { [523,659,784].forEach((f,i)=>tone(f,.22,"triangle",.12,null,i*.09)); },
  elim()  { [400,300,220].forEach((f,i)=>tone(f,.25,"sawtooth",.09,null,i*.12)); },
  crown() { [523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,"triangle",.14,null,i*.11)); noiseBurst(.6,.08,3000); },
  click() { tone(700,.06,"square",.08); }
};
function startMusic() {
  const ac = audio(); if (!ac || musicTimer) return;
  const bass = [130.8,130.8,164.8,196, 130.8,130.8,196,164.8];
  let step = 0;
  musicTimer = setInterval(()=>{
    if (muted || !AC) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle"; o.frequency.value = bass[step % bass.length];
    g.gain.setValueAtTime(0.045, t); g.gain.exponentialRampToValueAtTime(0.0001, t+.22);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.24);
    if (step % 2 === 0) { const h = AC.createOscillator(), hg = AC.createGain();
      h.type="square"; h.frequency.value = 3200 + (step%8)*120;
      hg.gain.setValueAtTime(0.012, t); hg.gain.exponentialRampToValueAtTime(0.0001, t+.05);
      h.connect(hg).connect(AC.destination); h.start(t); h.stop(t+.06); }
    step++;
  }, 240);
}

/* ---------------- 输入 ---------------- */
const keys = {};
window.addEventListener("keydown", e=>{
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase()==="m") { muted = !muted; }
  if (e.key.toLowerCase()==="p" && game.state==="play") game.paused = !game.paused;
});
window.addEventListener("keyup", e=>{ keys[e.key.toLowerCase()] = false; });
const touch = { left:false, right:false, jump:false, dive:false };
function bindTouch(id, name) {
  const el = document.getElementById(id);
  const on  = e=>{ e.preventDefault(); touch[name]=true; audio(); };
  const off = e=>{ e.preventDefault(); touch[name]=false; };
  el.addEventListener("touchstart", on, {passasive:false});
  el.addEventListener("touchend", off); el.addEventListener("touchcancel", off);
  el.addEventListener("mousedown", on); el.addEventListener("mouseup", off);
}
bindTouch("tLeft","left"); bindTouch("tRight","right");
bindTouch("tJump","jump"); bindTouch("tDive","dive");
if (matchMedia("(pointer:coarse)").matches) document.getElementById("touch").classList.add("on");

/* ---------------- 物理常量 ---------------- */
const GRAV = 2100, MOVE_ACC = 3400, AIR_ACC = 2000, MAX_SPD = 360,
      FRICTION = 2600, JUMP_V = 760, COYOTE = 0.09, STUN_T = 0.85;

/* ---------------- 关卡 ---------------- */

},
{
  name:"第 2 关 · 弹弹乐园", sub:"晋级 6 人", par:75, qualify:6, killY:980,
  sky:["#ff9a8b","#ffd3c2"], ground:"#e0508e", top:"#ff77ae",
  spawn:{x:180,y:480},
  platforms:[
    {x:-40, y:560, w:420, h:90},
    {x:520, y:560, w:640, h:90},
    {x:1240,y:545, w:700, h:105, seesaw:true, seesawSpeed:1.0, seesawAmp:0.28},
    {x:2060,y:500, w:520, h:140},
    {x:2700,y:460, w:180, h:30, move:{ay:-180, period:3.4, phase:0}},
    {x:2960,y:290, w:560, h:60},
  ],
  bars:[ {x:2280,y:485,len:300,speed:2.2,phase:1} ],
  bumpers:[ {x:700,y:520,r:40}, {x:1010,y:505,r:38} ],
  conveyors:[ {x:2960,y:290,w:560,h:10,speed:-110} ],
  blocks:[ {x:3100,y:230,w:54,h:54}, {x:3380,y:230,w:54,h:54} ],
  checkpoints:[ {x:180,y:480}, {x:850,y:470}, {x:1600,y:455}, {x:2320,y:420}, {x:3200,y:210} ],
  goal:{x:3300,y:170,w:180,h:120},
},
{
  name:"决赛 · 王座之路", sub:"摘下王冠！", par:120, qualify:1, killY:1000,
  sky:["#3b2a6e","#8a5fd6"], ground:"#ffb340", top:"#ffd166", crown:true,
  spawn:{x:200,y:480},
  platforms:[
    {x:-40, y:560, w:460, h:90},
    {x:480, y:560, w:760, h:40},
    {x:1380,y:540, w:160, h:30, move:{ax:100, period:2.6, phase:0}},
    {x:1620,y:500, w:160, h:30, move:{ay:100, period:2.8, phase:1}},
    {x:1900,y:460, w:160, h:30, move:{ax:100, period:2.6, phase:2}},
    {x:2200,y:440, w:120, h:30},
    {x:2400,y:400, w:120, h:30},
    {x:2600,y:360, w:120, h:30},
    {x:2800,y:320, w:120, h:30},
    {x:3000,y:280, w:1100, h:60},
  ],
  bars:[ {x:720,y:545,len:220,speed:2.6,phase:0}, {x:1060,y:545,len:220,speed:-3.0,phase:1.5},
         {x:3160,y:265,len:260,speed:2.4,phase:.5}, {x:3560,y:265,len:260,speed:-2.4,phase:2.5} ],
  crown:{x:3460, y:150},
  checkpoints:[ {x:200,y:480}, {x:860,y:470}, {x:1420,y:420}, {x:2600,y:280}, {x:3100,y:200} ],
  goal:null,
}];

/* ---------------- 豆子 ---------------- */
const NAMES = ["你","豆豆","滚滚","球球","皮皮","胖达","果冻","糯米","咕噜","毛毛","跳跳","墩墩","软糖","可乐","布丁","年糕"];
const COLORS = ["#ff5d8f","#ffb84d","#ffe14d","#7ddb4d","#4dd2a0","#4dc9ff","#7a8cff","#c07aff","#ff7ab8","#ff8a5c","#a3e04d","#4dffe1","#5c9dff","#b04dff","#ff4d6d","#ffd14d"];

class Bean {
  constructor(idx, isPlayer) {
    this.idx = idx; this.name = NAMES[idx]; this.color = COLORS[idx];
    this.isPlayer = isPlayer;
    this.r = 17;
    this.reset(0,0);
    // AI 个性
    this.aiSkill = rand(0.75, 0.95);
    this.aiJumpy = rand(0.5, 1.4);
    this.aiNoise = rand(0, TAU);
    this.mistake = rand(0, 4);
    // 状态
    this.finished = false; this.finishTime = 0;
    this.falls = 0; this.rank = 0;
    this.wob = rand(0, TAU);       // 摆动相位
    this.sx = 1; this.sy = 1;     // 挤压拉伸
    this.blink = rand(1,4); this.blinking = 0;
    this.sweat = 0;
  }
  reset(x,y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.grounded = false; this.coyote = 0; this.jumpBuf = 0;
    this.stun = 0; this.dive = 0; this.diveDir = 1;
    this.facing = 1; this.dead = false; this.crown = false;
    this.lastCp = 0; this.cp = 0;
    this.aiWait = 0; this.aiJumpT = 0;
  }
  get stunned() { return this.stun > 0; }
  trip(t) { this.stun = t; this.vx *= 0.2; }
}

/* ---------------- 游戏状态 ---------------- */
const game = {
  state:"menu",       // menu | count | play | roundEnd | over
  levelIdx:0, level:null,
  beans:[], player:null,
  time:0, countT:0, roundEndT:0,
  camX:0, camY:0, shake:0,
  particles:[], confetti:[],
  slowmo:1, winner:null,
  paused:false,
};

function makeBeans() {
  game.beans = [];
  for (let i=0;i<16;i++) game.beans.push(new Bean(i, i===0));
  game.player = game.beans[0];
}

function startLevel(idx) {
  game.levelIdx = idx;
  game.level = LEVELS[idx];
  const L = game.level;
  game.particles.length = 0;
  // 出生点:在起点平台排开
  const sx = L.spawn.x;
  game.beans.forEach((b,i)=>{
    const row = Math.floor(i/8), col = i%8;
    b.reset(sx - col*34, L.spawn.y - row*50 - (b.r*2+6));
    b.lastCp = 0; b.cp = 0; b.finished=false; b.crown=false; b.stun=0; b.dive=0;
  });
  game.time = L.par;
  game.camX = sx; game.camY = 300;
  // 重置箱子位置(初始位置首次进入关卡时从数据捕获)
  for (const bl of (L.blocks||[])) {
    if (bl.ix === undefined) { bl.ix = bl.x; bl.iy = bl.y; }
    bl.x = bl.ix; bl.y = bl.iy; bl.vx = 0; bl.vy = 0;
  }
  rankBeans();
  updateHUD();
}

/* ---------------- 碰撞:圆 vs 矩形 ---------------- */
function circleRect(b, rx, ry, rw, rh) {
  const cx = clamp(b.x, rx, rx+rw), cy = clamp(b.y, ry, ry+rh);
  let dx = b.x-cx, dy = b.y-cy;
  const d2 = dx*dx+dy*dy;
  if (d2 >= b.r*b.r) return false;
  if (d2 > 0.0001) {
    const d = Math.sqrt(d2);
    const px = dx/d, py = dy/d, push = b.r-d;
    b.x += px*push; b.y += py*push;
    const vn = b.vx*px + b.vy*py;
    if (vn < 0) { b.vx -= vn*px; b.vy -= vn*py; }
    if (py < -0.5) { b.grounded = true; b.coyote = COYOTE; }
    return {nx:px, ny:py};
  }
  // 圆心在矩形内:沿最近边推出
  const l=b.x-rx, r2=rx+rw-b.x, t=b.y-ry, bt=ry+rh-b.y;
  const m = Math.min(l,r2,t,bt);
  if (m===t) { b.y = ry-b.r; if (b.vy>0) b.vy=0; b.grounded=true; b.coyote=COYOTE; }
  else if (m===bt) { b.y = ry+rh+b.r; if (b.vy<0) b.vy=0; }
  else if (m===l) { b.x = rx-b.r; if (b.vx>0) b.vx=0; }
  else { b.x = rx+rw+b.r; if (b.vx<0) b.vx=0; }
  return true;
}

/* 矩形(箱子) vs 矩形(平台) */
function blockRect(bl, rx, ry, rw, rh) {
  const ox = Math.min(bl.x+bl.w-rx, rx+rw-bl.x);
  const oy = Math.min(bl.y+bl.h-ry, ry+rh-bl.y);
  if (ox <= 0 || oy <= 0) return;
  if (oy < ox) {
    if (bl.y+bl.h/2 < ry+rh/2) { bl.y -= oy; if (bl.vy > 0) bl.vy = 0; bl.grounded = true; }
    else { bl.y += oy; if (bl.vy < 0) bl.vy = 0; }
  } else {
    if (bl.x+bl.w/2 < rx+rw/2) { bl.x -= ox; if (bl.vx > 0) bl.vx = 0; }
    else { bl.x += ox; if (bl.vx < 0) bl.vx = 0; }
  }
}

/* 圆 vs 线段(用于跷跷板表面碰撞) */
function circleSeg(b, x1,y1,x2,y2) {
  const dx=x2-x1, dy=y2-y1, len2=(dx*dx+dy*dy)||1;
  const tt = clamp(((b.x-x1)*dx+(b.y-y1)*dy)/len2, 0, 1);
  const px=x1+dx*tt, py=y1+dy*tt;
  const ox=b.x-px, oy=b.y-py, d2=ox*ox+oy*oy;
  if (d2 >= b.r*b.r || d2 <= 0.001) return;
  const d=Math.sqrt(d2), nx=ox/d, ny=oy/d;
  b.x += nx*(b.r-d); b.y += ny*(b.r-d);
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0) { b.vx -= vn*nx; b.vy -= vn*ny; }
  if (ny < -0.5) { b.grounded = true; b.coyote = COYOTE; }
}
/* 跷跷板碰撞:沿表面采样 6 段折线 */
function collideSeesaw(b, p, ang) {
  const cx=p.x+p.w/2, cy=p.y+p.h/2, half=p.w/2;
  const cos=Math.cos(ang), sin=Math.sin(ang);
  for (let i=0;i<6;i++) {
    const t0=-half+(p.w/6)*i, t1=-half+(p.w/6)*(i+1);
    circleSeg(b, cx+cos*t0, cy+sin*t0, cx+cos*t1, cy+sin*t1);
  }
}

/* 平台当前位置(含移动) */
function platPos(p, t) {
  let x=p.x, y=p.y, vx=0, vy=0;
  if (p.move) {
    const s = Math.sin(t * TAU / p.move.period + (p.move.phase||0)) * 0.5 + 0.5;
    const sPrev = Math.sin((t-1/120) * TAU / p.move.period + (p.move.phase||0)) * 0.5 + 0.5;
    if (p.move.ax) { x += p.move.ax*s; vx = (s-sPrev)*p.move.ax/(1/120); }
    if (p.move.ay) { y += p.move.ay*s; vy = (s-sPrev)*p.move.ay/(1/120); }
  }
  const ang = p.seesaw ? Math.sin(t*(p.seesawSpeed||1.2)*2.1 + (p.move&&p.move.phase||0)) * (p.seesawAmp||0.4) : 0;
  return {x,y,vx,vy,ang};
}

/* ---------------- 物理步进 ---------------- */
function stepPhysics(dt) {
  const L = game.level, t = game.time;

  // 移动平台位置
  const ppos = L.platforms.map(p=>platPos(p,t));

  // 方块(可推动的箱子)
  for (const bl of (L.blocks||[])) {
    if (bl.vx === undefined) { bl.vx = 0; bl.vy = 0; }
    bl.vy += GRAV*dt;
    bl.x += bl.vx*dt; bl.y += bl.vy*dt;
    bl.vx *= 0.98;
    bl.grounded = false;
    for (let i=0;i<L.platforms.length;i++)
      blockRect(bl, ppos[i].x, ppos[i].y, L.platforms[i].w, L.platforms[i].h);
    for (const other of (L.blocks||[])) {
      if (other===bl) continue;
      const cx = clamp(bl.x, other.x, other.x+other.w), cy = clamp(bl.y, other.y, other.y+other.h);
      const dx = bl.x+bl.w/2-(other.x+other.w/2), dy = bl.y+bl.h/2-(other.y+other.h/2);
      if (Math.abs(dx) < (bl.w+other.w)/2 && Math.abs(dy) < (bl.h+other.h)/2) {
        if (Math.abs(dx)/bl.w > Math.abs(dy)/bl.h) { bl.x += Math.sign(dx||1)*((bl.w+other.w)/2-Math.abs(dx)); bl.vx += Math.sign(dx||1)*30; }
        else { bl.y -= Math.sign(dy||1)*((bl.h+other.h)/2-Math.abs(dy)); bl.vy = 0; }
      }
    }
  }

  for (const b of game.beans) {
    if (b.dead) continue;

    /* --- 输入 --- */
    let ix = 0, wantJump = false, wantDive = false;
    if (b.isPlayer) {
      if (keys["arrowleft"]||keys["a"]||touch.left) ix -= 1;
      if (keys["arrowright"]||keys["d"]||touch.right) ix += 1;
      wantJump = !!(keys[" "]||keys["arrowup"]||keys["w"]||touch.jump);
      wantDive = !!(keys["shift"]||keys["c"]||touch.dive);
    } else {
      const inp = aiInput(b, dt);
      ix = inp.ix; wantJump = inp.jump; wantDive = inp.dive;
    }

    if (b.stun > 0) { b.stun -= dt; ix = 0; wantJump = wantDive = false; b.sweat = Math.min(1, b.sweat + dt*2); }

    /* --- 水平 --- */
    const acc = b.grounded ? MOVE_ACC : AIR_ACC;
    const maxSpd = MAX_SPD * (b.isPlayer?1:b.aiSkill);
    if (ix !== 0) {
      b.vx += ix * acc * dt;
      b.vx = clamp(b.vx, -maxSpd, maxSpd);
      b.facing = ix;
    } else if (b.grounded) {
      const f = FRICTION * dt;
      b.vx = Math.abs(b.vx) <= f ? 0 : b.vx - Math.sign(b.vx)*f;
    }
    b.vx = clamp(b.vx, -maxSpd*1.4, maxSpd*1.4);

    /* --- 跳跃 --- */
    if (b.grounded) b.coyote = COYOTE; else b.coyote -= dt;
    if (wantJump) b.jumpBuf = 0.12; else b.jumpBuf -= dt;
    if (b.jumpBuf > 0 && b.coyote > 0) {
      b.vy = -JUMP_V * (b.isPlayer?1:rand(0.92,1.05));
      b.grounded = false; b.coyote = 0; b.jumpBuf = 0;
      b.sy = 1.3; b.sx = 0.75;
      if (b.isPlayer) SFX.jump();
      dust(b.x, b.y+b.r, 4);
    }

    /* --- 俯冲 --- */
    if (wantDive && b.dive <= 0 && b.stun<=0) {
      b.dive = 0.55; b.diveDir = b.facing;
      b.vx = b.facing * 560; b.vy = Math.min(b.vy, -140);
      if (b.isPlayer) SFX.dive();
      dust(b.x, b.y, 5);
    }
    if (b.dive > 0) {
      b.dive -= dt;
      if (b.dive <= 0 && b.grounded) { b.sx=1.35; b.sy=0.7; }
    }

    /* --- 重力 --- */
    b.vy += GRAV*dt;
    b.vy = Math.min(b.vy, 1500);

    /* --- 移动 + 碰撞 --- */
    b.grounded = false;
    b.x += b.vx*dt;
    b.y += b.vy*dt;

    // 与平台碰撞(站立时继承平台速度;跷跷板用折线碰撞)
    for (let i=0;i<L.platforms.length;i++) {
      const pp = ppos[i];
      const p = L.platforms[i];
      if (p.seesaw) {
        collideSeesaw(b, {x:pp.x, y:pp.y, w:p.w, h:p.h}, pp.ang);
        continue;
      }
      const wasAbove = b.y + b.r - b.vy*dt <= pp.y + 4;
      const hit = circleRect(b, pp.x, pp.y, p.w, p.h);
      if (hit && pp.vx && b.vy >= 0 && wasAbove) { b.x += pp.vx*dt; }
      if (hit && pp.vy && b.vy >= 0 && wasAbove) { b.y += pp.vy*dt; }
    }
    // 与方块碰撞
    for (const bl of (L.blocks||[])) {
      const hit = circleRect(b, bl.x, bl.y, bl.w, bl.h);
      if (hit) {
        if (hit.nx) { bl.vx += b.vx*0.35 + hit.nx*60; }
        if (hit.ny < -0.5) { bl.vy = Math.min(bl.vy, 0); }
      }
    }

    // 传送带
    if (b.grounded) for (const c of (L.conveyors||[])) {
      if (b.x>c.x && b.x<c.x+c.w && Math.abs(b.y+b.r-c.y)<8) b.vx += (c.speed-b.vx)*Math.min(1, dt*4);
    }

    // 豆子之间的推挤
    for (const o of game.beans) {
      if (o===b || o.dead) continue;
      const dx = b.x-o.x, dy = b.y-o.y;
      const rr = b.r+o.r, d2 = dx*dx+dy*dy;
      if (d2 < rr*rr && d2 > 0.01) {
        const d = Math.sqrt(d2), push = (rr-d)*0.5, px = dx/d, py = dy/d;
        b.x += px*push; b.y += py*push*0.5;
        o.x -= px*push; o.y -= py*push*0.5;
        const rvx = b.vx-o.vx;
        if (rvx*px < 0) { b.vx -= px*rvx*0.35; o.vx += px*rvx*0.35; }
      }
    }

    /* --- 旋转杆 --- */
    for (const bar of L.bars) {
      const ang = bar.phase + t*bar.speed;
      const hx = Math.cos(ang), hy = Math.sin(ang);
      const half = bar.len/2;
      // 线段最近点
      const px = clamp(b.x, bar.x-hx*half, bar.x+hx*half);
      const py = clamp(b.y, bar.y-hy*half, bar.y+hy*half);
      let dx = b.x-px, dy = b.y-py;
      const rr = b.r+13;
      const d2 = dx*dx+dy*dy;
      if (d2 < rr*rr && d2 > 0.01) {
        const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
        b.x += nx*(rr-d); b.y += ny*(rr-d);
        // 杆端切向速度
        const rx = px-bar.x, ry = py-bar.y;
        const w = bar.speed;
        const tvx = -ry*w, tvy = rx*w;
        b.vx = nx*380 + tvx*0.9;
        b.vy = ny*300 + tvy*0.9 - 150;
        if (b.stun <= 0) {
          b.trip(STUN_T * (b.isPlayer?0.7:1));
          if (b.isPlayer) { SFX.hit(); game.shake = 14; }
          burst(b.x, b.y, "#fff", 8);
        }
      }
    }

    /* --- 弹弹球 --- */
    for (const bp of (L.bumpers||[])) {
      const dx = b.x-bp.x, dy = b.y-bp.y;
      const rr = b.r+bp.r, d2 = dx*dx+dy*dy;
      if (d2 < rr*rr && d2 > 0.01) {
        const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
        b.x = bp.x + nx*rr; b.y = bp.y + ny*rr;
        b.vx = nx*560; b.vy = ny*560 - 160;
        b.sx = 1.3; b.sy = 0.7;
        SFX.boing(); burst(b.x, b.y, "#ff9ff3", 10);
        game.shake = Math.max(game.shake, 5);
      }
    }

    /* --- 检查点 & 终点 --- */
    const cps = L.checkpoints;
    if (b.cp < cps.length && Math.hypot(b.x-cps[b.cp].x, b.y-cps[b.cp].y) < 130) {
      b.lastCp = b.cp; b.cp++;
      if (b.isPlayer && b.cp>0) tone(880,.1,"triangle",.07);
    }
    if (L.goal && !b.finished) {
      const g = L.goal;
      if (b.x>g.x && b.x<g.x+g.w && b.y>g.y && b.y<g.y+g.h) finishBean(b);
    }
    // 决赛:王冠
    if (L.crown && !b.finished && !game.winner) {
      const c = L.crown;
      if (Math.hypot(b.x-c.x, b.y-c.y) < 44) {
        b.crown = true; b.finished = true;
        game.winner = b;
        slowmoAndWin(b);
      }
    }

    /* --- 掉落 --- */
    if (b.y > L.killY) {
      b.falls++;
      const cp = cps[Math.min(b.lastCp, cps.length-1)];
      const savedCp = b.cp, savedLast = b.lastCp;
      b.reset(cp.x + rand(-30,30), cp.y - 60);
      b.cp = savedCp; b.lastCp = savedLast;  // 保留检查点进度
      b.stun = 0.6;
      if (b.isPlayer) { SFX.hit(); game.shake = 8; }
      splash(b.x, L.killY-20);
    }

    /* --- 动画状态 --- */
    b.wob += dt * (4 + Math.abs(b.vx)/40);
    const targetSx = b.dive>0?1.3:(b.grounded?1+Math.sin(b.wob*2)*0.03:0.95);
    const targetSy = b.dive>0?0.7:(b.grounded?1+Math.cos(b.wob*2)*0.03:1.05);
    b.sx = lerp(b.sx, targetSx, dt*10);
    b.sy = lerp(b.sy, targetSy, dt*10);
    b.blink -= dt;
    if (b.blink < -0.12) b.blinking = 0.12;
    if (b.blinking > 0) b.blinking -= dt;
  }
}

/* ---------------- AI ---------------- */
function aiInput(b, dt) {
  const L = game.level, t = game.time;
  const inp = {ix:0, jump:false, dive:false};
  if (b.finished || b.stun>0) return inp;
  if (b.aiWait > 0) { b.aiWait -= dt; return inp; }

  // 目标点:检查点,决赛抢皇冠
  let tx, ty;
  if (L.crown && game.winner===null) {
    if (b.lastCp >= L.checkpoints.length-1 || b.cp >= L.checkpoints.length-1) { tx = L.crown.x; ty = L.crown.y; }
    else { const c = L.checkpoints[Math.min(b.cp, L.checkpoints.length-1)]; tx=c.x; ty=c.y; }
  } else {
    const c = L.checkpoints[Math.min(b.cp, L.checkpoints.length-1)];
    tx = c.x; ty = c.y;
    if (L.goal && b.cp >= L.checkpoints.length-1) { tx=(L.goal.x+L.goal.w/2); ty=L.goal.y; }
  }

  const dx = tx - b.x;
  const dy = ty - b.y;
  // 水平:带噪声的追踪
  b.aiNoise += dt*3;
  const wob = Math.sin(b.aiNoise)*0.25;
  inp.ix = Math.abs(dx) > 24 ? Math.sign(dx + wob*30) : 0;

  // 失误:偶尔走错
  b.mistake -= dt;
  if (b.mistake < -rand(2,7)) { b.mistake = rand(0.2,0.6); inp.ix *= -1; }

  // 跳跃:前方无地面/有台阶 或 目标在上方 或 随机
  const footY = b.y + b.r;
  const aheadX = b.x + b.facing*44;
  const gBelow = groundBelow(aheadX, footY);   // 前方最高可行走表面
  const gapAhead = gBelow === null;
  const lipAhead = gBelow !== null && gBelow < footY - 24;
  const targetAbove = dy < -70 && Math.abs(dx) < 220;
  if (b.grounded) {
    if ((gapAhead || lipAhead) && Math.abs(dx) > 20) {
      // 间隙前方有移动平台:高度差大或水平平台未靠近 → 等;可跳则跳
      let nearMovePlat = false;
      for (const pl of L.platforms) {
        if (!pl.move) continue;
        const pp = platPos(pl, t);
        const dist = b.facing > 0 ? pp.x - b.x : b.x - (pp.x + pl.w);
        if (dist < 30 || dist > 240) continue;
        // 跳过脚下正站着的平台
        if (Math.abs(pp.y - footY) < 24 && b.x > pp.x - 30 && b.x < pp.x + pl.w + 30) continue;
        if (Math.abs(pp.y - footY) > 100) { b.aiWait = 0.25; return {ix:0, jump:false, dive:false}; }
        if (pl.move.ax && dist > 170) { b.aiWait = 0.25; return {ix:0, jump:false, dive:false}; }
        nearMovePlat = true;
      }
      if (!nearMovePlat && Math.random() < b.aiJumpy * 0.6) inp.jump = true;
      else if (nearMovePlat && Math.random() < b.aiJumpy * 0.7) inp.jump = true;
    }
    if (targetAbove && Math.random() < 0.09*b.aiJumpy) inp.jump = true;
    if (Math.random() < 0.004*b.aiJumpy) inp.jump = true;
    // 弹弹球:朝它移动时提前跳
    for (const bp of (L.bumpers||[])) {
      const bdx = bp.x - b.x;
      if (Math.sign(bdx) === Math.sign(dx) && Math.abs(bdx) < 95 && Math.abs(bp.y - b.y) < 60) { inp.jump = true; break; }
    }
    // 跳过挡路的箱子
    for (const bl of (L.blocks||[])) {
      const bdx = bl.x + bl.w/2 - b.x;
      if (Math.sign(bdx) === Math.sign(dx) && Math.abs(bdx) < 75 && bl.y + bl.h > footY - 40) { inp.jump = true; break; }
    }
  }
  // 躲旋转杆
  for (const bar of L.bars) {
    const d = Math.hypot(b.x-bar.x, b.y-bar.y);
    if (d < bar.len/2 + 60) {
      const ang = bar.phase + t*bar.speed;
      const toB = Math.atan2(b.y-bar.y, b.x-bar.x);
      let diff = Math.abs(((toB - ang) % TAU + TAU*1.5) % TAU - Math.PI);
      if (diff < 0.55 && b.grounded && Math.random()<0.5) inp.jump = true;
    }
  }
  // 决赛夺冠后原地欢呼
  if (L.crown && game.winner===b) { inp.ix = Math.sin(t*6)>0?1:-1; inp.jump = Math.random()<0.05; }
  return inp;
}
/* 返回 x 处可行走的最高表面 y(脚附近 ±窗口内),没有则 null */
function groundBelow(x, footY) {
  const L = game.level, t = game.time;
  let best = null;
  for (let i=0;i<L.platforms.length;i++) {
    const p = L.platforms[i], pp = platPos(p,t);
    if (x < pp.x-4 || x > pp.x+p.w+4) continue;
    if (pp.y < footY-150 || pp.y > footY+170) continue;
    if (best === null || pp.y < best) best = pp.y;
  }
  return best;
}

/* ---------------- 完赛 / 胜负 ---------------- */
function finishBean(b) {
  if (b.finished) return;
  b.finished = true; b.finishTime = game.time;
  burst(b.x, b.y, "#ffe14d", 16);
  if (b.isPlayer) SFX.qual();
}
function slowmoAndWin(b) {
  game.slowmo = 0.25;
  SFX.crown();
  for (let i=0;i<80;i++) spawnConfetti(b.x+rand(-80,80), b.y+rand(-120,0));
  setTimeout(()=>{ endGame(b); }, 2200);
}

/* ---------------- 回合流程 ---------------- */
function rankBeans() {
  const arr = game.beans.slice().sort((a,b)=>{
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    const pa = a.cp*100000 - (game.level.checkpoints[Math.min(a.cp,game.level.checkpoints.length-1)].x - a.x);
    const pb = b.cp*100000 - (game.level.checkpoints[Math.min(b.cp,game.level.checkpoints.length-1)].x - b.x);
    return pb - pa;
  });
  arr.forEach((b,i)=>b.rank = i+1);
  return arr;
}

function stepGame(dt) {
  const L = game.level;
  game.time -= dt;
  stepPhysics(dt);
  rankBeans();
  updateHUD();

  // 相机
  const follow = (game.state==="play" && game.player && !game.player.dead) ? game.player : (game.winner || rankBeans()[0]);
  game.camX = lerp(game.camX, follow.x, Math.min(1, dt*5));
  game.camY = lerp(game.camY, follow.y - 60, Math.min(1, dt*4));
  game.shake = Math.max(0, game.shake - dt*40);

  // 粒子
  for (let i=game.particles.length-1;i>=0;i--) {
    const p = game.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||600)*dt; p.life -= dt;
    if (p.life <= 0) game.particles.splice(i,1);
  }

  // 回合结束判定
  const mustQualify = L.qualify;
  const qualified = game.beans.filter(b=>b.finished).length;
  if (L.crown) {
    if (game.winner) return; // slowmo 后 endGame
    if (game.time <= 0) {
      // 无人抢到王冠:进度最远者胜
      const best = rankBeans().find(b=>!b.dead);
      game.winner = best; slowmoAndWin(best);
    }
  } else if (game.time <= 0 || qualified >= mustQualify) {
    endRound(); // 时间到或晋级人数达标:按排名取前 qualify 名
  }
}

function endRound() {
  const L = game.level;
  const ranked = rankBeans();
  const qualifiedSet = new Set(ranked.slice(0, L.qualify).map(b=>b.idx));
  if (L.crown) return; // 决赛单独处理
  const playerQualified = qualifiedSet.has(game.player.idx);
  game.state = "roundEnd";
  showBanner(playerQualified ? "晋级！" : "淘汰…", playerQualified ? "#7ddb4d" : "#ff5d5d");
  playerQualified ? SFX.qual() : SFX.elim();
  // 未晋级豆子变灰旁观
  for (const b of game.beans) b.dead = !qualifiedSet.has(b.idx);
  setTimeout(()=>{
    if (game.levelIdx+1 < LEVELS.length) {
      hideBanner();
      startCountdown(game.levelIdx+1);
    }
  }, 2000);
}

function endGame(winner) {
  game.state = "over";
  const playerWon = winner.isPlayer;
  const res = document.getElementById("result");
  document.getElementById("resultTitle").textContent = playerWon ? "👑 你是冠军！" : `${winner.name} 夺冠！`;
  document.getElementById("resultTitle").style.color = playerWon ? "#ffe14d" : "#c9b8ff";
  const where = `你在「${game.level.name}」被淘汰 · 最终排名 第 ${game.player.rank} 名`;
  document.getElementById("resultSub").innerHTML =
    `${where}<br>总掉落次数:${game.player.falls} · 点击按钮再来一局`;
  res.classList.remove("hidden");
  document.getElementById("hud").classList.add("hidden");
  // 持续撒花
  for (let i=0;i<120;i++) spawnConfetti(rand(game.camX-500, game.camX+500), game.camY+rand(-300,-50));
}

/* ---------------- 倒计时 ---------------- */
function startCountdown(idx) {
  game.state = "count";
  game.levelIdx = idx;
  startLevel(idx);
  game.countT = 3.6;
  const seq = ["3","2","1","GO!"];
  let i = 0;
  showBanner(seq[0], "#fff"); SFX.count();
  const iv = setInterval(()=>{
    i++;
    if (i < 3) { showBanner(seq[i], "#fff"); SFX.count(); }
    else if (i === 3) { showBanner("GO!", "#7ddb4d"); SFX.go(); }
    else { hideBanner(); game.state = "play"; clearInterval(iv); }
  }, 900);
}
function showBanner(text, color) {
  const el = document.getElementById("banner");
  const sp = document.getElementById("bannerText");
  sp.textContent = text; sp.style.color = color || "#fff";
  sp.style.animation = "none"; void sp.offsetWidth; sp.style.animation = "";
  el.classList.remove("hidden");
}
function hideBanner(){ document.getElementById("banner").classList.add("hidden"); }

/* ---------------- HUD ---------------- */
function updateHUD() {
  const L = game.level;
  const alive = game.beans.filter(b=>!b.finished).length + game.beans.filter(b=>b.finished && L.crown).length;
  document.getElementById("roundName").textContent = `${L.name} · ${L.sub}`;
  document.getElementById("timer").textContent = Math.max(0, Math.ceil(game.time));
  document.getElementById("timer").style.color = game.time < 10 ? "#ff6b6b" : "#fff";
  document.getElementById("alivePill").textContent = L.crown ? `👑 ${game.winner? "已诞生":"争冠中"}` : `🏁 ${game.beans.filter(b=>b.finished).length}/${L.qualify}`;
  document.getElementById("rankPill").textContent = `第 ${game.player.rank} 名`;
}

/* ---------------- 粒子 ---------------- */
function dust(x,y,n) {
  for (let i=0;i<n;i++) game.particles.push({x,y:y+10,vx:rand(-90,90),vy:rand(-120,-20),r:rand(2,5),life:rand(.3,.6),color:"rgba(255,255,255,.7)",g:300});
}
function burst(x,y,color,n) {
  for (let i=0;i<n;i++) { const a=rand(0,TAU),s=rand(60,260);
    game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,r:rand(2,5),life:rand(.4,.8),color,g:700}); }
}
function splash(x,y) {
  for (let i=0;i<14;i++) game.particles.push({x:x+rand(-20,20),y,vx:rand(-140,140),vy:rand(-380,-120),r:rand(2,6),life:rand(.4,.7),color:"#b04dff",g:900});
}
function spawnConfetti(x,y) {
  const cols=["#ff5d8f","#ffe14d","#4dc9ff","#7ddb4d","#c07aff","#ff8a5c"];
  game.confetti.push({x,y,vx:rand(-120,120),vy:rand(-420,-120),w:rand(6,12),h:rand(4,8),rot:rand(0,TAU),rv:rand(-8,8),color:cols[(Math.random()*cols.length)|0]});
}

/* ---------------- 渲染 ---------------- */
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function render() {
  const L = game.level;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 天空
  const sky = ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,L.sky[0]); sky.addColorStop(1,L.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0,0,VW,VH);

  const shx = (Math.random()-0.5)*game.shake, shy = (Math.random()-0.5)*game.shake;
  const vw = VW/SCALE, vh = VH/SCALE;
  let camX = clamp(game.camX, vw/2, Math.max(vw/2, levelWidth()-vw/2));
  let camY = clamp(game.camY, vh/2-100, L.killY+140-vh/2);
  ctx.save();
  ctx.scale(SCALE,SCALE);
  ctx.translate(vw/2 - camX + shx, vh/2 - camY + shy);

  drawBackground(camX, vw, vh);

  // 平台
  const t = game.time;
  for (let i=0;i<L.platforms.length;i++) {
    const p = L.platforms[i], pp = platPos(p,t);
    drawPlatform(pp.x, pp.y, p.w, p.h, p.seesaw ? pp.ang : 0, L);
  }
  // 传送带
  for (const c of (L.conveyors||[])) drawConveyor(c, t);
  // 弹弹球
  for (const bp of (L.bumpers||[])) drawBumper(bp);
  // 旋转杆
  for (const bar of L.bars) drawBar(bar, t);
  // 箱子
  for (const bl of (L.blocks||[])) drawBlock(bl);
  // 检查点旗
  L.checkpoints.forEach((c,i)=>drawFlag(c, i < game.player.cp || game.player.finished));
  // 终点
  if (L.goal) drawGoal(L.goal, t);
  // 王冠
  if (L.crown) drawCrown(L.crown, t);
  // 豆子
  for (const b of game.beans) if (!b.dead || b.isPlayer) drawBean(b, t);
  // 粒子
  for (const p of game.particles) {
    ctx.globalAlpha = clamp(p.life*2.5,0,1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 彩带(屏幕空间)
  for (const c of game.confetti) {
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  }

  // 暂停提示
  if (game.paused) {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle = "#fff"; ctx.font = "900 52px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("已暂停", VW/2, VH/2 - 10);
    ctx.font = "500 22px sans-serif"; ctx.fillStyle = "#c9b8ff";
    ctx.fillText("按 P 继续", VW/2, VH/2 + 36);
  }
}

function levelWidth() { const L=game.level; let w=0; for (const p of L.platforms) w=Math.max(w,p.x+p.w); for (const b of L.bars) w=Math.max(w,b.x+b.len); return w+200; }

function drawBackground(camX, vw, vh) {
  const L = game.level, t = game.time;
  // 太阳/月亮
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath(); ctx.arc(camX - vw/2 + vw*0.8, game.camY - vh/2 + 90, 46, 0, TAU); ctx.fill();
  // 云
  ctx.fillStyle = "rgba(255,255,255,.75)";
  for (let i=0;i<8;i++) {
    const cx = ((i*620 + t*22 - camX*0.4) % (vw+800) + vw+800) % (vw+800) + camX - vw/2 - 400;
    const cy = game.camY - vh/2 + 60 + (i%3)*70;
    cloud(cx, cy, 60 + (i%3)*16);
  }
  // 远山(画在视野底部)
  ctx.fillStyle = "rgba(120,80,200,.18)";
  const hillBase = game.camY + vh/2;
  for (let i=0;i<10;i++) {
    const hx = ((i*540 - camX*0.25) % (vw+700) + vw+700) % (vw+700) + camX - vw/2 - 350;
    hill(hx, hillBase + 40, 300 + (i%4)*80, 220 + (i%3)*60);
  }
  // 底部史莱姆
  ctx.fillStyle = "rgba(140,60,220,.55)";
  const sy = game.level.killY;
  ctx.beginPath();
  ctx.moveTo(camX-vw/2-100, sy+400);
  for (let x=camX-vw/2-100; x<camX+vw/2+100; x+=40)
    ctx.lineTo(x, sy + Math.sin(x*0.012 + t*2)*14);
  ctx.lineTo(camX+vw/2+100, sy+400); ctx.closePath(); ctx.fill();
}
function cloud(x,y,r) {
  ctx.beginPath();
  ctx.arc(x,y,r*0.6,0,TAU); ctx.arc(x+r*0.6,y+6,r*0.45,0,TAU); ctx.arc(x-r*0.6,y+8,r*0.4,0,TAU);
  ctx.fill();
}
function hill(x,y,w,h) {
  ctx.beginPath(); ctx.ellipse(x, y, w/2, h/2, 0, Math.PI, 0); ctx.fill();
}

function drawPlatform(x,y,w,h,ang,L) {
  ctx.save();
  ctx.translate(x+w/2, y+h/2); ctx.rotate(ang); ctx.translate(-w/2,-h/2);
  // 主体
  ctx.fillStyle = L.ground;
  roundRect(0,0,w,h, 12); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.15)";
  roundRect(6,h-16,w-12,10, 6); ctx.fill();
  // 顶部亮色
  ctx.fillStyle = L.top;
  roundRect(0,0,w, Math.min(20,h), 10); ctx.fill();
  // 条纹
  ctx.save();
  roundRect(0,0,w,h,12); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,.07)";
  for (let sx=-h; sx<w; sx+=56) {
    ctx.beginPath();
    ctx.moveTo(sx, h); ctx.lineTo(sx+28, 0); ctx.lineTo(sx+44, 0); ctx.lineTo(sx+16, h);
    ctx.fill();
  }
  ctx.restore();
  // 描边
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 3;
  roundRect(1.5,1.5,w-3,h-3, 12); ctx.stroke();
  ctx.restore();
}

function drawConveyor(c, t) {
  ctx.fillStyle = "#3a3f4b";
  roundRect(c.x, c.y, c.w, c.h+14, 6); ctx.fill();
  ctx.save();
  roundRect(c.x, c.y, c.w, c.h, 6); ctx.clip();
  ctx.fillStyle = "#ffd166";
  const off = (t*c.speed*2) % 40;
  for (let x=c.x-40+off; x<c.x+c.w+40; x+=40) {
    ctx.beginPath();
    ctx.moveTo(x, c.y+c.h); ctx.lineTo(x+Math.sign(c.speed)*14, c.y+c.h/2); ctx.lineTo(x, c.y);
    ctx.lineTo(x+8, c.y); ctx.lineTo(x+8+Math.sign(c.speed)*14, c.y+c.h/2); ctx.lineTo(x+8, c.y+c.h);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth=2;
  roundRect(c.x,c.y,c.w,c.h,6); ctx.stroke();
}

function drawBumper(bp) {
  const pulse = 1 + Math.sin(game.time*5 + bp.x)*0.05;
  const g = ctx.createRadialGradient(bp.x-8,bp.y-10,4, bp.x,bp.y,bp.r*pulse);
  g.addColorStop(0,"#ffd6f5"); g.addColorStop(0.6,"#ff7ad9"); g.addColorStop(1,"#e044a8");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r*pulse, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.beginPath(); ctx.arc(bp.x-bp.r*0.3, bp.y-bp.r*0.35, bp.r*0.22, 0, TAU); ctx.fill();
}

function drawBar(bar, t) {
  const ang = bar.phase + t*bar.speed;
  ctx.save();
  ctx.translate(bar.x, bar.y);
  // 立杆
  ctx.fillStyle = "#5a6270";
  roundRect(-10, -6, 20, 26, 6); ctx.fill();
  ctx.rotate(ang);
  // 杆体(胶囊)
  const g = ctx.createLinearGradient(0,-13,0,13);
  g.addColorStop(0,"#ff8a5c"); g.addColorStop(0.5,"#ff5d5d"); g.addColorStop(1,"#c92a2a");
  ctx.fillStyle = g;
  roundRect(-bar.len/2, -13, bar.len, 26, 13); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth=3;
  roundRect(-bar.len/2,-13,bar.len,26,13); ctx.stroke();
  // 端头球
  ctx.fillStyle = "#ffe14d";
  ctx.beginPath(); ctx.arc(bar.len/2, 0, 15, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-bar.len/2, 0, 15, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(bar.len/2, 0, 15, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(-bar.len/2, 0, 15, 0, TAU); ctx.stroke();
  ctx.restore();
  // 中心铆钉
  ctx.fillStyle = "#39404d";
  ctx.beginPath(); ctx.arc(bar.x, bar.y, 9, 0, TAU); ctx.fill();
  ctx.fillStyle = "#8b95a5";
  ctx.beginPath(); ctx.arc(bar.x, bar.y, 4, 0, TAU); ctx.fill();
}

function drawBlock(bl) {
  ctx.save();
  ctx.translate(bl.x+bl.w/2, bl.y+bl.h/2); ctx.rotate(Math.sin(bl.x*0.01)*0.05);
  ctx.fillStyle = "#c98f4d";
  roundRect(-bl.w/2, -bl.h/2, bl.w, bl.h, 8); ctx.fill();
  ctx.fillStyle = "#e8b06a";
  roundRect(-bl.w/2, -bl.h/2, bl.w, bl.h*0.35, 8); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth=3;
  roundRect(-bl.w/2,-bl.h/2,bl.w,bl.h,8); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.15)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-bl.w/2+8,0); ctx.lineTo(bl.w/2-8,0); ctx.stroke();
  ctx.restore();
}

function drawFlag(c, passed) {
  const t = game.time;
  ctx.strokeStyle = passed ? "#7ddb4d" : "#8b95a5";
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x, c.y-86); ctx.stroke();
  const wave = Math.sin(t*6 + c.x)*6;
  ctx.fillStyle = passed ? "#7ddb4d" : "#aab4c4";
  ctx.beginPath();
  ctx.moveTo(c.x, c.y-86); ctx.lineTo(c.x+44+wave, c.y-72); ctx.lineTo(c.x, c.y-56);
  ctx.closePath(); ctx.fill();
}

function drawGoal(g, t) {
  const pulse = 0.8 + Math.sin(t*4)*0.2;
  ctx.save();
  ctx.globalAlpha = 0.92;
  const grd = ctx.createLinearGradient(g.x, g.y, g.x, g.y+g.h);
  grd.addColorStop(0,"#fff3b0"); grd.addColorStop(1,"#ffd166");
  ctx.fillStyle = grd;
  roundRect(g.x, g.y, g.w, g.h, 18); ctx.fill();
  ctx.strokeStyle = "#e8a020"; ctx.lineWidth = 4;
  roundRect(g.x, g.y, g.w, g.h, 18); ctx.stroke();
  ctx.fillStyle = "#b06f00";
  ctx.font = `900 ${34}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("终 点", g.x+g.w/2, g.y+g.h/2 - 12);
  ctx.font = "700 20px sans-serif";
  ctx.fillText("冲线晋级！", g.x+g.w/2, g.y+g.h/2 + 22);
  // 光柱
  ctx.globalAlpha = 0.25*pulse;
  ctx.fillStyle = "#fff";
  ctx.fillRect(g.x+g.w/2-26, g.y-260, 52, 260);
  ctx.restore();
}

function drawCrown(c, t) {
  const bob = Math.sin(t*2.5)*8, rot = Math.sin(t*1.8)*0.12;
  ctx.save();
  ctx.translate(c.x, c.y+bob); ctx.rotate(rot);
  // 光环
  ctx.globalAlpha = 0.35 + Math.sin(t*5)*0.1;
  ctx.fillStyle = "#fff3b0";
  ctx.beginPath(); ctx.arc(0,0,52,0,TAU); ctx.fill();
  ctx.globalAlpha = 1;
  // 王冠
  ctx.fillStyle = "#ffd166";
  ctx.beginPath();
  ctx.moveTo(-30, 14); ctx.lineTo(-30, -8); ctx.lineTo(-15, 4); ctx.lineTo(0, -22);
  ctx.lineTo(15, 4); ctx.lineTo(30, -8); ctx.lineTo(30, 14); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#d69a12"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#ff5d8f";
  ctx.beginPath(); ctx.arc(0, -4, 4.5, 0, TAU); ctx.fill();
  ctx.fillStyle = "#4dc9ff";
  ctx.beginPath(); ctx.arc(-18, 0, 3.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(18, 0, 3.5, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#fff";
  ctx.font = "800 18px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("王冠!", c.x, c.y - 66 + bob);
}

function drawBean(b, t) {
  const isP = b.isPlayer;
  const stunFlash = b.stun>0 && Math.floor(t*14)%2===0;
  ctx.save();
  ctx.translate(b.x, b.y);

  // 影
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.beginPath(); ctx.ellipse(0, b.r*0.95, b.r*0.8, b.r*0.28, 0, 0, TAU); ctx.fill();

  // 玩家标记圈
  if (isP) {
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 3;
    ctx.setLineDash([8,7]); ctx.lineDashOffset = -t*40;
    ctx.beginPath(); ctx.arc(0, 2, b.r+10, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.scale(b.sx, b.sy);
  const bodyH = b.r*1.9;
  // 脚(跑步摆动)
  if (b.grounded && Math.abs(b.vx)>30 && b.dive<=0) {
    const ph = Math.sin(b.wob*2);
    ctx.fillStyle = shade(b.color, -30);
    ctx.beginPath(); ctx.ellipse(-7 + ph*5, b.r*0.92, 6, 4.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 - ph*5, b.r*0.92, 6, 4.5, 0, 0, TAU); ctx.fill();
  }
  // 身体
  const g = ctx.createLinearGradient(0,-bodyH/2,0,bodyH/2);
  g.addColorStop(0, shade(b.color, 25)); g.addColorStop(1, b.color);
  ctx.fillStyle = stunFlash ? "#fff" : g;
  ctx.beginPath();
  ctx.moveTo(0, -bodyH/2);
  ctx.bezierCurveTo(b.r*1.15, -bodyH/2, b.r*1.15, bodyH/2, 0, bodyH/2);
  ctx.bezierCurveTo(-b.r*1.15, bodyH/2, -b.r*1.15, -bodyH/2, 0, -bodyH/2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 2.5; ctx.stroke();
  // 肚皮高光
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.beginPath(); ctx.ellipse(-b.r*0.3, -b.r*0.25, b.r*0.32, b.r*0.42, -0.4, 0, TAU); ctx.fill();

  // 眼睛
  const lookX = clamp(b.vx/120, -3, 3), lookY = clamp(b.vy/300, -2, 3);
  const eyeY = -bodyH*0.18, eyeDX = b.r*0.34;
  if (b.blinking > 0) {
    ctx.strokeStyle = "#222"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-eyeDX-5,eyeY); ctx.lineTo(-eyeDX+5,eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeDX-5,eyeY); ctx.lineTo(eyeDX+5,eyeY); ctx.stroke();
  } else {
    for (const s of [-1,1]) {
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(s*eyeDX, eyeY, 7.5, 8.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(s*eyeDX + lookX*0.6, eyeY + lookY*0.6, 3.6, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(s*eyeDX + lookX*0.6 - 1.2, eyeY + lookY*0.6 - 1.2, 1.2, 0, TAU); ctx.fill();
    }
  }
  // 嘴
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath();
  if (b.stun > 0) { // 晕:叉叉眼 + 波浪嘴
    ctx.strokeStyle = "#222";
    for (const s of [-1,1]) {
      ctx.beginPath();
      ctx.moveTo(s*eyeDX-4, eyeY-4); ctx.lineTo(s*eyeDX+4, eyeY+4);
      ctx.moveTo(s*eyeDX+4, eyeY-4); ctx.lineTo(s*eyeDX-4, eyeY+4);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-6, eyeY+12);
    for (let i=0;i<4;i++) ctx.quadraticCurveTo(-6+(i*4+2), eyeY+(i%2? 16:10), -6+(i+1)*4, eyeY+12);
    ctx.stroke();
    // 晕星
    for (let i=0;i<3;i++) {
      const a = t*5 + i*TAU/3;
      drawStar(Math.cos(a)*b.r*0.9, -bodyH*0.6 + Math.sin(a)*5, 4, "#ffe14d");
    }
  } else if (b.dive > 0) {
    ctx.beginPath(); ctx.arc(0, eyeY+13, 4, 0, Math.PI); ctx.stroke();
  } else if (Math.abs(b.vx) > 250) {
    ctx.beginPath(); ctx.arc(0, eyeY+12, 5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, eyeY+9, 4.5, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
  }
  // 王冠标记(决赛胜者)
  if (b.crown) {
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.moveTo(-14, -bodyH/2-4); ctx.lineTo(-14, -bodyH/2-18); ctx.lineTo(-7, -bodyH/2-10);
    ctx.lineTo(0, -bodyH/2-24); ctx.lineTo(7, -bodyH/2-10); ctx.lineTo(14, -bodyH/2-18); ctx.lineTo(14, -bodyH/2-4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#d69a12"; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();

  // 名字牌
  ctx.font = `${isP?800:600} 13px sans-serif`;
  ctx.textAlign = "center";
  ctx.fillStyle = isP ? "#ffe14d" : "rgba(255,255,255,.9)";
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 3;
  const ny = b.y - bodyH - 16;
  ctx.strokeText(b.name, b.x, ny);
  ctx.fillText(b.name, b.x, ny);
}
function drawStar(x,y,r,color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i=0;i<8;i++) {
    const a = i*Math.PI/4, rr = i%2? r*0.45 : r;
    ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fill();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1),16);
  const r = clamp((n>>16)+amt,0,255), g = clamp(((n>>8)&255)+amt,0,255), b = clamp((n&255)+amt,0,255);
  return `rgb(${r},${g},${b})`;
}

/* ---------------- 主循环 ---------------- */
let lastT = 0, acc = 0;
const FIXED = 1/120;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  let dt = Math.min(0.1, (ts-lastT)/1000);
  lastT = ts;
  if (game.state === "play" && !game.paused) {
    acc += dt * game.slowmo;
    let steps = 0;
    while (acc >= FIXED && steps < 10) {
      stepGame(FIXED);
      acc -= FIXED; steps++;
    }
    if (game.winner && game.slowmo < 1) game.slowmo = Math.min(1, game.slowmo + dt*0.8);
  }
  // 粒子和彩带在任何状态都飘
  for (let i=game.particles.length-1;i>=0;i--) {
    const p = game.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||600)*dt; p.life -= dt;
    if (p.life<=0) game.particles.splice(i,1);
  }
  for (let i=game.confetti.length-1;i>=0;i--) {
    const c = game.confetti[i];
    c.x += c.vx*dt; c.y += c.vy*dt; c.vy += 300*dt; c.rot += c.rv*dt;
    if (c.y > game.camY+600) game.confetti.splice(i,1);
  }
  if (game.level) render();
}
requestAnimationFrame(loop);

/* ---------------- 启动 ---------------- */
document.getElementById("startBtn").addEventListener("click", ()=>{
  audio(); startMusic(); SFX.click();
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  makeBeans();
  startCountdown(0);
});
document.getElementById("againBtn").addEventListener("click", ()=>{
  SFX.click();
  document.getElementById("result").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  game.winner = null; game.slowmo = 1;
  makeBeans();
  startCountdown(0);
});
</script>
