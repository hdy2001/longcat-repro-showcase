<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大象牙膏 · 3D 化学实验演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: #14161b; color: #fff;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  .title { position: fixed; top: 24px; left: 28px; z-index: 10; pointer-events: none; user-select: none; }
  .title h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .title h1 em { font-style: normal; color: #ff5fa8; }
  .title p { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.5); letter-spacing: .3px; }

  #hud {
    position: fixed; top: 24px; right: 28px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: rgba(20,22,28,.55); border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 8px 14px; border-radius: 999px; font-size: 12px; color: rgba(255,255,255,.75);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: none; }
  .dot.active { background: #ff5fa8; box-shadow: 0 0 10px #ff5fa8; animation: pulse 1s infinite; }
  .dot.done { background: #34d399; box-shadow: 0 0 8px #34d399; }
  @keyframes pulse { 50% { opacity: .4; } }
  #fps { color: rgba(255,255,255,.35); font-size: 11px; min-width: 42px; text-align: right; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center; align-items: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .bar {
    display: flex; align-items: center; gap: 16px;
    background: rgba(20,22,28,.55); border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 12px 18px; border-radius: 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,.5);
  }
  #eruptBtn {
    appearance: none; border: none; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 1px; color: #fff;
    padding: 12px 30px; border-radius: 999px;
    background: linear-gradient(135deg, #ff5fa8, #ff2d78);
    box-shadow: 0 6px 24px rgba(255,45,120,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  #eruptBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(255,45,120,.6), inset 0 1px 0 rgba(255,255,255,.25); }
  #eruptBtn:active:not(:disabled) { transform: translateY(0); }
  #eruptBtn:disabled { filter: saturate(.4) brightness(.8); cursor: default; }
  .hint { font-size: 12px; color: rgba(255,255,255,.4); white-space: nowrap; }

  #fallback {
    position: fixed; inset: 0; z-index: 99; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: #14161b; color: #f87171; font-size: 14px; line-height: 2; padding: 40px;
  }
  @media (max-width: 640px) { .hint, .title p { display: none; } }
</style>
</head>
<body>
  <div id="scene"></div>

  <div class="title">
    <h1>大象牙膏 <em>Elephant Toothpaste</em></h1>
    <p>2H₂O₂ —(KI 催化剂)→ 2H₂O + O₂↑ · 洗洁精捕获氧气形成粉色泡沫</p>
  </div>

  <div id="hud">
    <span id="hudDot" class="dot"></span>
    <span id="hudText">就绪</span>
    <span id="fps"></span>
  </div>

  <footer>
    <div class="bar">
      <button id="eruptBtn">🫧 开始喷发</button>
      <div class="hint">拖动旋转 · 滚轮缩放</div>
    </div>
  </footer>

  <div id="fallback">3D 场景加载失败<br />请检查网络后刷新（需访问 CDN 加载 three.js）</div>

  <script>
    // 加载失败兜底提示
    setTimeout(function () {
      if (!window.__booted) document.getElementById('fallback').style.display = 'flex';
    }, 7000);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* ================= 渲染器 / 场景 ================= */
    const container = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    {
      const c = document.createElement('canvas');
      c.width = 4; c.height = 512;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#4a5266');
      grad.addColorStop(0.4, '#2a2f3b');
      grad.addColorStop(1.0, '#181b21');
      g.fillStyle = grad;
      g.fillRect(0, 0, 4, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
    }
    scene.fog = new THREE.Fog(0x171a21, 170, 480);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1500);
    camera.position.set(66, 48, 66);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 20, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 24;
    controls.maxDistance = 280;
    controls.maxPolarAngle = Math.PI * 0.55;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;

    // 环境反射（玻璃质感的关键）
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    /* ================= 灯光 ================= */
    scene.add(new THREE.HemisphereLight(0xd6deff, 0x2a241c, 0.55));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(70, 120, 55);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 30;
    keyLight.shadow.camera.far = 320;
    keyLight.shadow.camera.left = -100;
    keyLight.shadow.camera.right = 100;
    keyLight.shadow.camera.top = 100;
    keyLight.shadow.camera.bottom = -100;
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.03;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x7fa8ff, 0.7);
    rimLight.position.set(-70, 45, -80);
    scene.add(rimLight);

    // 喷发时烧瓶内的粉色辉光
    const glowLight = new THREE.PointLight(0xff4da6, 0, 70, 1.6);
    glowLight.position.set(0, 6, 0);
    scene.add(glowLight);

    /* ================= 平面（1000×1000，灰色光滑，接收阴影） ================= */
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(1000, 1000),
      new THREE.MeshStandardMaterial({ color: 0x878e99, roughness: 0.7, metalness: 0.06 })
    );
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    scene.add(plane);

    /* ================= 三角烧瓶（平底 → 圆锥瓶身 → 圆柱瓶颈） ================= */
    // 车削轮廓，整体方向朝上（y 递增）
    const flaskProfile = [
      [0.00,  0.00],   // 底面中心
      [10.90, 0.00],   // 扁平底部
      [11.00, 0.25],   // 底部倒角
      [3.00,  9.20],   // 圆锥瓶身（向下逐渐变宽）
      [2.75,  9.80],   // 瓶肩过渡
      [2.75,  16.20],  // 圆柱形瓶颈
      [3.15,  16.70],  // 瓶口外翻
      [3.15,  17.30],  // 瓶口
    ].map(([x, y]) => new THREE.Vector2(x, y));

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.9,
      roughness: 0.05,
      metalness: 0.35,
      clearcoat: 1.0,
      clearcoatRoughness: 0.03,
      transmission: 0.95,
      ior: 1.5,
      side: THREE.DoubleSide,
      envMapIntensity: 1.25,
    });
    const flask = new THREE.Mesh(new THREE.LatheGeometry(flaskProfile, 96), glassMat);
    flask.castShadow = true;
    scene.add(flask);

    // 瓶身圆锥半径函数（碰撞 & 液体贴合共用）
    function coneRadius(y) {
      if (y <= 0.25) return 11.0;
      if (y >= 9.20) return 2.75;
      return 11.0 - (8.0 / 8.95) * (y - 0.25);
    }

    /* ================= 荧光粉色液体（约 1/3 瓶高） ================= */
    const LIQUID_MAX = 5.75; // ≈ 瓶高 17.3 的 1/3
    let liquidLevel = LIQUID_MAX;

    // 不透明材质：确保透过 transmission 玻璃时液体清晰可见
    const liquidMat = new THREE.MeshPhysicalMaterial({
      color: 0xff4da6,
      emissive: 0xff2088,
      emissiveIntensity: 0.55,
      roughness: 0.14,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      ior: 1.33,
      envMapIntensity: 0.8,
      side: THREE.DoubleSide,
    });

    // 复制烧瓶的锥形内壁（沿轮廓内缩 0.14），顶部为平整液面，不会溢出
    function buildLiquidGeometry(level) {
      const pts = [];
      pts.push(new THREE.Vector2(0, 0.06));
      pts.push(new THREE.Vector2(coneRadius(0.06) - 0.14, 0.06));
      const N = 5;
      for (let i = 1; i < N; i++) {
        const y = 0.06 + (level - 0.16) * (i / N);
        pts.push(new THREE.Vector2(coneRadius(y) - 0.14, y));
      }
      pts.push(new THREE.Vector2(coneRadius(level - 0.08) - 0.14, level - 0.08));
      pts.push(new THREE.Vector2(0, level)); // 平整液面
      return new THREE.LatheGeometry(pts, 80);
    }

    let liquidGeometry = buildLiquidGeometry(liquidLevel);
    const liquid = new THREE.Mesh(liquidGeometry, liquidMat);
    scene.add(liquid);

    function setLiquidLevel(level) {
      liquidLevel = level;
      const old = liquidGeometry;
      liquidGeometry = buildLiquidGeometry(level);
      liquid.geometry = liquidGeometry;
      old.dispose();
    }

    /* ================= 泡沫：Metaball 融合粒子系统 ================= */
    const foamMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xff54a8,          // 荧光粉
      emissive: 0xff1f8f,       // 自发光
      emissiveIntensity: 0.55,
      roughness: 0.32,
      metalness: 0.0,
      clearcoat: 0.85,
      clearcoatRoughness: 0.28,
      transparent: true,
      opacity: 0.93,
      side: THREE.DoubleSide,
      envMapIntensity: 0.7,
    });

    const FIELD_SCALE = 52;      // 场局部空间 [-1,1] → 世界坐标 ±52
    const FIELD_RES = 80;
    const foam = new MarchingCubes(FIELD_RES, foamMaterial, false, false, 250000);
    foam.isolation = 36;
    foam.position.set(0, 40, 0); // 场覆盖世界 y ∈ [-12, 92]，足以容纳泡沫柱
    foam.scale.set(FIELD_SCALE, FIELD_SCALE, FIELD_SCALE);
    foam.castShadow = true;
    foam.receiveShadow = true;
    foam.frustumCulled = false;
    scene.add(foam);

    // 场公式: val = strength/(d²+ε) - subtract，等值面 d_iso = sqrt(strength/(subtract+isolation))
    // 世界半径 = d_iso * 2 * FIELD_SCALE；按 r² 缩放 → 世界半径 ≈ r
    const FOAM_SUBTRACT = 12;
    let FOAM_STRENGTH = 0.0178; // 半径 2 的世界单位球基准强度
    function ballStrength(r) { return FOAM_STRENGTH * (r / 2.0) * (r / 2.0); }

    // 世界坐标 → 场坐标 [0,1]（MarchingCubes 局部空间为 [-1,1]）
    const _fv = new THREE.Vector3();
    function worldToField(p) {
      _fv.set(
        (p.x - foam.position.x) / FIELD_SCALE * 0.5 + 0.5,
        (p.y - foam.position.y) / FIELD_SCALE * 0.5 + 0.5,
        (p.z - foam.position.z) / FIELD_SCALE * 0.5 + 0.5
      );
      return _fv;
    }

    const MAX_PARTICLES = 950;
    const particles = [];
    const rand = (a, b) => a + Math.random() * (b - a);

    function spawnFoamParticle(type) {
      if (particles.length >= MAX_PARTICLES) return;
      const p = {
        type,
        seed: Math.random() * 1000,
        radius: rand(1.4, 2.4),
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
      };
      if (type === 'jet') {
        // 喷射流：从窄口高速向上，形成主泡沫柱
        p.pos.set(rand(-1.2, 1.2), 16.6 + rand(0, 0.6), rand(-1.2, 1.2));
        p.vel.set(rand(-2.2, 2.2), rand(34, 52), rand(-2.2, 2.2));
      } else {
        // 溢流：越过瓶口外翻，沿锥形瓶身流下
        const a = Math.random() * Math.PI * 2;
        const r = rand(3.1, 3.7);
        p.pos.set(Math.cos(a) * r, 16.0 + rand(0, 0.9), Math.sin(a) * r);
        const out = rand(2.5, 6.5);
        p.vel.set(Math.cos(a) * out, rand(0.5, 4.0), Math.sin(a) * out);
      }
      particles.push(p);
    }

    const GRAVITY = 9.0;
    const DRAG = 0.9;
    const POST_DRAG = 1.7; // 喷发结束后泡沫减速“定型”

    // 与玻璃烧瓶的碰撞（圆锥瓶身 + 瓶颈；上升的喷射流穿过瓶颈）
    function collideFlask(p) {
      const y = p.pos.y;
      const d = Math.hypot(p.pos.x, p.pos.z);
      let wall = -1;
      if (y < 9.2) wall = coneRadius(y) + p.radius * 0.35;
      else if (y < 17.3 && p.vel.y < 0) wall = 2.75 + p.radius * 0.35;
      if (wall < 0 || d >= wall || d < 1e-4) return;
      const nx = p.pos.x / d, nz = p.pos.z / d;
      p.pos.x = nx * wall;
      p.pos.z = nz * wall;
      const vn = p.vel.x * nx + p.vel.z * nz;
      if (vn < 0) { p.vel.x -= vn * nx; p.vel.z -= vn * nz; }
      p.vel.multiplyScalar(0.985);
    }

    function updateFoam(dt, t, intensity) {
      const windBase = intensity * 30;   // 喷发气流，把泡沫柱持续向上推
      const drag = DRAG + (intensity < 0.01 ? POST_DRAG - DRAG : 0);
      const dragK = Math.max(0, 1 - drag * dt);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vel.y -= GRAVITY * dt;
        if (intensity > 0.01 && p.pos.y > 17.0) {
          const fade = Math.max(0, 1 - (p.pos.y - 17.0) / 45); // 越高推力越弱
          p.vel.y += windBase * fade * dt;
          if (p.pos.y > 78) p.vel.y -= (p.pos.y - 78) * 4 * dt; // 软上限
        }
        p.vel.multiplyScalar(dragK);
        // 喷发时向中轴收束，保持柱状
        if (intensity > 0.01 && p.pos.y > 17.0) {
          p.vel.x -= p.pos.x * 1.7 * intensity * dt;
          p.vel.z -= p.pos.z * 1.7 * intensity * dt;
        }
        // 抖动（泡沫的呼吸感）
        const wob = 0.5 + intensity;
        p.vel.x += Math.sin(t * 2.6 + p.seed) * 1.7 * wob * dt;
        p.vel.z += Math.cos(t * 2.2 + p.seed * 1.3) * 1.7 * wob * dt;
        p.pos.addScaledVector(p.vel, dt);

        collideFlask(p);

        // 地面：堆积 + 向外摊开
        const floorY = p.radius * 0.55;
        if (p.pos.y < floorY) {
          p.pos.y = floorY;
          if (p.vel.y < 0) p.vel.y *= -0.12;
          const fr = Math.max(0, 1 - 2.4 * dt);
          p.vel.x *= fr;
          p.vel.z *= fr;
          const d = Math.hypot(p.pos.x, p.pos.z);
          if (d > 15 && d < 46) {
            p.vel.x += (p.pos.x / d) * 3.5 * dt;
            p.vel.z += (p.pos.z / d) * 3.5 * dt;
          }
        }
        // 逃逸出场地的剔除
        if (Math.abs(p.pos.x) > 50 || Math.abs(p.pos.z) > 50 || p.pos.y > 90) {
          particles.splice(i, 1);
        }
      }
    }

    /* ================= 喷发状态机 & UI ================= */
    const ERUPT_DURATION = 9.0;
    const btn = document.getElementById('eruptBtn');
    const hudText = document.getElementById('hudText');
    const hudDot = document.getElementById('hudDot');
    const fpsEl = document.getElementById('fps');

    let erupting = false;
    let eruptT = 0;
    let spawnAcc = 0;
    let lastBuiltLevel = LIQUID_MAX;
    let statusTimer = 0;
    let maxY = 0;

    function intensityAt(t) {
      const ramp = 0.7, down = 1.6;
      if (t < ramp) return t / ramp;
      if (t > ERUPT_DURATION - down) return Math.max(0, (ERUPT_DURATION - t) / down);
      return 1;
    }

    function setStatus(text, mode) {
      hudText.textContent = text;
      hudDot.className = 'dot' + (mode ? ' ' + mode : '');
    }

    function startEruption() {
      particles.length = 0;
      erupting = true;
      eruptT = 0;
      spawnAcc = 0;
      lastBuiltLevel = LIQUID_MAX;
      setLiquidLevel(LIQUID_MAX);
      btn.disabled = true;
      btn.textContent = '🌋 喷发中…';
      setStatus('准备喷发…', 'active');
    }

    btn.addEventListener('click', startEruption);

    /* ================= 主循环 ================= */
    const clock = new THREE.Clock();
    let fpsEMA = 60;
    let simT = 0;

    function tick(dt) {
      simT += dt;
      const t = simT;

      let intensity = 0;
      if (erupting) {
        eruptT += dt;
        intensity = intensityAt(eruptT);

        // 持续生成泡沫粒子
        spawnAcc += intensity * 240 * dt;
        while (spawnAcc >= 1) {
          spawnAcc -= 1;
          spawnFoamParticle(Math.random() < 0.72 ? 'jet' : 'spill');
        }

        // 液面随喷发下降（几何重建，液面始终平整贴合瓶壁）
        const lvl = LIQUID_MAX * (1 - 0.6 * Math.min(1, eruptT / ERUPT_DURATION));
        if (Math.abs(lvl - lastBuiltLevel) > 0.04) {
          setLiquidLevel(lvl);
          lastBuiltLevel = lvl;
        }

        // 辉光 / 瓶身微震 / 液体荧光增强
        glowLight.intensity += (intensity * 200 - glowLight.intensity) * Math.min(1, dt * 4);
        flask.position.x = Math.sin(t * 31) * 0.05 * intensity;
        flask.position.z = Math.cos(t * 27) * 0.05 * intensity;
        liquid.position.x = flask.position.x;
        liquid.position.z = flask.position.z;
        liquidMat.emissiveIntensity = 0.55 + intensity * 0.5;

        if (eruptT >= ERUPT_DURATION) {
          erupting = false;
          btn.disabled = false;
          btn.textContent = '🔄 再次喷发';
          setStatus('喷发完成 · 峰值高度 ' + Math.round(maxY) + '（瓶高 17.3 的 ' + (maxY / 17.3).toFixed(1) + ' 倍）', 'done');
        }
      } else {
        glowLight.intensity *= Math.max(0, 1 - dt * 3);
        flask.position.x *= 0.9;
        flask.position.z *= 0.9;
        liquid.position.x = flask.position.x;
        liquid.position.z = flask.position.z;
      }

      maxY = 0;
      updateFoam(dt, t, intensity);

      // 写入 metaball 场（粒子相互融合成连续泡沫表面）
      foam.reset();
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.pos.y > maxY) maxY = p.pos.y;
        const f = worldToField(p.pos);
        const pr = p.radius * (1 + 0.07 * Math.sin(t * 5 + p.seed * 7));
        foam.addBall(f.x, f.y, f.z, ballStrength(pr), FOAM_SUBTRACT);
      }
      if (typeof foam.update === 'function') foam.update();

      // 喷发时状态栏实时显示高度
      statusTimer -= dt;
      if (statusTimer <= 0) {
        statusTimer = 0.12;
        if (erupting) setStatus('喷发中 · 泡沫高度 ' + Math.round(maxY), 'active');
      }

      // 相机焦点随喷发上移
      const focusY = 20 + 16 * Math.min(1, eruptT / ERUPT_DURATION);
      controls.target.y += (focusY - controls.target.y) * Math.min(1, dt * 1.6);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (dt > 0) fpsEMA = fpsEMA * 0.95 + (1 / Math.max(dt, 1e-4)) * 0.05;
      tick(dt);
      controls.update();
      fpsEl.textContent = Math.round(fpsEMA) + ' fps';
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ================= 调试接口 ================= */
    window.__demo = {
      start: startEruption,
      maxY: () => maxY,
      particleCount: () => particles.length,
      ff(seconds) { // 快进模拟（测试用）
        const steps = Math.round(seconds * 60);
        for (let i = 0; i < steps; i++) tick(1 / 60);
      },
      tune({ isolation, subtract, strength } = {}) {
        if (isolation !== undefined) foam.isolation = isolation;
        if (subtract !== undefined) FOAM_SUBTRACT = subtract;
        if (strength !== undefined) FOAM_STRENGTH = strength;
      },
      params: () => ({ isolation: foam.isolation, subtract: FOAM_SUBTRACT, strength: FOAM_STRENGTH }),
    };
    window.__booted = true;
  </script>
</body>
</html>
