<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>上海滩大富翁</title>
<style>
:root{
  --desk0:#06231a; --desk1:#0b3524; --paper:#f2e8cf; --paper2:#e9dcba; --ink:#3a2f1e;
  --red:#9c2b2e; --red-d:#7c1f22; --green:#14402e; --gold:#b98a2f; --gold-l:#d9b45b;
  --line:#b9a77a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 800px at 50% -20%, #0f4530 0%, transparent 60%),
    radial-gradient(900px 700px at 110% 110%, #0a2e1f 0%, transparent 55%),
    linear-gradient(160deg,var(--desk1),var(--desk0));
  color:var(--ink); overflow:hidden;
}
.serif{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;}
#app{display:flex;flex-direction:column;height:100vh;}
/* ---------- 顶栏 ---------- */
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;}
.logo{font-family:"Songti SC","STSong","SimSun",serif;font-size:26px;font-weight:700;color:var(--gold-l);
  letter-spacing:6px;display:flex;align-items:baseline;gap:10px;text-shadow:0 2px 10px rgba(0,0,0,.5);}
.logo small{font-size:13px;letter-spacing:4px;color:#8fb89f;font-family:inherit;}
.logo .seal{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;
  background:var(--red);color:#f2e8cf;font-size:12px;letter-spacing:0;transform:rotate(-6deg);
  box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(242,232,207,.5);font-family:inherit;}
.hright{display:flex;align-items:center;gap:10px;}
.round-chip{background:rgba(0,0,0,.3);border:1px solid rgba(217,180,91,.35);color:var(--gold-l);
  border-radius:99px;padding:6px 16px;font-size:12.5px;letter-spacing:1px;}
.hbtn{border:1px solid rgba(217,180,91,.4);background:rgba(0,0,0,.25);color:var(--gold-l);border-radius:10px;
  padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.2s;}
.hbtn:hover{background:rgba(217,180,91,.15);}
/* ---------- 主区 ---------- */
main{flex:1;display:flex;gap:18px;padding:0 22px 18px;min-height:0;}
.board-area{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;}
.board-frame{position:relative;padding:16px;border-radius:22px;
  background:linear-gradient(150deg,#17452f,#0d2c1e 60%,#123a28);
  box-shadow:0 34px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(0,0,0,.6);}
.board-frame i.c{position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e8cd7d,#8a6a1f 70%);box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 -1px 2px rgba(0,0,0,.4);}
.board-frame i.c.tl{top:7px;left:7px;} .board-frame i.c.tr{top:7px;right:7px;}
.board-frame i.c.bl{bottom:7px;left:7px;} .board-frame i.c.br{bottom:7px;right:7px;}
.board{position:relative;display:grid;grid-template-rows:repeat(10,1fr);grid-template-columns:repeat(10,1fr);
  aspect-ratio:1/1;height:min(calc(100vh - 108px),100%);max-width:100%;border-radius:10px;overflow:hidden;
  background:var(--paper);box-shadow:inset 0 0 0 2px var(--line), inset 0 0 60px rgba(120,95,40,.15);}
/* ---------- 格子 ---------- */
.tile{position:relative;background:linear-gradient(170deg,var(--paper),var(--paper2));
  border:1px solid rgba(120,100,55,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;transition:filter .2s;}
.tile.hot{filter:brightness(1.12);}
.tile .band{position:absolute;background:var(--gc,#999);opacity:.9;}
.side-b .band{top:0;left:0;right:0;height:8%;}
.side-t .band{bottom:0;left:0;right:0;height:8%;}
.side-l .band{top:0;bottom:0;right:0;width:8%;}
.side-r .band{top:0;bottom:0;left:0;width:8%;}
.tile .tname{font-family:"Songti SC","STSong","SimSun",serif;font-weight:700;font-size:12.5px;color:var(--ink);
  text-align:center;line-height:1.2;padding:0 2px;}
.tile .tprice{font-size:10.5px;color:#7a6a45;margin-top:3px;font-variant-numeric:tabular-nums;}
.tile .ownerbar{position:absolute;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:2px;background:var(--oc,#999);}
.side-b .ownerbar{bottom:10%;} .side-t .ownerbar{top:10%;}
.side-l .ownerbar{left:auto;right:10%;top:50%;transform:translateY(-50%);width:3px;height:22px;}
.side-r .ownerbar{left:10%;top:50%;transform:translateY(-50%);width:3px;height:22px;}
.tile .pips{position:absolute;font-size:9px;letter-spacing:1px;color:var(--gc,#999);}
.side-b .pips{bottom:14%;} .side-t .pips{top:14%;}
.side-l .pips{right:16%;} .side-r .pips{left:16%;}
.tile .bigmark{font-family:"Songti SC","STSong","SimSun",serif;font-weight:700;}
.card-chance .bigmark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8c96d,#a87b2a);
  color:#fff8e8;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,248,232,.5);}
.card-fate .bigmark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,#1c5a40,#0e3524);
  color:#f2e8cf;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.25), inset 0 0 0 1.5px rgba(242,232,207,.35);}
.tile .clabel{font-size:10px;color:#7a6a45;letter-spacing:2px;margin-top:2px;}
.station .metro{width:26px;height:26px;border-radius:50%;background:var(--green);border:2.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;margin-bottom:2px;}
.station .metro::before{content:"";width:12px;height:3.5px;border-radius:2px;background:var(--paper);}
.corner{flex-direction:column;gap:2px;}
.corner .cicon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
.corner .cname{font-family:"Songti SC","STSong","SimSun",serif;font-weight:700;font-size:14px;color:var(--ink);}
.corner .csub{font-size:10px;color:#7a6a45;}
.go-tile{background:linear-gradient(160deg,#a83a36,#7c1f22);color:#f7efdb;}
.go-tile .cname{color:#f7efdb;} .go-tile .csub{color:#e8b7a0;}
.jail-tile{background:linear-gradient(160deg,#4a4a48,#2b2b29);}
.park-tile{background:linear-gradient(160deg,#2e6b4a,#1b4a30);}
.tax-tile{background:linear-gradient(160deg,#d8cba4,#c9b888);}
/* ---------- 中央 ---------- */
.center{grid-row:3/9;grid-column:3/9;position:relative;overflow:hidden;}
.center svg{position:absolute;inset:0;width:100%;height:100%;}
.wave{animation:waveMove 5s linear infinite;}
@keyframes waveMove{to{stroke-dashoffset:-60;}}
.ferry{animation:ferryGo 17s linear infinite;}
.ferry .boat-bob{animation:boatBob 2.2s ease-in-out infinite;}
@keyframes ferryGo{from{transform:translateX(-60px);}to{transform:translateX(560px);}}
@keyframes boatBob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-2.5px) rotate(1deg);}}
.gull{animation:gullDrift 9s ease-in-out infinite alternate;}
@keyframes gullDrift{from{transform:translateX(0);}to{transform:translateX(26px);}}
/* 骰子与按钮 */
.dicebox{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:14px;z-index:4;}
.die{width:44px;height:44px;border-radius:9px;background:linear-gradient(150deg,#fdf8ea,#e9dcba);
  box-shadow:0 4px 10px rgba(0,0,0,.3), inset 0 0 0 1.5px var(--line);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;}
.die i{border-radius:50%;background:var(--ink);place-self:center;width:7px;height:7px;visibility:hidden;}
.die i.on{visibility:visible;}
.dicebox.shake .die{animation:diceShake .12s linear infinite;}
@keyframes diceShake{0%{transform:translate(0,0) rotate(0);}25%{transform:translate(-2px,1px) rotate(-6deg);}
  50%{transform:translate(2px,-2px) rotate(5deg);}75%{transform:translate(-1px,-1px) rotate(-3deg);}100%{transform:translate(0,0);}}
.turnlabel{position:absolute;left:50%;top:19%;transform:translateX(-50%);z-index:4;
  font-family:"Songti SC","STSong","SimSun",serif;font-size:14px;color:#8a2f2a;letter-spacing:2px;
  background:rgba(242,232,207,.85);padding:3px 14px;border-radius:99px;border:1px solid rgba(156,43,46,.35);}
.actionrow{position:absolute;left:50%;top:72%;transform:translateX(-50%);display:flex;gap:12px;z-index:4;}
.abtn{border:none;cursor:pointer;font-family:"Songti SC","STSong",SimSun,serif;font-size:14px;font-weight:700;
  letter-spacing:2px;padding:9px 22px;border-radius:99px;color:#f7efdb;
  background:linear-gradient(150deg,#b03a3e,#7c1f22);box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  transition:.15s;}
.abtn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px);}
.abtn:disabled{opacity:.45;cursor:not-allowed;}
.abtn.green{background:linear-gradient(150deg,#2e7d4f,#1b4a30);}
/* ---------- 棋子 ---------- */
#tokens{position:absolute;inset:0;pointer-events:none;z-index:10;}
.tok{position:absolute;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:radial-gradient(circle at 35% 30%,#fdf8ea,#e0d2a8);
  border:2.5px solid var(--pc,#999);box-shadow:0 3px 7px rgba(0,0,0,.45), inset 0 -2px 3px rgba(0,0,0,.15);
  transition:left .26s ease, top .26s ease;}
.tok.landed{animation:tokLand .3s ease;}
@keyframes tokLand{0%{transform:scale(1);}40%{transform:scale(1.25);}100%{transform:scale(1);}}
.tok.dead{filter:grayscale(1);opacity:.45;}
/* ---------- 右侧栏 ---------- */
.side{width:336px;flex:none;display:flex;flex-direction:column;gap:10px;min-height:0;}
.side-title{font-size:13px;letter-spacing:3px;color:#8fb89f;padding:2px 4px;font-weight:600;}
.side-title::before{content:"";display:inline-block;width:8px;height:8px;background:var(--gold);margin-right:8px;transform:rotate(45deg);}
.pcards{flex:1.2;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;}
.pcard{position:relative;background:linear-gradient(170deg,#f7efdb,#ece0bd);border:1.5px solid var(--line);
  border-radius:12px;padding:10px 13px 9px;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:.25s;flex:none;}
.pcard.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,180,91,.45), 0 10px 22px rgba(0,0,0,.4);transform:translateX(-4px);}
.pcard.bankrupt{filter:grayscale(.9);opacity:.55;}
.phead{display:flex;align-items:center;gap:8px;}
.ptok{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--pc);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;}
.pname{font-weight:700;font-size:14.5px;color:var(--ink);}
.ptype{margin-left:auto;font-size:10.5px;color:#fff;background:var(--pc);padding:2px 8px;border-radius:99px;letter-spacing:1px;}
.pcash{font-family:"Songti SC",SimSun,serif;font-size:23px;font-weight:700;color:#7c1f22;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
.pcash small{font-size:12px;color:#7a6a45;font-family:inherit;}
.pstats{display:flex;gap:12px;font-size:11.5px;color:#6b5c3d;}
.pprops{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:rgba(20,64,46,.08);
  border:1px solid rgba(120,100,55,.3);border-radius:99px;padding:1.5px 8px 1.5px 4px;color:#4a3f28;}
.chip i{width:9px;height:9px;border-radius:3px;flex:none;}
.chip .lv{color:#9c2b2e;font-weight:700;}
.pstatus{position:absolute;top:8px;right:10px;display:flex;gap:5px;}
.stamp{font-size:10px;border:1.5px solid var(--red);color:var(--red);border-radius:5px;padding:1px 5px;transform:rotate(8deg);opacity:.85;font-weight:700;}
.stamp.gold{border-color:var(--gold);color:#a87b2a;}
.turnstamp{font-size:10px;border:1.5px solid var(--green);color:var(--green);border-radius:5px;padding:1px 5px;transform:rotate(8deg);font-weight:700;}
.logbox{flex:1;background:rgba(4,20,13,.55);border:1px solid rgba(217,180,91,.22);border-radius:12px;
  padding:8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;min-height:0;}
.le{font-size:12px;color:#cfe0d2;line-height:1.5;padding:4px 8px;background:rgba(255,255,255,.04);border-radius:8px;
  border-left:3px solid var(--gold);animation:leIn .3s ease;}
.le.sys{border-left-color:#5f8a72;color:#9db8a8;}
.le.bad{border-left-color:var(--red);color:#f0c8c0;}
.le.good{border-left-color:#4ade80;color:#c9ecd4;}
.le .lt{color:#6f8a7a;font-size:10px;margin-right:6px;font-variant-numeric:tabular-nums;}
@keyframes leIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.log-title{margin-top:2px;}
/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,14,9,.72);backdrop-filter:blur(4px);z-index:100;
  display:flex;align-items:center;justify-content:center;animation:ovIn .25s ease;}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}
.paper{position:relative;background:linear-gradient(165deg,#f7efdb,#ece0bd);border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1.5px var(--line), inset 0 0 0 5px rgba(247,239,219,.6), inset 0 0 0 6.5px rgba(185,167,122,.5);
  padding:26px 30px;max-width:520px;width:min(92vw,520px);max-height:88vh;overflow-y:auto;
  animation:paperIn .3s cubic-bezier(.32,.72,.24,1);}
@keyframes paperIn{from{opacity:0;transform:translateY(26px) scale(.96);}to{opacity:1;transform:none;}}
.paper h2{font-family:"Songti SC",SimSun,serif;color:#7c1f22;font-size:24px;letter-spacing:4px;text-align:center;margin-bottom:4px;}
.psub{text-align:center;font-size:11.5px;color:#8a7a52;letter-spacing:3px;margin-bottom:16px;}
.prow{display:flex;gap:10px;margin-bottom:13px;align-items:center;}
.prow label{width:64px;flex:none;font-size:12.5px;color:#6b5c3d;font-weight:600;}
.prow .grow{flex:1;}
select,.txt{width:100%;border:1.5px solid var(--line);background:#fdf8ea;border-radius:9px;padding:8px 10px;
  font-size:13.5px;color:var(--ink);font-family:inherit;outline:none;}
select:focus,.txt:focus{border-color:var(--gold);}
.seg{display:flex;gap:6px;flex:1;}
.seg button{flex:1;border:1.5px solid var(--line);background:#f2e8cf;border-radius:9px;padding:7px 0;
  font-size:13px;cursor:pointer;font-family:inherit;color:#6b5c3d;transition:.15s;}
.seg button.on{background:var(--green);color:#f2e8cf;border-color:var(--green);font-weight:700;}
.proll{display:flex;flex-direction:column;gap:8px;flex:1;}
.pitem{display:flex;align-items:center;gap:8px;background:rgba(20,64,46,.05);border:1px solid rgba(185,167,122,.5);
  border-radius:10px;padding:7px 9px;}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.1);}
.tokpick{display:flex;gap:4px;}
.tokpick button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:#fdf8ea;
  font-size:16px;cursor:pointer;transition:.12s;}
.tokpick button.on{border-color:var(--red);background:#f7e3d3;transform:scale(1.12);box-shadow:0 2px 6px rgba(0,0,0,.2);}
.pname{flex:1;}
.ptype{width:76px;flex:none;}
.bigbtn{display:block;width:100%;margin-top:16px;border:none;cursor:pointer;border-radius:12px;padding:13px;
  font-family:"Songti SC",SimSun,serif;font-size:17px;font-weight:700;letter-spacing:6px;color:#f7efdb;
  background:linear-gradient(150deg,#b03a3e,#7c1f22);box-shadow:0 8px 20px rgba(124,31,34,.4), inset 0 1px 0 rgba(255,255,255,.25);transition:.15s;}
.bigbtn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.bigbtn.ghostb{background:linear-gradient(150deg,#5a6a60,#3a4a40);letter-spacing:2px;font-size:14px;}
/* 对话框内容 */
.dlg-tileband{height:12px;border-radius:6px;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);}
.dlg-name{font-family:"Songti SC",SimSun,serif;font-size:19px;font-weight:700;color:var(--ink);}
.dlg-price{font-size:15px;color:#7c1f22;font-weight:700;margin-top:2px;}
.dlg-info{font-size:12px;color:#6b5c3d;line-height:1.7;background:rgba(20,64,46,.06);border-radius:9px;
  padding:8px 12px;margin-top:10px;border:1px dashed rgba(185,167,122,.7);}
.dlg-btns{display:flex;gap:10px;margin-top:16px;}
.dlg-btns .bigbtn{margin-top:0;letter-spacing:2px;font-size:15px;padding:11px;}
.mbtn{flex:1;border:none;cursor:pointer;border-radius:11px;padding:11px;font-size:14.5px;font-weight:700;
  font-family:"Songti SC",SimSun,serif;letter-spacing:2px;transition:.15s;}
.mbtn.red{background:linear-gradient(150deg,#b03a3e,#7c1f22);color:#f7efdb;box-shadow:0 5px 14px rgba(124,31,34,.35);}
.mbtn.green{background:linear-gradient(150deg,#2e7d4f,#1b4a30);color:#f2e8cf;box-shadow:0 5px 14px rgba(27,74,48,.35);}
.mbtn.plain{background:rgba(20,64,46,.08);color:#4a3f28;border:1.5px solid var(--line);}
.mbtn:disabled{opacity:.4;cursor:not-allowed;}
.mbtn:not(:disabled):hover{filter:brightness(1.1);transform:translateY(-1px);}
.tplist{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.tpitem{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fdf8ea;border-radius:10px;
  padding:9px 13px;cursor:pointer;transition:.15s;font-size:13.5px;}
.tpitem:hover{border-color:var(--gold);background:#f7efdb;}
.tpitem .st-dot{width:12px;height:12px;border-radius:4px;flex:none;}
.tpitem .st-owner{margin-left:auto;font-size:11px;color:#8a7a52;}
/* 卡片 */
.flip{perspective:800px;margin:6px auto 14px;}
.flipin{width:190px;height:120px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.32,.72,.24,1);}
.flip.show .flipin{transform:rotateY(180deg);}
.fface{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;backface-visibility:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.35);}
.fface.back{background:linear-gradient(150deg,#1c5a40,#0e3524);color:#f2e8cf;
  font-family:"Songti SC",SimSun,serif;font-size:30px;letter-spacing:8px;border:2px dashed rgba(242,232,207,.5);}
.fface.front{transform:rotateY(180deg);color:#fff;}
.fface.front.c{background:linear-gradient(150deg,#c9a53f,#8a6a1f);}
.fface.front.f{background:linear-gradient(150deg,#1c5a40,#0e3524);}
.cicon{font-size:34px;line-height:1;}
.ctitle{font-family:"Songti SC",SimSun,serif;font-weight:700;font-size:17px;letter-spacing:3px;}
.cdesc{font-size:12px;line-height:1.55;text-align:center;padding:0 18px;opacity:.95;}
/* 结算 */
.standing{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
.standing td,.standing th{padding:7px 10px;border-bottom:1px dashed rgba(185,167,122,.7);text-align:left;}
.standing th{font-size:11px;color:#8a7a52;letter-spacing:2px;}
.standing .r1 td{font-weight:700;color:#7c1f22;}
/* toast & 飘字 */
#toastRoot{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast2{background:rgba(9,26,18,.95);border:1.5px solid rgba(217,180,91,.5);color:#f2e8cf;font-size:13px;
  padding:9px 22px;border-radius:99px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:toastIn .25s ease;letter-spacing:1px;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
#floatRoot{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden;}
.floaty{position:absolute;font-family:"Songti SC",SimSun,serif;font-weight:700;font-size:19px;
  animation:floatUp 1.4s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6);transform:translate(-50%,0);}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px);}15%{opacity:1;}

/* ================================================================

   ================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN');

/* ---------------- 音效 ---------------- */
const Snd=(()=>{
  let ctx=null,on=true;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
    if(ctx&&ctx.state==='suspended')ctx.resume(); return ctx; }
  function tone(f,t,d,type='sine',v=.16,slide){
    if(!on)return; const c=ac(); if(!c)return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,c.currentTime+t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t+d);
    g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(v,c.currentTime+t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+d);
    o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+d+.05);
  }
  function noise(t,d,v=.1,fc=2000,q=1){
    if(!on)return; const c=ac(); if(!c)return;
    const len=c.sampleRate*d,buf=c.createBuffer(1,len,c.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=buf;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc; f.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(v,c.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+d);
    s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime+t);
  }
  return {
    get on(){return on;},
    toggle(){on=!on; return on;},
    click(){tone(1500,0,.05,'triangle',.08);},
    tick(){tone(950,0,.045,'square',.06);},
    diceGo(){ for(let i=0;i<9;i++) noise(i*.09,.05,.09,2400+((i*53)%800),2); },
    diceStop(){ noise(0,.12,.14,500,1); tone(180,0,.12,'sine',.14,120); },
    coin(){ tone(988,0,.09,'square',.12); tone(1319,.08,.24,'square',.12); },
    pay(){ tone(620,0,.1,'sine',.14); tone(414,.1,.22,'sine',.14); },
    swish(){ noise(0,.16,.09,1500,1.2); },
    whoosh(){ noise(0,.4,.12,600,1); tone(300,0,.4,'sine',.08,900); },
    ding(){ tone(1760,0,.3,'sine',.11); tone(2217,.02,.34,'sine',.09); },
    jail(){ tone(196,0,.34,'sawtooth',.1,130); tone(147,.05,.3,'sawtooth',.08,100); },
    error(){ tone(220,0,.18,'sawtooth',.1,170); },
    fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.26,'triangle',.15)); noise(.65,.3,.06,4000,1); }
  };
})();

/* ---------------- 状态 ---------------- */

  players:[], turn:0, round:1, busy:false, over:false,

};
function cur(){ return G.players[G.turn]; }
function alive(){ return G.players.filter(p=>!p.bankrupt); }
function ownedProps(p){ return TILES.filter(t=>t.owner===p.id); }
function stationsOwned(p){ return STATIONS.filter(t=>t.owner===p.id).length; }
function ownsSet(p,g){ return GROUP_SIZE[g]>1 && TILES.filter(t=>t.g===g&&t.owner===p.id).length===GROUP_SIZE[g]; }
function baseRent(t){ return Math.round(t.price*0.08/10)*10; }
function rentOf(t){
  const lv=game.levels[t.idx]||0;
  let r=baseRent(t)*LEVEL_MULT[lv];
  if(lv===0&&ownsSet(t.owner,t.g)) r*=2;
  return Math.round(r/10)*10;
}
function invested(t){ return t.price*(1+0.5*(game.levels[t.idx]||0)); }
function netWorth(p){ return p.cash + ownedProps(p).reduce((s,t)=>s+invested(t),0); }

  if(i===0) return {r:9,c:9,rs:2,cs:2};
  if(i<8)  return {r:9,c:9-i,rs:2,cs:1};
  if(i===8) return {r:9,c:1,rs:2,cs:2};
  if(i<16) return {r:17-i,c:1,rs:1,cs:2};
  if(i===16) return {r:1,c:1,rs:2,cs:2};
  if(i<24) return {r:1,c:i-15,rs:2,cs:1};
  if(i===24) return {r:1,c:9,rs:2,cs:2};
  return {r:i-23,c:9,rs:1,cs:2};
}

}

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(v){

  return s;
}

/* ---------------- 棋子 ---------------- */
function buildTokens(){
  $('#tokens').innerHTML='';
  if(!G) return;
  G.players.forEach((p,idx)=>{
    const t=document.createElement('div');
    t.className='tok'; t.id='tok'+p.id;
    t.style.setProperty('--pc',p.color);
    t.textContent=p.token;
    $('#tokens').appendChild(t);
    placeToken(p);
  });
}
const TOK_OFF=[[-8,-8],[8,-8],[-8,8],[8,8]];
function placeToken(p){
  const el=$('#tok'+p.id); if(!el) return;
  const tile=$('#board').querySelector(`.tile[data-i="${p.pos}"]`);
  if(!tile) return;
  const o=TOK_OFF[p.id%4];
  el.style.left=(tile.offsetLeft+tile.offsetWidth/2-13.5+o[0])+'px';
  el.style.top=(tile.offsetTop+tile.offsetHeight/2-13.5+o[1])+'px';
}
function moveToken(p){
  const el=$('#tok'+p.id); if(!el) return;
  const tile=$('#board').querySelector(`.tile[data-i="${p.pos}"]`);
  if(!tile) return;
  const o=TOK_OFF[p.id%4];
  el.style.left=(tile.offsetLeft+tile.offsetWidth/2-13.5+o[0])+'px';
  el.style.top=(tile.offsetTop+tile.offsetHeight/2-13.5+o[1])+'px';
  el.classList.remove('landed'); void el.offsetWidth; el.classList.add('landed');
}

/* ---------------- 格子标记 ---------------- */
function renderTileMarks(){
  TILES.forEach((t,i)=>{
    const el=$('#board').querySelector(`.tile[data-i="${i}"]`); if(!el) return;
    el.style.setProperty('--oc','transparent');
    el.querySelector('.ownerbar')?.setAttribute('style','background:transparent');
    const pips=el.querySelector('.pips');
    if(pips) pips.textContent='';
    if((t.t==='prop'||t.t==='station')&&t.owner!==null&&t.owner!==undefined){
      const p=G.players.find(x=>x.id===t.owner); if(!p) return;
      el.style.setProperty('--oc',p.color);
      const bar=el.querySelector('.ownerbar');
      if(bar) bar.style.background=p.color;
      if(t.t==='prop'&&pips){
        const lv=game.levels[i]||0;
        pips.textContent=lv?'▲'.repeat(lv):'';
        pips.style.color=GROUPS[t.g].color;
      }
    }
  });
}

/* ---------------- 面板与日志 ---------------- */
function log(html,cls=''){
  const d=new Date();
  const el=document.createElement('div');
  el.className='le '+cls;
  el.innerHTML=`<span class="lt">${pad2(d.getHours())}:${pad2(d.getMinutes())}</span>${html}`;
  const box=$('#logbox');
  box.prepend(el);
  while(box.children.length>80) box.lastChild.remove();
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast2'; t.textContent=msg;
  $('#toastRoot').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(()=>t.remove(),400);},2100);
}
function floatText(txt,cls,anchorPlayer){
  const f=document.createElement('div');
  f.className='floaty '+cls; f.textContent=txt;
  const boardR=$('#board').getBoundingClientRect();
  let x=boardR.left+boardR.width/2+(Math.random()*120-60), y=boardR.top+boardR.height*0.42;
  if(anchorPlayer){
    const p=anchorPlayer;
    if(p){ const tok=$('#tok'+p.id);
      if(tok){ const r=tok.getBoundingClientRect(); x=r.left+r.width/2; y=r.top-8; } }
  }
  f.style.left=x+'px'; f.style.top=y+'px';
  $('#floatRoot').appendChild(f);
  setTimeout(()=>f.remove(),1450);
}
function updatePanel(){
  if(!G) return;
  $('#roundChip').textContent = game.over ? '已结束' :
    (game.mode==='rounds' ? `第 ${game.round} / ${game.maxRounds} 回合` : `第 ${game.round} 回合`);
  const box=$('#pcards');
  box.innerHTML='';
  G.players.forEach(p=>{
    const props=ownedProps(p);
    const active=G.players[G.turn]===p&&!game.over;

    card.innerHTML=`
      <div class="phead">
        <span class="ptok">${p.token}</span>
        <span class="pname" style="color:${p.bankrupt?'#888':'inherit'}">${p.name}</span>
        <span class="ptype">${p.bankrupt?'破产':(p.type==='ai'?'电脑':'人类')}</span>
      </div>

        const lv=game.levels[t.idx]||0;
        return `<span class="chip"><i style="background:${t.t==='station'?'#14402e':GROUPS[t.g].color}"></i>${t.name}<span class="lv">${lv?'▲'.repeat(lv):''}</span></span>`;

function showModal(html,wide){

  ov.className='overlay';
  ov.innerHTML=`<div class="paper" style="${wide?'max-width:620px':''}">${html}</div>`;
  root.appendChild(ov);
  return ov;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function dlgButtons(actions){
  return `<div class="dlg-btns">${actions.map((a,i)=>
    `<button class="mbtn ${a.cls||'red'}" data-i="${i}" ${a.disabled?'disabled':''}>${a.label}</button>`).join('')}</div>`;
}
function wireButtons(ov,actions,resolve){
  ov.querySelectorAll('.mbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      Snd.click();
      const a=actions[+b.dataset.i];
      closeModal();
      resolve(a.value);
    });
  });
}
function dialog({title,body,actions}){
  return new Promise(resolve=>{
    const ov=showModal(`<h2>${title}</h2>${body}${dlgButtons(actions)}`);
    wireButtons(ov,actions,resolve);
  });
}

function startGame(cfg){
  G={players:[]};
  cfg.players.forEach((p,i)=>{

/* ---------------- 回合引擎 ---------------- */
function renderTurnUI(){
  if(!G||game.over) return;
  const p=cur();
  $('#turnLabel').textContent=`${p.token} ${p.name} 的回合${p.type==='ai'?'（电脑）':''}`;
  const humanCanAct=p.type==='human'&&!game.busy&&!game.rolling;
  $('#rollBtn').disabled=!humanCanAct;
  $('#endTurnBtn').disabled=!(p.type==='human'&&game.busy&&game.resolved);
  updatePanel();
}
async function takeTurn(){
  if(game.over||!G) return;
  const p=cur();
  game.resolved=false;
  if(p.jail>0){
    p.jail--;
    const bail = p.type==='ai' ? (p.cash>BAIL*3) :
      await dialog({title:'👮 拘留中',
        body:`<div class="dlg-name">${p.name}，你正在巡捕房被拘留。</div>
              <div class="dlg-info">缴纳保释金 <b style="color:#7c1f22">${fmt(BAIL)}</b> 可立即出狱；否则本回合停赛。</div>`,
        actions:[{label:`交保释金 ${fmt(BAIL)}`,cls:'green',value:true,disabled:p.cash<BAIL},
                 {label:'停一回合',cls:'plain',value:false}]});
    if(bail&&p.cash>=BAIL){ p.cash-=BAIL; log(`💰 ${p.name} 缴纳 ${fmt(BAIL)} 保释金出狱`,'sys'); updatePanel(); }
    else { log(`👮 ${p.name} 蹲完拘留，停一回合`,'sys'); await sleep(700); return endTurn(); }
  }
  renderTurnUI();
}
$('#rollBtn').addEventListener('click',async()=>{
  if(!G||game.busy||game.over) return;
  game.busy=true; game.resolved=false; renderTurnUI();
  await rollAndMove(cur());
});
$('#endTurnBtn').addEventListener('click',()=>{
  if(!G||game.over||!game.resolved) return;
  Snd.click(); endTurn();
});
async function rollAndMove(p){
  const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6);
  game.rolling=true; renderTurnUI();
  await animDice(d1,d2);
  game.rolling=false;
  game.dice=[d1,d2];
  log(`🎲 ${p.token} ${p.name} 掷出 <b>${d1} + ${d2}</b>（${d1+d2} 点）`,'sys');
  Snd.diceStop();
  await sleep(250);
  await moveSteps(p,d1+d2);
  await resolveTile(p,{});
  if(game.over) return;
  game.busy=false; game.resolved=true;
  if(p.type==='human'){ renderTurnUI(); }
  else { updatePanel(); await sleep(850); endTurn(); }
}
async function animDice(d1,d2){
  const box=$('#dicebox');
  box.classList.add('shake');
  Snd.diceGo();
  const iv=setInterval(()=>setDice(1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)),85);
  await sleep(950);
  clearInterval(iv);
  setDice(d1,d2);
  box.classList.remove('shake');
  Snd.ding();
}
async function moveSteps(p,n){
  const dir=n>=0?1:-1, steps=Math.abs(n);
  for(let s=0;s<steps;s++){
    p.pos=(p.pos+dir+32)%32;
    if(p.pos===0){
      p.cash+=SALARY;
      Snd.coin();
      floatText('+'+fmt(SALARY),'pos',p);
      log(`💵 ${p.name} 经过起点，领取工资 ${fmt(SALARY)}`,'good');
      updatePanel();
      await sleep(200);
    }
    moveToken(p);
    Snd.tick();
    await sleep(270);
  }
  updatePanel();
}

/* ---------------- 落格结算 ---------------- */
async function resolveTile(p,opts={}){
  if(p.bankrupt||game.over) return;
  const t=TILES[p.pos];
  switch(t.t){
    case 'prop': case 'station':{
      if(t.owner===null||t.owner===undefined){
        let buy;
        if(p.type==='human') buy=await buyDialog(t);
        else buy=(p.cash-t.price>=(t.t==='station'?300:400));
        if(buy){
          if(p.cash>=t.price){ doBuy(p,t); }
          else if(p.type==='human') toast('现金不足，无法购买');
        }
      }else if(t.owner===p.id){
        if(t.t==='prop'){
          const lv=game.levels[t.idx]||0;
          if(lv<3){
            const cost=Math.round(t.price*0.5/10)*10;
            let up;
            if(p.type==='human') up=await upgradeDialog(t,cost);
            else up=(p.cash-cost>=600);
            if(up&&p.cash>=cost) doUpgrade(p,t);
            else if(up) toast('现金不足，无法升级');
          } else toast('已是最高等级「会所」');
        }else{
          if(!opts.teleported) await teleportDialog(p,t);
        }
      }else{
        const owner=G.players[t.owner];
        if(p.rentFree){
          p.rentFree=false;
          log(`🛡️ ${p.name} 亮出免租金牌，免去 ${t.name} 租金！`,'good');
          floatText('免租!','gold',p);
          updatePanel();
        }else{
          const amt=t.t==='prop'?rentOf(t):STATION_RENT[stationsOwned(owner)];
          await pay(p,owner,amt,t.t==='prop'?'支付租金':'支付地铁票价');
        }
      }
      break;
    }
    case 'card': await drawCard(p,t.kind); break;
    case 'tax':{
      const amt=Math.max(200,Math.round(netWorth(p)*0.1));
      await pay(p,null,amt,'缴纳所得税');
      break;
    }
    case 'jail': await sendToJail(p); break;
    case 'park': toast('🌳 街心公园：歇歇脚，看看江景'); break;
    case 'go': toast('📍 回到外滩观景台'); break;
  }
}
function doBuy(p,t){
  p.cash-=t.price; t.owner=p.id;
  Snd.coin();
  const label=t.t==='prop'?'房产':'地铁站';
  log(`🏠 ${p.token} ${p.name} 买下 ${t.name}（${label}），花费 ${fmt(t.price)}`,'good');
  floatText('-'+fmt(t.price),'neg',p);
  if(ownsSet(p,t.g)&&t.t==='prop') log(`✨ ${p.name} 集齐了【${GROUPS[t.g].name}】全部地产，租金翻倍！`,'good');
  updatePanel();
}
function doUpgrade(p,t){
  const lv=game.levels[t.idx]||0;
  const cost=Math.round(t.price*0.5/10)*10;
  p.cash-=cost; game.levels[t.idx]=lv+1;
  Snd.coin();
  log(`🔨 ${p.name} 将 ${t.name} 升级为「${LEVEL_NAME[lv+1]}」，花费 ${fmt(cost)}`,'good');
  floatText('-'+fmt(cost),'neg',p);
  updatePanel();
}
async function pay(from,to,amt,label){
  from.cash-=amt;
  if(to) to.cash+=amt;
  Snd.pay();
  floatText('-'+fmt(amt),'neg',from);
  if(to) floatText('+'+fmt(amt),'pos',to);
  const cls=to?'bad':'';
  log(`${to?'🔻':'🔸'} ${from.token} ${from.name} ${label} <b style="color:#e8c25a">${fmt(amt)}</b>${to?` → ${to.name}`:''}`,cls);
  updatePanel();
  await sleep(320);
  await checkBankrupt(from);
}
async function checkBankrupt(p,silent){
  if(p.bankrupt) return true;
  while(p.cash<0&&ownedProps(p).length){
    const props=ownedProps(p).sort((a,b)=>invested(a)-invested(b));
    const t=props[0];
    const back=Math.round(invested(t)*0.6);
    p.cash+=back;
    log(`🏚️ 法院拍卖 ${p.name} 的 ${t.name}，回笼 ${fmt(back)}`,'sys');
    t.owner=null; delete game.levels[t.idx];
    updatePanel();
    await sleep(400);
  }
  if(p.cash<0){
    p.bankrupt=true; p.cash=0;
    ownedProps(p).forEach(t=>{t.owner=null; delete game.levels[t.idx];});
    Snd.jail();
    log(`💥 <b>${p.name}</b> 资不抵债，破产出局！所有地产被银行收回。`,'bad');
    floatText('破产!','neg',p);
    updatePanel();
    await sleep(600);
    checkWin();
    return true;
  }
  return false;
}
function nextStation(fromPos){
  for(let k=1;k<=32;k++){ const i=(fromPos+k)%32; if(TILES[i].t==='station') return i; }
  return null;
}
async function teleportTo(p,tileIdx,free){
  const fare=free?0:FARE;
  if(fare){ p.cash-=fare; floatText('-'+fmt(fare),'neg',p); }
  Snd.whoosh();
  log(`🚇 ${p.name} 乘地铁${free?'（免费）':''}前往 ${TILES[tileIdx].name}${fare?'，票价 '+fmt(fare):''}`,'sys');
  p.pos=tileIdx;
  moveToken(p);
  updatePanel();
  await sleep(500);
  await resolveTile(p,{teleported:true});
}
async function sendToJail(p){
  p.jail=1; p.pos=24;
  Snd.jail(); Snd.swish();
  moveToken(p);
  log(`👮 ${p.name} 被拘留，停一回合！`,'bad');
  floatText('入狱!','neg',p);
  updatePanel();
  await sleep(400);
}

/* ---------------- 对话决策 ---------------- */
function buyDialog(t){
  const g=GROUPS[t.g];
  const setNote=t.t==='prop'&&GROUP_SIZE[t.g]>1?`集齐【${g.name}】全线 → 租金 ×2`:'';
  return dialog({
    title:'购买地产',
    body:`
      <div class="dlg-tileband" style="background:${t.t==='station'?'#14402e':g.color}"></div>
      <div class="dlg-name">${t.t==='station'?'🚇 ':''}${t.name}</div>
      <div class="dlg-price">售价 ${fmt(t.price)}</div>
      <div class="dlg-info">
        ${t.t==='prop'
          ?`基础租金 <b>${fmt(baseRnt(t))}</b> ｜ 升级店铺 ×2.5 ／ 洋房 ×5 ／ 会所 ×9<br>${setNote}`
          :`持有地铁站数量决定票价：1 座 ${fmt(100)} ／ 2 座 ${fmt(250)} ／ 3 座 ${fmt(600)} ／ 4 座 ${fmt(1200)}<br>落在此处可选择 <b>地铁传送</b> 至任意车站（票价 ${fmt(FARE)}）`}
        <br>你的现金：<b style="color:#7c1f22">${fmt(cur().cash)}</b>
      </div>`,
    actions:t.t==='prop'
      ?[{label:`买下 ${fmt(t.price)}`,cls:'red',value:true},{label:'放弃',cls:'plain',value:false}]
      :[{label:`买下 ${fmt(t.price)}`,cls:'red',value:true},{label:'放弃',cls:'plain',value:false}]
  });
}
function upgradeDialog(t,cost){
  const lv=game.levels[t.idx]||0;
  return dialog({
    title:'房产升级',
    body:`
      <div class="dlg-tileband" style="background:${GROUPS[t.g].color}"></div>
      <div class="dlg-name">${t.name} · ${LEVEL_NAME[lv]}</div>
      <div class="dlg-info">
        升级费用：<b style="color:#7c1f22">${fmt(cost)}</b><br>
        租金：${fmt(rentOf(t))} → <b style="color:#2e7d4f">${fmt(Math.round(baseRnt(t)*LEVEL_MULT[lv+1]/10)*10)}</b>
        （${LEVEL_NAME[lv+1]}）
        <br>你的现金：<b style="color:#7c1f22">${fmt(cur().cash)}</b>
      </div>`,
    actions:[
      {label:`升级「${LEVEL_NAME[lv+1]}」 ${fmt(cost)}`,cls:'green',value:true,disabled:cur().cash<cost},
      {label:'离开',cls:'plain',value:false}]
  });
}
async function teleportDialog(p,stationTile){
  const items=STATIONS.map(s=>{
    const own=s.owner===null?'空地':(s.owner===p.id?'属于你':G.players[s.owner].name+' 持有');
    return `<div class="tpitem" data-i="${s.idx}">
      <span class="st-dot" style="background:${s.owner===null?'#14402e':G.players[s.owner].color}"></span>
      <span>🚇 ${s.name}</span><span class="st-owner">${own}</span></div>`;
  }).join('');
  const result=await dialog({
    title:'地铁传送',
    body:`<div class="dlg-info" style="margin-top:0;">当前位于 <b>${stationTile.name}</b>。支付票价 <b style="color:#7c1f22">${fmt(FARE)}</b> 即可传送至任意车站，落格后照常结算。</div>
          <div class="tplist">${items}</div>`,
    actions:[{label:'留在本站',cls:'plain',value:null}]
  });
  if(result!==null&&result!==undefined){
    await teleportTo(p,result,false);
  }
}

/* ---------------- 卡片 ---------------- */
function drawCard(p,kind){
  const deck=CARDS[kind];
  const card=deck[Math.floor(Math.random()*deck.length)];
  return new Promise(async resolve=>{
    const ov=showModal(`
      <h2>${kind==='chance'?'机会':'命运'}</h2>
      <div class="psub">${kind==='chance'?'CHANCE · 好运降临':'FATE · 命数无常'}</div>
      <div class="flip" id="cardFlip">
        <div class="flipin">
          <div class="fface back">上海<br>滩</div>
          <div class="fface front ${kind==='chance'?'c':'f'}">
            <div class="cicon">${card.icon}</div>
            <div class="ctitle">${card.title}</div>
            <div class="cdesc">${card.desc}</div>
          </div>
        </div>
      </div>
      <div class="dlg-btns"><button class="mbtn red" id="cardOk">收 下</button></div>
    `);
    Snd.swish();
    setTimeout(()=>{ $('#cardFlip').classList.add('show'); Snd.card(); },350);
    $('#cardOk').addEventListener('click',async()=>{
      closeModal();
      log(`${kind==='chance'?'❓':'☯️'} ${p.name} 抽到${kind==='chance'?'【机会】':'【命运】'}「${card.title}」：${card.desc}`,'sys');
      await sleep(200);
      await card.fx(p);
      resolve();
    },{once:true});
  });
}

/* ---------------- 胜负 ---------------- */
function checkWin(){
  const act=alive();
  if(act.length===1){ gameOver(act[0],'淘汰所有对手，成为上海滩最后的大亨！'); return true; }
  return false;
}
function gameOver(winner,reason){
  game.over=true; game.busy=true;
  renderTurnUI();
  updatePanel();
  Snd.fanfare();
  const confColors=['#e05c5c','#d9b45b','#4ade80','#5b8dd9','#b5658f','#f5d76e'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=confColors[i%confColors.length];
    c.style.animationDuration=(2.2+Math.random()*2)+'s';
    c.style.animationDelay=(Math.random()*0.8)+'s';
    $('#floatRoot').appendChild(c);
    setTimeout(()=>c.remove(),5200);
  }
  const standings=[...G.players].sort((a,b)=>(b.bankrupt?-1:netWorth(b))-(a.bankrupt?-1:netWorth(a)));
  const rows=standings.map((p,i)=>`<tr class="${i===0?'r1':''}">
    <td>${i===0?'🏆':(i+1)+'.'}</td><td>${p.token} ${p.name}</td>
    <td>${fmt(p.cash)}</td><td>${ownedProps(p).length} 处</td>
    <td>${p.bankrupt?'破产':fmt(netWorth(p))}</td></tr>`).join('');
  setTimeout(()=>{
    showModal(`
      <h2>🏆 ${winner.name} 获胜！</h2>
      <div class="psub">${winner.token} ${reason}</div>
      <table class="standing"><tr><th>名次</th><th>玩家</th><th>剩余现金</th><th>地产</th><th>总资产</th></tr>${rows}</table>
      <button class="bigbtn" id="againBtn">再来一局</button>
    `,true);
    $('#againBtn').addEventListener('click',()=>{Snd.click();closeModal();showSetup();});
  },900);
  log(`🏆 <b>${winner.name}</b> 赢得最终胜利！`,'good');
}
function endTurn(){
  if(game.over||!G) return;
  game.resolved=false;
  game.turn++;
  if(game.turn>=G.players.length){
    game.turn=0; game.round++;
    if(game.mode==='rounds'&&game.round>game.maxRounds){
      const winner=alive().sort((a,b)=>netWorth(b)-netWorth(a))[0];
      gameOver(winner,`${game.maxRounds} 回合期满，资产称霸上海滩！`);
      return;
    }
  }
  updatePanel();
  takeTurn();
}

/* ---------------- 顶栏 ---------------- */
$('#sndBtn').addEventListener('click',function(){
  const on=Snd.toggle();
  this.textContent=on?'🔊 音效':'🔇 静音';
  toast(on?'音效已开启':'音效已静音');
});
$('#restartBtn').addEventListener('click',()=>{
  dialog({title:'重新开局',body:'确定要放弃当前棋局，重新设置玩家吗？',
    actions:[{label:'重新开局',cls:'red',value:true},{label:'继续游戏',cls:'plain',value:false}]})
    .then(v=>{ if(v) showSetup(); });
});

/* ---------------- 启动 ---------------- */
buildBoard();
updatePanel();
showSetup();
</script>
