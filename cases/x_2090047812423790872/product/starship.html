<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STARSHIP — Interactive 3D Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050608; --panel:rgba(13,16,20,0.66); --line:rgba(255,255,255,0.09);
    --text:#eef2f6; --muted:#8b94a1; --accent:#7dd3fc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,0.42) 100%);}
  .topfade{position:fixed;inset:0 0 auto 0;height:190px;pointer-events:none;z-index:5;
    background:linear-gradient(rgba(0,0,0,0.38),transparent);}
  .brand{position:fixed;top:26px;left:30px;z-index:10;pointer-events:none}
  .brand h1{font-size:30px;font-weight:700;letter-spacing:0.34em;line-height:1}
  .brand .sub{margin-top:9px;font-size:10.5px;letter-spacing:0.30em;color:var(--muted);text-transform:uppercase}
  .brand .rule{margin-top:12px;width:64px;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
  .chip{position:fixed;top:30px;right:30px;z-index:10;display:flex;align-items:center;gap:8px;
    padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
    backdrop-filter:blur(12px);font-size:10px;letter-spacing:0.22em;color:var(--muted)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  .panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
  .spec{left:30px;bottom:30px;padding:18px 20px;min-width:302px}
  .panel-title{font-size:10px;letter-spacing:0.28em;color:var(--muted);text-transform:uppercase;
    margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .panel-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .spec-row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
    padding:7px 0;border-top:1px solid rgba(255,255,255,0.05)}
  .spec-row:first-of-type{border-top:none}
  .spec-row .k{font-size:10.5px;letter-spacing:0.18em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .spec-row .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;font-weight:600;white-space:nowrap}
  .spec-row .v em{font-style:normal;color:var(--muted);font-weight:400;font-size:11px;margin-left:7px}
  .controls-bar{position:fixed;right:30px;bottom:30px;z-index:10;display:flex;gap:10px}
  .btn{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);
    color:var(--text);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:0.18em;
    text-transform:uppercase;transition:background .25s ease,transform .25s ease,box-shadow .25s ease;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn:hover{background:rgba(255,255,255,0.10);transform:translateY(-1px)}
  .btn.active{background:var(--accent);border-color:transparent;color:#04121c;
    box-shadow:0 6px 28px rgba(125,211,252,0.35)}
  .hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:9;font-size:10px;
    letter-spacing:0.26em;color:rgba(139,148,161,0.75);text-transform:uppercase;pointer-events:none;white-space:nowrap}
  #loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;transition:opacity .7s ease}
  #loader.hidden{opacity:0;pointer-events:none}
  #loader .ring{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,0.12);
    border-top-color:var(--accent);animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .lt{font-size:10.5px;letter-spacing:0.34em;color:var(--muted);text-transform:uppercase;text-align:center;line-height:2}
  @media (max-width:820px){
    .brand{top:18px;left:18px}.brand h1{font-size:22px}
    .chip{top:18px;right:18px}
    .spec{left:12px;right:12px;bottom:98px;min-width:0;padding:14px 16px}
    .spec-row{padding:5px 0}.spec-row .v{font-size:12px}.spec-row .v em{display:none}
    .controls-bar{left:50%;right:auto;bottom:22px;transform:translateX(-50%)}
    .hint{display:none}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="topfade"></div>
<div class="vignette"></div>

<header class="brand">
  <h1>STARSHIP</h1>
  <div class="rule"></div>
  <div class="sub">Orbital Launch Vehicle · Interactive 3D Showcase</div>
</header>
<div class="chip"><span class="dot"></span>WebGL2 · Realtime</div>

<aside class="panel spec">
  <div class="panel-title">Technical Specification</div>
  <div class="spec-row"><span class="k">Height</span><span class="v">50 m<em>164 ft</em></span></div>
  <div class="spec-row"><span class="k">Diameter</span><span class="v">9 m<em>29.5 ft</em></span></div>
  <div class="spec-row"><span class="k">Engines</span><span class="v">6 × Raptor<em>3 SL + 3 Vac</em></span></div>
  <div class="spec-row"><span class="k">Propellant</span><span class="v">CH₄ / LOX<em>methalox</em></span></div>
  <div class="spec-row"><span class="k">Payload</span><span class="v">100–150 t<em>to LEO</em></span></div>
</aside>

<nav class="controls-bar">
  <button class="btn" id="btnRotate" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>Rotate</button>
  <button class="btn" id="btnTurntable" aria-pressed="false">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="3.6"/><path d="M12 3v18"/><path d="M12 3l-2.4 2.6M12 3l2.4 2.6"/></svg>Turntable</button>
  <button class="btn" id="btnReset">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>Reset View</button>
</nav>
<div class="hint">Drag — Orbit · Scroll — Zoom · Right-drag — Pan</div>
<div id="loader"><div class="ring"></div><div class="lt" id="loadText">Initializing renderer</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONFIG
============================================================ */
const SHIP = {
  radius: 4.5,        // hull radius (9 m diameter)
  barrelTop: 37.5,    // where the nose cone curve begins
  tip: 50.03,         // nose tip height (local, skirt edge = 0)
  bellExit: -2.0,     // engine exit plane (local)
  groupY: 2.0,        // world height of skirt bottom edge
};
const HOME_AZ = THREE.MathUtils.degToRad(33);   // view azimuth (from +X toward -Z)
const HOME_EL = THREE.MathUtils.degToRad(11.5); // view elevation

let W = innerWidth, H = innerHeight;

/* ============================================================
   RENDERER / SCENE / CAMERA
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070a, 0.0028);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 900);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.6;
controls.minDistance = 24;
controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI * 0.56;
controls.autoRotateSpeed = 1.1;

/* ============================================================
   STUDIO ENVIRONMENT (custom PMREM for metal reflections)
============================================================ */
function buildStudioEnv() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x070708);
  const softbox = (w, h, x, y, z, r, ry, intensity, cr, cg, cb) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ side: THREE.DoubleSide })
    );
    m.material.color.setRGB(cr * intensity, cg * intensity, cb * intensity);
    m.position.set(x, y, z);
    m.rotation.set(r, ry, 0);
    s.add(m);
  };
  softbox(24, 24, 0, 22, 0, Math.PI / 2, 0, 1.0, 1.0, 0.97, 0.90);   // top softbox
  softbox(5, 17, -19, 9, 7, 0, Math.PI / 2 - 0.38, 0.5, 0.88, 0.94, 1.0); // left strip (cool)
  softbox(5, 17, 19, 7, -5, 0, -(Math.PI / 2 - 0.35), 0.42, 1.0, 0.90, 0.78); // right strip (warm)
  softbox(13, 15, 0, 10, -22, 0, 0, 0.55, 0.72, 0.82, 1.0);        // back strip
  softbox(15, 4, 0, 3.5, 22, 0.32, Math.PI, 0.26, 1.0, 0.95, 0.85); // front low strip
  softbox(2, 11, 9, 17, -15, 0.15, -0.6, 0.5, 0.9, 0.95, 1.0);      // kicker strip
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(140, 140),
    new THREE.MeshBasicMaterial()
  );
  floor.material.color.setRGB(0.045, 0.045, 0.055);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3;
  s.add(floor);
  return s;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildStudioEnv(), 0.04).texture;

/* ============================================================
   LIGHTS
============================================================ */
const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(26, 34, 18);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 4;
keyLight.shadow.camera.far = 120;
keyLight.shadow.camera.left = -36;
keyLight.shadow.camera.right = 36;
keyLight.shadow.camera.top = 36;
keyLight.shadow.camera.bottom = -36;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.03;
scene.add(keyLight, keyLight.target);
keyLight.target.position.set(0, 24, 0);

const rimCool = new THREE.DirectionalLight(0xa9c8ff, 1.5);
rimCool.position.set(-26, 16, -20);
scene.add(rimCool);

const rimWarm = new THREE.DirectionalLight(0xffd9b0, 0.8);
rimWarm.position.set(18, 8, -26);
scene.add(rimWarm);

scene.add(new THREE.HemisphereLight(0x93a7bd, 0x0b0d10, 0.45));

/* ============================================================
   PROCEDURAL TEXTURES
============================================================ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function rr(ctx, x, y, w, h, r, color) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fill();
}

/* --- heat shield tile map + bump --- */
function makeTileMaps() {
  const COLS = 23, ROWS = 84, TS = 34;
  const w = COLS * TS, h = ROWS * TS;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const bc = document.createElement('canvas'); bc.width = w; bc.height = h;
  const bg = bc.getContext('2d');
  g.fillStyle = '#131416'; g.fillRect(0, 0, w, h);
  bg.fillStyle = '#000'; bg.fillRect(0, 0, w, h);
  for (let r = 0; r < ROWS; r++) {
    for (let q = 0; q < COLS; q++) {
      const x = q * TS, y = r * TS, pad = 3.2;
      const v = 46 + Math.random() * 18;
      const dark = Math.random() < 0.055;
      const rr2 = dark ? v * 0.58 : v;
      const col = `rgb(${rr2 | 0},${(rr2 + 2) | 0},${(rr2 + 6) | 0})`;
      rr(g, x + pad, y + pad, TS - 2 * pad, TS - 2 * pad, 6, col);
      g.strokeStyle = 'rgba(255,255,255,0.09)'; g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(x + pad + 1.5, y + TS - pad - 1.5);
      g.lineTo(x + pad + 1.5, y + pad + 1.5);
      g.lineTo(x + TS - pad - 1.5, y + pad + 1.5);
      g.stroke();
      g.strokeStyle = 'rgba(0,0,0,0.42)';
      g.beginPath();
      g.moveTo(x + TS - pad - 1.5, y + pad + 2.2);
      g.lineTo(x + TS - pad - 1.5, y + TS - pad - 1.5);
      g.lineTo(x + pad + 2.2, y + TS - pad - 1.5);
      g.stroke();
      rr(bg, x + pad, y + pad, TS - 2 * pad, TS - 2 * pad, 6, '#8a8a8a');
      bg.strokeStyle = 'rgba(255,255,255,0.55)'; bg.lineWidth = 1.5;
      bg.beginPath();
      bg.moveTo(x + pad + 1.5, y + TS - pad - 1.5);
      bg.lineTo(x + pad + 1.5, y + pad + 1.5);
      bg.lineTo(x + TS - pad - 1.5, y + pad + 1.5);
      bg.stroke();
      if (Math.random() < 0.45) {
        g.fillStyle = 'rgba(0,0,0,0.12)';
        for (let i = 0; i < 4; i++) {
          g.fillRect(x + pad + Math.random() * (TS - 2 * pad), y + pad + Math.random() * (TS - 2 * pad), 1.4, 1.4);
        }
      }
    }
  }
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  const bump = new THREE.CanvasTexture(bc);
  for (const t of [map, bump]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = maxAniso;
  }
  return { map, bump };
}
const tileMaps = makeTileMaps();
const flapTileTex = tileMaps.map.clone();
flapTileTex.repeat.set(1 / 0.61, 1 / 0.61);
flapTileTex.needsUpdate = true;
const flapBumpTex = tileMaps.bump.clone();
flapBumpTex.repeat.set(1 / 0.61, 1 / 0.61);
flapBumpTex.needsUpdate = true;

/* --- subtle roughness variation for the stainless hull --- */
function makeSteelRoughness() {
  const s = 256;
  const c = document.createElement('canvas'); c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(36,36,36)'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 700; i++) {
    const x = Math.random() * s;
    const l = 20 + Math.random() * 90;
    const up = Math.random() < 0.5;
    const v = up ? 58 : 18;
    g.strokeStyle = `rgba(${v},${v},${v},${0.05 + Math.random() * 0.06})`;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, Math.random() * s); g.lineTo(x, Math.random() * s + l); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 3);
  return t;
}

/* --- studio floor --- */
function makeFloorTexture() {
  const s = 1024, cx = s / 2;
  const c = document.createElement('canvas'); c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#0b0c0f'; g.fillRect(0, 0, s, s);
  const mpp = s / 300; // 300 m floor across the texture
  for (let r = 46; r < 520; r += 52) {
    g.strokeStyle = 'rgba(255,255,255,0.045)';
    g.lineWidth = 1.4;
    g.beginPath(); g.arc(cx, cx, r, 0, Math.PI * 2); g.stroke();
  }
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    g.strokeStyle = 'rgba(255,255,255,0.028)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * 46, cx + Math.sin(a) * 46);
    g.lineTo(cx + Math.cos(a) * 520, cx + Math.sin(a) * 520);
    g.stroke();
  }
  g.strokeStyle = 'rgba(125,211,252,0.16)'; g.lineWidth = 2.4;
  g.beginPath(); g.arc(cx, cx, 12.5 * mpp, 0, Math.PI * 2); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}

/* --- backdrop gradient --- */
function buildBackdrop() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#040507');
  grad.addColorStop(0.42, '#0a0d12');
  grad.addColorStop(0.55, '#11151c');
  grad.addColorStop(0.62, '#0b0e13');
  grad.addColorStop(1.0, '#040507');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  const gx = 1024 * 0.84, gy = 512 * 0.46;
  const rg = g.createRadialGradient(gx, gy, 10, gx, gy, 300);
  rg.addColorStop(0, 'rgba(120,150,185,0.20)');
  rg.addColorStop(0.5, 'rgba(90,115,150,0.07)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 1024, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(280, 280, 260, 64, 1, true),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  mesh.position.y = 60;
  return mesh;
}
scene.add(buildBackdrop());

/* ============================================================
   MATERIALS
============================================================ */
const steelMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2f4f6, metalness: 1.0, roughness: 1.0,
  roughnessMap: makeSteelRoughness(), envMapIntensity: 1.25,
  clearcoat: 0.35, clearcoatRoughness: 0.28,
});
const tileMat = new THREE.MeshStandardMaterial({
  map: tileMaps.map, bumpMap: tileMaps.bump, bumpScale: 0.6,
  color: 0xffffff, roughness: 0.92, metalness: 0.05,
  envMapIntensity: 0.28, side: THREE.DoubleSide,
});
const flapCapMat = new THREE.MeshStandardMaterial({
  map: flapTileTex, bumpMap: flapBumpTex, bumpScale: 0.5,
  color: 0xffffff, roughness: 0.88, metalness: 0.08, envMapIntensity: 0.3,
});
const flapEdgeMat = new THREE.MeshPhysicalMaterial({
  color: 0xe8ebee, metalness: 1.0, roughness: 0.14,
  clearcoat: 0.3, clearcoatRoughness: 0.25, envMapIntensity: 1.2,
});
const innerMat = new THREE.MeshStandardMaterial({
  color: 0x17191c, roughness: 0.95, metalness: 0.2, side: THREE.BackSide,
});
const darkSteelMat = new THREE.MeshStandardMaterial({
  color: 0x3a3f45, metalness: 1.0, roughness: 0.42, envMapIntensity: 0.8,
});
const deckMat = new THREE.MeshStandardMaterial({
  color: 0x22252a, metalness: 0.85, roughness: 0.55, envMapIntensity: 0.6,
});
const bellOuterMat = new THREE.MeshStandardMaterial({
  color: 0xb8bdc3, metalness: 1.0, roughness: 0.34, envMapIntensity: 1.05,
});
const bellInnerMat = new THREE.MeshStandardMaterial({
  color: 0x3f4348, metalness: 1.0, roughness: 0.55,
  emissive: 0x120a05, emissiveIntensity: 0.3, side: THREE.BackSide,
});
const bellRimMat = new THREE.MeshStandardMaterial({
  color: 0x9aa0a6, metalness: 1.0, roughness: 0.28, envMapIntensity: 1.0,
});
const gimbalMat = new THREE.MeshStandardMaterial({
  color: 0x6b7076, metalness: 1.0, roughness: 0.38, envMapIntensity: 0.9,
});
const rubberMat = new THREE.MeshStandardMaterial({
  color: 0x1c1e20, metalness: 0.1, roughness: 0.9,
});
const seamMat = new THREE.MeshStandardMaterial({
  color: 0x7d838a, metalness: 1.0, roughness: 0.45, envMapIntensity: 0.8,
});
const windowGlassMat = new THREE.MeshStandardMaterial({
  color: 0x10161c, metalness: 0.9, roughness: 0.06,
  envMapIntensity: 1.6, emissive: 0x9fc4de, emissiveIntensity: 0.22,
});
const windowFrameMat = new THREE.MeshStandardMaterial({
  color: 0x6f757b, metalness: 1.0, roughness: 0.35, envMapIntensity: 1.0,
});

/* ============================================================
   HULL PROFILE (resampled uniformly by arc length)
============================================================ */
function hullRadiusAt(y) {
  if (y <= SHIP.barrelTop) return SHIP.radius;
  const t = Math.min((y - SHIP.barrelTop) / (SHIP.tip - SHIP.barrelTop), 1);
  return Math.max(SHIP.radius * Math.pow(1 - t, 0.72), 0.001);
}
function buildProfile() {
  const raw = [];
  raw.push([4.55, 0.0], [4.52, 0.3], [4.5, 0.9]);
  raw.push([4.5, 8], [4.5, 16], [4.5, 24], [4.5, 32], [4.5, 37.5]);
  for (let i = 1; i <= 12; i++) {
    const t = i / 12;
    raw.push([hullRadiusAt(37.5 + t * (SHIP.tip - 37.5)), 37.5 + t * (SHIP.tip - 37.5)]);
  }
  raw.push([0.35, 49.68], [0.12, 49.95], [0.02, SHIP.tip]);
  // arc-length resample
  const segs = [];
  let total = 0;
  for (let i = 0; i < raw.length - 1; i++) {
    const dx = raw[i + 1][0] - raw[i][0], dy = raw[i + 1][1] - raw[i][1];
    const len = Math.hypot(dx, dy);
    segs.push({ a: raw[i], b: raw[i + 1], len, start: total });
    total += len;
  }
  const out = [];
  const n = Math.ceil(total / 0.34);
  for (let i = 0; i <= n; i++) {
    const d = (i / n) * total;
    let sg = segs[segs.length - 1];
    for (const s of segs) if (d >= s.start && d <= s.start + s.len) { sg = s; break; }
    const t = sg.len === 0 ? 0 : (d - sg.start) / sg.len;
    out.push([sg.a[0] + (sg.b[0] - sg.a[0]) * t, sg.a[1] + (sg.b[1] - sg.a[1]) * t]);
  }
  return out;
}

function makeBell(exitR, len, throatR) {

  rim.rotation.x = Math.PI / 2;

  m.castShadow = true;
  return m;
}

function makeFlapAssembly(side, def) {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  const P = def.shape.map(p => [p[0] * side, p[1]]);
  s.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) s.lineTo(P[i][0], P[i][1]);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: def.thickness, bevelEnabled: true,
    bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 2, steps: 1,
  });
  geo.applyMatrix4(new THREE.Matrix4().set(1, 0, 0, 0, 0, 1, 0, 0, -0.22 * side, 0, 1, 0, 0, 0, 0, 1));
  geo.translate(0, 0, -def.thickness / 2);
  const flap = new THREE.Mesh(geo, [flapCapMat, flapEdgeMat]);
  flap.position.x = side * 4.62;
  flap.rotation.y = -side * 0.115;
  flap.rotation.z = -side * 0.05;
  flap.castShadow = true;
  flap.receiveShadow = true;
  g.add(flap);

  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, def.pinLen, 12), darkSteelMat);
  pin.position.set(side * 4.58, def.midY, 0);
  g.add(pin);

  def.lugYs.forEach((ly, i) => {
    const lug = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.36, 0.26), darkSteelMat);
    lug.position.set(side * 4.54, ly, i % 2 ? 0.15 : -0.15);
    g.add(lug);
  });

  const seal = new THREE.Mesh(new THREE.BoxGeometry(0.12, def.chord * 0.92, 0.14), rubberMat);
  seal.position.set(side * 4.56, def.midY, 0);
  g.add(seal);

  const a0 = new THREE.Vector3(side * 4.38, def.rootTop + 1.1, 0.55);
  const a1 = new THREE.Vector3(side * (4.62 + def.topReach), def.actY, def.actZ);
  g.add(strut(a0, a1, 0.085, darkSteelMat));
  const mid = a0.clone().lerp(a1, 0.55);
  const dir = a1.clone().sub(a0).normalize();
  g.add(strut(mid, mid.clone().addScaledVector(dir, a0.distanceTo(a1) * 0.28), 0.045, gimbalMat));
  return g;
}

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  return s;
}

function computeHome() {
  const box = new THREE.Box3().setFromObject(shipGroup);
  const center = box.getCenter(new THREE.Vector3());
  const target = new THREE.Vector3(0, THREE.MathUtils.clamp(center.y, 23.5, 27.5), 0);
  const dir = new THREE.Vector3(
    Math.cos(HOME_AZ) * Math.cos(HOME_EL), Math.sin(HOME_EL), -Math.sin(HOME_AZ) * Math.cos(HOME_EL));
  const f = dir.clone().negate();
  const right = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, f).normalize();
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  let dist = 0;
  for (const x of [box.min.x, box.max.x])
    for (const y of [box.min.y, box.max.y])
      for (const z of [box.min.z, box.max.z]) {
        const v = new THREE.Vector3(x, y, z).sub(target);
        const px = v.dot(right), py = v.dot(up);
        dist = Math.max(dist, Math.abs(px) / Math.tan(hHalf), Math.abs(py) / Math.tan(vHalf));
      }
  dist = Math.max(dist * 1.07, 26);
  return { pos: target.clone().addScaledVector(dir, dist), target };
}

let camTween = null;
function flyTo(pos, tgt, dur = 1.5) {
  camTween = {
    t0: performance.now() / 1000, dur,
    p0: camera.position.clone(), p1: pos.clone(),
    g0: controls.target.clone(), g1: tgt.clone(),
  };
}
controls.addEventListener('start', () => { camTween = null; });

const btnRotate = document.getElementById('btnRotate');
const btnTurntable = document.getElementById('btnTurntable');
const btnReset = document.getElementById('btnReset');
let rotateOn = false, turntableOn = false;

function setRotate(on) {
  rotateOn = on;
  controls.autoRotate = on;
  btnRotate.classList.toggle('active', on);
  btnRotate.setAttribute('aria-pressed', String(on));
}
function setTurntable(on) {
  turntableOn = on;
  btnTurntable.classList.toggle('active', on);
  btnTurntable.setAttribute('aria-pressed', String(on));
}
function resetView() {
  const h = computeHome();
  flyTo(h.pos, h.target, 1.4);
}
btnRotate.addEventListener('click', () => setRotate(!rotateOn));
btnTurntable.addEventListener('click', () => setTurntable(!turntableOn));
btnReset.addEventListener('click', resetView);
addEventListener('dblclick', resetView);
addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') setRotate(!rotateOn);
  else if (e.key === 't' || e.key === 'T') setTurntable(!turntableOn);
  else if (e.key === '0' || e.key === 'Backspace') resetView();
});

/* ============================================================
   RESIZE / MAIN LOOP
============================================================ */
addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
let loaderHidden = false;
const loader = document.getElementById('loader');
function hideLoaderOnce() {
  if (loaderHidden) return;
  loaderHidden = true;
  requestAnimationFrame(() => {
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 900);
  });
}

// initial framing + gentle intro dolly
{
  const home = computeHome();
  camera.position.copy(home.pos).multiplyScalar(1.22);
  camera.position.y += 6;
  controls.target.copy(home.target);
  flyTo(home.pos, home.target, 2.2);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now() / 1000;

  if (camTween) {
    const k = Math.min(1, (t - camTween.t0) / camTween.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.g0, camTween.g1, e);
    if (k >= 1) camTween = null;
  }
  if (turntableOn) shipGroup.rotation.y += dt * 0.25;
  controls.update();
  renderer.render(scene, camera);
  hideLoaderOnce();
}
animate();

// expose for debugging
window.__app = { renderer, scene, camera, shipGroup, controls };
