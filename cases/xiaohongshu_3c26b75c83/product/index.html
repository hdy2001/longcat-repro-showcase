<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回声碑谷 · Echo Monuments</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background: linear-gradient(180deg,#fbe4ee 0%,#f4c6de 45%,#d5a3d2 100%); }
  canvas { display:block; }
  .pill { background:rgba(255,255,255,.78); backdrop-filter:blur(6px);
    border-radius:999px; padding:10px 22px; color:#7a4a68;
    box-shadow:0 4px 18px rgba(150,80,130,.25); }
  #title { position:fixed; top:18px; left:20px; font-size:17px; font-weight:600; letter-spacing:3px; }
  #title small { display:block; font-size:10px; letter-spacing:5px; opacity:.55; margin-top:3px; font-weight:400; }
  #gemBox { position:fixed; top:18px; right:20px; font-size:16px; font-weight:600; }
  #hint { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:13px; opacity:.9; white-space:nowrap; }
  #toast { position:fixed; top:22%; left:50%; transform:translate(-50%,-50%) scale(.9);
    font-size:19px; font-weight:700; color:#a03a68; opacity:0; transition:all .3s; pointer-events:none;
    text-shadow:0 2px 12px rgba(255,255,255,.9); }
  #win { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(90,40,80,.35); backdrop-filter:blur(4px); z-index:10; }
  #win .card { background:#fff; border-radius:22px; padding:38px 52px; text-align:center;
    box-shadow:0 20px 60px rgba(90,40,80,.4); }
  #win h1 { color:#c2557f; margin-bottom:10px; font-size:30px; letter-spacing:4px; }
  #win p { color:#8a5a78; margin-bottom:22px; }
  #win button { border:none; background:#c2557f; color:#fff; font-size:15px; letter-spacing:2px;
    padding:11px 34px; border-radius:999px; cursor:pointer; }
  #win button:hover { background:#a8436c; }
</style>
</head>
<body>
<div id="title" class="pill">回声碑谷<small>ECHO MONUMENTS</small></div>
<div id="gemBox" class="pill">✦ 光石 <span id="gemCount">0 / 2</span></div>
<div id="hint" class="pill">单击地面移动旅人 · 点击金色圆环旋转桥梁 · 集齐光石抵达旗帜</div>
<div id="toast"></div>
<div id="win"><div class="card">
  <h1>✦ 通关 ✦</h1>
  <p>你集齐了所有光石，抵达了回声之顶。</p>
  <button onclick="location.reload()">再玩一次</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   回声碑谷 —— 纪念碑谷风格 3D 解谜（单关）
   等距视角 / 双旋转桥机关 / 2 枚光石 / 旗帜终点
   ============================================================ */

// ---------- 地图数据 ----------
// 格子坐标 (x,z)。类型: start/platform/pier/bridgeCenter/end
const cells = new Map();
const K = (x,z) => x+','+z;
function addCell(x,z,type,extra){ cells.set(K(x,z), Object.assign({x,z,type,gem:false,collected:false}, extra||{})); }

// 桥: [U,D,L,R] 四根桥墩, angle 0=东西向(L-R通) 1=南北向(U-D通)
const bridges = [
  { cx:1.5, cz:2.5, center:[1,2], piers:[[1,1],[1,3],[0,2],[2,2]], angle:0, anim:null },
  { cx:3.5, cz:2.5, center:[3,2], piers:[[3,1],[3,3],[2,2],[4,2]], angle:0, anim:null },
];
const bridgePiers = b => b.angle===0 ? [b.piers[2],b.piers[3]] : [b.piers[0],b.piers[1]];

// 平台区
addCell(0,0,'start');
addCell(1,0,'platform'); addCell(2,0,'platform');
addCell(1,4,'platform'); addCell(2,4,'platform'); addCell(3,4,'platform');
addCell(4,4,'end');
addCell(1,5,'platform'); addCell(2,5,'platform');
addCell(0,5,'platform',{gem:true});            // 光石·侧路
// 桥墩
addCell(1,1,'pier'); addCell(0,2,'pier'); addCell(1,3,'pier'); addCell(2,2,'pier');
addCell(3,1,'pier',{gem:true});                // 光石·桥对岸(必经)
addCell(4,2,'pier'); addCell(3,3,'pier');
// 桥中心
addCell(1,2,'bridgeCenter',{bridge:0});
addCell(3,2,'bridgeCenter',{bridge:1});

const TOTAL_GEMS = 2;
const DECK_Y = 0.24;                 // 桥面行走高度
const walkY = (x,z) => cells.get(K(x,z)).type==='bridgeCenter' ? DECK_Y : 0;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

// ---------- 场景 ----------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xecc3da, 20, 48);

const D = 6;
let aspect = innerWidth/innerHeight;
const camera = new THREE.OrthographicCamera(-D*aspect, D*aspect, D, -D, 0.1, 120);
camera.position.set(2.5+9, 10.5, 3+9);
camera.lookAt(2.5, -0.3, 3);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// 灯光
scene.add(new THREE.AmbientLight(0xfff2f6, 0.62));
const sun = new THREE.DirectionalLight(0xffe8d0, 0.95);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;   sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 40;
sun.target.position.set(2.5, 0, 3);
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xc9a0ff, 0.3);
rim.position.set(-6, 4, -8);
scene.add(rim);

// 材质
const M = {
  plat:  new THREE.MeshStandardMaterial({ color:0xdf9aa8, roughness:.92 }),
  top:   new THREE.MeshStandardMaterial({ color:0xf3c3cd, roughness:.85 }),
  pier:  new THREE.MeshStandardMaterial({ color:0xc97e92, roughness:.9 }),
  deck:  new THREE.MeshStandardMaterial({ color:0xb083c2, roughness:.85 }),
  gold:  new THREE.MeshStandardMaterial({ color:0xf2c14e, metalness:.55, roughness:.35 }),
  white: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.6 }),
  red:   new THREE.MeshStandardMaterial({ color:0xd94f6a, roughness:.7 }),
  deep:  new THREE.MeshStandardMaterial({ color:0x8f5c8a, roughness:1 }),
};

const clickables = [];
const decoGroup = new THREE.Group();
scene.add(decoGroup);

// 深渊底
const deep = new THREE.Mesh(new THREE.PlaneGeometry(80,80), M.deep);
deep.rotation.x = -Math.PI/2; deep.position.set(2.5,-3,3);
scene.add(deep);

// 平台/桥墩生成
function addSlab(x, z, mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.96,0.55,0.96), mat);
  m.position.set(x+0.5, -0.275, z+0.5);
  m.castShadow = m.receiveShadow = true;
  m.userData.cellKey = K(x,z);
  decoGroup.add(m); clickables.push(m);
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.985,0.045,0.985), M.top);
  t.position.set(x+0.5, 0.022, z+0.5);
  t.receiveShadow = true;
  t.userData.cellKey = K(x,z);
  decoGroup.add(t); clickables.push(t);
}
cells.forEach(c => {
  if (c.type==='platform'||c.type==='start'||c.type==='end') addSlab(c.x, c.z, M.plat);
  if (c.type==='pier'){ addSlab(c.x, c.z, M.pier);
    const bearing = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.16,0.14,14), M.gold);
    bearing.position.set(c.x+0.5, 0.07, c.z+0.5);
    bearing.castShadow = true;
    decoGroup.add(bearing);
  }
  if (c.type==='bridgeCenter'){
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.1,0.9), M.pier);
    base.position.set(c.x+0.5, 0.05, c.z+0.5);
    base.castShadow = base.receiveShadow = true;
    decoGroup.add(base);
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,0.55,12), M.gold);
    axle.position.set(c.x+0.5, 0.275, c.z+0.5);
    axle.castShadow = true;
    decoGroup.add(axle);
  }
});

// 旋转桥
function addBridge(b, idx){
  const g = new THREE.Group();
  g.position.set(b.cx, 0, b.cz);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.12,0.72), M.deck);
  deck.position.y = DECK_Y-0.06;
  deck.castShadow = deck.receiveShadow = true;
  deck.userData.cellKey = K(b.center[0], b.center[1]);
  g.add(deck); clickables.push(deck);
  // 板端金帽
  [-1,1].forEach(s=>{
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.06,16), M.gold);
    cap.position.set(s*1.0, DECK_Y+0.03, 0);
    g.add(cap);
  });
  // 旋转手柄(金色圆环)
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.21,0.035,10,28), M.gold);
  ring.position.y = 0.72; ring.rotation.y = Math.PI/2;
  ring.userData.bridge = idx;
  g.add(ring); clickables.push(ring);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.28,8), M.gold);
  stem.position.y = 0.5;
  g.add(stem);
  scene.add(g);
  b.group = g; b.ring = ring;
}
bridges.forEach(addBridge);

// 光石
const gems = [];
cells.forEach(c => {
  if (!c.gem) return;
  const m = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.18),
    new THREE.MeshStandardMaterial({ color:0xffd54a, emissive:0x8a5a00, emissiveIntensity:.55, metalness:.3, roughness:.25 })
  );
  m.position.set(c.x+0.5, 0.55, c.z+0.5);
  m.castShadow = true;
  m.userData.cellKey = K(c.x,c.z);
  scene.add(m); clickables.push(m);
  gems.push({ mesh:m, cell:c, collected:false, phase:Math.random()*6 });
});

// 终点旗帜
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.0,8), M.gold);
pole.position.set(4.5, 0.5, 4.5); pole.castShadow = true;
const flag = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.26,0.02), M.red);
flag.position.set(4.72, 0.82, 4.5); flag.castShadow = true;
scene.add(pole, flag);
const endRing = new THREE.Mesh(new THREE.TorusGeometry(0.34,0.025,8,32),
  new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x999999, emissiveIntensity:.4 }));
endRing.rotation.x = -Math.PI/2; endRing.position.set(4.5,0.02,4.5);
scene.add(endRing);

// 起点光环
const startRing = new THREE.Mesh(new THREE.TorusGeometry(0.3,0.03,8,32),
  new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:.5 }));
startRing.rotation.x = -Math.PI/2; startRing.position.set(0.5,0.02,0.5);
scene.add(startRing);

// 装饰小柱
[[1.0,0.85,0.42],[2.15,0.15,0.3],[1.15,4.8,0.5],[2.85,4.2,0.34],[3.8,4.8,0.44],[1.85,5.2,0.36]].forEach(([dx,dz,h])=>{
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,h,10), M.pier);
  p.position.set(dx, h/2, dz); p.castShadow = true;
  decoGroup.add(p);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.09,10,10), M.gold);
  ball.position.set(dx, h+0.09, dz); ball.castShadow = true;
  decoGroup.add(ball);
});

// 漂浮远景几何
const floaters = [];
[[-2.5,3.5,-1.5,0.9,M.plat],[7.5,4.5,-1,0.7,M.deck],[-3,5.5,5.5,0.8,M.top],
 [8,3,6.5,0.6,M.deck],[0.5,6.5,8.5,0.75,M.plat],[5.5,7,8,0.5,M.top]].forEach(([x,y,z,s,mt])=>{
  const f = new THREE.Mesh(new THREE.OctahedronGeometry(s), mt);
  f.position.set(x,y,z);
  f.material = f.material.clone(); f.material.transparent = true; f.material.opacity = .45;
  scene.add(f);
  floaters.push({ m:f, y, sp:.3+Math.random()*.4, ph:Math.random()*6 });
});

// 旅人
const role = new THREE.Group();
const body = new THREE.Mesh(new THREE.ConeGeometry(0.15,0.42,16), M.white);
body.position.y = 0.21; body.castShadow = true;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.1,12,12), M.white);
head.position.y = 0.48; head.castShadow = true;
const crown = new THREE.Mesh(new THREE.ConeGeometry(0.065,0.14,8), M.gold);
crown.position.y = 0.62;
role.add(body, head, crown);
role.position.set(0.5, 0, 0.5);
scene.add(role);

// ---------- 寻路 (BFS, 桥按当前朝向连通) ----------
function neighbors(x,z){
  const cell = cells.get(K(x,z));
  if (!cell) return [];
  if (cell.type==='bridgeCenter')
    return bridgePiers(bridges[cell.bridge]).map(p=>({x:p[0],z:p[1]}));
  const res = [];
  for (const [dx,dz] of DIRS){
    const nc = cells.get(K(x+dx, z+dz));
    if (!nc) continue;
    if (nc.type==='bridgeCenter'){
      const conn = bridgePiers(bridges[nc.bridge]);
      if (conn.some(p=>p[0]===x && p[1]===z)) res.push({x:x+dx, z:z+dz});
    } else res.push({x:x+dx, z:z+dz});
  }
  return res;
}
function findPath(sx,sz,tx,tz){
  if (sx===tx && sz===tz) return [[sx,sz]];
  const prev = new Map(); prev.set(K(sx,sz), null);
  const q = [[sx,sz]];
  while (q.length){
    const [x,z] = q.shift();
    for (const n of neighbors(x,z)){
      const k = K(n.x,n.z);
      if (prev.has(k)) continue;
      prev.set(k, [x,z]);
      if (n.x===tx && n.z===tz){
        const path = [[tx,tz]]; let cur = [x,z];
        while (cur){ path.unshift(cur); cur = prev.get(K(cur[0],cur[1])); }
        return path;
      }
      q.push([n.x,n.z]);
    }
  }
  return null;
}

// ---------- 移动 / 收集 / 胜利 ----------
let roleCell = {x:0, z:0};
let moving = false, moveQueue = [];
let rotating = false;
let gemCount = 0;

function startMove(path){
  moveQueue = path.map(([x,z]) => new THREE.Vector3(x+0.5, walkY(x,z), z+0.5));
  moving = true;
}
function arriveCell(p){
  roleCell.x = Math.round(p.x-0.5); roleCell.z = Math.round(p.z-0.5);
  const c = cells.get(K(roleCell.x, roleCell.z));
  if (c && c.gem && !c.collected) collectGem(c);
}
function onArrive(){
  const c = cells.get(K(roleCell.x, roleCell.z));
  if (c && c.type==='end'){
    if (gemCount >= TOTAL_GEMS) document.getElementById('win').style.display = 'flex';
    else toast('旗帜沉睡中…还差 ' + (TOTAL_GEMS-gemCount) + ' 枚光石');
  }
}

// ---------- 光石收集 ----------
const collectAnims = [];
function collectGem(cell){
  cell.collected = true;
  const g = gems.find(g => g.cell===cell);
  if (g){ g.collected = true; collectAnims.push({ mesh:g.mesh, t:0 }); }
  gemCount++;
  document.getElementById('gemCount').textContent = gemCount + ' / ' + TOTAL_GEMS;
  toast('✦ 光石 +1');
}

// ---------- 桥旋转 ----------
function rotateBridge(b){
  if (rotating || moving) return;
  rotating = true;
  b.anim = { from:b.group.rotation.y, to:b.group.rotation.y - Math.PI/2, t:0 };
  b.targetAngle = (b.angle+1)%2;
  toast('机关转动…');
}

// ---------- 交互 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (rotating || moving) return;
  pointer.x = (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if (!hits.length) return;
  const o = hits[0].object;
  if (o.userData.bridge !== undefined){ rotateBridge(bridges[o.userData.bridge]); return; }
  const [tx,tz] = o.userData.cellKey.split(',').map(Number);
  const path = findPath(roleCell.x, roleCell.z, tx, tz);
  if (path && path.length>1) startMove(path);
});

// ---------- 提示 ----------
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  el.style.transform = 'translate(-50%,-50%) scale(1)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    el.style.opacity = 0;
    el.style.transform = 'translate(-50%,-50%) scale(.9)';
  }, 1300);
}

// ---------- 主循环 ----------
const clock = new THREE.Clock();
function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 光石: 旋转 + 浮动
  for (const g of gems){
    if (g.collected) continue;
    g.mesh.rotation.y += dt*1.6;
    g.mesh.position.y = 0.55 + Math.sin(t*2 + g.phase)*0.07;
  }
  // 收集动画
  for (let i=collectAnims.length-1; i>=0; i--){
    const a = collectAnims[i]; a.t += dt/0.45;
    const k = Math.min(a.t, 1);
    a.mesh.scale.setScalar(Math.max(0.001, 1-k));
    a.mesh.position.y += dt*1.6;
    a.mesh.rotation.y += dt*8;
    if (k>=1){ scene.remove(a.mesh); collectAnims.splice(i,1); }
  }
  // 桥旋转动画
  for (const b of bridges){
    if (!b.anim) continue;
    const a = b.anim; a.t += dt/0.5;
    b.group.rotation.y = a.from + (a.to-a.from)*easeInOut(Math.min(a.t,1));
    b.ring.rotation.x = t*2;
    if (a.t>=1){
      b.group.rotation.y = a.to;
      b.angle = b.targetAngle; b.anim = null; rotating = false;
      toast('桥梁已接通');
    }
  }
  // 旅人移动
  if (moving && moveQueue.length){
    const tgt = moveQueue[0];
    const dx = tgt.x-role.position.x, dz = tgt.z-role.position.z;
    const dist = Math.hypot(dx,dz);
    const step = 2.4*dt;
    if (dist <= step){
      role.position.x = tgt.x; role.position.z = tgt.z;
      arriveCell(moveQueue[0]);
      moveQueue.shift();
      if (!moveQueue.length){ moving = false; onArrive(); }
    } else {
      role.position.x += dx/dist*step;
      role.position.z += dz/dist*step;
      role.rotation.y = Math.atan2(dx,dz);
    }
  }
  // 高度平滑(桥面/地面过渡)
  const targetY = moving && moveQueue.length ? moveQueue[0].y : 0;
  role.position.y += (targetY - role.position.y) * Math.min(1, dt*10);
  if (moving) role.position.y += Math.abs(Math.sin(t*11))*0.03;

  // 旗帜 & 光环 & 漂浮体
  flag.rotation.y = Math.sin(t*3)*0.28;
  endRing.rotation.z = t*0.8;
  startRing.rotation.z = -t*0.5;
  for (const f of floaters){
    f.m.rotation.y += dt*f.sp;
    f.m.position.y = f.y + Math.sin(t*0.8 + f.ph)*0.35;
  }

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  aspect = innerWidth/innerHeight;
  camera.left = -D*aspect; camera.right = D*aspect;
  camera.top = D; camera.bottom = -D;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
