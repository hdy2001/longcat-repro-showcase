<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星尘旅人 · Claude Fable 5 风格</title>
<style>
  /* Fable 5 风格：文学性优先。衬线字体、长段落呼吸感、星空画布、缓慢的淡入淡出 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1000px 500px at 75% 15%, rgba(99,60,160,.14), transparent 60%),
      radial-gradient(800px 500px at 15% 80%, rgba(30,90,140,.12), transparent 60%),
      #05070f;
    color: #d8dcea;
    font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
    overflow: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(2,3,8,.75) 100%);
  }
  main {
    position: relative; z-index: 2; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .screen { max-width: 640px; width: 100%; text-align: center; }
  [hidden] { display: none !important; }

  /* ---------- 标题页 ---------- */
  #title-screen .kicker {
    font-size: 12px; letter-spacing: 8px; color: #6f7a9a;
    animation: fadein 2s ease .2s both;
  }
  #title-screen h1 {
    font-size: 56px; font-weight: 500; letter-spacing: 18px;
    margin: 26px 0 10px; text-indent: 18px;
    color: #e8ecf8;
    text-shadow: 0 0 40px rgba(125,180,255,.35);
    animation: fadein 2.4s ease .6s both;
  }
  #title-screen .sub {
    font-size: 14px; color: #8b96b8; letter-spacing: 3px; line-height: 2;
    animation: fadein 2.4s ease 1.2s both;
  }
  #startBtn { margin-top: 54px; animation: fadein 2s ease 1.8s both; }

  button {
    background: none; border: 1px solid #3a4566; border-radius: 999px;
    color: #b9c4e4; font-family: inherit; font-size: 14px; letter-spacing: 4px;
    padding: 12px 42px; cursor: pointer; transition: all .4s;
  }
  button:hover {
    border-color: #7d9bd6; color: #eef2ff;
    box-shadow: 0 0 24px rgba(125,155,214,.25);
  }

  /* ---------- 正文 ---------- */
  #story { display: flex; flex-direction: column; justify-content: center; min-height: 70vh; }
  #chapter {
    font-size: 12px; letter-spacing: 6px; color: #6f7a9a; margin-bottom: 30px;
    animation: fadein 1.2s ease both;
  }
  #text {
    font-size: 18px; line-height: 2.3; letter-spacing: 2px;
    color: #ccd4ea; text-align: left; min-height: 16em;
    white-space: pre-line;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  #text p { margin-bottom: 1.2em; }
  #caret { display: inline-block; width: 2px; background: #9db4e8; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #hint {
    font-size: 11px; letter-spacing: 4px; color: #4d5878;
    margin-top: 26px; animation: fadein 1s ease both;
  }
  #hint::after { content: '▾'; display: block; margin-top: 6px; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(4px); } }

  /* ---------- 抉择 ---------- */
  #choices { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .choice {
    width: 100%; text-align: center; line-height: 1.9;
    border-color: #2c3550; font-size: 15px; color: #aab6d8;
    animation: rise .8s ease both;
  }
  .choice:hover { border-color: #7d9bd6; }
  .choice:nth-child(2) { animation-delay: .15s; }
  .choice:nth-child(3) { animation-delay: .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  /* ---------- 结局 ---------- */
  #ending-box { margin-top: 40px; animation: fadein 2.5s ease both; }
  #ending-box .mark { color: #7d9bd6; letter-spacing: 10px; font-size: 13px; margin-bottom: 14px; }
  #ending-box .path {
    font-size: 11px; color: #5a6584; letter-spacing: 2px; line-height: 2.1;
    border-top: 1px solid #232c48; padding-top: 18px; margin-bottom: 30px;
  }

  @keyframes fadein { from { opacity: 0; } }
  .fade-swap { animation: fadein 1.1s ease both; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="vignette"></div>

<main>
  <!-- 标题页 -->
  <section id="title-screen" class="screen">
    <div class="kicker">一 段 宇 宙 童 话</div>
    <h1>星尘旅人</h1>
    <p class="sub">三个结局 · 全程约五分钟<br>关于信号、告别，与迷路的人</p>
    <button id="startBtn">启 程</button>
  </section>

  <!-- 故事页 -->
  <section id="story" class="screen" hidden>
    <div id="chapter"></div>
    <div id="text"></div>
    <div id="hint" hidden>点 击 继 续</div>
    <div id="choices"></div>
    <div id="ending-box" hidden>
      <div class="mark">✦ 结 局 ✦</div>
      <div class="path"></div>
      <button id="againBtn">再 走 一 次</button>
    </div>
  </section>
</main>

<script>
'use strict';
/*
 * Claude Fable 5 风格 · 文字冒险
 * 这一版的"工程"服务于文学：
 * - 剧本数据与引擎彻底分离（NODES），改故事不动逻辑；
 * - 打字机逐字渲染，点击可立即补全——阅读节奏交给读者；
 * - 星空画布三层视差 + 偶发流星，只作氛围，不抢文本；
 * - 记录漫游路径，结局时回放"你走过的路"，让选择被记住。
 */

/* ---------- 剧本 ---------- */

const NODES = {
  wake: {
    title: '第一章 · 苏醒',
    paras: [
      '冷冻舱的盖子滑开时，舱外的寒气先一步漫进来，像有人把一整片海倒进了你的肺里。',
      '你花了三秒钟想起自己是谁：陈拾，外号"拾荒者"，银河边缘最不走运的废料猎人。',
      '救生舱的灯牌只剩两格电。主机曦带着杂音汇报："主引擎离线，我们正漂流在一片坟场里。另外……我收到了一个信号。在重复。非常执着。"',
    ],
    choices: [
      { text: '「先修引擎。没有引擎的猎人，只是太空垃圾。」', to: 'repair' },
      { text: '「信号？说下去。什么样的信号？」', to: 'signal' },
    ],
  },

  signal: {
    title: '第二章 · 灯塔',
    paras: [
      '曦把信号投在舷窗上：一片废弃的空间站残骸，骨架般漂浮在暗红色的星云前，每隔四十秒闪一次光。',
      '"它的名字叫灯塔，"曦说，"三十年前是一艘科考船，全体船员……失踪了。导航AI还在广播，但回应它的，只有寂静。"',
      '你的引擎已经修不好了——曦没有直说，但它的沉默已经说明了一切。除了那个信号，你手里没有别的坐标。',
    ],
    choices: [
      { text: '「对接。去听听那个AI在喊什么。」', to: 'dock' },
    ],
  },

  repair: {
    title: '第二章 · 八小时',
    paras: [
      '你和曦修了八个小时。饿了就吃冷掉的合成膏，困了就听那个信号——四十秒，一次，从不迟到。',
      '第六个小时，曦忽然开口："按信号衰减的速度计算，它的电源撑不过这个星期。"',
      '引擎终于修好了，曦宣布。也就是说，你现在有两个选择，而剩下的时间，只够做其中一个。',
    ],
    choices: [
      { text: '「掉头。去灯塔。」', to: 'dock' },
      { text: '「回家。让信号留在身后。」', to: 'end2' },
    ],
  },

  dock: {
    title: '第三章 · 对话',
    paras: [
      '灯塔的舱门在你面前缓缓打开，像一只疲倦的眼睛睁开。',
      '导航核心室中央，一颗拳头大的芯片悬浮在淡蓝色的光里。它"醒来"的瞬间，整座空间站的灯同时亮起——你几乎要落泪，你已经很久没见过这么明亮的灯了。',
      '"旅人，"AI的声音温和得像旧磁带，"我守在这里三十年，把灯的光借给迷路的人。如今我的储能只剩最后一格。我的遗愿是：请把我的核心，带给下一个迷路者。"',
    ],
    choices: [
      { text: '「我答应你。把它装进曦的核心舱。」', to: 'end1' },
      { text: '「你的电……也许可以借我一用。」', to: 'end3' },
      { text: '关掉它。死去的东西，不该吊着一口气。', to: 'end2' },
    ],
  },

  end1: {
    title: '结局 · 新灯塔',
    ending: true,
    paras: [
      '曦的核心舱里，两颗芯片并肩发着微光。',
      '"导航同步完成，"曦说，"从现在起，我们每到一个地方，就把灯塔的广播，转接给下一个迷路的人。"',
      '很多年以后，银河边缘流传着一个传说：在最暗的星云背后，有一盏双芯的灯，专等那些被星星弄丢的人。',
    ],
  },

  end2: {
    title: '结局 · 熄灭的信号',
    ending: true,
    paras: [
      '你跃迁出去很远很远之后，才敢回头看。',
      '信号已经不在了。曦说，它的灯在你离开后的第四十分钟准时熄灭——像一个守约守得太久的人，终于承认不会有人来了。',
      '你在航行日志的那一页上标了红。从那以后，你经过每一片坟场，都会绕着走。',
    ],
  },

  end3: {
    title: '结局 · 星海回声',
    ending: true,
    paras: [
      '你切断了导航核心的电源，把最后一格电转给了引擎。',
      'AI安静地暗下去，没有责备。它只说了最后一句话："替我看看，星星现在长什么样。"',
      '引擎点火的那一刻，广播里传来很轻的、四十秒一次的余音。你没有回头。很多年后，每当你在一个陌生的星系迷路，你都会想起那个频率——像有人在很远的地方，替你留着一盏灯。',
    ],
  },
};

/* ---------- 星空画布（三层视差 + 流星） ---------- */

const sc = document.getElementById('stars').getContext('2d');
let stars = [], meteors = [], nextMeteor = 4000;

function resize() {
  sc.canvas.width = innerWidth;
  sc.canvas.height = innerHeight;
  stars = Array.from({ length: 240 }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: Math.random() * 1.3 + 0.3,
    depth: Math.random() * 0.8 + 0.2,   // 视差深度：决定漂移速度与亮度
    tw: Math.random() * Math.PI * 2,
  }));
}
addEventListener('resize', resize);
resize();

let tPrev = 0;
function sky(t) {
  const dt = Math.min(50, t - tPrev); tPrev = t;
  sc.clearRect(0, 0, sc.canvas.width, sc.canvas.height);
  for (const s of stars) {
    s.x -= s.depth * dt * 0.004;
    if (s.x < -2) { s.x = sc.canvas.width + 2; s.y = Math.random() * sc.canvas.height; }
    const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 0.0006 * s.depth + s.tw));
    sc.globalAlpha = a * (0.3 + s.depth * 0.7);
    sc.fillStyle = '#cdd8f2';
    sc.beginPath();
    sc.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sc.fill();
  }
  sc.globalAlpha = 1;
  // 偶发流星：短暂、明亮、转瞬即逝
  nextMeteor -= dt;
  if (nextMeteor <= 0) {
    meteors.push({ x: Math.random() * innerWidth * 0.7, y: Math.random() * innerHeight * 0.3,
                   vx: 0.55, vy: 0.3, life: 1 });
    nextMeteor = 6000 + Math.random() * 9000;
  }
  meteors = meteors.filter((m) => m.life > 0);
  for (const m of meteors) {
    m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt / 900;
    const g = sc.createLinearGradient(m.x, m.y, m.x - 90 * m.vx, m.y - 90 * m.vy);
    g.addColorStop(0, `rgba(220,230,255,${0.8 * m.life})`);
    g.addColorStop(1, 'rgba(220,230,255,0)');
    sc.strokeStyle = g;
    sc.lineWidth = 1.4;
    sc.beginPath();
    sc.moveTo(m.x, m.y);
    sc.lineTo(m.x - 90 * m.vx, m.y - 90 * m.vy);
    sc.stroke();
  }
  requestAnimationFrame(sky);
}
requestAnimationFrame(sky);

/* ---------- 剧本引擎 ---------- */

const $ = (id) => document.getElementById(id);
const storyEl = $('story'), chapterEl = $('chapter'), textEl = $('text'),
      choicesEl = $('choices'), hintEl = $('hint'), endingBox = $('ending-box');

const TYPE_MS = 26;
let path = [];            // 走过的章节名
let fullText = '', shown = 0, typeTimer = null, onDone = null, typing = false;

function playNode(id) {
  const node = NODES[id];
  path.push(node.title);
  choicesEl.innerHTML = '';
  endingBox.hidden = true;
  chapterEl.textContent = `— ${node.title} —`;
  chapterEl.classList.remove('fade-swap');
  void chapterEl.offsetWidth;               // 重启动画
  chapterEl.classList.add('fade-swap');
  fullText = node.paras.join('\n\n');
  shown = 0;
  typing = true;
  onDone = node.ending ? () => showEnding(node) : () => showChoices(node.choices);
  textEl.innerHTML = '<span id="caret"></span>';
  hintEl.hidden = true;
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    shown++;
    textEl.textContent = fullText.slice(0, shown);
    if (shown % 3 === 0) { textEl.innerHTML += ''; }
    if (shown >= fullText.length) finishTyping();
  }, TYPE_MS);
}

function finishTyping() {
  clearInterval(typeTimer);
  typing = false;
  textEl.textContent = fullText;
  if (onDone) { const f = onDone; onDone = null; f(); }
}

/* 点击推进：先补全当前段落，再进入下一段 */
function advance() {
  if (typing) finishTyping();
}

storyEl.addEventListener('click', (e) => {
  if (e.target.closest('button')) return;   // 按钮有自己的行为
  advance();
});

function showChoices(choices) {
  hintEl.hidden = true;
  choicesEl.innerHTML = '';
  choices.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = c.text;
    b.addEventListener('click', () => {
      choicesEl.innerHTML = '';
      playNode(c.to);
    });
    choicesEl.appendChild(b);
  });
}

function showEnding(node) {
  hintEl.hidden = true;
  choicesEl.innerHTML = '';
  endingBox.hidden = false;
  endingBox.querySelector('.mark').textContent = `✦ ${node.title} ✦`;
  endingBox.querySelector('.path').innerHTML =
    '你走过的路<br>' + path.join('<br>↓<br>');
}

/* ---------- 开场 ---------- */

function begin() {
  path = [];
  $('title-screen').hidden = true;
  storyEl.hidden = false;
  playNode('wake');
}

$('startBtn').addEventListener('click', begin);
$('againBtn').addEventListener('click', begin);
</script>
</body>
</html>
