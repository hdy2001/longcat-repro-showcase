<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>应县木塔 · 构件级数字拆解</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, #1c130b 0%, #0d0906 45%, #050302 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e8dcc8;
  }
  canvas { display: block; }
  #brand {
    position: fixed; top: 26px; left: 30px; z-index: 10; pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  #brand .badge {
    display: inline-block; padding: 4px 12px; font-size: 12px; letter-spacing: 4px;
    color: #f0c890; border: 1px solid rgba(217,138,61,0.55); border-radius: 3px;
    background: rgba(60,32,12,0.45); backdrop-filter: blur(4px); margin-bottom: 12px;
  }
  #brand h1 {
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 34px; font-weight: 700; letter-spacing: 6px; color: #f4e6c8;
  }
  #brand h1 small { display: block; font-size: 13px; letter-spacing: 3px; color: #b39a72; margin-top: 8px; font-weight: 400; }
  #brand .sub { margin-top: 12px; font-size: 12px; letter-spacing: 2px; color: #9c8663; }
  #toolbar { position: fixed; top: 28px; right: 28px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 420px; }
  #toolbar button {
    padding: 8px 14px; font-size: 12px; letter-spacing: 2px; cursor: pointer;
    color: #e0c9a0; background: rgba(30,20,11,0.72); border: 1px solid rgba(217,138,61,0.4);
    border-radius: 3px; backdrop-filter: blur(4px); transition: all .18s;
    font-family: inherit;
  }
  #toolbar button:hover:not(:disabled) { background: rgba(120,66,24,0.75); border-color: #d98a3d; color: #ffe2b8; }
  #toolbar button.on { background: rgba(150,80,28,0.85); border-color: #e8a34f; color: #ffe9c4; }
  #toolbar button:disabled { opacity: 0.35; cursor: default; }
  #info {
    position: fixed; left: 30px; bottom: 30px; z-index: 10; max-width: 380px;
    padding: 16px 18px 14px; background: rgba(16,11,7,0.78); border-left: 3px solid #d98a3d;
    border-radius: 0 4px 4px 0; backdrop-filter: blur(6px);
  }
  #info .tag { font-size: 10px; letter-spacing: 3px; color: #9c8663; margin-bottom: 6px; }
  #iid { font-size: 13px; letter-spacing: 2px; color: #d8b25e; font-family: "SF Mono", Consolas, monospace; }
  #iname { font-family: "Songti SC", "Noto Serif SC", serif; font-size: 21px; letter-spacing: 2px; color: #f4e6c8; margin: 5px 0 7px; }
  #idesc { font-size: 12px; line-height: 1.75; color: #b8a480; }
  #foot {
    position: fixed; right: 28px; bottom: 26px; z-index: 10; text-align: right;
    font-size: 11px; letter-spacing: 1.5px; color: #77664a; pointer-events: none; line-height: 1.9;
  }
  #err {
    display: none; position: fixed; inset: 0; z-index: 99; text-align: center;
    padding-top: 40vh; background: #0a0705; color: #d98a3d; font-size: 14px; letter-spacing: 2px;
  }
  @media (max-width: 720px) {
    #brand h1 { font-size: 24px; }
    #foot { display: none; }
    #info { max-width: 70vw; }
  }
</style>
</head>
<body>
<div id="brand">
  <div class="badge">古建数字图谱</div>
  <h1>应县木塔 · 亲手拆解<small>佛宫寺释迦塔 ｜ 辽 · 清宁二年（1056）</small></h1>
  <div class="sub">八角五层六重檐 · 构件级模型 ｜ 明五暗四 · 副阶周匝 · 双杪单昂</div>
</div>
<div id="toolbar">
  <button id="bExplode">聚合复原</button>
  <button id="bIso" disabled>隔离选中</button>
  <button id="bHide" disabled>隐藏选中</button>
  <button id="bAll">显示全部</button>
  <button id="bReset">复位视角</button>
</div>
<div id="info">
  <div class="tag">构 件</div>
  <div id="iid">— —</div>
  <div id="iname">点击塔身任意构件</div>
  <div id="idesc">拖拽旋转 · 滚轮缩放 · 右键平移<br>点击选中构件（红色高亮）· 双击隔离 · Esc 取消</div>
</div>
<div id="foot">应县木塔（佛宫寺释迦塔）· 塔高 67.31 m<br>世界现存最古老最高的木构塔式建筑 · 本模型按构件级拆解演示</div>
<div id="err">当前浏览器不支持 WebGL，无法展示 3D 模型。</div>
<!-- __SCRIPTS__ -->
</body>
</html>
