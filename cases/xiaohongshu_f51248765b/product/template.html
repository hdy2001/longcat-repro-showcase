<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应县木塔 · 3D 构件拆解</title>
<style>
:root{
  --gold:#d9a45b;
  --gold-dim:rgba(217,164,91,.45);
  --ink:#f3e9d7;
  --dim:#9a8b74;
  --red:#c8442c;
  --card:rgba(14,10,7,.78);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050403;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink)}
#scene{position:fixed;inset:0}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.58) 100%)}

/* ---------- 标题区（参考图风格） ---------- */
#ui-title{position:fixed;top:26px;left:30px;z-index:5;pointer-events:none}
.badge{display:inline-block;font-size:12px;letter-spacing:.35em;text-indent:.35em;color:var(--gold);
  border:1px solid var(--gold-dim);padding:6px 13px;border-radius:3px;margin-bottom:14px;
  background:linear-gradient(160deg,#5a2415,#7a3018);text-shadow:0 1px 2px rgba(0,0,0,.6)}
#ui-title h1{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  font-size:52px;font-weight:700;letter-spacing:.12em;color:#f5ecda;line-height:1.05;
  text-shadow:0 2px 18px rgba(0,0,0,.85)}
.divider{width:64px;height:3px;border-radius:2px;margin:12px 0 10px;
  background:linear-gradient(90deg,var(--red),rgba(200,68,44,0))}
.sub{font-size:13px;color:var(--gold);letter-spacing:.14em}
.sub2{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-top:5px}

/* ---------- 右侧面板 ---------- */
#sideCol{position:fixed;top:26px;right:24px;width:302px;z-index:5;display:flex;flex-direction:column;
  gap:12px;max-height:calc(100% - 110px);overflow-y:auto;padding:2px;scrollbar-width:thin;
  scrollbar-color:rgba(217,164,91,.35) transparent}
#sideCol::-webkit-scrollbar{width:4px}
#sideCol::-webkit-scrollbar-thumb{background:rgba(217,164,91,.3);border-radius:2px}
#panel,#infoCard{background:var(--card);border:1px solid rgba(217,164,91,.28);border-radius:8px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 16px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
.p-title{font-size:12px;color:var(--gold);letter-spacing:.3em;margin-bottom:10px}
.p-note{letter-spacing:.03em;color:var(--dim);font-size:10px;margin-left:8px}
.slider-row{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.lbl{font-size:12px;color:var(--ink);white-space:nowrap}
.val{font-size:12px;color:var(--gold);width:40px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--gold);height:4px;cursor:pointer}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.btn{flex:1;background:rgba(38,26,15,.85);border:1px solid rgba(217,164,91,.4);color:#e8c07a;
  font-size:12px;letter-spacing:.06em;padding:7px 6px;border-radius:4px;cursor:pointer;transition:all .18s}
.btn:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(217,164,91,.25);color:#f6ddb0}
.btn.warn{border-color:rgba(214,90,60,.55);color:#e89a7a}
.btn.warn:hover{border-color:#d65a3c;box-shadow:0 0 12px rgba(214,90,60,.3);color:#f4b29a}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);margin:2px 0 4px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--gold);cursor:pointer}
.lg-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:5px;cursor:pointer;
  border:1px solid transparent;transition:all .15s}
.lg-row:hover{background:rgba(217,164,91,.08);border-color:rgba(217,164,91,.2)}
.lg-row.off{opacity:.35}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
.lg-name{font-size:13px;flex:1;letter-spacing:.05em}
.lg-count{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.eye{flex:none;background:none;border:none;color:var(--gold);font-size:14px;cursor:pointer;
  padding:2px 4px;line-height:1;opacity:.9}
.eye:hover{color:#f6ddb0}

/* ---------- 构件信息卡 ---------- */
#infoCard{border-color:rgba(224,120,80,.5)}
#infoCard.hidden{display:none}
.ic-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ic-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:#ff5a3a;
  letter-spacing:.12em;text-shadow:0 0 12px rgba(255,60,30,.5)}
.x{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
.x:hover{color:var(--ink)}
.ic-name{font-family:"Songti SC","Noto Serif SC","SimSun",serif;font-size:22px;color:#f5ecda;
  letter-spacing:.1em;margin-bottom:4px}
.ic-sub{font-size:11px;color:var(--gold);letter-spacing:.15em;margin-bottom:8px}
.ic-desc{font-size:12px;line-height:1.8;color:#cbbfa9;margin-bottom:12px}

/* ---------- 底部提示 ---------- */
#hint{position:fixed;left:30px;bottom:22px;z-index:5;font-size:11.5px;color:var(--dim);
  letter-spacing:.12em;pointer-events:none;text-shadow:0 1px 4px #000}

@media (max-width:820px){
  #ui-title{top:16px;left:18px}
  #ui-title h1{font-size:30px}
  .sub{font-size:11px}.sub2{font-size:10px}
  #sideCol{width:248px;top:14px;right:14px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>

<div id="ui-title">
  <div class="badge">古建数字图谱</div>
  <h1>应县木塔</h1>
  <div class="divider"></div>
  <div class="sub">佛宫寺释迦塔 · 辽 · 清宁二年（1056）</div>
  <div class="sub2">构件级数字拆解 · 五层六檐 · 67.31 米 · 纯木构</div>
</div>

<div id="sideCol">
  <div id="panel">
    <div class="p-title">拆解控制</div>
    <div class="slider-row">
      <span class="lbl">爆炸分解</span>
      <input id="explode" type="range" min="0" max="100" value="0" step="1">
      <span id="explodeVal" class="val">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnReset" class="btn">复位视角</button>

    <label class="chk"><input type="checkbox" id="autorot" checked><span>自动旋转</span></label>
    <div class="p-title" style="margin-top:12px">构件图例<span class="p-note">点击行闪烁定位 · ◉ 切换显隐</span></div>
    <div id="legend"></div>
  </div>

  <div id="infoCard" class="hidden">
    <div class="ic-head"><span id="icId" class="ic-id">—</span><button id="btnClose" class="x" title="关闭">×</button></div>
    <div id="icName" class="ic-name">—</div>
    <div id="icSub" class="ic-sub">—</div>
    <div id="icDesc" class="ic-desc">—</div>
    <div class="btn-row">
      <button id="btnHide" class="btn">隐藏此构件</button>
      <button id="btnIso" class="btn warn">隔离观察</button>
    </div>
  </div>
</div>

<div id="hint">左键拖动 旋转 · 滚轮 缩放 · 右键拖动 平移 · 点击构件 查看详情 · Esc 取消选中</div>

<script>
(function(){
'use strict';

/* ================= 渲染器 / 场景 ================= */
var host = document.getElementById('scene');
var renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
host.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050403);
scene.fog = new THREE.FogExp2(0x070503, 0.0072);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 600);
var CAM_HOME = new THREE.Vector3(56, 40, 56);
var TGT_HOME = new THREE.Vector3(0, 25, 0);
camera.position.copy(CAM_HOME);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 240;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;

/* ================= 灯光（戏剧性暖光） ================= */
scene.add(new THREE.AmbientLight(0x241609, 0.6));
scene.add(new THREE.HemisphereLight(0x3a2817, 0x090605, 0.55));

var key = new THREE.SpotLight(0xffb066, 1.7, 0, 0.5, 0.75, 1);
key.position.set(40, 66, 26);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 15;
key.shadow.camera.far = 170;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.03;
key.target.position.set(0, 18, 0);
scene.add(key, key.target);

var rim = new THREE.DirectionalLight(0xff8a3d, 0.5);
rim.position.set(-42, 32, -38);
scene.add(rim);

[6.2, 15.4, 24.2, 33.0, 41.8, 50.4].forEach(function(y){
  var p = new THREE.PointLight(0xff9a4d, 0.5, 26, 2);
  p.position.set(0, y, 0);
  scene.add(p);
});

/* ================= 程序化贴图 ================= */
function woodTexture(base, dark, light){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,256,256);
  var i, x0;
  for(i=0;i<260;i++){
    x0 = Math.random()*256;
    g.strokeStyle = Math.random()<0.55 ? dark : light;
    g.globalAlpha = 0.03 + Math.random()*0.09;
    g.lineWidth = 0.6 + Math.random()*2.4;
    g.beginPath();
    g.moveTo(x0, -8);
    for(var y=0; y<=256; y+=16){
      g.lineTo(x0 + Math.sin(y*0.045 + i*1.7)*3 + (Math.random()-0.5)*2.5, y);
    }
    g.stroke();
  }
  for(i=0;i<5;i++){
    var x=Math.random()*256, yy=Math.random()*256;
    g.globalAlpha = 0.16; g.strokeStyle = dark;
    for(var r=2;r<9;r+=2.2){
      g.beginPath(); g.ellipse(x,yy,r*0.7,r*1.7,0.35,0,Math.PI*2); g.stroke();
    }
  }
  g.globalAlpha = 1;
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}

function roofTexture(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var g = c.getContext('2d');
  g.fillStyle = '#413b33'; g.fillRect(0,0,256,256);
  var x, y;
  for(x=0;x<256;x+=10){
    g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x,0,2,256);
    g.fillStyle = 'rgba(255,235,200,0.06)'; g.fillRect(x+4,0,2,256);
  }
  for(y=0;y<256;y+=14){
    g.fillStyle = 'rgba(0,0,0,0.20)'; g.fillRect(0,y,256,2);
  }
  for(var i=0;i<900;i++){
    g.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,0.10)' : 'rgba(255,230,190,0.05)';
    g.fillRect(Math.random()*256, Math.random()*256, 1.6, 1.6);
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}

function stoneTexture(){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var g = c.getContext('2d');
  g.fillStyle = '#5c554a'; g.fillRect(0,0,256,256);
  for(var i=0;i<2600;i++){
    g.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,0.13)' : 'rgba(230,210,180,0.07)';
    g.fillRect(Math.random()*256, Math.random()*256, 1.4, 1.4);
  }
  for(i=0;i<26;i++){
    g.strokeStyle = 'rgba(0,0,0,0.08)';
    g.globalAlpha = 0.25; g.lineWidth = 0.8 + Math.random()*1.4;
    var x0=Math.random()*256;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0+(Math.random()-0.5)*22,256); g.stroke();
  }
  g.globalAlpha = 1;
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

function radialTexture(stops){
  var c = document.createElement('canvas'); c.width = c.height = 256;
  var g = c.getContext('2d');
  var gr = g.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(function(s){ gr.addColorStop(s[0], s[1]); });
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

function dotTexture(){
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var g = c.getContext('2d');
  var gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.35,'rgba(255,255,255,0.45)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

/* ================= 材质 ================= */
var MAT = {
  col:   new THREE.MeshStandardMaterial({ map:woodTexture('#6f4526','#3f2410','#9a6a3e'), roughness:0.76 }),
  beam:  new THREE.MeshStandardMaterial({ map:woodTexture('#7d5028','#4a2c12','#a57440'), roughness:0.72 }),
  dou:   new THREE.MeshStandardMaterial({ map:woodTexture('#8a5a2e','#54341a','#b07f46'), roughness:0.70 }),
  roof:  new THREE.MeshStandardMaterial({ map:roofTexture(), roughness:0.88, metalness:0.05, side:THREE.DoubleSide }),
  stone: new THREE.MeshStandardMaterial({ map:stoneTexture(), roughness:0.95 }),
  metal: new THREE.MeshStandardMaterial({ color:0x7a5a30, metalness:0.9, roughness:0.38 }),
  chain: new THREE.MeshStandardMaterial({ color:0x453a2a, metalness:0.85, roughness:0.5 })
};

/* ================= 几何工具 ================= */
function pushBox(out, w,h,d, x,y,z, rx,ry,rz){
  var g = new THREE.BoxGeometry(w,h,d);
  var m = new THREE.Matrix4().compose(
    new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0, ry||0, rz||0)),
    new THREE.Vector3(1,1,1));
  g.applyMatrix4(m);
  out.push(g);
}
function pushCyl(out, rt, rb, h, seg, x,y,z, rx,ry,rz, open){
  var g = new THREE.CylinderGeometry(rt, rb, h, seg||10, 1, !!open);
  var m = new THREE.Matrix4().compose(
    new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0, ry||0, rz||0)),
    new THREE.Vector3(1,1,1));
  g.applyMatrix4(m);
  out.push(g);
}
function pushSphere(out, r, x,y,z){
  var g = new THREE.SphereGeometry(r, 12, 10);
  g.applyMatrix4(new THREE.Matrix4().makeTranslation(x,y,z));
  out.push(g);
}
function pushTube(out, x1,y1,z1, x2,y2,z2, r, seg){
  var a = new THREE.Vector3(x1,y1,z1), b = new THREE.Vector3(x2,y2,z2);
  var dir = new THREE.Vector3().subVectors(b,a);
  var len = dir.length();
  var g = new THREE.CylinderGeometry(r, r, len, seg||6, 1, false);
  g.translate(0, len/2, 0);
  var q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  g.applyMatrix4(new THREE.Matrix4().compose(a, q, new THREE.Vector3(1,1,1)));
  out.push(g);
}
function mergeGeometries(list){
  var pos=[], norm=[], uv=[], idx=[], off=0, i;
  var v = new THREE.Vector3();
  var nm = new THREE.Matrix3();
  for(i=0;i<list.length;i++){
    var g = list[i];
    var p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    if(g.matrix && !g.matrix.equals(new THREE.Matrix4())) nm.getNormalMatrix(g.matrix); else nm.identity();
    for(var j=0;j<p.count;j++){
      v.fromBufferAttribute(p,j);
      if(g.matrix) v.applyMatrix4(g.matrix);
      pos.push(v.x, v.y, v.z);
      v.fromBufferAttribute(n,j);
      v.applyMatrix3(nm).normalize();
      norm.push(v.x, v.y, v.z);
      uv.push(u.getX(j), u.getY(j));
    }
    var index = g.index;
    for(j=0;j<index.count;j++) idx.push(index.getX(j)+off);
    off += p.count;
  }
  var out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',   new THREE.Float32BufferAttribute(norm,3));
  out.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  out.setIndex(idx);
  return out;
}
/* ================= 塔身参数（六檐） ================= */
var LEVELS = [
  { base:2.2,  top:9.0,  rOut:12.8, rIn:9.6, eaveY:10.1, eaveR:15.6, ridgeY:12.3, ridgeR:11.9, up:0.55 },
  { base:12.3, top:17.1, rOut:11.3, rIn:8.7, eaveY:18.3, eaveR:13.9, ridgeY:20.1, ridgeR:10.5, up:0.48 },
  { base:20.1, top:24.9, rOut:10.3, rIn:8.0, eaveY:26.1, eaveR:12.7, ridgeY:27.9, ridgeR:9.6,  up:0.44 },
  { base:27.9, top:32.7, rOut:9.4,  rIn:7.3, eaveY:33.9, eaveR:11.5, ridgeY:35.7, ridgeR:8.7,  up:0.40 },
  { base:35.7, top:40.5, rOut:8.6,  rIn:6.7, eaveY:41.7, eaveR:10.5, ridgeY:43.5, ridgeR:7.9,  up:0.36 },
  { base:43.5, top:48.3, rOut:7.9,  rIn:6.1, eaveY:49.5, eaveR:9.5,  ridgeY:51.3, ridgeR:7.1,  up:0.32 }
];
var CN_NUM = '一二三四五';
function levelLabel(i){ return i===0 ? '一层 · 副阶' : ('第' + CN_NUM[i-1] + '层'); }

/* ================= 构件装配 ================= */
var comps = [];
var pickables = [];

var TYPE_NAME = { ZW:'柱网', LF:'梁枋', DG:'斗拱层（铺作）', YW:'屋檐段', TJ:'台基', TS:'塔刹' };
var TYPE_ORDER = { TJ:0, ZW:1, LF:2, DG:3, YW:4, TS:5 };
var LEGEND = [
  { type:'YW', name:'屋檐段', color:'#8f8578', count:6 },
  { type:'DG', name:'斗拱层', color:'#c08038', count:6 },
  { type:'LF', name:'梁枋',   color:'#d9a45b', count:6 },
  { type:'ZW', name:'柱网',   color:'#a86a3a', count:6 },
  { type:'TS', name:'塔刹',   color:'#e0bc60', count:1 },
  { type:'TJ', name:'台基',   color:'#7d7468', count:1 }
];

function compDesc(def){
  var L = levelLabel(def.levelIdx);
  switch(def.type){
    case 'ZW': return L + '柱网：外檐柱 8 根、内槽柱 8 根，侧脚生起，承托其上全部荷载并传于台基。';
    case 'LF': return L + '梁枋层：阑额环联柱头，径向乳栿沟通内外槽，承托上部斗拱层。';
    case 'DG': return L + '斗拱层：坐斗、华拱、下昂出跳两跳，承托深远檐口，层层悬挑、耗能减震。';
    case 'YW': return L + '屋檐段：青瓦屋面、檐角起翘，遮护木构免受风雨侵蚀。';
    case 'TJ': return '双层石构台基：承托塔身、隔潮抗震，正面设踏跺。';
    case 'TS': return '塔刹：刹杆贯七重相轮，上承宝珠，八条铁链系于顶层檐角，收束塔顶轮廓。';
  }
  return '';
}

function addComp(id, type, levelIdx, parts){
  var def = { id:id, type:type, levelIdx:levelIdx, flashUntil:0 };
  var group = new THREE.Group();
  var mats = [];
  parts.forEach(function(p){
    var mat = p.mat.clone();
    var mesh = new THREE.Mesh(p.geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.comp = def;
    group.add(mesh);
    mats.push(mat);
    pickables.push(mesh);
  });
  def.group = group;
  def.mats = mats;
  def.phase = levelIdx*1.37 + TYPE_ORDER[type]*0.91;
  scene.add(group);
  comps.push(def);
  return def;
}

/* ---- 台基 ---- */
function buildBase(){
  var out = [];
  pushCyl(out, 16.6, 16.95, 1.1, 8, 0, 0.52, 0, 0, Math.PI/8, 0, false);
  pushCyl(out, 15.3, 15.55, 1.15, 8, 0, 1.65, 0, 0, Math.PI/8, 0, false);
  var a = Math.PI/4, ca = Math.cos(a), sa = Math.sin(a);
  pushBox(out, 6.4, 0.733, 3.0, ca*16.0, 1.833, sa*16.0, 0, Math.PI/4, 0);
  pushBox(out, 6.4, 0.733, 3.0, ca*16.8, 1.100, sa*16.8, 0, Math.PI/4, 0);
  pushBox(out, 6.4, 0.733, 3.0, ca*17.6, 0.367, sa*17.6, 0, Math.PI/4, 0);
  for(var k=0;k<8;k++){
    var aa = (22.5+45*k)*Math.PI/180;
    pushCyl(out, 0.37, 0.41, 0.26, 10, 12.8*Math.cos(aa), 2.33, 12.8*Math.sin(aa));
    pushCyl(out, 0.34, 0.38, 0.26, 10,  9.6*Math.cos(aa), 2.33,  9.6*Math.sin(aa));
  }
  return mergeGeometries(out);
}

/* ---- 柱网 ---- */
function buildColumns(i){
  var L = LEVELS[i], out = [];
  var y0 = L.base + 0.24, colH = L.top - y0 - 0.15;
  for(var k=0;k<8;k++){
    var a = (22.5+45*k)*Math.PI/180;
    pushCyl(out, 0.24, 0.28, colH, 10, L.rOut*Math.cos(a), y0+colH/2, L.rOut*Math.sin(a));
    pushCyl(out, 0.21, 0.25, colH, 10, L.rIn *Math.cos(a), y0+colH/2, L.rIn *Math.sin(a));
  }
  return mergeGeometries(out);
}

/* ---- 梁枋 ---- */
function buildBeams(i){
  var L = LEVELS[i], out = [];
  var chordO = 2*L.rOut*Math.sin(Math.PI/8) + 0.35;
  var chordI = 2*L.rIn *Math.sin(Math.PI/8) + 0.35;
  var y = L.top - 0.2;
  for(var k=0;k<8;k++){
    var a1 = (22.5+45*k)*Math.PI/180, a2 = (22.5+45*(k+1))*Math.PI/180;
    var am = (a1+a2)/2;
    pushBox(out, chordO, 0.30, 0.28, Math.cos(am)*L.rOut, y, Math.sin(am)*L.rOut, 0, -(am+Math.PI/2), 0);
    pushBox(out, chordI, 0.22, 0.20, Math.cos(am)*L.rIn,  y, Math.sin(am)*L.rIn,  0, -(am+Math.PI/2), 0);
    pushBox(out, (L.rOut-L.rIn)+0.5, 0.26, 0.22, Math.cos(a1)*(L.rOut+L.rIn)/2, y-0.02, Math.sin(a1)*(L.rOut+L.rIn)/2, 0, -a1, 0);
  }
  return mergeGeometries(out);
}

/* ---- 斗拱 ---- */
function bracketBoxes(s){
  var L = [];
  pushBox(L, .55*s,.30*s,.55*s,  0,      .15*s, 0);            // 坐斗
  pushBox(L, .22*s,.20*s,1.10*s, 0,      .38*s, 0);            // 华拱（纵向）
  pushBox(L, .24*s,.18*s,.24*s,  0,      .50*s, .44*s);        // 交互斗
  pushBox(L, .20*s,.17*s,1.35*s,  0,      .60*s, .14*s, -.46,0,0); // 下昂（斜）
  pushBox(L, .18*s,.15*s,.30*s,  0,      .70*s, .72*s);        // 昂嘴
  pushBox(L, .78*s,.20*s,.24*s,  0,      .68*s, .42*s);        // 令拱
  pushBox(L, .18*s,.14*s,.18*s, -.32*s,  .80*s, .42*s);        // 散斗
  pushBox(L, .18*s,.14*s,.18*s,  .32*s,  .80*s, .42*s);
  pushBox(L, .20*s,.18*s,.95*s,  0,      .86*s, .08*s);        // 瓜子拱
  pushBox(L, .92*s,.15*s,.20*s,  0,      .98*s, .30*s);        // 罗汉枋
  pushBox(L, 1.06*s,.17*s,.22*s, 0,     1.09*s, .55*s);        // 橑檐枋
  return L;
}
function buildDougong(i){
  var L = LEVELS[i], out = [], k, a;
  var outer = bracketBoxes(1.06);
  for(k=0;k<16;k++){
    a = k*22.5*Math.PI/180;
    var ca = Math.cos(a), sa = Math.sin(a);
    for(var j=0;j<outer.length;j++) out.push(transformGeo(outer[j], L.rOut*ca, L.top-0.05, L.rOut*sa, Math.PI/2 - a));
  }
  var inner = bracketBoxes(0.86);
  for(k=0;k<8;k++){
    a = (22.5+45*k)*Math.PI/180;
    ca = Math.cos(a); sa = Math.sin(a);
    for(j=0;j<inner.length;j++) out.push(transformGeo(inner[j], L.rIn*ca, L.top-0.05, L.rIn*sa, Math.PI/2 - a));
  }
  return mergeGeometries(out);
}
function transformGeo(g, x, y, z, ry){
  var c = g.clone();
  c.applyMatrix4(new THREE.Matrix4().makeRotationY(ry));
  c.applyMatrix4(new THREE.Matrix4().makeTranslation(x, y, z));
  return c;
}

/* ---- 屋檐（凹曲屋面 + 连檐 + 脊） ---- */
function roofGridGeometry(L){
  var S = 48, K = 7;
  var pos = [], uv = [], idx = [];
  for(var k=0;k<=K;k++){
    var t = k/K;
    var r = L.ridgeR + (L.eaveR - L.ridgeR)*t;
    var yBase = L.ridgeY - (L.ridgeY - L.eaveY)*Math.pow(t, 1.85);
    for(var j=0;j<=S;j++){
      var th = (22.5 + 7.5*j)*Math.PI/180;
      var corner = Math.pow(Math.abs(Math.sin(4*th)), 2.5);
      var y = yBase + L.up * corner * Math.pow(t, 3) * 2.2;
      pos.push(r*Math.cos(th), y, r*Math.sin(th));
      uv.push(j/S*8, t*2.0);
    }
  }
  for(k=0;k<K;k++){
    for(j=0;j<S;j++){
      var a = k*(S+1)+j, b = a+1, c = a+S+1, d = c+1;
      idx.push(a,c,b, b,c,d);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function buildRoof(i){
  var L = LEVELS[i], out = [];
  out.push(roofGridGeometry(L));
  pushCyl(out, L.eaveR+0.07, L.eaveR+0.03, 0.24, 8, 0, L.eaveY+0.06, 0, 0, Math.PI/8, 0, true);
  pushCyl(out, L.eaveR-0.02, L.eaveR-0.06, 0.16, 8, 0, L.eaveY-0.06, 0, 0, Math.PI/8, 0, true);
  pushCyl(out, L.ridgeR+0.05, L.ridgeR+0.05, 0.30, 8, 0, L.ridgeY+0.08, 0, 0, Math.PI/8, 0, true);
  return mergeGeometries(out);
}

/* ---- 塔刹 ---- */
function buildSpire(){
  var metal = [], chains = [], k;
  pushCyl(metal, 1.5, 1.05, 1.3, 12, 0, 51.5, 0);
  pushCyl(metal, 0.22, 0.26, 15.5, 8, 0, 58.6, 0);
  for(k=0;k<7;k++){
    pushCyl(metal, 1.6-k*0.1, 1.6-k*0.1, 0.22, 12, 0, 53.4+k*1.0, 0);
  }
  pushCyl(metal, 1.0, 1.0, 0.3, 12, 0, 60.9, 0);
  pushSphere(metal, 0.78, 0, 62.2, 0);
  pushCyl(metal, 0.09, 0.13, 3.8, 6, 0, 64.8, 0);
  for(k=0;k<8;k++){
    var a = (22.5+45*k)*Math.PI/180;
    pushTube(chains, 1.7*Math.cos(a), 59.6, 1.7*Math.sin(a), 9.42*Math.cos(a), 50.0, 9.42*Math.sin(a), 0.045, 5);
  }
  return { metal:mergeGeometries(metal), chains:mergeGeometries(chains) };
}

/* ---- 组装 ---- */
addComp('TJ-01', 'TJ', -1, [{ geo:buildBase(), mat:MAT.stone }]);
for(var i=0;i<6;i++){
  addComp('ZW-0'+(i+1), 'ZW', i, [{ geo:buildColumns(i), mat:MAT.col }]);
  addComp('LF-0'+(i+1), 'LF', i, [{ geo:buildBeams(i),   mat:MAT.beam }]);
  addComp('DG-0'+(i+1), 'DG', i, [{ geo:buildDougong(i), mat:MAT.dou }]);
  addComp('YW-0'+(i+1), 'YW', i, [{ geo:buildRoof(i),    mat:MAT.roof }]);
}
var spire = buildSpire();
addComp('TS-01', 'TS', -1, [{ geo:spire.metal, mat:MAT.metal }, { geo:spire.chains, mat:MAT.chain }]);

/* ================= 爆炸分解配置 ================= */
var EXPL = {
  ZW: { lift:function(i){return i*1.6;},          scale:function(){return 1.10;}, drift:1.3 },
  LF: { lift:function(i){return 1.8 + i*2.3;},    scale:function(){return 1.24;}, drift:1.7 },
  DG: { lift:function(i){return 3.6 + i*3.0;},    scale:function(){return 1.38;}, drift:2.1 },
  YW: { lift:function(i){return 5.8 + i*4.0;},    scale:function(){return 1.55;}, drift:2.5 },
  TS: { lift:function(){return 15.5;},           scale:function(){return 1.15;}, drift:0 },
  TJ: { lift:function(){return 0;},               scale:function(){return 1.0;},  drift:0 }
};
comps.forEach(function(c){
  var cfg = EXPL[c.type], lv = Math.max(c.levelIdx, 0), d = cfg.drift;
  c.expl = {
    x: d ? Math.cos(lv*2.35 + 0.8)*d : 0,
    y: cfg.lift(c.levelIdx),
    z: d ? Math.sin(lv*1.85 + 1.3)*d : 0,
    s: cfg.scale() - 1
  };
});

/* ================= 地面反射 / 氛围 ================= */
var reflector = new THREE.Reflector(new THREE.CircleGeometry(110, 48), {
  clipBias: 0.003,
  textureWidth: 1024,
  textureHeight: 1024,
  color: 0x1a140f
});
reflector.rotation.x = -Math.PI/2;
scene.add(reflector);

function flatDisc(radius, tex, y, order, blending){
  var m = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 48),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false,
      blending:blending || THREE.NormalBlending, fog:false })
  );
  m.rotation.x = -Math.PI/2;
  m.position.y = y;
  m.renderOrder = order;
  scene.add(m);
  return m;
}
/* 接触阴影 */
flatDisc(20, radialTexture([[0,'rgba(0,0,0,0.55)'],[0.55,'rgba(0,0,0,0.28)'],[1,'rgba(0,0,0,0)']]), 0.03, 1);
/* 地面暖色微光 */
flatDisc(26, radialTexture([[0,'rgba(255,166,80,0.30)'],[0.5,'rgba(255,120,40,0.07)'],[1,'rgba(255,110,30,0)']]), 0.045, 2, THREE.AdditiveBlending);
/* 压暗反射边缘 */
flatDisc(110, radialTexture([[0,'rgba(8,6,4,0.42)'],[0.6,'rgba(7,5,4,0.45)'],[1,'rgba(5,4,3,0.82)']]), 0.06, 3);

/* 背景暖色光晕 */
var halo = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 160),
  new THREE.MeshBasicMaterial({ map:radialTexture([[0,'rgba(255,150,60,0.30)'],[0.45,'rgba(140,70,28,0.10)'],[1,'rgba(0,0,0,0)']]),
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false })
);
halo.position.set(0, 28, -95);
scene.add(halo);

/* 浮尘 */
var DUST_N = 240;
var dustPos = new Float32Array(DUST_N*3);
var dustBaseX = new Float32Array(DUST_N);
var dustBaseZ = new Float32Array(DUST_N);
var dustSpeed = new Float32Array(DUST_N);
var dustPhase = new Float32Array(DUST_N);
for(i=0;i<DUST_N;i++){
  dustBaseX[i] = (Math.random()-0.5)*90;
  dustBaseZ[i] = (Math.random()-0.5)*90;
  dustPos[i*3]   = dustBaseX[i];
  dustPos[i*3+1] = Math.random()*62 + 0.5;
  dustPos[i*3+2] = dustBaseZ[i];
  dustSpeed[i] = 0.25 + Math.random()*0.55;
  dustPhase[i] = Math.random()*6.28;
}
var dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  size:0.32, map:dotTexture(), color:0xffc98a, transparent:true, opacity:0.4,
  depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true
}));
scene.add(dust);

/* ================= 拾取 / 选中 / 高亮 ================= */
var raycaster = new THREE.Raycaster();
var pointer = new THREE.Vector2();
var hovered = null, selected = null;

function isShown(obj){
  var o = obj;
  while(o){ if(!o.visible) return false; o = o.parent; }
  return true;
}
function pick(){
  raycaster.setFromCamera(pointer, camera);
  var hits = raycaster.intersectObjects(pickables, false);
  for(var i=0;i<hits.length;i++){
    if(isShown(hits[i].object)) return hits[i].object.userData.comp;
  }
  return null;
}

var infoCard = document.getElementById('infoCard');
var icId = document.getElementById('icId');
var icName = document.getElementById('icName');
var icSub = document.getElementById('icSub');
var icDesc = document.getElementById('icDesc');

function select(comp){
  selected = comp;
  if(comp){
    icId.textContent = comp.id;
    icName.textContent = TYPE_NAME[comp.type];
    icSub.textContent = (comp.type==='TJ') ? '底部 · 全塔基座'
                      : (comp.type==='TS') ? '顶部 · 六层檐之上'
                      : ('位置：' + levelLabel(comp.levelIdx));
    icDesc.textContent = compDesc(comp);
    infoCard.classList.remove('hidden');
  } else {
    infoCard.classList.add('hidden');
  }
}

function hideComp(comp){
  comp.group.visible = false;
  if(selected === comp) select(null);
  refreshLegend();
}
function isolate(comp){
  comps.forEach(function(c){ c.group.visible = (c === comp); });
  refreshLegend();
}

var downX = 0, downY = 0;
renderer.domElement.addEventListener('pointermove', function(e){
  if(e.buttons) return;
  pointer.x = (e.clientX/window.innerWidth)*2 - 1;
  pointer.y = -(e.clientY/window.innerHeight)*2 + 1;
  hovered = pick();
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('pointerdown', function(e){
  downX = e.clientX; downY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', function(e){
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;
  pointer.x = (e.clientX/window.innerWidth)*2 - 1;
  pointer.y = -(e.clientY/window.innerHeight)*2 + 1;
  select(pick());
});
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape') select(null);
});

/* ================= UI 绑定 ================= */
var explodeTarget = 0, explodeCur = 0;
var slider = document.getElementById('explode');
var sliderVal = document.getElementById('explodeVal');
slider.addEventListener('input', function(){
  explodeTarget = slider.value/100;
  sliderVal.textContent = slider.value + '%';
});
document.getElementById('btnReset').addEventListener('click', function(){
  camera.position.copy(CAM_HOME);
  controls.target.copy(TGT_HOME);
  select(null);
});
document.getElementById('btnShowAll').addEventListener('click', function(){
  comps.forEach(function(c){ c.group.visible = true; });
  select(null);
  refreshLegend();
});
document.getElementById('autorot').addEventListener('change', function(e){
  controls.autoRotate = e.target.checked;
});
document.getElementById('btnHide').addEventListener('click', function(){ if(selected) hideComp(selected); });
document.getElementById('btnIso').addEventListener('click', function(){ if(selected) isolate(selected); });
document.getElementById('btnClose').addEventListener('click', function(){ select(null); });

/* ---- 图例 ---- */
var legendEl = document.getElementById('legend');
var legendRows = {};
LEGEND.forEach(function(t){
  var row = document.createElement('div');
  row.className = 'lg-row';
  row.innerHTML = '<span class="dot" style="background:'+t.color+';color:'+t.color+'"></span>' +
    '<span class="lg-name">'+t.name+'</span>' +
    '<span class="lg-count">×' + t.count + '</span>' +
    '<button class="eye" title="显示 / 隐藏">◉</button>';
  row.querySelector('.eye').addEventListener('click', function(ev){
    ev.stopPropagation();
    var hide = !isTypeHidden(t.type);
    comps.forEach(function(c){
      if(c.type === t.type){
        c.group.visible = !hide;
        if(!hide && selected === c && !c.group.visible) {}
      }
    });
    if(!hide && selected && selected.type === t.type) select(null);
    refreshLegend();
  });
  row.addEventListener('click', function(){
    var now = performance.now();
    comps.forEach(function(c){ if(c.type === t.type) c.flashUntil = now + 800; });
  });
  legendEl.appendChild(row);
  legendRows[t.type] = row;
});
function isTypeHidden(type){
  return comps.every(function(c){ return c.type !== type || !c.group.visible; });
}
function refreshLegend(){
  LEGEND.forEach(function(t){
    legendRows[t.type].classList.toggle('off', isTypeHidden(t.type));
    legendRows[t.type].querySelector('.eye').textContent = isTypeHidden(t.type) ? '○' : '◉';
  });
}

/* ================= 动画循环 ================= */
var clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = clock.elapsedTime;
  var now = performance.now();
  controls.update();

  explodeCur += (explodeTarget - explodeCur) * Math.min(1, dt*4.2);
  var f = explodeCur;

  for(var i=0;i<comps.length;i++){
    var c = comps[i], e = c.expl;
    var bob = (f > 0.03 && c.type !== 'TJ') ? Math.sin(t*0.7 + c.phase)*0.22*f : 0;
    c.group.position.set(e.x*f, e.y*f + bob, e.z*f);
    var s = 1 + e.s*f;
    c.group.scale.set(s, 1, s);

    var hex = 0x000000, inten = 0;
    if(c === selected){ hex = 0xff2410; inten = 0.62; }
    else if(c === hovered){ hex = 0x40180a; inten = 0.55; }
    else if(c.flashUntil > now){ hex = 0xff5a1e; inten = 0.38; }
    for(var j=0;j<c.mats.length;j++){
      c.mats[j].emissive.setHex(hex);
      c.mats[j].emissiveIntensity = inten;
    }
  }

  /* 浮尘漂移 */
  for(i=0;i<DUST_N;i++){
    var y = dustPos[i*3+1] + dustSpeed[i]*dt;
    if(y > 64){
      y = 0.5;
      dustBaseX[i] = (Math.random()-0.5)*90;
      dustBaseZ[i] = (Math.random()-0.5)*90;
    }
    dustPos[i*3+1] = y;
    dustPos[i*3]   = dustBaseX[i] + Math.sin(t*0.22 + dustPhase[i])*0.9;
    dustPos[i*3+2] = dustBaseZ[i] + Math.cos(t*0.18 + dustPhase[i]*1.3)*0.9;
  }
  dustGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
</script>
