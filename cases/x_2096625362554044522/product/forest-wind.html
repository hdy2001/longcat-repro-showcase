<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Wind — 森の風</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Serif JP', serif;
    background: #2a2030;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    z-index: 5;
    background: rgba(38, 26, 46, 0.38);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    padding: 14px 20px;
    color: #f3e9f2;
    pointer-events: none;
  }
  #hud-left  { left: 22px;  bottom: 22px; }
  #hud-right { right: 22px; top: 22px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; padding: 3px 0; }
  #hud-right .row { flex-direction: row; }
  .label { font-size: 10px; letter-spacing: 0.25em; color: #c9b3d6; }
  .value { font-size: 22px; font-weight: 600; color: #ffffff; text-shadow: 0 1px 8px rgba(90, 40, 100, 0.5); }
  .unit  { font-size: 11px; color: #cbb8d4; margin-left: 4px; font-weight: 400; }
  .dim   { font-size: 12px; color: #a98fb4; margin-left: 3px; font-weight: 400; }

  @keyframes statPulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.22); color: #ffd9ec; }
    100% { transform: scale(1); }
  }
  .pulse { display: inline-block; animation: statPulse 0.5s ease; }

  /* ---------- center message / flash / vignette ---------- */
  #msg {
    position: fixed; top: 16%; left: 0; width: 100%;
    text-align: center; z-index: 6; pointer-events: none;
    font-size: 22px; font-weight: 600; color: #fff;
    text-shadow: 0 2px 16px rgba(80, 40, 90, 0.7);
    opacity: 0; transition: opacity 0.45s ease;
    letter-spacing: 0.15em;
  }
  #flash {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(214, 120, 140, 0.55), rgba(150, 60, 90, 0.75));
    opacity: 0; transition: opacity 0.6s ease;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(46, 24, 54, 0.38) 100%);
  }

  /* ---------- start overlay ---------- */
  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(70, 52, 108, 0.94) 0%, rgba(158, 106, 146, 0.9) 48%, rgba(232, 158, 120, 0.88) 100%);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    transition: opacity 1.3s ease;
    text-align: center;
  }
  #start.hidden { opacity: 0; pointer-events: none; }
  .title-en {
    font-size: clamp(42px, 8vw, 84px);
    font-weight: 900; color: #fdf6ee;
    letter-spacing: 0.2em; margin-right: -0.2em;
    text-shadow: 0 4px 34px rgba(50, 18, 70, 0.5);
  }
  .title-jp {
    margin-top: 18px;
    font-size: clamp(20px, 3vw, 30px);
    color: #f6e3d0; font-weight: 600;
    letter-spacing: 0.55em; margin-right: -0.55em;
    text-shadow: 0 2px 18px rgba(60, 20, 60, 0.55);
  }
  .title-sub {
    margin-top: 12px; font-size: 12px; color: rgba(253, 246, 238, 0.65);
    letter-spacing: 0.35em; margin-right: -0.35em;
  }
  #stamp {
    width: 88px; height: 88px; margin: 40px 0 20px;
    background: #b23a2e; color: #fdf6ee;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: 900;
    border-radius: 12px; transform: rotate(-5deg);
    box-shadow: 0 8px 28px rgba(90, 20, 20, 0.45), inset 0 0 0 3px rgba(255, 255, 255, 0.35);
  }
  #takeFlight {
    font-family: inherit; font-size: 15px; letter-spacing: 0.35em; margin-right: -0.35em;
    padding: 15px 44px;
    background: transparent; color: #fdf6ee;
    border: 1.5px solid rgba(253, 246, 238, 0.75); border-radius: 999px;
    cursor: pointer; transition: all 0.3s ease;
  }
  #takeFlight:hover { background: rgba(253, 246, 238, 0.16); transform: translateY(-2px); }
  .hint {
    position: absolute; bottom: 34px;
    font-size: 11px; color: rgba(253, 246, 238, 0.6);
    letter-spacing: 0.22em; line-height: 2;
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="flash"></div>

<div id="hud-left" class="hud">
  <div class="row"><span class="label">空速 AIRSPEED</span><span class="value"><span id="v-spd">0</span><span class="unit">km/h</span></span></div>
  <div class="row"><span class="label">地速 GROUND</span><span class="value"><span id="v-gspd">0</span><span class="unit">km/h</span></span></div>
  <div class="row"><span class="label">高度 ALT</span><span class="value"><span id="v-alt">0</span><span class="unit">m</span></span></div>
</div>

<div id="hud-right" class="hud">
  <div class="row"><span class="label">魂 SOULS</span><span class="value" id="v-souls">0</span></div>
  <div class="row"><span class="label">鳥居 TORII</span><span class="value" id="v-gates">0<span class="dim">/13</span></span></div>
  <div class="row"><span class="label">距離 DIST</span><span class="value"><span id="v-dist">0.0</span><span class="unit">km</span></span></div>
</div>

<div id="msg"></div>

<div id="start">
  <div class="title-en">FOREST WIND</div>
  <div class="title-jp">森の風</div>
  <div class="title-sub">A QUIET FLIGHT OVER THE FOREST</div>
  <div id="stamp">飛</div>
  <button id="takeFlight">Take flight</button>
  <div class="hint">
    W/S 或 ↑/↓ 俯仰 &nbsp;·&nbsp; A/D 或 ←/→ 滚转转向 &nbsp;·&nbsp; Shift 乘风加速 &nbsp;·&nbsp; Ctrl 减速 &nbsp;·&nbsp; Space 改平 &nbsp;·&nbsp; M 声音
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   basics
============================================================ */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xecc3cd, 150, 2600);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 9000);

scene.add(new THREE.HemisphereLight(0xf6cfe0, 0x5c6b58, 0.95));
const sunLight = new THREE.DirectionalLight(0xffd9b0, 0.85);
sunLight.position.set(-700, 520, -1200);
scene.add(sunLight);

/* ============================================================
   sky dome (pink → purple gradient) + sun glow
============================================================ */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(3400, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying vec3 vP;
      void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vP;
      void main() {
        float h = normalize(vP).y;
        vec3 top = vec3(0.36, 0.24, 0.52);
        vec3 mid = vec3(0.80, 0.53, 0.68);
        vec3 hor = vec3(0.99, 0.78, 0.60);
        vec3 c = h > 0.18 ? mix(mid, top, smoothstep(0.18, 0.75, h))
                          : mix(hor, mid, smoothstep(-0.06, 0.18, h));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

/* canvas texture helpers */
function makeRadialTexture(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
function makeLeafTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.translate(32, 32); g.rotate(0.6);
  const gr = g.createRadialGradient(0, 0, 2, 0, 0, 20);
  gr.addColorStop(0, '#f6c667');
  gr.addColorStop(0.7, '#e89a3e');
  gr.addColorStop(1, 'rgba(217,126,53,0)');
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(0, 0, 11, 17, 0, 0, Math.PI * 2); g.fill();
  return new THREE.CanvasTexture(c);
}
const glowTex = makeRadialTexture([[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(200,235,255,0.75)'], [1, 'rgba(120,190,255,0)']]);
const leafTex = makeLeafTexture();

const sunDir = new THREE.Vector3(-700, 520, -1200).normalize();
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0xffd2a0, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
}));
sunSprite.position.copy(sunDir).multiplyScalar(2900);
sunSprite.scale.set(1100, 1100, 1);
scene.add(sunSprite);

/* ============================================================
   terrain — gentle heightfield with watercolor vertex colors
============================================================ */
function terrainHeight(x, z) {
  let h = 0;
  h += 22 * Math.sin(x * 0.0038 + 1.3) * Math.cos(z * 0.0031 + 0.4);
  h += 12 * Math.sin(x * 0.0092 + 4.1) * Math.sin(z * 0.0078 + 2.2);
  h +=  5 * Math.sin(x * 0.0210 + 0.7) * Math.cos(z * 0.0170 + 5.0);
  h +=  2.2 * Math.sin(x * 0.050) * Math.sin(z * 0.043);
  return h + 6;
}

const TERRAIN_SIZE = 6000;
const terraGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, 150, 150);
terraGeo.rotateX(-Math.PI / 2);
{
  const pos = terraGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cLow = new THREE.Color(0x7d8a6f);
  const cMid = new THREE.Color(0x66755c);
  const cHigh = new THREE.Color(0x828a7c);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);
    const t = clamp((h + 20) / 55, 0, 1);
    tmp.copy(cLow).lerp(cMid, clamp(t * 1.6, 0, 1)).lerp(cHigh, clamp((t - 0.6) * 2, 0, 1));
    const j = 0.92 + Math.random() * 0.16;
    colors[i * 3] = tmp.r * j; colors[i * 3 + 1] = tmp.g * j; colors[i * 3 + 2] = tmp.b * j;
  }
  terraGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terraGeo.computeVertexNormals();
}
scene.add(new THREE.Mesh(terraGeo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));

/* winding path the torii gates follow (also used for tree clearing) */
const pathX = z => Math.sin(-z * 0.0042) * 120;

/* ============================================================
   layered mountains
============================================================ */
function mountainRing(count, rMin, rMax, hMin, hMax, baseMin, baseMax, colA, colB) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.35;
    const r = rMin + Math.random() * (rMax - rMin);
    const h = hMin + Math.random() * (hMax - hMin);
    const b = baseMin + Math.random() * (baseMax - baseMin);
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(b, h, 5 + Math.floor(Math.random() * 2)),
      new THREE.MeshLambertMaterial({ color: new THREE.Color(colA).lerp(new THREE.Color(colB), Math.random()), flatShading: true })
    );
    m.position.set(Math.cos(a) * r, h / 2 - 18, Math.sin(a) * r);
    m.rotation.y = Math.random() * Math.PI;
    scene.add(m);
  }
}
mountainRing(14, 1700, 2700, 260, 560, 380, 680, 0x8a76ad, 0xa58bb8); // far purple ridge
mountainRing(12, 900, 1450, 150, 360, 280, 520, 0x71837c, 0x82948a);  // nearer gray-green hills

/* ============================================================
   torii gates (vermilion) along the winding path
============================================================ */
const gates = [];
const noTree = []; // {x, z, r} clearings — gates/houses/lanterns register here
function makeTorii() {
  const g = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xc23b2e, flatShading: true });
  const dark = new THREE.MeshLambertMaterial({ color: 0x9c2f24, flatShading: true });
  const stone = new THREE.MeshLambertMaterial({ color: 0x8d8a92, flatShading: true });
  const P = 4.2, H = 7.8;
  for (const sd of [-1, 1]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.44, H, 6), red);
    pillar.position.set(sd * P, H / 2, 0); pillar.rotation.z = -sd * 0.045;
    g.add(pillar);
    const base = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.7, 1.3), stone);
    base.position.set(sd * P, 0.35, 0);
    g.add(base);
  }
  const kasagi = new THREE.Mesh(new THREE.BoxGeometry(11.6, 0.8, 1.05), dark);
  kasagi.position.y = H + 0.3; g.add(kasagi);
  const nuki = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.55, 0.7), red);
  nuki.position.y = H - 1.2; g.add(nuki);
  const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.15, 0.28), dark);
  plaque.position.y = H - 0.4; g.add(plaque);
  return g;
}
const GATE_COUNT = 13;
for (let i = 0; i < GATE_COUNT; i++) {
  const z = -160 - i * 205;
  const x = pathX(z);
  const y = terrainHeight(x, z) + 25 + Math.sin(i * 1.7) * 7;
  const g = makeTorii();
  g.position.set(x, y, z);
  const fwd = new THREE.Vector3(pathX(z - 15) - pathX(z + 15), 0, -30).normalize();
  g.rotation.y = Math.atan2(fwd.x, fwd.z);
  scene.add(g);
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  gates.push({ pos: g.position.clone(), fwd, right, prev: 1e9, passed: false });
  noTree.push({ x, z, r: 30 });
}

/* ============================================================
   japanese houses & stone lanterns
============================================================ */
function makeHouse() {
  const g = new THREE.Group();
  const wall = new THREE.MeshLambertMaterial({ color: 0xe7dbc4, flatShading: true });
  const roofM = new THREE.MeshLambertMaterial({ color: 0x5b5160, flatShading: true });
  const wood = new THREE.MeshLambertMaterial({ color: 0x6b4f3a, flatShading: true });
  const stone = new THREE.MeshLambertMaterial({ color: 0x8d8a92, flatShading: true });
  const base = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.7, 7.6), stone); base.position.y = 0.35; g.add(base);
  const body = new THREE.Mesh(new THREE.BoxGeometry(6, 3.6, 7), wall); body.position.y = 2.5; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.9, 3.4, 4), roofM);
  roof.position.y = 6.1; roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 1.12); g.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.1, 0.2), wood);
  door.position.set(0.8, 1.75, 3.55); g.add(door);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.0), new THREE.MeshBasicMaterial({ color: 0xffc98a }));
  win.position.set(-1.4, 2.7, 3.53); g.add(win);
  return g;
}
for (let i = 0; i < 9; i++) {
  let x, z, ok = false, guard = 0;
  while (!ok && guard++ < 200) {
    const a = Math.random() * Math.PI * 2;
    const r = 220 + Math.random() * 1300;
    x = Math.cos(a) * r; z = Math.sin(a) * r;
    ok = !(z < 300 && Math.abs(x - pathX(z)) < 34) &&
         Math.hypot(x, z - 320) > 90 &&
         !noTree.some(c => Math.hypot(x - c.x, z - c.z) < c.r + 20);
  }
  const h = makeHouse();
  h.position.set(x, terrainHeight(x, z), z);
  h.rotation.y = Math.random() * Math.PI * 2;
  scene.add(h);
  noTree.push({ x, z, r: 26 });
}

const lanternGlowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffb066, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
function makeLantern() {
  const g = new THREE.Group();
  const stone = new THREE.MeshLambertMaterial({ color: 0x97918a, flatShading: true });
  const add = (geo, y) => { const mm = new THREE.Mesh(geo, stone); mm.position.y = y; g.add(mm); };
  add(new THREE.BoxGeometry(0.95, 0.5, 0.95), 0.25);
  add(new THREE.CylinderGeometry(0.2, 0.27, 1.1, 6), 1.05);
  add(new THREE.BoxGeometry(0.68, 0.4, 0.68), 1.8);
  const fire = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.32, 0.42),
    new THREE.MeshLambertMaterial({ color: 0xffd9a0, emissive: 0xff9c3c, emissiveIntensity: 1.0 }));
  fire.position.y = 1.8; g.add(fire);
  add(new THREE.ConeGeometry(0.62, 0.5, 4), 2.2); g.children[g.children.length - 1].rotation.y = Math.PI / 4;
  add(new THREE.SphereGeometry(0.13, 6, 5), 2.55);
  const glow = new THREE.Sprite(lanternGlowMat);
  glow.scale.set(3.2, 3.2, 1); glow.position.y = 1.8; g.add(glow);
  return g;
}
for (let i = 0; i < 18; i++) {
  const z = -60 - i * 150;
  const x = pathX(z) + (i % 2 ? 13 : -13);
  const l = makeLantern();
  l.position.set(x, terrainHeight(x, z), z);
  scene.add(l);
  noTree.push({ x, z, r: 5 });
}

/* ============================================================
   conifer forest (instanced) — placed after structures so
   gates / houses / lanterns stay clear
============================================================ */
const TREE_COUNT = 500;
const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 2.8, 5); trunkGeo.translate(0, 1.4, 0);
const coneLoGeo = new THREE.ConeGeometry(3.6, 7, 6); coneLoGeo.translate(0, 5.5, 0);
const coneHiGeo = new THREE.ConeGeometry(2.3, 6, 6); coneHiGeo.translate(0, 9.6, 0);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4f3a, flatShading: true });
const folMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
const coneLo = new THREE.InstancedMesh(coneLoGeo, folMat.clone(), TREE_COUNT);
const coneHi = new THREE.InstancedMesh(coneHiGeo, folMat.clone(), TREE_COUNT);

{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < TREE_COUNT && guard++ < 8000) {
    const x = (Math.random() * 2 - 1) * 2300;
    const z = (Math.random() * 2 - 1) * 2300;
    if (z < 280 && Math.abs(x - pathX(z)) < 22) continue;               // flight corridor
    if (Math.hypot(x - 0, z - 320) < 45) continue;                       // spawn clearing
    if (noTree.some(c => Math.hypot(x - c.x, z - c.z) < c.r)) continue;
    const sc = 0.8 + Math.random() * 0.95;
    const y = terrainHeight(x, z) - 0.4;
    e.set((Math.random() - 0.5) * 0.09, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.09);
    q.setFromEuler(e);
    p.set(x, y, z); s.set(sc, sc * (0.9 + Math.random() * 0.25), sc);
    m.compose(p, q, s);
    trunks.setMatrixAt(placed, m);
    coneLo.setMatrixAt(placed, m);
    coneHi.setMatrixAt(placed, m);
    if (Math.random() < 0.16) col.setHSL(0.055 + Math.random() * 0.045, 0.62, 0.40 + Math.random() * 0.09);
    else col.setHSL(0.26 + Math.random() * 0.07, 0.26 + Math.random() * 0.15, 0.30 + Math.random() * 0.10);
    coneLo.setColorAt(placed, col);
    coneHi.setColorAt(placed, col);
    placed++;
  }
  trunks.count = coneLo.count = coneHi.count = placed;
  scene.add(trunks, coneLo, coneHi);
}

/* ============================================================
   low-poly clouds
============================================================ */
const clouds = [];
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xfdf3f0, flatShading: true, transparent: true, opacity: 0.92 });
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group();
  const n = 3 + Math.floor(Math.random() * 3);
  for (let j = 0; j < n; j++) {
    const r = 6 + Math.random() * 9;
    const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), cloudMat);
    puff.position.set((j - n / 2) * r * 1.1 + Math.random() * 4, Math.random() * 2.5, (Math.random() - 0.5) * 8);
    puff.scale.y = 0.55;
    g.add(puff);
  }
  g.position.set((Math.random() * 2 - 1) * 1600, 170 + Math.random() * 100, (Math.random() * 2 - 1) * 1600);
  g.userData.vx = 2 + Math.random() * 3;
  scene.add(g);
  clouds.push(g);
}

/* ============================================================
   falling leaves
============================================================ */
const LEAF_COUNT = 380;
const leafPos = new Float32Array(LEAF_COUNT * 3);
const leafCol = new Float32Array(LEAF_COUNT * 3);
const leafFall = new Float32Array(LEAF_COUNT);
const leafSeed = new Float32Array(LEAF_COUNT);
{
  const c = new THREE.Color();
  for (let i = 0; i < LEAF_COUNT; i++) {
    leafPos[i * 3] = (Math.random() * 2 - 1) * 400;
    leafPos[i * 3 + 1] = Math.random() * 160;
    leafPos[i * 3 + 2] = (Math.random() * 2 - 1) * 400;
    c.setHSL(0.06 + Math.random() * 0.05, 0.75, 0.52 + Math.random() * 0.14);
    leafCol[i * 3] = c.r; leafCol[i * 3 + 1] = c.g; leafCol[i * 3 + 2] = c.b;
    leafFall[i] = 0.7 + Math.random() * 0.8;
    leafSeed[i] = Math.random() * 100;
  }
}
const leafGeo = new THREE.BufferGeometry();
leafGeo.setAttribute('position', new THREE.BufferAttribute(leafPos, 3));
leafGeo.setAttribute('color', new THREE.BufferAttribute(leafCol, 3));
const leaves = new THREE.Points(leafGeo, new THREE.PointsMaterial({
  size: 1.7, map: leafTex, transparent: true, depthWrite: false,
  vertexColors: true, sizeAttenuation: true
}));
leaves.frustumCulled = false;
scene.add(leaves);

/* ============================================================
   soul orbs (collectible) + collect burst particles
============================================================ */
const ORB_COUNT = 34;
const orbs = [];
const orbGeo = new THREE.IcosahedronGeometry(0.9, 1);
const orbMat = new THREE.MeshBasicMaterial({ color: 0xeaf8ff });
for (let i = 0; i < ORB_COUNT; i++) {
  const grp = new THREE.Group();
  const core = new THREE.Mesh(orbGeo, orbMat);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0x8fd0ff, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.scale.set(7, 7, 1);
  grp.add(core, glow);
  scene.add(grp);
  orbs.push({ grp, glow, core, seed: Math.random() * 100, baseY: 0 });
}
function placeOrb(o) {
  const a = S.yaw + (Math.random() - 0.5) * 1.5;
  const d = 130 + Math.random() * 260;
  const tx = plane.position.x + Math.sin(a) * d;
  const tz = plane.position.z + Math.cos(a) * d;
  o.baseY = clamp(terrainHeight(tx, tz) + 18 + Math.random() * 70, 14, 170);
  o.grp.position.set(tx, o.baseY, tz);
}

const BURST_MAX = 240;
const burstPos = new Float32Array(BURST_MAX * 3);
const burstCol = new Float32Array(BURST_MAX * 3);
const burstBase = new Float32Array(BURST_MAX * 3);
const burstVel = new Float32Array(BURST_MAX * 3);
const burstLife = new Float32Array(BURST_MAX);
for (let i = 0; i < BURST_MAX; i++) burstPos[i * 3 + 1] = -9999;
const burstGeo = new THREE.BufferGeometry();
burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
burstGeo.setAttribute('color', new THREE.BufferAttribute(burstCol, 3));
const bursts = new THREE.Points(burstGeo, new THREE.PointsMaterial({
  size: 1.5, map: glowTex, transparent: true, depthWrite: false,
  vertexColors: true, blending: THREE.AdditiveBlending
}));
bursts.frustumCulled = false;
scene.add(bursts);
let burstIdx = 0;
function spawnBurst(p, hex) {
  const c = new THREE.Color(hex);
  for (let n = 0; n < 14; n++) {
    const i = burstIdx = (burstIdx + 1) % BURST_MAX;
    burstPos[i * 3] = p.x; burstPos[i * 3 + 1] = p.y; burstPos[i * 3 + 2] = p.z;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const sp = 4 + Math.random() * 8;
    burstVel[i * 3] = Math.sin(ph) * Math.cos(th) * sp;
    burstVel[i * 3 + 1] = Math.cos(ph) * sp * 0.8 + 2;
    burstVel[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * sp;
    burstBase[i * 3] = c.r; burstBase[i * 3 + 1] = c.g; burstBase[i * 3 + 2] = c.b;
    burstLife[i] = 1;
  }
}

/* ============================================================
   the 1903 wright-style biplane
============================================================ */
const plane = new THREE.Group();
plane.rotation.order = 'YXZ';
{
  const fabric = new THREE.MeshLambertMaterial({ color: 0xece1c8, flatShading: true });
  const fabricD = new THREE.MeshLambertMaterial({ color: 0xdccfb2, flatShading: true });
  const wood = new THREE.MeshLambertMaterial({ color: 0x6f5138, flatShading: true });
  const dark = new THREE.MeshLambertMaterial({ color: 0x3a3a40, flatShading: true });
  for (const wy of [0.55, -0.55]) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.14, 1.7), fabric);
    wing.position.y = wy; plane.add(wing);
  }
  for (const sx of [-2.7, 2.7]) for (const sz of [-0.55, 0.55]) {
    const strut = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.15, 0.12), wood);
    strut.position.set(sx, 0, sz); plane.add(strut);
  }
  for (const rx of [-0.55, 0.55]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 4.8), wood);
    rail.position.set(rx, -0.55, 0); plane.add(rail);
  }
  const canard = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 1.0), fabricD);
  canard.position.set(0, -0.15, 2.5); plane.add(canard);
  for (const rx of [-0.9, 0.9]) {
    const rudder = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.5, 1.0), fabricD);
    rudder.position.set(rx, 0.35, -2.1); plane.add(rudder);
  }
  const engine = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), dark);
  engine.position.set(0, -0.55, -1.5); plane.add(engine);
  for (const sx of [-0.85, 0.85]) {
    const skid = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 3.4), wood);
    skid.position.set(sx, -1.15, 0.2); plane.add(skid);
    for (const sz of [-1.1, 1.1]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.75, 0.08), wood);
      leg.position.set(sx, -0.78, sz); plane.add(leg);
    }
  }
  const pilot = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.9), dark);
  pilot.position.set(0, -0.28, 0.55); plane.add(pilot);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 5), new THREE.MeshLambertMaterial({ color: 0xc9a184 }));
  head.position.set(0, -0.1, 1.0); plane.add(head);
}
const propL = new THREE.Group(), propR = new THREE.Group();
for (const [grp, px] of [[propL, -1.15], [propR, 1.15]]) {
  const bladeMat = new THREE.MeshLambertMaterial({ color: 0x8a6a48 });
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.0, 0.08), bladeMat);
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.12, 0.08), bladeMat);
  grp.add(b1, b2);
  grp.position.set(px, -0.55, -1.95);
  plane.add(grp);
}
scene.add(plane);

/* ============================================================
   game state & input
============================================================ */
const STALL_SPEED = 15;
const S = {
  started: false, yaw: Math.PI, pitch: 0, roll: 0, v: 30,
  stalled: false, souls: 0, gates: 0, dist: 0
};
const SPAWN = new THREE.Vector3(0, terrainHeight(0, 320) + 70, 320);
plane.position.copy(SPAWN);
plane.rotation.set(0, Math.PI, 0);
orbs.forEach(placeOrb); // scatter initial souls once plane & state exist

const keys = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* ============================================================
   audio — wind noise + soft chimes (starts on Take flight)
============================================================ */
let AC = null, master = null, windGain = null, windFilter = null, muted = false, chimeIdx = 0;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  windFilter = AC.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 380; windFilter.Q.value = 0.8;
  windGain = AC.createGain(); windGain.gain.value = 0;
  src.connect(windFilter).connect(windGain).connect(master);
  src.start();
}
function chime(freqs, vol = 0.16, dur = 1.3) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  for (const f of freqs) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.1);
  }
}
const PENTA = [523.25, 587.33, 698.46, 783.99, 880.0];
function orbChime() { const f = PENTA[chimeIdx++ % PENTA.length]; chime([f, f * 2], 0.13, 1.4); }
function gateChime() { chime([392, 587.33], 0.15, 1.6); }
function crashThud() { chime([98, 65], 0.2, 0.8); }
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.9;
  showMsg(muted ? '声音 OFF' : '声音 ON', 1000);
}

/* ============================================================
   HUD & messages
============================================================ */
const el = id => document.getElementById(id);
const ui = { spd: el('v-spd'), gspd: el('v-gspd'), alt: el('v-alt'), souls: el('v-souls'), gates: el('v-gates'), dist: el('v-dist'), msg: el('msg'), flash: el('flash') };
let msgTimer = null;
function showMsg(text, dur = 2200) {
  ui.msg.textContent = text;
  ui.msg.style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { ui.msg.style.opacity = 0; }, dur);
}
function pulse(elm) { elm.classList.remove('pulse'); void elm.offsetWidth; elm.classList.add('pulse'); }
function doFlash() { ui.flash.style.opacity = 1; setTimeout(() => { ui.flash.style.opacity = 0; }, 130); }

/* ============================================================
   crash — the forest gently catches you
============================================================ */
function crash() {
  doFlash();
  crashThud();
  showMsg('森が優しく受け止めた — the forest gently catches you', 2600);
  plane.position.y = terrainHeight(plane.position.x, plane.position.z) + 95;
  S.pitch = 0; S.roll = 0; S.v = 26; S.stalled = false;
}

/* ============================================================
   main loop
============================================================ */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
const camPos = SPAWN.clone().add(new THREE.Vector3(0, 5, 15.5));
const tmpV = new THREE.Vector3();
let hudTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* ----- flight model ----- */
  if (S.started) {
    const pitchIn = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
    const rollIn = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
    const leveling = !!keys.Space;
    const boosting = !!(keys.ShiftLeft || keys.ShiftRight);
    const braking = !!(keys.ControlLeft || keys.ControlRight);

    if (leveling) {
      S.pitch += (0 - S.pitch) * Math.min(1, 2.2 * dt);
      S.roll += (0 - S.roll) * Math.min(1, 3.5 * dt);
    } else {
      S.pitch += pitchIn * 1.15 * dt;
      S.roll += rollIn * 2.0 * dt;
    }
    S.pitch = clamp(S.pitch, -1.05, 1.05);
    S.roll = clamp(S.roll, -1.35, 1.35);

    /* stall: too slow → nose drops until speed returns */
    if (!S.stalled && S.v < STALL_SPEED) {
      S.stalled = true;
      showMsg('失速！ 俯冲增速 — dive to recover', 1800);
    }
    if (S.stalled) {
      S.pitch += (-0.45 - S.pitch) * Math.min(1, 2.5 * dt);
      if (S.v > STALL_SPEED * 1.3) S.stalled = false;
    }

    /* speed: thrust − drag − gravity along flight path */
    const thrust = 3.4 + (boosting ? 9.5 : 0);
    const k = 0.0034 * (braking ? 3.2 : 1);
    S.v += (thrust - k * S.v * S.v - 11 * Math.sin(S.pitch)) * dt;
    S.v = clamp(S.v, 0, 85);

    /* banked turn */
    const sf = clamp(S.v / 28, 0.45, 1.6);
    S.yaw += -Math.sin(S.roll) * 1.05 * sf * dt;

    /* integrate */
    plane.rotation.set(-S.pitch, S.yaw, S.roll);
    fwd.set(0, 0, 1).applyQuaternion(plane.quaternion);
    plane.position.addScaledVector(fwd, S.v * dt);
    if (S.stalled) plane.position.y -= 6 * dt;
    S.dist += S.v * dt;

    const gh = terrainHeight(plane.position.x, plane.position.z);
    if (plane.position.y < gh + 1.6) crash();

    /* torii gates */
    for (const g of gates) {
      tmpV.copy(plane.position).sub(g.pos);
      const along = tmpV.dot(g.fwd);
      if (g.prev < 0 && along >= 0 && !g.passed) {
        const lat = tmpV.dot(g.right);
        const h = tmpV.y;
        if (Math.abs(lat) < 4.8 && h > 0 && h < 7.2) {
          g.passed = true;
          S.gates++;
          gateChime();
          pulse(ui.gates);
        }
      }
      g.prev = along;
    }

    /* soul orbs: magnet + collect */
    for (const o of orbs) {
      const d = o.grp.position.distanceTo(plane.position);
      if (d < 20) o.grp.position.lerp(plane.position, Math.min(1, 7 * dt));
      if (d < 7) {
        S.souls++;
        orbChime();
        spawnBurst(o.grp.position, 0x9fd8ff);
        pulse(ui.souls);
        placeOrb(o);
      }
    }

    /* wind audio follows speed */
    if (windGain) {
      windGain.gain.value = Math.min(0.16, S.v * 0.0042) * (boosting ? 1.6 : 1);
      windFilter.frequency.value = 320 + S.v * 9;
    }
    /* boost widens fov slightly */
    const targetFov = boosting ? 69 : 62;
    if (Math.abs(camera.fov - targetFov) > 0.05) {
      camera.fov += (targetFov - camera.fov) * Math.min(1, 3 * dt);
      camera.updateProjectionMatrix();
    }
  }

  /* ----- camera ----- */
  if (S.started) {
    tmpV.copy(plane.position).addScaledVector(fwd, -15.5);
    tmpV.y += 5;
    const gy = terrainHeight(tmpV.x, tmpV.z) + 2.2;
    if (tmpV.y < gy) tmpV.y = gy;
    camPos.lerp(tmpV, 1 - Math.exp(-3.2 * dt));
    camera.position.copy(camPos);
    tmpV.copy(plane.position).addScaledVector(fwd, 16);
    tmpV.y += 1.2;
    if (S.stalled) {
      tmpV.x += (Math.random() - 0.5) * 0.35;
      tmpV.y += (Math.random() - 0.5) * 0.35;
    }
    camera.lookAt(tmpV);
  } else {
    camera.position.copy(camPos);
    camera.lookAt(plane.position.x, plane.position.y + 1, plane.position.z);
  }

  /* ----- world life ----- */
  for (const c of clouds) {
    c.position.x += c.userData.vx * dt;
    if (c.position.x > 1700) c.position.x = -1700;
  }
  for (let i = 0; i < LEAF_COUNT; i++) {
    const ix = i * 3;
    leafPos[ix + 1] -= (2.5 + leafFall[i] * (1 + S.v * 0.02)) * dt;
    leafPos[ix] += Math.sin(t * 1.2 + leafSeed[i]) * 2.2 * dt;
    leafPos[ix + 2] += Math.cos(t * 0.9 + leafSeed[i] * 1.7) * 2.2 * dt;
    const gy = terrainHeight(leafPos[ix], leafPos[ix + 2]);
    const dx = leafPos[ix] - plane.position.x, dz = leafPos[ix + 2] - plane.position.z;
    if (leafPos[ix + 1] < gy + 1.5 || (dx * dx + dz * dz > 260 * 260 && leafPos[ix + 1] < plane.position.y - 30)) {
      leafPos[ix] = plane.position.x + (Math.random() * 2 - 1) * 200;
      leafPos[ix + 1] = plane.position.y + 25 + Math.random() * 70;
      leafPos[ix + 2] = plane.position.z + (Math.random() * 2 - 1) * 200;
    }
  }
  leafGeo.attributes.position.needsUpdate = true;

  for (const o of orbs) {
    o.grp.position.y = o.baseY + Math.sin(t * 1.3 + o.seed) * 1.6;
    o.grp.rotation.y += dt * 0.8;
    const s = 7 * (1 + 0.12 * Math.sin(t * 2 + o.seed));
    o.glow.scale.set(s, s, 1);
  }
  for (let i = 0; i < BURST_MAX; i++) {
    if (burstLife[i] <= 0) continue;
    burstLife[i] -= dt * 1.3;
    const ix = i * 3;
    burstPos[ix] += burstVel[ix] * dt;
    burstPos[ix + 1] += burstVel[ix + 1] * dt;
    burstPos[ix + 2] += burstVel[ix + 2] * dt;
    burstVel[ix + 1] -= 3 * dt;
    const l = Math.max(burstLife[i], 0);
    burstCol[ix] = burstBase[ix] * l;
    burstCol[ix + 1] = burstBase[ix + 1] * l;
    burstCol[ix + 2] = burstBase[ix + 2] * l;
    if (burstLife[i] <= 0) burstPos[ix + 1] = -9999;
  }
  burstGeo.attributes.position.needsUpdate = true;
  burstGeo.attributes.color.needsUpdate = true;

  const spin = (4 + S.v * 0.55) * dt;
  propL.rotation.z += spin;
  propR.rotation.z -= spin;
  plane.rotation.x += Math.sin(t * 37) * 0.0018 * (S.v / 30); // engine tremor

  /* ----- HUD (throttled) ----- */
  hudTimer += dt;
  if (hudTimer > 0.12) {
    hudTimer = 0;
    const groundSpeed = S.v * Math.sqrt(Math.max(0, 1 - fwd.y * fwd.y));
    ui.spd.textContent = Math.round(S.v * 3.6);
    ui.gspd.textContent = Math.round(groundSpeed * 3.6);
    ui.alt.textContent = Math.max(0, Math.round(plane.position.y - terrainHeight(plane.position.x, plane.position.z)));
    ui.souls.textContent = S.souls;
    ui.gates.innerHTML = S.gates + '<span class="dim">/13</span>';
    ui.dist.textContent = (S.dist / 1000).toFixed(1);
  }

  renderer.render(scene, camera);
}
animate();

/* ============================================================
   start & resize
============================================================ */
el('takeFlight').addEventListener('click', () => {
  initAudio();
  el('start').classList.add('hidden');
  S.started = true;
  camPos.copy(plane.position).add(new THREE.Vector3(0, 5, 15.5));
  showMsg('風に乗れ — ride the wind · W/S 俯仰 · A/D 转向 · Shift 乘风', 5000);
});

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
