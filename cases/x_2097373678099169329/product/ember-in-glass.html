<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --warm:#e8c98f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#030304; overscroll-behavior:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- phase title ---------- */
  #title { position:fixed; left:0; right:0; top:27%; text-align:center; pointer-events:none; z-index:5; }
  #phaseTag { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.45em; text-indent:.45em;
    color:rgba(232,201,143,.55); margin-bottom:16px; text-transform:uppercase; }
  #phaseName { font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:clamp(44px, 8vw, 104px); letter-spacing:.06em; color:#f4e7cd;
    text-shadow:0 0 46px rgba(255,150,60,.28), 0 2px 30px rgba(0,0,0,.85); }
  #phaseSub { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500;
    font-size:clamp(17px, 2vw, 25px); color:rgba(226,206,178,.72); margin-top:12px; letter-spacing:.05em; }
  #phaseTag,#phaseName,#phaseSub { transition:opacity .45s ease, transform .45s ease, filter .45s ease; }
  #title.swap #phaseTag, #title.swap #phaseName, #title.swap #phaseSub {
    opacity:0; transform:translateY(14px); filter:blur(8px); }

  /* ---------- telemetry HUD ---------- */
  #hud { position:fixed; top:22px; right:24px; z-index:6; min-width:252px;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(226,214,190,.88);
    background:rgba(10,8,6,.38); border:1px solid rgba(255,180,100,.15); border-radius:6px;
    padding:12px 14px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; white-space:nowrap; }
  .k { width:62px; color:rgba(226,206,178,.48); letter-spacing:.14em; }
  .v { width:76px; text-align:right; color:#f0dcae; font-weight:500; }
  .bar { flex:1; height:3px; background:rgba(255,255,255,.09); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0%; border-radius:2px;
    background:linear-gradient(90deg,#ff5a1e,#ffb35c); box-shadow:0 0 8px rgba(255,140,50,.6);
    transition:width .18s ease-out; }
  #hArrow { font-style:normal; color:#ff9a4c; display:inline-block; margin-left:6px; font-size:10px; }
  #hTime { width:auto !important; margin-left:auto; color:rgba(226,206,178,.5) !important; }

  /* ---------- timeline scrubber ---------- */
  #timeline { position:fixed; left:50%; transform:translateX(-50%); bottom:34px;
    width:min(760px, 86vw); z-index:6; user-select:none; -webkit-user-select:none; }
  #track { position:relative; height:28px; display:flex; cursor:pointer; touch-action:none; }
  #track::before { content:''; position:absolute; left:0; right:0; top:50%; height:2px;
    transform:translateY(-50%); background:rgba(255,255,255,.10); border-radius:1px; }
  .seg { position:relative; height:100%; border-left:1px solid rgba(255,255,255,.12); }
  .seg:first-child { border-left:none; }
  .seg label { position:absolute; top:-15px; left:7px; font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:.2em; color:rgba(226,206,178,.38); transition:color .4s; }
  .seg.on label { color:#ffce8f; text-shadow:0 0 12px rgba(255,170,80,.5); }
  #fill { position:absolute; left:0; top:50%; height:2px; width:0%; transform:translateY(-50%);
    background:linear-gradient(90deg, rgba(255,90,30,.85), rgba(255,200,120,.95));
    box-shadow:0 0 14px rgba(255,140,50,.55); border-radius:1px; pointer-events:none; }
  #knob { position:absolute; top:50%; left:0%; width:13px; height:13px; border-radius:50%;
    transform:translate(-50%,-50%); pointer-events:none;
    background:radial-gradient(circle at 35% 35%, #ffe2b0, #ff8a3c 60%, #b3400f);
    box-shadow:0 0 16px rgba(255,150,60,.85), inset 0 0 3px rgba(255,230,180,.9); }

  /* ---------- hint / fader ---------- */
  #hint { position:fixed; left:24px; bottom:38px; z-index:6;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em;
    color:rgba(226,206,178,.45); transition:opacity 1.4s; pointer-events:none; }
  #hint.gone { opacity:0; }
  #fader { position:fixed; inset:0; background:#000; z-index:20; pointer-events:none;
    transition:opacity 2.8s ease; }

  @media (max-width:640px) {
    #hud { transform:scale(.82); transform-origin:top right; top:14px; right:14px; }
    #hint { display:none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="view"></canvas>
<div id="fader"></div>

<div id="title">
  <div id="phaseTag"></div>
  <h1 id="phaseName"></h1>
  <p id="phaseSub"></p>
</div>

<div id="hud">
  <div class="row"><span class="k">FLAME</span><span class="v" id="hFlame">---%</span><span class="bar"><i id="bFlame"></i></span></div>
  <div class="row"><span class="k">AIR</span><span class="v" id="hAir">0.0 m/s<i id="hArrow">➤</i></span><span class="bar"><i id="bAir"></i></span></div>
  <div class="row"><span class="k">CORE</span><span class="v" id="hCore">293 K</span><span class="bar"><i id="bCore"></i></span></div>
  <div class="row"><span class="k">RENDER</span><span class="v" id="hRender" style="width:auto">—</span></div>

<div id="timeline">
  <div id="track">
    <div class="seg" style="flex:4"><label>IGNITION</label></div>

    <div class="seg" style="flex:8"><label>STEADY BURN</label></div>

  </div>

<div id="hint">DRAG THE TIMELINE &nbsp;·&nbsp; SPACE TO PAUSE</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__errs = [];
addEventListener('error', e => window.__errs.push(String(e.message || e)));
addEventListener('unhandledrejection', e => window.__errs.push('promise: ' + String(e.reason)));

/* ================================================================
   PHASE CHOREOGRAPHY — 26 s loop
   ================================================================ */
const LOOP = 26;
const BOUNDS = [4, 10, 18, 22]; // phase switch times
const PHASES = [
  { name:'IGNITION',    sub:'a spark remembers the sun' },
  { name:'GROWTH',      sub:'the flame learns to stand' },
  { name:'STEADY BURN', sub:'a small sun, burning on its own' },
  { name:'WIND',        sub:'the sky leans in and breathes' },
  { name:'AFTERMATH',   sub:'smoke keeps the memory of light' },
];
// keyframes: [t, flameIntensity, windStrength]
const KEYS = [
  [0.0, 0.02, 0.00], [0.9, 0.12, 0.00], [2.0, 0.32, 0.00], [3.2, 0.50, 0.00],
  [4.6, 0.62, 0.00], [6.5, 0.86, 0.00], [8.5, 1.00, 0.00], [16.8, 0.97, 0.04],
  [18.0, 0.90, 0.50], [19.4, 0.50, 1.00], [20.6, 0.28, 0.85], [22.0, 0.13, 0.45],
  [23.6, 0.07, 0.22], [25.0, 0.05, 0.10], [26.0, 0.02, 0.00],
];
function sampleKeys(t) {
  const K = KEYS;
  if (t <= K[0][0]) return { i: K[0][1], w: K[0][2] };
  for (let s = 0; s < K.length - 1; s++) {
    const a = K[s], b = K[s + 1];
    if (t <= b[0]) {
      let u = (t - a[0]) / (b[0] - a[0]);
      u = u * u * (3 - 2 * u);
      return { i: a[1] + (b[1] - a[1]) * u, w: a[2] + (b[2] - a[2]) * u };
    }
  }
  return { i: K[K.length - 1][1], w: K[K.length - 1][2] };
}
const phaseIndex = t => t < BOUNDS[0] ? 0 : t < BOUNDS[1] ? 1 : t < BOUNDS[2] ? 2 : t < BOUNDS[3] ? 3 : 4;
const sstep = (x, a, b) => THREE.MathUtils.smoothstep(x, a, b);

/* ================================================================
   RENDERER / SCENE
   ================================================================ */
const $ = id => document.getElementById(id);
const canvas = $('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
} catch (err) {
  document.body.innerHTML = '<p style="color:#cbb;font:14px monospace;padding:40px">WebGL is unavailable in this browser.</p>';
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030304);
scene.fog = new THREE.FogExp2(0x030304, 0.042);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
const camBase = new THREE.Vector3(0, 2.35, 7.4);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* lights */
scene.add(new THREE.AmbientLight(0x14161f, 0.55));
const rim = new THREE.DirectionalLight(0x5a6f9a, 1.1);
rim.position.set(5, 8, -4);
scene.add(rim);
const fireLight = new THREE.PointLight(0xff8033, 0, 10, 2);
fireLight.position.set(0, 1.1, 0);
scene.add(fireLight);

/* ================================================================
   HELPERS
   ================================================================ */
function glowTexture(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [o, col] of stops) grad.addColorStop(o, col);
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const softTex = glowTexture([[0,'rgba(255,255,255,1)'],[0.25,'rgba(255,255,255,0.55)'],[0.6,'rgba(255,255,255,0.10)'],[1,'rgba(255,255,255,0)']]);
const bgTex   = glowTexture([[0,'rgba(80,100,160,0.55)'],[0.5,'rgba(50,60,100,0.18)'],[1,'rgba(0,0,0,0)']]);
const pixelRatioMats = [];
const pr = () => { const v = renderer.getPixelRatio(); for (const m of pixelRatioMats) m.uniforms.uPixelRatio.value = v; };

function makePoints(count, spawn, seedFn) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const seed = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    spawn(i, pos);
    seed[i*4] = Math.random(); seed[i*4+1] = Math.random();
    seed[i*4+2] = Math.random(); seed[i*4+3] = Math.random();
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  return geo;
}

/* ================================================================
   SET — floor, backdrop, glass cube, wood
   ================================================================ */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color:0x070709, roughness:0.32, metalness:0.7, envMapIntensity:0.45 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const floorGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshBasicMaterial({ map:softTex, color:0xff6a22, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false })
);
floorGlow.rotation.x = -Math.PI / 2;
floorGlow.position.y = 0.012;
scene.add(floorGlow);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(34, 20),
  new THREE.MeshBasicMaterial({ map:bgTex, transparent:true, opacity:0.6, fog:false, depthWrite:false })
);
backdrop.position.set(0, 5, -10);
scene.add(backdrop);

/* glass cube */
const CUBE = 3.2;
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(CUBE, CUBE, CUBE),
  new THREE.MeshPhysicalMaterial({
    color:0xffffff, metalness:0, roughness:0.06,
    transmission:1, thickness:0.35, ior:1.52,
    attenuationColor:new THREE.Color(0xd8e8e0), attenuationDistance:3.5,
    clearcoat:0.6, clearcoatRoughness:0.2,
    envMapIntensity:1.1, specularIntensity:1,
  })
);
glass.position.y = CUBE / 2 + 0.02;
scene.add(glass);
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(glass.geometry),
  new THREE.LineBasicMaterial({ color:0xaac4ff, transparent:true, opacity:0.16 })
);
edges.position.copy(glass.position);
scene.add(edges);

/* stone disc the wood rests on */
const disc = new THREE.Mesh(
  new THREE.CylinderGeometry(1.35, 1.48, 0.1, 48),
  new THREE.MeshStandardMaterial({ color:0x141317, roughness:0.9, metalness:0.1 })
);
disc.position.y = 0.06;
scene.add(disc);

/* wood — a small teepee of logs */
const logs = [];
{
  const logGeo = new THREE.CylinderGeometry(0.085, 0.1, 1.35, 10);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.3;
    const m = new THREE.MeshStandardMaterial({ color:0x7a5233, roughness:0.85, envMapIntensity:0.25 });
    m.color.offsetHSL(0, 0, (Math.random() - 0.5) * 0.07);
    const log = new THREE.Mesh(logGeo, m);
    const axis = new THREE.Vector3(Math.sin(a), 0, -Math.cos(a));
    log.quaternion.setFromAxisAngle(axis, 0.6);
    log.position.set(Math.cos(a) * 0.45, 0.62, Math.sin(a) * 0.45);
    scene.add(log);
    logs.push({ mesh:log, base:m.color.clone() });
  }
  const stickGeo = new THREE.CylinderGeometry(0.035, 0.035, 1.0, 6);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + 0.8;
    const m = new THREE.MeshStandardMaterial({ color:0x8a5f3a, roughness:0.9 });
    m.color.offsetHSL(0, 0, (Math.random() - 0.5) * 0.08);
    const s = new THREE.Mesh(stickGeo, m);
    s.rotation.z = Math.PI / 2 - 0.12;
    s.rotation.y = a;
    s.position.y = 0.18;
    scene.add(s);
    logs.push({ mesh:s, base:m.color.clone() });
  }
}

/* ================================================================
   PARTICLES — flames, smoke, embers, dust (all GPU-driven)
   ================================================================ */
const V_HEAD = `
  attribute vec4 aSeed;
  uniform float uTime, uPixelRatio;
  uniform vec3 uWind;
`;
const windPush = `p += uWind * life * life;`;

/* ---- flames ---- */
const flameMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:{value:0}, uIntensity:{value:0}, uHeight:{value:1},
    uWind:{value:new THREE.Vector3()}, uPixelRatio:{value:1},
  },
  vertexShader: V_HEAD + `
    uniform float uIntensity, uHeight;
    varying float vLife, vGate;
    void main() {
      float speed = 0.5 + aSeed.y * 0.8;
      float life = fract(aSeed.x + uTime * speed);
      vLife = life;
      vGate = step(aSeed.w, uIntensity * 1.08);
      vec3 p = position;
      p.y += life * uHeight * (0.55 + aSeed.y * 0.9);
      float sw = 0.05 + uHeight * 0.05;
      p.x += (sin(life * 8.0 + aSeed.x * 40.0) + sin(uTime * 3.0 + aSeed.x * 20.0) * 0.5) * sw * life;
      p.z += cos(life * 6.0 + aSeed.y * 37.0) * sw * life;
      ${windPush}
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float sz = (0.30 + aSeed.z * 0.5) * (0.5 + uHeight * 0.55) * (1.0 - life * 0.5);
      gl_PointSize = max(sz * uPixelRatio * (150.0 / -mv.z), 0.0) * step(0.01, vGate);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uIntensity;
    varying float vLife, vGate;
    void main() {
      float a = smoothstep(0.5, 0.08, length(gl_PointCoord - 0.5));
      a *= vGate * smoothstep(0.0, 0.05, vLife) * (1.0 - smoothstep(0.55, 1.0, vLife));
      if (a < 0.004) discard;
      vec3 col = mix(vec3(1.0, 0.92, 0.70), vec3(1.0, 0.55, 0.12), smoothstep(0.05, 0.4, vLife));
      col = mix(col, vec3(0.80, 0.16, 0.03), smoothstep(0.4, 0.85, vLife));
      col *= 2.6 * (0.3 + 0.7 * uIntensity);
      gl_FragColor = vec4(col * a, a);
    }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
});
pixelRatioMats.push(flameMat);
const flames = new THREE.Points(
  makePoints(1500, (i, pos) => {
    const r = Math.pow(Math.random(), 0.5) * 0.5, a = Math.random() * Math.PI * 2;
    pos[i*3] = Math.cos(a) * r; pos[i*3+1] = 0.5 + Math.random() * 0.15; pos[i*3+2] = Math.sin(a) * r;
  }),
  flameMat
);
flames.frustumCulled = false;
scene.add(flames);

/* ---- smoke ---- */
const smokeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:{value:0}, uSmoke:{value:0},
    uWind:{value:new THREE.Vector3()}, uPixelRatio:{value:1},
  },
  vertexShader: V_HEAD + `
    uniform float uSmoke;
    varying float vLife, vGate;
    void main() {
      float speed = 0.10 + aSeed.y * 0.16;
      float life = fract(aSeed.x + uTime * speed);
      vLife = life;
      vGate = step(aSeed.w, uSmoke * 1.25);
      vec3 p = position;
      p.y += life * (1.2 + aSeed.y * 0.8);
      p.x += sin(life * 4.0 + aSeed.x * 31.0) * 0.22 * life;
      p.z += cos(life * 3.0 + aSeed.y * 29.0) * 0.22 * life;
      p += uWind * life * life * 1.4;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float sz = (0.9 + aSeed.z * 1.4) * (0.35 + life * 1.5);
      gl_PointSize = max(sz * uPixelRatio * (150.0 / -mv.z), 0.0) * step(0.01, vGate);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vLife, vGate;
    void main() {
      float a = smoothstep(0.5, 0.12, length(gl_PointCoord - 0.5));
      a *= vGate * smoothstep(0.0, 0.08, vLife) * (1.0 - smoothstep(0.55, 1.0, vLife)) * 0.16;
      if (a < 0.004) discard;
      vec3 col = mix(vec3(0.26, 0.21, 0.17), vec3(0.08, 0.075, 0.07), vLife);
      gl_FragColor = vec4(col, a);
    }`,
  transparent:true, depthWrite:false, blending:THREE.NormalBlending,
});
pixelRatioMats.push(smokeMat);
const smoke = new THREE.Points(
  makePoints(320, (i, pos) => {
    const r = Math.pow(Math.random(), 0.5) * 0.32, a = Math.random() * Math.PI * 2;
    pos[i*3] = Math.cos(a) * r; pos[i*3+1] = 1.0 + Math.random() * 0.2; pos[i*3+2] = Math.sin(a) * r;
  }),
  smokeMat
);
smoke.frustumCulled = false;
scene.add(smoke);

/* ---- embers / sparks ---- */
const emberMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:{value:0}, uEmber:{value:0},
    uWind:{value:new THREE.Vector3()}, uPixelRatio:{value:1},
  },
  vertexShader: V_HEAD + `
    uniform float uEmber;
    varying float vTw, vGate;
    void main() {
      float life = fract(aSeed.x + uTime * (1.0 + aSeed.y * 1.1));
      vGate = step(aSeed.w, uEmber * 1.15);
      vTw = 0.5 + 0.5 * sin(uTime * 28.0 + aSeed.z * 90.0);
      vec3 p = position;
      p.y += life * (1.2 + aSeed.y * 1.2);
      p.x += sin(aSeed.x * 50.0) * 0.05;
      p += uWind * life * life * 2.2;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float sz = 0.05 + aSeed.z * 0.09;
      gl_PointSize = max(sz * uPixelRatio * (150.0 / -mv.z), 0.0) * step(0.01, vGate);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uEmber;
    varying float vTw, vGate;
    void main() {
      float a = vGate * vTw * (1.0 - smoothstep(0.7, 1.0, 1.0)) * smoothstep(0.5, 0.05, length(gl_PointCoord - 0.5));
      if (a < 0.004) discard;
      vec3 col = vec3(1.0, 0.62, 0.22) * 2.4 * (0.4 + 0.6 * uEmber);
      gl_FragColor = vec4(col * a, a);
    }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
});
pixelRatioMats.push(emberMat);
const embers = new THREE.Points(
  makePoints(240, (i, pos) => {
    const r = Math.pow(Math.random(), 0.5) * 0.45, a = Math.random() * Math.PI * 2;
    pos[i*3] = Math.cos(a) * r; pos[i*3+1] = 0.5 + Math.random() * 0.2; pos[i*3+2] = Math.sin(a) * r;
  }),
  emberMat
);
embers.frustumCulled = false;
scene.add(embers);

/* ---- ambient dust motes ---- */
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0}, uPixelRatio:{value:1} },
  vertexShader: V_HEAD + `
    varying float vTw;
    void main() {
      vec3 p = position;
      p.x += sin(uTime * 0.30 + aSeed.x * 20.0) * 0.35;
      p.y += sin(uTime * 0.22 + aSeed.y * 30.0) * 0.25;
      p.z += cos(uTime * 0.26 + aSeed.z * 25.0) * 0.35;
      vTw = 0.5 + 0.5 * sin(uTime * (0.5 + aSeed.x) + aSeed.y * 40.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.02 + aSeed.z * 0.035) * uPixelRatio * (150.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vTw;
    void main() {
      float a = smoothstep(0.5, 0.0, length(gl_PointCoord - 0.5)) * 0.055 * vTw;
      gl_FragColor = vec4(vec3(1.0, 0.82, 0.58) * a, a);
    }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
});
pixelRatioMats.push(dustMat);
const dust = new THREE.Points(
  makePoints(150, (i, pos) => {
    pos[i*3] = (Math.random() - 0.5) * 9;
    pos[i*3+1] = Math.random() * 4.5;
    pos[i*3+2] = (Math.random() - 0.5) * 9;
  }),
  dustMat
);
dust.frustumCulled = false;
scene.add(dust);

/* ---- core glow sprite ---- */
const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map:softTex, color:0xff7a26, transparent:true, opacity:0,
  blending:THREE.AdditiveBlending, depthWrite:false,
}));
coreGlow.position.set(0, 0.85, 0);
coreGlow.scale.set(2.4, 2.4, 1);
scene.add(coreGlow);

/* ---- volumetric-ish light shaft ---- */
const shaftMat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0}, uIntensity:{value:0} },
  vertexShader: `
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main() {
      vUv = uv;
      vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime, uIntensity;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main() {
      float rim = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
      float grad = pow(1.0 - vUv.y, 2.2);
      float fl = 0.8 + 0.2 * sin(uTime * 21.0) * sin(uTime * 13.7 + 1.3);
      float a = rim * grad * uIntensity * 0.30 * fl;
      gl_FragColor = vec4(vec3(1.0, 0.62, 0.30) * a, a);
    }`,
  transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
});
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.28, 2.6, 32, 1, true), shaftMat);
shaft.position.y = 1.85;
scene.add(shaft);

/* ================================================================
   POST — bloom, grade (vignette + grain + chromatic aberration)
   ================================================================ */
const GradeShader = {
  uniforms: { tDiffuse:{value:null}, uTime:{value:0} },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main() {
      vec2 c = vUv - 0.5;
      float r2 = dot(c, c);
      vec2 off = c * r2 * 0.06;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      float vig = 1.0 - smoothstep(0.35, 0.95, length(c) * 1.25) * 0.55;
      col *= vig;
      col += (hash(vUv * vec2(1920.0, 1080.0) + fract(uTime * 13.7) * 91.0) - 0.5) * 0.05;
      col *= vec3(1.03, 1.0, 0.97);
      gl_FragColor = vec4(col, 1.0);
    }`,
};
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.18);
composer.addPass(bloom);
const grade = new ShaderPass(GradeShader);
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ================================================================
   UI — titles, HUD, timeline
   ================================================================ */
const titleEl = $('title'), tagEl = $('phaseTag'), nameEl = $('phaseName'), subEl = $('phaseSub');
const hFlame=$('hFlame'), bFlame=$('bFlame'), hAir=$('hAir'), bAir=$('bAir'), hArrow=$('hArrow');
const hCore=$('hCore'), bCore=$('bCore'), hRender=$('hRender'), hFps=$('hFps'), hTime=$('hTime');
const track=$('track'), fill=$('fill'), knob=$('knob'), hint=$('hint');
const segs = [...document.querySelectorAll('.seg')];
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(Math.round(n));

let curPhase = -1, firstTitle = true, swapTO = 0;
function setTexts() {
  tagEl.textContent = `PHASE 0${curPhase+1} / 05`;
  nameEl.textContent = PHASES[curPhase].name;
  subEl.textContent = PHASES[curPhase].sub;
}
function updateTitle(idx) {
  if (idx === curPhase) return;
  curPhase = idx;
  if (firstTitle) { firstTitle = false; setTexts(); return; }
  titleEl.classList.add('swap');
  clearTimeout(swapTO);
  swapTO = setTimeout(() => { setTexts(); titleEl.classList.remove('swap'); }, 480);
}

let masterTime = 0, paused = false, scrubbing = false, hintGone = false;
function killHint() { if (!hintGone) { hintGone = true; hint.classList.add('gone'); } }
setTimeout(killHint, 16000);
function seek(e) {
  const r = track.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  masterTime = f * LOOP;
}
track.addEventListener('pointerdown', e => { scrubbing = true; track.setPointerCapture(e.pointerId); seek(e); killHint(); });
track.addEventListener('pointermove', e => { if (scrubbing) seek(e); });
track.addEventListener('pointerup',   () => { scrubbing = false; });
track.addEventListener('pointercancel', () => { scrubbing = false; });
addEventListener('keydown', e => {
  if (e.code === 'ArrowRight') { masterTime = (masterTime + 1) % LOOP; killHint(); }
  if (e.code === 'ArrowLeft')  { masterTime = (masterTime - 1 + LOOP) % LOOP; killHint(); }
  if (e.code === 'Space')     { paused = !paused; e.preventDefault(); }
});

let px = 0, py = 0, tx = 0, ty = 0;
addEventListener('pointermove', e => {
  tx = (e.clientX / innerWidth - 0.5) * 2;
  ty = (e.clientY / innerHeight - 0.5) * 2;
});

let fpsEMA = 60, hudTO = 0;
function updateHUD(temp, inten, wind, spd, elapsed) {
  hFlame.textContent = String(Math.round(inten * 100)).padStart(3, '0') + '%';
  bFlame.style.width = Math.min(100, inten * 100) + '%';
  hAir.innerHTML = spd.toFixed(1) + ' m/s<i id="hArrow">➤</i>';
  bAir.style.width = Math.min(100, spd / 9 * 100) + '%';
  document.getElementById('hArrow').style.opacity = wind > 0.04 ? 0.95 : 0.18;
  document.getElementById('hArrow').style.transform = `rotate(${(wind * 22 * Math.sin(elapsed * 1.7)).toFixed(1)}deg)`;
  hCore.textContent = Math.round(temp) + ' K';
  bCore.style.width = Math.min(100, (temp - 293) / 1450 * 100) + '%';
  hRender.textContent = `${renderer.info.render.calls} calls · ${fmt(renderer.info.render.triangles)} tris`;
  hFps.textContent = String(Math.round(fpsEMA));
  hTime.textContent = (paused ? '❚❚ ' : '') + 'T+' + masterTime.toFixed(1) + 's / ' + LOOP + 's';
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
const clock = new THREE.Clock();
let elapsed = 0, faderLifted = false;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  if (!paused && !scrubbing) masterTime = (masterTime + dt) % LOOP;

  /* phase-driven state */
  const t = masterTime;
  const { i: intensity, w: wind } = sampleKeys(t);
  const flick = 0.9 + 0.06 * Math.sin(t * 31.7) * Math.sin(t * 17.3 + 1.7) + 0.05 * Math.sin(t * 53.7);
  const inten = THREE.MathUtils.clamp(intensity * flick, 0, 1.15);
  const ember = sstep(t, 21.2, 23.2) * (1 - sstep(t, 24.8, 25.9));
  const burn = sstep(t, 8, 19);
  const flash = t < 1.6 ? Math.exp(-t * 3.0) : 0;
  const gust = wind * (2.2 * Math.sin(t * 2.6) + 1.1 * Math.sin(t * 6.3 + 2.0));
  const windVec = new THREE.Vector3(wind * (3.5 + gust), 0.15 * wind, wind * 1.2 * Math.sin(t * 0.9 + 1.0));
  const smokeWind = new THREE.Vector3(wind * (2.0 + gust * 0.6), 0, wind * 0.8);

  /* particles */
  flameMat.uniforms.uTime.value = elapsed;
  flameMat.uniforms.uIntensity.value = inten;
  flameMat.uniforms.uHeight.value = 0.4 + inten * 1.9;
  flameMat.uniforms.uWind.value.copy(windVec);
  smokeMat.uniforms.uTime.value = elapsed;
  smokeMat.uniforms.uSmoke.value = 0.13 + inten * 0.3 + ember * 0.95 + wind * 0.15;
  smokeMat.uniforms.uWind.value.copy(smokeWind);
  emberMat.uniforms.uTime.value = elapsed;
  emberMat.uniforms.uEmber.value = 0.12 + inten * 0.55 + wind * 0.35 + (t < 2 ? 0.5 * (1 - t / 2) : 0);
  emberMat.uniforms.uWind.value.copy(windVec);
  dustMat.uniforms.uTime.value = elapsed;

  /* wood charring + glow */
  for (const l of logs) {
    l.mesh.material.color.lerpColors(l.base, CHAR_COL, burn);
    l.mesh.material.emissive.setHex(0xff4400);
    l.mesh.material.emissiveIntensity = inten * 0.32 + ember * 0.85;
  }

  /* light + glow */
  fireLight.intensity = inten * 45 + flash * 90 + ember * 14;
  fireLight.color.lerpColors(FIRE_COOL, FIRE_EMBER, ember);
  fireLight.position.x = windVec.x * 0.06;
  coreGlow.material.opacity = inten * 0.5 + flash * 0.7 + ember * 0.15;
  const gs = 2.2 + inten * 1.2 + Math.sin(elapsed * 23.0) * 0.12 * (0.3 + inten);
  coreGlow.scale.set(gs, gs, 1);
  floorGlow.material.opacity = inten * 0.4 + ember * 0.22 + flash * 0.5;

  /* shaft */
  shaftMat.uniforms.uTime.value = elapsed;
  shaftMat.uniforms.uIntensity.value = inten * 0.9 + flash;
  shaft.rotation.z = -wind * 0.26;
  shaft.position.x = wind * 0.22;

  /* camera — slow drift + parallax + wind shake */
  px += (tx - px) * 0.03; py += (ty - py) * 0.03;
  camera.position.set(
    camBase.x + Math.sin(elapsed * 0.10) * 0.55 + px * 0.5 + wind * 0.10 + Math.sin(elapsed * 23.0) * wind * 0.05,
    camBase.y + Math.sin(elapsed * 0.13) * 0.16 - py * 0.2,
    camBase.z + Math.sin(elapsed * 0.07) * 0.25
  );
  camera.lookAt(0, 1.35, 0);

  /* UI */
  updateTitle(phaseIndex(t));
  const p = t / LOOP * 100;
  fill.style.width = p + '%';
  knob.style.left = p + '%';
  segs.forEach((s, i) => s.classList.toggle('on', i === phaseIndex(t)));

  /* HUD @ ~5 Hz */
  fpsEMA = fpsEMA * 0.95 + (1 / Math.max(dt, 1e-4)) * 0.05;
  hudTO += dt;
  if (hudTO > 0.2) {
    hudTO = 0;
    updateHUD(293 + inten * 1050 + ember * 320, inten, wind, wind * (6.5 + Math.max(0, gust)), elapsed);
  }
  grade.uniforms.uTime.value = elapsed;

  composer.render();

  if (!faderLifted) { faderLifted = true; $('fader').style.opacity = '0'; }
}

const CHAR_COL = new THREE.Color(0x16100b);
const FIRE_COOL = new THREE.Color(0xff8033);
const FIRE_EMBER = new THREE.Color(0xff3300);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  pr();
});
pr();
tick();
</script>
</body>
</html>
