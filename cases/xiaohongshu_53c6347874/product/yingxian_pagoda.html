<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应县木塔 · 佛宫寺释迦塔（1056）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bcd3e2}
  #app{width:100%;height:100%}
  #caption{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    padding:6px 18px;border-radius:16px;background:rgba(25,28,32,.55);
    color:#f3ede2;font:13px/1.7 "Songti SC","STSong","SimSun",serif;
    letter-spacing:2px;white-space:nowrap;pointer-events:none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="caption">应县木塔 · 佛宫寺释迦塔（1056）· 1:200 示意模型</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ==================== 场景 / 相机 / 渲染器 ==================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3e2);                 // 天空底色
scene.fog = new THREE.Fog(0xbcd3e2, 180, 480);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(64, 48, 92);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

/* 轨道控制器：自动缓慢旋转 */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 32, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 25;
controls.maxDistance = 300;
controls.maxPolarAngle = Math.PI/2 - 0.02;

/* ==================== 灯光：太阳平行光 + 环境光 ==================== */
const sun = new THREE.DirectionalLight(0xfff1dc, 1.6);
sun.position.set(90, 140, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-75, right:75, top:100, bottom:-25, near:20, far:380 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xdfe8f2, 0.55));
scene.add(new THREE.HemisphereLight(0xcfe0ee, 0x6b6257, 0.45));

/* ==================== 材质 ==================== */
const M = {
  wood:  new THREE.MeshStandardMaterial({color:0x6e3b28, roughness:.8}),                          // 木柱·深红褐
  woodDS:new THREE.MeshStandardMaterial({color:0x6e3b28, roughness:.8, side:THREE.DoubleSide}),
  woodD: new THREE.MeshStandardMaterial({color:0x4a2a1b, roughness:.85}),                         // 斗栱
  wall:  new THREE.MeshStandardMaterial({color:0xb5906a, roughness:.95}),                         // 土黄墙面
  roof:  new THREE.MeshStandardMaterial({color:0x3d4147, roughness:.9, side:THREE.DoubleSide}),   // 灰瓦
  roofD: new THREE.MeshStandardMaterial({color:0x2b2e33, roughness:.9}),                          // 屋脊
  stone: new THREE.MeshStandardMaterial({color:0x9d9d96, roughness:.95}),                         // 台基石
  mezz:  new THREE.MeshStandardMaterial({color:0x35281e, roughness:.9}),                          // 暗层
  iron:  new THREE.MeshStandardMaterial({color:0x2e2e33, roughness:.5, metalness:.7}),            // 铁刹
  gold:  new THREE.MeshStandardMaterial({color:0xc9a227, roughness:.35, metalness:.8}),           // 宝珠
  door:  new THREE.MeshStandardMaterial({color:0x3a2317, roughness:.9}),
};

/* ==================== 工具函数 ==================== */
const pagoda = new THREE.Group();
scene.add(pagoda);

function addMesh(geo, mat, x=0, y=0, z=0, parent=pagoda){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// 八边形顶点（与 CylinderGeometry 八段的角度约定一致：x=r·sinθ, z=r·cosθ）
function octPoint(r, k){ const a = k*Math.PI/4; return new THREE.Vector3(r*Math.sin(a), 0, r*Math.cos(a)); }

/* 屋檐几何体：八边形锥面 + 凹曲屋面 + 檐角起翘 */
function makeRoofGeometry(rEdge, rTop, rise, lift){
  const geo = new THREE.CylinderGeometry(rTop, rEdge, rise, 64, 6, true);
  const p = geo.attributes.position;
  for (let i=0; i<p.count; i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const t  = (y + rise/2)/rise;                               // 0=檐口 → 1=顶
    const th = Math.atan2(x, z);
    const a  = ((th % (Math.PI/4)) + Math.PI/4) % (Math.PI/4);
    const dn = Math.min(a, Math.PI/4 - a)/(Math.PI/8);          // 0=檐角 → 1=边中
    const ny = -rise/2 + rise*Math.pow(t, 1.25)                 // 凹曲面：檐口缓、近顶陡
             + lift*Math.pow(1-dn, 2.2)*Math.pow(1-t, 2);       // 檐角微微起翘
    p.setY(i, ny);
  }
  geo.computeVertexNormals();
  return geo;
}

/* 一整圈屋檐：屋面 + 八条戗脊 + 檐角风铃 */
function buildRoof(rEdge, rTop, rise, lift, eaveY, ridgeR=0.1){
  const g = new THREE.Group();
  const roof = new THREE.Mesh(makeRoofGeometry(rEdge, rTop, rise, lift), M.roof);
  roof.castShadow = roof.receiveShadow = true;
  g.add(roof);
  for (let k=0; k<8; k++){
    const th = k*Math.PI/4, s = Math.sin(th), c = Math.cos(th);
    const p0 = new THREE.Vector3(rEdge*s, -rise/2 + lift*0.98, rEdge*c);
    const p2 = new THREE.Vector3(rTop*s,    rise/2,            rTop*c);
    const rm = (rEdge + rTop)/2;
    const p1 = new THREE.Vector3(rm*s, -rise/2 + rise*Math.pow(.5,1.25) + lift*.25, rm*c);
    const ridge = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p0,p1,p2), 10, ridgeR, 5), M.roofD);
    ridge.castShadow = true;
    g.add(ridge);
    const bell = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.36, 6), M.gold);   // 檐角风铃
    bell.position.set((rEdge-0.2)*s, -rise/2 + lift - 0.42, (rEdge-0.2)*c);
    bell.rotation.x = Math.PI;
    g.add(bell);
  }
  g.position.y = eaveY + rise/2;
  pagoda.add(g);
}

/* 斗栱簇（一攒：坐斗+横栱+华栱+二跳横栱+顶斗），合并为单一几何体供实例化 */
function bracketGeometry(){
  const parts = [];
  const add = (w,h,d,x,y,z)=>{ const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); parts.push(g); };
  add(.62,.42,.62,  0,.21,0);      // 坐斗
  add(1.7,.30,.42,  0,.57,0);      // 横栱（沿面阔方向）
  add(.42,.30,1.5,  0,.87,.35);    // 华栱（向檐外出跳）
  add(2.1,.28,.40,  0,1.12,.55);   // 二跳横栱
  add(.50,.34,.50,  0,1.35,.70);   // 顶斗
  return BufferGeometryUtils.mergeGeometries(parts);
}

/* 实例化矩阵收集器 */
const colMats=[], brMats=[], pnMats=[], postMats=[];
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
const Y_AXIS = new THREE.Vector3(0,1,0);
function pushMat(arr,x,y,z,ry,sx,sy,sz){
  _p.set(x,y,z); _q.setFromAxisAngle(Y_AXIS,ry); _s.set(sx,sy,sz);
  _m.compose(_p,_q,_s); arr.push(_m.clone());
}

/* ==================== 参数：五明层 + 四暗层，逐层收分 ==================== */
const BASE_TOP = 4.0;                            // 台基顶面标高
const BODY_H = [7.5, 5, 5, 5, 5];                // 各明层层高（首层最高大）
const BODY_R = [12, 10.8, 9.7, 8.75, 7.9];       // 各明层八边形外接圆半径（向上收分）
const OVERH  = [4.5, 4.0, 3.6, 3.2, 2.9];        // 各层出檐深度
const LIFT   = [1.2, 1.1, 1.0, .95];             // 各层檐角起翘量
const BRACKET_H = 1.3, ROOF_H = 2.4, MEZZ_H = 2.0;
const TOP_RISE = 5.0, TOP_LIFT = 1.8;

/* ==================== 方形石台基（两层） ==================== */
addMesh(new THREE.BoxGeometry(64,.3,64), M.stone, 0,.15,0);    // 广场铺地
addMesh(new THREE.BoxGeometry(44,1.4,44), M.stone, 0,1.0,0);   // 下层台基
addMesh(new THREE.BoxGeometry(38,2.3,38), M.stone, 0,2.85,0);  // 上层台基（顶面 y=4.0）

/* ==================== 循环生成 5 个明层 + 4 个暗层 ==================== */
let y = BASE_TOP, apexY = 0, topEaveY = 0;
for (let i=0; i<5; i++){
  const r = BODY_R[i], bodyH = BODY_H[i], y0 = y;

  /* 墙体：略有收分的八棱柱 */
  const wallH = bodyH - .7;
  addMesh(new THREE.CylinderGeometry(r*.90, r*.94, wallH, 8), M.wall, 0, y0+.15+wallH/2, 0);

  /* 檐柱：每面 角柱1 + 间柱2（24根/层） */
  const colR = i===0 ? .42 : .34;
  for (let k=0; k<8; k++){
    const A = octPoint(r*.99, k), B = octPoint(r*.99, k+1);
    pushMat(colMats, A.x, y0+bodyH/2, A.z, 0, colR, bodyH, colR);
    for (const f of [.28,.72])
      pushMat(colMats, THREE.MathUtils.lerp(A.x,B.x,f), y0+bodyH/2,
              THREE.MathUtils.lerp(A.z,B.z,f), 0, colR*.85, bodyH, colR*.85);
  }

  /* 门窗板（每面一块，示意） */
  const apo = r*.92*Math.cos(Math.PI/8)+.08;
  const pw = i===0 ? 2.6 : 1.6, ph = i===0 ? 3.4 : 2.1;
  for (let k=0; k<8; k++){
    const am = (k+.5)*Math.PI/4;
    pushMat(pnMats, apo*Math.sin(am), y0+bodyH*.42, apo*Math.cos(am), am, pw, ph, .14);
  }

  /* 额枋（柱顶环形梁）与斗栱层背板 */
  addMesh(new THREE.CylinderGeometry(r*1.03, r*1.05, .55, 8), M.wood, 0, y0+bodyH-.27, 0);
  addMesh(new THREE.CylinderGeometry(r*.99, r*1.0, BRACKET_H, 8), M.woodD, 0, y0+bodyH+BRACKET_H/2, 0);

  /* 斗栱：沿八边外圈每面 4 攒（转角铺作 + 补间铺作） */
  const s = .95 - i*.07, rb = r*.99 + .35;
  for (let k=0; k<8; k++) for (let j=0; j<4; j++){
    const a = (k + j/4)*Math.PI/4;
    pushMat(brMats, rb*Math.sin(a), y0+bodyH, rb*Math.cos(a), a, s, s, s);
  }

  const eaveY = y0 + bodyH + BRACKET_H;    // 檐口标高
  if (i < 4){
    /* 大屋檐（深远出檐） */
    const rM = BODY_R[i+1] + .6;           // 上方暗层半径
    buildRoof(r + OVERH[i], rM + .3, ROOF_H, LIFT[i], eaveY);

    /* 暗层（平坐）：挑台 + 深色夹层 + 栏杆 */
    const yM = eaveY + ROOF_H;
    addMesh(new THREE.CylinderGeometry(rM+1.15, rM+1.25, .35, 8), M.wood, 0, yM+.17, 0);
    addMesh(new THREE.CylinderGeometry(rM, rM+.15, MEZZ_H-.35, 8), M.mezz, 0, yM+.35+(MEZZ_H-.35)/2, 0);
    const rp = rM + .95;
    for (let k=0; k<8; k++){
      const A = octPoint(rp,k), B = octPoint(rp,k+1);
      for (let j=0; j<4; j++)
        pushMat(postMats, THREE.MathUtils.lerp(A.x,B.x,j/4), yM+.8,
                THREE.MathUtils.lerp(A.z,B.z,j/4), 0, .12, .9, .12);
    }
    addMesh(new THREE.CylinderGeometry(rp,rp,.09,8,1,true), M.woodDS, 0, yM+1.21, 0);  // 栏杆扶手
    addMesh(new THREE.CylinderGeometry(rp,rp,.09,8,1,true), M.woodDS, 0, yM+.85, 0);   // 栏杆中槛
    y = yM + MEZZ_H;
  } else {
    /* 顶层：八角攒尖顶 */
    topEaveY = eaveY;
    apexY = eaveY + TOP_RISE;
    buildRoof(r + OVERH[i], .9, TOP_RISE, TOP_LIFT, eaveY, .14);
  }
}

/* ==================== 首层副阶：外圈廊柱 + 裙檐 ==================== */
const SK_R = 15.5, SK_TOP = BASE_TOP + 4.2;
for (let k=0; k<8; k++){
  const A = octPoint(SK_R, k), B = octPoint(SK_R, k+1);
  pushMat(colMats, A.x, (BASE_TOP+SK_TOP)/2, A.z, 0, .36, SK_TOP-BASE_TOP, .36);
  for (const f of [.25,.5,.75])
    pushMat(colMats, THREE.MathUtils.lerp(A.x,B.x,f), (BASE_TOP+SK_TOP)/2,
            THREE.MathUtils.lerp(A.z,B.z,f), 0, .3, SK_TOP-BASE_TOP, .3);
}
addMesh(new THREE.CylinderGeometry(SK_R+.15, SK_R+.2, .5, 8), M.wood, 0, SK_TOP-.25, 0);
buildRoof(18.6, 10.5, 2.2, 1.3, SK_TOP, .11);    // 副阶裙檐

/* ==================== 铁铸塔刹：刹座、覆钵、刹杆、相轮、宝珠、链条 ==================== */
{
  const yA = apexY;   // ≈60.6
  addMesh(new THREE.CylinderGeometry(1.6, 2.0, .7, 8), M.iron, 0, yA+.35, 0);           // 刹座
  const bowl = addMesh(new THREE.SphereGeometry(1.05, 20, 14), M.iron, 0, yA+1.25, 0);  // 覆钵
  bowl.scale.y = .75;
  addMesh(new THREE.CylinderGeometry(.15, .22, 6.2, 10), M.iron, 0, yA+3.4, 0);         // 刹杆
  for (let i=0; i<6; i++){                                                              // 相轮六重
    const ring = addMesh(new THREE.TorusGeometry(1.35 - i*.13, .07, 8, 24), M.iron, 0, yA+1.9+i*.7, 0);
    ring.rotation.x = Math.PI/2;
  }
  addMesh(new THREE.SphereGeometry(.45, 16, 12), M.gold, 0, yA+5.9, 0);                 // 宝珠
  addMesh(new THREE.ConeGeometry(.24, .6, 10), M.gold, 0, yA+6.4, 0);                   // 刹尖（总高≈67.3m）
  const pts = [];                                                                       // 八条铁链
  const eR = BODY_R[4] + OVERH[4];
  for (let k=0; k<8; k++){
    const a = k*Math.PI/4;
    pts.push(new THREE.Vector3(0, yA+5.7, 0),
             new THREE.Vector3(eR*Math.sin(a), topEaveY + TOP_LIFT*.95, eR*Math.cos(a)));
  }
  pagoda.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x1f1f24})));
}

/* ==================== 实例化：檐柱 / 斗栱 / 门窗 / 栏杆柱 ==================== */
function makeInstanced(geo, mat, mats){
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m,i)=>im.setMatrixAt(i, m));
  im.castShadow = im.receiveShadow = true;
  pagoda.add(im);
}
makeInstanced(new THREE.CylinderGeometry(1,1,1,10), M.wood, colMats);
makeInstanced(bracketGeometry(), M.woodD, brMats);
makeInstanced(new THREE.BoxGeometry(1,1,1), M.door, pnMats);
makeInstanced(new THREE.BoxGeometry(1,1,1), M.wood, postMats);

/* ==================== 地面 ==================== */
const ground = new THREE.Mesh(new THREE.CircleGeometry(200, 48),
  new THREE.MeshStandardMaterial({color:0x7e8a72, roughness:1}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ==================== 主循环 & 窗口自适应 ==================== */
renderer.setAnimationLoop(()=>{
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
