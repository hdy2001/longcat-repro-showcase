<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0503">
<title>敦煌藻井 · 旋转万花筒</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0503;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #0a0503; }

  /* ---- rotating image layers ---- */
  .layer {
    position: absolute; left: 50%; top: 50%;
    width: 142vmax; height: 142vmax; /* pre-JS full-bleed fallback (always >= viewport diagonal) */
    background-size: cover;
    background-position: center;
    transform: translate(-50%, -50%) rotate(10deg);
    will-change: transform, opacity;
  }
  .autospin { animation: zsp 14s linear infinite; }
  @keyframes zsp {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* ---- tunnel rings ---- */
  #rings { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .ring {
    position: absolute; left: 50%; top: 50%;
    width: 95vmin; height: 95vmin;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
  }
  .ring.circle { border-radius: 50%; }

  /* ---- central flash while drilling through ---- */
  #flash {
    position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at center, rgba(216,182,90,.14), rgba(216,182,90,0) 55%);
  }

  /* ---- subtle dark vignette: deepens colors, never whitens ---- */
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(10,5,3,.5) 100%);
  }

  /* ---- caption ---- */
  #caption {
    position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
    z-index: 10; pointer-events: none;
    writing-mode: vertical-rl;
    color: rgba(216,182,110,.48);
    font-size: 13px; letter-spacing: .5em;
  }

  /* ---- dots ---- */
  #dots {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 10;
  }
  .dot {
    width: 9px; height: 9px; padding: 0; border: none; border-radius: 50%;
    background: rgba(240,230,210,.28); cursor: pointer;
    transition: background .4s ease, transform .4s ease, box-shadow .4s ease;
  }
  .dot:hover { background: rgba(240,230,210,.55); }
  .dot.active {
    background: #d8b45a; transform: scale(1.45);
    box-shadow: 0 0 10px rgba(216,180,90,.85), 0 0 22px rgba(216,180,90,.35);
  }
</style>
</head>
<body>
<div id="stage">
  <div class="layer autospin" id="layerA" style="background-image:url(&quot;__FIRST_IMG__&quot;);opacity:1"></div>
  <div class="layer" id="layerB" style="opacity:0"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="rings"></div>
  <div id="caption">敦煌藻井 · 旋顶</div>
  <div id="dots"></div>
</div>

<script>
"use strict";
/* data URIs injected at build time */
const IMAGES = __IMAGES_JSON__;

const COVER = 1.10;          // layer smaller side = 1.10 x viewport diagonal -> rotating rect always covers screen
const HOLD_MS = 9000;        // steady rotation time per image
const TRANS_MS = 1800;       // tunnel transition time
const BASE_SPEED = 33;       // deg/sec, clearly perceptible
const IN_SPIN = 240;         // extra spiral spin of the incoming image
const OUT_SPIN = 140;        // extra whip spin of the outgoing image
const RING_COLORS = ['#d8b45a', '#3a6ea5', '#a62626', '#3f7d5d', '#c9862b']; /* 金 石青 深红 石绿 金 */

const stage    = document.getElementById('stage');
const ringLayer= document.getElementById('rings');
const flash    = document.getElementById('flash');
const dotsWrap = document.getElementById('dots');
const layerEls = [document.getElementById('layerA'), document.getElementById('layerB')];
const dots = [];

let cur = 0;                       // current image index
let angle = 10;                    // global rotation (deg); 10 matches the inline first-paint transform
let mode = 'steady';               // 'steady' | 'trans'
let modeT0 = performance.now();
let steadyLayer = layerEls[0];
let transOut = null, transIn = null, transFrom = 0, transTo = 0;
let pendingTarget = null;
const rings = [];

/* preload everything (data URIs decode near-instantly) */
IMAGES.forEach(im => {
  const img = new Image();
  img.src = im.src;
  im.el = img;
  if (img.decode) img.decode().catch(() => {});
});

function coverSize(im) {
  const d = Math.hypot(window.innerWidth, window.innerHeight) * COVER;
  const m = Math.min(im.w, im.h);
  return { w: im.w * d / m, h: im.h * d / m };
}
function setLayer(el, im) {
  el.style.backgroundImage = 'url(' + im.src + ')';
  const s = coverSize(im);
  el.style.width  = s.w + 'px';
  el.style.height = s.h + 'px';
}
function relayout() {
  if (mode === 'steady') setLayer(steadyLayer, IMAGES[cur]);
  else { setLayer(transIn, IMAGES[transTo]); setLayer(transOut, IMAGES[transFrom]); }
}
window.addEventListener('resize', relayout);

/* ---- dots: one per image, active one highlighted ---- */
IMAGES.forEach((im, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
  d.addEventListener('click', () => goTo(i));
  dotsWrap.appendChild(d);
  dots.push(d);
});
function updateDots() { dots.forEach((d, i) => d.classList.toggle('active', i === cur)); }
updateDots();

/* ---- tunnel rings: layered squares & circles spinning outward ---- */
function spawnRings() {
  const now = performance.now();
  for (let i = 0; i < 5; i++) {
    const el = document.createElement('div');
    el.className = 'ring' + (i % 2 ? ' circle' : ' square');
    const c = RING_COLORS[i % RING_COLORS.length];
    el.style.border = '3px solid ' + c;
    el.style.boxShadow = '0 0 14px ' + c + ', inset 0 0 14px ' + c + '55';
    ringLayer.appendChild(el);
    rings.push({ el: el, t0: now + i * 90, dur: 1500, dir: (i % 2 ? 1 : -1) });
  }
}
function updateRings(now) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    const t = (now - r.t0) / r.dur;
    if (t < 0) continue;
    if (t >= 1) { r.el.remove(); rings.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - t, 3);
    const s = 0.03 + e * 3.4;
    const rot = -30 + r.dir * 150 * e;
    r.el.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg) scale(' + s + ')';
    r.el.style.opacity = (0.9 * (1 - t)).toFixed(3);
  }
}

/* ---- easing ---- */
const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const tf = (a, k) => 'translate(-50%,-50%) rotate(' + a + 'deg) scale(' + k + ')';

/* ---- switching ---- */
function goTo(i) {
  if (i === cur || mode !== 'steady') return;
  if (!IMAGES[i].el.complete) { pendingTarget = i; return; }  // wait for decode (data URIs: instant)
  mode = 'trans';
  transFrom = cur; transTo = i;
  modeT0 = performance.now();
  transOut = steadyLayer;
  transIn  = layerEls[1 - layerEls.indexOf(steadyLayer)];
  setLayer(transIn, IMAGES[i]);
  transIn.style.zIndex = 2;
  transOut.style.zIndex = 1;
  transIn.style.opacity = 0;
  transOut.style.opacity = 1;
  cur = i;
  updateDots();
  spawnRings();
}

/* ---- main loop ---- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  angle = (angle + BASE_SPEED * dt) % 360;

  if (mode === 'steady') {
    if (pendingTarget !== null && IMAGES[pendingTarget].el.complete) {
      const p = pendingTarget; pendingTarget = null; goTo(p);
    } else {
      steadyLayer.style.transform = tf(angle, 1);
      steadyLayer.style.opacity = 1;
      if (now - modeT0 >= HOLD_MS) goTo((cur + 1) % IMAGES.length);
    }
  } else {
    const t = Math.min((now - modeT0) / TRANS_MS, 1);
    const kIn  = Math.max(1 - Math.pow(1 - t, 5), 0.02);      // spiral magnify from center
    const opIn = Math.min(t / 0.45, 1);                       // crossfade in
    const opOut = t < 0.42 ? 1 - t / 0.42 : 0;                // crossfade out
    const sOut = 1 + 0.08 * t * t;                            // old layer drifts back, never below full cover
    const spin = easeInOutCubic(t);

    transIn.style.transform  = tf(angle + IN_SPIN * spin, kIn);
    transIn.style.opacity  = opIn;
    transOut.style.transform = tf(angle + OUT_SPIN * spin, sOut);
    transOut.style.opacity = opOut;
    flash.style.opacity = (0.55 * Math.sin(Math.PI * Math.min(t * 1.15, 1))).toFixed(3);
    updateRings(now);

    if (t >= 1) {
      angle = (angle + IN_SPIN) % 360;                        // keep displayed angle continuous
      mode = 'steady';
      modeT0 = now;
      steadyLayer = transIn;
      steadyLayer.style.opacity = 1;
      steadyLayer.style.transform = tf(angle, 1);
      steadyLayer.style.zIndex = 1;
      transOut.style.opacity = 0;
      flash.style.opacity = 0;
    }
  }
  requestAnimationFrame(frame);
}

/* take over from the CSS fallback spin, then start */
layerEls.forEach(el => { el.style.animation = 'none'; });
setLayer(layerEls[0], IMAGES[0]);
relayout();
requestAnimationFrame(frame);
</script>
</body>
</html>
