<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="敦煌藻井 · 仰视窟顶的流转万花筒">
<title>敦煌藻井 · 窟顶万花筒</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#070303;}
  body{
    font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC",serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:manipulation;}
  .scrim{position:fixed;left:0;width:100%;height:24%;pointer-events:none;z-index:4;
    background:linear-gradient(rgba(7,3,3,.62),rgba(7,3,3,0));}
  #scrimTop{top:0;}
  #scrimBottom{bottom:0;transform:scaleY(-1);}
  .ui{position:fixed;pointer-events:none;user-select:none;z-index:5;color:#d9a94f;text-align:center;}
  #title{top:6.5%;left:0;width:100%;opacity:0;transform:translateY(-10px);
    transition:opacity 2.8s ease,transform 2.8s ease;}
  body.ready #title{opacity:1;transform:translateY(0);}
  #title h1{
    font-size:clamp(30px,4.4vw,58px);font-weight:500;letter-spacing:.5em;text-indent:.5em;
    text-shadow:0 0 26px rgba(217,169,79,.38),0 2px 14px rgba(0,0,0,.75);
  }
  #title .sub{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:18px;
    font-size:clamp(12px,1.25vw,16px);letter-spacing:.42em;text-indent:.42em;opacity:.72;}
  #title .line{width:110px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,169,79,.75));}
  #title .line:last-child{background:linear-gradient(90deg,rgba(217,169,79,.75),transparent);}
  #hint{bottom:4.2%;left:0;width:100%;font-size:12px;letter-spacing:.34em;text-indent:.34em;
    color:#caa15c;opacity:0;transition:opacity 3s ease;}
  body.ready #hint{opacity:.42;}
  body.ready #hint.dim{opacity:.16;transition:opacity 2.5s ease;}
  #seal{
    right:30px;bottom:28px;writing-mode:vertical-rl;
    background:rgba(156,43,46,.92);color:#f6e7c6;font-size:19px;letter-spacing:3px;
    padding:9px 5px;border-radius:4px;border:1px solid rgba(246,231,198,.45);
    box-shadow:0 2px 12px rgba(0,0,0,.55);transform:rotate(-4deg);
    opacity:0;transition:opacity 3s ease .8s;
  }
  body.ready #seal{opacity:.94;}
  #veil{
    position:fixed;inset:0;background:#070303;z-index:20;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 1.4s ease;
  }
  #veil span{font-size:15px;letter-spacing:.7em;text-indent:.7em;color:#caa15c;
    animation:pulse 1.6s ease-in-out infinite;}
  #veil.gone{opacity:0;pointer-events:none;}
  @keyframes pulse{0%,100%{opacity:.35}50%%{opacity:.9}}
  @media (max-width:640px){
    #title .line{width:44px;}
    #seal{right:16px;bottom:16px;font-size:16px;}
    #hint{font-size:10px;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="scrim" id="scrimTop"></div>
<div class="scrim" id="scrimBottom"></div>
<div class="ui" id="title">
  <h1>敦煌藻井</h1>
  <div class="sub"><span class="line"></span><span>仰 观 窟 顶 · 流 转 千 秋</span><span class="line"></span></div>
</div>
<div class="ui" id="hint">轻 移 鼠 标 环 视 窟 顶 ・ 单 击 画 面 更 迭 藻 井</div>
<div class="ui" id="seal">藻井</div>
<div id="veil"><span>藻 井 开 卷</span></div>

<script>
(() => {
'use strict';

/* ---------------- 图片（构建时内联为 data URI） ---------------- */
const SRC = [
  "%%IMG00%%","%%IMG01%%","%%IMG02%%","%%IMG03%%","%%IMG04%%",
  "%%IMG05%%","%%IMG06%%","%%IMG07%%","%%IMG08%%","%%IMG09%%"
];

/* ---------------- 敦煌配色 ---------------- */
const PAL = {
  gold:      '#d9a94f',
  goldPale:  '#f3ddab',
  red:       '#8e2b26',
  redDeep:   '#4a1210',
  blue:      '#274b6d',
  green:     '#2f6b4f'
};

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedScale = REDUCED ? 0.35 : 1;

/* ---------------- 画布 ---------------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1, CX=0, CY=0, R=0, DIAG=0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
  R = Math.min(W,H)/2;
  DIAG = Math.hypot(W,H)/2;
}
window.addEventListener('resize', resize);
resize();

const smoother = b => { b = Math.min(1, Math.max(0, b)); return b*b*b*(b*(b*6-15)+10); };

/* ---------------- 图像加载 + 自动去黑边 ---------------- */
const IMG = new Array(SRC.length).fill(null);
let loadedCount = 0, started = false;

function normalize(im){
  const w = im.naturalWidth, h = im.naturalHeight;
  if (!w || !h) return im;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently:true });
  g.drawImage(im, 0, 0);
  let data;
  try { data = g.getImageData(0,0,w,h).data; }
  catch(e){ return im; }
  let x0=w, y0=h, x1=-1, y1=-1;
  const step = 2;
  for (let y=0; y<h; y+=step){
    const row = y*w*4;
    for (let x=0; x<w; x+=step){
      const i = row + x*4;
      if (data[i] + data[i+1] + data[i+2] > 36){           /* 平均亮度 > 12 视为有效内容 */
        if (x<x0) x0=x; if (x>x1) x1=x;
        if (y<y0) y0=y; if (y>y1) y1=y;
      }
    }
  }
  const mx = Math.round(w*0.02), my = Math.round(h*0.02);
  if (x1 < 0 || (x0<=mx && x1>=w-1-mx && y0<=my && y1>=h-1-my)) return im;  /* 无黑边，原样使用 */
  const cw = x1-x0+1, ch = y1-y0+1;
  const c2 = document.createElement('canvas');
  c2.width = cw; c2.height = ch;
  c2.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
  return c2;
}

function poolIndices(exclude){
  const out = [];
  for (let i=0;i<IMG.length;i++) if (IMG[i] && i!==exclude) out.push(i);
  return out;
}
function pickNext(cur){
  const pool = poolIndices(cur);
  if (!pool.length) return cur;
  return pool[(Math.random()*pool.length)|0];
}

/* ---------------- 万花筒环 ---------------- */
const SWIRL = 0.010;                 /* 整体极缓旋流 rad/s */
const TRANS = 4.5;                  /* 切换交叉淡入时长 s */
const RING_CFG = [
  { rIn:0.078, rOut:0.345, segs:16, speed: 0.052, par:0.30, dark:0.18 },
  { rIn:0.345, rOut:0.625, segs:12, speed:-0.070, par:0.55, dark:0.14 },
  { rIn:0.625, rOut:0.885, segs:24, speed: 0.036, par:0.80, dark:0.16 },
  { rIn:0.885, rOut:1.340, segs: 8, speed:-0.026, par:1.05, dark:0.50 }
];
const rings = RING_CFG.map((c,i) => Object.assign({}, c, {
  rInPx:0, rOutPx:0,
  angle: Math.random()*Math.PI*2,
  phase: Math.random()*Math.PI*2,
  cur:null, nxt:null, blend:1,
  nextAt: 10 + i*4 + Math.random()*6,
  forced:-1
}));

function ensureAssignments(){
  for (const rg of rings){
    if (rg.cur === null && rg.nxt === null){
      const pool = poolIndices(-1);
      if (pool.length){ rg.nxt = pool[(Math.random()*pool.length)|0]; rg.blend = 0; }
    }
  }
}

function loadAll(){
  SRC.forEach((src,i) => {
    const im = new Image();
    im.onload = () => {
      const n = normalize(im);
      IMG[i] = { el:n, w:(n.width||n.naturalWidth), h:(n.height||n.naturalHeight) };
      loadedCount++;
      ensureAssignments();
      if (!started && loadedCount >= 3){
        started = true;
        document.body.classList.add('ready');
        const veil = document.getElementById('veil');
        veil.classList.add('gone');
        setTimeout(() => veil.remove(), 1800);
        setTimeout(() => document.getElementById('hint').classList.add('dim'), 16000);
        requestAnimationFrame(frame);
      }
    };
    im.onerror = () => {
      loadedCount++;
      if (!started && loadedCount >= 3 && !started){
        started = true;
        document.body.classList.add('ready');
        const veil = document.getElementById('veil');
        veil.classList.add('gone');
        setTimeout(() => veil.remove(), 1800);
        requestAnimationFrame(frame);
      }
    };
    im.src = src;
  });
}

/* ---------------- 交互：鼠标环视 / 点击更迭 ---------------- */
let mx=0, my=0, smx=0, smy=0, pulse=0;
window.addEventListener('mousemove', e => {
  mx = (e.clientX / W) * 2 - 1;
  my = (e.clientY / H) * 2 - 1;
});
window.addEventListener('click', () => {
  const t = tGlobal;
  rings.forEach((rg,i) => { rg.forced = t + i*0.4; });
  pulse = 1;
});

/* ---------------- 金尘微粒 ---------------- */
const dust = [];
let dustSprite = null;
function initDust(){
  dust.length = 0;
  const n = Math.round(Math.min(90, Math.max(40, W*H/22000)));
  for (let i=0;i<n;i++){
    dust.push({
      x:(Math.random()-0.5)*2*DIAG*0.9,
      y:(Math.random()-0.5)*2*DIAG*0.9,
      vx:(Math.random()-0.5)*0.010,
      vy:-(Math.random()*0.010+0.003),
      sz:Math.random()*0.9+0.4,
      ph:Math.random()*Math.PI*2,
      tw:Math.random()*1.2+0.4,
      depth:Math.random()*0.8+0.2,
      rr:Math.random()
    });
  }
}
function makeSprite(){
  const s=64, c=document.createElement('canvas');
  c.width=c.height=s;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,236,190,1)');
  gr.addColorStop(0.35,'rgba(240,210,140,0.55)');
  gr.addColorStop(1,'rgba(240,210,140,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
  return c;
}
function drawDust(t, dt){
  if (!dustSprite) dustSprite = makeSprite();
  if (!dust.length) initDust();
  const lim = DIAG*1.05, lim2 = lim*lim;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of dust){
    p.x += p.vx*dt*DIAG;
    p.y += p.vy*dt*DIAG;
    if (p.x*p.x + p.y*p.y > lim2){ p.x*=-0.85; p.y*=-0.85; }
    const a = (0.10 + 0.5*(0.5+0.5*Math.sin(t*p.tw + p.ph))) * p.depth * (1 - p.rr*0.45);
    if (a <= 0.01) continue;
    const s = p.sz * (R*0.006 + 2.4) * (1 - p.rr*0.3);
    ctx.globalAlpha = a;
    ctx.drawImage(dustSprite, CX+p.x-s/2, CY+p.y-s/2, s, s);
  }
  ctx.restore();
}

/* ---------------- 绘制：单环万花筒 ---------------- */
function drawRing(rg, t){
  if (rg.cur === null && !(rg.blend > 0 && rg.nxt !== null)) return;
  const seg = (Math.PI*2) / rg.segs;
  const ov  = seg * 1.0015;                       /* 微小重叠，消除拼缝 */
  const ox = smx * W * 0.018 * rg.par + Math.sin(t*0.10 + rg.phase)       * 12 * rg.par;
  const oy = smy * H * 0.018 * rg.par + Math.cos(t*0.083 + rg.phase*1.31)  * 12 * rg.par;
  const passes = [];
  if (rg.cur !== null) passes.push({ idx:rg.cur, a:1-rg.blend });
  if (rg.blend > 0 && rg.nxt !== null) passes.push({ idx:rg.nxt, a:rg.blend });
  for (const p of passes){
    if (p.a <= 0.004) continue;
    const im = IMG[p.idx];
    ctx.save();
    ctx.globalAlpha = smoother(p.a);
    ctx.translate(CX, CY);
    ctx.rotate(rg.angle + SWIRL*t*speedScale);
    for (let i=0;i<rg.segs;i++){
      ctx.save();
      if (i & 1){ ctx.rotate((i+1)*seg); ctx.scale(1,-1); }   /* 镜像楔形，保证边界连续 */
      else      { ctx.rotate(i*seg); }
      ctx.beginPath();
      ctx.arc(0, 0, rg.rOutPx, 0, ov);
      ctx.arc(0, 0, rg.rInPx, ov, 0, true);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(im.el, -im.w/2 - ox, -im.h/2 - oy);
      ctx.restore();
    }
    ctx.restore();
  }
  /* 环带压暗，增强纵深 */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.beginPath();
  ctx.arc(0, 0, rg.rOutPx, 0, Math.PI*2);
  ctx.arc(0, 0, rg.rInPx, 0, Math.PI*2);
  ctx.clip('evenodd');
  ctx.fillStyle = 'rgba(12,5,4,' + rg.dark + ')';
  ctx.fillRect(-rg.rOutPx, -rg.rOutPx, rg.rOutPx*2, rg.rOutPx*2);
  ctx.restore();
}

/* ---------------- 绘制：中心莲台 ---------------- */
function drawMedallion(t, k){
  const rm = 0.082 * R * k;
  ctx.save();
  ctx.translate(CX, CY);
  let g = ctx.createRadialGradient(0,0,0, 0,0, rm*1.8);
  g.addColorStop(0,   'rgba(217,169,79,0.30)');
  g.addColorStop(0.55,'rgba(142,43,38,0.20)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,rm*1.8,0,Math.PI*2); ctx.fill();

  g = ctx.createRadialGradient(0,0,rm*0.1, 0,0,rm);
  g.addColorStop(0,  '#3d0f0d');
  g.addColorStop(0.7,'#571512');
  g.addColorStop(1,  '#2a0a08');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,rm,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.rotate(-t*0.05*speedScale);
  for (let i=0;i<8;i++){
    ctx.save();
    ctx.rotate(i*Math.PI/4);
    const pg = ctx.createLinearGradient(0,0, 0,-rm*0.72);
    pg.addColorStop(0,  'rgba(217,169,79,0.9)');
    pg.addColorStop(1,  'rgba(217,169,79,0.04)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.ellipse(0, -rm*0.42, rm*0.13, rm*0.34, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(217,169,79,0.9)';
  ctx.lineWidth = Math.max(1, R*0.0022);
  ctx.beginPath(); ctx.arc(0,0,rm*0.985,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(217,169,79,0.35)';
  ctx.beginPath(); ctx.arc(0,0,rm*0.60,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle = PAL.goldPale;
  ctx.beginPath(); ctx.arc(0,0,Math.max(1.5,rm*0.09),0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------------- 绘制：窟顶边框 ---------------- */
function drawFrame(t){
  ctx.save();
  ctx.translate(CX, CY);
  const ring = (rad,lw,style) => {
    ctx.strokeStyle = style; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.stroke();
  };
  ring(0.905*R, Math.max(1.2,R*0.0032), 'rgba(217,169,79,0.55)');
  ring(0.935*R, Math.max(1,  R*0.0022), 'rgba(217,169,79,0.40)');

  /* 刻度 */
  ctx.save();
  ctx.rotate(t*0.006*speedScale);
  for (let i=0;i<48;i++){
    ctx.save();
    ctx.rotate(i*Math.PI/24);
    const major = (i % 4 === 0);
    ctx.strokeStyle = major ? 'rgba(243,221,171,0.5)' : 'rgba(217,169,79,0.26)';
    ctx.lineWidth = major ? 1.6 : 1;
    ctx.beginPath();
    ctx.moveTo(0.952*R, 0);
    ctx.lineTo((major ? 0.978 : 0.966)*R, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  /* 八枚金钉 */
  ctx.save();
  ctx.rotate(t*0.006*speedScale + Math.PI/8);
  for (let i=0;i<8;i++){
    ctx.save();
    ctx.rotate(i*Math.PI/4);
    const s = Math.max(2, R*0.006), rr = 1.0*R;
    ctx.fillStyle = 'rgba(217,169,79,0.5)';
    ctx.beginPath();
    ctx.moveTo(rr,-s); ctx.lineTo(rr+s,0); ctx.lineTo(rr,s); ctx.lineTo(rr-s,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  /* 远处藻井方井虚线，暗示窟顶结构 */
  ctx.save();
  ctx.rotate(t*0.004*speedScale);
  ctx.strokeStyle = 'rgba(217,169,79,0.14)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([10,14]);
  const q = 1.24*R;
  ctx.strokeRect(-q,-q,2*q,2*q);
  ctx.restore();
  ctx.restore();
}

/* ---------------- 绘制：氛围罩染 ---------------- */
function drawVignette(){
  const g = ctx.createRadialGradient(CX,CY, R*0.42, CX,CY, DIAG*1.02);
  g.addColorStop(0,    'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(16,7,5,0.28)');
  g.addColorStop(0.85, 'rgba(9,4,3,0.66)');
  g.addColorStop(1,    'rgba(4,2,2,0.94)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(142,43,38,0.045)';      /* 深红罩染，统一色调 */
  ctx.fillRect(0,0,W,H);
}

/* ---------------- 主循环 ---------------- */
let tGlobal = 0, last = performance.now();

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000;
  last = now;
  if (dt > 0.06) dt = 0.06;
  if (dt < 0) dt = 0;
  tGlobal += dt;
  const t = tGlobal;

  smx += (mx - smx) * Math.min(1, dt*2.2);
  smy += (my - smy) * Math.min(1, dt*2.2);
  pulse = Math.max(0, pulse - dt*0.9);

  for (const rg of rings){
    rg.angle += rg.speed * speedScale * dt;
    if (rg.blend < 1){
      rg.blend = Math.min(1, rg.blend + dt/TRANS);
      if (rg.blend >= 1){ rg.cur = rg.nxt; rg.nxt = null; rg.nextAt = t + 12 + Math.random()*10; }
    } else if (rg.cur !== null && (t >= rg.nextAt || (rg.forced > 0 && t >= rg.forced))){
      rg.nxt = pickNext(rg.cur);
      if (rg.nxt !== rg.cur){ rg.blend = 0; rg.forced = -1; }
      else rg.forced = -1;
    }
    rg.rInPx  = rg.rIn  * R;
    rg.rOutPx = rg.rOut * R;
  }

  /* 洞窟底色 */
  const bg = ctx.createRadialGradient(CX,CY,0, CX,CY,DIAG);
  bg.addColorStop(0,   '#160a08');
  bg.addColorStop(0.55,'#100706');
  bg.addColorStop(1,   '#070303');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  const k = (1 + 0.008*Math.sin(t*0.45)) * (1 + 0.02*pulse);
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(k, k);
  ctx.translate(-CX, -CY);

  for (const rg of rings) drawRing(rg, t);
  drawMedallion(t, k);
  drawFrame(t);
  drawDust(t, dt);
  ctx.restore();

  drawVignette();
}

loadAll();
})();
</script>
</body>
</html>
