<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庆余年2 · 大婚凤冠 — 3D 打印模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(ellipse at 50% 42%, #1b1b24 0%, #0c0c12 55%, #050508 100%);
    color: #e8dcc4;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel {
    position: fixed; z-index: 10;
    background: rgba(12, 12, 18, 0.55);
    border: 1px solid rgba(216, 164, 74, 0.25);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #title { top: 22px; left: 24px; padding: 14px 20px; }
  #title h1 {
    font-size: 20px; font-weight: 600; letter-spacing: 2px;
    color: #f0d9a8;
  }
  #title h1 span { color: #d8a44a; }
  #title p { margin-top: 5px; font-size: 12px; color: #9a8f78; letter-spacing: 1px; }

  #views {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    max-width: 92vw;
  }
  #views button {
    font-family: inherit; font-size: 13px; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    color: #d8c9a8; background: rgba(216, 164, 74, 0.08);
    border: 1px solid rgba(216, 164, 74, 0.22);
    transition: all .18s ease;
  }
  #views button:hover { background: rgba(216, 164, 74, 0.22); color: #ffe9bd; }
  #views button.active {
    background: rgba(216, 164, 74, 0.35); color: #ffe9bd;
    border-color: rgba(240, 200, 120, 0.6);
  }

  #meta { bottom: 24px; right: 24px; padding: 12px 16px; text-align: right; }
  #meta .size { font-size: 12px; color: #b3a586; line-height: 1.7; }
  #meta a {
    display: inline-block; margin-top: 7px; font-size: 12px; letter-spacing: 1px;
    color: #ffd98f; text-decoration: none;
    border: 1px solid rgba(216, 164, 74, 0.4); border-radius: 7px;
    padding: 5px 12px; transition: all .18s ease;
  }
  #meta a:hover { background: rgba(216, 164, 74, 0.25); }

  #hint {
    top: 22px; right: 24px; padding: 10px 16px;
    font-size: 12px; color: #9a8f78; letter-spacing: 1px;
  }

  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 42%, #1b1b24 0%, #0c0c12 55%, #050508 100%);
    transition: opacity .6s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid rgba(216, 164, 74, 0.15);
    border-top-color: #d8a44a;
    animation: spin 0.9s linear infinite;
  }
  #loader p { margin-top: 16px; font-size: 13px; color: #b3a586; letter-spacing: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    #title h1 { font-size: 16px; }
    #hint { display: none; }
    #meta { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loader"><div class="ring"></div><p>正在加载凤冠模型…</p></div>

<div class="panel" id="title">
  <h1>庆余年2 · <span>大婚凤冠</span></h1>
  <p>琥珀金半透明光敏树脂 · 龙凤镂空 · 珠串流苏 · 201 × 179 × 184 mm</p>
</div>

<div class="panel" id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<div class="panel" id="views">
  <button data-view="front" class="active">正面</button>
  <button data-view="threequarter">3/4 视角</button>
  <button data-view="side">侧面</button>
  <button data-view="back">背面</button>
  <button data-view="top">俯视</button>
  <button data-view="dragon">龙首特写</button>
  <button data-view="tassel">流苏特写</button>
</div>

<div class="panel" id="meta">
  <div class="size">STL · 56,764 面 · 385 个水密壳体<br>单位 mm · 可直接导入切片软件</div>
  <a href="../phoenix_crown.stl" download>下载 STL 模型</a>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

// ------------------------------------------------------------- renderer --
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 4000);
camera.position.set(0, -10, 330);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -30, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 60;
controls.maxDistance = 900;

// pause auto-rotate while the user interacts, resume after idle
let idleTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(idleTimer);
});
controls.addEventListener('end', () => {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { controls.autoRotate = true; }, 4000);
});

// -------------------------------------------------------------- lighting --
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffe8c0, 3.0);
key.position.set(180, 230, 170);
scene.add(key);

const rim = new THREE.DirectionalLight(0x7fa8ff, 1.7);
rim.position.set(-210, 90, -190);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffc890, 0.7);
fill.position.set(-130, -70, 210);
scene.add(fill);

// dark glossy floor to catch reflections
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(420, 64),
  new THREE.MeshStandardMaterial({ color: 0x101016, roughness: 0.32, metalness: 0.65 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -127;
scene.add(floor);

// ---------------------------------------------------------------- material --
// 半透明琥珀金光敏树脂
const resin = new THREE.MeshPhysicalMaterial({
  color: 0xd8912f,
  metalness: 0.0,
  roughness: 0.22,
  transmission: 0.72,
  thickness: 12,
  ior: 1.46,
  attenuationColor: new THREE.Color(0xb06a1a),
  attenuationDistance: 55,
  clearcoat: 0.5,
  clearcoatRoughness: 0.32,
  envMapIntensity: 1.25,
  specularIntensity: 1.0
});

// ------------------------------------------------------------------- model --
const loader = new STLLoader();
loader.load('../phoenix_crown.stl', (geometry) => {
  geometry = BufferGeometryUtils.mergeVertices(geometry, 1e-4);
  geometry.computeVertexNormals();
  const crown = new THREE.Mesh(geometry, resin);
  scene.add(crown);
  document.getElementById('loader').classList.add('done');
});

// ------------------------------------------------------------ view presets --
const VIEWS = {
  front:        { pos: [0, -10, 330],   tgt: [0, -30, 0] },
  threequarter: { pos: [215, 45, 250],  tgt: [0, -30, 0] },
  side:         { pos: [330, -10, 0],   tgt: [0, -30, 0] },
  back:         { pos: [0, 5, -330],    tgt: [0, -30, 0] },
  top:          { pos: [0, 330, 70],    tgt: [0, -30, 0] },
  dragon:       { pos: [165, 70, 140],  tgt: [67, 16, 47] },
  tassel:       { pos: [195, -55, 100], tgt: [85, -55, 5] }
};

function setView(name) {
  const v = VIEWS[name];
  if (!v) return;
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  camera.position.set(...v.pos);
  controls.target.set(...v.tgt);
  controls.update();
  document.querySelectorAll('#views button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === name));
}
window.setView = setView;

document.querySelectorAll('#views button').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));

// ------------------------------------------------------------------ loop --
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
